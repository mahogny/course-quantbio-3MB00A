<svg xmlns="http://www.w3.org/2000/svg" width="531" height="375.3" viewBox="64.3 1.9 531 375.3" font-family="Helvetica, Arial, sans-serif">

  <!-- header caption -->
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">every sample held out exactly once</text>

  <!-- column guide: k = 5 folds -->
  <text x="320" y="52" text-anchor="middle" font-size="13" fill="#2a6f97">k = 5 folds  (each row = one training run)</text>

  <!-- Row 1: held-out block 1 -->
  <text x="108" y="90" text-anchor="end" font-size="13" fill="#1b2a3a">run 1</text>
  <rect x="120" y="70" width="80" height="30" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="200" y="70" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="280" y="70" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="360" y="70" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="440" y="70" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="535" y="90" font-size="13" fill="#1b2a3a">error<tspan font-size="10" dy="3">1</tspan></text>

  <!-- Row 2: held-out block 2 -->
  <text x="108" y="128" text-anchor="end" font-size="13" fill="#1b2a3a">run 2</text>
  <rect x="120" y="108" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="200" y="108" width="80" height="30" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="280" y="108" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="360" y="108" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="440" y="108" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="535" y="128" font-size="13" fill="#1b2a3a">error<tspan font-size="10" dy="3">2</tspan></text>

  <!-- Row 3: held-out block 3 -->
  <text x="108" y="166" text-anchor="end" font-size="13" fill="#1b2a3a">run 3</text>
  <rect x="120" y="146" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="200" y="146" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="280" y="146" width="80" height="30" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="360" y="146" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="440" y="146" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="535" y="166" font-size="13" fill="#1b2a3a">error<tspan font-size="10" dy="3">3</tspan></text>

  <!-- Row 4: held-out block 4 -->
  <text x="108" y="204" text-anchor="end" font-size="13" fill="#1b2a3a">run 4</text>
  <rect x="120" y="184" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="200" y="184" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="280" y="184" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="360" y="184" width="80" height="30" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="440" y="184" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="535" y="204" font-size="13" fill="#1b2a3a">error<tspan font-size="10" dy="3">4</tspan></text>

  <!-- Row 5: held-out block 5 -->
  <text x="108" y="242" text-anchor="end" font-size="13" fill="#1b2a3a">run 5</text>
  <rect x="120" y="222" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="200" y="222" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="280" y="222" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="360" y="222" width="80" height="30" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="440" y="222" width="80" height="30" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="535" y="242" font-size="13" fill="#1b2a3a">error<tspan font-size="10" dy="3">5</tspan></text>

  <!-- legend -->
  <rect x="120" y="264" width="16" height="14" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="142" y="276" font-size="12.5" fill="#1b2a3a">validation (16 patients)</text>
  <rect x="300" y="264" width="16" height="14" fill="#c9d3dd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="322" y="276" font-size="12.5" fill="#1b2a3a">training (64 patients)</text>

  <!-- equation box -->
  <rect x="120" y="296" width="400" height="38" rx="5" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="200" y="320" text-anchor="start" font-size="15" fill="#1b2a3a">CV error = (1/5) · ∑ (error<tspan font-size="11" dy="3">1</tspan><tspan font-size="15" dy="-3"> … error</tspan><tspan font-size="11" dy="3">5</tspan><tspan font-size="15" dy="-3">)</tspan></text>

  <!-- annotation with patient numbers -->
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#6a994e">80 patients → 5 folds of 16;  each model trains on 64, tests on 16</text>

</svg>
