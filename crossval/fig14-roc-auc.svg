<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.3 -6.2 640.3 427.2" font-family="Helvetica, Arial, sans-serif" width="640.3" height="427.2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">AUC measures ranking, not a single threshold</text>

  <!-- Plot geometry: FPR x from 110 to 470, TPR y from 330 (0) to 70 (1) -->
  <!-- px_x = 110 + fpr*360 ; px_y = 330 - tpr*260 -->

  <!-- Grid lines -->
  <line x1="200" y1="70" x2="200" y2="330" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="290" y1="70" x2="290" y2="330" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="380" y1="70" x2="380" y2="330" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="110" y1="265" x2="470" y2="265" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="110" y1="200" x2="470" y2="200" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="110" y1="135" x2="470" y2="135" stroke="#c9d3dd" stroke-width="1"/>

  <!-- Shaded area under good ROC curve -->
  <path d="M110,330 C135,150 240,72 470,70 L470,330 Z" fill="#eaf1f7"/>

  <!-- Axes -->
  <line x1="110" y1="70" x2="110" y2="330" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="110" y1="330" x2="470" y2="330" stroke="#1b2a3a" stroke-width="2"/>

  <!-- X ticks and labels -->
  <text x="110" y="350" text-anchor="middle" font-size="13" fill="#1b2a3a">0</text>
  <text x="290" y="350" text-anchor="middle" font-size="13" fill="#1b2a3a">0.5</text>
  <text x="470" y="350" text-anchor="middle" font-size="13" fill="#1b2a3a">1.0</text>
  <text x="290" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">False Positive Rate</text>

  <!-- Y ticks and labels -->
  <text x="100" y="335" text-anchor="end" font-size="13" fill="#1b2a3a">0</text>
  <text x="100" y="205" text-anchor="end" font-size="13" fill="#1b2a3a">0.5</text>
  <text x="100" y="75" text-anchor="end" font-size="13" fill="#1b2a3a">1.0</text>
  <text x="40" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a" transform="rotate(-90 40 200)">True Positive Rate</text>

  <!-- Chance diagonal -->
  <line x1="110" y1="330" x2="470" y2="70" stroke="#1b2a3a" stroke-width="1.8" stroke-dasharray="7 5"/>

  <!-- Weaker ROC curve, closer to diagonal -->
  <path d="M110,330 C170,255 320,118 470,70" fill="none" stroke="#bc4749" stroke-width="2.2"/>

  <!-- Good ROC curve, bowing to top-left -->
  <path d="M110,330 C135,150 240,72 470,70" fill="none" stroke="#2a6f97" stroke-width="2.6"/>

  <!-- AUC = area label inside shaded region -->
  <text x="270" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">AUC = area under the curve</text>

  <!-- Curve labels -->
  <text x="330" y="102" font-size="13.5" font-weight="bold" fill="#2a6f97">good classifier, AUC ~ 0.90</text>
  <text x="360" y="170" font-size="13" fill="#bc4749">weaker, AUC ~ 0.70</text>

  <!-- Chance label with leader -->
  <text x="196" y="304" font-size="13" fill="#1b2a3a">chance, AUC = 0.5</text>

  <!-- Right-side / bottom annotation -->
  <text x="490" y="120" font-size="13.5" font-weight="bold" fill="#6a994e">AUC = P( score of a</text>
  <text x="490" y="140" font-size="13.5" font-weight="bold" fill="#6a994e">sick patient &gt; score of</text>
  <text x="490" y="160" font-size="13.5" font-weight="bold" fill="#6a994e">a healthy one )</text>

  <text x="490" y="196" font-size="12.5" fill="#1b2a3a">• ranking measure</text>
  <text x="490" y="216" font-size="12.5" fill="#1b2a3a">• threshold-free</text>
  <text x="490" y="236" font-size="12.5" fill="#1b2a3a">• robust to class</text>
  <text x="502" y="253" font-size="12.5" fill="#1b2a3a">imbalance</text>

  <!-- Arrow pointing from annotation toward good curve -->
  <line x1="486" y1="110" x2="418" y2="82" stroke="#6a994e" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Corner note -->
  <text x="340" y="400" text-anchor="middle" font-size="12" font-style="italic" fill="#1b2a3a">perfect classifier hugs the top-left corner (0,1); AUC = 1.0</text>
</svg>
