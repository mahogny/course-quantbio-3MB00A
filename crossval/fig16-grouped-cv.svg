<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="Helvetica, Arial, sans-serif">

  <!-- Title -->
  <text x="440" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Keep grouped samples (cells, replicates, batches) together in one fold</text>

  <!-- Legend -->
  <text x="300" y="50" text-anchor="end" font-size="13" fill="#1b2a3a">Patients:</text>
  <circle cx="322" cy="46" r="8" fill="#2a6f97"/>
  <text x="335" y="50" font-size="13" fill="#1b2a3a">A</text>
  <circle cx="378" cy="46" r="8" fill="#e07b39"/>
  <text x="391" y="50" font-size="13" fill="#1b2a3a">B</text>
  <circle cx="434" cy="46" r="8" fill="#6a994e"/>
  <text x="447" y="50" font-size="13" fill="#1b2a3a">C</text>
  <text x="470" y="50" font-size="13" fill="#1b2a3a">(each = one cell)</text>

  <!-- Divider -->
  <line x1="445" y1="66" x2="445" y2="372" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ===================== LEFT PANEL: WRONG ===================== -->
  <circle cx="72" cy="80" r="14" fill="#bc4749"/>
  <line x1="66" y1="74" x2="78" y2="86" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="78" y1="74" x2="66" y2="86" stroke="#ffffff" stroke-width="2.5"/>
  <text x="95" y="85" font-size="15" font-weight="bold" fill="#bc4749">Random split &#8212; WRONG</text>

  <!-- Fold boxes (mixed colours) -->
  <!-- Fold 1 -->
  <text x="26" y="120" font-size="12" fill="#1b2a3a">Fold 1</text>
  <rect x="80" y="98" width="345" height="42" rx="6" fill="#fbeeee" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="130" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="175" cy="119" r="11" fill="#e07b39"/>
  <circle cx="220" cy="119" r="11" fill="#6a994e"/>
  <circle cx="265" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="310" cy="119" r="11" fill="#e07b39"/>
  <circle cx="355" cy="119" r="11" fill="#6a994e"/>
  <!-- Fold 2 -->
  <text x="26" y="172" font-size="12" fill="#1b2a3a">Fold 2</text>
  <rect x="80" y="150" width="345" height="42" rx="6" fill="#fbeeee" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="130" cy="171" r="11" fill="#e07b39"/>
  <circle cx="175" cy="171" r="11" fill="#6a994e"/>
  <circle cx="220" cy="171" r="11" fill="#2a6f97"/>
  <circle cx="265" cy="171" r="11" fill="#e07b39"/>
  <circle cx="310" cy="171" r="11" fill="#6a994e"/>
  <circle cx="355" cy="171" r="11" fill="#2a6f97"/>
  <!-- Fold 3 -->
  <text x="26" y="224" font-size="12" fill="#1b2a3a">Fold 3</text>
  <rect x="80" y="202" width="345" height="42" rx="6" fill="#fbeeee" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="130" cy="223" r="11" fill="#6a994e"/>
  <circle cx="175" cy="223" r="11" fill="#2a6f97"/>
  <circle cx="220" cy="223" r="11" fill="#e07b39"/>
  <circle cx="265" cy="223" r="11" fill="#6a994e"/>
  <circle cx="310" cy="223" r="11" fill="#2a6f97"/>
  <circle cx="355" cy="223" r="11" fill="#e07b39"/>

  <!-- Left caption -->
  <text x="30" y="286" font-size="13.5" fill="#1b2a3a">Same patient's cells land in <tspan font-weight="bold">train AND test</tspan>.</text>
  <text x="30" y="308" font-size="13.5" fill="#bc4749" font-weight="bold">&#8594; patient identity leaks across folds</text>
  <text x="30" y="330" font-size="13.5" fill="#1b2a3a">&#8594; inflated, over-optimistic performance.</text>

  <!-- ===================== RIGHT PANEL: GROUPED CV ===================== -->
  <circle cx="490" cy="80" r="14" fill="#6a994e"/>
  <path d="M 484 80 L 488 85 L 497 74" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="513" y="85" font-size="15" font-weight="bold" fill="#6a994e">Grouped CV &#8212; correct</text>

  <!-- Fold boxes (one colour each) -->
  <!-- Fold 1 = Patient A -->
  <text x="468" y="120" font-size="12" fill="#1b2a3a">Fold 1</text>
  <rect x="522" y="98" width="345" height="42" rx="6" fill="#eef4e9" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="572" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="617" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="662" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="707" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="752" cy="119" r="11" fill="#2a6f97"/>
  <circle cx="797" cy="119" r="11" fill="#2a6f97"/>
  <text x="848" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a6f97">A</text>
  <!-- Fold 2 = Patient B -->
  <text x="468" y="172" font-size="12" fill="#1b2a3a">Fold 2</text>
  <rect x="522" y="150" width="345" height="42" rx="6" fill="#eef4e9" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="572" cy="171" r="11" fill="#e07b39"/>
  <circle cx="617" cy="171" r="11" fill="#e07b39"/>
  <circle cx="662" cy="171" r="11" fill="#e07b39"/>
  <circle cx="707" cy="171" r="11" fill="#e07b39"/>
  <circle cx="752" cy="171" r="11" fill="#e07b39"/>
  <circle cx="797" cy="171" r="11" fill="#e07b39"/>
  <text x="848" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#e07b39">B</text>
  <!-- Fold 3 = Patient C -->
  <text x="468" y="224" font-size="12" fill="#1b2a3a">Fold 3</text>
  <rect x="522" y="202" width="345" height="42" rx="6" fill="#eef4e9" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="572" cy="223" r="11" fill="#6a994e"/>
  <circle cx="617" cy="223" r="11" fill="#6a994e"/>
  <circle cx="662" cy="223" r="11" fill="#6a994e"/>
  <circle cx="707" cy="223" r="11" fill="#6a994e"/>
  <circle cx="752" cy="223" r="11" fill="#6a994e"/>
  <circle cx="797" cy="223" r="11" fill="#6a994e"/>
  <text x="848" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a994e">C</text>

  <!-- Right caption -->
  <text x="470" y="286" font-size="13.5" fill="#1b2a3a">Group by patient: all of a patient's cells</text>
  <text x="470" y="308" font-size="13.5" fill="#1b2a3a">stay in a single fold.</text>
  <text x="470" y="330" font-size="13.5" fill="#6a994e" font-weight="bold">&#8594; whole patient held out together.</text>

  <!-- Footer takeaway -->
  <text x="440" y="368" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2a6f97">The unit of splitting must be the group (patient), not the row (cell).</text>

</svg>
