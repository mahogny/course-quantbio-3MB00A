<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.3 30.4 678.9 372.7" width="678.9" height="372.7" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shaded overfitting gap between the two curves on the right -->
  <path d="M302,242 L355,250 L408,252 L461,250 L514,241 L567,226 L620,203
           L620,300 L567,297 L514,291 L461,285 L408,276 L355,264 L302,248 Z"
        fill="#eaf1f7" stroke="none" opacity="0.9"/>

  <!-- axes -->
  <line x1="90" y1="320" x2="645" y2="320" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="320" x2="90" y2="52" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- optimal lambda marker -->
  <line x1="408" y1="105" x2="408" y2="320" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="408" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">optimal λ</text>

  <!-- test error curve (red, U shaped) -->
  <polyline points="90,134 143,176 196,207 249,228 302,242 355,250 408,252 461,250 514,241 567,226 620,203"
            fill="none" stroke="#bc4749" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- training error curve (blue, decreasing) -->
  <polyline points="90,117 143,165 196,201 249,228 302,248 355,264 408,276 461,285 514,291 567,297 620,300"
            fill="none" stroke="#2a6f97" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- curve labels -->
  <text x="498" y="166" font-size="15" font-weight="bold" fill="#bc4749">error on new data (test)</text>
  <text x="452" y="315" font-size="15" font-weight="bold" fill="#2a6f97">training error</text>
  <text x="515" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">overfitting</text>

  <!-- region annotations -->
  <text x="205" y="70" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">high bias</text>
  <text x="205" y="88" text-anchor="middle" font-size="13" fill="#5a6b7a">(too rigid / underfit)</text>
  <text x="533" y="70" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">high variance</text>
  <text x="533" y="88" text-anchor="middle" font-size="13" fill="#5a6b7a">(too flexible)</text>

  <!-- axis titles -->
  <text x="365" y="352" text-anchor="middle" font-size="15" fill="#1b2a3a">model flexibility  →  (smaller λ, less shrinkage)</text>
  <text x="34" y="188" text-anchor="middle" font-size="16" fill="#1b2a3a" transform="rotate(-90 34 188)">error</text>

  <!-- decomposition caption -->
  <text x="262" y="384" text-anchor="start" font-size="14" font-style="italic" fill="#6a994e">test error = bias<tspan font-size="10" dy="-5">2</tspan><tspan dy="5"> + variance + noise</tspan></text>
</svg>
