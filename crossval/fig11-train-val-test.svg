<svg xmlns="http://www.w3.org/2000/svg" viewBox="53.1 -3.0 553.9 361.4" font-family="Helvetica, Arial, sans-serif" width="553.9" height="361.4">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Three jobs, one rule: the test set is used once</text>

  <!-- Bar geometry: bar top y=70, bar bottom y=140. total width from x=70 to x=590 (520 wide) -->
  <!-- Left block: 80% -> 416 wide, x=70..486 . Right block: 20% -> 104 wide, x=486..590 -->

  <!-- LEFT BLOCK: Train + Validate -->
  <rect x="70" y="70" width="416" height="70" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- fold lines: 5 sub blocks across 416 wide -> steps of 83.2, draw 4 internal faint lines -->
  <line x1="153.2" y1="70" x2="153.2" y2="140" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="236.4" y1="70" x2="236.4" y2="140" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="319.6" y1="70" x2="319.6" y2="140" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="402.8" y1="70" x2="402.8" y2="140" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- one held out fold highlighted -->
  <rect x="236.4" y="70" width="83.2" height="70" fill="#6a994e" fill-opacity="0.22" stroke="#6a994e" stroke-width="1.5"/>
  <text x="278" y="112" text-anchor="middle" font-size="11" fill="#6a994e">val</text>

  <!-- Left block label inside -->
  <text x="196" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">Train + Validate</text>
  <text x="360" y="55" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2a6f97">(all CV / tuning happens here)</text>

  <!-- Left captions beneath -->
  <text x="70" y="172" font-size="12.5" fill="#1b2a3a"><tspan font-weight="bold">Training folds:</tspan> fit coefficients for a given λ</text>
  <text x="70" y="192" font-size="12.5" fill="#6a994e"><tspan font-weight="bold">Validation fold:</tspan> choose λ</text>

  <!-- NO PEEKING barrier: dashed red wall between left and right at x=486 -->
  <line x1="486" y1="52" x2="486" y2="212" stroke="#bc4749" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="486" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#bc4749">no peeking</text>
  <text x="486" y="244" text-anchor="middle" font-size="11" fill="#bc4749">untouched by any tuning</text>

  <!-- RIGHT BLOCK: sealed TEST box -->
  <rect x="500" y="70" width="90" height="70" fill="#fbeaea" stroke="#bc4749" stroke-width="2"/>
  <!-- seal tape crossing -->
  <line x1="500" y1="70" x2="590" y2="140" stroke="#bc4749" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Padlock icon centered around (545, 96) -->
  <path d="M537 96 a8 8 0 0 1 16 0 v6 h-4 v-6 a4 4 0 0 0 -8 0 v6 h-4 z" fill="#bc4749"/>
  <rect x="533" y="102" width="24" height="18" rx="2" fill="#bc4749"/>
  <rect x="543.5" y="108" width="3" height="7" rx="1.5" fill="#fbeaea"/>

  <!-- Test label inside -->
  <text x="545" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#bc4749">TEST</text>

  <!-- Test captions beneath -->
  <text x="545" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#bc4749">opened once,</text>
  <text x="545" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#bc4749">at the very end</text>
  <text x="545" y="206" text-anchor="middle" font-size="11" font-style="italic" fill="#bc4749">final honest</text>
  <text x="545" y="220" text-anchor="middle" font-size="11" font-style="italic" fill="#bc4749">performance</text>

  <!-- Width brackets under the whole bar -->
  <line x1="70" y1="290" x2="486" y2="290" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="70" y1="285" x2="70" y2="295" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="486" y1="285" x2="486" y2="295" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="278" y="308" text-anchor="middle" font-size="12" fill="#1b2a3a">~80% of data</text>

  <line x1="500" y1="290" x2="590" y2="290" stroke="#bc4749" stroke-width="1.5"/>
  <line x1="500" y1="285" x2="500" y2="295" stroke="#bc4749" stroke-width="1.5"/>
  <line x1="590" y1="285" x2="590" y2="295" stroke="#bc4749" stroke-width="1.5"/>
  <text x="545" y="308" text-anchor="middle" font-size="12" fill="#bc4749">~20%</text>

  <!-- The two-stage flow arrow: tuning loop stays left, then one-way to test -->
  <text x="278" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">repeat CV to pick λ, refit on all 80%</text>
  <line x1="430" y1="335" x2="498" y2="335" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#bc4749">score once</text>
</svg>
