<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.1 -5.5 601.1 406.4" font-family="Helvetica, Arial, sans-serif" width="601.1" height="406.4">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">Same model, very different truth</text>

  <!-- Plot geometry: baseline y=320, top y=70, accuracy 0 to 1 -->
  <!-- y = 320 - acc*250 -->

  <!-- Y axis -->
  <line x1="110" y1="70" x2="110" y2="320" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="110" y1="320" x2="590" y2="320" stroke="#1b2a3a" stroke-width="2"/>

  <!-- Y axis ticks and labels -->
  <text x="100" y="325" text-anchor="end" font-size="13" fill="#1b2a3a">0</text>
  <line x1="105" y1="320" x2="110" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="100" y="200" text-anchor="end" font-size="13" fill="#1b2a3a">0.5</text>
  <line x1="105" y1="195" x2="110" y2="195" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="100" y="75" text-anchor="end" font-size="13" fill="#1b2a3a">1.0</text>
  <line x1="105" y1="70" x2="110" y2="70" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- Y axis title -->
  <text x="34" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a" transform="rotate(-90 34 195)">Accuracy</text>

  <!-- Chance reference line at 0.50 : y = 320 - 0.5*250 = 195 -->
  <line x1="110" y1="195" x2="590" y2="195" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="588" y="176" text-anchor="end" font-size="13" fill="#bc4749">chance</text>
  <text x="588" y="191" text-anchor="end" font-size="13" fill="#bc4749">(coin flip)</text>

  <!-- Left bar: accuracy 0.98 -> y = 320 - 0.98*250 = 75 -->
  <rect x="185" y="75" width="130" height="245" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="250" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">~92-98%</text>

  <!-- Right bar: accuracy 0.55 -> y = 320 - 0.55*250 = 182.5 -->
  <rect x="385" y="182" width="130" height="138" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="450" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">~55%</text>

  <!-- Gap arrow spanning bar tops: from left bar top (250,75) down to right bar top level -->
  <line x1="250" y1="90" x2="250" y2="176" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- horizontal reference brackets at each bar top -->
  <line x1="250" y1="79" x2="330" y2="79" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="250" y1="182" x2="330" y2="182" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Gap annotation -->
  <text x="342" y="122" font-size="15" font-weight="bold" fill="#bc4749">learned noise,</text>
  <text x="342" y="142" font-size="15" font-weight="bold" fill="#bc4749">not biology</text>

  <!-- X labels -->
  <text x="250" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">Training cohort</text>
  <text x="250" y="360" text-anchor="middle" font-size="11.5" fill="#1b2a3a">80 patients: 40 disease, 40 healthy</text>

  <text x="450" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">New cohort</text>
  <text x="450" y="360" text-anchor="middle" font-size="11.5" fill="#1b2a3a">(collaborator)</text>

  <!-- One-model note -->
  <text x="330" y="382" text-anchor="middle" font-size="12" font-style="italic" fill="#6a994e">same lasso classifier, same fill colour = one model</text>
</svg>
