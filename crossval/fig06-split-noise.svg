<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.8 21.9 885.4 357.4" font-family="Helvetica, Arial, sans-serif" width="885.4" height="357.4">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <!-- 80 patient cells: white separators every 7px over a 560px strip -->
    <pattern id="cells" width="7" height="20" patternUnits="userSpaceOnUse">
      <line x1="7" y1="0" x2="7" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- ============ SPLIT A ============ -->
  <text x="40" y="58" font-size="15" font-weight="bold" fill="#1b2a3a">Split A</text>
  <!-- strip: 80 squares, train grey + test blue (right 20) -->
  <rect x="40" y="66" width="560" height="20" fill="#c9d3dd"/>
  <rect x="460" y="66" width="140" height="20" fill="#2a6f97"/>
  <rect x="40" y="66" width="560" height="20" fill="url(#cells)"/>
  <rect x="40" y="66" width="560" height="20" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="250" y="80" text-anchor="middle" font-size="12.5" fill="#1b2a3a">train (60)</text>
  <text x="530" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">test (20)</text>
  <!-- accuracy tag A -->
  <rect x="640" y="66" width="100" height="20" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.4"/>
  <text x="648" y="80" font-size="12.5" fill="#1b2a3a">acc = <tspan fill="#bc4749" font-weight="bold">0.88</tspan></text>

  <!-- ============ SPLIT B ============ -->
  <text x="40" y="150" font-size="15" font-weight="bold" fill="#1b2a3a">Split B</text>
  <!-- strip: same patients, a DIFFERENT contiguous test block -->
  <rect x="40" y="158" width="560" height="20" fill="#c9d3dd"/>
  <rect x="180" y="158" width="140" height="20" fill="#2a6f97"/>
  <rect x="40" y="158" width="560" height="20" fill="url(#cells)"/>
  <rect x="40" y="158" width="560" height="20" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="110" y="172" text-anchor="middle" font-size="12.5" fill="#1b2a3a">train</text>
  <text x="250" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">test (20)</text>
  <text x="460" y="172" text-anchor="middle" font-size="12.5" fill="#1b2a3a">train  (60 total)</text>
  <!-- accuracy tag B -->
  <rect x="640" y="158" width="100" height="20" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.4"/>
  <text x="648" y="172" font-size="12.5" fill="#1b2a3a">acc = <tspan fill="#bc4749" font-weight="bold">0.79</tspan></text>

  <!-- brace linking the two differing numbers -->
  <path d="M746,74 Q758,74 758,98 Q758,122 770,122 Q758,122 758,146 Q758,170 746,170"
        fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="776" y="106" font-size="12.5" fill="#bc4749">same data,</text>
  <text x="776" y="122" font-size="12.5" fill="#bc4749">different split →</text>
  <text x="776" y="138" font-size="12.5" font-weight="bold" fill="#bc4749">different number</text>
  <text x="776" y="154" font-size="12.5" font-weight="bold" fill="#bc4749">(noisy)</text>

  <!-- wasteful note, pointing at a train region -->
  <line x1="110" y1="216" x2="110" y2="182" stroke="#1b2a3a" stroke-width="1.4" marker-end="url(#arrowUp)"/>
  <text x="40" y="234" font-size="13" font-style="italic" fill="#6a994e">and each fit uses only 60 of 80 patients (wasteful)</text>

  <!-- separator -->
  <line x1="40" y1="300" x2="840" y2="300" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- bottom forward arrow: the fix -->
  <line x1="40" y1="345" x2="105" y2="345" stroke="#6a994e" stroke-width="2.6" marker-end="url(#arrowG)"/>
  <text x="120" y="350" font-size="16" font-weight="bold" fill="#6a994e">rotate the held-out part → k-fold CV</text>
</svg>
