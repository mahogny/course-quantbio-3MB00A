<svg xmlns="http://www.w3.org/2000/svg" width="526.9" height="363.2" viewBox="8.0 0.0 526.9 363.2" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Paired counts: same patient, two treatments</text>

  <!-- Y axis -->
  <line x1="120" y1="60" x2="120" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- Gridlines and Y tick labels: 0,25,50,75,100 -->
  <line x1="120" y1="320" x2="520" y2="320" stroke="#c9d3dd" stroke-width="1"/>
  <text x="112" y="324" text-anchor="end" font-size="13" fill="#1b2a3a">0</text>
  <line x1="120" y1="255" x2="520" y2="255" stroke="#c9d3dd" stroke-width="1"/>
  <text x="112" y="259" text-anchor="end" font-size="13" fill="#1b2a3a">25</text>
  <line x1="120" y1="190" x2="520" y2="190" stroke="#c9d3dd" stroke-width="1"/>
  <text x="112" y="194" text-anchor="end" font-size="13" fill="#1b2a3a">50</text>
  <line x1="120" y1="125" x2="520" y2="125" stroke="#c9d3dd" stroke-width="1"/>
  <text x="112" y="129" text-anchor="end" font-size="13" fill="#1b2a3a">75</text>
  <line x1="120" y1="60" x2="520" y2="60" stroke="#c9d3dd" stroke-width="1"/>
  <text x="112" y="64" text-anchor="end" font-size="13" fill="#1b2a3a">100</text>

  <!-- Y axis label -->
  <text x="34" y="190" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 34 190)">activated T-cell count</text>

  <!-- X category positions: placebo x=200, drug x=440 -->
  <text x="200" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">placebo</text>
  <text x="440" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">drug</text>

  <!-- Connecting lines (light grey) -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="200" y1="273.2" x2="440" y2="213.4"/>
    <line x1="200" y1="301.8" x2="440" y2="288.8"/>
    <line x1="200" y1="177.0" x2="440" y2="70.4"/>
    <line x1="200" y1="262.8" x2="440" y2="229.0"/>
    <line x1="200" y1="283.6" x2="440" y2="270.6"/>
    <line x1="200" y1="296.6" x2="440" y2="281.0"/>
    <line x1="200" y1="239.4" x2="440" y2="205.6"/>
    <line x1="200" y1="203.0" x2="440" y2="138.0"/>
    <line x1="200" y1="288.8" x2="440" y2="268.0"/>
    <line x1="200" y1="249.8" x2="440" y2="195.2"/>
    <line x1="200" y1="304.4" x2="440" y2="294.0"/>
    <line x1="200" y1="221.2" x2="440" y2="161.4"/>
  </g>

  <!-- Placebo dots (muted grey-blue) -->
  <g fill="#5b7a99">
    <circle cx="200" cy="273.2" r="5"/>
    <circle cx="200" cy="301.8" r="5"/>
    <circle cx="200" cy="177.0" r="5"/>
    <circle cx="200" cy="262.8" r="5"/>
    <circle cx="200" cy="283.6" r="5"/>
    <circle cx="200" cy="296.6" r="5"/>
    <circle cx="200" cy="239.4" r="5"/>
    <circle cx="200" cy="203.0" r="5"/>
    <circle cx="200" cy="288.8" r="5"/>
    <circle cx="200" cy="249.8" r="5"/>
    <circle cx="200" cy="304.4" r="5"/>
    <circle cx="200" cy="221.2" r="5"/>
  </g>

  <!-- Drug dots (warm accent) -->
  <g fill="#e0812e">
    <circle cx="440" cy="213.4" r="5"/>
    <circle cx="440" cy="288.8" r="5"/>
    <circle cx="440" cy="70.4" r="5"/>
    <circle cx="440" cy="229.0" r="5"/>
    <circle cx="440" cy="270.6" r="5"/>
    <circle cx="440" cy="281.0" r="5"/>
    <circle cx="440" cy="205.6" r="5"/>
    <circle cx="440" cy="138.0" r="5"/>
    <circle cx="440" cy="268.0" r="5"/>
    <circle cx="440" cy="195.2" r="5"/>
    <circle cx="440" cy="294.0" r="5"/>
    <circle cx="440" cy="161.4" r="5"/>
  </g>
</svg>
