<svg xmlns="http://www.w3.org/2000/svg" width="938.1" height="386.1" viewBox="-16.1 -12.3 938.1 386.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Linear predictor on the log scale</text>

  <!-- log scale number line under the additive tiles -->
  <line x1="12" y1="152" x2="724" y2="152" stroke="#c9d3dd" stroke-width="1.5"/>
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="12" y1="147" x2="12" y2="157"/>
    <line x1="144" y1="147" x2="144" y2="157"/>
    <line x1="294" y1="147" x2="294" y2="157"/>
    <line x1="444" y1="147" x2="444" y2="157"/>
    <line x1="594" y1="147" x2="594" y2="157"/>
    <line x1="724" y1="147" x2="724" y2="157"/>
  </g>
  <text x="12" y="172" font-size="12" fill="#7a8794" font-style="italic">log scale — additive terms</text>

  <!-- Tile 1: exposure / offset (green) -->
  <rect x="12" y="60" width="132" height="85" rx="6" fill="#eef4e9" stroke="#6a994e" stroke-width="2"/>
  <text x="78" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a994e">log(n_cells)</text>
  <text x="78" y="108" text-anchor="middle" font-size="11" fill="#1b2a3a">offset (exposure)</text>
  <text x="78" y="126" text-anchor="middle" font-size="11" fill="#1b2a3a">coef fixed = 1</text>

  <text x="153" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">+</text>

  <!-- Tile 2: baseline (primary dark) -->
  <rect x="162" y="60" width="132" height="85" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="228" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">+ α</text>
  <text x="228" y="110" text-anchor="middle" font-size="11" fill="#1b2a3a">baseline</text>
  <text x="228" y="128" text-anchor="middle" font-size="11" fill="#1b2a3a">log-rate</text>

  <text x="303" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">+</text>

  <!-- Tile 3: drug effect (blue) -->
  <rect x="312" y="60" width="132" height="85" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="378" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">+ β<tspan font-size="11" dy="4">drug</tspan><tspan dy="-4"> · x</tspan></text>
  <text x="378" y="110" text-anchor="middle" font-size="11" fill="#1b2a3a">x = 1 drug,</text>
  <text x="378" y="128" text-anchor="middle" font-size="11" fill="#1b2a3a">0 placebo</text>

  <text x="453" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">+</text>

  <!-- Tile 4: age covariate (red) -->
  <rect x="462" y="60" width="132" height="85" rx="6" fill="#f7ecec" stroke="#bc4749" stroke-width="2"/>
  <text x="528" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">+ β<tspan font-size="11" dy="4">age</tspan></text>
  <text x="528" y="110" text-anchor="middle" font-size="11" fill="#1b2a3a">· (age − mean age)</text>
  <text x="528" y="128" text-anchor="middle" font-size="11" fill="#1b2a3a">centered covariate</text>

  <text x="603" y="112" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">=</text>

  <!-- Sum box: log mu_i -->
  <rect x="614" y="60" width="110" height="85" rx="6" fill="#dbe6f0" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="669" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">log μ_i</text>
  <text x="669" y="128" text-anchor="middle" font-size="11" fill="#1b2a3a">linear predictor</text>

  <!-- exp() arrow: log mu_i  ->  mu_i -->
  <line x1="669" y1="152" x2="669" y2="248" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="686" y="196" font-size="17" font-weight="bold" fill="#1b2a3a">exp( )</text>
  <text x="686" y="214" font-size="12" fill="#7a8794" font-style="italic">the log link</text>

  <!-- mu_i box (natural scale) -->
  <rect x="560" y="252" width="220" height="72" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="670" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">μ_i = expected count</text>
  <text x="670" y="304" text-anchor="middle" font-size="13" fill="#2a6f97">= rate × n_cells</text>
  <text x="560" y="344" font-size="12" fill="#7a8794" font-style="italic">natural scale — factors multiply</text>

  <!-- Callout: exp(beta_drug) = rate ratio -->
  <rect x="798" y="60" width="96" height="150" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="846" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">exp(β_drug)</text>
  <text x="846" y="110" text-anchor="middle" font-size="12" fill="#1b2a3a">= rate ratio</text>
  <text x="846" y="132" text-anchor="middle" font-size="12" fill="#1b2a3a">multiplicative</text>
  <text x="846" y="150" text-anchor="middle" font-size="12" fill="#1b2a3a">fold-change</text>
  <text x="846" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#bc4749">e.g. ×1.6</text>
  <text x="846" y="200" text-anchor="middle" font-size="11" fill="#7a8794">per drug</text>

  <!-- dashed link: additive beta_drug tile relates to multiplicative callout -->
  <path d="M444 78 C 640 40, 720 40, 798 90" fill="none" stroke="#2a6f97" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- bridge note -->
  <text x="300" y="290" text-anchor="middle" font-size="13" fill="#1b2a3a">add on log scale</text>
  <text x="300" y="310" text-anchor="middle" font-size="13" fill="#1b2a3a">→ multiply as rates</text>
  <line x1="300" y1="252" x2="300" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#7a8794" font-style="italic">log link bridges the two</text>
</svg>
