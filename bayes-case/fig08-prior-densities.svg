<svg xmlns="http://www.w3.org/2000/svg" width="795.2" height="419" viewBox="48.6 -2 795.2 419" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="440" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Weakly informative priors (on the log scale)</text>

  <!-- ============ Panel A: Normal(0,2) Intercept ============ -->
