  <line x1="770" y1="90" x2="770" y2="185" stroke="#6a994e" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- curve -->
  <path fill="none" stroke="#2a6f97" stroke-width="2" d="M 545.0,183.9 L 556.2,182.8 L 567.5,180.8 L 578.8,177.4 L 590.0,172.1 L 601.2,164.5 L 612.5,154.2 L 623.8,141.5 L 635.0,127.4 L 646.2,113.3 L 657.5,101.2 L 668.8,92.9 L 677.8,90.1 L 680.0,90.0 L 682.2,90.1 L 691.2,92.9 L 704.8,103.3 L 716.0,116.0 L 727.2,130.3 L 738.5,144.2 L 749.8,156.4 L 761.0,166.2 L 772.2,173.4 L 783.5,178.3 L 794.8,181.3 L 806.0,183.1 L 815.0,183.9"/>
  <line x1="545" y1="185" x2="545" y2="190" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="680" y1="185" x2="680" y2="190" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="815" y1="185" x2="815" y2="190" stroke="#1b2a3a" stroke-width="1"/>
  <text x="545" y="203" text-anchor="middle" font-size="12" fill="#1b2a3a">-3</text>
  <text x="680" y="203" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="815" y="203" text-anchor="middle" font-size="12" fill="#1b2a3a">3</text>
  <text x="680" y="217" text-anchor="middle" font-size="12" fill="#5b7a99">coefficient (log rate ratio)</text>
  <text x="680" y="70" text-anchor="middle" font-size="12" fill="#6a994e">[-2, 2]</text>

  <!-- ============ Panel C: Exponential(1) SD ============ -->
  <text x="95" y="250" font-size="14" font-weight="bold" fill="#1b2a3a">C  Exponential(1) on between-patient SD</text>
  <line x1="95" y1="260" x2="95" y2="385" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="95" y1="385" x2="365" y2="385" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="80" y="326" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 80 326)">density</text>
  <path fill="#eaf1f7" fill-opacity="0.7" stroke="none" d="M 95,385 L 95.0,290.0 L 365.0,384.4 L 365,385 Z"/>
  <path fill="none" stroke="#bc4749" stroke-width="2" d="M 95.0,290.0 L 106.2,307.9 L 117.5,322.4 L 128.8,334.2 L 140.0,343.7 L 151.2,351.5 L 162.5,357.8 L 173.8,362.9 L 185.0,367.1 L 196.2,370.4 L 207.5,373.2 L 218.8,375.4 L 230.0,377.2 L 241.2,378.7 L 252.5,379.9 L 263.8,380.8 L 275.0,381.6 L 286.2,382.2 L 297.5,382.8 L 308.8,383.2 L 320.0,383.5 L 331.2,383.8 L 342.5,384.0 L 353.8,384.2 L 365.0,384.4"/>
  <line x1="95" y1="385" x2="95" y2="390" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="365" y1="385" x2="365" y2="390" stroke="#1b2a3a" stroke-width="1"/>
  <text x="95" y="403" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="365" y="403" text-anchor="middle" font-size="12" fill="#1b2a3a">5</text>
  <text x="230" y="403" text-anchor="middle" font-size="12" fill="#5b7a99">σ  (SD, ≥ 0)</text>
  <text x="255" y="300" text-anchor="middle" font-size="12" fill="#1b2a3a">positive only, modest</text>

  <!-- ============ Panel D: Gamma(0.01,0.01) dispersion ============ -->
  <text x="545" y="250" font-size="14" font-weight="bold" fill="#1b2a3a">D  Gamma(0.01, 0.01) on NB dispersion φ</text>
  <line x1="545" y1="260" x2="545" y2="385" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="545" y1="385" x2="815" y2="385" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="530" y="326" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 530 326)">density</text>
  <path fill="#eaf1f7" fill-opacity="0.7" stroke="none" d="M 545,385 L 545.0,290.0 L 815.0,382.8 L 815,385 Z"/>
  <path fill="none" stroke="#6a994e" stroke-width="2" d="M 545.0,290.0 L 549.5,310.5 L 554.0,326.5 L 558.5,339.0 L 563.0,348.7 L 567.5,356.2 L 572.0,362.1 L 576.5,366.7 L 581.0,370.3 L 585.5,373.0 L 590.0,375.2 L 596.8,377.6 L 603.5,379.2 L 610.2,380.3 L 617.0,381.1 L 626.0,381.8 L 635.0,382.2 L 646.2,382.5 L 659.8,382.7 L 675.5,382.8 L 700.2,382.8 L 730.0,382.8 L 770.0,382.8 L 815.0,382.8"/>
  <line x1="545" y1="385" x2="545" y2="390" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="815" y1="385" x2="815" y2="390" stroke="#1b2a3a" stroke-width="1"/>
  <text x="545" y="403" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="815" y="403" text-anchor="middle" font-size="12" fill="#1b2a3a">5</text>
  <text x="680" y="403" text-anchor="middle" font-size="12" fill="#5b7a99">φ  (dispersion)</text>
  <text x="700" y="330" text-anchor="middle" font-size="12" fill="#1b2a3a">very diffuse:</text>
  <text x="700" y="346" text-anchor="middle" font-size="12" fill="#1b2a3a">mass crammed near 0,</text>
  <text x="700" y="362" text-anchor="middle" font-size="12" fill="#1b2a3a">long flat tail</text>

  <!-- Panel B annotation (below the row, spanning) -->
  <text x="541" y="229" text-anchor="start" font-size="11.5" fill="#1b2a3a">rate ratio e<tspan font-size="8" dy="-4">±2</tspan><tspan font-size="11.5" dy="4"> ≈ 0.14 to 7.4 — sceptical, not restrictive</tspan></text>
</svg>
