  <!-- axes -->
  <line x1="95" y1="60" x2="95" y2="185" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="95" y1="185" x2="365" y2="185" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="80" y="126" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 80 126)">density</text>
  <!-- curve -->
  <path fill="#eaf1f7" fill-opacity="0.7" stroke="none" d="M 95,185 L 95.0,183.9 L 230.0,90.0 L 365.0,183.9 L 365,185 Z"/>
  <path fill="none" stroke="#2a6f97" stroke-width="2" d="M 95.0,183.9 L 106.2,182.8 L 117.5,180.8 L 128.8,177.4 L 140.0,172.1 L 151.2,164.5 L 162.5,154.2 L 173.8,141.5 L 185.0,127.4 L 196.2,113.3 L 207.5,101.2 L 218.8,92.9 L 227.8,90.1 L 230.0,90.0 L 232.2,90.1 L 241.2,92.9 L 254.8,103.3 L 266.0,116.0 L 277.2,130.3 L 288.5,144.2 L 299.8,156.4 L 311.0,166.2 L 322.2,173.4 L 333.5,178.3 L 344.8,181.3 L 356.0,183.1 L 365.0,183.9"/>
  <!-- x ticks -->
  <line x1="95" y1="185" x2="95" y2="190" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="230" y1="185" x2="230" y2="190" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="365" y1="185" x2="365" y2="190" stroke="#1b2a3a" stroke-width="1"/>
  <text x="95" y="203" text-anchor="middle" font-size="12" fill="#1b2a3a">-6</text>
  <text x="230" y="203" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="365" y="203" text-anchor="middle" font-size="12" fill="#1b2a3a">6</text>
  <text x="230" y="217" text-anchor="middle" font-size="12" fill="#5b7a99">log-rate</text>
  <text x="230" y="70" text-anchor="middle" font-size="12.5" fill="#1b2a3a">baseline log-rate (broad)</text>

  <!-- ============ Panel B: Normal(0,1) coefficient ============ -->
  <text x="545" y="50" font-size="14" font-weight="bold" fill="#1b2a3a">B  Normal(0, 1) on a coefficient</text>
  <line x1="545" y1="60" x2="545" y2="185" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="545" y1="185" x2="815" y2="185" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="530" y="126" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 530 126)">density</text>
  <!-- shaded [-2,2] -->
  <path fill="#6a994e" fill-opacity="0.18" stroke="none" d="M 590.0,185.0 L 590.0,172.1 L 605.0,161.3 L 620.0,145.9 L 635.0,127.4 L 650.0,108.9 L 665.0,95.1 L 680.0,90.0 L 695.0,95.1 L 710.0,108.9 L 725.0,127.4 L 740.0,145.9 L 755.0,161.3 L 770.0,172.1 L 770.0,185.0 Z"/>
