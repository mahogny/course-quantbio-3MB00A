<svg xmlns="http://www.w3.org/2000/svg" viewBox="33.7 10.3 738.6 395.7" width="738.6" height="395.7" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ============ TOP: the equation A x = b ============ -->

  <!-- Matrix A -->
  <!-- row 1 highlight -->
  <rect x="70" y="55" width="120" height="42" fill="#eaf1f7" stroke="none"/>
  <!-- row 2 highlight -->
  <rect x="70" y="97" width="120" height="42" fill="#fbeceb" stroke="none"/>
  <!-- brackets -->
  <path d="M64,50 h-8 v94 h8" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M196,50 h8 v94 h-8" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <!-- entries -->
  <text x="100" y="84" font-size="26" fill="#2a6f97" font-weight="bold" text-anchor="middle">2</text>
  <text x="160" y="84" font-size="26" fill="#2a6f97" font-weight="bold" text-anchor="middle">1</text>
  <text x="100" y="126" font-size="26" fill="#bc4749" font-weight="bold" text-anchor="middle">1</text>
  <text x="160" y="126" font-size="26" fill="#bc4749" font-weight="bold" text-anchor="middle">3</text>
  <!-- brace + label for A -->
  <path d="M56,152 q0,8 8,8 h58 q8,0 8,8 q0,-8 8,-8 h58 q8,0 8,-8" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="130" y="188" font-size="15" fill="#1b2a3a" text-anchor="middle">A (coefficient matrix)</text>

  <!-- Vector x -->
  <path d="M232,50 h-8 v94 h8" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M292,50 h8 v94 h-8" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="250" y="84" font-size="22" fill="#1b2a3a" text-anchor="start">x</text>
  <text x="250" y="126" font-size="22" fill="#1b2a3a" text-anchor="start">y</text>
  <path d="M224,152 q0,8 8,8 h18 q8,0 8,8 q0,-8 8,-8 h18 q8,0 8,-8" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="262" y="188" font-size="15" fill="#1b2a3a" text-anchor="middle">x (unknowns)</text>

  <!-- equals -->
  <text x="330" y="105" font-size="34" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- Vector b -->
  <path d="M400,50 h-8 v94 h8" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M456,50 h8 v94 h-8" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="428" y="84" font-size="22" fill="#1b2a3a" text-anchor="middle">8</text>
  <text x="428" y="126" font-size="22" fill="#1b2a3a" text-anchor="middle">9</text>
  <path d="M392,152 q0,8 8,8 h16 q8,0 8,8 q0,-8 8,-8 h16 q8,0 8,-8" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="428" y="188" font-size="15" fill="#1b2a3a" text-anchor="middle">b (measurements)</text>

  <!-- ============ Callouts (right / bottom) ============ -->

  <!-- Callout row 1 -->
  <rect x="520" y="66" width="230" height="46" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="574" y="95" font-size="19" fill="#2a6f97" font-weight="bold" text-anchor="start">2·x<tspan font-size="19"> + 1·y</tspan><tspan font-size="19"> = 8</tspan></text>

  <!-- Callout row 2 -->
  <rect x="520" y="300" width="230" height="46" rx="8" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
  <text x="574" y="329" font-size="19" fill="#bc4749" font-weight="bold" text-anchor="start">1·x<tspan font-size="19"> + 3·y</tspan><tspan font-size="19"> = 9</tspan></text>

  <!-- Arrows from ROW 1 of A and from x to callout 1 -->
  <path d="M190,72 C 300,60 420,70 516,86" fill="none" stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrowR1)"/>
  <path d="M270,50 C 340,20 460,30 540,64" fill="none" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowR1)"/>

  <!-- Arrows from ROW 2 of A and from x to callout 2 -->
  <path d="M190,126 C 320,220 430,300 516,320" fill="none" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrowR2)"/>
  <path d="M270,144 C 340,250 460,310 516,332" fill="none" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowR2)"/>

  <!-- small labels on arrows -->
  <text x="345" y="55" font-size="12" fill="#2a6f97" text-anchor="middle">row 1 · x</text>
  <text x="300" y="285" font-size="12" fill="#bc4749" text-anchor="middle">row 2 · x</text>

  <!-- ============ Bottom message ============ -->
  <text x="390" y="382" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">Each row of A dotted with x reproduces one original equation.</text>
</svg>
