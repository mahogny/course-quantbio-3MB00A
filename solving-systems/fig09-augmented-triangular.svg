<svg xmlns="http://www.w3.org/2000/svg" viewBox="40.1 75.5 659.5 302.2" width="659.5" height="302.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== LEFT MATRIX [A|b] ===================== -->
  <g>
    <!-- bracket left -->
    <path d="M70,120 L60,120 L60,230 L70,230" fill="none" stroke="#1b2a3a" stroke-width="2"/>
    <!-- bracket right -->
    <path d="M250,120 L260,120 L260,230 L250,230" fill="none" stroke="#1b2a3a" stroke-width="2"/>

    <!-- vertical separator bar -->
    <line x1="205" y1="122" x2="205" y2="228" stroke="#2a6f97" stroke-width="2"/>

    <!-- row 1 -->
    <text x="100" y="160" font-size="24" fill="#1b2a3a" text-anchor="middle">2</text>
    <text x="160" y="160" font-size="24" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="232" y="160" font-size="24" fill="#1b2a3a" text-anchor="middle">8</text>
    <!-- row 2 -->
    <text x="100" y="205" font-size="24" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="160" y="205" font-size="24" fill="#1b2a3a" text-anchor="middle">3</text>
    <text x="232" y="205" font-size="24" fill="#1b2a3a" text-anchor="middle">9</text>

    <text x="160" y="105" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">[A | b]</text>
  </g>

  <!-- vertical-bar annotation -->
  <text x="205" y="255" font-size="12.5" fill="#2a6f97" text-anchor="middle">vertical bar separates</text>
  <text x="205" y="270" font-size="12.5" fill="#2a6f97" text-anchor="middle">A from b</text>

  <!-- ===================== ARROW ===================== -->
  <line x1="290" y1="175" x2="400" y2="175" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="163" font-size="15" fill="#bc4749" text-anchor="middle" font-weight="bold">R2 − ½·R1</text>

  <!-- ===================== RIGHT MATRIX (triangular) ===================== -->
  <g>
    <!-- shaded upper-triangular region: diagonal and above -->
    <!-- top-left cell (2) + top-right in-A cell (1) + bottom-right in-A cell (2.5): staircase -->
    <path d="M448,127 L575,127 L575,220 L512,220 L512,173 L448,173 Z" fill="#eaf1f7" stroke="none"/>

    <!-- bracket left -->
    <path d="M450,120 L440,120 L440,230 L450,230" fill="none" stroke="#1b2a3a" stroke-width="2"/>
    <!-- bracket right -->
    <path d="M640,120 L650,120 L650,230 L640,230" fill="none" stroke="#1b2a3a" stroke-width="2"/>

    <!-- vertical separator bar -->
    <line x1="588" y1="122" x2="588" y2="228" stroke="#2a6f97" stroke-width="2"/>

    <!-- row 1 -->
    <text x="480" y="160" font-size="24" fill="#1b2a3a" text-anchor="middle">2</text>
    <text x="543" y="160" font-size="24" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="618" y="160" font-size="24" fill="#1b2a3a" text-anchor="middle">8</text>
    <!-- row 2 -->
    <text x="480" y="205" font-size="24" fill="#bc4749" text-anchor="middle" font-weight="bold">0</text>
    <text x="543" y="205" font-size="24" fill="#1b2a3a" text-anchor="middle">2.5</text>
    <text x="618" y="205" font-size="24" fill="#1b2a3a" text-anchor="middle">5</text>

    <!-- highlight circle on the 0 -->
    <circle cx="480" cy="197" r="17" fill="none" stroke="#bc4749" stroke-width="2"/>
  </g>

  <!-- zero-below-diagonal annotation -->
  <line x1="480" y1="222" x2="472" y2="255" stroke="#bc4749" stroke-width="1.5"/>
  <text x="470" y="272" font-size="12.5" fill="#bc4749" text-anchor="middle">zero below</text>
  <text x="470" y="287" font-size="12.5" fill="#bc4749" text-anchor="middle">the diagonal</text>

  <!-- bottom-row equation annotation -->
  <line x1="565" y1="215" x2="600" y2="245" stroke="#6a994e" stroke-width="1.5"/>
  <rect x="560" y="248" width="120" height="26" rx="4" fill="#f0f6ec" stroke="#6a994e" stroke-width="1.5"/>
  <text x="620" y="266" font-size="15" fill="#6a994e" text-anchor="middle" font-weight="bold">2.5·x_2 = 5</text>

  <!-- caption -->
  <text x="360" y="335" font-size="15" fill="#1b2a3a" text-anchor="middle">Target: upper-triangular (staircase) shape,</text>
  <text x="360" y="356" font-size="15" fill="#1b2a3a" text-anchor="middle">then solve bottom-up.</text>
</svg>
