<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL: score plot ================= -->
  <text x="60" y="34" font-size="16" fill="#1b2a3a" font-weight="bold">Score plot</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="352" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="60" y1="300" x2="60" y2="58" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348" y="322" font-size="14" fill="#1b2a3a" text-anchor="end">predictive score t_p</text>
  <text x="52" y="70" font-size="14" fill="#1b2a3a" text-anchor="end" transform="rotate(-90 52 70)">first orthogonal score t_o</text>

  <!-- faint vertical divider at t_p = 0 -->
  <line x1="205" y1="300" x2="205" y2="60" stroke="#c9d3dd" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="205" y="313" font-size="11" fill="#c9d3dd" text-anchor="middle">t_p = 0</text>

  <!-- controls (teal), negative t_p, large vertical spread -->
  <g fill="#2a8f8f">
    <circle cx="95" cy="120" r="5"/><circle cx="110" cy="180" r="5"/><circle cx="120" cy="240" r="5"/>
    <circle cx="100" cy="200" r="5"/><circle cx="130" cy="150" r="5"/><circle cx="145" cy="270" r="5"/>
    <circle cx="115" cy="110" r="5"/><circle cx="135" cy="210" r="5"/><circle cx="160" cy="175" r="5"/>
    <circle cx="155" cy="130" r="5"/><circle cx="90" cy="255" r="5"/><circle cx="125" cy="190" r="5"/>
    <circle cx="150" cy="230" r="5"/><circle cx="105" cy="160" r="5"/><circle cx="140" cy="105" r="5"/>
    <circle cx="170" cy="200" r="5"/><circle cx="165" cy="140" r="5"/><circle cx="118" cy="272" r="5"/>
  </g>

  <!-- cases (orange), positive t_p, large vertical spread -->
  <g fill="#e0842f">
    <circle cx="225" cy="130" r="5"/><circle cx="240" cy="200" r="5"/><circle cx="255" cy="150" r="5"/>
    <circle cx="230" cy="250" r="5"/><circle cx="270" cy="180" r="5"/><circle cx="285" cy="110" r="5"/>
    <circle cx="245" cy="270" r="5"/><circle cx="300" cy="160" r="5"/><circle cx="315" cy="210" r="5"/>
    <circle cx="260" cy="240" r="5"/><circle cx="280" cy="140" r="5"/><circle cx="222" cy="190" r="5"/>
    <circle cx="295" cy="272" r="5"/><circle cx="310" cy="130" r="5"/><circle cx="250" cy="105" r="5"/>
    <circle cx="325" cy="175" r="5"/><circle cx="305" cy="250" r="5"/><circle cx="235" cy="160" r="5"/>
  </g>

  <text x="130" y="292" font-size="13" fill="#2a8f8f" font-weight="bold" text-anchor="middle">controls</text>
  <text x="272" y="292" font-size="13" fill="#e0842f" font-weight="bold" text-anchor="middle">cases</text>

  <!-- horizontal separation annotation -->
  <path d="M130,86 L130,76 L272,76 L272,86" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="201" y="70" font-size="12" fill="#1b2a3a" text-anchor="middle">left-right = cases vs controls</text>

  <!-- vertical nuisance annotation (double arrow) -->
  <line x1="188" y1="160" x2="188" y2="105" stroke="#6a994e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="188" y1="220" x2="188" y2="275" stroke="#6a994e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="182" y="192" font-size="11" fill="#6a994e" text-anchor="middle" transform="rotate(-90 182 192)">up-down = nuisance</text>
  <text x="201" y="345" font-size="11.5" fill="#6a994e" text-anchor="middle">up-down = within-biology nuisance (batch, individual):</text>
  <text x="201" y="360" font-size="11.5" fill="#6a994e" text-anchor="middle">large spread, but no group split</text>

  <!-- ================= RIGHT PANEL: S-plot ================= -->
  <text x="410" y="34" font-size="16" fill="#1b2a3a" font-weight="bold">S-plot</text>

  <!-- axes (centred at origin 550,180) -->
  <line x1="410" y1="180" x2="700" y2="180" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="308" x2="550" y2="58" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696" y="326" font-size="13.5" fill="#1b2a3a" text-anchor="end">covariance with t_p (magnitude / contribution)</text>
  <text x="558" y="70" font-size="13.5" fill="#1b2a3a">correlation with t_p</text>
  <text x="558" y="86" font-size="12" fill="#1b2a3a">(reliability)</text>

  <!-- S-shaped grey feature cloud -->
  <g fill="#9aa7b3">
    <circle cx="466" cy="271" r="3.5"/><circle cx="472" cy="266" r="3.5"/><circle cx="484" cy="264" r="3.5"/>
    <circle cx="492" cy="258" r="3.5"/><circle cx="500" cy="252" r="3.5"/><circle cx="508" cy="243" r="3.5"/>
    <circle cx="512" cy="248" r="3.5"/><circle cx="516" cy="235" r="3.5"/><circle cx="522" cy="228" r="3.5"/>
    <circle cx="526" cy="218" r="3.5"/><circle cx="530" cy="222" r="3.5"/><circle cx="534" cy="208" r="3.5"/>
    <circle cx="538" cy="202" r="3.5"/><circle cx="542" cy="196" r="3.5"/><circle cx="546" cy="188" r="3.5"/>
    <circle cx="550" cy="180" r="3.5"/><circle cx="554" cy="172" r="3.5"/><circle cx="558" cy="164" r="3.5"/>
    <circle cx="562" cy="158" r="3.5"/><circle cx="566" cy="152" r="3.5"/><circle cx="570" cy="145" r="3.5"/>
    <circle cx="574" cy="149" r="3.5"/><circle cx="578" cy="138" r="3.5"/><circle cx="584" cy="132" r="3.5"/>
    <circle cx="590" cy="126" r="3.5"/><circle cx="588" cy="120" r="3.5"/><circle cx="598" cy="118" r="3.5"/>
    <circle cx="606" cy="112" r="3.5"/><circle cx="616" cy="107" r="3.5"/><circle cx="626" cy="103" r="3.5"/>
  </g>

  <!-- highlighted candidate biomarkers: lower-left corner -->
  <g fill="#e0842f">
    <circle cx="430" cy="278" r="4.5"/><circle cx="440" cy="275" r="4.5"/>
    <circle cx="448" cy="272" r="4.5"/><circle cx="436" cy="269" r="4.5"/>
  </g>
  <!-- highlighted candidate biomarkers: upper-right corner -->
  <g fill="#e0842f">
    <circle cx="670" cy="82" r="4.5"/><circle cx="660" cy="86" r="4.5"/>
    <circle cx="652" cy="90" r="4.5"/><circle cx="664" cy="93" r="4.5"/>
  </g>

  <!-- candidate labels -->
  <line x1="452" y1="272" x2="470" y2="250" stroke="#e0842f" stroke-width="1.4"/>
  <line x1="656" y1="90" x2="636" y2="112" stroke="#e0842f" stroke-width="1.4"/>
  <text x="606" y="244" font-size="12" fill="#e0842f" font-weight="bold" text-anchor="middle">candidate biomarkers:</text>
  <text x="606" y="259" font-size="11.5" fill="#e0842f" text-anchor="middle">high magnitude AND high reliability</text>

  <!-- extreme-corner guide box hints -->
  <rect x="418" y="255" width="44" height="42" fill="none" stroke="#e0842f" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
  <rect x="640" y="72" width="44" height="42" fill="none" stroke="#e0842f" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>

  <!-- ================= shared caption ================= -->
  <line x1="60" y1="373" x2="700" y2="373" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="60" y="390" font-size="12.5" fill="#1b2a3a" font-style="italic">Score plot: do groups separate?  S-plot: which metabolites drive it?<tspan x="60" dy="16">(corner hits are candidates, not proven biomarkers.)</tspan></text>
</svg>
