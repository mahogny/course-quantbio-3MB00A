<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.6 18.4 790.0 398.9" font-family="Helvetica, Arial, sans-serif" width="790.0" height="398.9">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b3"/>
    </marker>
  </defs>

  <!-- faint far tail shading -->
  <rect x="403" y="70" width="152" height="230" fill="#bc4749" opacity="0.07"/>

  <!-- y axis gridline ticks -->
  <line x1="70" y1="230" x2="555" y2="230" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="70" y1="160" x2="555" y2="160" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="63" y="234" text-anchor="end" font-size="10" fill="#9aa7b3">10</text>
  <text x="63" y="164" text-anchor="end" font-size="10" fill="#9aa7b3">20</text>

  <!-- histogram bars: permutation null of Q2 -->
  <g fill="#c2ccd6" stroke="#9aa7b3" stroke-width="0.8">
    <rect x="89.58"  y="293" width="18.5" height="7"/>
    <rect x="109.17" y="286" width="18.5" height="14"/>
    <rect x="128.75" y="272" width="18.5" height="28"/>
    <rect x="148.33" y="251" width="18.5" height="49"/>
    <rect x="167.92" y="216" width="18.5" height="84"/>
    <rect x="187.5"  y="174" width="18.5" height="126"/>
    <rect x="207.08" y="132" width="18.5" height="168"/>
    <rect x="226.67" y="118" width="18.5" height="182"/>
    <rect x="246.25" y="132" width="18.5" height="168"/>
    <rect x="265.83" y="160" width="18.5" height="140"/>
    <rect x="285.42" y="195" width="18.5" height="105"/>
    <rect x="305"    y="223" width="18.5" height="77"/>
    <rect x="324.58" y="244" width="18.5" height="56"/>
    <rect x="344.17" y="258" width="18.5" height="42"/>
    <rect x="363.75" y="272" width="18.5" height="28"/>
    <rect x="383.33" y="279" width="18.5" height="21"/>
    <rect x="402.92" y="286" width="18.5" height="14"/>
    <rect x="422.5"  y="293" width="18.5" height="7"/>
    <rect x="442.08" y="293" width="18.5" height="7"/>
  </g>

  <!-- null label -->
  <text x="172" y="86"  text-anchor="middle" font-size="12" fill="#6a7684">null: class labels randomly shuffled,</text>
  <text x="172" y="101" text-anchor="middle" font-size="12" fill="#6a7684">X–Y link broken, 200 permutations</text>

  <!-- axes -->
  <line x1="70" y1="65" x2="70" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="65" y1="300" x2="560" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- x ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="middle">
    <line x1="70"     y1="300" x2="70"     y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="148.33" y1="300" x2="148.33" y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="226.67" y1="300" x2="226.67" y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="305"    y1="300" x2="305"    y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="383.33" y1="300" x2="383.33" y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="461.67" y1="300" x2="461.67" y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="540"    y1="300" x2="540"    y2="305" stroke="#1b2a3a" stroke-width="1.2"/>
    <text x="70"     y="317">-0.4</text>
    <text x="148.33" y="317">-0.2</text>
    <text x="226.67" y="317">0</text>
    <text x="305"    y="317">0.2</text>
    <text x="383.33" y="317">0.4</text>
    <text x="461.67" y="317">0.6</text>
    <text x="540"    y="317">0.8</text>
  </g>
  <text x="207" y="336" text-anchor="start" font-size="13.5" fill="#1b2a3a" font-weight="bold">Q<tspan font-size="9.5" dy="-5">2</tspan><tspan dy="5"> from shuffled-label models</tspan></text>
  <text x="26" y="185" text-anchor="middle" font-size="13.5" fill="#1b2a3a" font-weight="bold" transform="rotate(-90 26 185)">count</text>

  <!-- REAL model line at Q2 = 0.65 -->
  <line x1="481.25" y1="300" x2="481.25" y2="72" stroke="#bc4749" stroke-width="3.2" marker-end="url(#arrowRed)"/>
  <text x="481.25" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">REAL model</text>
  <text x="456.25" y="67" text-anchor="start" font-size="12" fill="#bc4749">Q<tspan font-size="8.5" dy="-4">2</tspan><tspan dy="4"> ≈ 0.65</tspan></text>

  <!-- annotation callout for REAL line -->
  <path d="M588,168 L484,205" fill="none" stroke="#bc4749" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <rect x="586" y="120" width="168" height="52" rx="6" fill="#fbeaea" stroke="#bc4749" stroke-width="1.4"/>
  <text x="670" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4749">sits in the far tail</text>
  <text x="670" y="158" text-anchor="middle" font-size="12" fill="#1b2a3a">→ signal likely real</text>

  <!-- greyed inset: cautionary case, real line inside the bulk -->
  <g opacity="0.8">
    <rect x="582" y="196" width="170" height="98" rx="6" fill="#f3f5f7" stroke="#c9d3dd" stroke-width="1.4"/>
    <line x1="590" y1="272" x2="748" y2="272" stroke="#9aa7b3" stroke-width="1.2"/>
    <g fill="#cbd4dd" stroke="#9aa7b3" stroke-width="0.7">
      <rect x="595" y="268" width="12" height="4"/>
      <rect x="608" y="263" width="12" height="9"/>
      <rect x="621" y="256" width="12" height="16"/>
      <rect x="634" y="246" width="12" height="26"/>
      <rect x="647" y="234" width="12" height="38"/>
      <rect x="660" y="224" width="12" height="48"/>
      <rect x="673" y="232" width="12" height="40"/>
      <rect x="686" y="244" width="12" height="28"/>
      <rect x="699" y="255" width="12" height="17"/>
      <rect x="712" y="263" width="12" height="9"/>
      <rect x="725" y="267" width="12" height="5"/>
    </g>
    <!-- real line INSIDE the bulk -->
    <line x1="668" y1="272" x2="668" y2="210" stroke="#bc4749" stroke-width="2.4"/>
    <text x="668" y="207" text-anchor="middle" font-size="9.5" fill="#bc4749">REAL</text>
  </g>
  <text x="667" y="308" text-anchor="middle" font-size="10.5" fill="#6a7684">cautionary case: real line inside null bulk</text>
  <text x="667" y="320" text-anchor="middle" font-size="10.5" fill="#6a7684">→ separation is just noise</text>

  <!-- recipe along the bottom (steps spaced out so numbers do not collide with labels) -->
  <g font-size="11.5" fill="#2a6f97">
    <text x="70"  y="362"><tspan font-weight="bold">1</tspan> shuffle Y</text>
    <text x="200" y="362"><tspan font-weight="bold">2</tspan> refit OPLS-DA</text>
    <text x="350" y="362"><tspan font-weight="bold">3</tspan> record R<tspan font-size="8" dy="-4">2</tspan><tspan dy="4">Y / Q</tspan><tspan font-size="8" dy="-4">2</tspan></text>
    <text x="510" y="362"><tspan font-weight="bold">4</tspan> repeat &#215;hundreds</text>
    <text x="660" y="362"><tspan font-weight="bold">5</tspan> compare real/null</text>
  </g>

  <!-- caption -->
  <text x="380" y="392" text-anchor="middle" font-size="13" font-style="italic" fill="#1b2a3a">Your model must beat what random labels achieve on data of exactly this shape.</text>
</svg>
