<svg xmlns="http://www.w3.org/2000/svg" width="840.1" height="320" viewBox="-9.8 65.5 840.1 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT: rack of serum tubes -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <g>
      <rect x="27" y="139" width="16" height="7" rx="1.5" fill="#cfa96a"/>
      <rect x="28" y="146" width="14" height="66" rx="6" fill="#f0d9a8"/>
      <rect x="28" y="180" width="14" height="32" rx="6" fill="#e0c07a" stroke="none"/>
    </g>
    <g>
      <rect x="49" y="139" width="16" height="7" rx="1.5" fill="#cfa96a"/>
      <rect x="50" y="146" width="14" height="66" rx="6" fill="#f0d9a8"/>
      <rect x="50" y="184" width="14" height="28" rx="6" fill="#e0c07a" stroke="none"/>
    </g>
    <g>
      <rect x="71" y="139" width="16" height="7" rx="1.5" fill="#cfa96a"/>
      <rect x="72" y="146" width="14" height="66" rx="6" fill="#f0d9a8"/>
      <rect x="72" y="178" width="14" height="34" rx="6" fill="#e0c07a" stroke="none"/>
    </g>
    <g>
      <rect x="93" y="139" width="16" height="7" rx="1.5" fill="#cfa96a"/>
      <rect x="94" y="146" width="14" height="66" rx="6" fill="#f0d9a8"/>
      <rect x="94" y="186" width="14" height="26" rx="6" fill="#e0c07a" stroke="none"/>
    </g>
    <g>
      <rect x="115" y="139" width="16" height="7" rx="1.5" fill="#cfa96a"/>
      <rect x="116" y="146" width="14" height="66" rx="6" fill="#f0d9a8"/>
      <rect x="116" y="181" width="14" height="31" rx="6" fill="#e0c07a" stroke="none"/>
    </g>
  </g>
  <text x="79" y="230" text-anchor="middle" font-size="13" fill="#1b2a3a">serum, 40 patients</text>
  <text x="79" y="247" text-anchor="middle" font-size="13" fill="#1b2a3a">(20 disease, 20 control)</text>

  <!-- arrow: platform -->
  <line x1="134" y1="200" x2="238" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="190" text-anchor="middle" font-size="11" fill="#2a6f97" font-weight="bold">LC-MS / NMR platform</text>

  <!-- top label for X columns -->
  <text x="429" y="100" text-anchor="middle" font-size="14" fill="#1b2a3a">thousands of metabolite features (columns) →</text>

  <!-- left label for X rows -->
  <text x="256" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 256 200)">40 samples (rows)</text>

  <!-- X matrix: background blocks -->
  <rect x="270" y="110" width="256" height="180" fill="#eaf1f7"/>
  <rect x="556" y="110" width="32" height="180" fill="#eaf1f7"/>

  <!-- faint heatmap cells (blue = intensity, red accents) -->
  <g stroke="none">
    <rect x="302" y="110" width="32" height="30" fill="#2a6f97" opacity="0.55"/>
    <rect x="494" y="140" width="32" height="30" fill="#2a6f97" opacity="0.60"/>
    <rect x="398" y="140" width="32" height="30" fill="#2a6f97" opacity="0.45"/>
    <rect x="462" y="170" width="32" height="30" fill="#2a6f97" opacity="0.50"/>
    <rect x="366" y="260" width="32" height="30" fill="#2a6f97" opacity="0.50"/>
    <rect x="430" y="230" width="32" height="30" fill="#2a6f97" opacity="0.40"/>
    <rect x="302" y="200" width="32" height="30" fill="#2a6f97" opacity="0.35"/>
    <rect x="462" y="260" width="32" height="30" fill="#2a6f97" opacity="0.45"/>
    <rect x="398" y="200" width="32" height="30" fill="#2a6f97" opacity="0.55"/>
    <rect x="366" y="110" width="32" height="30" fill="#bc4749" opacity="0.35"/>
    <rect x="334" y="170" width="32" height="30" fill="#bc4749" opacity="0.40"/>
    <rect x="270" y="230" width="32" height="30" fill="#bc4749" opacity="0.35"/>
    <rect x="556" y="140" width="32" height="30" fill="#2a6f97" opacity="0.40"/>
    <rect x="556" y="230" width="32" height="30" fill="#bc4749" opacity="0.35"/>
  </g>

  <!-- grid lines main block -->
  <g stroke="#c9d3dd" stroke-width="1" fill="none">
    <path d="M302,110 V290 M334,110 V290 M366,110 V290 M398,110 V290 M430,110 V290 M462,110 V290 M494,110 V290"/>
    <path d="M270,140 H526 M270,170 H526 M270,200 H526 M270,230 H526 M270,260 H526"/>
    <path d="M556,140 H588 M556,170 H588 M556,200 H588 M556,230 H588 M556,260 H588"/>
  </g>

  <!-- column ellipsis between shown columns and last column -->
  <text x="541" y="206" text-anchor="middle" font-size="20" fill="#1b2a3a">…</text>

  <!-- outer borders of X blocks -->
  <g fill="none" stroke="#1b2a3a" stroke-width="1.5">
    <rect x="270" y="110" width="256" height="180"/>
    <rect x="556" y="110" width="32" height="180"/>
  </g>

  <!-- row ellipsis (more rows below) -->
  <g font-size="20" fill="#1b2a3a" text-anchor="middle">
    <text x="318" y="303" transform="rotate(90 318 303)">…</text>
    <text x="446" y="303" transform="rotate(90 446 303)">…</text>
    <text x="572" y="303" transform="rotate(90 572 303)">…</text>
    <text x="619" y="303" transform="rotate(90 619 303)">…</text>
  </g>

  <!-- X caption -->
  <text x="429" y="333" text-anchor="middle" font-size="16" fill="#1b2a3a" font-weight="bold">X: 40 × thousands  (wide, p &gt;&gt; n)</text>

  <!-- Y label column, aligned row-for-row with X -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <rect x="603" y="110" width="32" height="30" fill="#d98032"/>
    <rect x="603" y="140" width="32" height="30" fill="#3a9fae"/>
    <rect x="603" y="170" width="32" height="30" fill="#d98032"/>
    <rect x="603" y="200" width="32" height="30" fill="#3a9fae"/>
    <rect x="603" y="230" width="32" height="30" fill="#d98032"/>
    <rect x="603" y="260" width="32" height="30" fill="#3a9fae"/>
  </g>
  <rect x="603" y="110" width="32" height="180" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="619" y="102" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">Y</text>

  <!-- Y legend -->
  <text x="662" y="150" font-size="14" fill="#1b2a3a" font-weight="bold">Y: case / control label</text>
  <rect x="662" y="162" width="16" height="16" fill="#d98032" stroke="#1b2a3a" stroke-width="1"/>
  <text x="684" y="175" font-size="14" fill="#1b2a3a">case</text>
  <rect x="662" y="186" width="16" height="16" fill="#3a9fae" stroke="#1b2a3a" stroke-width="1"/>
  <text x="684" y="199" font-size="14" fill="#1b2a3a">control</text>

  <!-- bottom one-line caption -->
  <text x="429" y="360" text-anchor="middle" font-size="15" fill="#1b2a3a" font-style="italic">The disease signal is real but not the loudest source of variance.</text>
</svg>
