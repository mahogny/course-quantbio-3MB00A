<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: before -->
  <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">before</text>

  <!-- axes -->
  <line x1="60" y1="330" x2="360" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="60" y1="330" x2="60" y2="60" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="365" text-anchor="middle" font-size="15" fill="#1b2a3a">wavelength λ</text>
  <text x="30" y="200" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 30 200)">absorbance A</text>

  <!-- upper spectrum (blue), floating high -->
  <path d="M70,150 L120,150 Q150,150 165,110 Q185,55 205,110 Q220,150 250,150 L350,150"
        fill="none" stroke="#2a6f97" stroke-width="2"/>

  <!-- lower spectrum (red), sitting near baseline -->
  <path d="M70,290 L120,285 Q150,281 165,240 Q185,183 205,238 Q220,278 250,270 L350,258"
        fill="none" stroke="#bc4749" stroke-width="2"/>

  <!-- baseline b(lambda): smooth slowly curving dashed line under lower spectrum -->
  <path d="M70,290 Q160,272 250,268 T350,256"
        fill="none" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="250" y="308" text-anchor="middle" font-size="14" fill="#1b2a3a">baseline b(λ)</text>

  <!-- annotation -->
  <text x="210" y="90" text-anchor="middle" font-size="15" fill="#1b2a3a">A_measured = A_true + b</text>

  <!-- BIG ARROW between panels -->
  <line x1="380" y1="200" x2="500" y2="200" stroke="#1b2a3a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="440" y="185" text-anchor="middle" font-size="14" fill="#1b2a3a">subtract</text>
  <text x="440" y="228" text-anchor="middle" font-size="14" fill="#1b2a3a">fitted baseline</text>

  <!-- RIGHT PANEL: after -->
  <text x="700" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">after</text>

  <!-- axes -->
  <line x1="540" y1="330" x2="860" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="330" x2="540" y2="60" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="365" text-anchor="middle" font-size="15" fill="#1b2a3a">wavelength λ</text>
  <text x="510" y="200" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 510 200)">absorbance A</text>

  <!-- flat zero baseline (dashed) -->
  <line x1="540" y1="300" x2="860" y2="300" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="840" y="318" text-anchor="end" font-size="13" fill="#8494a3">0</text>

  <!-- both spectra coincide on flat zero baseline: red drawn slightly offset for visibility -->
  <path d="M550,300 L600,300 Q630,300 645,255 Q665,195 685,255 Q700,300 730,300 L850,300"
        fill="none" stroke="#2a6f97" stroke-width="3"/>
  <path d="M550,300 L600,300 Q630,300 645,255 Q665,195 685,255 Q700,300 730,300 L850,300"
        fill="none" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="700" y="130" text-anchor="middle" font-size="14" fill="#1b2a3a">spectra coincide</text>

  <!-- caption -->
  <text x="450" y="392" text-anchor="middle" font-size="14" fill="#1b2a3a">same chemistry, different baseline → after correction they land on top of each other</text>
</svg>
