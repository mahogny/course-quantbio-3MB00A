<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16.0 121.9 902.4 302.3" font-family="Helvetica, Arial, sans-serif" width="902.4" height="302.3">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shared axis labels -->
  <text x="20" y="230" font-size="14" fill="#1b2a3a" transform="rotate(-90 20 230)" text-anchor="middle">absorbance</text>

  <!-- ============ PANEL 1 : s1 glucose (blue) ============ -->
  <g transform="translate(50,300)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="6" x2="0" y2="-135" stroke="#c9d3dd" stroke-width="1.5"/>
    <polyline fill="#eaf1f7" stroke="none" opacity="0.7"
      points="0,0 0.0,-3.4 4.7,-7.7 11.7,-21.0 21.0,-49.1 28.0,-64.9 30.3,-66.5 35.0,-62.9 42.0,-44.8 49.0,-23.4 58.3,-6.1 70.0,-0.5 140,0"/>
    <polyline fill="none" stroke="#2a6f97" stroke-width="2.2"
      points="0.0,-3.4 2.3,-5.2 4.7,-7.7 7.0,-11.2 9.3,-15.6 11.7,-21.0 14.0,-27.3 16.3,-34.4 18.7,-41.8 21.0,-49.1 23.3,-55.8 25.7,-61.2 28.0,-64.9 30.3,-66.5 32.7,-65.8 35.0,-62.9 37.3,-58.1 39.7,-51.9 42.0,-44.8 44.3,-37.4 46.7,-30.1 49.0,-23.4 51.3,-17.6 53.7,-12.8 56.0,-9.0 58.3,-6.1 60.7,-4.0 63.0,-2.5 65.3,-1.6 67.7,-0.9 70.0,-0.5 74.7,-0.2 81.7,0 140,0"/>
    <text x="70" y="-108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">c1 · s1</text>
    <text x="70" y="20" text-anchor="middle" font-size="12.5" fill="#1b2a3a">glucose</text>
  </g>

  <text x="205" y="230" text-anchor="middle" font-size="30" fill="#1b2a3a">+</text>

  <!-- ============ PANEL 2 : s2 lactate (red) ============ -->
  <g transform="translate(230,300)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="6" x2="0" y2="-135" stroke="#c9d3dd" stroke-width="1.5"/>
    <polyline fill="#eaf1f7" stroke="none" opacity="0.7"
      points="0,0 18.7,-0.1 39.7,-6.0 49.0,-20.5 58.3,-44.5 67.7,-62.1 70.0,-63.0 74.7,-59.6 84.0,-38.2 93.3,-15.7 105.0,-2.8 121.3,-0.1 140,0"/>
    <polyline fill="none" stroke="#bc4749" stroke-width="2.2"
      points="18.7,-0.1 21.0,-0.1 23.3,-0.2 25.7,-0.4 28.0,-0.7 30.3,-1.1 32.7,-1.8 35.0,-2.8 37.3,-4.1 39.7,-6.0 42.0,-8.5 44.3,-11.7 46.7,-15.7 49.0,-20.5 51.3,-25.9 53.7,-31.9 56.0,-38.2 58.3,-44.5 60.7,-50.4 63.0,-55.6 65.3,-59.6 67.7,-62.1 70.0,-63.0 72.3,-62.1 74.7,-59.6 77.0,-55.6 79.3,-50.4 81.7,-44.5 84.0,-38.2 86.3,-31.9 88.7,-25.9 91.0,-20.5 93.3,-15.7 95.7,-11.7 98.0,-8.5 100.3,-6.0 102.7,-4.1 105.0,-2.8 107.3,-1.8 109.7,-1.1 112.0,-0.7 114.3,-0.4 116.7,-0.2 119.0,-0.1 123.7,0 140,0"/>
