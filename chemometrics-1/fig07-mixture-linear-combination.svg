    <polyline fill="none" stroke="#2a6f97" stroke-width="1.4" opacity="0.55" stroke-dasharray="4 3"
      points="0.0,-5.4 8.7,-12.4 17.3,-24.9 26.0,-43.7 34.7,-66.9 43.3,-89.3 52.0,-103.8 56.3,-106.3 60.7,-105.2 69.3,-93.0 78.0,-71.7 86.7,-48.2 95.3,-28.2 104.0,-14.4 112.7,-6.4 121.3,-2.5 130.0,-0.8 143.0,-0.1 260,0"/>
    <polyline fill="none" stroke="#bc4749" stroke-width="1.4" opacity="0.55" stroke-dasharray="4 3"
      points="0,0 43.3,-0.3 65.0,-3.3 78.0,-10.2 91.0,-24.5 104.0,-45.9 117.0,-66.7 125.7,-74.6 130.0,-75.6 134.3,-74.6 143.0,-66.7 156.0,-45.9 169.0,-24.5 182.0,-10.2 195.0,-3.3 208.0,-0.8 225.3,-0.1 260,0"/>
    <polyline fill="none" stroke="#6a994e" stroke-width="1.4" opacity="0.55" stroke-dasharray="4 3"
      points="0.0,-0.1 21.7,-0.5 43.3,-1.8 65.0,-5.3 86.7,-12.9 108.3,-26.4 130.0,-45.5 151.7,-66.0 169.0,-78.4 186.3,-83.3 199.3,-81.1 212.3,-74.1 229.7,-59.7 247.0,-43.0 260.0,-31.3"/>

    <!-- bold measured mixture curve = sum -->
    <polyline fill="none" stroke="#1b2a3a" stroke-width="3"
      points="0.0,-5.5 4.3,-8.5 8.7,-12.6 13.0,-18.2 17.3,-25.3 21.7,-34.1 26.0,-44.4 30.3,-56.0 34.7,-68.1 39.0,-80.2 43.3,-91.4 47.7,-100.7 52.0,-107.5 56.3,-111.2 60.7,-111.7 65.0,-109.2 69.3,-104.4 73.7,-98.0 78.0,-91.1 82.3,-84.7 86.7,-79.9 91.0,-77.1 95.3,-76.8 99.7,-79.0 104.0,-83.4 108.3,-89.6 112.7,-96.8 117.0,-104.3 121.3,-111.3 125.7,-117.4 130.0,-121.9 134.3,-124.7 138.7,-125.7 143.0,-124.9 147.3,-122.7 151.7,-119.4 156.0,-115.4 160.3,-111.2 164.7,-106.9 169.0,-102.9 173.3,-99.2 177.7,-96.0 182.0,-93.1 186.3,-90.5 190.7,-88.1 195.0,-85.7 199.3,-83.2 203.7,-80.6 208.0,-77.7 212.3,-74.6 216.7,-71.2 221.0,-67.6 225.3,-63.8 229.7,-59.7 234.0,-55.6 238.3,-51.4 242.7,-47.2 247.0,-43.0 251.3,-38.9 255.7,-35.0 260.0,-31.3"/>

    <text x="130" y="-133" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">measured mixture  x</text>
    <text x="260" y="22" text-anchor="end" font-size="13" fill="#1b2a3a">wavelength λ  →</text>
  </g>

  <!-- shared wavelength label under the pure panels -->
  <text x="270" y="345" text-anchor="middle" font-size="13" fill="#1b2a3a">wavelength λ  →</text>

  <!-- caption -->
  <text x="440" y="378" text-anchor="middle" font-size="13.5" fill="#1b2a3a">a measured spectrum is a linear combination of pure-component spectra, weighted by concentrations</text>
  <text x="440" y="396" text-anchor="middle" font-size="13.5" fill="#2a6f97">recovering the c_i is the calibration problem</text>
</svg>
