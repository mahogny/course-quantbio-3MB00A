    <text x="70" y="20" text-anchor="middle" font-size="12.5" fill="#1b2a3a">lactate</text>
  </g>

  <text x="385" y="230" text-anchor="middle" font-size="30" fill="#1b2a3a">+</text>

  <!-- ============ PANEL 3 : s3 water (green) broad ============ -->
  <g transform="translate(410,300)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="6" x2="0" y2="-135" stroke="#c9d3dd" stroke-width="1.5"/>
    <polyline fill="#eaf1f7" stroke="none" opacity="0.7"
      points="0,0 0.0,-0.1 30.3,-2.5 49.0,-10.7 65.3,-26.7 84.0,-49.7 100.3,-59.5 116.7,-50.7 133.0,-30.7 140.0,-22.3 140,0"/>
    <polyline fill="none" stroke="#6a994e" stroke-width="2.2"
      points="0.0,-0.1 4.7,-0.2 9.3,-0.3 14.0,-0.5 18.7,-0.8 23.3,-1.3 28.0,-2.0 32.7,-3.1 37.3,-4.6 42.0,-6.6 46.7,-9.2 51.3,-12.5 56.0,-16.5 60.7,-21.3 65.3,-26.7 70.0,-32.5 74.7,-38.5 79.3,-44.3 84.0,-49.7 88.7,-54.2 93.3,-57.4 98.0,-59.2 100.3,-59.5 105.0,-58.8 109.7,-56.6 114.3,-52.9 119.0,-48.2 123.7,-42.6 128.3,-36.7 133.0,-30.7 137.7,-25.0 140.0,-22.3"/>
    <text x="70" y="-108" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a994e">c3 · s3</text>
    <text x="70" y="20" text-anchor="middle" font-size="12.5" fill="#1b2a3a">water</text>
  </g>

  <text x="565" y="228" text-anchor="middle" font-size="30" fill="#1b2a3a">=</text>

  <!-- ============ PANEL 4 : measured mixture x (superposition) ============ -->
  <g transform="translate(600,300)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#1b2a3a" stroke-width="1.8"/>
    <line x1="0" y1="6" x2="0" y2="-150" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- filled summed mixture -->
    <polygon fill="#eaf1f7" stroke="none"
      points="0,0 0.0,-5.5 13.0,-18.2 26.0,-44.4 39.0,-80.2 52.0,-107.5 60.7,-111.7 73.7,-98.0 91.0,-77.1 99.7,-79.0 112.7,-96.8 125.7,-117.4 138.7,-125.7 151.7,-119.4 169.0,-102.9 190.7,-88.1 212.3,-74.6 234.0,-55.6 260.0,-31.3 260,0"/>

