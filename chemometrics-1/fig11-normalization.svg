<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: before -->
  <text x="195" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">before</text>

  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="290" stroke="#1b2a3a" stroke-width="2" marker-start="url(#arrow)"/>
  <line x1="70" y1="290" x2="320" y2="290" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="312" text-anchor="middle" font-size="14" fill="#1b2a3a">wavelength</text>
  <text x="48" y="175" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 48 175)">absorbance</text>

  <!-- tall spectrum (2x) -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2"
    points="80,260 110,220 140,150 170,200 200,130 230,210 260,240 290,255"/>
  <!-- short spectrum (1x) same shape -->
  <polyline fill="none" stroke="#bc4749" stroke-width="2"
    points="80,270 110,250 140,215 170,240 200,205 230,245 260,260 290,268"/>

  <text x="205" y="92" text-anchor="middle" font-size="12.5" fill="#2a6f97">longer path / denser</text>
  <text x="210" y="116" text-anchor="middle" font-size="12.5" fill="#bc4749">shorter path / diluter</text>
  <text x="195" y="352" text-anchor="middle" font-size="13.5" fill="#1b2a3a" font-style="italic">differ only by an overall scale factor (≈2×)</text>

  <!-- TRANSFORMATION ARROW -->
  <line x1="345" y1="175" x2="535" y2="175" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="440" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">divide each spectrum</text>
  <text x="440" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">by its length ||x||</text>
  <text x="354" y="160" font-size="12.5" fill="#2a6f97">(vector / L<tspan font-size="9" dy="3">2</tspan><tspan dy="-3"> normalization)</tspan></text>

  <!-- RIGHT PANEL: after -->
  <text x="715" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">after</text>

  <line x1="590" y1="60" x2="590" y2="290" stroke="#1b2a3a" stroke-width="2" marker-start="url(#arrow)"/>
  <line x1="590" y1="290" x2="840" y2="290" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="312" text-anchor="middle" font-size="14" fill="#1b2a3a">wavelength</text>
  <text x="568" y="175" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 568 175)">absorbance</text>

  <!-- both spectra now coincide at unit scale: draw two overlapping curves slightly offset for visibility -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="3.2"
    points="600,238 630,205 660,150 690,190 720,132 750,197 780,225 810,244"/>
  <polyline fill="none" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="5 4"
    points="600,238 630,205 660,150 690,190 720,132 750,197 780,225 810,244"/>

  <text x="715" y="352" text-anchor="middle" font-size="12.5" fill="#6a994e" font-weight="bold">each spectrum now has length 1 — they coincide</text>

  <!-- INSET: vectors collapsing onto unit circle -->
  <g>
    <text x="435" y="248" text-anchor="middle" font-size="12" fill="#1b2a3a">norm = vector length</text>
    <circle cx="415" cy="320" r="40" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- two source arrows, different lengths, same direction -->
    <line x1="415" y1="320" x2="466" y2="284" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowb)"/>
    <line x1="415" y1="320" x2="438" y2="304" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowr)"/>
    <!-- collapsed unit arrow landing on circle -->
    <line x1="415" y1="320" x2="447" y2="298" stroke="#6a994e" stroke-width="2.6" marker-end="url(#arrowg)"/>
    <text x="472" y="332" font-size="11.5" fill="#6a994e">length 1</text>
  </g>

  <!-- CAPTION -->
  <text x="210" y="398" font-size="14.5" fill="#1b2a3a">after normalization, spectra differ by <tspan font-weight="bold">shape (composition)</tspan>, not intensity</text>
</svg>
