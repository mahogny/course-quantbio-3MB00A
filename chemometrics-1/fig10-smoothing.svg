<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.8 18 885.3 324" font-family="Helvetica, Arial, sans-serif" width="885.3" height="324">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===================== PANEL 1: NOISY ===================== -->
  <g transform="translate(50,0)">
    <text x="115" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">noisy</text>

    <!-- grid -->
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="57" y1="80" x2="57" y2="258"/>
      <line x1="115" y1="80" x2="115" y2="258"/>
      <line x1="172" y1="80" x2="172" y2="258"/>
    </g>
    <!-- axes -->
    <line x1="0" y1="80" x2="0" y2="258" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="0" y1="258" x2="238" y2="258" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- noisy spectrum: true smooth shape buried under jagged wiggle -->
    <path d="M0.0 258.1 L2.0 261.0 L4.0 249.0 L6.0 260.4 L8.0 248.9 L10.0 251.1 L12.0 256.2 L14.0 244.5 L16.0 252.7 L18.0 241.7 L20.0 247.2 L22.0 244.0 L24.0 233.8 L26.0 221.8 L28.0 233.9 L30.0 228.2 L32.0 215.8 L34.0 205.0 L36.0 209.3 L38.0 209.3 L40.0 192.7 L42.0 209.3 L44.0 187.7 L46.0 196.5 L48.0 196.3 L50.0 193.6 L52.0 186.5 L54.0 172.8 L56.0 184.5 L58.0 173.8 L60.0 171.2 L62.0 176.1 L64.0 171.7 L66.0 182.4 L68.0 182.9 L70.0 180.6 L72.0 171.6 L74.0 178.9 L76.0 183.5 L78.0 180.1 L80.0 185.8 L82.0 192.2 L84.0 184.6 L86.0 190.2 L88.0 203.6 L90.0 200.0 L92.0 204.7 L94.0 200.5 L96.0 207.2 L98.0 220.3 L100.0 208.3 L102.0 230.3 L104.0 226.6 L106.0 221.9 L108.0 237.7 L110.0 232.6 L112.0 244.5 L114.0 232.5 L116.0 232.1 L118.0 237.6 L120.0 232.0 L122.0 244.9 L124.0 236.3 L126.0 237.0 L128.0 233.8 L130.0 230.1 L132.0 211.5 L134.0 194.8 L136.0 187.1 L138.0 162.8 L140.0 156.5 L142.0 127.0 L144.0 119.7 L146.0 112.6 L148.0 125.5 L150.0 153.3 L152.0 170.7 L154.0 184.5 L156.0 216.3 L158.0 220.6 L160.0 236.7 L162.0 243.9 L164.0 248.3 L166.0 233.9 L168.0 247.8 L170.0 244.2 L172.0 239.5 L174.0 227.0 L176.0 242.0 L178.0 231.3 L180.0 226.2 L182.0 215.8 L184.0 213.9 L186.0 209.5 L188.0 218.9 L190.0 212.6 L192.0 210.7 L194.0 196.4 L196.0 192.5 L198.0 208.3 L200.0 206.5 L202.0 204.7 L204.0 204.7 L206.0 199.9 L208.0 198.9 L210.0 207.9 L212.0 215.9 L214.0 209.5 L216.0 213.5 L218.0 212.3 L220.0 206.9 L222.0 215.7 L224.0 222.4 L226.0 222.9 L228.0 224.1 L230.0 239.9"
          fill="none" stroke="#bc4749" stroke-width="1.5" opacity="0.9"/>

    <!-- sliding window box (5 points) -->
    <rect x="181" y="186" width="18" height="42" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <!-- the 5 sample points inside the window -->
    <g fill="#1b2a3a">
      <circle cx="182" cy="215.8" r="2.2"/>
      <circle cx="186" cy="209.5" r="2.2"/>
      <circle cx="194" cy="196.4" r="2.2"/>
      <circle cx="198" cy="208.3" r="2.2"/>
    </g>
    <!-- centre point: replaced by the window mean -->
    <circle cx="190" cy="212.6" r="2.6" fill="#bc4749" opacity="0.5"/>
    <circle cx="190" cy="208.6" r="3.6" fill="#6a994e"/>
    <text x="190" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a6f97">window = 5</text>

    <!-- instruction arrow -->
    <line x1="150" y1="128" x2="190" y2="204" stroke="#6a994e" stroke-width="1.8" marker-end="url(#arrowG)"/>
    <text x="80" y="112" text-anchor="middle" font-size="11.5" fill="#6a994e">replace centre point</text>
    <text x="80" y="126" text-anchor="middle" font-size="11.5" fill="#6a994e">with window mean</text>

    <text x="115" y="276" text-anchor="middle" font-size="12" fill="#1b2a3a">wavelength &#8594;</text>
  </g>

  <!-- shared y-axis label (leftmost) -->
  <text x="34" y="169" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 34 169)">absorbance</text>

  <!-- ===================== PANEL 2: SMOOTHED (JUST RIGHT) ===================== -->
  <g transform="translate(330,0)">
    <text x="115" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">smoothed (just right)</text>

    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="57" y1="80" x2="57" y2="258"/>
      <line x1="115" y1="80" x2="115" y2="258"/>
      <line x1="172" y1="80" x2="172" y2="258"/>
    </g>
    <line x1="0" y1="80" x2="0" y2="258" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="0" y1="258" x2="238" y2="258" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- faint ghost of the noisy trace to show what was removed -->
    <path d="M0.0 258.1 L4.0 249.0 L8.0 248.9 L12.0 256.2 L16.0 252.7 L20.0 247.2 L24.0 233.8 L28.0 233.9 L32.0 215.8 L36.0 209.3 L40.0 192.7 L44.0 187.7 L48.0 196.3 L52.0 186.5 L56.0 184.5 L60.0 171.2 L64.0 171.7 L68.0 182.9 L72.0 171.6 L76.0 183.5 L80.0 185.8 L84.0 184.6 L88.0 203.6 L92.0 204.7 L96.0 207.2 L100.0 208.3 L104.0 226.6 L108.0 237.7 L112.0 244.5 L116.0 232.1 L120.0 232.0 L124.0 236.3 L128.0 233.8 L132.0 211.5 L136.0 187.1 L140.0 156.5 L144.0 119.7 L148.0 125.5 L152.0 170.7 L156.0 216.3 L160.0 236.7 L164.0 248.3 L168.0 247.8 L172.0 239.5 L176.0 242.0 L180.0 226.2 L184.0 213.9 L188.0 218.9 L192.0 210.7 L196.0 192.5 L200.0 206.5 L204.0 204.7 L208.0 198.9 L212.0 215.9 L216.0 213.5 L220.0 206.9 L224.0 222.4 L228.0 224.1 L230.0 239.9"
          fill="none" stroke="#bc4749" stroke-width="1" opacity="0.18"/>

    <!-- clean smoothed spectrum, peak preserved -->
    <path d="M0.0 254.2 L3.8 252.4 L7.7 250.0 L11.5 246.9 L15.3 243.3 L19.2 238.8 L23.0 233.6 L26.8 227.6 L30.7 221.0 L34.5 213.8 L38.3 206.4 L42.2 199.0 L46.0 191.9 L49.8 185.5 L53.7 180.1 L57.5 176.0 L61.3 173.5 L65.2 172.7 L69.0 173.6 L72.8 176.2 L76.7 180.3 L80.5 185.5 L84.3 191.7 L88.2 198.3 L92.0 205.2 L95.8 212.0 L99.7 218.3 L103.5 224.1 L107.3 229.2 L111.2 233.5 L115.0 237.1 L118.8 239.7 L122.7 240.9 L126.5 238.4 L130.3 227.7 L134.2 203.2 L138.0 166.4 L141.8 132.4 L145.7 122.7 L149.5 144.1 L153.3 181.7 L157.2 214.5 L161.0 232.9 L164.8 239.3 L168.7 239.4 L172.5 236.6 L176.3 232.4 L180.2 227.0 L184.0 220.9 L187.8 214.3 L191.7 208.1 L195.5 203.0 L199.3 199.8 L203.2 198.7 L207.0 200.1 L210.8 203.6 L214.7 208.7 L218.5 214.5 L222.3 220.4 L226.2 225.7 L230.0 230.1"
          fill="none" stroke="#6a994e" stroke-width="2.4"/>

    <!-- highlight preserved peak -->
    <circle cx="145.7" cy="122.7" r="4" fill="none" stroke="#6a994e" stroke-width="1.8"/>
    <line x1="176" y1="103" x2="150" y2="125" stroke="#6a994e" stroke-width="1.4" marker-end="url(#arrowG)"/>
    <text x="205" y="98" text-anchor="middle" font-size="11.5" fill="#6a994e">peak kept</text>

    <text x="70" y="98" text-anchor="middle" font-size="11.5" fill="#1b2a3a">Savitzky-Golay</text>
    <text x="70" y="112" text-anchor="middle" font-size="11.5" fill="#1b2a3a">preserves peak shape</text>

    <text x="115" y="276" text-anchor="middle" font-size="12" fill="#1b2a3a">wavelength &#8594;</text>
  </g>

  <!-- ===================== PANEL 3: OVER-SMOOTHED ===================== -->
  <g transform="translate(610,0)">
    <text x="115" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">over-smoothed</text>

    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="57" y1="80" x2="57" y2="258"/>
      <line x1="115" y1="80" x2="115" y2="258"/>
      <line x1="172" y1="80" x2="172" y2="258"/>
    </g>
    <line x1="0" y1="80" x2="0" y2="258" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="0" y1="258" x2="238" y2="258" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- original narrow peak, dashed behind -->
    <path d="M0.0 254.2 L3.8 252.4 L7.7 250.0 L11.5 246.9 L15.3 243.3 L19.2 238.8 L23.0 233.6 L26.8 227.6 L30.7 221.0 L34.5 213.8 L38.3 206.4 L42.2 199.0 L46.0 191.9 L49.8 185.5 L53.7 180.1 L57.5 176.0 L61.3 173.5 L65.2 172.7 L69.0 173.6 L72.8 176.2 L76.7 180.3 L80.5 185.5 L84.3 191.7 L88.2 198.3 L92.0 205.2 L95.8 212.0 L99.7 218.3 L103.5 224.1 L107.3 229.2 L111.2 233.5 L115.0 237.1 L118.8 239.7 L122.7 240.9 L126.5 238.4 L130.3 227.7 L134.2 203.2 L138.0 166.4 L141.8 132.4 L145.7 122.7 L149.5 144.1 L153.3 181.7 L157.2 214.5 L161.0 232.9 L164.8 239.3 L168.7 239.4 L172.5 236.6 L176.3 232.4 L180.2 227.0 L184.0 220.9 L187.8 214.3 L191.7 208.1 L195.5 203.0 L199.3 199.8 L203.2 198.7 L207.0 200.1 L210.8 203.6 L214.7 208.7 L218.5 214.5 L222.3 220.4 L226.2 225.7 L230.0 230.1"
          fill="none" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/>

    <!-- over-smoothed spectrum: narrow peak flattened away, drawn faint -->
    <path d="M0.0 254.2 L3.8 252.4 L7.7 250.0 L11.5 246.9 L15.3 243.3 L19.2 238.8 L23.0 233.6 L26.8 227.6 L30.7 221.0 L34.5 213.8 L38.3 206.4 L42.2 199.0 L46.0 191.9 L49.8 185.5 L53.7 180.1 L57.5 176.0 L61.3 173.5 L65.2 172.7 L69.0 173.6 L72.8 176.2 L76.7 180.2 L80.5 185.5 L84.3 191.6 L88.2 198.2 L92.0 205.0 L95.8 211.6 L99.7 217.6 L103.5 222.9 L107.3 227.3 L111.2 230.6 L115.0 232.8 L118.8 233.9 L122.7 234.0 L126.5 233.3 L130.3 232.1 L134.2 230.7 L138.0 229.3 L141.8 228.3 L145.7 227.7 L149.5 227.5 L153.3 227.6 L157.2 227.9 L161.0 227.9 L164.8 227.5 L168.7 226.4 L172.5 224.5 L176.3 221.7 L180.2 218.2 L184.0 214.4 L187.8 210.4 L191.7 206.9 L195.5 204.0 L199.3 202.2 L203.2 201.6 L207.0 202.2 L210.8 204.1 L214.7 207.1 L218.5 210.7 L222.3 214.8 L226.2 219.0 L230.0 223.0"
          fill="none" stroke="#8aa0b3" stroke-width="2.4"/>

    <!-- annotate the erased peak -->
    <line x1="145.7" y1="119" x2="145.7" y2="224" stroke="#bc4749" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="176" y1="150" x2="147" y2="124" stroke="#bc4749" stroke-width="1.4" marker-end="url(#arrowR)"/>
    <text x="203" y="150" text-anchor="middle" font-size="11.5" fill="#bc4749">real peak</text>
    <line x1="178" y1="242" x2="160" y2="229" stroke="#8aa0b3" stroke-width="1.4"/>
    <text x="208" y="246" text-anchor="middle" font-size="11.5" fill="#8aa0b3">flattened</text>

    <text x="82" y="105" text-anchor="middle" font-size="11.5" fill="#bc4749">too much smoothing</text>
    <text x="82" y="119" text-anchor="middle" font-size="11.5" fill="#bc4749">erases narrow peaks</text>

    <text x="115" y="276" text-anchor="middle" font-size="12" fill="#1b2a3a">wavelength &#8594;</text>
  </g>

  <!-- ===================== bottom caption ===================== -->
  <line x1="60" y1="306" x2="820" y2="306" stroke="#c9d3dd" stroke-width="1"/>
  <text x="440" y="328" text-anchor="middle" font-size="14" fill="#1b2a3a">trade-off: too little leaves noise, too much erases signal &#8212; <tspan font-style="italic" fill="#2a6f97">tune the window</tspan></text>
</svg>
