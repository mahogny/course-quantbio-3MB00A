<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.4 18.0 903.0 422.9" font-family="Helvetica, Arial, sans-serif" width="903.0" height="422.9">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===================== THE GREEDY LOOP (2x2) ===================== -->

  <!-- Box 1: find direction w1 -->
  <rect x="40" y="45" width="280" height="110" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="60" cy="65" r="12" fill="#2a6f97"/>
  <text x="60" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="80" y="63" font-size="14" font-weight="bold" fill="#1b2a3a">Find direction w1</text>
  <text x="80" y="83" font-size="13" fill="#1b2a3a">in wavelength space:</text>
  <text x="80" y="102" font-size="13" fill="#1b2a3a">max covariance of</text>
  <text x="80" y="121" font-size="13" fill="#1b2a3a">spectral variation</text>
  <text x="80" y="140" font-size="13" fill="#1b2a3a">with y</text>
  <!-- inset: spectrum wiggle plus a direction arrow -->
  <path d="M240,130 C246,118 251,142 257,127 C263,113 269,139 275,124" fill="none" stroke="#6a994e" stroke-width="1.5"/>
  <line x1="242" y1="145" x2="312" y2="74" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrowblue)"/>
  <text x="300" y="70" font-size="13" font-style="italic" fill="#2a6f97">w1</text>

  <!-- arrow 1 to 2 -->
  <line x1="320" y1="100" x2="360" y2="100" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: project onto w1 -> score t1 -->
  <rect x="360" y="45" width="280" height="110" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="380" cy="65" r="12" fill="#2a6f97"/>
  <text x="380" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="400" y="63" font-size="14" font-weight="bold" fill="#1b2a3a">Project every</text>
  <text x="400" y="83" font-size="13" fill="#1b2a3a">spectrum onto w1</text>
  <text x="400" y="102" font-size="13" fill="#1b2a3a">→ score t1</text>
  <text x="400" y="121" font-size="13" fill="#1b2a3a">(one number</text>
  <text x="400" y="140" font-size="13" fill="#1b2a3a">per sample)</text>
  <!-- inset: a point projecting onto the w1 axis, giving a single dot -->
  <line x1="552" y1="140" x2="626" y2="78" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrowblue)"/>
  <text x="614" y="74" font-size="13" font-style="italic" fill="#2a6f97">w1</text>
  <line x1="572" y1="96" x2="585" y2="112" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="572" cy="96" r="3.5" fill="#1b2a3a"/>
  <circle cx="585" cy="112" r="4.5" fill="#6a994e"/>
  <text x="592" y="118" font-size="13" font-style="italic" fill="#6a994e">t1</text>

  <!-- arrow 2 to 3 -->
  <line x1="500" y1="155" x2="500" y2="195" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: regress y on t1 -->
  <rect x="360" y="195" width="280" height="110" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="380" cy="215" r="12" fill="#6a994e"/>
  <text x="380" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="400" y="213" font-size="14" font-weight="bold" fill="#1b2a3a">Regress y on t1</text>
  <text x="400" y="233" font-size="13" fill="#1b2a3a">(fit &amp; predict)</text>
  <!-- inset: tiny regression line y vs t1 -->
  <line x1="400" y1="290" x2="470" y2="290" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="400" y1="290" x2="400" y2="248" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="474" y="294" font-size="12" font-style="italic" fill="#1b2a3a">t1</text>
  <text x="388" y="252" font-size="12" font-style="italic" fill="#1b2a3a">y</text>
  <line x1="404" y1="285" x2="466" y2="255" stroke="#bc4749" stroke-width="2"/>
  <circle cx="414" cy="282" r="2.5" fill="#2a6f97"/>
  <circle cx="432" cy="273" r="2.5" fill="#2a6f97"/>
  <circle cx="450" cy="262" r="2.5" fill="#2a6f97"/>
  <circle cx="462" cy="257" r="2.5" fill="#2a6f97"/>

  <!-- arrow 3 to 4 -->
  <line x1="360" y1="250" x2="320" y2="250" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: deflate -->
  <rect x="40" y="195" width="280" height="110" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="60" cy="215" r="12" fill="#bc4749"/>
  <text x="60" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <text x="80" y="213" font-size="14" font-weight="bold" fill="#1b2a3a">Deflate</text>
  <text x="80" y="235" font-size="13" fill="#1b2a3a">remove what t1 explained</text>
  <text x="80" y="255" font-size="13" fill="#1b2a3a">from X and y; what is</text>
  <text x="80" y="275" font-size="13" fill="#1b2a3a">left is the residual for</text>
  <text x="80" y="295" font-size="13" fill="#1b2a3a">the next component</text>

  <!-- arrow 4 to 1 (loop back), labelled repeat -->
  <line x1="180" y1="195" x2="180" y2="157" stroke="#bc4749" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="196" y="180" font-size="13" font-style="italic" fill="#bc4749">repeat for w2, w3, …</text>

  <!-- ===================== SIDE NOTE ===================== -->
  <rect x="662" y="45" width="228" height="185" rx="8" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="676" y="70" font-size="13" font-weight="bold" fill="#1b2a3a">each component =</text>
  <text x="676" y="90" font-size="13" fill="#1b2a3a">a direction (vector) in</text>
  <text x="676" y="109" font-size="13" fill="#1b2a3a">p-dimensional spectral</text>
  <text x="676" y="128" font-size="13" fill="#1b2a3a">space.</text>
  <text x="676" y="158" font-size="13" fill="#1b2a3a">The model collapses to a</text>
  <text x="676" y="177" font-size="13" fill="#1b2a3a">final coefficient vector b →</text>
  <text x="676" y="196" font-size="13" fill="#1b2a3a">prediction stays a</text>
  <text x="676" y="216" font-size="15" font-weight="bold" fill="#2a6f97">ŷ = b · x   (dot product)</text>

  <!-- ===================== THE ONE DIAL ===================== -->
  <line x1="40" y1="335" x2="890" y2="335" stroke="#c9d3dd" stroke-width="1"/>

  <!-- slider / dial glyph -->
  <line x1="130" y1="378" x2="470" y2="378" stroke="#c9d3dd" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="373" x2="150" y2="383" stroke="#c9d3dd" stroke-width="2"/>
  <line x1="220" y1="373" x2="220" y2="383" stroke="#c9d3dd" stroke-width="2"/>
  <line x1="360" y1="373" x2="360" y2="383" stroke="#c9d3dd" stroke-width="2"/>
  <line x1="430" y1="373" x2="430" y2="383" stroke="#c9d3dd" stroke-width="2"/>
  <circle cx="300" cy="378" r="11" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="300" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">number of components</text>
  <text x="130" y="402" text-anchor="middle" font-size="12" fill="#bc4749">too few</text>
  <text x="130" y="415" text-anchor="middle" font-size="12" fill="#bc4749">underfit</text>
  <text x="470" y="402" text-anchor="middle" font-size="12" fill="#bc4749">too many</text>
  <text x="470" y="415" text-anchor="middle" font-size="12" fill="#bc4749">refit noise</text>

  <!-- dial caption -->
  <text x="520" y="368" font-size="14" font-weight="bold" fill="#1b2a3a">the one dial you tune —</text>
  <text x="520" y="390" font-size="14" fill="#1b2a3a">chosen by cross-validation.</text>
</svg>
