<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.9 21.3 688.8 353.3" width="688.8" height="353.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="barrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL: spectrum plot ===================== -->

  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="240" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="70" y1="240" x2="350" y2="240" stroke="#1b2a3a" stroke-width="2"/>

  <!-- y absorbance grid ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="70" y1="150" x2="350" y2="150"/>
    <line x1="70" y1="60"  x2="350" y2="60"/>
  </g>
  <g font-size="11" fill="#1b2a3a" text-anchor="end">
    <text x="63" y="244">0</text>
    <text x="63" y="154">0.5</text>
    <text x="63" y="64">1.0</text>
  </g>

  <!-- discrete wavelength grid (vertical dashed lines at each sampled lambda) -->
  <g stroke="#c9d3dd" stroke-width="1" stroke-dasharray="3 3">
    <line x1="90"  y1="60" x2="90"  y2="240"/>
    <line x1="125" y1="60" x2="125" y2="240"/>
    <line x1="160" y1="60" x2="160" y2="240"/>
    <line x1="195" y1="60" x2="195" y2="240"/>
    <line x1="230" y1="60" x2="230" y2="240"/>
    <line x1="265" y1="60" x2="265" y2="240"/>
    <line x1="300" y1="60" x2="300" y2="240"/>
    <line x1="335" y1="60" x2="335" y2="240"/>
  </g>

  <!-- x-axis tick marks -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="90"  y1="240" x2="90"  y2="246"/>
    <line x1="125" y1="240" x2="125" y2="246"/>
    <line x1="160" y1="240" x2="160" y2="246"/>
    <line x1="195" y1="240" x2="195" y2="246"/>
    <line x1="230" y1="240" x2="230" y2="246"/>
    <line x1="265" y1="240" x2="265" y2="246"/>
    <line x1="300" y1="240" x2="300" y2="246"/>
    <line x1="335" y1="240" x2="335" y2="246"/>
  </g>

  <!-- smooth wiggly spectrum passing exactly through the sampled dots -->
  <path d="M90,218.4
           C95.83,208.5 113.33,178.8 125,159
           C136.67,139.2 148.33,104.7 160,99.6
           C171.67,94.5 183.33,114.0 195,128.4
           C206.67,142.8 218.33,183.9 230,186
           C241.67,188.1 253.33,144.0 265,141
           C276.67,138.0 288.33,160.8 300,168
           C311.67,175.2 329.17,181.5 335,184.2"
        fill="none" stroke="#2a6f97" stroke-width="2"/>

  <!-- sampled values: solid dots exactly on the grid wavelengths -->
  <g fill="#bc4749">
    <circle cx="90"  cy="218.4" r="4.5"/>
    <circle cx="125" cy="159"   r="4.5"/>
    <circle cx="160" cy="99.6"  r="4.5"/>
    <circle cx="195" cy="128.4" r="4.5"/>
    <circle cx="230" cy="186"   r="4.5"/>
    <circle cx="265" cy="141"   r="4.5"/>
    <circle cx="300" cy="168"   r="4.5"/>
    <circle cx="335" cy="184.2" r="4.5"/>
  </g>

  <!-- x tick labels -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="middle">
    <text x="90"  y="262">λ1</text>
    <text x="125" y="262">λ2</text>
    <text x="160" y="262">λ3</text>
    <text x="248" y="262" fill="#2a6f97">…</text>
    <text x="335" y="262">λp</text>
  </g>

  <!-- axis titles -->
  <text x="210" y="285" font-size="14" fill="#1b2a3a" text-anchor="middle">wavelength</text>
  <text x="40" y="150" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 40 150)">absorbance</text>

  <!-- ===================== connector arrows (first three dots to entries) ===================== -->
  <g fill="none" stroke="#2a6f97" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#barrow)">
    <path d="M90,218.4  Q300,30 512,88"/>
    <path d="M125,159   Q320,55 512,124"/>
    <path d="M160,99.6  Q340,72 512,159"/>
  </g>

  <!-- ===================== RIGHT PANEL: column vector ===================== -->

  <!-- title -->
  <text x="562" y="52" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">x =</text>

  <!-- big brackets -->
  <path d="M528,70 L520,70 L520,300 L528,300" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <path d="M614,70 L622,70 L622,300 L614,300" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- entries -->
  <g font-size="14.5" fill="#1b2a3a" text-anchor="middle">
    <text x="571" y="93">A(λ1) = 0.12</text>
    <text x="571" y="129">A(λ2) = 0.45</text>
    <text x="571" y="164">A(λ3) = 0.78</text>
    <text x="571" y="215" font-size="20" fill="#2a6f97">⋮</text>
    <text x="571" y="258">A(λp) = 0.31</text>
  </g>

  <!-- membership label -->
  <text x="640" y="192" font-size="16" fill="#6a994e" font-weight="bold">∈ R^p</text>

  <!-- ===================== bottom caption ===================== -->
  <text x="360" y="330" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="bold">each wavelength = one coordinate</text>
  <text x="360" y="352" font-size="12.5" fill="#1b2a3a" text-anchor="middle">a spectrum = one point in p-dimensional space (p often several hundred to a few thousand)</text>
</svg>
