<svg xmlns="http://www.w3.org/2000/svg" width="928" height="420" viewBox="-28 0 928 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- panel divider -->
  <line x1="450" y1="24" x2="450" y2="356" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ============ LEFT PANEL: p >> n ============ -->
  <text x="235" y="42" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">p >> n</text>

  <!-- wide short matrix X (n rows, p columns) -->
  <rect x="40" y="88" width="200" height="54" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <!-- vertical grid lines (many columns = p) -->
  <line x1="60"  y1="88" x2="60"  y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="80"  y1="88" x2="80"  y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="100" y1="88" x2="100" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="120" y1="88" x2="120" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="140" y1="88" x2="140" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="160" y1="88" x2="160" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="180" y1="88" x2="180" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="200" y1="88" x2="200" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="220" y1="88" x2="220" y2="142" stroke="#c9d3dd" stroke-width="1"/>
  <!-- horizontal grid lines (few rows = n) -->
  <line x1="40" y1="106" x2="240" y2="106" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="40" y1="124" x2="240" y2="124" stroke="#c9d3dd" stroke-width="1"/>
  <text x="140" y="80" font-size="17" fill="#2a6f97" text-anchor="middle" font-weight="bold">X</text>
  <!-- n rows brace -->
  <text x="33" y="120" font-size="12.5" fill="#1b2a3a" text-anchor="end">n rows</text>
  <text x="33" y="135" font-size="11" fill="#1b2a3a" text-anchor="end">(samples)</text>
  <!-- p columns brace -->
  <text x="140" y="158" font-size="12.5" fill="#1b2a3a" text-anchor="middle">p columns (wavelengths)</text>

  <!-- arrow X -> XtX -->
  <line x1="248" y1="115" x2="292" y2="115" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="106" font-size="14" fill="#1b2a3a" text-anchor="middle">X^T X</text>

  <!-- p x p square matrix XtX -->
  <rect x="305" y="72" width="130" height="130" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <!-- faint grid 10x10 -->
  <line x1="318" y1="72" x2="318" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="331" y1="72" x2="331" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="344" y1="72" x2="344" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="357" y1="72" x2="357" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="370" y1="72" x2="370" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="383" y1="72" x2="383" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="396" y1="72" x2="396" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="409" y1="72" x2="409" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="422" y1="72" x2="422" y2="202" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="85"  x2="435" y2="85"  stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="98"  x2="435" y2="98"  stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="111" x2="435" y2="111" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="124" x2="435" y2="124" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="163" x2="435" y2="163" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="176" x2="435" y2="176" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="305" y1="189" x2="435" y2="189" stroke="#c9d3dd" stroke-width="0.8"/>
  <text x="370" y="66" font-size="13" fill="#1b2a3a" text-anchor="middle">p × p</text>

  <!-- singular stamp -->
  <rect x="311" y="118" width="118" height="40" rx="5" fill="#ffffff" fill-opacity="0.9" stroke="#bc4749" stroke-width="2"/>
  <text x="370" y="134" font-size="14" fill="#bc4749" text-anchor="middle" font-weight="bold">singular: det = 0</text>
  <text x="370" y="150" font-size="13" fill="#bc4749" text-anchor="middle">rank-deficient</text>

  <!-- left annotation -->
  <text x="235" y="238" font-size="14" fill="#1b2a3a" text-anchor="middle">more wavelengths than samples</text>
  <text x="235" y="258" font-size="14" fill="#bc4749" text-anchor="middle">→ infinitely many perfect fits</text>
  <text x="235" y="278" font-size="14" fill="#bc4749" text-anchor="middle" font-weight="bold">→ overfitting</text>

  <!-- ============ RIGHT PANEL: collinearity ============ -->
  <text x="675" y="42" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">collinearity</text>

  <!-- top: two nearly identical spectra curves -->
  <line x1="500" y1="150" x2="866" y2="150" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="866" y="168" font-size="12.5" fill="#1b2a3a" text-anchor="end">wavelength</text>
  <!-- curve lambda_(j+1) drawn first, tiny offset -->
  <path d="M502,120 C 540,72 576,132 616,78 S 690,138 742,86 S 828,118 862,100"
        fill="none" stroke="#6a994e" stroke-width="2.4" opacity="0.85"/>
  <!-- curve lambda_j nearly on top -->
  <path d="M502,124 C 540,76 576,136 616,82 S 690,142 742,90 S 828,122 862,104"
        fill="none" stroke="#2a6f97" stroke-width="2.4" opacity="0.9"/>
  <text x="676" y="66" font-size="14" fill="#2a6f97">λj</text>
  <text x="700" y="66" font-size="14" fill="#6a994e">λj+1</text>
  <text x="675" y="182" font-size="12.5" fill="#1b2a3a" text-anchor="middle">adjacent wavelengths nearly identical — spectra are smooth</text>

  <!-- bottom: scatterplot x_j vs x_(j+1) on 45 degree line -->
  <line x1="585" y1="345" x2="585" y2="212" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="345" x2="748" y2="345" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="204" font-size="13" fill="#1b2a3a" text-anchor="middle">xj+1</text>
  <text x="754" y="349" font-size="13" fill="#1b2a3a">xj</text>
  <!-- 45 degree reference line -->
  <line x1="588" y1="342" x2="738" y2="217" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="720" y="238" font-size="12" fill="#1b2a3a" text-anchor="end">45°</text>
  <!-- points hugging the line -->
  <circle cx="599" cy="331" r="4" fill="#bc4749"/>
  <circle cx="617" cy="316" r="4" fill="#bc4749"/>
  <circle cx="636" cy="298" r="4" fill="#bc4749"/>
  <circle cx="655" cy="283" r="4" fill="#bc4749"/>
  <circle cx="676" cy="264" r="4" fill="#bc4749"/>
  <circle cx="696" cy="249" r="4" fill="#bc4749"/>
  <circle cx="716" cy="231" r="4" fill="#bc4749"/>

  <!-- right annotation -->
  <text x="675" y="372" font-size="13.5" fill="#bc4749" text-anchor="middle">near-perfect correlation → X^T X near-singular</text>
  <text x="675" y="390" font-size="13.5" fill="#bc4749" text-anchor="middle" font-weight="bold">→ coefficients wildly unstable</text>

  <!-- ============ SPANNING CAPTION ============ -->
  <text x="450" y="411" font-size="15.5" fill="#6a994e" text-anchor="middle" font-weight="bold">need a method for many, correlated predictors → compress into a few directions first</text>
</svg>
