<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 -2 853 400" font-family="Helvetica, Arial, sans-serif" width="853" height="400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowBig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- === LEFT: bioreactor === -->
  <text x="215" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">bioreactor: cell-culture medium</text>

  <!-- vessel -->
  <rect x="110" y="55" width="210" height="230" rx="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- stippled suspended cells -->
  <g fill="#1b2a3a" opacity="0.55">
    <circle cx="140" cy="90" r="2.3"/><circle cx="175" cy="105" r="2.3"/><circle cx="210" cy="82" r="2.3"/>
    <circle cx="248" cy="100" r="2.3"/><circle cx="285" cy="88" r="2.3"/><circle cx="160" cy="135" r="2.3"/>
    <circle cx="128" cy="160" r="2.3"/><circle cx="200" cy="150" r="2.3"/><circle cx="235" cy="140" r="2.3"/>
    <circle cx="278" cy="152" r="2.3"/><circle cx="150" cy="185" r="2.3"/><circle cx="190" cy="200" r="2.3"/>
    <circle cx="225" cy="185" r="2.3"/><circle cx="262" cy="205" r="2.3"/><circle cx="295" cy="188" r="2.3"/>
    <circle cx="135" cy="222" r="2.3"/><circle cx="172" cy="240" r="2.3"/><circle cx="210" cy="228" r="2.3"/>
    <circle cx="250" cy="250" r="2.3"/><circle cx="288" cy="235" r="2.3"/><circle cx="158" cy="265" r="2.3"/>
    <circle cx="215" cy="268" r="2.3"/><circle cx="272" cy="272" r="2.3"/>
  </g>

  <!-- coloured molecule glyphs -->
  <circle cx="152" cy="118" r="6" fill="#bc4749"/>
  <circle cx="243" cy="172" r="6" fill="#6a994e"/>
  <path d="M182 214 l7 -10 l7 10 l-7 10 z" fill="#2a6f97"/>
  <circle cx="266" cy="118" r="5" fill="#7fb2d6"/>
  <circle cx="140" cy="252" r="6" fill="#bc4749"/>
  <path d="M300 218 l6 -9 l6 9 l-6 9 z" fill="#2a6f97"/>

  <!-- === light in (I0) === left of vessel -->
  <text x="55" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">light in</text>
  <text x="44" y="167" font-size="14" fill="#2a6f97">(I<tspan dy="3" font-size="10">0</tspan><tspan dy="-3">)</tspan></text>
  <!-- source box -->
  <rect x="30" y="180" width="34" height="34" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="47" y="202" text-anchor="middle" font-size="10" fill="#2a6f97">NIR</text>
  <!-- strong incoming beam arrows into vessel -->
  <line x1="66" y1="190" x2="108" y2="190" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowB)"/>
  <line x1="66" y1="200" x2="108" y2="200" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowB)"/>
  <line x1="66" y1="210" x2="108" y2="210" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowB)"/>

  <!-- === light out (I) === right of vessel, fainter/thinner -->
  <text x="378" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97" opacity="0.6">light out</text>
  <text x="378" y="167" text-anchor="middle" font-size="14" fill="#2a6f97" opacity="0.6">(I)</text>
  <line x1="322" y1="195" x2="360" y2="195" stroke="#2a6f97" stroke-width="1.2" opacity="0.55" marker-end="url(#arrowB)"/>
  <line x1="322" y1="205" x2="360" y2="205" stroke="#2a6f97" stroke-width="1.2" opacity="0.55" marker-end="url(#arrowB)"/>
  <!-- detector box -->
  <rect x="360" y="182" width="34" height="34" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="377" y="204" text-anchor="middle" font-size="10" fill="#1b2a3a">det.</text>

  <!-- legend -->
  <g font-size="12" fill="#1b2a3a">
    <circle cx="120" cy="315" r="6" fill="#bc4749"/><text x="132" y="319">glucose</text>
    <circle cx="120" cy="335" r="6" fill="#6a994e"/><text x="132" y="339">lactate</text>
    <path d="M114 353 l6 -9 l6 9 l-6 9 z" fill="#2a6f97"/><text x="132" y="359">protein</text>
    <circle cx="240" cy="315" r="5" fill="#7fb2d6"/><text x="252" y="319">water</text>
    <circle cx="240" cy="335" r="2.3" fill="#1b2a3a" opacity="0.55"/><text x="252" y="339">cells</text>
  </g>

  <!-- === large arrow to plot === -->
  <line x1="398" y1="199" x2="470" y2="199" stroke="#6a994e" stroke-width="5" marker-end="url(#arrowBig)"/>

  <!-- === RIGHT: plot panel === -->
  <!-- axes -->
  <line x1="510" y1="90" x2="510" y2="290" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="510" y1="290" x2="840" y2="290" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="90" x2="510" y2="80" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="565" y1="90" x2="565" y2="290"/>
    <line x1="620" y1="90" x2="620" y2="290"/>
    <line x1="675" y1="90" x2="675" y2="290"/>
    <line x1="730" y1="90" x2="730" y2="290"/>
    <line x1="785" y1="90" x2="785" y2="290"/>
  </g>

  <!-- x tick labels -->
  <g font-size="11" fill="#1b2a3a" text-anchor="middle">
    <text x="510" y="306">1000</text>
    <text x="620" y="306">1500</text>
    <text x="730" y="306">2000</text>
    <text x="840" y="306">2500</text>
  </g>
  <text x="675" y="326" text-anchor="middle" font-size="14" fill="#1b2a3a">wavelength (nm)</text>

  <!-- y axis label -->
  <text x="498" y="190" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 498 190)">absorbance A</text>

  <!-- NIR spectrum curve: broad overlapping humps -->
  <path d="M510 250
           C 540 230, 560 165, 590 168
           C 615 171, 630 235, 660 232
           C 685 229, 700 150, 735 158
           C 760 164, 775 210, 800 195
           C 815 186, 828 205, 838 200"
        fill="none" stroke="#bc4749" stroke-width="2.4"/>

  <!-- marker of glucose read-off band -->
  <line x1="590" y1="168" x2="590" y2="290" stroke="#2a6f97" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="590" cy="168" r="4" fill="#2a6f97"/>
  <text x="590" y="120" text-anchor="middle" font-size="11" fill="#2a6f97">glucose band</text>

  <!-- caption -->
  <text x="675" y="360" text-anchor="middle" font-size="13" fill="#1b2a3a">read glucose concentration off the spectrum</text>
  <text x="675" y="378" text-anchor="middle" font-size="13" font-style="italic" fill="#6a994e">fast, non-destructive</text>
</svg>
