<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.4 6.4 611.0 398.7" font-family="Helvetica, Arial, sans-serif" width="611.0" height="398.7">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="240.8" x2="560" y2="240.8"/>
    <line x1="90" y1="171.5" x2="560" y2="171.5"/>
    <line x1="90" y1="102.3" x2="560" y2="102.3"/>
  </g>

  <!-- y axis -->
  <line x1="90" y1="310" x2="90" y2="24" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- x axis -->
  <line x1="90" y1="310" x2="580" y2="310" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- y ticks and labels -->
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="82" y="314">0</text>
    <text x="82" y="245">1</text>
    <text x="82" y="176">2</text>
    <text x="82" y="107">3</text>
  </g>
  <text x="30" y="175" font-size="16" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 30 175)">density</text>

  <!-- x ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="90" y1="310" x2="90" y2="315"/>
    <line x1="184" y1="310" x2="184" y2="315"/>
    <line x1="278" y1="310" x2="278" y2="315"/>
    <line x1="372" y1="310" x2="372" y2="315"/>
    <line x1="466" y1="310" x2="466" y2="315"/>
    <line x1="560" y1="310" x2="560" y2="315"/>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="90" y="328">0</text>
    <text x="184" y="328">0.2</text>
    <text x="278" y="328">0.4</text>
    <text x="372" y="328">0.6</text>
    <text x="466" y="328">0.8</text>
    <text x="560" y="328">1</text>
  </g>
  <text x="585" y="326" font-size="18" fill="#1b2a3a" font-style="italic">p</text>

  <!-- Beta(1,1): flat uniform at density 1 -->
  <line x1="90" y1="240.8" x2="560" y2="240.8" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- Beta(2,8): informative, low -->
  <path fill="none" stroke="#2a6f97" stroke-width="2.5" stroke-linejoin="round"
    d="M 90.0,310.0 L 97.8,236.1 L 105.7,178.9 L 113.5,136.0 L 121.3,105.0 L 129.2,84.1 L 137.0,71.6 L 144.8,66.0 L 152.7,65.9 L 160.5,70.3 L 168.3,78.1 L 176.2,88.6 L 184.0,100.9 L 191.8,114.5 L 199.7,128.9 L 207.5,143.7 L 215.3,158.4 L 223.2,172.9 L 231.0,186.8 L 238.8,200.2 L 246.7,212.8 L 254.5,224.5 L 262.3,235.3 L 270.2,245.2 L 278.0,254.2 L 285.8,262.3 L 293.7,269.5 L 301.5,275.9 L 309.3,281.4 L 317.2,286.3 L 325.0,290.5 L 332.8,294.1 L 340.7,297.2 L 348.5,299.8 L 356.3,301.9 L 364.2,303.7 L 372.0,305.1 L 379.8,306.3 L 387.7,307.2 L 395.5,307.9 L 403.3,308.5 L 411.2,308.9 L 419.0,309.2 L 426.8,309.5 L 434.7,309.6 L 442.5,309.8 L 450.3,309.9 L 466.0,309.9 L 481.7,310.0 L 560.0,310.0"/>

  <!-- Beta(8,4): leans high -->
  <path fill="none" stroke="#bc4749" stroke-width="2.5" stroke-linejoin="round"
    d="M 90.0,310.0 L 152.7,310.0 L 176.2,309.7 L 191.8,309.0 L 207.5,307.6 L 219.2,305.9 L 231.0,303.1 L 242.8,299.2 L 254.5,293.9 L 266.2,286.7 L 278.0,277.7 L 289.8,266.5 L 301.5,253.2 L 313.2,237.9 L 325.0,220.8 L 336.8,202.3 L 348.5,183.2 L 360.2,164.2 L 372.0,146.3 L 383.8,130.5 L 395.5,117.9 L 403.3,111.9 L 411.2,108.1 L 419.0,106.8 L 426.8,108.2 L 434.7,112.4 L 442.5,119.4 L 450.3,129.3 L 458.2,141.8 L 466.0,156.7 L 473.8,173.6 L 481.7,191.9 L 489.5,211.1 L 497.3,230.4 L 505.2,249.1 L 513.0,266.3 L 520.8,281.2 L 528.7,293.3 L 536.5,302.0 L 544.3,307.3 L 552.2,309.6 L 560.0,310.0"/>

  <!-- legend -->
  <g font-size="13.5" fill="#1b2a3a">
    <rect x="90" y="345" width="490" height="52" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1" rx="4"/>
    <line x1="102" y1="358" x2="132" y2="358" stroke="#1b2a3a" stroke-width="2.5"/>
    <text x="140" y="362">Beta(1,1): uniform — no prior opinion</text>

    <line x1="102" y1="374" x2="132" y2="374" stroke="#2a6f97" stroke-width="2.5"/>
    <text x="140" y="378">Beta(2,8): informative, ~20% (earlier experiments)</text>

    <line x1="102" y1="390" x2="132" y2="390" stroke="#bc4749" stroke-width="2.5"/>
    <text x="140" y="394">Beta(8,4): leans high</text>
  </g>
</svg>
