<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.4 13.8 623.0 364.3" font-family="Helvetica, Arial, sans-serif" width="623.0" height="364.3">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Frequentist -->
  <text x="160" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Frequentist</text>

  <!-- axis -->
  <line x1="40" y1="200" x2="290" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ticks -->
  <line x1="50" y1="196" x2="50" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="280" y1="196" x2="280" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="50" y="222" text-anchor="middle" font-size="14" fill="#1b2a3a">0</text>
  <text x="280" y="222" text-anchor="middle" font-size="14" fill="#1b2a3a">1</text>
  <text x="298" y="205" font-size="17" font-style="italic" fill="#1b2a3a">p</text>

  <!-- single true value near p = 0.30 : x = 50 + 0.30*230 = 119 -->
  <line x1="119" y1="150" x2="119" y2="200" stroke="#1b2a3a" stroke-width="2"/>
  <circle cx="119" cy="150" r="7" fill="#1b2a3a"/>
  <text x="136" y="146" font-size="20" font-weight="bold" fill="#1b2a3a">?</text>

  <!-- sub-caption -->
  <text x="160" y="290" text-anchor="middle" font-size="13" fill="#1b2a3a">p is a fixed (but unknown)</text>
  <text x="160" y="308" text-anchor="middle" font-size="13" fill="#1b2a3a">single true value</text>
  <text x="160" y="326" text-anchor="middle" font-size="13" fill="#1b2a3a">— no distribution</text>

  <!-- divider -->
  <line x1="320" y1="60" x2="320" y2="330" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT PANEL: Bayesian -->
  <text x="480" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a6f97">Bayesian</text>

  <!-- axis (same length as left: 250 units) -->
  <line x1="360" y1="200" x2="610" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="196" x2="370" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="600" y1="196" x2="600" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="370" y="222" text-anchor="middle" font-size="14" fill="#1b2a3a">0</text>
  <text x="600" y="222" text-anchor="middle" font-size="14" fill="#1b2a3a">1</text>
  <text x="618" y="205" font-size="17" font-style="italic" fill="#1b2a3a">p</text>

  <!-- bell curve peaked near p = 0.30 : x = 370 + 0.30*230 = 439 -->
  <path d="M375,199
           C405,197 419,195 439,110
           C459,195 473,197 597,199 Z"
        fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- sub-caption -->
  <text x="480" y="290" text-anchor="middle" font-size="13" fill="#1b2a3a">p is uncertain —</text>
  <text x="480" y="308" text-anchor="middle" font-size="13" fill="#1b2a3a">described by a whole</text>
  <text x="480" y="326" text-anchor="middle" font-size="13" fill="#1b2a3a">distribution of belief</text>

  <!-- punchline -->
  <text x="160" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">a point</text>
  <text x="320" y="358" text-anchor="middle" font-size="14" fill="#1b2a3a">vs</text>
  <text x="480" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">a curve</text>
</svg>
