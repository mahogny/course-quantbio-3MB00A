<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.4 20 623.0 298" font-family="Helvetica, Arial, sans-serif" width="623.0" height="298">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Frequentist -->
  <text x="160" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Frequentist</text>

  <!-- axis -->
  <line x1="40" y1="180" x2="290" y2="180" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ticks -->
  <line x1="50" y1="176" x2="50" y2="184" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="280" y1="176" x2="280" y2="184" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="50" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a">0</text>
  <text x="280" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a">1</text>
  <text x="298" y="185" font-size="17" font-style="italic" fill="#1b2a3a">p</text>

  <!-- single true value near p = 0.30 : x = 50 + 0.30*230 = 119 -->
  <line x1="119" y1="100" x2="119" y2="180" stroke="#1b2a3a" stroke-width="2"/>
  <circle cx="119" cy="100" r="7" fill="#1b2a3a"/>
  <text x="136" y="96" font-size="20" font-weight="bold" fill="#1b2a3a">?</text>

  <!-- sub-caption -->
  <text x="160" y="232" text-anchor="middle" font-size="13" fill="#1b2a3a">p is a fixed (but unknown)</text>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="#1b2a3a">single true value</text>
  <text x="160" y="268" text-anchor="middle" font-size="13" fill="#1b2a3a">— no distribution</text>

  <!-- divider -->
  <line x1="320" y1="56" x2="320" y2="286" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT PANEL: Bayesian -->
  <text x="480" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a6f97">Bayesian</text>

  <!-- axis (same length as left: 250 units) -->
  <line x1="360" y1="180" x2="610" y2="180" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="176" x2="370" y2="184" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="600" y1="176" x2="600" y2="184" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="370" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a">0</text>
  <text x="600" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a">1</text>
  <text x="618" y="185" font-size="17" font-style="italic" fill="#1b2a3a">p</text>

  <!-- bell curve peaked near p = 0.30 : x = 370 + 0.30*230 = 439 -->
  <path d="M375,179
           C405,177 419,175 439,90
           C459,175 473,177 597,179 Z"
        fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- sub-caption -->
  <text x="480" y="232" text-anchor="middle" font-size="13" fill="#1b2a3a">p is uncertain —</text>
  <text x="480" y="250" text-anchor="middle" font-size="13" fill="#1b2a3a">described by a whole</text>
  <text x="480" y="268" text-anchor="middle" font-size="13" fill="#1b2a3a">distribution of belief</text>

  <!-- punchline -->
  <text x="160" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">a point</text>
  <text x="320" y="302" text-anchor="middle" font-size="14" fill="#1b2a3a">vs</text>
  <text x="480" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">a curve</text>
</svg>
