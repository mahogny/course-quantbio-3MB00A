<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.0 0.6 659.1 413.0" font-family="Helvetica, Arial, sans-serif" width="659.1" height="413.0">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL: cell cycle wheel ================= -->
  <!-- center 175,175  radius 110. Arcs clockwise from top: G1 40%, S 20%, G2 15%, M 25% -->
  <!-- G1: 0deg to 144deg  (top, sweeping right/down)  -->
  <!-- angle measured clockwise from top; point = (cx + r*sin a, cy - r*cos a) -->

  <!-- G1 arc: a=0 (0,-110) to a=144  -->
  <path d="M175,65 A110,110 0 0 1 239.7,269.0 L175,175 Z" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- S arc: a=144 to a=216 -->
  <path d="M239.7,269.0 A110,110 0 0 1 110.3,269.0 L175,175 Z" fill="#e5efe0" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- G2 arc: a=216 to a=270 -->
  <path d="M110.3,269.0 A110,110 0 0 1 65,175 L175,175 Z" fill="#f6e7e7" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- M arc: a=270 to a=360 -->
  <path d="M65,175 A110,110 0 0 1 175,65 L175,175 Z" fill="#fbeede" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- inner hub -->
  <circle cx="175" cy="175" r="34" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- directional progression arrow (clockwise) just outside wheel -->
  <path d="M175,42 A133,133 0 0 1 292,110" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="40" font-size="13" fill="#1b2a3a">progression →</text>

  <!-- Arc labels -->
  <text x="215" y="130" font-size="18" font-weight="bold" fill="#1b2a3a">G1</text>
  <text x="204" y="150" font-size="11" fill="#2a6f97">cell grows</text>

  <text x="175" y="248" font-size="18" font-weight="bold" fill="#6a994e" text-anchor="middle">S</text>
  <text x="175" y="264" font-size="11" fill="#6a994e" text-anchor="middle">DNA replication</text>

  <text x="112" y="212" font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">G2</text>
  <text x="118" y="150" font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">M</text>
  <text x="70" y="205" font-size="11" fill="#bc4749" text-anchor="middle">mitosis</text>

  <!-- ordering hint -->
  <text x="175" y="180" font-size="11" fill="#1b2a3a" text-anchor="middle">G1→S→</text>
  <text x="175" y="193" font-size="11" fill="#1b2a3a" text-anchor="middle">G2→M</text>

  <text x="175" y="345" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell-cycle wheel</text>

  <!-- ================= RIGHT PANEL: expression vs cycle position ================= -->
  <!-- plot box: x 400..660, y 60..300 -->
  <!-- axes -->
  <line x1="400" y1="60" x2="400" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="400" y1="300" x2="665" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- axis titles -->
  <text x="393" y="55" font-size="13" fill="#1b2a3a" text-anchor="end">expression</text>
  <text x="532" y="352" font-size="13" fill="#1b2a3a" text-anchor="middle">cycle position →</text>

  <!-- phase gridlines aligned to wheel arc fractions across 400..660 (width 260) -->
  <!-- G1 40% -> x=504 ; S 20% -> x=556 ; G2 15% -> x=595 ; M 25% -> x=660 -->
  <line x1="504" y1="60" x2="504" y2="300" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="556" y1="60" x2="556" y2="300" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="595" y1="60" x2="595" y2="300" stroke="#c9d3dd" stroke-width="1"/>

  <!-- phase tick labels on axis -->
  <text x="452" y="292" font-size="12" fill="#1b2a3a" text-anchor="middle">G1</text>
  <text x="530" y="292" font-size="12" fill="#6a994e" text-anchor="middle">S</text>
  <text x="575" y="292" font-size="12" fill="#bc4749" text-anchor="middle">G2</text>
  <text x="627" y="292" font-size="12" fill="#bc4749" text-anchor="middle">M</text>

  <!-- Green curve: S-phase genes, peak during S (~x=530) -->
  <path d="M400,298 C470,296 505,110 530,105 C555,110 585,270 620,296 L660,299" fill="none" stroke="#6a994e" stroke-width="2.5"/>
  <!-- Orange curve: G2M genes, peak during G2/M (~x=610), offset later -->
  <path d="M400,299 C520,298 565,250 590,150 C605,95 620,92 630,100 C645,112 655,240 660,290" fill="none" stroke="#bc4749" stroke-width="2.5"/>

  <!-- curve labels -->
  <circle cx="530" cy="105" r="3" fill="#6a994e"/>
  <text x="470" y="90" font-size="12" font-weight="bold" fill="#6a994e">S-phase genes</text>
  <text x="470" y="104" font-size="10" fill="#6a994e">PCNA, MCM, TYMS</text>

  <circle cx="630" cy="100" r="3" fill="#bc4749"/>
  <text x="500" y="130" font-size="12" font-weight="bold" fill="#bc4749" text-anchor="end">G2M genes</text>
  <text x="500" y="144" font-size="10" fill="#bc4749" text-anchor="end">TOP2A, MKI67,</text>
  <text x="500" y="156" font-size="10" fill="#bc4749" text-anchor="end">CCNB1, CDK1</text>

  <!-- offset annotation between peaks -->
  <path d="M540,75 L620,75" fill="none" stroke="#1b2a3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="580" y="70" font-size="10" fill="#1b2a3a" text-anchor="middle">peaks offset</text>

  <text x="532" y="30" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Co-expressed gene sets rise &amp; fall together</text>

  <!-- ================= FOOTER STRIP: three usable labels ================= -->
  <rect x="55" y="372" width="590" height="22" rx="4" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="252" y1="372" x2="252" y2="394" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="448" y1="372" x2="448" y2="394" stroke="#c9d3dd" stroke-width="1"/>
  <text x="153" y="387" font-size="13" font-weight="bold" fill="#2a6f97" text-anchor="middle">G1</text>
  <text x="350" y="387" font-size="13" font-weight="bold" fill="#6a994e" text-anchor="middle">S</text>
  <text x="546" y="387" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">G2M</text>
  <text x="350" y="368" font-size="10" fill="#1b2a3a" text-anchor="middle">usable phase labels for scoring</text>
</svg>
