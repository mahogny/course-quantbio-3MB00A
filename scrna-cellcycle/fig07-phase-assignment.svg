<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <text x="30" y="28" font-size="16" font-weight="bold" fill="#1b2a3a">Assigning the phase</text>

  <!-- ===== decision regions (drawn first, behind everything) ===== -->
  <!-- plot box: px 130..470 , py 40..380 ; origin (0,0) at (223,287) ; diagonal origin->(470,40) -->
  <!-- G2M region: G2M is the larger positive score (above the diagonal) -->
  <polygon points="130,40 470,40 223,287 130,287" fill="#fbe6cf"/>
  <!-- S region: Score_S is the larger positive value (right of the diagonal) -->
  <polygon points="223,287 470,40 470,380 223,380" fill="#e2efd8"/>
  <!-- G1 region: both scores at or below 0 (lower-left square) -->
  <polygon points="130,287 223,287 223,380 130,380" fill="#d7e6f2"/>

  <!-- plot border -->
  <rect x="130" y="40" width="340" height="340" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- dashed zero lines crossing at the origin -->
  <line x1="223" y1="40" x2="223" y2="380" stroke="#8a97a5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="130" y1="287" x2="470" y2="287" stroke="#8a97a5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- diagonal boundary  Score_S = Score_G2M -->
  <line x1="223" y1="287" x2="470" y2="40" stroke="#1b2a3a" stroke-width="2"/>
  <text x="352" y="158" font-size="12.5" fill="#1b2a3a" text-anchor="middle" transform="rotate(-45 352 158)">Score_S = Score_G2M</text>

  <!-- ===== axes ===== -->
  <line x1="130" y1="380" x2="492" y2="380" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="130" y1="380" x2="130" y2="28" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="404" font-size="15" fill="#1b2a3a" text-anchor="end">Score_S →</text>
  <text x="112" y="210" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 112 210)">Score_G2M →</text>

  <!-- axis tick labels -->
  <g font-size="11" fill="#5a6572" text-anchor="middle">
    <text x="130" y="396">-0.3</text>
    <text x="223" y="396">0.0</text>
    <text x="346" y="396">0.4</text>
    <text x="470" y="396">0.8</text>
  </g>
  <g font-size="11" fill="#5a6572" text-anchor="end">
    <text x="125" y="384">-0.3</text>
    <text x="125" y="291">0.0</text>
    <text x="125" y="167">0.4</text>
    <text x="125" y="44">0.8</text>
  </g>

  <!-- ===== region labels ===== -->
  <text x="300" y="78" font-size="21" font-weight="bold" fill="#c77d2a" text-anchor="middle">G2M</text>
  <text x="432" y="250" font-size="21" font-weight="bold" fill="#5a7d3f" text-anchor="middle">S</text>
  <text x="160" y="255" font-size="21" font-weight="bold" fill="#2a6f97" text-anchor="middle">G1</text>
  <text x="176" y="345" font-size="10.5" fill="#2a6f97" text-anchor="middle" font-style="italic">both scores ≤ 0</text>

  <!-- ===== example cells ===== -->
  <!-- cell 1 (-0.04, 0.62) -> G2M -->
  <circle cx="210" cy="96" r="6.5" fill="#1b2a3a"/>
  <text x="222" y="92" font-size="12.5" font-weight="bold" fill="#1b2a3a">cell 1 → G2M</text>
  <!-- cell 2 (0.51, -0.10) -> S -->
  <circle cx="380" cy="318" r="6.5" fill="#1b2a3a"/>
  <text x="380" y="342" font-size="12.5" font-weight="bold" fill="#1b2a3a" text-anchor="middle">cell 2 → S</text>
  <!-- cell 3 (-0.09, -0.11) -> G1 -->
  <circle cx="195" cy="321" r="6.5" fill="#1b2a3a"/>
  <text x="197" y="372" font-size="12.5" font-weight="bold" fill="#1b2a3a" text-anchor="middle">cell 3 → G1</text>

  <!-- ===== right panel: rule + outputs ===== -->
  <text x="515" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">Decision rule</text>
  <text x="515" y="80" font-size="14" fill="#1b2a3a">Phase = argmax( Score_S , Score_G2M )</text>
  <text x="515" y="104" font-size="13.5" fill="#5a6572">take the larger positive score</text>
  <text x="515" y="126" font-size="13.5" fill="#5a6572">if neither program is on → G1</text>
  <text x="533" y="146" font-size="12.5" fill="#8a97a5" font-style="italic">(includes resting / G0)</text>

  <!-- legend swatches -->
  <g>
    <rect x="515" y="176" width="22" height="22" fill="#d7e6f2" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="546" y="192" font-size="13.5" fill="#1b2a3a">G1 &#160;&#160;both scores ≤ 0</text>
    <rect x="515" y="208" width="22" height="22" fill="#e2efd8" stroke="#6a994e" stroke-width="1.5"/>
    <text x="546" y="224" font-size="13.5" fill="#1b2a3a">S &#160;&#160;&#160;&#160;Score_S is larger ( &gt; 0 )</text>
    <rect x="515" y="240" width="22" height="22" fill="#fbe6cf" stroke="#c77d2a" stroke-width="1.5"/>
    <text x="546" y="256" font-size="13.5" fill="#1b2a3a">G2M &#160;Score_G2M is larger ( &gt; 0 )</text>
  </g>

  <!-- outputs box -->
  <rect x="515" y="290" width="360" height="98" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="530" y="314" font-size="14" font-weight="bold" fill="#1b2a3a">Two outputs per cell</text>
  <text x="530" y="338" font-size="13.5" fill="#2a6f97">• continuous scores  (Score_S, Score_G2M)</text>
  <text x="530" y="360" font-size="13.5" fill="#bc4749">• discrete Phase label  (G1 / S / G2M)</text>
  <text x="530" y="380" font-size="11.5" fill="#8a97a5" font-style="italic">scores measure how strongly each program is on</text>
</svg>
