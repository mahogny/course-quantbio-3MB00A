<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ===== TOP: expression bins with markers and controls ===== -->
  <text x="30" y="30" font-size="15" font-weight="bold" fill="#1b2a3a">Genes binned by mean expression; controls drawn from the marker's own bin</text>

  <!-- legend -->
  <circle cx="648" cy="24" r="4.5" fill="#6a994e"/>
  <text x="660" y="28" font-size="12.5" fill="#1b2a3a">S-phase marker gene</text>
  <circle cx="648" cy="42" r="4" fill="#aab7c4"/>
  <text x="660" y="46" font-size="12.5" fill="#1b2a3a">other gene (control pool)</text>

  <!-- bin separators -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="170" y1="55" x2="170" y2="175"/>
    <line x1="280" y1="55" x2="280" y2="175"/>
    <line x1="390" y1="55" x2="390" y2="175"/>
    <line x1="500" y1="55" x2="500" y2="175"/>
  </g>

  <!-- axis -->
  <line x1="60" y1="175" x2="620" y2="175" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="222" font-size="14" text-anchor="middle" fill="#1b2a3a">average expression level</text>
  <text x="72" y="192" font-size="12" fill="#2a6f97">low</text>
  <text x="588" y="192" font-size="12" text-anchor="end" fill="#2a6f97">high</text>
  <text x="115" y="70" font-size="11" text-anchor="middle" fill="#8895a2">bin 1</text>
  <text x="225" y="70" font-size="11" text-anchor="middle" fill="#8895a2">bin 2</text>
  <text x="335" y="70" font-size="11" text-anchor="middle" fill="#8895a2">bin 3</text>
  <text x="445" y="70" font-size="11" text-anchor="middle" fill="#8895a2">bin 4</text>
  <text x="555" y="70" font-size="11" text-anchor="middle" fill="#8895a2">bin 5</text>

  <!-- grey dots (all genes) -->
  <g fill="#aab7c4">
    <!-- bin1 -->
    <circle cx="88" cy="95" r="3"/><circle cx="112" cy="120" r="3"/><circle cx="140" cy="90" r="3"/>
    <circle cx="98" cy="145" r="3"/><circle cx="132" cy="155" r="3"/><circle cx="155" cy="128" r="3"/>
    <circle cx="80" cy="130" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="118" cy="105" r="3"/>
    <!-- bin2 -->
    <circle cx="185" cy="100" r="3"/><circle cx="258" cy="152" r="3"/><circle cx="200" cy="150" r="3"/>
    <circle cx="176" cy="128" r="3"/><circle cx="270" cy="118" r="3"/>
    <!-- bin3 -->
    <circle cx="296" cy="98" r="3"/><circle cx="368" cy="150" r="3"/><circle cx="308" cy="150" r="3"/>
    <circle cx="285" cy="126" r="3"/><circle cx="378" cy="115" r="3"/>
    <!-- bin4 -->
    <circle cx="406" cy="100" r="3"/><circle cx="478" cy="150" r="3"/><circle cx="418" cy="150" r="3"/>
    <circle cx="396" cy="126" r="3"/><circle cx="488" cy="115" r="3"/>
    <!-- bin5 -->
    <circle cx="516" cy="95" r="3"/><circle cx="545" cy="120" r="3"/><circle cx="578" cy="90" r="3"/>
    <circle cx="528" cy="150" r="3"/><circle cx="595" cy="150" r="3"/><circle cx="560" cy="112" r="3"/>
    <circle cx="508" cy="132" r="3"/><circle cx="595" cy="118" r="3"/><circle cx="520" cy="152" r="3"/>
  </g>

  <!-- highlighted CONTROL genes (grey, ringed) inside marker bins -->
  <g fill="#aab7c4" stroke="#2a6f97" stroke-width="1.5">
    <!-- bin2 controls -->
    <circle cx="215" cy="118" r="3.5"/><circle cx="245" cy="108" r="3.5"/><circle cx="232" cy="140" r="3.5"/>
    <!-- bin3 controls -->
    <circle cx="325" cy="118" r="3.5"/><circle cx="355" cy="108" r="3.5"/><circle cx="342" cy="140" r="3.5"/>
    <!-- bin4 controls -->
    <circle cx="435" cy="118" r="3.5"/><circle cx="465" cy="108" r="3.5"/><circle cx="452" cy="140" r="3.5"/>
  </g>

  <!-- S-phase MARKER genes (green) -->
  <g fill="#6a994e">
    <circle cx="210" cy="88" r="4.5"/><circle cx="248" cy="92" r="4.5"/>
    <circle cx="320" cy="88" r="4.5"/><circle cx="350" cy="92" r="4.5"/>
    <circle cx="430" cy="88" r="4.5"/><circle cx="460" cy="92" r="4.5"/>
  </g>

  <!-- underbraces: controls pulled from same bin -->
  <g fill="none" stroke="#2a6f97" stroke-width="1.6">
    <path d="M175,178 V184 H278 V178"/>
    <path d="M225,184 V196"/>
    <path d="M285,178 V184 H388 V178"/>
    <path d="M335,184 V196"/>
    <path d="M395,178 V184 H498 V178"/>
    <path d="M445,184 V196"/>
  </g>
  <line x1="335" y1="196" x2="506" y2="214" stroke="#2a6f97" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="512" y="210" font-size="12.5" fill="#2a6f97">controls matched to markers</text>
  <text x="512" y="226" font-size="12.5" fill="#2a6f97">in expression level (same bin)</text>

  <!-- divider -->
  <line x1="30" y1="238" x2="850" y2="238" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ===== BOTTOM: per-cell score bars ===== -->
  <text x="30" y="262" font-size="15" font-weight="bold" fill="#1b2a3a">For one cell c: subtract the matched control average</text>

  <!-- bar chart -->
  <line x1="70" y1="395" x2="300" y2="395" stroke="#1b2a3a" stroke-width="1.8"/>
  <!-- marker average bar -->
  <rect x="82" y="290" width="42" height="105" fill="#6a994e" opacity="0.85"/>
  <text x="103" y="410" font-size="11.5" text-anchor="middle" fill="#1b2a3a">marker</text>
  <text x="78" y="284" font-size="11" fill="#6a994e">x markers</text>
  <line x1="78" y1="277" x2="85" y2="277" stroke="#6a994e" stroke-width="1.2"/>
  <!-- control average bar -->
  <rect x="152" y="335" width="42" height="60" fill="#aab7c4"/>
  <text x="173" y="410" font-size="11.5" text-anchor="middle" fill="#1b2a3a">control</text>
  <text x="160" y="329" font-size="11" fill="#5a6976">x ctrl</text>
  <line x1="160" y1="322" x2="167" y2="322" stroke="#5a6976" stroke-width="1.2"/>
  <!-- difference / Score bar -->
  <rect x="222" y="350" width="42" height="45" fill="#2a6f97"/>
  <text x="225" y="410" font-size="11.5" fill="#1b2a3a">Score</text>
  <text x="256" y="413" font-size="8.5" fill="#1b2a3a">S</text>
  <text x="243" y="344" font-size="11" text-anchor="middle" fill="#2a6f97">signal</text>

  <!-- guide showing difference = score -->
  <g stroke="#bc4749" stroke-width="1.3" stroke-dasharray="4 3" fill="none">
    <path d="M124,290 H243"/>
    <path d="M194,335 H243"/>
  </g>
  <line x1="272" y1="290" x2="272" y2="335" stroke="#bc4749" stroke-width="1.4"/>
  <path d="M272,290 h-4 M272,335 h-4" stroke="#bc4749" stroke-width="1.4"/>
  <text x="278" y="316" font-size="11.5" fill="#bc4749">= Score</text>

  <!-- equation -->
  <text x="330" y="300" font-size="19" fill="#1b2a3a">Score</text>
  <text x="392" y="306" font-size="13" fill="#1b2a3a">S</text>
  <text x="400" y="300" font-size="19" fill="#1b2a3a">(c) =</text>
  <text x="460" y="300" font-size="19" fill="#6a994e">x</text>
  <line x1="458" y1="284" x2="472" y2="284" stroke="#6a994e" stroke-width="1.6"/>
  <text x="472" y="306" font-size="12.5" fill="#6a994e">S</text>
  <text x="486" y="300" font-size="19" fill="#1b2a3a">−</text>
  <text x="504" y="300" font-size="19" fill="#5a6976">x</text>
  <line x1="502" y1="284" x2="516" y2="284" stroke="#5a6976" stroke-width="1.6"/>
  <text x="516" y="306" font-size="12.5" fill="#5a6976">ctrl</text>
  <text x="330" y="326" font-size="12.5" fill="#5a6976">mean over markers  −  matched controls</text>

  <!-- inset: depth-rich cell -->
  <rect x="600" y="252" width="250" height="158" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="614" y="272" font-size="12.5" font-weight="bold" fill="#1b2a3a">deep-sequenced cell</text>
  <line x1="620" y1="378" x2="760" y2="378" stroke="#1b2a3a" stroke-width="1.6"/>
  <!-- both bars inflated together -->
  <rect x="636" y="288" width="34" height="90" fill="#6a994e" opacity="0.85"/>
  <rect x="686" y="292" width="34" height="86" fill="#aab7c4"/>
  <text x="653" y="392" font-size="10.5" text-anchor="middle" fill="#1b2a3a">marker</text>
  <text x="703" y="392" font-size="10.5" text-anchor="middle" fill="#1b2a3a">control</text>
  <!-- small residual -->
  <rect x="742" y="372" width="20" height="6" fill="#2a6f97"/>
  <text x="770" y="300" font-size="11.5" fill="#bc4749">both</text>
  <text x="770" y="315" font-size="11.5" fill="#bc4749">inflated</text>
  <path d="M768,320 C750,335 748,352 758,372" fill="none" stroke="#bc4749" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="614" y="405" font-size="10.5" fill="#5a6976">depth cancels: ~0 = background, &gt;0 = program on</text>
</svg>
