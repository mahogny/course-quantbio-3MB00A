<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- model equation -->
  <text x="440" y="24" text-anchor="middle" font-size="16" fill="#1b2a3a">
    x_gc = β0g + β1g·Score_S(c) + β2g·Score_G2M(c) + ε_gc
  </text>
  <text x="440" y="44" text-anchor="middle" font-size="13" fill="#2a6f97" font-style="italic">
    one lm per gene, across cells; continuous scores as predictors
  </text>

  <!-- ===================== LEFT PANEL: Fit ===================== -->
  <g>
    <rect x="20" y="60" width="410" height="330" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="40" y="84" font-size="17" font-weight="bold" fill="#1b2a3a">Fit</text>

    <!-- axes -->
    <line x1="70" y1="100" x2="70" y2="360" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="70" y1="360" x2="410" y2="360" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="40" y="160" font-size="13" fill="#1b2a3a" transform="rotate(-90 40,160)" text-anchor="middle">expression x_gc</text>
    <text x="240" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">Score_S (per cell)</text>

    <!-- regression line: positive slope. from (90,330) to (395,150) -->
    <line x1="90" y1="332" x2="398" y2="150" stroke="#2a6f97" stroke-width="2.5"/>
    <text x="360" y="140" font-size="12.5" fill="#2a6f97" text-anchor="end">slope β1g</text>

    <!-- data points with dashed residuals to the line -->
    <!-- line eq: y = 332 + (150-332)/(398-90)*(x-90) = 332 - 0.5909*(x-90) -->
    <!-- p1 x=130 line y=332-0.5909*40=308.4 ; point above -->
    <line x1="130" y1="290" x2="130" y2="308" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="130" cy="290" r="4.5" fill="#1b2a3a"/>
    <!-- p2 x=175 line y=332-0.5909*85=281.8 ; point below -->
    <line x1="175" y1="282" x2="175" y2="305" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="175" cy="305" r="4.5" fill="#1b2a3a"/>
    <!-- p3 x=225 line y=332-0.5909*135=252.2 ; above -->
    <line x1="225" y1="232" x2="225" y2="252" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="225" cy="232" r="4.5" fill="#1b2a3a"/>
    <!-- p4 x=280 line y=332-0.5909*190=219.7 ; below -->
    <line x1="280" y1="220" x2="280" y2="244" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="280" cy="244" r="4.5" fill="#1b2a3a"/>
    <!-- p5 x=335 line y=332-0.5909*245=187.2 ; above -->
    <line x1="335" y1="168" x2="335" y2="187" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="335" cy="168" r="4.5" fill="#1b2a3a"/>
    <!-- p6 x=375 line y=332-0.5909*285=163.6 ; below -->
    <line x1="375" y1="163" x2="375" y2="184" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="375" cy="184" r="4.5" fill="#1b2a3a"/>

    <!-- annotations -->
    <text x="215" y="118" font-size="12.5" fill="#2a6f97">variation explained by cell cycle</text>
    <line x1="255" y1="123" x2="290" y2="185" stroke="#2a6f97" stroke-width="1.2" stroke-dasharray="2 2"/>

    <text x="82" y="238" font-size="12.5" fill="#bc4749">residuals ε_gc</text>
    <text x="82" y="253" font-size="11.5" fill="#bc4749" font-style="italic">what is left</text>
    <text x="82" y="267" font-size="11.5" fill="#bc4749" font-style="italic">after removing it</text>
    <line x1="150" y1="248" x2="175" y2="292" stroke="#bc4749" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- transition arrow -->
  <line x1="436" y1="225" x2="470" y2="225" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ===================== RIGHT PANEL: After ===================== -->
  <g>
    <rect x="478" y="60" width="384" height="330" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="498" y="84" font-size="17" font-weight="bold" fill="#1b2a3a">After (residuals)</text>

    <!-- axes -->
    <line x1="528" y1="100" x2="528" y2="360" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="528" y1="360" x2="845" y2="360" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="500" y="150" font-size="13" fill="#1b2a3a" transform="rotate(-90 500,150)" text-anchor="middle">residual ε_gc</text>
    <text x="686" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">Score_S (per cell)</text>

    <!-- flat zero line at y=250 -->
    <line x1="548" y1="250" x2="835" y2="250" stroke="#6a994e" stroke-width="2.5"/>
    <text x="835" y="242" font-size="12.5" fill="#6a994e" text-anchor="end">slope ≈ 0</text>

    <!-- residual points re-plotted (same residual sign/magnitude), scattered around 0 line -->
    <!-- residual magnitudes from left: +18(above),-23(below),+20(above),-24(below),+19(above),-21(below) scaled -->
    <line x1="580" y1="232" x2="580" y2="250" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="580" cy="232" r="4.5" fill="#1b2a3a"/>
    <line x1="628" y1="250" x2="628" y2="273" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="628" cy="273" r="4.5" fill="#1b2a3a"/>
    <line x1="676" y1="230" x2="676" y2="250" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="676" cy="230" r="4.5" fill="#1b2a3a"/>
    <line x1="724" y1="250" x2="724" y2="274" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="724" cy="274" r="4.5" fill="#1b2a3a"/>
    <line x1="772" y1="231" x2="772" y2="250" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="772" cy="231" r="4.5" fill="#1b2a3a"/>
    <line x1="815" y1="250" x2="815" y2="271" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="815" cy="271" r="4.5" fill="#1b2a3a"/>

    <!-- annotation -->
    <text x="686" y="126" font-size="12.5" fill="#6a994e" text-anchor="middle">cell-cycle axis flattened</text>
    <text x="686" y="326" font-size="12" fill="#1b2a3a" text-anchor="middle">→ feed residuals to PCA;</text>
    <text x="686" y="343" font-size="12" fill="#1b2a3a" text-anchor="middle">no longer claims a top PC</text>
  </g>
</svg>
