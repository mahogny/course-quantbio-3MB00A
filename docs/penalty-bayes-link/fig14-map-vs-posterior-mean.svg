<svg xmlns="http://www.w3.org/2000/svg" viewBox="53.8 22.6 642.4 390.4" width="642.4" height="390.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arwb" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="150" y1="300" x2="678" y2="300" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="150" y1="300" x2="150" y2="78" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arw)"/>
  <text transform="rotate(-90 132 195)" x="132" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">posterior density</text>

  <!-- full posterior density: light tint fill -->
  <path d="M150.0,300 L150.0,298.3 L176.8,294.3 L190.3,289.5 L203.7,281.0 L217.1,265.3 L223.8,253.2 L230.5,236.8 L237.2,214.5 L243.9,184.7 L250.7,144.4 L257.4,90.0 L264.1,107.2 L270.8,122.8 L277.5,137.2 L284.2,150.5 L297.6,174.0 L311.0,193.5 L324.5,210.3 L337.9,224.4 L364.7,246.0 L391.6,261.6 L431.8,276.9 L472.1,286.1 L525.8,293.1 L592.9,297.1 L660.0,298.7 L660.0,300 Z" fill="#eaf1f7"/>

  <!-- 95 percent credible interval band: stronger tint -->
  <path d="M243.9,300 L243.9,184.7 L250.7,144.4 L257.4,90.0 L264.1,107.2 L270.8,122.8 L277.5,137.2 L284.2,150.5 L297.6,174.0 L311.0,193.5 L324.5,210.3 L337.9,224.4 L364.7,246.0 L391.6,261.6 L431.8,276.9 L472.1,286.1 L485.5,288.3 L485.5,300 Z" fill="#bcd6ea"/>

  <!-- density outline -->
  <path d="M150.0,298.3 L176.8,294.3 L190.3,289.5 L203.7,281.0 L217.1,265.3 L223.8,253.2 L230.5,236.8 L237.2,214.5 L243.9,184.7 L250.7,144.4 L257.4,90.0 L264.1,107.2 L270.8,122.8 L277.5,137.2 L284.2,150.5 L297.6,174.0 L311.0,193.5 L324.5,210.3 L337.9,224.4 L364.7,246.0 L391.6,261.6 L431.8,276.9 L472.1,286.1 L525.8,293.1 L592.9,297.1 L660.0,298.7" fill="none" stroke="#2a6f97" stroke-width="2"/>

  <!-- dotted line: mode sits over beta = 0 -->
  <line x1="257.4" y1="90.0" x2="257.4" y2="300" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 3"/>
  <!-- MAP filled dot on the axis at beta = 0 -->
  <circle cx="257.4" cy="300" r="6" fill="#bc4749" stroke="#ffffff" stroke-width="1.3"/>

  <!-- MAP callout -->
  <text x="245" y="52" text-anchor="end" font-size="15.5" font-weight="bold" fill="#bc4749">MAP = 0</text>
  <text x="245" y="70" text-anchor="end" font-size="12.5" fill="#bc4749">(lasso sets it to zero)</text>
  <line x1="248" y1="63" x2="257.4" y2="89" stroke="#bc4749" stroke-width="1.2"/>

  <!-- posterior mean: dashed vertical line + triangle at beta approx 0.4 -->
  <line x1="311.0" y1="300" x2="311.0" y2="112" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="304,104 318,104 311.0,117" fill="#6a994e"/>
  <line x1="320" y1="82" x2="312.5" y2="104" stroke="#6a994e" stroke-width="1.1"/>
  <text x="323" y="62" font-size="15.5" font-weight="bold" fill="#6a994e">posterior mean &#8776; 0.4 &gt; 0</text>
  <text x="323" y="80" font-size="12.5" fill="#6a994e">(not sparse: mass leans positive)</text>

  <!-- credible interval span marker under the band (I-beam) -->
  <line x1="243.9" y1="309" x2="485.5" y2="309" stroke="#2a6f97" stroke-width="1.4"/>
  <line x1="243.9" y1="305" x2="243.9" y2="313" stroke="#2a6f97" stroke-width="1.4"/>
  <line x1="485.5" y1="305" x2="485.5" y2="313" stroke="#2a6f97" stroke-width="1.4"/>

  <!-- credible interval callout -->
  <line x1="500" y1="180" x2="462" y2="289" stroke="#2a6f97" stroke-width="1.2" marker-end="url(#arwb)"/>
  <text x="505" y="140" font-size="14.5" font-weight="bold" fill="#2a6f97">posterior width</text>
  <text x="505" y="159" font-size="12.5" fill="#1b2a3a">= 95% credible interval</text>
  <text x="505" y="177" font-size="12.5" fill="#1b2a3a">= the uncertainty that</text>
  <text x="505" y="195" font-size="12.5" fill="#1b2a3a">MAP throws away</text>

  <!-- x ticks and labels -->
  <line x1="391.6" y1="300" x2="391.6" y2="305" stroke="#1b2a3a" stroke-width="1.3"/>
  <line x1="525.8" y1="300" x2="525.8" y2="305" stroke="#1b2a3a" stroke-width="1.3"/>
  <text x="257.4" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">0</text>
  <text x="391.6" y="332" text-anchor="middle" font-size="13" fill="#1b2a3a">1</text>
  <text x="525.8" y="332" text-anchor="middle" font-size="13" fill="#1b2a3a">2</text>
  <text x="364" y="356" text-anchor="start" font-size="15" font-weight="bold" fill="#1b2a3a">coefficient &#946;<tspan font-size="11" dy="4">3</tspan></text>

  <!-- caption -->
  <text x="360" y="392" text-anchor="middle" font-size="12.7" fill="#1b2a3a">penalised regression = the posterior PEAK only;  a full Bayesian analysis keeps the whole distribution</text>
</svg>
