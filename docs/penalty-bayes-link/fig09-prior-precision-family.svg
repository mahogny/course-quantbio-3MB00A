  <!-- curve labels with leader lines -->
  <circle cx="310" cy="96.1" r="2.6" fill="#bc4749"/>
  <line x1="322" y1="98" x2="392" y2="86" stroke="#bc4749" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="396" y="83" font-size="12.5" font-weight="bold" fill="#bc4749">small τ^2  (tall spike)</text>
  <text x="396" y="99" font-size="11" fill="#bc4749">high precision 1/τ^2 → large λ</text>
  <text x="396" y="113" font-size="11" fill="#bc4749">→ strong shrinkage</text>

  <circle cx="310" cy="208.2" r="2.6" fill="#2a6f97"/>
  <line x1="322" y1="208" x2="392" y2="180" stroke="#2a6f97" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="396" y="177" font-size="12.5" font-weight="bold" fill="#2a6f97">moderate τ^2</text>
  <text x="396" y="192" font-size="11" fill="#2a6f97">→ moderate λ</text>

  <circle cx="130" cy="285.5" r="2.6" fill="#6a994e"/>
  <line x1="128" y1="285" x2="118" y2="250" stroke="#6a994e" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="112" y="240" font-size="12.5" font-weight="bold" fill="#6a994e">large τ^2  (wide, flat)</text>
  <text x="112" y="255" font-size="11" fill="#6a994e">low precision → small λ → weak shrinkage</text>

  <!-- summary annotation -->
  <rect x="92" y="330" width="456" height="34" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="320" y="351" text-anchor="middle" font-size="13" fill="#1b2a3a">narrower prior = more confident that effects are near 0 = bigger penalty</text>
</svg>
