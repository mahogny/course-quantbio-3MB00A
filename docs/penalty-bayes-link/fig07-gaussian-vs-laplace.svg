<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 30 608 296" font-family="Helvetica, Arial, sans-serif" width="608" height="296">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="90" y1="300" x2="632" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="300" x2="90" y2="42" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- x ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="155" y1="300" x2="155" y2="304"/>
    <line x1="220" y1="300" x2="220" y2="304"/>
    <line x1="285" y1="300" x2="285" y2="304"/>
    <line x1="415" y1="300" x2="415" y2="304"/>
    <line x1="480" y1="300" x2="480" y2="304"/>
    <line x1="545" y1="300" x2="545" y2="304"/>
  </g>
  <!-- zero guide -->
  <line x1="350" y1="300" x2="350" y2="62" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="3 4"/>

  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="155" y="318">-3</text>
    <text x="220" y="318">-2</text>
    <text x="285" y="318">-1</text>
    <text x="350" y="318">0</text>
    <text x="415" y="318">1</text>
    <text x="480" y="318">2</text>
    <text x="545" y="318">3</text>
  </g>

  <!-- axis titles -->
  <text x="640" y="304" fill="#1b2a3a" font-size="16" font-style="italic">&#946;<tspan dy="3" font-size="12">j</tspan></text>
  <text x="106" y="50" fill="#1b2a3a" font-size="15">prior density  p(&#946;<tspan dy="3" font-size="11">j</tspan><tspan dy="-3">)</tspan></text>

  <!-- Gaussian curve (ridge) -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.4" stroke-linejoin="round"
    points="90.0,299.8 111.7,299.5 133.3,298.6 155.0,296.6 176.7,292.7 198.3,285.4 220.0,273.5 241.7,256.2 263.3,233.7 285.0,208.6 306.7,185.0 328.3,168.0 350.0,161.8 371.7,168.0 393.3,185.0 415.0,208.6 436.7,233.7 458.3,256.2 480.0,273.5 501.7,285.4 523.3,292.7 545.0,296.6 566.7,298.6 588.3,299.5 610.0,299.8"/>

  <!-- Laplace curve (lasso): sharp cusp at 0, heavier tails -->
  <polyline fill="none" stroke="#bc4749" stroke-width="2.4" stroke-linejoin="round"
    points="90.0,298.4 111.7,297.6 133.3,296.3 155.0,294.4 176.7,291.5 198.3,287.1 220.0,280.5 241.7,270.4 263.3,255.0 285.0,231.8 306.7,196.5 321.8,161.5 337.0,114.6 350.0,61.9 363.0,114.6 378.2,161.5 393.3,196.5 415.0,231.8 436.7,255.0 458.3,270.4 480.0,280.5 501.7,287.1 523.3,292.2 545.0,294.4 566.7,296.3 588.3,297.6 610.0,298.4"/>

  <!-- callout to the sharp spike -->
  <line x1="470" y1="72" x2="354" y2="64" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="476" y="76" fill="#1b2a3a" font-size="14" font-weight="bold">sharp spike at 0</text>

  <!-- legend (upper-right empty region, clear of both curves) -->
  <g font-size="14">
    <line x1="404" y1="134" x2="432" y2="134" stroke="#2a6f97" stroke-width="2.4"/>
    <text x="440" y="138" fill="#1b2a3a">Gaussian  N(0, &#964;<tspan dy="-5" font-size="10">2</tspan><tspan dy="5">) &#8594; ridge</tspan></text>
    <line x1="404" y1="160" x2="432" y2="160" stroke="#bc4749" stroke-width="2.4"/>
    <text x="440" y="164" fill="#1b2a3a">Laplace (double-exponential) &#8594; lasso</text>
  </g>
</svg>
