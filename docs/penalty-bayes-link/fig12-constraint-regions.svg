<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 0 814 348" font-family="Helvetica, Arial, sans-serif" width="814" height="348">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== PANEL 1  RIDGE ===================== -->
  <g>
    <text x="140" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Ridge  (Gaussian prior, L2)</text>
    <text x="104" y="44" font-size="13" fill="#2a6f97"><tspan>β</tspan><tspan font-size="9" dy="3">1</tspan><tspan font-size="9" dy="-8">2</tspan><tspan dy="5"> + β</tspan><tspan font-size="9" dy="3">2</tspan><tspan font-size="9" dy="-8">2</tspan><tspan dy="5"> ≤ t</tspan></text>

    <!-- axes -->
    <line x1="38" y1="250" x2="196" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="70" y1="282" x2="70" y2="98"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="200" y="255" font-size="14" fill="#1b2a3a"><tspan>β</tspan><tspan font-size="10" dy="3">1</tspan></text>
    <text x="78"  y="104" font-size="14" fill="#1b2a3a"><tspan>β</tspan><tspan font-size="10" dy="3">2</tspan></text>

    <!-- RSS contours centred on OLS solution -->
    <g fill="none" stroke="#c9d3dd" stroke-width="1.5" transform="rotate(-38 138 168)">
      <ellipse cx="138" cy="168" rx="22" ry="12"/>
      <ellipse cx="138" cy="168" rx="42" ry="22"/>
      <ellipse cx="138" cy="168" rx="62" ry="32"/>
      <ellipse cx="138" cy="168" rx="78" ry="40"/>
    </g>

    <!-- constraint region: circle -->
    <circle cx="70" cy="250" r="50" fill="#eaf1f7" fill-opacity="0.6" stroke="#2a6f97" stroke-width="2"/>

    <!-- shrink path and touch point -->
    <line x1="138" y1="168" x2="102.4" y2="211.9" stroke="#2a6f97" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="138" cy="168" r="2.5" fill="#1b2a3a"/>
    <text x="146" y="164" font-size="12" fill="#1b2a3a"><tspan>β</tspan><tspan dx="-7" dy="-4" font-size="10">^</tspan><tspan dx="2" dy="4"> (OLS)</tspan></text>
    <circle cx="102.4" cy="211.9" r="4.5" fill="#2a6f97"/>
    <text x="55" y="230" font-size="11.5" fill="#2a6f97"><tspan>β</tspan><tspan font-size="8.5" dy="3">1</tspan><tspan dy="-3">,β</tspan><tspan font-size="8.5" dy="3">2</tspan><tspan dy="-3"> ≠ 0</tspan></text>

    <text x="140" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">shrinks all, keeps all</text>
  </g>

  <!-- ===================== PANEL 2  LASSO ===================== -->
  <g>
    <text x="420" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Lasso  (Laplace prior, L1)</text>
    <text x="384" y="44" font-size="13" fill="#bc4749"><tspan>|β</tspan><tspan font-size="9" dy="3">1</tspan><tspan dy="-3">| + |β</tspan><tspan font-size="9" dy="3">2</tspan><tspan dy="-3">| ≤ t</tspan></text>

    <line x1="318" y1="250" x2="476" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="350" y1="282" x2="350" y2="98"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="480" y="255" font-size="14" fill="#1b2a3a"><tspan>β</tspan><tspan font-size="10" dy="3">1</tspan></text>
    <text x="358" y="104" font-size="14" fill="#1b2a3a"><tspan>β</tspan><tspan font-size="10" dy="3">2</tspan></text>

    <g fill="none" stroke="#c9d3dd" stroke-width="1.5" transform="rotate(-38 418 168)">
      <ellipse cx="418" cy="168" rx="22" ry="12"/>
      <ellipse cx="418" cy="168" rx="42" ry="22"/>
      <ellipse cx="418" cy="168" rx="62" ry="32"/>
      <ellipse cx="418" cy="168" rx="78" ry="40"/>
    </g>

    <!-- constraint region: diamond -->
    <polygon points="400,250 350,200 300,250 350,300" fill="#f6e7e7" fill-opacity="0.7" stroke="#bc4749" stroke-width="2"/>

    <!-- touch at top corner on the beta2 axis, so beta1 = 0 -->
    <line x1="418" y1="168" x2="350" y2="200" stroke="#bc4749" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="418" cy="168" r="2.5" fill="#1b2a3a"/>
    <text x="426" y="164" font-size="12" fill="#1b2a3a"><tspan>β</tspan><tspan dx="-7" dy="-4" font-size="10">^</tspan><tspan dx="2" dy="4"> (OLS)</tspan></text>
    <circle cx="350" cy="200" r="4.5" fill="#bc4749"/>
    <text x="298" y="197" font-size="11.5" fill="#bc4749"><tspan>β</tspan><tspan font-size="8.5" dy="3">1</tspan><tspan dy="-3"> = 0</tspan></text>

    <text x="420" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">corner → exact zero → selection</text>
  </g>

  <!-- ===================== PANEL 3  ELASTIC NET ===================== -->
  <g>
    <text x="700" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Elastic net  (mixed prior)</text>
    <text x="650" y="44" font-size="13" fill="#6a994e"><tspan>α|β| + (1−α)β</tspan><tspan font-size="9" dy="-6">2</tspan><tspan dy="6"> ≤ t</tspan></text>

    <line x1="598" y1="250" x2="756" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="630" y1="282" x2="630" y2="98"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="760" y="255" font-size="14" fill="#1b2a3a"><tspan>β</tspan><tspan font-size="10" dy="3">1</tspan></text>
    <text x="638" y="104" font-size="14" fill="#1b2a3a"><tspan>β</tspan><tspan font-size="10" dy="3">2</tspan></text>

    <g fill="none" stroke="#c9d3dd" stroke-width="1.5" transform="rotate(-38 698 168)">
      <ellipse cx="698" cy="168" rx="22" ry="12"/>
      <ellipse cx="698" cy="168" rx="42" ry="22"/>
      <ellipse cx="698" cy="168" rx="62" ry="32"/>
      <ellipse cx="698" cy="168" rx="78" ry="40"/>
    </g>

    <!-- constraint region: rounded-corner diamond (between circle and diamond) -->
    <path d="M669,239 L641,211 Q630,200 619,211 L591,239 Q580,250 591,261 L619,289 Q630,300 641,289 L669,261 Q680,250 669,239 Z"
          fill="#eaf1ea" fill-opacity="0.7" stroke="#6a994e" stroke-width="2"/>

    <!-- touch near but not exactly at the corner -->
    <line x1="698" y1="168" x2="643" y2="213" stroke="#6a994e" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="698" cy="168" r="2.5" fill="#1b2a3a"/>
    <text x="706" y="164" font-size="12" fill="#1b2a3a"><tspan>β</tspan><tspan dx="-7" dy="-4" font-size="10">^</tspan><tspan dx="2" dy="4"> (OLS)</tspan></text>
    <circle cx="643" cy="213" r="4.5" fill="#6a994e"/>
    <text x="656" y="226" font-size="11.5" fill="#6a994e"><tspan>β</tspan><tspan font-size="8.5" dy="3">1</tspan><tspan dy="-3"> small</tspan></text>

    <text x="700" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">shrink + select</text>
  </g>
</svg>
