<svg xmlns="http://www.w3.org/2000/svg" viewBox="63.0 -5.3 598.5 442.2" font-family="Helvetica, Arial, sans-serif" width="598.5" height="442.2">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ TOP PANEL: Credible interval ============ -->
  <text x="90" y="24" font-size="17" font-weight="bold" fill="#2a6f97">Credible interval (about the parameter)</text>

  <!-- shaded central 95% region under Beta(7,15) -->
  <path d="M162.8,200 L162.8,177.9 L173.2,164.5 L183.6,148.7 L194.0,131.7 L204.4,115.1 L214.8,100.5 L225.2,89.3 L235.6,82.3 L246.0,80.0 L256.4,82.2 L266.8,88.4 L277.2,97.8 L287.6,109.4 L298.0,122.1 L308.4,135.1 L318.8,147.5 L329.2,158.8 L339.6,168.6 L350.0,176.9 L360.4,183.5 L360.4,200 Z"
        fill="#eaf1f7" stroke="none"/>

  <!-- posterior Beta(7,15) density curve -->
  <polyline points="90.0,200.0 100.4,200.0 110.8,199.9 121.2,199.5 131.6,198.0 142.0,194.4 152.4,187.9 162.8,177.9 173.2,164.5 183.6,148.7 194.0,131.7 204.4,115.1 214.8,100.5 225.2,89.3 235.6,82.3 246.0,80.0 256.4,82.2 266.8,88.4 277.2,97.8 287.6,109.4 298.0,122.1 308.4,135.1 318.8,147.5 329.2,158.8 339.6,168.6 350.0,176.9 360.4,183.5 370.8,188.6 381.2,192.4 391.6,195.1 402.0,197.0 412.4,198.2 422.8,199.0 433.2,199.4 443.6,199.7 454.0,199.9 464.4,199.9 474.8,200.0 485.2,200.0 495.6,200.0 526.8,200.0 610.0,200.0"
        fill="none" stroke="#2a6f97" stroke-width="2"/>

  <!-- dashed boundary lines at p = 0.14 and p = 0.52 -->
  <line x1="162.8" y1="200" x2="162.8" y2="70" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="360.4" y1="200" x2="360.4" y2="70" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="162.8" y="62" text-anchor="middle" font-size="14" fill="#1b2a3a">0.14</text>
  <text x="360.4" y="62" text-anchor="middle" font-size="14" fill="#1b2a3a">0.52</text>

  <!-- p-axis (top) -->
  <line x1="80" y1="200" x2="628" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="196" x2="90" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="350" y1="196" x2="350" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="610" y1="196" x2="610" y2="204" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="90" y="217" text-anchor="middle" font-size="13" fill="#1b2a3a">0</text>
  <text x="350" y="217" text-anchor="middle" font-size="13" fill="#1b2a3a">0.5</text>
  <text x="610" y="217" text-anchor="middle" font-size="13" fill="#1b2a3a">1</text>
  <text x="636" y="205" font-size="16" font-style="italic" fill="#1b2a3a">p</text>

  <!-- top caption -->
  <text x="90" y="240" font-size="13" fill="#1b2a3a">P(0.14 ≤ <tspan font-style="italic">p</tspan> ≤ 0.52 | data) = 0.95 — a probability statement about <tspan font-style="italic">p</tspan></text>

  <!-- divider -->
  <line x1="80" y1="254" x2="628" y2="254" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ============ BOTTOM PANEL: Confidence interval ============ -->
  <text x="90" y="280" font-size="17" font-weight="bold" fill="#1b2a3a">Confidence interval (about the procedure)</text>

  <!-- true fixed p vertical line at p = 0.33 (x = 261.6) -->
  <line x1="261.6" y1="308" x2="261.6" y2="406" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="220" y="304" font-size="12" fill="#1b2a3a">true <tspan font-style="italic">p</tspan> (fixed)</text>

  <!-- 12 hypothetical repeated-experiment intervals; 11 straddle true p (blue), 1 misses (red) -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="205" y1="314" x2="300" y2="314" stroke="#2a6f97"/>
    <line x1="180" y1="322" x2="275" y2="322" stroke="#2a6f97"/>
    <line x1="230" y1="330" x2="320" y2="330" stroke="#2a6f97"/>
    <line x1="160" y1="338" x2="265" y2="338" stroke="#2a6f97"/>
    <line x1="210" y1="346" x2="292" y2="346" stroke="#2a6f97"/>
    <line x1="245" y1="354" x2="340" y2="354" stroke="#2a6f97"/>
    <line x1="190" y1="362" x2="285" y2="362" stroke="#2a6f97"/>
    <line x1="352" y1="370" x2="442" y2="370" stroke="#bc4749"/>
    <line x1="215" y1="378" x2="305" y2="378" stroke="#2a6f97"/>
    <line x1="175" y1="386" x2="270" y2="386" stroke="#2a6f97"/>
    <line x1="235" y1="394" x2="318" y2="394" stroke="#2a6f97"/>
    <line x1="200" y1="402" x2="296" y2="402" stroke="#2a6f97"/>
  </g>

  <!-- small end caps for interval bars -->
  <g stroke-width="1.5" stroke="#2a6f97">
    <line x1="205" y1="310" x2="205" y2="318"/><line x1="300" y1="310" x2="300" y2="318"/>
    <line x1="180" y1="318" x2="180" y2="326"/><line x1="275" y1="318" x2="275" y2="326"/>
    <line x1="230" y1="326" x2="230" y2="334"/><line x1="320" y1="326" x2="320" y2="334"/>
    <line x1="160" y1="334" x2="160" y2="342"/><line x1="265" y1="334" x2="265" y2="342"/>
    <line x1="210" y1="342" x2="210" y2="350"/><line x1="292" y1="342" x2="292" y2="350"/>
    <line x1="245" y1="350" x2="245" y2="358"/><line x1="340" y1="350" x2="340" y2="358"/>
    <line x1="190" y1="358" x2="190" y2="366"/><line x1="285" y1="358" x2="285" y2="366"/>
    <line x1="215" y1="374" x2="215" y2="382"/><line x1="305" y1="374" x2="305" y2="382"/>
    <line x1="175" y1="382" x2="175" y2="390"/><line x1="270" y1="382" x2="270" y2="390"/>
    <line x1="235" y1="390" x2="235" y2="398"/><line x1="318" y1="390" x2="318" y2="398"/>
    <line x1="200" y1="398" x2="200" y2="406"/><line x1="296" y1="398" x2="296" y2="406"/>
  </g>
  <g stroke-width="1.5" stroke="#bc4749">
    <line x1="352" y1="366" x2="352" y2="374"/><line x1="442" y1="366" x2="442" y2="374"/>
  </g>

  <!-- annotation for the one interval that misses -->
  <text x="454" y="374" font-size="12" fill="#bc4749">misses true <tspan font-style="italic">p</tspan></text>

  <!-- bottom caption -->
  <text x="90" y="417" font-size="13" fill="#1b2a3a">95% of such intervals would contain the fixed <tspan font-style="italic">p</tspan> — no probability attached to any single one</text>
</svg>
