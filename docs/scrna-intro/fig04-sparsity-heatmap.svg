<svg xmlns="http://www.w3.org/2000/svg" width="880" height="415" viewBox="0 0 880 415" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <linearGradient id="cnt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe9f4"/>
      <stop offset="0.5" stop-color="#468bbd"/>
      <stop offset="1" stop-color="#14405a"/>
    </linearGradient>
  </defs>

  <!-- title -->
  <text x="40" y="26" font-size="15" font-weight="bold" fill="#1b2a3a">Count matrix: 12 cells &#215; 24 genes = 288 entries</text>

  <!-- grid background (all empty = 0) -->
  <rect x="40" y="55" width="480" height="240" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- grid lines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="60" y1="55" x2="60" y2="295"/><line x1="80" y1="55" x2="80" y2="295"/>
    <line x1="100" y1="55" x2="100" y2="295"/><line x1="120" y1="55" x2="120" y2="295"/>
    <line x1="140" y1="55" x2="140" y2="295"/><line x1="160" y1="55" x2="160" y2="295"/>
    <line x1="180" y1="55" x2="180" y2="295"/><line x1="200" y1="55" x2="200" y2="295"/>
    <line x1="220" y1="55" x2="220" y2="295"/><line x1="240" y1="55" x2="240" y2="295"/>
    <line x1="260" y1="55" x2="260" y2="295"/><line x1="280" y1="55" x2="280" y2="295"/>
    <line x1="300" y1="55" x2="300" y2="295"/><line x1="320" y1="55" x2="320" y2="295"/>
    <line x1="340" y1="55" x2="340" y2="295"/><line x1="360" y1="55" x2="360" y2="295"/>
    <line x1="380" y1="55" x2="380" y2="295"/><line x1="400" y1="55" x2="400" y2="295"/>
    <line x1="420" y1="55" x2="420" y2="295"/><line x1="440" y1="55" x2="440" y2="295"/>
    <line x1="460" y1="55" x2="460" y2="295"/><line x1="480" y1="55" x2="480" y2="295"/>
    <line x1="500" y1="55" x2="500" y2="295"/>
    <line x1="40" y1="75" x2="520" y2="75"/><line x1="40" y1="95" x2="520" y2="95"/>
    <line x1="40" y1="115" x2="520" y2="115"/><line x1="40" y1="135" x2="520" y2="135"/>
    <line x1="40" y1="155" x2="520" y2="155"/><line x1="40" y1="175" x2="520" y2="175"/>
    <line x1="40" y1="195" x2="520" y2="195"/><line x1="40" y1="215" x2="520" y2="215"/>
    <line x1="40" y1="235" x2="520" y2="235"/><line x1="40" y1="255" x2="520" y2="255"/>
    <line x1="40" y1="275" x2="520" y2="275"/>
  </g>

  <!-- non-zero cells (fill intensity encodes count 1..8) -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="80" y="55" width="20" height="20" fill="#97c0dd"/>
    <rect x="180" y="75" width="20" height="20" fill="#bcd6ea"/>
    <rect x="340" y="55" width="20" height="20" fill="#dbe9f4"/>
    <rect x="440" y="95" width="20" height="20" fill="#468bbd"/>
    <rect x="120" y="115" width="20" height="20" fill="#6ba6cd"/>
    <rect x="260" y="135" width="20" height="20" fill="#bcd6ea"/>
    <rect x="40" y="155" width="20" height="20" fill="#2a6f97"/>
    <rect x="220" y="175" width="20" height="20" fill="#97c0dd"/>
    <rect x="380" y="155" width="20" height="20" fill="#14405a"/>
    <rect x="300" y="195" width="20" height="20" fill="#bcd6ea"/>
    <rect x="160" y="215" width="20" height="20" fill="#6ba6cd"/>
    <rect x="460" y="195" width="20" height="20" fill="#dbe9f4"/>
    <rect x="100" y="235" width="20" height="20" fill="#468bbd"/>
    <rect x="400" y="235" width="20" height="20" fill="#97c0dd"/>
    <rect x="280" y="255" width="20" height="20" fill="#bcd6ea"/>
    <rect x="200" y="275" width="20" height="20" fill="#1f597a"/>
    <rect x="360" y="255" width="20" height="20" fill="#6ba6cd"/>
    <rect x="60" y="95" width="20" height="20" fill="#dbe9f4"/>
    <rect x="140" y="175" width="20" height="20" fill="#bcd6ea"/>
    <rect x="240" y="75" width="20" height="20" fill="#2a6f97"/>
    <rect x="320" y="115" width="20" height="20" fill="#97c0dd"/>
    <rect x="420" y="175" width="20" height="20" fill="#dbe9f4"/>
    <rect x="180" y="255" width="20" height="20" fill="#468bbd"/>
    <rect x="80" y="195" width="20" height="20" fill="#dbe9f4"/>
    <rect x="260" y="215" width="20" height="20" fill="#bcd6ea"/>
    <rect x="440" y="255" width="20" height="20" fill="#dbe9f4"/>
    <rect x="40" y="275" width="20" height="20" fill="#6ba6cd"/>
    <rect x="300" y="55" width="20" height="20" fill="#bcd6ea"/>
  </g>

  <!-- highlight two referenced non-zeros -->
  <rect x="380" y="155" width="20" height="20" fill="none" stroke="#bc4749" stroke-width="2.5"/>
  <rect x="200" y="275" width="20" height="20" fill="none" stroke="#bc4749" stroke-width="2.5"/>

  <!-- axis labels -->
  <text x="280" y="313" font-size="13" fill="#1b2a3a" text-anchor="middle">24 genes &#8212;&gt;</text>
  <text x="22" y="175" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 22 175)">12 cells</text>

  <!-- legend -->
  <text x="545" y="48" font-size="13" font-weight="bold" fill="#1b2a3a">count:</text>
  <rect x="600" y="37" width="16" height="16" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="620" y="49" font-size="12" fill="#1b2a3a">0</text>
  <rect x="645" y="37" width="180" height="16" fill="url(#cnt)" stroke="#c9d3dd" stroke-width="1"/>
  <text x="645" y="68" font-size="11" fill="#1b2a3a">1 (light)</text>
  <text x="825" y="68" font-size="11" fill="#1b2a3a" text-anchor="end">8 (dark)</text>

  <!-- callout 1 -->
  <rect x="545" y="82" width="300" height="46" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="560" y="103" font-size="14" font-weight="bold" fill="#1b2a3a">~90&#8211;95% of entries</text>
  <text x="560" y="121" font-size="14" font-weight="bold" fill="#1b2a3a">are exactly 0</text>

  <!-- triplet list -->
  <rect x="545" y="140" width="300" height="150" rx="6" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="560" y="160" font-size="13" font-weight="bold" fill="#1b2a3a">Stored non-zero triplets</text>
  <text x="560" y="178" font-size="12" fill="#6a6a6a">(cell, gene, value) only</text>
  <g font-family="monospace" font-size="13" fill="#1b2a3a">
    <text x="560" y="200">(cell5,  geneR, 8)</text>
    <text x="560" y="220">(cell1,  geneK, 6)</text>
    <text x="560" y="240">(cell11, geneI, 7)</text>
    <text x="560" y="260">(cell8,  geneF, 4)</text>
    <text x="560" y="280">(cell3,  geneA, 5)</text>
  </g>

  <!-- arrow from triplet list to highlighted cell -->
  <path d="M555,197 C480,190 440,170 401,166" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- callout 2 (sparse storage) -->
  <rect x="40" y="330" width="805" height="72" rx="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.5"/>
  <text x="56" y="353" font-size="14" fill="#1b2a3a"><tspan font-weight="bold">Sparse storage</tspan> keeps ONLY the non-zero entries (coordinates + value).</text>
  <text x="56" y="373" font-size="14" fill="#1b2a3a">A dense 20,000 &#215; 50,000 double matrix would be tens of GB;</text>
  <text x="56" y="393" font-size="14" fill="#1b2a3a">stored as triplets it shrinks to a few hundred MB.</text>

  <!-- arrow from callout 2 to a filled square -->
  <path d="M210,330 L210,296" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
