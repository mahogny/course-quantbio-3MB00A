<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -1 714 416" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- =============== LEFT PANEL: raw counts =============== -->
  <text x="130" y="26" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">raw counts</text>
  <text x="130" y="46" font-size="12" font-style="italic" fill="#bc4749" text-anchor="middle">raw totals differ from technical capture,</text>
  <text x="130" y="61" font-size="12" font-style="italic" fill="#bc4749" text-anchor="middle">not biology → unfair to compare</text>

  <!-- Cell A raw (total 2,000 UMIs -> 21 px), stack bottom-up: blue,green,red,navy,grey -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="80" y="323.7" width="44" height="6.3"  fill="#2a6f97"/>
    <rect x="80" y="318.45" width="44" height="5.25" fill="#6a994e"/>
    <rect x="80" y="314.25" width="44" height="4.2"  fill="#bc4749"/>
    <rect x="80" y="311.1" width="44" height="3.15" fill="#1b2a3a"/>
    <rect x="80" y="309"   width="44" height="2.1"  fill="#c9d3dd"/>
  </g>

  <!-- Cell B raw (total 20,000 UMIs -> 210 px, 10x taller) -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="150" y="267"   width="44" height="63"   fill="#2a6f97"/>
    <rect x="150" y="214.5" width="44" height="52.5" fill="#6a994e"/>
    <rect x="150" y="172.5" width="44" height="42"   fill="#bc4749"/>
    <rect x="150" y="141"   width="44" height="31.5" fill="#1b2a3a"/>
    <rect x="150" y="120"   width="44" height="21"   fill="#c9d3dd"/>
  </g>

  <!-- 10x depth annotation -->
  <line x1="205" y1="120" x2="205" y2="330" stroke="#2a6f97" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="212" y="128" font-size="12" font-weight="bold" fill="#2a6f97">10× deeper</text>

  <!-- baseline -->
  <line x1="62" y1="330" x2="216" y2="330" stroke="#1b2a3a" stroke-width="2"/>

  <!-- cell labels -->
  <text x="102" y="347" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell A</text>
  <text x="102" y="362" font-size="12" fill="#1b2a3a" text-anchor="middle">2,000 UMIs</text>
  <text x="172" y="347" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell B</text>
  <text x="172" y="362" font-size="12" fill="#1b2a3a" text-anchor="middle">20,000 UMIs</text>

  <!-- =============== ARROW / OPERATION =============== -->
  <text x="392" y="200" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">divide each cell by its total,</text>
  <text x="392" y="217" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">then × scale factor  s = 10,000</text>
  <line x1="300" y1="235" x2="486" y2="235" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- =============== RIGHT PANEL: normalized =============== -->
  <text x="612" y="26" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">normalized</text>
  <text x="612" y="46" font-size="12" font-style="italic" fill="#6a994e" text-anchor="middle">same total height, same proportions</text>
  <text x="612" y="61" font-size="12" font-style="italic" fill="#6a994e" text-anchor="middle">→ directly comparable</text>

  <!-- dashed common level (= 10,000) -->
  <line x1="540" y1="225" x2="700" y2="225" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="700" y="221" font-size="12" font-weight="bold" fill="#2a6f97" text-anchor="end">both = 10,000</text>

  <!-- Cell A normalized (10,000 -> 105 px) -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="560" y="298.5" width="44" height="31.5" fill="#2a6f97"/>
    <rect x="560" y="272.25" width="44" height="26.25" fill="#6a994e"/>
    <rect x="560" y="251.25" width="44" height="21"   fill="#bc4749"/>
    <rect x="560" y="235.5" width="44" height="15.75" fill="#1b2a3a"/>
    <rect x="560" y="225"   width="44" height="10.5"  fill="#c9d3dd"/>
  </g>

  <!-- Cell B normalized (10,000 -> 105 px) -->
  <g stroke="#ffffff" stroke-width="1">
    <rect x="630" y="298.5" width="44" height="31.5" fill="#2a6f97"/>
    <rect x="630" y="272.25" width="44" height="26.25" fill="#6a994e"/>
    <rect x="630" y="251.25" width="44" height="21"   fill="#bc4749"/>
    <rect x="630" y="235.5" width="44" height="15.75" fill="#1b2a3a"/>
    <rect x="630" y="225"   width="44" height="10.5"  fill="#c9d3dd"/>
  </g>

  <!-- baseline -->
  <line x1="542" y1="330" x2="696" y2="330" stroke="#1b2a3a" stroke-width="2"/>

  <!-- cell labels -->
  <text x="582" y="347" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell A</text>
  <text x="582" y="362" font-size="12" fill="#1b2a3a" text-anchor="middle">10,000</text>
  <text x="652" y="347" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell B</text>
  <text x="652" y="362" font-size="12" fill="#1b2a3a" text-anchor="middle">10,000</text>

  <!-- =============== FORMULA CAPTION =============== -->
  <text x="380" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">~X_cg = ( X_cg / &#8721;_g X_cg ) &#183; s</text>
  <text x="380" y="398" font-size="11.5" font-style="italic" fill="#2a6f97" text-anchor="middle">single-cell cousin of CPM / TPM → relative expression per cell</text>
</svg>
