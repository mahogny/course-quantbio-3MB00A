<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9.0 7.2 777.9 398.3" font-family="Helvetica, Arial, sans-serif" width="777.9" height="398.3">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="274.9" x2="700" y2="274.9"/>
    <line x1="90" y1="209.7" x2="700" y2="209.7"/>
    <line x1="90" y1="144.6" x2="700" y2="144.6"/>
    <line x1="90" y1="79.4" x2="700" y2="79.4"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="90" y1="40" x2="90" y2="340" marker-end="url(#arrow)"/>
    <line x1="90" y1="340" x2="710" y2="340" marker-end="url(#arrow)"/>
  </g>

  <!-- x ticks + labels -->
  <g fill="#1b2a3a" font-size="12" text-anchor="middle">
    <text x="90"  y="357">0</text>
    <text x="212" y="357">2000</text>
    <text x="334" y="357">4000</text>
    <text x="456" y="357">6000</text>
    <text x="578" y="357">8000</text>
    <text x="700" y="357">10000</text>
  </g>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="212" y1="340" x2="212" y2="345"/>
    <line x1="334" y1="340" x2="334" y2="345"/>
    <line x1="456" y1="340" x2="456" y2="345"/>
    <line x1="578" y1="340" x2="578" y2="345"/>
    <line x1="700" y1="340" x2="700" y2="345"/>
  </g>

  <!-- y ticks + labels -->
  <g fill="#1b2a3a" font-size="12" text-anchor="end">
    <text x="82" y="344">0</text>
    <text x="82" y="279">2</text>
    <text x="82" y="214">4</text>
    <text x="82" y="149">6</text>
    <text x="82" y="83">8</text>
  </g>

  <!-- axis titles -->
  <text x="400" y="380" fill="#1b2a3a" font-size="15" text-anchor="middle">normalized expression x</text>
  <text x="24" y="190" fill="#1b2a3a" font-size="15" text-anchor="middle" transform="rotate(-90 24 190)">log(1+x)</text>

  <!-- HIGH genes: far apart on x, close together on y (compressed) -->
  <g stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="212" y1="340" x2="212" y2="92.4"/>
    <line x1="212" y1="92.4" x2="90" y2="92.4"/>
    <line x1="578" y1="340" x2="578" y2="47.3"/>
    <line x1="578" y1="47.3" x2="90" y2="47.3"/>
  </g>
  <g fill="#bc4749">
    <circle cx="212" cy="92.4" r="4.5"/>
    <circle cx="578" cy="47.3" r="4.5"/>
  </g>
  <text x="222" y="88"  fill="#bc4749" font-size="12">x=2000 → 7.60</text>
  <text x="452" y="42"  fill="#bc4749" font-size="12">x=8000 → 8.99</text>

  <!-- compression bracket at the y-axis -->
  <line x1="104" y1="47.3" x2="104" y2="92.4" stroke="#bc4749" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="112" y="66" fill="#bc4749" font-size="12" font-weight="bold">Δy ≈ 1.4</text>
  <text x="112" y="80" fill="#bc4749" font-size="11">compressed</text>

  <!-- the log1p curve -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.6"
    points="90,340 90.1,317.4 90.3,281.6 91.2,240.8 93.1,211.9 96.1,189.7 102.2,167.3 114.4,144.7 132.7,126.6 151,115 181.5,101.8 212,92.4 273,79.2 334,69.9 456,56.6 578,47.3 700,40"/>
  <text x="600" y="66" fill="#2a6f97" font-size="15" font-weight="bold">y = log(1 + x)</text>

  <!-- LOW genes: crowded on x near 0, well separated on y -->
  <g fill="#6a994e">
    <circle cx="91"  cy="317.4" r="4.5"/>
    <circle cx="92"  cy="281.6" r="4.5"/>
    <circle cx="93"  cy="240.8" r="4.5"/>
  </g>
  <g fill="#6a994e" font-size="12">
    <text x="132" y="321">x=1  → 0.69</text>
    <text x="132" y="285">x=5  → 1.79</text>
    <text x="132" y="245">x=20 → 3.05</text>
  </g>
  <!-- spread bracket -->
  <line x1="104" y1="240.8" x2="104" y2="317.4" stroke="#6a994e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="112" y="296" fill="#6a994e" font-size="12" font-weight="bold">large Δy</text>
  <text x="112" y="310" fill="#6a994e" font-size="11">spread out</text>
  <text x="96" y="333" fill="#6a994e" font-size="10">(crowded near x=0)</text>

  <!-- origin point (0,0) -->
  <circle cx="90" cy="340" r="5" fill="#1b2a3a"/>
  <line x1="90" y1="340" x2="216" y2="336" stroke="#1b2a3a" stroke-width="1"/>
  <text x="224" y="330" fill="#1b2a3a" font-size="12" font-weight="bold">x=0 → y=0</text>
  <text x="224" y="344" fill="#1b2a3a" font-size="11">zeros stay zeros</text>

  <!-- side callout -->
  <rect x="438" y="150" width="308" height="150" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="454" y="172" fill="#1b2a3a" font-size="13" font-weight="bold">Why the log?</text>
  <g fill="#1b2a3a" font-size="12.5">
    <text x="454" y="194">log compresses huge values so a</text>
    <text x="454" y="212">few high-count genes do not</text>
    <text x="454" y="230">dominate distance / variance.</text>
    <text x="454" y="256">· stabilizes variance</text>
    <text x="454" y="278">· +1 avoids log(0) = -∞</text>
  </g>
</svg>
