<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.2 4 893.5 360" font-family="Helvetica, Arial, sans-serif" width="893.5" height="360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ Panel 1: GOOD ============ -->
  <g transform="translate(28,0)">
    <text x="122" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a994e">ideal</text>
    <!-- droplet -->
    <circle cx="122" cy="120" r="70" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <!-- one intact cell -->
    <circle cx="122" cy="120" r="30" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5" opacity="0.85"/>
    <circle cx="122" cy="120" r="11" fill="#1b2a3a" opacity="0.55"/>
    <!-- green tick badge -->
    <circle cx="172" cy="72" r="15" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.2"/>
    <path d="M164,72 L170,79 L181,64" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">one cell → real profile</text>
  </g>

  <!-- ============ Panel 2: EMPTY ============ -->
  <g transform="translate(108,0)">
    <text x="342" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">empty droplet</text>
    <circle cx="342" cy="120" r="70" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <!-- scattered free-floating mRNA specks (ambient RNA) -->
    <g fill="#9aa5b1" stroke="#1b2a3a" stroke-width="0.6">
      <circle cx="315" cy="95"  r="3"/>
      <circle cx="360" cy="105" r="3"/>
      <circle cx="330" cy="130" r="3"/>
      <circle cx="368" cy="140" r="3"/>
      <circle cx="308" cy="125" r="3"/>
      <circle cx="348" cy="90"  r="3"/>
      <circle cx="325" cy="152" r="3"/>
      <circle cx="355" cy="128" r="3"/>
      <circle cx="338" cy="112" r="3"/>
    </g>
    <!-- red cross badge -->
    <circle cx="392" cy="72" r="15" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <path d="M385,65 L399,79 M399,65 L385,79" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="342" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">only ambient RNA</text>
    <text x="342" y="239" text-anchor="middle" font-size="11.5" fill="#bc4749">→ faint fake cell</text>
  </g>

  <!-- ============ Panel 3: LOW-QUALITY ============ -->
  <g transform="translate(-32,0)">
    <text x="782" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">dying / damaged</text>
    <circle cx="782" cy="120" r="70" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <!-- broken / dashed membrane cell -->
    <circle cx="782" cy="120" r="30" fill="#2a6f97" fill-opacity="0.35" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="782" cy="120" r="10" fill="#1b2a3a" opacity="0.45"/>
    <!-- leaking cytoplasm squiggles -->
    <g fill="none" stroke="#bc4749" stroke-width="1.8" stroke-linecap="round">
      <path d="M808,102 q10,-6 6,-16 q-4,-9 8,-13"/>
      <path d="M810,120 q14,0 16,-10 q2,-9 12,-9"/>
      <path d="M804,140 q11,6 6,17 q-4,8 7,12"/>
    </g>
    <!-- leaked RNA specks outside -->
    <g fill="#9aa5b1" stroke="#1b2a3a" stroke-width="0.6">
      <circle cx="822" cy="90"  r="2.6"/>
      <circle cx="834" cy="128" r="2.6"/>
      <circle cx="818" cy="156" r="2.6"/>
    </g>
    <!-- red cross badge -->
    <circle cx="832" cy="72" r="15" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <path d="M825,65 L839,79 M839,65 L825,79" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">leaked RNA, stressed</text>
  </g>

  <!-- ============ Banner ============ -->
  <rect x="30" y="262" width="840" height="60" rx="8" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.8"/>
  <text x="450" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">If not removed, these masquerade as real cells</text>
  <text x="450" y="310" text-anchor="middle" font-size="14" fill="#bc4749">→ fake cell types &amp; fake intermediate states</text>

  <!-- arrows from failure panels down to banner -->
  <g stroke="#bc4749" stroke-width="1.6" fill="none">
    <path d="M450,250 L450,261" marker-end="url(#arrow)"/>
    <path d="M750,250 L750,261" marker-end="url(#arrow)"/>
  </g>

  <text x="450" y="352" text-anchor="middle" font-size="13" fill="#1b2a3a" font-style="italic">The count matrix is raw: only the green-tick droplets are trustworthy cells.</text>
</svg>
