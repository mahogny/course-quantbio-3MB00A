<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shared cell blob -->
  <text x="120" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">One tumour biopsy</text>
  <text x="120" y="48" text-anchor="middle" font-size="12" fill="#1b2a3a">~15 mixed cells</text>

  <!-- 15 cells: tumour grey, T blue x2 (rare), B orange, macrophage green, fibroblast purple, endothelial red -->
  <g stroke="#1b2a3a" stroke-width="1">
    <!-- tumour grey -->
    <circle cx="70"  cy="90"  r="10" fill="#9aa5b1"/>
    <circle cx="95"  cy="72"  r="10" fill="#9aa5b1"/>
    <circle cx="120" cy="95"  r="10" fill="#9aa5b1"/>
    <circle cx="150" cy="78"  r="10" fill="#9aa5b1"/>
    <circle cx="85"  cy="118" r="10" fill="#9aa5b1"/>
    <circle cx="140" cy="120" r="10" fill="#9aa5b1"/>
    <!-- T cells blue, rare, 2 only -->
    <circle cx="115" cy="120" r="10" fill="#2a6f97"/>
    <circle cx="168" cy="102" r="10" fill="#2a6f97"/>
    <!-- B cells orange -->
    <circle cx="60"  cy="115" r="10" fill="#e8973a"/>
    <circle cx="175" cy="128" r="10" fill="#e8973a"/>
    <!-- macrophage green -->
    <circle cx="100" cy="145" r="10" fill="#6a994e"/>
    <circle cx="150" cy="148" r="10" fill="#6a994e"/>
    <!-- fibroblast purple -->
    <circle cx="70"  cy="150" r="10" fill="#8e6fb0"/>
    <!-- endothelial red -->
    <circle cx="125" cy="55"  r="10" fill="#bc4749"/>
    <circle cx="45"  cy="88"  r="10" fill="#bc4749"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#1b2a3a">
    <circle cx="30" cy="185" r="6" fill="#9aa5b1"/><text x="42" y="189">tumour</text>
    <circle cx="110" cy="185" r="6" fill="#2a6f97"/><text x="122" y="189">T cell (rare)</text>
    <circle cx="215" cy="185" r="6" fill="#e8973a"/><text x="227" y="189">B cell</text>
    <circle cx="30" cy="205" r="6" fill="#6a994e"/><text x="42" y="209">macrophage</text>
    <circle cx="130" cy="205" r="6" fill="#8e6fb0"/><text x="142" y="209">fibroblast</text>
    <circle cx="215" cy="205" r="6" fill="#bc4749"/><text x="227" y="209">endothelial</text>
  </g>

  <!-- divider -->
  <line x1="290" y1="20" x2="290" y2="360" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- LEFT PANEL: Bulk RNA-seq -->
  <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Bulk RNA-seq</text>
  <path d="M195,110 C260,110 300,110 335,110" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="300" y="98" text-anchor="middle" font-size="11" fill="#1b2a3a">grind + average</text>

  <!-- single grey bar -->
  <rect x="330" y="130" width="150" height="26" rx="3" fill="#9aa5b1" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- faint blue sliver = averaged-away T-cell signal -->
  <rect x="330" y="130" width="10" height="26" rx="3" fill="#2a6f97" opacity="0.25"/>
  <text x="405" y="180" text-anchor="middle" font-size="12" fill="#1b2a3a">average expression</text>
  <text x="405" y="196" text-anchor="middle" font-size="12" fill="#1b2a3a">(one number per gene)</text>
  <text x="405" y="230" text-anchor="middle" font-size="11" fill="#2a6f97">rare T-cell signal averaged</text>
  <text x="405" y="245" text-anchor="middle" font-size="11" fill="#2a6f97">away into faint background</text>

  <!-- RIGHT PANEL: Single-cell RNA-seq -->
  <text x="640" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Single-cell RNA-seq</text>
  <path d="M195,140 C400,175 470,180 520,180" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="248" y="136" text-anchor="middle" font-size="11" fill="#1b2a3a">one profile per cell</text>

  <!-- scatter axes -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="530" y1="330" x2="770" y2="330"/>
    <line x1="530" y1="330" x2="530" y2="70"/>
  </g>

  <!-- clusters, coloured by cell type -->
  <g stroke="#1b2a3a" stroke-width="0.8">
    <!-- tumour grey cluster -->
    <circle cx="580" cy="115" r="6" fill="#9aa5b1"/>
    <circle cx="595" cy="128" r="6" fill="#9aa5b1"/>
    <circle cx="608" cy="112" r="6" fill="#9aa5b1"/>
    <circle cx="600" cy="140" r="6" fill="#9aa5b1"/>
    <circle cx="618" cy="128" r="6" fill="#9aa5b1"/>
    <circle cx="585" cy="142" r="6" fill="#9aa5b1"/>
    <!-- endothelial red cluster -->
    <circle cx="700" cy="105" r="6" fill="#bc4749"/>
    <circle cx="715" cy="118" r="6" fill="#bc4749"/>
    <circle cx="705" cy="128" r="6" fill="#bc4749"/>
    <!-- B cell orange cluster -->
    <circle cx="730" cy="180" r="6" fill="#e8973a"/>
    <circle cx="745" cy="192" r="6" fill="#e8973a"/>
    <circle cx="733" cy="200" r="6" fill="#e8973a"/>
    <!-- macrophage green cluster -->
    <circle cx="670" cy="215" r="6" fill="#6a994e"/>
    <circle cx="685" cy="228" r="6" fill="#6a994e"/>
    <circle cx="672" cy="235" r="6" fill="#6a994e"/>
    <!-- fibroblast purple cluster -->
    <circle cx="565" cy="255" r="6" fill="#8e6fb0"/>
    <circle cx="580" cy="268" r="6" fill="#8e6fb0"/>
    <circle cx="568" cy="278" r="6" fill="#8e6fb0"/>
    <!-- T cell blue: own small group, 2 dots, clearly visible -->
    <circle cx="740" cy="285" r="6" fill="#2a6f97"/>
    <circle cx="752" cy="295" r="6" fill="#2a6f97"/>
  </g>
  <!-- highlight the rare T-cell group -->
  <ellipse cx="746" cy="290" rx="24" ry="20" fill="none" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="746" y="322" text-anchor="middle" font-size="10" fill="#2a6f97">rare T cells</text>

  <text x="770" y="348" text-anchor="end" font-size="11" fill="#1b2a3a" font-style="italic">dim 1 →</text>
  <text x="518" y="80" text-anchor="end" font-size="11" fill="#1b2a3a" font-style="italic">dim 2</text>

  <!-- caption -->
  <text x="400" y="388" text-anchor="middle" font-size="13" fill="#1b2a3a">Bulk averages the mixture; single-cell resolves each cell type, including rare ones.</text>
</svg>
