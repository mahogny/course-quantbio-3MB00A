<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.3 -3.9 626.5 355.9" font-family="'DejaVu Sans','Helvetica',sans-serif" width="626.5" height="355.9">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- top margin annotation: columns = genes -->
  <text x="380" y="26" text-anchor="middle" font-size="16" fill="#2a6f97" font-weight="bold">columns = genes (features)</text>
  <line x1="180" y1="34" x2="580" y2="34" stroke="#2a6f97" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- gene column labels (rotated) -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="13" fill="#1b2a3a">
    <text x="210" y="72" text-anchor="start" transform="rotate(-40 210 72)">CD3D</text>
    <text x="255" y="72" text-anchor="start" transform="rotate(-40 255 72)">MS4A1</text>
    <text x="300" y="72" text-anchor="start" transform="rotate(-40 300 72)">GAPDH</text>
    <text x="345" y="72" text-anchor="start" transform="rotate(-40 345 72)">LYZ</text>
    <text x="390" y="72" text-anchor="start" transform="rotate(-40 390 72)">CD8A</text>
    <text x="435" y="72" text-anchor="start" transform="rotate(-40 435 72)">ACTB</text>
    <text x="480" y="72" text-anchor="start" transform="rotate(-40 480 72)">IL7R</text>
    <text x="525" y="72" text-anchor="start" transform="rotate(-40 525 72)">EPCAM</text>
  </g>

  <!-- left margin annotation: rows = cells -->
  <text x="66" y="200" text-anchor="middle" font-size="16" fill="#bc4749" font-weight="bold" transform="rotate(-90 66 200)">rows = cells (samples)</text>
  <line x1="86" y1="100" x2="86" y2="290" stroke="#bc4749" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- cell row labels -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="13" fill="#1b2a3a">
    <text x="170" y="103" text-anchor="end">cell1</text>
    <text x="170" y="133" text-anchor="end">cell2</text>
    <text x="170" y="163" text-anchor="end">cell3</text>
    <text x="170" y="193" text-anchor="end">cell4</text>
    <text x="170" y="223" text-anchor="end">cell5</text>
    <text x="170" y="253" text-anchor="end">cell6</text>
  </g>

  <!-- matrix brackets -->
  <path d="M188,84 L182,84 L182,266 L188,266" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M552,84 L558,84 L558,266 L552,266" fill="none" stroke="#1b2a3a" stroke-width="2"/>

  <!-- grid: 6 rows x 8 cols, cell size 45, origin x=190 y=84 -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- horizontal lines -->
    <line x1="190" y1="84"  x2="550" y2="84"/>
    <line x1="190" y1="114" x2="550" y2="114"/>
    <line x1="190" y1="144" x2="550" y2="144"/>
    <line x1="190" y1="174" x2="550" y2="174"/>
    <line x1="190" y1="204" x2="550" y2="204"/>
    <line x1="190" y1="234" x2="550" y2="234"/>
    <line x1="190" y1="264" x2="550" y2="264"/>
    <!-- vertical lines -->
    <line x1="190" y1="84" x2="190" y2="264"/>
    <line x1="235" y1="84" x2="235" y2="264"/>
    <line x1="280" y1="84" x2="280" y2="264"/>
    <line x1="325" y1="84" x2="325" y2="264"/>
    <line x1="370" y1="84" x2="370" y2="264"/>
    <line x1="415" y1="84" x2="415" y2="264"/>
    <line x1="460" y1="84" x2="460" y2="264"/>
    <line x1="505" y1="84" x2="505" y2="264"/>
    <line x1="550" y1="84" x2="550" y2="264"/>
  </g>

  <!-- highlight tint for the callout cell (row2, ACTB col = value 5): x cell index 5 => x 415..460, row2 y 114..144 -->
  <rect x="415" y="114" width="45" height="30" fill="#eaf1f7"/>
  <rect x="415" y="114" width="45" height="30" fill="none" stroke="#2a6f97" stroke-width="2"/>

  <!-- matrix numbers -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="15" text-anchor="middle">
    <!-- row1 = 0 0 4 0 0 3 0 0 -->
    <g fill="#c9d3dd"><text x="212" y="104">0</text><text x="257" y="104">0</text></g>
    <text x="302" y="104" fill="#6a994e" font-weight="bold">4</text>
    <g fill="#c9d3dd"><text x="347" y="104">0</text><text x="392" y="104">0</text></g>
    <text x="437" y="104" fill="#6a994e" font-weight="bold">3</text>
    <g fill="#c9d3dd"><text x="482" y="104">0</text><text x="527" y="104">0</text></g>

    <!-- row2 = 2 0 0 0 1 5 0 0 -->
    <text x="212" y="134" fill="#6a994e" font-weight="bold">2</text>
    <g fill="#c9d3dd"><text x="257" y="134">0</text><text x="302" y="134">0</text><text x="347" y="134">0</text></g>
    <text x="392" y="134" fill="#6a994e" font-weight="bold">1</text>
    <text x="437" y="134" fill="#2a6f97" font-weight="bold">5</text>
    <g fill="#c9d3dd"><text x="482" y="134">0</text><text x="527" y="134">0</text></g>

    <!-- row3 = 0 0 0 0 0 2 0 1 -->
    <g fill="#c9d3dd"><text x="212" y="164">0</text><text x="257" y="164">0</text><text x="302" y="164">0</text><text x="347" y="164">0</text><text x="392" y="164">0</text></g>
    <text x="437" y="164" fill="#6a994e" font-weight="bold">2</text>
    <text x="482" y="164" fill="#c9d3dd">0</text>
    <text x="527" y="164" fill="#6a994e" font-weight="bold">1</text>

    <!-- row4 = 0 3 0 0 0 4 0 0 -->
    <text x="212" y="194" fill="#c9d3dd">0</text>
    <text x="257" y="194" fill="#6a994e" font-weight="bold">3</text>
    <g fill="#c9d3dd"><text x="302" y="194">0</text><text x="347" y="194">0</text><text x="392" y="194">0</text></g>
    <text x="437" y="194" fill="#6a994e" font-weight="bold">4</text>
    <g fill="#c9d3dd"><text x="482" y="194">0</text><text x="527" y="194">0</text></g>

    <!-- row5 = 0 0 0 0 0 0 0 0 -->
    <g fill="#c9d3dd"><text x="212" y="224">0</text><text x="257" y="224">0</text><text x="302" y="224">0</text><text x="347" y="224">0</text><text x="392" y="224">0</text><text x="437" y="224">0</text><text x="482" y="224">0</text><text x="527" y="224">0</text></g>

    <!-- row6 = 1 0 0 0 0 6 0 0 -->
    <text x="212" y="254" fill="#6a994e" font-weight="bold">1</text>
    <g fill="#c9d3dd"><text x="257" y="254">0</text><text x="302" y="254">0</text><text x="347" y="254">0</text><text x="392" y="254">0</text></g>
    <text x="437" y="254" fill="#6a994e" font-weight="bold">6</text>
    <g fill="#c9d3dd"><text x="482" y="254">0</text><text x="527" y="254">0</text></g>
  </g>

  <!-- callout for highlighted entry: leader descends along the ACTB/IL7R gridline (clear of all numbers), then turns to the definition -->
  <path d="M460,144 L460,278 L368,309" fill="none" stroke="#2a6f97" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-family="'DejaVu Sans Mono','Courier New',monospace">
    <text x="360" y="318" font-size="14" fill="#2a6f97" font-weight="bold">X</text>
    <text x="372" y="322" font-size="11" fill="#2a6f97" font-weight="bold">cg</text>
    <text x="385" y="318" font-size="14" fill="#1b2a3a">= molecules of gene g in cell c</text>
    <text x="385" y="338" font-size="14" fill="#1b2a3a">(non-negative integer count)</text>
  </g>
</svg>
