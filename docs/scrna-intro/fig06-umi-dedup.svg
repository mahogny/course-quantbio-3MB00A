<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -8 899 441" width="899" height="441" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- TOP: two real mRNA molecules of one gene, each with a distinct UMI -->
  <text x="20" y="20" font-size="14" font-weight="bold" fill="#1b2a3a">One gene, one cell: 2 real mRNA molecules, each tagged with a unique UMI</text>

  <!-- molecule A: mRNA body + red UMI tag -->
  <g>
    <rect x="150" y="38" width="130" height="20" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="150" y="38" width="34" height="20" rx="10" fill="#bc4749" stroke="#bc4749"/>
    <text x="245" y="52" font-size="12" fill="#1b2a3a" text-anchor="middle">mRNA A</text>
    <text x="167" y="75" font-size="12.5" font-weight="bold" fill="#bc4749" text-anchor="middle">UMI-red</text>
  </g>
  <!-- molecule B: mRNA body + blue UMI tag -->
  <g>
    <rect x="540" y="38" width="130" height="20" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="540" y="38" width="34" height="20" rx="10" fill="#2a6f97" stroke="#2a6f97"/>
    <text x="635" y="52" font-size="12" fill="#1b2a3a" text-anchor="middle">mRNA B</text>
    <text x="557" y="75" font-size="12.5" font-weight="bold" fill="#2a6f97" text-anchor="middle">UMI-blue</text>
  </g>

  <!-- MIDDLE: PCR branches, copying unevenly -->
  <text x="430" y="112" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">PCR copies molecules unevenly</text>

  <!-- branching arrows A (red) into 7 reads -->
  <g stroke="#bc4749" stroke-width="1.5" fill="none" marker-end="url(#aRed)">
    <line x1="215" y1="80" x2="44"  y2="146"/>
    <line x1="215" y1="80" x2="86"  y2="146"/>
    <line x1="215" y1="80" x2="128" y2="146"/>
    <line x1="215" y1="80" x2="170" y2="146"/>
    <line x1="215" y1="80" x2="212" y2="146"/>
    <line x1="215" y1="80" x2="254" y2="146"/>
    <line x1="215" y1="80" x2="296" y2="146"/>
  </g>
  <!-- branching arrows B (blue) into 2 reads -->
  <g stroke="#2a6f97" stroke-width="1.5" fill="none" marker-end="url(#aBlue)">
    <line x1="605" y1="80" x2="574" y2="146"/>
    <line x1="605" y1="80" x2="616" y2="146"/>
  </g>

  <!-- 7 red reads -->
  <g fill="#bc4749">
    <rect x="30"  y="150" width="28" height="14" rx="4"/>
    <rect x="72"  y="150" width="28" height="14" rx="4"/>
    <rect x="114" y="150" width="28" height="14" rx="4"/>
    <rect x="156" y="150" width="28" height="14" rx="4"/>
    <rect x="198" y="150" width="28" height="14" rx="4"/>
    <rect x="240" y="150" width="28" height="14" rx="4"/>
    <rect x="282" y="150" width="28" height="14" rx="4"/>
  </g>
  <text x="170" y="186" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">7 copies</text>
  <!-- 2 blue reads -->
  <g fill="#2a6f97">
    <rect x="560" y="150" width="28" height="14" rx="4"/>
    <rect x="602" y="150" width="28" height="14" rx="4"/>
  </g>
  <text x="595" y="186" font-size="12.5" fill="#2a6f97" text-anchor="middle" font-weight="bold">2 copies</text>
  <text x="760" y="159" font-size="13" fill="#1b2a3a">= 9 reads sequenced</text>

  <!-- divider -->
  <line x1="20" y1="198" x2="860" y2="198" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- BOTTOM LEFT: raw read counting -->
  <rect x="20" y="206" width="410" height="172" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="225" y="228" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Raw read count: count every read</text>
  <!-- 9 tally dots -->
  <g fill="#bc4749">
    <circle cx="70"  cy="262" r="8"/>
    <circle cx="98"  cy="262" r="8"/>
    <circle cx="126" cy="262" r="8"/>
    <circle cx="154" cy="262" r="8"/>
    <circle cx="182" cy="262" r="8"/>
    <circle cx="210" cy="262" r="8"/>
    <circle cx="238" cy="262" r="8"/>
  </g>
  <g fill="#2a6f97">
    <circle cx="290" cy="262" r="8"/>
    <circle cx="318" cy="262" r="8"/>
  </g>
  <text x="378" y="267" font-size="20" font-weight="bold" fill="#bc4749" text-anchor="middle">= 9</text>
  <text x="225" y="326" font-size="15" fill="#bc4749" text-anchor="middle" font-weight="bold">distorted</text>
  <text x="225" y="350" font-size="13.5" fill="#1b2a3a" text-anchor="middle">red looks 3.5× more expressed (7 : 2)</text>

  <!-- BOTTOM RIGHT: UMI counting -->
  <rect x="450" y="206" width="410" height="172" rx="8" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.8"/>
  <text x="655" y="228" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">UMI count: collapse reads sharing a UMI</text>
  <!-- 7 red reads converging to 1 molecule -->
  <g fill="#bc4749">
    <rect x="486" y="244" width="20" height="11" rx="3"/>
    <rect x="510" y="244" width="20" height="11" rx="3"/>
    <rect x="534" y="244" width="20" height="11" rx="3"/>
    <rect x="558" y="244" width="20" height="11" rx="3"/>
    <rect x="486" y="260" width="20" height="11" rx="3"/>
    <rect x="510" y="260" width="20" height="11" rx="3"/>
    <rect x="534" y="260" width="20" height="11" rx="3"/>
  </g>
  <g stroke="#6a994e" stroke-width="1.4" fill="none" marker-end="url(#aGreen)">
    <line x1="496" y1="274" x2="528" y2="304"/>
    <line x1="522" y1="274" x2="530" y2="304"/>
    <line x1="546" y1="274" x2="532" y2="304"/>
  </g>
  <rect x="506" y="308" width="52" height="16" rx="8" fill="#bc4749"/>
  <text x="532" y="341" font-size="12" fill="#1b2a3a" text-anchor="middle">1 molecule</text>
  <!-- 2 blue reads converging to 1 molecule -->
  <g fill="#2a6f97">
    <rect x="672" y="252" width="20" height="11" rx="3"/>
    <rect x="696" y="252" width="20" height="11" rx="3"/>
  </g>
  <g stroke="#6a994e" stroke-width="1.4" fill="none" marker-end="url(#aGreen)">
    <line x1="682" y1="266" x2="692" y2="304"/>
    <line x1="706" y1="266" x2="696" y2="304"/>
  </g>
  <rect x="668" y="308" width="52" height="16" rx="8" fill="#2a6f97"/>
  <text x="694" y="341" font-size="12" fill="#1b2a3a" text-anchor="middle">1 molecule</text>
  <!-- result -->
  <text x="800" y="290" font-size="20" font-weight="bold" fill="#6a994e" text-anchor="middle">= 2</text>
  <text x="800" y="311" font-size="12.5" fill="#6a994e" text-anchor="middle" font-weight="bold">distinct</text>
  <text x="800" y="327" font-size="12.5" fill="#6a994e" text-anchor="middle" font-weight="bold">(true)</text>

  <!-- takeaway banner -->
  <rect x="20" y="388" width="840" height="26" rx="6" fill="#eef4e8" stroke="#6a994e" stroke-width="1.5"/>
  <text x="440" y="406" font-size="15" font-weight="bold" fill="#6a994e" text-anchor="middle">Count unique UMIs, not reads  →  removes amplification bias</text>
</svg>
