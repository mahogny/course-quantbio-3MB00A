<svg xmlns="http://www.w3.org/2000/svg" width="867.4" height="323.1" viewBox="-5.5 -11.4 867.4 323.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- stage titles -->
  <text x="115" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">1 - Encapsulate</text>
  <text x="355" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">2 - Lyse and tag</text>
  <text x="600" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">3 - Pool</text>
  <text x="790" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">4 - Count</text>

  <!-- STAGE 1: microfluidic junction -->
  <!-- aqueous (cell) channel -->
  <path d="M20,110 L95,110 L95,150 L20,150 Z" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="24" y="104" font-size="10" fill="#2a6f97">cells + beads</text>
  <!-- oil channels top and bottom -->
  <path d="M75,60 L120,60 L110,110 L95,110 Z" fill="#fdf3e7" stroke="#bc4749" stroke-width="1.5"/>
  <path d="M75,200 L120,200 L110,150 L95,150 Z" fill="#fdf3e7" stroke="#bc4749" stroke-width="1.5"/>
  <text x="80" y="52" font-size="10" fill="#bc4749">oil</text>
  <text x="80" y="216" font-size="10" fill="#bc4749">oil</text>
  <!-- outlet channel with pinch -->
  <path d="M110,110 L210,118 L210,142 L110,150 Z" fill="#fdf3e7" stroke="#bc4749" stroke-width="1.5"/>

  <!-- formed droplet in outlet -->
  <circle cx="175" cy="130" r="24" fill="#ffffff" stroke="#bc4749" stroke-width="2"/>
  <circle cx="168" cy="126" r="8" fill="#6a994e" stroke="#3f5e2e" stroke-width="1"/>
  <path d="M182,138 l7,0 l0,7 l-7,0 l-3.5,4 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
  <text x="175" y="172" text-anchor="middle" font-size="9" fill="#1b2a3a">1 cell + 1 bead</text>

  <!-- legend for droplet contents -->
  <circle cx="30" cy="185" r="6" fill="#6a994e" stroke="#3f5e2e" stroke-width="1"/>
  <text x="40" y="189" font-size="10" fill="#1b2a3a">cell</text>
  <path d="M28,232 l7,0 l0,7 l-7,0 l-3.5,4 z" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
  <text x="40" y="239" font-size="10" fill="#1b2a3a">barcoded gel bead</text>

  <text x="115" y="272" text-anchor="middle" font-size="10" fill="#1b2a3a">ideally one cell +</text>
  <text x="115" y="285" text-anchor="middle" font-size="10" fill="#1b2a3a">one bead per droplet</text>

  <!-- arrow 1 to 2 -->
  <line x1="212" y1="130" x2="248" y2="130" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 2: zoom into one droplet -->
  <circle cx="355" cy="140" r="82" fill="#ffffff" stroke="#bc4749" stroke-width="2"/>
  <!-- lysed cell ghost -->
  <path d="M300,120 q-6,-14 8,-18 q4,-12 18,-6 q10,-8 16,4 q14,-2 10,12 q10,8 -2,16 q-6,10 -18,4 q-10,6 -18,-4 q-14,0 -14,-12 z" fill="#eef6ea" stroke="#6a994e" stroke-width="1.2" stroke-dasharray="3,3" transform="translate(-8,-2)"/>
  <text x="325" y="80" text-anchor="middle" font-size="9" fill="#6a994e">lysed cell</text>

  <!-- gel bead in droplet -->
  <path d="M356,174 l9,0 l0,9 l-9,0 l-4.5,5 z" fill="#f2c94c" stroke="#1b2a3a" stroke-width="1"/>
  <text x="356" y="202" text-anchor="middle" font-size="8" fill="#1b2a3a">cell barcode source</text>

  <!-- mRNA squiggles, each with shared barcode (orange) + distinct UMI -->
  <!-- molecule 1 -->
  <path d="M320,140 q8,-8 16,0 q8,8 16,0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <rect x="312" y="135" width="9" height="9" rx="1.5" fill="#f2994a" stroke="#1b2a3a" stroke-width="0.8"/>
  <rect x="349" y="135" width="9" height="9" rx="1.5" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.8"/>
  <!-- molecule 2 -->
  <path d="M320,162 q8,-8 16,0 q8,8 16,0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <rect x="312" y="157" width="9" height="9" rx="1.5" fill="#f2994a" stroke="#1b2a3a" stroke-width="0.8"/>
  <rect x="349" y="157" width="9" height="9" rx="1.5" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.8"/>
  <!-- molecule 3 -->
  <path d="M320,118 q8,-8 16,0 q8,8 16,0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <rect x="312" y="113" width="9" height="9" rx="1.5" fill="#f2994a" stroke="#1b2a3a" stroke-width="0.8"/>
  <rect x="349" y="113" width="9" height="9" rx="1.5" fill="#9b5de5" stroke="#1b2a3a" stroke-width="0.8"/>

  <!-- mini legend inside stage 2 -->
  <rect x="278" y="230" width="9" height="9" rx="1.5" fill="#f2994a" stroke="#1b2a3a" stroke-width="0.8"/>
  <text x="291" y="238" font-size="9" fill="#1b2a3a">cell barcode (same for all)</text>
  <rect x="278" y="245" width="9" height="9" rx="1.5" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.8"/>
  <rect x="289" y="245" width="9" height="9" rx="1.5" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.8"/>
  <rect x="300" y="245" width="9" height="9" rx="1.5" fill="#9b5de5" stroke="#1b2a3a" stroke-width="0.8"/>
  <text x="314" y="253" font-size="9" fill="#1b2a3a">UMI (distinct per molecule)</text>

  <text x="355" y="272" text-anchor="middle" font-size="10" fill="#1b2a3a">barcode = which cell,</text>
  <text x="355" y="285" text-anchor="middle" font-size="10" fill="#1b2a3a">UMI = which original molecule</text>

  <!-- arrow 2 to 3 -->
  <line x1="488" y1="140" x2="548" y2="140" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3: pooled tube -->
  <path d="M578,80 L622,80 L622,175 Q622,205 600,205 Q578,205 578,175 Z" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <line x1="578" y1="95" x2="622" y2="95" stroke="#2a6f97" stroke-width="1.5"/>
  <!-- many droplets inside -->
  <circle cx="592" cy="120" r="7" fill="#fff" stroke="#bc4749" stroke-width="1.2"/><circle cx="592" cy="120" r="2.5" fill="#f2994a"/>
  <circle cx="608" cy="128" r="7" fill="#fff" stroke="#bc4749" stroke-width="1.2"/><circle cx="608" cy="128" r="2.5" fill="#2a6f97"/>
  <circle cx="597" cy="145" r="7" fill="#fff" stroke="#bc4749" stroke-width="1.2"/><circle cx="597" cy="145" r="2.5" fill="#6a994e"/>
  <circle cx="612" cy="152" r="7" fill="#fff" stroke="#bc4749" stroke-width="1.2"/><circle cx="612" cy="152" r="2.5" fill="#9b5de5"/>
  <circle cx="600" cy="168" r="7" fill="#fff" stroke="#bc4749" stroke-width="1.2"/><circle cx="600" cy="168" r="2.5" fill="#f2994a"/>
  <text x="600" y="228" text-anchor="middle" font-size="10" fill="#1b2a3a">many droplets</text>

  <text x="600" y="256" text-anchor="middle" font-size="10" fill="#1b2a3a">reverse-transcribe,</text>
  <text x="600" y="269" text-anchor="middle" font-size="10" fill="#1b2a3a">amplify, sequence together</text>

  <!-- arrow 3 to 4 -->
  <line x1="640" y1="140" x2="690" y2="140" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4: count matrix -->
  <!-- genes label (rows) and cells (cols) -->
  <text x="770" y="72" text-anchor="middle" font-size="10" fill="#1b2a3a">cells (barcodes)</text>
  <g font-size="11" fill="#1b2a3a">
    <!-- grid 4 cols x 4 rows -->
    <rect x="712" y="80" width="120" height="120" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="742" y1="80" x2="742" y2="200" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="772" y1="80" x2="772" y2="200" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="802" y1="80" x2="802" y2="200" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="712" y1="110" x2="832" y2="110" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="712" y1="140" x2="832" y2="140" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="712" y1="170" x2="832" y2="170" stroke="#c9d3dd" stroke-width="1"/>
    <!-- integer counts -->
    <text x="727" y="100" text-anchor="middle">3</text><text x="757" y="100" text-anchor="middle">0</text><text x="787" y="100" text-anchor="middle">1</text><text x="817" y="100" text-anchor="middle">5</text>
    <text x="727" y="130" text-anchor="middle">0</text><text x="757" y="130" text-anchor="middle">2</text><text x="787" y="130" text-anchor="middle">0</text><text x="817" y="130" text-anchor="middle">1</text>
    <text x="727" y="160" text-anchor="middle">4</text><text x="757" y="160" text-anchor="middle">1</text><text x="787" y="160" text-anchor="middle">2</text><text x="817" y="160" text-anchor="middle">0</text>
    <text x="727" y="190" text-anchor="middle">0</text><text x="757" y="190" text-anchor="middle">3</text><text x="787" y="190" text-anchor="middle">1</text><text x="817" y="190" text-anchor="middle">2</text>
  </g>
  <text x="702" y="145" text-anchor="middle" font-size="10" fill="#1b2a3a" transform="rotate(-90 702 145)">genes</text>

  <text x="772" y="256" text-anchor="middle" font-size="10" fill="#1b2a3a">sort reads by cell barcode,</text>
  <text x="772" y="269" text-anchor="middle" font-size="10" fill="#1b2a3a">count UMIs → rebuild matrix</text>
</svg>
