<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="axarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title / matrix -->
  <text x="430" y="34" font-size="18" fill="#1b2a3a" font-weight="bold">S = </text>
  <text x="468" y="26" font-size="20" fill="#2a6f97">[</text>
  <text x="482" y="30" font-size="16" fill="#1b2a3a">2&#160;&#160;&#160;0</text>
  <text x="482" y="50" font-size="16" fill="#1b2a3a">0&#160;&#160;0.5</text>
  <text x="540" y="26" font-size="20" fill="#2a6f97">]</text>

  <!-- Plot geometry: origin at (110,340), unit x = 120px, unit y = 90px -->
  <!-- x axis 0..4 => 110..590 ; y axis 0..3 => 340..70 -->

  <!-- grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="230" y1="70" x2="230" y2="340"/>
    <line x1="350" y1="70" x2="350" y2="340"/>
    <line x1="470" y1="70" x2="470" y2="340"/>
    <line x1="590" y1="70" x2="590" y2="340"/>
    <line x1="110" y1="250" x2="590" y2="250"/>
    <line x1="110" y1="160" x2="590" y2="160"/>
    <line x1="110" y1="70"  x2="590" y2="70"/>
  </g>

  <!-- axes -->
  <line x1="110" y1="340" x2="605" y2="340" stroke="#1b2a3a" stroke-width="2" marker-end="url(#axarr)"/>
  <line x1="110" y1="340" x2="110" y2="60"  stroke="#1b2a3a" stroke-width="2" marker-end="url(#axarr)"/>
  <text x="612" y="345" font-size="15" fill="#1b2a3a">x</text>
  <text x="103" y="55"  font-size="15" fill="#1b2a3a">y</text>

  <!-- x ticks -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="110" y="360">0</text>
    <text x="230" y="360">1</text>
    <text x="350" y="360">2</text>
    <text x="470" y="360">3</text>
    <text x="590" y="360">4</text>
  </g>
  <!-- y ticks -->
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="102" y="255">1</text>
    <text x="102" y="165">2</text>
    <text x="102" y="75">3</text>
  </g>

  <!-- dashed mapping arrows: (1,1)->(2,0.5) ; (2,0)->(4,0) ; (0,3)->(0,1.5) -->
  <g stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7" fill="none">
    <line x1="230" y1="250" x2="350" y2="295" marker-end="url(#arrow)"/>
    <line x1="350" y1="340" x2="590" y2="340" marker-end="url(#arrow)"/>
    <line x1="110" y1="70"  x2="110" y2="160" marker-end="url(#arrow)"/>
  </g>

  <!-- original points (black) -->
  <g fill="#1b2a3a">
    <circle cx="230" cy="250" r="6"/>
    <circle cx="350" cy="340" r="6"/>
    <circle cx="110" cy="70"  r="6"/>
  </g>
  <g font-size="12" fill="#1b2a3a">
    <text x="216" y="242" text-anchor="end">(1,1)</text>
    <text x="352" y="330">(2,0)</text>
    <text x="120" y="66">(0,3)</text>
  </g>

  <!-- image points (red) -->
  <g fill="#bc4749">
    <circle cx="350" cy="295" r="6"/>
    <circle cx="590" cy="340" r="6"/>
    <circle cx="110" cy="160" r="6"/>
  </g>
  <g font-size="12" fill="#bc4749">
    <text x="360" y="300">(2,0.5)</text>
    <text x="588" y="330" text-anchor="end">(4,0)</text>
    <text x="120" y="156">(0,1.5)</text>
  </g>

  <!-- action labels -->
  <text x="410" y="378" font-size="14" fill="#bc4749" text-anchor="middle">x doubled &#8594;</text>
  <text x="70"  y="120" font-size="14" fill="#bc4749" text-anchor="middle" transform="rotate(-90 70 120)">y halved &#8595;</text>

  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <rect x="440" y="78" width="150" height="52" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1" rx="4"/>
    <circle cx="456" cy="96" r="6" fill="#1b2a3a"/>
    <text x="470" y="100">black = before</text>
    <circle cx="456" cy="116" r="6" fill="#bc4749"/>
    <text x="470" y="120">red = after</text>
  </g>
</svg>
