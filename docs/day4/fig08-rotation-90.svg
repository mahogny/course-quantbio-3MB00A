<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" width="660" height="390" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="ahArc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- origin at (220,205), scale 100 px / unit -->

  <!-- faint unit circle to emphasise preserved length -->
  <circle cx="220" cy="205" r="100" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- grid lines through origin (axes) -->
  <line x1="90" y1="205" x2="380" y2="205" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="220" y1="330" x2="220" y2="70" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- axis heads -->
  <line x1="360" y1="205" x2="378" y2="205" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="220" y1="90" x2="220" y2="72" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="384" y="210" font-size="15" fill="#1b2a3a">x</text>
  <text x="226" y="80" font-size="15" fill="#1b2a3a">y</text>

  <!-- faint secondary example: e2=(0,1) rotates to (-1,0) -->
  <line x1="220" y1="205" x2="220" y2="105" stroke="#bc4749" stroke-width="1.5" opacity="0.4" marker-end="url(#ahRed)"/>
  <line x1="220" y1="205" x2="120" y2="205" stroke="#bc4749" stroke-width="2" opacity="0.85" marker-end="url(#ahRed)"/>
  <path d="M 200,105 A 128,128 0 0 0 118,183" fill="none" stroke="#bc4749" stroke-width="1.4" opacity="0.55" stroke-dasharray="4 3"/>
  <text x="86" y="228" font-size="13" fill="#bc4749">(-1,0)</text>

  <!-- e1 = (1,0) : solid arrow -->
  <line x1="220" y1="205" x2="320" y2="205" stroke="#1b2a3a" stroke-width="2.6" marker-end="url(#ah)"/>
  <text x="300" y="228" font-size="15" fill="#1b2a3a">e₁=(1,0)</text>

  <!-- image of e1 after R(90): (0,1) : blue arrow up -->
  <line x1="220" y1="205" x2="220" y2="105" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#ahBlue)"/>
  <text x="230" y="118" font-size="15" fill="#2a6f97">R e₁=(0,1)</text>

  <!-- CCW arc from (1,0) sweeping up to (0,1) -->
  <path d="M 300,205 A 80,80 0 0 0 220,125" fill="none" stroke="#6a994e" stroke-width="2" marker-end="url(#ahArc)"/>
  <text x="272" y="150" font-size="15" fill="#6a994e">θ = 90°</text>

  <!-- rigid annotation -->
  <text x="30" y="30" font-size="14.5" fill="#1b2a3a">direction changes, length stays 1 (rigid)</text>

  <!-- rotation matrix caption -->
  <g transform="translate(430,150)">
    <text x="0" y="0" font-size="15" fill="#1b2a3a">R(θ) =</text>
    <text x="60" y="-14" font-size="34" fill="#1b2a3a">[</text>
    <text x="78" y="-6" font-size="15" fill="#1b2a3a">cos θ</text>
    <text x="130" y="-6" font-size="15" fill="#1b2a3a">−sin θ</text>
    <text x="78" y="18" font-size="15" fill="#1b2a3a">sin θ</text>
    <text x="130" y="18" font-size="15" fill="#1b2a3a">cos θ</text>
    <text x="190" y="-14" font-size="34" fill="#1b2a3a">]</text>
    <text x="0" y="50" font-size="13.5" fill="#2a6f97">θ=90°:  cos=0, sin=1</text>
    <text x="60" y="72" font-size="34" fill="#1b2a3a">[</text>
    <text x="80" y="66" font-size="15" fill="#1b2a3a">0</text>
    <text x="112" y="66" font-size="15" fill="#1b2a3a">−1</text>
    <text x="82" y="90" font-size="15" fill="#1b2a3a">1</text>
    <text x="116" y="90" font-size="15" fill="#1b2a3a">0</text>
    <text x="150" y="72" font-size="34" fill="#1b2a3a">]</text>
  </g>
</svg>
