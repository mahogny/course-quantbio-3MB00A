<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===== Row-1 highlight tints (blue) ===== -->
  <!-- matrix row 1 -->
  <rect x="72" y="112" width="118" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <!-- vector (shared, blue outline) -->
  <rect x="256" y="112" width="60" height="86" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>

  <!-- ===== Row-2 highlight tints (red) ===== -->
  <rect x="72" y="158" width="118" height="40" rx="6" fill="#fbecec" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- vector red dashed outline offset slightly -->
  <rect x="251" y="107" width="70" height="96" rx="9" fill="none" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- ===== Matrix A ===== -->
  <!-- brackets -->
  <path d="M66,104 L58,104 L58,206 L66,206" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M196,104 L204,104 L204,206 L196,206" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <!-- entries -->
  <text x="108" y="140" font-size="26" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="160" y="140" font-size="26" fill="#1b2a3a" text-anchor="middle">2</text>
  <text x="108" y="188" font-size="26" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="160" y="188" font-size="26" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="131" y="90" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">A</text>

  <!-- ===== Vector x ===== -->
  <path d="M254,104 L246,104 L246,206 L254,206" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M318,104 L326,104 L326,206 L318,206" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="286" y="140" font-size="26" fill="#1b2a3a" text-anchor="middle">3</text>
  <text x="286" y="188" font-size="26" fill="#1b2a3a" text-anchor="middle">4</text>
  <text x="286" y="90" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">x</text>

  <!-- ===== equals ===== -->
  <text x="360" y="164" font-size="30" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- ===== Result vector ===== -->
  <path d="M414,104 L406,104 L406,206 L414,206" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M470,104 L478,104 L478,206 L470,206" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <!-- top result box -->
  <rect x="412" y="112" width="60" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <!-- bottom result box -->
  <rect x="412" y="158" width="60" height="40" rx="6" fill="#fbecec" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="442" y="140" font-size="26" fill="#2a6f97" text-anchor="middle" font-weight="bold">11</text>
  <text x="442" y="188" font-size="26" fill="#bc4749" text-anchor="middle" font-weight="bold">4</text>
  <text x="442" y="90" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">Ax</text>

  <!-- ===== Curved arrow: row1 · x -> top entry (blue) ===== -->
  <path d="M316,128 C360,96 400,96 440,110" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="378" y="88" font-size="16" fill="#2a6f97" text-anchor="middle" font-weight="bold">1·3 + 2·4 = 11</text>

  <!-- ===== Curved arrow: row2 · x -> bottom entry (red) ===== -->
  <path d="M316,182 C360,220 400,220 440,200" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="378" y="245" font-size="16" fill="#bc4749" text-anchor="middle" font-weight="bold">0·3 + 1·4 = 4</text>

  <!-- ===== labels for rows ===== -->
  <text x="540" y="130" font-size="14" fill="#2a6f97" text-anchor="start">row 1 · x</text>
  <text x="540" y="186" font-size="14" fill="#bc4749" text-anchor="start">row 2 · x</text>
  <line x1="486" y1="126" x2="534" y2="126" stroke="#2a6f97" stroke-width="1.5"/>
  <line x1="486" y1="182" x2="534" y2="182" stroke="#bc4749" stroke-width="1.5"/>

  <!-- ===== caption ===== -->
  <text x="360" y="320" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold">each output entry = one row dotted with x</text>
  <text x="360" y="348" font-size="14" fill="#1b2a3a" text-anchor="middle">walk across a matrix row and down the vector, multiply pairwise, add</text>
</svg>
