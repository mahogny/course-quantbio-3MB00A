<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL: A B ============ -->
  <g transform="translate(0,0)">
    <text x="200" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">A B : rotate first, then scale-x</text>

    <!-- axes: origin at (110,300), unit = 85 px -->
    <g stroke="#c9d3dd" stroke-width="1.5">
      <line x1="110" y1="300" x2="110" y2="105"/>
      <line x1="110" y1="300" x2="330" y2="300"/>
    </g>
    <!-- ticks -->
    <g stroke="#c9d3dd" stroke-width="1.5">
      <line x1="195" y1="296" x2="195" y2="304"/>
      <line x1="280" y1="296" x2="280" y2="304"/>
      <line x1="106" y1="215" x2="114" y2="215"/>
      <line x1="106" y1="130" x2="114" y2="130"/>
    </g>
    <g font-size="12" fill="#6b7785">
      <text x="195" y="318" text-anchor="middle">1</text>
      <text x="280" y="318" text-anchor="middle">2</text>
      <text x="98" y="219" text-anchor="end">1</text>
      <text x="98" y="134" text-anchor="end">2</text>
      <text x="100" y="318" text-anchor="end">0</text>
    </g>
    <text x="336" y="304" font-size="13" fill="#6b7785">x</text>
    <text x="104" y="100" font-size="13" fill="#6b7785">y</text>

    <!-- start v=(1,0) -->
    <line x1="110" y1="300" x2="195" y2="300" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="150" y="290" text-anchor="middle" font-size="13" fill="#1b2a3a">v=(1,0)</text>

    <!-- step 1: rotate (faint) -> (0,1) -->
    <line x1="110" y1="300" x2="110" y2="215" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ahR)" opacity="0.7"/>
    <path d="M 165 300 A 55 55 0 0 0 110 245" fill="none" stroke="#bc4749" stroke-width="1.3" opacity="0.6"/>
    <text x="150" y="255" font-size="12" fill="#bc4749">B: rot 90°</text>

    <!-- step 2: scale-x (no change, x=0) -> (0,1) final bold green -->
    <line x1="110" y1="300" x2="110" y2="215" stroke="#6a994e" stroke-width="4" marker-end="url(#ahF)"/>
    <text x="122" y="200" font-size="14" font-weight="bold" fill="#6a994e">(0,1)</text>
    <text x="150" y="150" font-size="12" fill="#2a6f97">A: scale-x·0 = 0</text>
    <text x="150" y="166" font-size="12" fill="#6b7785">(unchanged)</text>
  </g>

  <!-- ============ RIGHT PANEL: B A ============ -->
  <g transform="translate(430,0)">
    <text x="200" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">B A : scale-x first, then rotate</text>

    <g stroke="#c9d3dd" stroke-width="1.5">
      <line x1="110" y1="300" x2="110" y2="105"/>
      <line x1="110" y1="300" x2="330" y2="300"/>
    </g>
    <g stroke="#c9d3dd" stroke-width="1.5">
      <line x1="195" y1="296" x2="195" y2="304"/>
      <line x1="280" y1="296" x2="280" y2="304"/>
      <line x1="106" y1="215" x2="114" y2="215"/>
      <line x1="106" y1="130" x2="114" y2="130"/>
    </g>
    <g font-size="12" fill="#6b7785">
      <text x="195" y="318" text-anchor="middle">1</text>
      <text x="280" y="318" text-anchor="middle">2</text>
      <text x="98" y="219" text-anchor="end">1</text>
      <text x="98" y="134" text-anchor="end">2</text>
      <text x="100" y="318" text-anchor="end">0</text>
    </g>
    <text x="336" y="304" font-size="13" fill="#6b7785">x</text>
    <text x="104" y="100" font-size="13" fill="#6b7785">y</text>

    <!-- start v=(1,0) -->
    <line x1="110" y1="300" x2="195" y2="300" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="150" y="290" text-anchor="middle" font-size="13" fill="#1b2a3a">v=(1,0)</text>

    <!-- step 1: scale-x2 (faint) -> (2,0) -->
    <line x1="110" y1="300" x2="280" y2="300" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ahB)" opacity="0.7"/>
    <text x="235" y="290" text-anchor="middle" font-size="12" fill="#2a6f97">A: scale-x2 → (2,0)</text>

    <!-- step 2: rotate 90 -> (0,2) final bold green -->
    <line x1="110" y1="300" x2="110" y2="130" stroke="#6a994e" stroke-width="4" marker-end="url(#ahF)"/>
    <path d="M 250 300 A 140 140 0 0 0 110 160" fill="none" stroke="#bc4749" stroke-width="1.3" opacity="0.6"/>
    <text x="200" y="200" font-size="12" fill="#bc4749">B: rot 90°</text>
    <text x="122" y="122" font-size="14" font-weight="bold" fill="#6a994e">(0,2)</text>
  </g>

  <!-- divider -->
  <line x1="430" y1="55" x2="430" y2="340" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- caption -->
  <text x="430" y="378" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">AB ≠ BA — order matters (rightmost applied first)</text>
</svg>
