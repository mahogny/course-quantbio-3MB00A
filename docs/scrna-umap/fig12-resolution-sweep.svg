  <text x="715" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">High resolution · 7 clusters</text>
  <g transform="translate(597,60)" stroke="#ffffff" stroke-width="0.8">
    <!-- A1 split: blue and purple -->
    <circle cx="48" cy="52" r="4.2" fill="#2a6f97"/><circle cx="52" cy="58" r="4.2" fill="#2a6f97"/><circle cx="46" cy="45" r="4.2" fill="#2a6f97"/><circle cx="54" cy="50" r="4.2" fill="#2a6f97"/>
    <circle cx="40" cy="50" r="4.2" fill="#7b5aa6"/><circle cx="44" cy="60" r="4.2" fill="#7b5aa6"/><circle cx="38" cy="58" r="4.2" fill="#7b5aa6"/><circle cx="42" cy="66" r="4.2" fill="#7b5aa6"/>
