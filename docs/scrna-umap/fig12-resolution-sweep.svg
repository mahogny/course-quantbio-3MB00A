  <ellipse cx="690" cy="150" rx="42" ry="30" fill="none" stroke="#d99a2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="762" y="112" text-anchor="middle" font-size="10.5" fill="#d99a2b">noise carved off</text>
  <text x="715" y="264" text-anchor="middle" font-size="12" fill="#1b2a3a">more, smaller clusters;</text>
  <text x="715" y="279" text-anchor="middle" font-size="12" fill="#1b2a3a">eventually splits noise</text>

  <!-- biological annotation -->
  <text x="425" y="316" text-anchor="middle" font-size="13.5" fill="#2a6f97">low = T cells   ·   high = CD4 vs CD8 vs regulatory T cells</text>
  <!-- footer -->
  <text x="425" y="345" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1b2a3a">No true number of clusters — validate with known marker genes, not tidiness.</text>
