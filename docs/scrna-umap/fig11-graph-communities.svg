  <text x="606" y="120" font-size="12" fill="#1b2a3a">Clustering runs on the kNN graph.</text>
  <text x="606" y="138" font-size="12" fill="#1b2a3a">UMAP only <tspan font-style="italic">displays</tspan> the result by</text>
