<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17.6 15.4 969.6 394.6" width="969.6" height="394.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/>
    </marker>
  </defs>

  <!-- ============ BOX 1 : X expression matrix (tall + wide) ============ -->
  <text x="105" y="98" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">X</text>
  <rect x="30" y="115" width="150" height="190" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="55"  y1="115" x2="55"  y2="305"/>
    <line x1="80"  y1="115" x2="80"  y2="305"/>
    <line x1="105" y1="115" x2="105" y2="305"/>
    <line x1="130" y1="115" x2="130" y2="305"/>
    <line x1="155" y1="115" x2="155" y2="305"/>
    <line x1="30"  y1="142" x2="180" y2="142"/>
    <line x1="30"  y1="169" x2="180" y2="169"/>
    <line x1="30"  y1="196" x2="180" y2="196"/>
    <line x1="30"  y1="223" x2="180" y2="223"/>
    <line x1="30"  y1="250" x2="180" y2="250"/>
    <line x1="30"  y1="277" x2="180" y2="277"/>
  </g>
  <path d="M30,107 L30,101 L180,101 L180,107" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="105" y="330" font-size="13.5" fill="#1b2a3a" text-anchor="middle">cells × genes</text>
  <text x="105" y="347" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">(~2000 genes)</text>
  <text x="18" y="210" font-size="12.5" fill="#6a994e" text-anchor="middle" transform="rotate(-90 18 210)">cells</text>

  <!-- ============ PCA arrow ============ -->
  <line x1="181" y1="210" x2="234" y2="210" stroke="#1b2a3a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="206" y="196" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">PCA</text>

  <!-- ============ BOX 2 : Z reduced matrix (same rows, skinny) ============ -->
  <text x="256" y="98" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Z</text>
  <rect x="235" y="115" width="42" height="190" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="256" y1="115" x2="256" y2="305"/>
    <line x1="235" y1="142" x2="277" y2="142"/>
    <line x1="235" y1="169" x2="277" y2="169"/>
    <line x1="235" y1="196" x2="277" y2="196"/>
    <line x1="235" y1="223" x2="277" y2="223"/>
    <line x1="235" y1="250" x2="277" y2="250"/>
    <line x1="235" y1="277" x2="277" y2="277"/>
  </g>
  <path d="M235,107 L235,101 L277,101 L277,107" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="256" y="330" font-size="13.5" fill="#1b2a3a" text-anchor="middle">cells × PCs</text>
  <text x="256" y="347" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">(~30 PCs)</text>

  <!-- ============ kNN arrow ============ -->
  <line x1="278" y1="210" x2="349" y2="210" stroke="#1b2a3a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="311" y="196" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">kNN</text>

  <!-- ============ BOX 3 : G neighbour graph (the shared object) ============ -->
  <text x="410" y="98" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">G</text>
  <rect x="350" y="150" width="120" height="120" rx="6" fill="#f3ecf8" stroke="#7b3fa0" stroke-width="2.5"/>
  <g stroke="#7b3fa0" stroke-width="1.6">
    <line x1="378" y1="178" x2="425" y2="170"/>
    <line x1="425" y1="170" x2="446" y2="205"/>
    <line x1="446" y1="205" x2="410" y2="238"/>
    <line x1="410" y1="238" x2="378" y2="215"/>
    <line x1="378" y1="215" x2="378" y2="178"/>
    <line x1="378" y1="178" x2="410" y2="238"/>
    <line x1="425" y1="170" x2="410" y2="238"/>
    <line x1="378" y1="215" x2="446" y2="205"/>
  </g>
  <g fill="#7b3fa0">
    <circle cx="378" cy="178" r="6"/>
    <circle cx="425" cy="170" r="6"/>
    <circle cx="446" cy="205" r="6"/>
    <circle cx="410" cy="238" r="6"/>
    <circle cx="378" cy="215" r="6"/>
  </g>
  <text x="410" y="292" font-size="13.5" fill="#1b2a3a" text-anchor="middle">neighbour graph</text>

  <!-- ============ SPLIT : two views of the SAME graph ============ -->
  <line x1="472" y1="196" x2="667" y2="120" stroke="#7b3fa0" stroke-width="3" marker-end="url(#arrowA)"/>
  <text x="560" y="140" font-size="16" font-weight="bold" fill="#7b3fa0" text-anchor="middle">UMAP</text>

  <line x1="472" y1="224" x2="667" y2="300" stroke="#7b3fa0" stroke-width="3" marker-end="url(#arrowA)"/>
  <text x="575" y="310" font-size="15" font-weight="bold" fill="#7b3fa0" text-anchor="middle">clustering (Leiden)</text>

  <!-- dashed brace grouping both outgoing arrows -->
  <path d="M498,105 C482,105 484,205 484,205 C484,205 482,320 498,320"
        fill="none" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ============ BOX 4a : 2D UMAP map (scatter with islands) ============ -->
  <rect x="667" y="58" width="258" height="124" rx="4" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="796" y="52" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">2D map (x,y per cell)</text>
  <g fill="#bc4749">
    <circle cx="710" cy="90" r="5"/><circle cx="727" cy="102" r="5"/><circle cx="700" cy="110" r="5"/>
    <circle cx="723" cy="86" r="5"/><circle cx="715" cy="118" r="5"/>
  </g>
  <g fill="#6a994e">
    <circle cx="800" cy="150" r="5"/><circle cx="817" cy="138" r="5"/><circle cx="787" cy="140" r="5"/>
    <circle cx="813" cy="158" r="5"/><circle cx="797" cy="128" r="5"/>
  </g>
  <g fill="#2a6f97">
    <circle cx="875" cy="88" r="5"/><circle cx="893" cy="100" r="5"/><circle cx="863" cy="102" r="5"/>
    <circle cx="888" cy="84" r="5"/><circle cx="880" cy="112" r="5"/>
  </g>

  <!-- ============ BOX 4b : cluster labels ============ -->
  <rect x="667" y="248" width="258" height="110" rx="4" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="796" y="242" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">cluster labels</text>
  <g font-size="15" text-anchor="middle">
    <circle cx="703" cy="288" r="13" fill="#bc4749"/><text x="703" y="293" fill="#ffffff" font-weight="bold">0</text>
    <circle cx="750" cy="288" r="13" fill="#6a994e"/><text x="750" y="293" fill="#ffffff" font-weight="bold">1</text>
    <circle cx="797" cy="288" r="13" fill="#2a6f97"/><text x="797" y="293" fill="#ffffff" font-weight="bold">2</text>
    <text x="850" y="293" fill="#1b2a3a" font-size="18">…</text>
  </g>
  <text x="796" y="338" font-size="12.5" fill="#1b2a3a" text-anchor="middle">one integer label per cell</text>

  <!-- ============ shared-graph annotation ============ -->
  <text x="467" y="390" font-size="14.5" font-weight="bold" fill="#7b3fa0" text-anchor="middle">UMAP and clustering both run on the SAME graph G  →  two views of one neighbourhood structure.</text>
</svg>
