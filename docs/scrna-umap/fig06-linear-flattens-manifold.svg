<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- title strip -->
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">True curved manifold</text>
  <text x="600" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">PCA (PC1 vs PC2)</text>

  <!-- LEFT PANEL: faint 3D axes -->
  <g stroke="#c9d3dd" stroke-width="1.5" fill="none">
    <line x1="70" y1="330" x2="70" y2="120" marker-end="url(#arrow)"/>
    <line x1="70" y1="330" x2="300" y2="330" marker-end="url(#arrow)"/>
    <line x1="70" y1="330" x2="150" y2="250" marker-end="url(#arrow)"/>
  </g>
  <text x="52" y="115" font-size="12" fill="#8a97a5">z</text>
  <text x="305" y="335" font-size="12" fill="#8a97a5">x</text>
  <text x="150" y="243" font-size="12" fill="#8a97a5">y</text>

  <!-- Swiss-roll / S-shaped rolled ribbon: faint full-curve backing, then three colored segments -->
  <path id="curve" d="M120,315 C78,304 66,255 92,225 C118,196 165,197 185,222 C205,250 190,285 158,283 C132,281 122,258 143,246"
        fill="none" stroke="#c9d3dd" stroke-width="30" stroke-linecap="round" opacity="0.35"/>

  <!-- three colored segments arranged along the same spiral, clearly separated -->
  <path d="M120,315 C78,304 66,255 92,225" fill="none" stroke="#2a6f97" stroke-width="24" stroke-linecap="round"/>
  <path d="M92,225 C118,196 165,197 185,222" fill="none" stroke="#e08a2b" stroke-width="24" stroke-linecap="round"/>
  <path d="M185,222 C205,250 190,285 158,283 C132,281 122,258 143,246" fill="none" stroke="#7b52a0" stroke-width="24" stroke-linecap="round"/>

  <!-- band labels on the curve -->
  <text x="108" y="345" font-size="13" fill="#2a6f97" font-weight="bold">teal</text>
  <text x="128" y="180" font-size="13" fill="#e08a2b" font-weight="bold">orange</text>
  <text x="200" y="300" font-size="13" fill="#7b52a0" font-weight="bold">purple</text>

  <text x="60" y="380" font-size="12.5" fill="#1b2a3a">populations sit as bands ALONG the curve —</text>
  <text x="60" y="396" font-size="12.5" fill="#1b2a3a">well separated in the true geometry</text>

  <!-- PROJECTION ARROW (center) -->
  <g>
    <line x1="330" y1="240" x2="560" y2="240" stroke="#bc4749" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="345" y="170" font-size="12.5" fill="#bc4749">straight-line projection: only the 2</text>
    <text x="345" y="187" font-size="12.5" fill="#bc4749">highest-variance directions —</text>
    <text x="345" y="204" font-size="12.5" fill="#bc4749">cannot unroll a curve.</text>
    <text x="360" y="230" font-size="12" fill="#bc4749" font-style="italic">flatten ↓</text>
    <!-- small dashed drop lines showing collapse -->
    <g stroke="#bc4749" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <line x1="360" y1="255" x2="360" y2="290"/>
      <line x1="420" y1="255" x2="420" y2="290"/>
      <line x1="480" y1="255" x2="480" y2="290"/>
      <line x1="540" y1="255" x2="540" y2="290"/>
    </g>
  </g>

  <!-- RIGHT PANEL: flat 2D plane, PC axes -->
  <g stroke="#1b2a3a" stroke-width="1.5" fill="none">
    <line x1="600" y1="360" x2="600" y2="120" marker-end="url(#arrow)"/>
    <line x1="600" y1="360" x2="870" y2="360" marker-end="url(#arrow)"/>
  </g>
  <text x="855" y="380" font-size="12" fill="#1b2a3a">PC1</text>
  <text x="575" y="118" font-size="12" fill="#1b2a3a">PC2</text>

  <!-- flat plane tint -->
  <rect x="600" y="130" width="270" height="230" fill="#eaf1f7" opacity="0.5"/>

  <!-- OVERLAPPING smeared blobs: teal and orange interpenetrate, purple partly overlaps -->
  <ellipse cx="700" cy="255" rx="70" ry="34" fill="#2a6f97" opacity="0.5" transform="rotate(-12 700 255)"/>
  <ellipse cx="745" cy="240" rx="70" ry="34" fill="#e08a2b" opacity="0.5" transform="rotate(-12 745 240)"/>
  <ellipse cx="770" cy="285" rx="55" ry="30" fill="#7b52a0" opacity="0.45" transform="rotate(8 770 285)"/>

  <!-- scattered dots to show smear/intermixing -->
  <g>
    <circle cx="685" cy="250" r="3" fill="#2a6f97"/><circle cx="710" cy="262" r="3" fill="#2a6f97"/>
    <circle cx="730" cy="248" r="3" fill="#2a6f97"/><circle cx="720" cy="240" r="3" fill="#e08a2b"/>
    <circle cx="748" cy="252" r="3" fill="#e08a2b"/><circle cx="765" cy="238" r="3" fill="#e08a2b"/>
    <circle cx="735" cy="270" r="3" fill="#e08a2b"/><circle cx="758" cy="290" r="3" fill="#7b52a0"/>
    <circle cx="780" cy="278" r="3" fill="#7b52a0"/><circle cx="742" cy="285" r="3" fill="#7b52a0"/>
    <circle cx="712" cy="248" r="3" fill="#e08a2b"/><circle cx="755" cy="266" r="3" fill="#2a6f97"/>
  </g>

  <text x="620" y="330" font-size="13" fill="#bc4749" font-weight="bold">distinct types overlap</text>
  <text x="620" y="347" font-size="13" fill="#bc4749" font-weight="bold">after flattening</text>

  <!-- contrast note corner -->
  <g>
    <rect x="600" y="378" width="288" height="34" rx="4" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
    <text x="610" y="393" font-size="11.5" fill="#1b2a3a">top 2 PCs capture variance but not</text>
    <text x="610" y="407" font-size="11.5" fill="#1b2a3a">fine local separation.</text>
  </g>
</svg>
