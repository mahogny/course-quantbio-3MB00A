<svg xmlns="http://www.w3.org/2000/svg" width="524" height="331" viewBox="49 37 524 331" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="95" y1="335" x2="360" y2="335" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="95" y1="335" x2="95" y2="70" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="358" font-size="15" fill="#1b2a3a" text-anchor="middle">PC1</text>
  <text x="72" y="74" font-size="15" fill="#1b2a3a" text-anchor="middle">PC2</text>

  <!-- axis ticks 0..6 -->
  <g font-size="12" fill="#1b2a3a">
    <line x1="95" y1="335" x2="95" y2="340" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="95" y="354" text-anchor="middle">0</text>
    <line x1="305" y1="335" x2="305" y2="340" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="305" y="354" text-anchor="middle">5</text>
    <line x1="90" y1="125" x2="95" y2="125" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="84" y="130" text-anchor="end">5</text>
  </g>

  <!-- faint dashed long line between groups: A(95,335) to D(305,125) -->
  <line x1="118" y1="313" x2="288" y2="142" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="205" font-size="12" fill="#8a97a4" transform="rotate(-39 150 205)">far apart (large Euclidean distance) &#8594; no edge</text>

  <!-- teal group kNN triangle: A(95,335) B(137,335) C(95,293) -->
  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <line x1="95" y1="335" x2="137" y2="335"/>
    <line x1="95" y1="335" x2="95" y2="293"/>
    <line x1="137" y1="335" x2="95" y2="293"/>
  </g>

  <!-- orange group kNN triangle: D(305,125) E(347,125) F(305,83) -->
  <g stroke="#bc4749" stroke-width="2" fill="none">
    <line x1="305" y1="125" x2="347" y2="125"/>
    <line x1="305" y1="125" x2="305" y2="83"/>
    <line x1="347" y1="125" x2="305" y2="83"/>
  </g>

  <!-- teal points -->
  <g>
    <circle cx="95" cy="335" r="7" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <circle cx="137" cy="335" r="7" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <circle cx="95" cy="293" r="7" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="86" y="352" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="end">A</text>
    <text x="149" y="352" font-size="14" font-weight="bold" fill="#2a6f97">B</text>
    <text x="82" y="290" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="end">C</text>
  </g>

  <!-- orange points -->
  <g>
    <circle cx="305" cy="125" r="7" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
    <circle cx="347" cy="125" r="7" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
    <circle cx="305" cy="83" r="7" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
    <text x="296" y="143" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="end">D</text>
    <text x="359" y="130" font-size="14" font-weight="bold" fill="#bc4749">E</text>
    <text x="317" y="80" font-size="14" font-weight="bold" fill="#bc4749">F</text>
  </g>

  <!-- annotation -->
  <g font-size="14" fill="#1b2a3a">
    <text x="415" y="120">Each cell's 2 nearest</text>
    <text x="415" y="140">neighbours are its own</text>
    <text x="415" y="160">group-mates</text>
    <text x="415" y="192" fill="#6a994e" font-weight="bold">&#8594; graph splits into</text>
    <text x="415" y="212" fill="#6a994e" font-weight="bold">&#160;&#160;&#160;2 communities</text>
    <text x="415" y="240">= clustering in miniature</text>
  </g>

  <!-- small legend swatches -->
  <g font-size="13" fill="#1b2a3a">
    <circle cx="421" cy="278" r="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="434" y="283">community 1 (A, B, C)</text>
    <circle cx="421" cy="304" r="6" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
    <text x="434" y="309">community 2 (D, E, F)</text>
  </g>
</svg>
