<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="60" y1="300" x2="618" y2="300" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="300" x2="60" y2="42" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="624" y="304" font-size="15" fill="#1b2a3a">x</text>
  <text x="52" y="38" font-size="15" fill="#1b2a3a" text-anchor="end">y</text>

  <!-- pencil of curves: all pass through the two data points, diverge everywhere else -->
  <g fill="none" stroke="#2a6f97" stroke-width="2" stroke-opacity="0.42">
    <path d="M70 110 Q 135 285 200 210 Q 320 70 440 150 Q 525 250 605 95"/>
    <path d="M70 270 Q 135 100 200 210 Q 320 285 440 150 Q 525 65 605 255"/>
    <path d="M70 70  Q 135 250 200 210 Q 320 120 440 150 Q 525 285 605 72"/>
    <path d="M70 195 Q 135 290 200 210 Q 320 195 440 150 Q 525 105 605 285"/>
    <path d="M70 285 Q 135 60  200 210 Q 320 260 440 150 Q 525 200 605 140"/>
    <path d="M70 90  Q 135 200 200 210 Q 320 80  440 150 Q 525 285 605 195"/>
    <path d="M70 245 Q 135 262 200 210 Q 320 288 440 150 Q 525 65  605 282"/>
  </g>

  <!-- the two data points (constraints) -->
  <circle cx="200" cy="210" r="6.5" fill="#bc4749" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="440" cy="150" r="6.5" fill="#bc4749" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="176" y="224" width="48" height="16" rx="2" fill="#ffffff" opacity="0.85"/>
  <text x="200" y="236" font-size="12.5" fill="#bc4749" text-anchor="middle">point 1</text>
  <rect x="416" y="164" width="48" height="16" rx="2" fill="#ffffff" opacity="0.85"/>
  <text x="440" y="176" font-size="12.5" fill="#bc4749" text-anchor="middle">point 2</text>

  <!-- bundle label -->
  <text x="330" y="30" font-size="15.5" fill="#1b2a3a" text-anchor="middle">infinitely many β fit the data equally (perfectly)</text>
  <line x1="308" y1="46" x2="286" y2="148" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- inset note -->
  <text x="486" y="330" font-size="14" fill="#2a6f97" font-style="italic">rank(X<tspan dy="-5" font-size="10">T</tspan><tspan dy="5"> X) ≤ n &lt; p</tspan></text>

  <!-- caption strip -->
  <rect x="30" y="352" width="580" height="42" rx="6" fill="#eaf1f7"/>
  <text x="72" y="378" font-size="14.5" fill="#1b2a3a">p &gt; n: more unknowns than equations &#8594; X<tspan dy="-5" font-size="10.5">T</tspan><tspan dy="5"> X singular &#8594; no unique solution</tspan></text>
</svg>
