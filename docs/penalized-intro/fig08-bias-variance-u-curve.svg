<svg xmlns="http://www.w3.org/2000/svg" width="688.8" height="411.6" viewBox="6.3 -10.5 688.8 411.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#bc4749"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">The bias–variance tradeoff</text>
  <text x="182" y="42" font-size="13" fill="#1b2a3a">total expected error = bias<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> + variance + irreducible noise</tspan></text>

  <!-- tinted regions (plot area only) -->
  <rect x="90" y="55" width="115" height="265" fill="#bc4749" opacity="0.07"/>
  <rect x="535" y="55" width="115" height="265" fill="#2a6f97" opacity="0.07"/>

  <!-- irreducible noise floor -->
  <line x1="90" y1="300" x2="650" y2="300" stroke="#8a97a6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="294" font-size="12.5" fill="#6a7482">irreducible noise σ<tspan dy="-5" font-size="9.5">2</tspan></text>

  <!-- axes -->
  <line x1="90" y1="320" x2="672" y2="320" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="90" y1="320" x2="90" y2="48" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="34" y="188" font-size="15" fill="#1b2a3a" transform="rotate(-90 34 188)" text-anchor="middle">error</text>

  <!-- bias^2 curve: high left, decreasing -->
  <polyline fill="none" stroke="#bc4749" stroke-width="2.2"
    points="90,115 146,171 202,212 258,241 314,263 370,278 409,287 454,294 482,298 538,304 594,308 650,312"/>
  <text x="160" y="238" font-size="15" font-weight="bold" fill="#bc4749">bias<tspan dy="-6" font-size="11">2</tspan></text>

  <!-- variance curve: low left, increasing -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.2"
    points="90,313 146,311 202,308 258,304 314,300 370,293 409,287 454,279 482,271 538,253 594,229 650,195"/>
  <text x="470" y="250" font-size="15" font-weight="bold" fill="#2a6f97">variance</text>

  <!-- total expected error: U shaped sum -->
  <polyline fill="none" stroke="#1b2a3a" stroke-width="3"
    points="90,88 146,142 202,180 258,206 314,222 370,231 409,234 454,233 482,229 538,217 594,197 650,167"/>
  <text x="205" y="166" font-size="15" font-weight="bold" fill="#1b2a3a">total error</text>

  <!-- sweet spot: minimum of the U -->
  <line x1="409" y1="234" x2="409" y2="320" stroke="#6a994e" stroke-width="1.6" stroke-dasharray="2 4"/>
  <circle cx="409" cy="234" r="6" fill="#6a994e"/>
  <text x="420" y="200" font-size="13" font-weight="bold" fill="#6a994e">sweet spot:</text>
  <text x="420" y="216" font-size="13" fill="#6a994e">lowest total error</text>

  <!-- OLS annotation near right edge -->
  <text x="660" y="90" text-anchor="end" font-size="12.5" font-weight="bold" fill="#bc4749">OLS with many predictors</text>
  <text x="660" y="108" text-anchor="end" font-size="12.5" fill="#bc4749">lives here → lots of</text>
  <text x="660" y="126" text-anchor="end" font-size="12.5" fill="#bc4749">variance to trade away</text>
  <path d="M612,138 C632,150 636,158 632,177" fill="none" stroke="#bc4749" stroke-width="1.6" marker-end="url(#ahr)"/>

  <!-- region labels under axis -->
  <text x="95" y="341" font-size="13" font-weight="bold" fill="#bc4749">underfit — high bias</text>
  <text x="650" y="341" text-anchor="end" font-size="13" font-weight="bold" fill="#2a6f97">overfit — high variance</text>

  <!-- x axis title with direction hints -->
  <text x="97" y="378" font-size="12" fill="#6a7482">rigid / simple</text>
  <text x="381" y="378" text-anchor="middle" font-size="15" fill="#1b2a3a">model complexity / flexibility  →</text>
  <text x="650" y="378" text-anchor="end" font-size="12" fill="#6a7482">flexible / complex</text>
</svg>
