<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.0 34.6 707.2 372.4" font-family="Helvetica, Arial, sans-serif" width="707.2" height="372.4">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="290" x2="482" y2="290" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="290" x2="80" y2="72" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="52" y="150" font-size="14" fill="#1b2a3a" text-anchor="middle" font-style="italic" transform="rotate(-90 52 150)">density f(t) = λ e^(−λt)</text>

  <!-- exponential density curve, smooth and continuous -->
  <path d="M80,90 L95.6,126.3 L111.2,155.9 L126.8,180.2 L142.4,200.1 L158,216.4 L173.6,229.8 L189.2,240.7 L204.8,249.6 L220.4,256.9 L236,262.9 L251.6,267.8 L267.2,271.9 L282.8,275.1 L298.4,277.8 L314,280 L329.6,281.8 L345.2,283.3 L360.8,284.5 L376.4,285.5 L392,286.3 L423.2,287.5 L454.4,288.4 L470,288.7"
        fill="none" stroke="#2a6f97" stroke-width="2.6"/>
  <text x="330" y="205" font-size="12.5" fill="#2a6f97" font-style="italic" text-anchor="middle">smooth, continuous — not bars</text>

  <!-- y-intercept dot: height = lambda -->
  <circle cx="80" cy="90" r="6" fill="#2a6f97"/>
  <line x1="80" y1="90" x2="76" y2="90" stroke="#2a6f97" stroke-width="2"/>
  <text x="96" y="108" font-size="14.5" fill="#1b2a3a">height = λ</text>

  <!-- mean line at t = 1/lambda -->
  <line x1="158" y1="290" x2="158" y2="96" stroke="#1b2a3a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="158" y="88" font-size="14" fill="#1b2a3a" text-anchor="middle">mean E[T] = 1/λ</text>
  <text x="158" y="307" font-size="12.5" fill="#1b2a3a" text-anchor="middle">1/λ</text>
  <text x="82" y="307" font-size="12.5" fill="#1b2a3a" text-anchor="middle">0</text>

  <!-- memoryless: two shaded slices of EQUAL width under the curve -->
  <path d="M103.4,290 L103.4,141.8 L111.2,155.9 L119,168.7 L126.8,180.2 L134.6,190.7 L134.6,290 Z"
        fill="#cfe0ef" stroke="#2a6f97" stroke-width="1.4"/>
  <path d="M267.2,290 L267.2,271.9 L275,273.6 L282.8,275.1 L290.6,276.6 L298.4,277.8 L298.4,290 Z"
        fill="#cfe0ef" stroke="#2a6f97" stroke-width="1.4"/>
  <!-- equal width markers -->
  <path d="M103.4,296 L134.6,296" stroke="#1b2a3a" stroke-width="1.3"/>
  <path d="M267.2,296 L298.4,296" stroke="#1b2a3a" stroke-width="1.3"/>
  <text x="119" y="308" font-size="11.5" fill="#1b2a3a" text-anchor="middle">width s</text>
  <text x="283" y="308" font-size="11.5" fill="#1b2a3a" text-anchor="middle">width s</text>

  <!-- arrow linking the two equal slices -->
  <path d="M125,140 C 175,96 235,100 285,268" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="215" y="64" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">same extra-wait, wherever you start</text>

  <!-- x axis label -->
  <text x="275" y="331" font-size="14" fill="#1b2a3a" text-anchor="middle" font-style="italic">waiting time / distance  t  (≥ 0, continuous)</text>

  <!-- formula corner -->
  <rect x="500" y="74" width="205" height="52" rx="7" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.4"/>
  <text x="602" y="97" font-size="15" fill="#1b2a3a" text-anchor="middle">E[T] = 1/λ</text>
  <text x="602" y="117" font-size="15" fill="#1b2a3a" text-anchor="middle">Var(T) = 1/λ^2</text>

  <!-- memoryless explanation panel -->
  <text x="500" y="160" font-size="14.5" fill="#bc4749" font-weight="bold">Memoryless property</text>
  <text x="500" y="181" font-size="13.5" fill="#1b2a3a">P(wait s more | already waited a)</text>
  <text x="500" y="200" font-size="13.5" fill="#1b2a3a">   = P(wait s more)</text>
  <text x="500" y="223" font-size="13" fill="#1b2a3a" font-style="italic">the same no matter how long</text>
  <text x="500" y="240" font-size="13" fill="#1b2a3a" font-style="italic">you have already waited.</text>

  <!-- biology footnote strip -->
  <rect x="40" y="356" width="640" height="30" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.4"/>
  <text x="360" y="376" font-size="13.5" fill="#1b2a3a" text-anchor="middle">biology: inter-spike intervals · gaps between mutations · DNA dwell times</text>
</svg>
