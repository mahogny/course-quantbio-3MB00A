<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11.0 56.1 656.7 368.5" font-family="Helvetica, Arial, sans-serif" width="656.7" height="368.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shared count axis, 0 to 60 -->
  <line x1="80" y1="340" x2="620" y2="340" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="80"  y1="80" x2="80"  y2="344"/>
    <line x1="260" y1="80" x2="260" y2="344"/>
    <line x1="440" y1="80" x2="440" y2="344"/>
    <line x1="620" y1="80" x2="620" y2="344"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="80"  y="360">0</text>
    <text x="260" y="360">20</text>
    <text x="440" y="360">40</text>
    <text x="620" y="360">60</text>
  </g>
  <text x="350" y="381" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">reads mapped to the gene</text>

  <!-- TOP strip: Group A, tightly clustered -->
  <text x="72" y="105" font-size="16" fill="#2a6f97" font-weight="bold" text-anchor="end">Group A</text>
  <!-- mean marker at ~11 (x=179) -->
  <line x1="179" y1="90" x2="179" y2="132" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="179" y="83" font-size="12" fill="#1b2a3a" text-anchor="middle">mean ≈ 11</text>
  <!-- dots at 12,9,15,11,8 -->
  <g fill="#2a6f97">
    <circle cx="188" cy="104" r="7"/>
    <circle cx="161" cy="118" r="7"/>
    <circle cx="215" cy="111" r="7"/>
    <circle cx="179" cy="98"  r="7"/>
    <circle cx="152" cy="122" r="7"/>
  </g>
  <!-- spread bracket 8 to 15 -->
  <path d="M152,140 L152,146 L215,146 L215,140" fill="none" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="183" y="161" font-size="13" fill="#2a6f97" text-anchor="middle">small spread</text>

  <!-- BOTTOM strip: Group B, spread out -->
  <text x="72" y="250" font-size="16" fill="#bc4749" font-weight="bold" text-anchor="end">Group B</text>
  <!-- mean marker at ~44 (x=476) -->
  <line x1="476" y1="228" x2="476" y2="272" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="476" y="221" font-size="12" fill="#1b2a3a" text-anchor="middle">mean ≈ 44</text>
  <!-- dots at 41,38,52,44,47 -->
  <g fill="#bc4749">
    <circle cx="449" cy="244" r="7"/>
    <circle cx="422" cy="258" r="7"/>
    <circle cx="548" cy="250" r="7"/>
    <circle cx="476" cy="240" r="7"/>
    <circle cx="503" cy="262" r="7"/>
  </g>
  <!-- wider spread bracket 38 to 52 -->
  <path d="M422,280 L422,286 L548,286 L548,280" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="485" y="301" font-size="13" fill="#bc4749" text-anchor="middle">large spread</text>

  <!-- curved annotation arrow from A bracket to B bracket -->
  <path d="M216,144 C330,146 300,255 420,279" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="220" y="242" font-size="13" fill="#1b2a3a" text-anchor="middle">higher mean → wider spread</text>

  <!-- caption -->
  <text x="350" y="403" font-size="13.5" fill="#1b2a3a" text-anchor="middle">For counts, variance grows with the mean (Poisson: Var = mean)</text>
</svg>
