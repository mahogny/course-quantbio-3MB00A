<svg xmlns="http://www.w3.org/2000/svg" width="646.8" height="388.2" viewBox="10.5 18.9 646.8 388.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== top left equation box ===== -->
  <rect x="30" y="38" width="196" height="32" rx="4" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="42" y="59" font-size="15" fill="#1b2a3a">data ~ Distribution(μ, ...)</text>

  <!-- ===== value axis ===== -->
  <line x1="140" y1="290" x2="605" y2="290" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrowd)"/>
  <text x="608" y="294" font-size="13" fill="#8a97a5">value</text>

  <!-- ===== truth line (mu) ===== -->
  <line x1="360" y1="120" x2="360" y2="342" stroke="#1b2a3a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="360" y="112" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">truth (μ)</text>

  <!-- ===== error-model curve: filled tint then stroked outline ===== -->
  <path fill="#eaf1f7" stroke="none"
    d="M160,289.2 200,284.6 240,266.9 260,249.2 280,224.7 300,196.1 320,168.2 340,147.6 360,140 380,147.6 400,168.2 420,196.1 440,224.7 460,249.2 480,266.9 500,278.3 520,284.6 560,289.2 L560,290 L160,290 Z"/>
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.2"
    points="160,289.2 200,284.6 240,266.9 260,249.2 280,224.7 300,196.1 320,168.2 340,147.6 360,140 380,147.6 400,168.2 420,196.1 440,224.7 460,249.2 480,266.9 500,278.3 520,284.6 560,289.2"/>

  <!-- curve name label + leader -->
  <text x="34" y="182" font-size="14" font-weight="bold" fill="#2a6f97">error model / likelihood:</text>
  <text x="34" y="200" font-size="14" fill="#2a6f97">Distribution(parameters)</text>
  <line x1="210" y1="205" x2="278" y2="222" stroke="#2a6f97" stroke-width="1.4"/>

  <!-- ===== observed data: drop-lines + dots ===== -->
  <g stroke="#8a97a5" stroke-width="1.2">
    <line x1="255" y1="268" x2="255" y2="290"/>
    <line x1="295" y1="272" x2="295" y2="290"/>
    <line x1="330" y1="265" x2="330" y2="290"/>
    <line x1="358" y1="270" x2="358" y2="290"/>
    <line x1="388" y1="266" x2="388" y2="290"/>
    <line x1="430" y1="271" x2="430" y2="290"/>
    <line x1="475" y1="267" x2="475" y2="290"/>
  </g>
  <g fill="#bc4749">
    <circle cx="255" cy="268" r="5"/>
    <circle cx="295" cy="272" r="5"/>
    <circle cx="330" cy="265" r="5"/>
    <circle cx="358" cy="270" r="5"/>
    <circle cx="388" cy="266" r="5"/>
    <circle cx="430" cy="271" r="5"/>
    <circle cx="475" cy="267" r="5"/>
  </g>

  <!-- observed data label + leader -->
  <text x="150" y="252" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="end">observed data</text>
  <line x1="156" y1="256" x2="248" y2="268" stroke="#bc4749" stroke-width="1.2"/>

  <!-- ===== likelihood callout: height of curve above one observation ===== -->
  <line x1="388" y1="262" x2="388" y2="160" stroke="#2a6f97" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="388" cy="155" r="4" fill="#2a6f97"/>
  <text x="470" y="66" font-size="14" fill="#2a6f97">how likely is this value</text>
  <text x="470" y="84" font-size="14" fill="#2a6f97">given μ?  <tspan font-weight="bold">= likelihood</tspan></text>
  <path d="M 468 78 C 430 100, 405 130, 392 152" fill="none" stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== noise: two-headed arrow from a representative dot back to mu ===== -->
  <line x1="360" y1="332" x2="475" y2="332" stroke="#1b2a3a" stroke-width="1.8" marker-start="url(#arrowd)" marker-end="url(#arrowd)"/>
  <text x="417" y="352" font-size="14" fill="#1b2a3a" text-anchor="middle">noise = observation − truth</text>

  <!-- ===== bottom caption ===== -->
  <text x="360" y="386" font-size="13" font-style="italic" fill="#1b2a3a" text-anchor="middle">The error model turns a distance from μ (noise) into a probability (likelihood).</text>
</svg>
