<svg xmlns="http://www.w3.org/2000/svg" viewBox="72.6 9.6 614.4 382.8" font-family="Helvetica, Arial, sans-serif" width="614.4" height="382.8">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- inset note: independence of the two knobs -->
  <rect x="95" y="28" width="222" height="32" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="107" y="48" font-size="13" fill="#1b2a3a">μ and σ^2 are separate knobs</text>

  <!-- density formula, top right corner -->
  <text x="404" y="46" font-size="13" fill="#1b2a3a">f(x) = <tspan font-style="italic">1</tspan> / √(2πσ^2) · e^(−(x−μ)^2 / (2σ^2))</text>

  <!-- shaded negative tail: region where x is below 0 -->
  <path d="M110,320 L110,317.8 L125,316.4 L140,314.3 L155,311.2 L170,306.9 L185,300.9 L200,292.9 L200,320 Z"
        fill="#bc4749" fill-opacity="0.35" stroke="none"/>

  <!-- Gaussian bell curve (continuous, symmetric) -->
  <path d="M110,317.8 L125,316.4 L140,314.3 L155,311.2 L170,306.9 L185,300.9 L200,292.9 L215,282.8 L230,270.1 L245,255.1 L260,237.8 L275,218.8 L290,198.7 L305,178.6 L320,159.9 L335,143.5 L350,130.8 L365,122.8 L380,120 L395,122.8 L410,130.8 L425,143.5 L440,159.9 L455,178.6 L470,198.7 L485,218.8 L500,237.8 L515,255.1 L530,270.1 L545,282.8 L560,292.9 L575,300.9 L590,306.9 L605,311.2 L620,314.3 L635,316.4 L650,317.8"
        fill="none" stroke="#2a6f97" stroke-width="2.2"/>

  <!-- x axis -->
  <line x1="90" y1="320" x2="668" y2="320" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- mu: dashed centre line -->
  <line x1="380" y1="120" x2="380" y2="320" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="386" y="114" font-size="15" fill="#1b2a3a">μ (mean)</text>

  <!-- faint verticals marking mu ± sigma down to the spread arrow -->
  <line x1="290" y1="198.7" x2="290" y2="250" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="470" y1="198.7" x2="470" y2="250" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- sigma: horizontal double headed spread arrow, mu-sigma to mu+sigma -->
  <line x1="290" y1="250" x2="470" y2="250" stroke="#1b2a3a" stroke-width="1.8"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="270" font-size="15" fill="#1b2a3a" text-anchor="middle">σ (spread)</text>

  <!-- 0 tick, placed to the LEFT of mu so the negative region sits below zero -->
  <line x1="200" y1="316" x2="200" y2="326" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="200" y="340" font-size="14" fill="#1b2a3a" text-anchor="middle">0</text>

  <!-- warning annotation on the shaded negative tail -->
  <text x="98" y="210" font-size="13" fill="#bc4749">puts probability on NEGATIVE values</text>
  <text x="98" y="228" font-size="13" fill="#bc4749">→ wrong for counts</text>
  <line x1="150" y1="238" x2="176" y2="303" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrowRed)"/>

  <!-- axis label -->
  <text x="380" y="372" font-size="14" fill="#1b2a3a" text-anchor="middle">continuous measurement (e.g. cell diameter, log-intensity)</text>
</svg>
