<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ================= STAGE TITLES ================= -->
  <text x="138" y="20" text-anchor="middle" font-size="15" fill="#6a994e" font-weight="bold">1. rate λ VARIES ~ Gamma</text>
  <text x="430" y="20" text-anchor="middle" font-size="15" fill="#2a6f97" font-weight="bold">2. given each λ, counts ~ Poisson(λ)</text>
  <text x="726" y="20" text-anchor="middle" font-size="15" fill="#bc4749" font-weight="bold">3. mix them → Negative binomial</text>

  <!-- ================= STAGE 1: Gamma density over lambda ================= -->
  <!-- axis baseline y=250, x 25..245, lambda 0..120 (scale 1.833 px/unit) -->
  <path d="M25 250 L43 222 L62 172.5 L80 129 L98 103 L107 95 L117 100 L135 118 L153 145 L172 172.5 L190 194 L208 213 L227 228 L245 239 L245 250 Z"
        fill="#e7f0e1" stroke="#6a994e" stroke-width="2"/>

  <!-- sampled lambda ticks (dashed) that feed the three Poissons -->
  <line x1="80" y1="250" x2="80" y2="129" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="117" y1="250" x2="117" y2="100" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="172" y1="250" x2="172" y2="172.5" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- x-axis for lambda -->
  <line x1="20" y1="250" x2="258" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="264" y="254" font-size="13" fill="#1b2a3a" font-style="italic">λ</text>

  <!-- sampled lambda tick labels -->
  <text x="80" y="265" text-anchor="middle" font-size="12" fill="#6a994e" font-weight="bold">30</text>
  <text x="117" y="265" text-anchor="middle" font-size="12" fill="#6a994e" font-weight="bold">50</text>
  <text x="172" y="265" text-anchor="middle" font-size="12" fill="#6a994e" font-weight="bold">80</text>
  <text x="140" y="285" text-anchor="middle" font-size="13" fill="#1b2a3a">a few sampled rates λ</text>

  <!-- arrow: sample lambda -> Poisson -->
  <line x1="262" y1="150" x2="298" y2="150" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#1b2a3a" font-weight="bold">sample λ</text>

  <!-- ================= STAGE 2: three Poisson pmf sketches ================= -->
  <!-- shared count axis: x = 300 + count*2.18 ; differing centers -->

  <!-- Panel A: Poisson(30), baseline y=105 -->
  <text x="365" y="43" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">Poisson(30)</text>
  <line x1="325" y1="105" x2="410" y2="105" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="330" y="95"  width="7" height="10" fill="#2a6f97"/>
  <rect x="341" y="80"  width="7" height="25" fill="#2a6f97"/>
  <rect x="352" y="61"  width="7" height="44" fill="#2a6f97"/>
  <rect x="362" y="50"  width="7" height="55" fill="#2a6f97"/>
  <rect x="373" y="61"  width="7" height="44" fill="#2a6f97"/>
  <rect x="384" y="80"  width="7" height="25" fill="#2a6f97"/>
  <rect x="395" y="95"  width="7" height="10" fill="#2a6f97"/>

  <!-- Panel B: Poisson(50), baseline y=200 -->
  <text x="409" y="138" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">Poisson(50)</text>
  <line x1="362" y1="200" x2="458" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="367" y="190" width="7" height="10" fill="#2a6f97"/>
  <rect x="380" y="175" width="7" height="25" fill="#2a6f97"/>
  <rect x="393" y="156" width="7" height="44" fill="#2a6f97"/>
  <rect x="406" y="145" width="7" height="55" fill="#2a6f97"/>
  <rect x="419" y="156" width="7" height="44" fill="#2a6f97"/>
  <rect x="432" y="175" width="7" height="25" fill="#2a6f97"/>
  <rect x="445" y="190" width="7" height="10" fill="#2a6f97"/>

  <!-- Panel C: Poisson(80), baseline y=295 -->
  <text x="474" y="233" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">Poisson(80)</text>
  <line x1="416" y1="295" x2="536" y2="295" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="419" y="285" width="7" height="10" fill="#2a6f97"/>
  <rect x="437" y="270" width="7" height="25" fill="#2a6f97"/>
  <rect x="454" y="251" width="7" height="44" fill="#2a6f97"/>
  <rect x="471" y="240" width="7" height="55" fill="#2a6f97"/>
  <rect x="489" y="251" width="7" height="44" fill="#2a6f97"/>
  <rect x="506" y="270" width="7" height="25" fill="#2a6f97"/>
  <rect x="523" y="285" width="7" height="10" fill="#2a6f97"/>

  <!-- arrow: mix them -> NB -->
  <line x1="548" y1="205" x2="586" y2="205" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="567" y="197" text-anchor="middle" font-size="12" fill="#1b2a3a" font-weight="bold">mix them →</text>

  <!-- ================= STAGE 3: Negative binomial (broad) ================= -->
  <!-- count axis: x = 590 + count*2.077 ; baseline y=300 -->

  <!-- NB density: broad, right-skewed, low + wide -->
  <path d="M590 300 L590 294 L611 282 L632 250.5 L652 220.5 L673 192 L694 177 L715 183 L735 199.5 L756 220.5 L777 241.5 L798 259.5 L818 276 L839 288 L860 294 L860 300 Z"
        fill="#f6e4e4" stroke="#bc4749" stroke-width="2"/>

  <!-- dashed reference: a single narrow Poisson at the same mean -->
  <path d="M673 292 L684 255 L694 150 L705 255 L715 292"
        fill="none" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="640" y="150" text-anchor="middle" font-size="11.5" fill="#2a6f97">one Poisson</text>
  <text x="640" y="164" text-anchor="middle" font-size="11.5" fill="#2a6f97">(narrow)</text>

  <!-- NB label -->
  <text x="792" y="192" font-size="14" fill="#bc4749" font-weight="bold">NB(μ, φ)</text>
  <text x="792" y="208" font-size="12" fill="#bc4749">broader</text>

  <!-- NB x-axis -->
  <line x1="588" y1="300" x2="866" y2="300" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="864" y="315" text-anchor="end" font-size="12" fill="#1b2a3a" font-style="italic">count</text>

  <!-- ================= VARIANCE BADGE ================= -->
  <rect x="152" y="325" width="576" height="36" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="228" y="349" text-anchor="start" font-size="17" fill="#1b2a3a" font-weight="bold">Var = μ + φ·μ^2<tspan font-size="14" font-weight="normal" fill="#1b2a3a">   (φ = 0 → Poisson;  larger φ → more spread)</tspan></text>

  <!-- ================= FOOTER TAG ================= -->
  <text x="440" y="385" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold" font-style="italic">the error model of DESeq2 and edgeR</text>
</svg>
