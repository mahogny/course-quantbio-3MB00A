<svg xmlns="http://www.w3.org/2000/svg" width="683.1" height="374.7" viewBox="-3.7 13.7 683.1 374.7" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- title label for the mean line, above the plot -->
  <text x="307" y="44" text-anchor="middle" font-size="15" fill="#bc4749" font-weight="bold">mean = λ = 3</text>

  <!-- y gridlines and ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="268" x2="660" y2="268"/>
    <line x1="90" y1="216" x2="660" y2="216"/>
    <line x1="90" y1="164" x2="660" y2="164"/>
    <line x1="90" y1="112" x2="660" y2="112"/>
    <line x1="90" y1="60"  x2="660" y2="60"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="82" y="324">0.00</text>
    <text x="82" y="272">0.05</text>
    <text x="82" y="220">0.10</text>
    <text x="82" y="168">0.15</text>
    <text x="82" y="116">0.20</text>
    <text x="82" y="64">0.25</text>
  </g>

  <!-- axes -->
  <line x1="90" y1="60" x2="90" y2="320" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="90" y1="320" x2="660" y2="320" stroke="#1b2a3a" stroke-width="2"/>

  <!-- bars -->
  <g>
    <rect x="101" y="268" width="40" height="52"  fill="#bc4749"/>
    <rect x="163" y="165" width="40" height="155" fill="#2a6f97"/>
    <rect x="225" y="87"  width="40" height="233" fill="#2a6f97"/>
    <rect x="287" y="87"  width="40" height="233" fill="#bc4749"/>
    <rect x="349" y="145" width="40" height="175" fill="#2a6f97"/>
    <rect x="411" y="215" width="40" height="105" fill="#2a6f97"/>
    <rect x="473" y="268" width="40" height="52"  fill="#2a6f97"/>
    <rect x="535" y="297" width="40" height="23"  fill="#2a6f97"/>
    <rect x="597" y="312" width="40" height="8"   fill="#2a6f97"/>
  </g>

  <!-- x ticks and integer labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="121" y="340">0</text>
    <text x="183" y="340">1</text>
    <text x="245" y="340">2</text>
    <text x="307" y="340">3</text>
    <text x="369" y="340">4</text>
    <text x="431" y="340">5</text>
    <text x="493" y="340">6</text>
    <text x="555" y="340">7</text>
    <text x="617" y="340">8</text>
  </g>

  <!-- axis titles -->
  <text x="375" y="366" text-anchor="middle" font-size="14" fill="#1b2a3a">k  (number of events)</text>
  <text x="26" y="190" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 26 190)">P(X = k)</text>

  <!-- mean line at k = 3 -->
  <line x1="307" y1="60" x2="307" y2="320" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- hand calc for P(0) -->
  <line x1="140" y1="128" x2="121" y2="264" stroke="#bc4749" stroke-width="1.2"/>
  <text x="150" y="120" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">P(0) = e^(-3) ≈ 0.050</text>

  <!-- hand calc for P(3) -->
  <line x1="400" y1="100" x2="315" y2="88" stroke="#bc4749" stroke-width="1.2"/>
  <text x="470" y="96" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">P(3) = 27·e^(-3)/6 ≈ 0.224</text>

  <!-- right-skew tail annotation -->
  <text x="560" y="236" text-anchor="middle" font-size="13" fill="#1b2a3a">right-skewed, piles up near 0</text>
  <line x1="458" y1="252" x2="655" y2="252" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
