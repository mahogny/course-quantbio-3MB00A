<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- top identity badge -->
  <rect x="230" y="14" width="260" height="40" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="360" y="41" text-anchor="middle" font-size="22" fill="#1b2a3a" font-weight="bold">mean = variance = λ</text>

  <!-- ===================== LEFT PANEL: lambda = 2 ===================== -->
  <!-- panel geometry: baseline y=250, x-axis from 40..340, 21 slots -->
  <text x="190" y="82" text-anchor="middle" font-size="17" fill="#1b2a3a" font-weight="bold">Poisson(λ = 2)</text>

  <!-- y reference dashed line at height scale -->
  <!-- bars: scale 0.30 -> 165px tall (baseline 250 up to 85). height*550 -->
  <!-- k0=0.14 -->
  <rect x="42" y="173" width="11" height="77" fill="#2a6f97"/>
  <!-- k1=0.27 -->
  <rect x="56" y="102" width="11" height="148" fill="#2a6f97"/>
  <!-- k2=0.27 -->
  <rect x="70" y="102" width="11" height="148" fill="#2a6f97"/>
  <!-- k3=0.18 -->
  <rect x="84" y="151" width="11" height="99" fill="#2a6f97"/>
  <!-- k4=0.09 -->
  <rect x="98" y="201" width="11" height="49" fill="#2a6f97"/>
  <!-- k5=0.036 -->
  <rect x="112" y="230" width="11" height="20" fill="#2a6f97"/>
  <!-- k6=0.012 -->
  <rect x="126" y="243" width="11" height="7" fill="#2a6f97"/>
  <!-- k7=0.003 tiny -->
  <rect x="140" y="248" width="11" height="2" fill="#2a6f97"/>

  <!-- mean marker at lambda=2 (between k1 and k2 slot centers -> x ~ 67) -->
  <line x1="75" y1="88" x2="75" y2="254" stroke="#bc4749" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="75" y="82" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">λ=2</text>

  <!-- x-axis -->
  <line x1="38" y1="250" x2="340" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- tick labels every 5 -->
  <text x="47" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">0</text>
  <text x="117" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">5</text>
  <text x="187" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">10</text>
  <text x="257" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">15</text>
  <text x="327" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">20</text>
  <text x="345" y="254" font-size="12" fill="#1b2a3a" font-style="italic">k</text>

  <!-- annotations under left -->
  <rect x="52" y="292" width="24" height="32" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="64" y="313" text-anchor="middle" font-size="14" fill="#2a6f97" font-weight="bold">=</text>
  <text x="84" y="303" font-size="14" fill="#1b2a3a">mean = λ = 2</text>
  <text x="84" y="323" font-size="14" fill="#1b2a3a">variance = λ = 2</text>
  <text x="52" y="343" font-size="13" fill="#6a994e" font-weight="bold">right-skewed, piles near 0</text>

  <!-- ===================== RIGHT PANEL: lambda = 8 ===================== -->
  <text x="530" y="82" text-anchor="middle" font-size="17" fill="#1b2a3a" font-weight="bold">Poisson(λ = 8)</text>

  <!-- baseline y=250, x from 378..680, 21 slots, slot width 14 -->
  <!-- heights: k0..k20 approx, scale 550 -->
  <!-- k0=0.0003 ~0 -->
  <!-- k1=0.003 -->
  <rect x="396" y="248" width="11" height="2" fill="#2a6f97"/>
  <!-- k2=0.011 -->
  <rect x="410" y="244" width="11" height="6" fill="#2a6f97"/>
  <!-- k3=0.029 -->
  <rect x="424" y="234" width="11" height="16" fill="#2a6f97"/>
  <!-- k4=0.057 -->
  <rect x="438" y="219" width="11" height="31" fill="#2a6f97"/>
  <!-- k5=0.092 -->
  <rect x="452" y="199" width="11" height="51" fill="#2a6f97"/>
  <!-- k6=0.122 -->
  <rect x="466" y="183" width="11" height="67" fill="#2a6f97"/>
  <!-- k7=0.140 -->
  <rect x="480" y="173" width="11" height="77" fill="#2a6f97"/>
  <!-- k8=0.140 -->
  <rect x="494" y="173" width="11" height="77" fill="#2a6f97"/>
  <!-- k9=0.124 -->
  <rect x="508" y="182" width="11" height="68" fill="#2a6f97"/>
  <!-- k10=0.099 -->
  <rect x="522" y="196" width="11" height="54" fill="#2a6f97"/>
  <!-- k11=0.072 -->
  <rect x="536" y="210" width="11" height="40" fill="#2a6f97"/>
  <!-- k12=0.048 -->
  <rect x="550" y="224" width="11" height="26" fill="#2a6f97"/>
  <!-- k13=0.030 -->
  <rect x="564" y="234" width="11" height="16" fill="#2a6f97"/>
  <!-- k14=0.017 -->
  <rect x="578" y="241" width="11" height="9" fill="#2a6f97"/>
  <!-- k15=0.009 -->
  <rect x="592" y="245" width="11" height="5" fill="#2a6f97"/>
  <!-- k16=0.005 -->
  <rect x="606" y="247" width="11" height="3" fill="#2a6f97"/>
  <!-- k17=0.002 -->
  <rect x="620" y="249" width="11" height="1" fill="#2a6f97"/>

  <!-- mean marker at lambda=8, slot center x = 378 + 8*14 + 5 = ~495 -->
  <line x1="499" y1="102" x2="499" y2="254" stroke="#bc4749" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="499" y="97" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">λ=8</text>

  <!-- x-axis -->
  <line x1="378" y1="250" x2="680" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="387" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">0</text>
  <text x="457" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">5</text>
  <text x="527" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">10</text>
  <text x="597" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">15</text>
  <text x="667" y="266" text-anchor="middle" font-size="11" fill="#1b2a3a">20</text>
  <text x="685" y="254" font-size="12" fill="#1b2a3a" font-style="italic">k</text>

  <!-- annotations under right -->
  <rect x="392" y="292" width="24" height="32" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="404" y="313" text-anchor="middle" font-size="14" fill="#2a6f97" font-weight="bold">=</text>
  <text x="424" y="303" font-size="14" fill="#1b2a3a">mean = λ = 8</text>
  <text x="424" y="323" font-size="14" fill="#1b2a3a">variance = λ = 8</text>
  <text x="392" y="343" font-size="13" fill="#6a994e" font-weight="bold">roughly symmetric, mode near 7–8</text>

  <!-- summary caption: larger lambda gives a more symmetric distribution -->
  <text x="360" y="372" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">larger λ  →  more symmetric</text>
</svg>
