<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 0 773 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shaded negative tail (x less than 0) under the Gaussian -->
  <polygon points="90,340 90,337 112,333 134,326 156,313 179,292 179,340"
           fill="#bc4749" fill-opacity="0.18" stroke="none"/>

  <!-- faint dashed continuous Gaussian curve, centered near 3 -->
  <path d="M90,337 L112,333 L134,326 L156,313 L179,292 L201,264 L223,227 L245,187
           L267,151 L289,124 L312,115 L334,124 L356,151 L378,187 L400,227 L422,264
           L444,292 L467,313 L489,326 L511,333 L533,337"
        fill="none" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.55"/>

  <!-- discrete probability bars: Poisson(3) shape at integers 0..10 -->
  <g fill="#2a6f97">
    <rect x="166" y="292" width="26" height="48"/>
    <rect x="210" y="197" width="26" height="143"/>
    <rect x="254" y="125" width="26" height="215"/>
    <rect x="299" y="125" width="26" height="215"/>
    <rect x="343" y="179" width="26" height="161"/>
    <rect x="387" y="243" width="26" height="97"/>
    <rect x="431" y="292" width="26" height="48"/>
    <rect x="476" y="319" width="26" height="21"/>
    <rect x="520" y="332" width="26" height="8"/>
    <rect x="564" y="337" width="26" height="3"/>
    <rect x="609" y="339" width="26" height="1"/>
  </g>

  <!-- probability axis -->
  <line x1="90" y1="112" x2="90" y2="340" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="70" y="228" font-size="14" fill="#1b2a3a" transform="rotate(-90 70 228)" text-anchor="middle">probability</text>

  <!-- value axis (extends across 0 into negatives) -->
  <line x1="90" y1="340" x2="730" y2="340" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="735" y="345" font-size="14" fill="#1b2a3a">value</text>

  <!-- zero line and tick labels -->
  <line x1="179" y1="340" x2="179" y2="348" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="267" y1="340" x2="267" y2="346" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="356" y1="340" x2="356" y2="346" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="444" y1="340" x2="444" y2="346" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="533" y1="340" x2="533" y2="346" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="621" y1="340" x2="621" y2="346" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="91" y1="340" x2="91" y2="346" stroke="#bc4749" stroke-width="1"/>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="91" y="362" fill="#bc4749">-2</text>
    <text x="179" y="362">0</text>
    <text x="267" y="362">2</text>
    <text x="356" y="362">4</text>
    <text x="444" y="362">6</text>
    <text x="533" y="362">8</text>
    <text x="621" y="362">10</text>
  </g>

  <!-- Gaussian wrong callout for the negative shaded tail -->
  <line x1="215" y1="372" x2="150" y2="330" stroke="#bc4749" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="96" y="384" font-size="13.5" fill="#bc4749">Gaussian: continuous, allows negatives</text>
  <text x="96" y="400" font-size="13.5" fill="#bc4749">&amp; fractions  →  wrong</text>

  <!-- real-counts label near the bars -->
  <text x="410" y="20" font-size="14" fill="#2a6f97" font-weight="bold" text-anchor="middle">real counts: discrete, non-negative integers</text>

  <!-- callout 1: non-negative integers -->
  <line x1="150" y1="128" x2="175" y2="298" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="96" y="102" font-size="13.5" fill="#1b2a3a">non-negative integers</text>
  <text x="96" y="118" font-size="13.5" fill="#1b2a3a">(no -2, no 3.7)</text>

  <!-- callout 2: piles up near 0 -->
  <line x1="300" y1="72" x2="272" y2="126" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="60" font-size="13.5" fill="#1b2a3a" text-anchor="middle">discrete, piles up near 0</text>

  <!-- callout 3: spread grows with the mean -->
  <line x1="560" y1="210" x2="489" y2="321" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="188" font-size="13.5" fill="#1b2a3a">spread grows</text>
  <text x="560" y="204" font-size="13.5" fill="#1b2a3a">with the mean</text>

  <!-- legend -->
  <g>
    <rect x="574" y="60" width="236" height="56" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="586" y1="80" x2="618" y2="80" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.55"/>
    <text x="626" y="84" font-size="13" fill="#1b2a3a">Gaussian (continuous)</text>
    <rect x="594" y="96" width="16" height="14" fill="#2a6f97"/>
    <text x="626" y="108" font-size="13" fill="#1b2a3a">count distribution (discrete)</text>
  </g>
</svg>
