<svg xmlns="http://www.w3.org/2000/svg" viewBox="39.7 33.7 547.6 376.0" font-family="Helvetica, Arial, sans-serif" width="547.6" height="376.0">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== GRID ===================== -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="192" y1="340" x2="192" y2="60"/>
    <line x1="284" y1="340" x2="284" y2="60"/>
    <line x1="376" y1="340" x2="376" y2="60"/>
    <line x1="468" y1="340" x2="468" y2="60"/>
    <line x1="560" y1="340" x2="560" y2="60"/>
    <line x1="100" y1="284" x2="560" y2="284"/>
    <line x1="100" y1="228" x2="560" y2="228"/>
    <line x1="100" y1="172" x2="560" y2="172"/>
    <line x1="100" y1="116" x2="560" y2="116"/>
    <line x1="100" y1="60"  x2="560" y2="60"/>
  </g>

  <!-- ===================== AXES ===================== -->
  <line x1="100" y1="340" x2="560" y2="340" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="100" y1="340" x2="100" y2="52"  stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- x ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="middle">
    <text x="100" y="356">0</text>
    <text x="192" y="356">500</text>
    <text x="284" y="356">1000</text>
    <text x="376" y="356">1500</text>
    <text x="468" y="356">2000</text>
    <text x="560" y="356">2500</text>
  </g>
  <!-- y ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="end">
    <text x="94" y="344">0</text>
    <text x="94" y="288">500</text>
    <text x="94" y="232">1000</text>
    <text x="94" y="176">1500</text>
    <text x="94" y="120">2000</text>
    <text x="94" y="64">2500</text>
  </g>

  <!-- axis titles -->
  <text x="330" y="374" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">sample mean count  μ</text>
  <text x="66" y="200" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold" transform="rotate(-90 66 200)">sample variance</text>

  <!-- ===================== POISSON IDENTITY LINE (floor) ===================== -->
  <line x1="100" y1="340" x2="560" y2="60" stroke="#6a994e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="418" y="176" font-size="14" fill="#6a994e" font-weight="bold">Poisson: Var = mean</text>
  <text x="418" y="192" font-size="12" fill="#6a994e">(the variance floor)</text>

  <!-- ===================== NEGATIVE-BINOMIAL CURVE  Var = mu + phi mu^2 ===================== -->
  <path d="M100,340 L118.4,327.7 L136.8,313.1 L155.2,296.3 L173.6,277.3 L192,256 L210.4,232.5 L228.8,206.7 L247.2,178.7 L265.6,148.5 L284,116 L302.4,81.3 L311.6,63.1"
        fill="none" stroke="#2a6f97" stroke-width="2.4"/>
  <!-- NB label with leader -->
  <line x1="255" y1="123" x2="265.6" y2="148.5" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="172" y="99"  font-size="14" fill="#2a6f97" font-weight="bold">Negative binomial:</text>
  <text x="172" y="116" font-size="14" fill="#2a6f97">Var = μ + φ·μ<tspan font-size="10" dy="-5">2</tspan></text>

  <!-- ===================== GENES (data points) ===================== -->
  <g fill="#bc4749" stroke="#8f2f31" stroke-width="1">
    <circle cx="111.0" cy="332.2" r="5"/>
    <circle cx="122.0" cy="325.4" r="5"/>
    <circle cx="133.0" cy="317.6" r="5"/>
    <circle cx="151.5" cy="303.0" r="5"/>
    <circle cx="166.2" cy="281.8" r="5"/>
    <circle cx="182.8" cy="272.8" r="5"/>
    <circle cx="201.2" cy="239.2" r="5"/>
    <circle cx="219.6" cy="228.0" r="5"/>
    <circle cx="239.8" cy="183.2" r="5"/>
    <circle cx="256.4" cy="172.0" r="5"/>
    <circle cx="274.8" cy="121.6" r="5"/>
    <circle cx="293.2" cy="110.4" r="5"/>
  </g>

  <!-- ===================== OVERDISPERSION GAP ARROW (at a high-mean gene) ===================== -->
  <line x1="274.8" y1="233.6" x2="274.8" y2="121.6" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="274.8" y1="121.6" x2="274.8" y2="233.6" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="300" y="168" font-size="13" fill="#1b2a3a" font-weight="bold">overdispersion</text>
  <text x="300" y="184" font-size="13" fill="#1b2a3a">= excess variance</text>

  <!-- ===================== LEGEND: point = gene ===================== -->
  <circle cx="357" cy="228" r="5" fill="#bc4749" stroke="#8f2f31" stroke-width="1"/>
  <text x="368" y="232" font-size="12" fill="#1b2a3a">each point = one gene (μ, Var)</text>

  <!-- ===================== CALLOUT ===================== -->
  <rect x="350" y="244" width="208" height="84" rx="8" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <text x="360" y="266" font-size="13" fill="#1b2a3a">Poisson is the <tspan fill="#bc4749" font-weight="bold">FLOOR</tspan> of</text>
  <text x="360" y="284" font-size="13" fill="#1b2a3a">variability; biological</text>
  <text x="360" y="302" font-size="13" fill="#1b2a3a">replicates sit <tspan font-weight="bold">above</tspan> it.</text>
  <text x="360" y="320" font-size="12" fill="#6a994e" font-style="italic">variance grows faster than μ</text>

  <!-- ===================== SIDE NOTE ===================== -->
  <text x="330" y="392" text-anchor="middle" font-size="12" fill="#1b2a3a" font-style="italic">technical replicates ≈ on the line  ·  biological replicates &gt; line</text>
</svg>
