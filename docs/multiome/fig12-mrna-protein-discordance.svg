<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 16 640 415" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="100" y1="340" x2="100" y2="32"  stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="100" y1="340" x2="430" y2="340" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">mRNA level</text>
  <text x="60" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a" transform="rotate(-90 60 190)">protein level</text>
  <text x="112" y="354" font-size="11" fill="#1b2a3a">low</text>
  <text x="398" y="354" font-size="11" fill="#1b2a3a">high</text>
  <text x="106" y="48"  font-size="11" fill="#1b2a3a">high</text>

  <!-- y = x reference line (equal levels) -->
  <line x1="100" y1="340" x2="400" y2="40" stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.8"/>
  <text x="352" y="52" font-size="13" font-style="italic" fill="#1b2a3a" transform="rotate(-45 352 52)">y = x</text>

  <!-- concordant cloud : neutral points, only MODEST correlation -->
  <g fill="#7c8896">
    <circle cx="135" cy="305" r="4.5"/>
    <circle cx="158" cy="318" r="4.5"/>
    <circle cx="172" cy="288" r="4.5"/>
    <circle cx="150" cy="272" r="4.5"/>
    <circle cx="188" cy="300" r="4.5"/>
    <circle cx="205" cy="266" r="4.5"/>
    <circle cx="192" cy="248" r="4.5"/>
    <circle cx="218" cy="292" r="4.5"/>
    <circle cx="232" cy="244" r="4.5"/>
    <circle cx="212" cy="228" r="4.5"/>
    <circle cx="248" cy="256" r="4.5"/>
    <circle cx="262" cy="218" r="4.5"/>
    <circle cx="252" cy="236" r="4.5"/>
    <circle cx="278" cy="204" r="4.5"/>
    <circle cx="292" cy="226" r="4.5"/>
    <circle cx="282" cy="188" r="4.5"/>
    <circle cx="306" cy="200" r="4.5"/>
    <circle cx="322" cy="176" r="4.5"/>
    <circle cx="300" cy="214" r="4.5"/>
    <circle cx="336" cy="158" r="4.5"/>
    <circle cx="352" cy="188" r="4.5"/>
    <circle cx="326" cy="150" r="4.5"/>
    <circle cx="362" cy="138" r="4.5"/>
    <circle cx="190" cy="222" r="4.5"/>
    <circle cx="272" cy="258" r="4.5"/>
  </g>

  <!-- discordant cluster 1 : upper left, high protein / low mRNA (blue) -->
  <ellipse cx="158" cy="118" rx="46" ry="40" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#2a6f97">
    <circle cx="138" cy="112" r="4.5"/>
    <circle cx="158" cy="98"  r="4.5"/>
    <circle cx="164" cy="128" r="4.5"/>
    <circle cx="142" cy="140" r="4.5"/>
    <circle cx="178" cy="116" r="4.5"/>
    <circle cx="152" cy="106" r="4.5"/>
    <circle cx="170" cy="98"  r="4.5"/>
  </g>

  <!-- discordant cluster 2 : lower right, high mRNA / low protein (red) -->
  <ellipse cx="366" cy="308" rx="44" ry="34" fill="#fbecec" stroke="#bc4749" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#bc4749">
    <circle cx="344" cy="312" r="4.5"/>
    <circle cx="362" cy="298" r="4.5"/>
    <circle cx="380" cy="320" r="4.5"/>
    <circle cx="352" cy="326" r="4.5"/>
    <circle cx="384" cy="302" r="4.5"/>
    <circle cx="368" cy="312" r="4.5"/>
  </g>

  <!-- leader : upper left discordant (blue), top block -->
  <line x1="204" y1="118" x2="452" y2="104" stroke="#2a6f97" stroke-width="1.4"/>
  <g>
    <text x="458" y="94"  font-size="14" font-weight="bold" fill="#2a6f97">Protein present, low mRNA</text>
    <text x="458" y="111" font-size="12.5" fill="#1b2a3a">→ stable / long-lived protein,</text>
    <text x="458" y="127" font-size="12.5" fill="#1b2a3a">or transcript already decayed</text>
  </g>

  <!-- leader : concordant (gray), middle block -->
  <line x1="330" y1="168" x2="452" y2="190" stroke="#7c8896" stroke-width="1.4"/>
  <g>
    <text x="458" y="182" font-size="14" font-weight="bold" fill="#7c8896">Concordant</text>
    <text x="458" y="199" font-size="12.5" fill="#1b2a3a">CD3 mRNA &amp; CD3 protein agree</text>
    <text x="458" y="215" font-size="12" font-style="italic" fill="#7c8896">loose cloud near y = x (modest r)</text>
  </g>

  <!-- leader : lower right discordant -->
  <line x1="410" y1="308" x2="452" y2="290" stroke="#bc4749" stroke-width="1.4"/>
  <g>
    <text x="458" y="286" font-size="14" font-weight="bold" fill="#bc4749">High mRNA, no protein</text>
    <text x="458" y="303" font-size="12.5" fill="#1b2a3a">→ translational repression</text>
    <text x="458" y="319" font-size="12.5" fill="#1b2a3a">or rapid protein turnover</text>
  </g>

  <!-- caption -->
  <text x="352" y="397" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1b2a3a">mRNA and protein correlate only modestly; discordance is a FINDING,<tspan x="352" dy="17">visible only because modalities are matched and jointly modelled</tspan></text>
</svg>
