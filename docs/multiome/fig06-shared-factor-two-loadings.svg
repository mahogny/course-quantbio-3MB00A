<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 28 890 378" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shared factor scores Z : one block feeding both -->
  <g>
    <rect x="40" y="120" width="46" height="160" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <line x1="63" y1="120" x2="63" y2="280" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="86" y2="160" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="40" y1="200" x2="86" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="40" y1="240" x2="86" y2="240" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="63" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Z</text>
    <text x="63" y="304" text-anchor="middle" font-size="13" fill="#1b2a3a">factor scores</text>
    <text x="63" y="322" text-anchor="middle" font-size="12" fill="#2a6f97">one set of coordinates</text>
    <text x="63" y="338" text-anchor="middle" font-size="12" fill="#2a6f97">per sample</text>
    <text x="63" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2a3a">(same for ALL modalities)</text>
  </g>

  <!-- Z feeds the shared factor node -->
  <line x1="86" y1="200" x2="308" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- central shared factor node -->
  <g>
    <circle cx="370" cy="200" r="62" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2.5"/>
    <text x="370" y="188" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Factor k</text>
    <text x="370" y="208" text-anchor="middle" font-size="11.5" fill="#1b2a3a">a piece of biology</text>
    <text x="370" y="224" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2a6f97">"T-cell programme"</text>
  </g>

  <!-- fan-out: two arrows to two modality loading vectors -->
  <line x1="428" y1="168" x2="648" y2="89"  stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="428" y1="232" x2="716" y2="309" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RNA loadings : tall thin vector, one weight per gene (~20000) -->
  <g>
    <rect x="648" y="40" width="30" height="230" rx="3" fill="#ffffff" stroke="#2a6f97" stroke-width="2"/>
    <line x1="648" y1="66"  x2="678" y2="66"  stroke="#c9d3dd" stroke-width="1"/>
    <rect x="648" y="66"  width="30" height="18" fill="#bc4749"/>
    <rect x="648" y="84"  width="30" height="18" fill="#bc4749"/>
    <line x1="648" y1="102" x2="678" y2="102" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="648" y1="128" x2="678" y2="128" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="648" y1="154" x2="678" y2="154" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="648" y1="180" x2="678" y2="180" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="648" y1="206" x2="678" y2="206" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="648" y1="232" x2="678" y2="232" stroke="#c9d3dd" stroke-width="1"/>
    <text x="695" y="60" font-size="17" font-weight="bold" fill="#1b2a3a">W</text>
    <text x="711" y="65" font-size="11" fill="#1b2a3a">RNA</text>
    <text x="695" y="82" font-size="12" font-weight="bold" fill="#bc4749">CD3 genes</text>
    <text x="695" y="150" font-size="12" fill="#2a6f97">one weight</text>
    <text x="695" y="166" font-size="12" fill="#2a6f97">per gene</text>
    <text x="695" y="182" font-size="12" font-weight="bold" fill="#1b2a3a">(~20000)</text>
  </g>

  <!-- protein loadings : short thin vector, one weight per protein (~100) -->
  <g>
    <rect x="716" y="286" width="30" height="86" rx="3" fill="#ffffff" stroke="#6a994e" stroke-width="2"/>
    <line x1="716" y1="312" x2="746" y2="312" stroke="#c9d3dd" stroke-width="1"/>
    <rect x="716" y="312" width="30" height="18" fill="#bc4749"/>
    <line x1="716" y1="330" x2="746" y2="330" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="716" y1="350" x2="746" y2="350" stroke="#c9d3dd" stroke-width="1"/>
    <text x="756" y="304" font-size="17" font-weight="bold" fill="#1b2a3a">W</text>
    <text x="772" y="309" font-size="11" fill="#1b2a3a">prot</text>
    <text x="756" y="326" font-size="12" font-weight="bold" fill="#bc4749">CD3 protein</text>
    <text x="756" y="350" font-size="12" fill="#6a994e">one weight per</text>
    <text x="756" y="366" font-size="12" fill="#6a994e">protein <tspan font-weight="bold" fill="#1b2a3a">(~100)</tspan></text>
  </g>

  <!-- correspondence hint between the two highlighted CD3 blocks -->
  <path d="M678,88 C686,150 686,300 716,321" fill="none" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/>

  <!-- caption -->
  <text x="430" y="392" text-anchor="middle" font-size="16" font-style="italic" fill="#1b2a3a">one factor = the same biology written in two languages at once</text>
</svg>
