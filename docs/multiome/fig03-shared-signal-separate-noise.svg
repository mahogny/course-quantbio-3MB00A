<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 0 703 381" width="703" height="381" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- TOP: latent true cell state -->
  <text x="400" y="20" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">true cell state  (latent, unobserved)</text>
  <circle cx="400" cy="52" r="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="400" y="57" font-size="20" fill="#1b2a3a" text-anchor="middle">θ</text>

  <!-- fan arrows: one signal seen through two noisy views -->
  <line x1="378" y1="70" x2="165" y2="98" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="422" y1="70" x2="605" y2="98" stroke="#6a994e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="73" font-size="11.5" fill="#2a6f97" transform="rotate(-7 252 73)">+ noise</text>
  <text x="520" y="73" font-size="11.5" fill="#6a994e" transform="rotate(7 520 73)">+ noise</text>

  <!-- LEFT VIEW: RNA, deep but sparse -->
  <text x="150" y="112" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="middle">RNA: deep, sparse &amp; noisy</text>
  <!-- panel frame -->
  <rect x="98" y="120" width="104" height="130" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
  <!-- filled (measured) cells scattered among dropouts -->
  <g fill="#2a6f97">
    <rect x="98"  y="120" width="13" height="13"/>
    <rect x="124" y="120" width="13" height="13"/>
    <rect x="163" y="120" width="13" height="13"/>
    <rect x="111" y="133" width="13" height="13"/>
    <rect x="189" y="133" width="13" height="13"/>
    <rect x="137" y="146" width="13" height="13"/>
    <rect x="176" y="146" width="13" height="13"/>
    <rect x="98"  y="159" width="13" height="13"/>
    <rect x="150" y="159" width="13" height="13"/>
    <rect x="189" y="159" width="13" height="13"/>
    <rect x="124" y="172" width="13" height="13"/>
    <rect x="163" y="172" width="13" height="13"/>
    <rect x="111" y="185" width="13" height="13"/>
    <rect x="176" y="185" width="13" height="13"/>
    <rect x="98"  y="185" width="13" height="13"/>
    <rect x="137" y="198" width="13" height="13"/>
    <rect x="189" y="198" width="13" height="13"/>
    <rect x="150" y="211" width="13" height="13"/>
    <rect x="98"  y="211" width="13" height="13"/>
    <rect x="124" y="224" width="13" height="13"/>
    <rect x="163" y="224" width="13" height="13"/>
    <rect x="176" y="224" width="13" height="13"/>
    <rect x="111" y="237" width="13" height="13"/>
    <rect x="137" y="237" width="13" height="13"/>
    <rect x="189" y="237" width="13" height="13"/>
  </g>
  <!-- grid lines over the panel (empty cells = dropouts) -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="111" y1="120" x2="111" y2="250"/>
    <line x1="124" y1="120" x2="124" y2="250"/>
    <line x1="137" y1="120" x2="137" y2="250"/>
    <line x1="150" y1="120" x2="150" y2="250"/>
    <line x1="163" y1="120" x2="163" y2="250"/>
    <line x1="176" y1="120" x2="176" y2="250"/>
    <line x1="189" y1="120" x2="189" y2="250"/>
    <line x1="98" y1="133" x2="202" y2="133"/>
    <line x1="98" y1="146" x2="202" y2="146"/>
    <line x1="98" y1="159" x2="202" y2="159"/>
    <line x1="98" y1="172" x2="202" y2="172"/>
    <line x1="98" y1="185" x2="202" y2="185"/>
    <line x1="98" y1="198" x2="202" y2="198"/>
    <line x1="98" y1="211" x2="202" y2="211"/>
    <line x1="98" y1="224" x2="202" y2="224"/>
    <line x1="98" y1="237" x2="202" y2="237"/>
  </g>
  <text x="150" y="266" font-size="11.5" fill="#1b2a3a" text-anchor="middle">many genes · many zeros</text>

  <!-- RIGHT VIEW: protein, shallow but clean -->
  <text x="617" y="112" font-size="14" font-weight="bold" fill="#6a994e" text-anchor="middle">Protein: shallow, cleaner</text>
  <rect x="590" y="130" width="54" height="90" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.8"/>
  <g stroke="#eaf1f7" stroke-width="1.2">
    <line x1="608" y1="130" x2="608" y2="220"/>
    <line x1="626" y1="130" x2="626" y2="220"/>
    <line x1="590" y1="148" x2="644" y2="148"/>
    <line x1="590" y1="166" x2="644" y2="166"/>
    <line x1="590" y1="184" x2="644" y2="184"/>
    <line x1="590" y1="202" x2="644" y2="202"/>
  </g>
  <text x="617" y="236" font-size="11.5" fill="#1b2a3a" text-anchor="middle">few proteins · all filled</text>

  <!-- LEGEND -->
  <g font-size="11.5" fill="#1b2a3a">
    <rect x="20" y="30" width="13" height="13" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
    <text x="40" y="41">filled = measured</text>
    <rect x="20" y="50" width="13" height="13" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/>
    <text x="40" y="61">empty = dropout</text>
  </g>

  <!-- MERGE into combine box -->
  <rect x="345" y="248" width="120" height="34" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="405" y="270" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">combine</text>
  <line x1="202" y1="245" x2="343" y2="262" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="215" x2="467" y2="262" stroke="#6a994e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- combine to outcomes -->
  <line x1="405" y1="282" x2="405" y2="304" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OUTCOME 1: denoising / corroboration -->
  <g>
    <path d="M40,320 l7,8 l14,-16" fill="none" stroke="#6a994e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="326" font-size="14" font-weight="bold" fill="#1b2a3a">Denoising / corroboration</text>
    <text x="72" y="342" font-size="12.5" fill="#1b2a3a">a signal seen in BOTH views is trustworthy</text>
  </g>

  <!-- OUTCOME 2: complementarity -->
  <g>
    <text x="425" y="326" font-size="14" font-weight="bold" fill="#bc4749">Complementarity</text>
    <text x="425" y="342" font-size="12.5" fill="#1b2a3a">protein resolves what RNA cannot, and vice versa</text>
  </g>

  <!-- takeaway caption -->
  <text x="410" y="368" font-size="13" font-style="italic" fill="#2a6f97" text-anchor="middle">independent noise averages down  ·  shared structure reinforces</text>
</svg>
