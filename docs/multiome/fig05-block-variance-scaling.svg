<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10.6 -6.1 879.2 412.1" width="879.2" height="412.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="leader" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- shared y axis label -->
  <text x="24" y="200" transform="rotate(-90 24 200)" text-anchor="middle" font-size="13" fill="#1b2a3a">total variance (contribution to joint PCA)</text>

  <!-- ===================== LEFT PANEL: BEFORE ===================== -->
  <text x="205" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Before (naive concatenation)</text>

  <!-- faint grid + axes -->
  <line x1="60" y1="60" x2="60" y2="320" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="60" y1="80"  x2="320" y2="80"  stroke="#c9d3dd" stroke-width="1"/>
  <line x1="60" y1="140" x2="320" y2="140" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="60" y1="200" x2="320" y2="200" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="60" y1="260" x2="320" y2="260" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="60" y1="320" x2="320" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- RNA bar: towering -->
  <rect x="95" y="70" width="55" height="250" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="122" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">RNA</text>

  <!-- RNA annotation -->
  <text x="168" y="118" font-size="11.5" fill="#1b2a3a">~20,000 features</text>
  <text x="168" y="135" font-size="11.5" fill="#1b2a3a">integer counts 0–thousands</text>
  <text x="168" y="152" font-size="11.5" font-weight="bold" fill="#2a6f97">→ huge variance</text>

  <!-- Protein bar: tiny sliver -->
  <rect x="235" y="311" width="55" height="9" fill="#e8f0e2" stroke="#6a994e" stroke-width="2"/>
  <text x="262" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a994e">protein</text>

  <!-- Protein annotation with leader -->
  <text x="188" y="232" font-size="11.5" fill="#1b2a3a">~100 features</text>
  <text x="188" y="249" font-size="11.5" fill="#1b2a3a">normalized intensities</text>
  <text x="188" y="266" font-size="11.5" font-weight="bold" fill="#6a994e">→ small variance</text>
  <path d="M255,272 L262,308" stroke="#6a994e" stroke-width="1.3" fill="none" marker-end="url(#leader)"/>

  <!-- red caption -->
  <text x="205" y="378" text-anchor="middle" font-size="13" font-style="italic" fill="#bc4749">RNA dominates; the protein panel becomes invisible</text>

  <!-- ===================== TRANSITION ARROW ===================== -->
  <text x="422" y="176" text-anchor="middle" font-size="11.5" fill="#1b2a3a">scale each block</text>
  <text x="422" y="191" text-anchor="middle" font-size="11.5" fill="#1b2a3a">(e.g. divide by Frobenius norm)</text>
  <line x1="345" y1="205" x2="498" y2="205" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== RIGHT PANEL: AFTER ===================== -->
  <text x="670" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">After per-modality normalization + block-scaling</text>

  <!-- axis + grid -->
  <line x1="540" y1="60" x2="540" y2="320" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="540" y1="200" x2="800" y2="200" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="540" y1="260" x2="800" y2="260" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="540" y1="320" x2="800" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- equal-height bars -->
  <rect x="590" y="170" width="55" height="150" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="617" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">RNA</text>

  <rect x="700" y="170" width="55" height="150" fill="#e8f0e2" stroke="#6a994e" stroke-width="2"/>
  <text x="727" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a994e">protein</text>

  <!-- equal-height guide -->
  <line x1="590" y1="170" x2="755" y2="170" stroke="#1b2a3a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- green caption -->
  <text x="670" y="378" text-anchor="middle" font-size="13" font-style="italic" fill="#6a994e">each modality contributes comparably</text>
</svg>
