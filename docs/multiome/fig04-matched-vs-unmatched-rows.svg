<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: matched -->
  <g>
    <rect x="14" y="14" width="418" height="382" rx="8" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="34" y="42" font-size="17" font-weight="bold" fill="#6a994e">Matched (today's methods work)</text>

    <!-- green check badge -->
    <circle cx="400" cy="34" r="15" fill="#6a994e"/>
    <path d="M392,34 L398,40 L410,27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Matrix A: genes (3 cols) -->
    <text x="90" y="76" font-size="13" fill="#2a6f97" text-anchor="middle">genes (3)</text>
    <g stroke="#2a6f97" stroke-width="1.5">
      <rect x="55" y="86" width="72" height="150" fill="#eaf1f7"/>
    </g>
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="79" y1="86" x2="79" y2="236"/>
      <line x1="103" y1="86" x2="103" y2="236"/>
      <line x1="55" y1="116" x2="127" y2="116"/>
      <line x1="55" y1="146" x2="127" y2="146"/>
      <line x1="55" y1="176" x2="127" y2="176"/>
      <line x1="55" y1="206" x2="127" y2="206"/>
    </g>

    <!-- Matrix B: proteins (5 cols) -->
    <text x="335" y="76" font-size="13" fill="#2a6f97" text-anchor="middle">proteins (5)</text>
    <g stroke="#2a6f97" stroke-width="1.5">
      <rect x="290" y="86" width="90" height="150" fill="#eaf1f7"/>
    </g>
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="308" y1="86" x2="308" y2="236"/>
      <line x1="326" y1="86" x2="326" y2="236"/>
      <line x1="344" y1="86" x2="344" y2="236"/>
      <line x1="362" y1="86" x2="362" y2="236"/>
      <line x1="290" y1="116" x2="380" y2="116"/>
      <line x1="290" y1="146" x2="380" y2="146"/>
      <line x1="290" y1="176" x2="380" y2="176"/>
      <line x1="290" y1="206" x2="380" y2="206"/>
    </g>

    <!-- row labels + aligned connectors row i to row i -->
    <g stroke="#6a994e" stroke-width="2.5">
      <line x1="127" y1="101" x2="290" y2="101"/>
      <line x1="127" y1="131" x2="290" y2="131"/>
      <line x1="127" y1="161" x2="290" y2="161"/>
      <line x1="127" y1="191" x2="290" y2="191"/>
      <line x1="127" y1="221" x2="290" y2="221"/>
    </g>
    <g font-size="11" fill="#6a994e" text-anchor="middle">
      <text x="208" y="97">1 = 1</text>
      <text x="208" y="127">2 = 2</text>
      <text x="208" y="157">3 = 3</text>
      <text x="208" y="187">4 = 4</text>
      <text x="208" y="217">5 = 5</text>
    </g>
    <g font-size="11" fill="#1b2a3a" text-anchor="end">
      <text x="50" y="105">i=1</text>
      <text x="50" y="165">i=3</text>
      <text x="50" y="225">i=5</text>
    </g>

    <text x="223" y="272" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">row i = same physical cell / biopsy / patient</text>
    <text x="223" y="310" font-size="12" fill="#1b2a3a" text-anchor="middle">same rows, DIFFERENT columns</text>
    <text x="223" y="328" font-size="12" fill="#1b2a3a" text-anchor="middle">(genes vs proteins), different column counts</text>
    <text x="223" y="372" font-size="12.5" fill="#6a994e" text-anchor="middle" font-weight="bold">rows align &#8594; concatenate / integrate directly</text>
  </g>

  <!-- RIGHT PANEL: unmatched -->
  <g>
    <rect x="448" y="14" width="418" height="382" rx="8" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="468" y="42" font-size="17" font-weight="bold" fill="#bc4749">Unmatched (different problem)</text>

    <!-- red cross badge -->
    <circle cx="834" cy="34" r="15" fill="#bc4749"/>
    <path d="M827,27 L841,41 M841,27 L827,41" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Matrix A: assay 1 cells -->
    <text x="524" y="76" font-size="13" fill="#bc4749" text-anchor="middle">assay 1 cells</text>
    <g stroke="#bc4749" stroke-width="1.5">
      <rect x="489" y="86" width="72" height="150" fill="#eaf1f7"/>
    </g>
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="513" y1="86" x2="513" y2="236"/>
      <line x1="537" y1="86" x2="537" y2="236"/>
      <line x1="489" y1="116" x2="561" y2="116"/>
      <line x1="489" y1="146" x2="561" y2="146"/>
      <line x1="489" y1="176" x2="561" y2="176"/>
      <line x1="489" y1="206" x2="561" y2="206"/>
    </g>
    <!-- cell icons (dots) for assay 1: shapes A -->
    <g fill="#2a6f97">
      <circle cx="474" cy="101" r="5"/>
      <circle cx="474" cy="131" r="5"/>
      <circle cx="474" cy="161" r="5"/>
      <circle cx="474" cy="191" r="5"/>
      <circle cx="474" cy="221" r="5"/>
    </g>

    <!-- Matrix B: assay 2 cells (different rows) -->
    <text x="769" y="76" font-size="13" fill="#bc4749" text-anchor="middle">assay 2 cells</text>
    <g stroke="#bc4749" stroke-width="1.5">
      <rect x="724" y="86" width="90" height="150" fill="#eaf1f7"/>
    </g>
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="742" y1="86" x2="742" y2="236"/>
      <line x1="760" y1="86" x2="760" y2="236"/>
      <line x1="778" y1="86" x2="778" y2="236"/>
      <line x1="796" y1="86" x2="796" y2="236"/>
      <line x1="724" y1="116" x2="814" y2="116"/>
      <line x1="724" y1="146" x2="814" y2="146"/>
      <line x1="724" y1="176" x2="814" y2="176"/>
      <line x1="724" y1="206" x2="814" y2="206"/>
    </g>
    <!-- cell icons for assay 2: different set (squares), no correspondence -->
    <g fill="#6a994e">
      <rect x="824" y="96" width="10" height="10"/>
      <rect x="824" y="126" width="10" height="10"/>
      <rect x="824" y="156" width="10" height="10"/>
      <rect x="824" y="186" width="10" height="10"/>
      <rect x="824" y="216" width="10" height="10"/>
    </g>

    <!-- tangled / crossed dashed lines showing NO clean row correspondence -->
    <g stroke="#bc4749" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75">
      <line x1="561" y1="101" x2="724" y2="161"/>
      <line x1="561" y1="131" x2="724" y2="221"/>
      <line x1="561" y1="161" x2="724" y2="101"/>
      <line x1="561" y1="191" x2="724" y2="221"/>
      <line x1="561" y1="221" x2="724" y2="131"/>
    </g>
    <text x="642" y="272" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">different cells measured by each assay</text>

    <text x="657" y="319" font-size="12.5" fill="#1b2a3a" text-anchor="middle">rows do NOT correspond &#8594; no shared index</text>
    <text x="657" y="358" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">needs anchor / mutual-nearest-neighbour</text>
    <text x="657" y="376" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">alignment, not CCA / MOFA</text>
  </g>
</svg>
