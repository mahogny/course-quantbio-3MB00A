<svg xmlns="http://www.w3.org/2000/svg" viewBox="28.8 35.3 700.8 279.2" font-family="Helvetica, Arial, sans-serif" width="700.8" height="279.2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <pattern id="rnaCols" width="4" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="10" stroke="#2a6f97" stroke-width="0.9" opacity="0.4"/>
    </pattern>
    <pattern id="protCols" width="13" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.6" y1="0" x2="0.6" y2="10" stroke="#6a994e" stroke-width="1.4" opacity="0.6"/>
    </pattern>
    <pattern id="latCols" width="12" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.6" y1="0" x2="0.6" y2="10" stroke="#1b2a3a" stroke-width="1.4" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- cells axis label -->
  <text x="58" y="179" fill="#1b2a3a" font-size="13" text-anchor="middle" transform="rotate(-90 58 179)">cells (rows)</text>

  <!-- RNA matrix : wide, many thin columns -->
  <rect x="150" y="80" width="270" height="190" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <rect x="150" y="80" width="270" height="190" fill="url(#rnaCols)"/>
  <text x="285" y="66" fill="#2a6f97" font-size="15" font-weight="bold" text-anchor="middle">X_RNA : cells × 20000</text>

  <!-- Protein matrix : narrow, few columns, same height, rows aligned -->
  <rect x="440" y="80" width="70" height="190" fill="#eef5e9" stroke="#6a994e" stroke-width="2"/>
  <rect x="440" y="80" width="70" height="190" fill="url(#protCols)"/>
  <text x="475" y="66" fill="#6a994e" font-size="15" font-weight="bold" text-anchor="middle">X_prot : cells × 100</text>

  <!-- shared row gridlines tying both matrices -->
  <g stroke="#c9d3dd" stroke-width="0.8">
    <line x1="150" y1="95.8" x2="510" y2="95.8"/>
    <line x1="150" y1="111.7" x2="510" y2="111.7"/>
    <line x1="150" y1="127.5" x2="510" y2="127.5"/>
    <line x1="150" y1="143.3" x2="510" y2="143.3"/>
    <line x1="150" y1="159.2" x2="510" y2="159.2"/>
    <line x1="150" y1="175.0" x2="510" y2="175.0"/>
    <line x1="150" y1="190.8" x2="510" y2="190.8"/>
    <line x1="150" y1="206.7" x2="510" y2="206.7"/>
    <line x1="150" y1="222.5" x2="510" y2="222.5"/>
    <line x1="150" y1="238.3" x2="510" y2="238.3"/>
    <line x1="150" y1="254.2" x2="510" y2="254.2"/>
  </g>

  <!-- highlighted row band across BOTH matrices, same colour -->
  <rect x="150" y="159.2" width="270" height="47.5" fill="#bc4749" opacity="0.16"/>
  <rect x="440" y="159.2" width="70" height="47.5" fill="#bc4749" opacity="0.16"/>
  <rect x="150" y="159.2" width="270" height="47.5" fill="none" stroke="#bc4749" stroke-width="1.2" opacity="0.7"/>
  <rect x="440" y="159.2" width="70" height="47.5" fill="none" stroke="#bc4749" stroke-width="1.2" opacity="0.7"/>

  <!-- caption for the band -->
  <text x="330" y="292" fill="#bc4749" font-size="13.5" font-weight="bold" text-anchor="middle">same cell, same row order</text>
  <line x1="330" y1="277" x2="330" y2="207" stroke="#bc4749" stroke-width="1" opacity="0.6"/>

  <!-- cell icon at left of highlighted row -->
  <line x1="112" y1="183" x2="150" y2="183" stroke="#bc4749" stroke-width="1.2" opacity="0.6"/>
  <circle cx="99" cy="183" r="12" fill="#f6e7e7" stroke="#bc4749" stroke-width="2"/>
  <circle cx="99" cy="183" r="5" fill="#bc4749"/>
  <text x="99" y="212" fill="#bc4749" font-size="12.5" font-weight="bold" text-anchor="middle">T cell</text>

  <!-- bold arrow from both matrices to joint latent space -->
  <path d="M516,175 L604,175" stroke="#1b2a3a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- joint latent space : small rectangle, cells x k -->
  <rect x="612" y="120" width="60" height="110" fill="#f2eef7" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="612" y="120" width="60" height="110" fill="url(#latCols)"/>
  <!-- k row-tie highlight -->
  <rect x="612" y="147.5" width="60" height="27.5" fill="#bc4749" opacity="0.16"/>
  <text x="642" y="108" fill="#1b2a3a" font-size="14" font-weight="bold" text-anchor="middle">joint latent space</text>
  <text x="642" y="248" fill="#1b2a3a" font-size="12.5" text-anchor="middle">cells × k  (k small, e.g. 5)</text>
  <text x="642" y="268" fill="#6a994e" font-size="12.5" font-style="italic" text-anchor="middle">shared biology,</text>
  <text x="642" y="284" fill="#6a994e" font-size="12.5" font-style="italic" text-anchor="middle">recovered once</text>
</svg>
