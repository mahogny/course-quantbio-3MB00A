<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- STEP LABELS -->
  <text x="24" y="26" font-size="15" font-weight="bold" fill="#1b2a3a">Step 1: concatenate</text>
  <text x="560" y="26" font-size="15" font-weight="bold" fill="#1b2a3a">Step 2: PCA</text>

  <!-- ===================== STEP 1 : INPUT MATRICES ===================== -->
  <!-- bracket: n cells (rows aligned across both matrices) -->
  <path d="M28,66 L22,66 L22,190 L28,190" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="16" y="132" font-size="11" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 16 132)">n cells (rows)</text>

  <!-- Xr : wide, RNA blue -->
  <text x="73" y="60" font-size="13" fill="#2a6f97" text-anchor="start" font-weight="bold">X<tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> (RNA)</tspan></text>
  <rect x="34" y="66" width="128" height="124" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="66" y1="66" x2="66" y2="190"/>
    <line x1="98" y1="66" x2="98" y2="190"/>
    <line x1="130" y1="66" x2="130" y2="190"/>
    <line x1="34" y1="97"  x2="162" y2="97"/>
    <line x1="34" y1="128" x2="162" y2="128"/>
    <line x1="34" y1="159" x2="162" y2="159"/>
  </g>
  <text x="68" y="207" font-size="11" fill="#2a6f97" text-anchor="start">n &#215; p<tspan font-size="8" dy="3">r</tspan><tspan dy="-3"> (wide)</tspan></text>

  <!-- Xp : narrow, protein green -->
  <text x="168" y="60" font-size="13" fill="#6a994e" text-anchor="start" font-weight="bold">X<tspan font-size="9" dy="3">p</tspan><tspan dy="-3"> (protein)</tspan></text>
  <rect x="176" y="66" width="52" height="124" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="202" y1="66" x2="202" y2="190"/>
    <line x1="176" y1="97"  x2="228" y2="97"/>
    <line x1="176" y1="128" x2="228" y2="128"/>
    <line x1="176" y1="159" x2="228" y2="159"/>
  </g>
  <text x="187" y="207" font-size="11" fill="#6a994e" text-anchor="start">n &#215; p<tspan font-size="8" dy="3">p</tspan></text>

  <!-- both normalized + block-scaled note -->
  <text x="131" y="230" font-size="10.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">both normalized + block-scaled</text>

  <!-- cbind arrow -->
  <line x1="231" y1="128" x2="309" y2="128" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="112" font-size="12" fill="#1b2a3a" text-anchor="middle" font-weight="bold">cbind</text>
  <text x="268" y="152" font-size="9.5" fill="#1b2a3a" text-anchor="middle">rows match</text>

  <!-- ===================== GLUED MATRIX [ Xr | Xp ] ===================== -->
  <text x="367" y="60" font-size="13" fill="#1b2a3a" text-anchor="start" font-weight="bold">[ X<tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> | X</tspan><tspan font-size="9" dy="3">p</tspan><tspan dy="-3"> ]</tspan></text>
  <!-- RNA region -->
  <rect x="312" y="66" width="128" height="124" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="344" y1="66" x2="344" y2="190"/>
    <line x1="376" y1="66" x2="376" y2="190"/>
    <line x1="408" y1="66" x2="408" y2="190"/>
    <line x1="312" y1="97"  x2="492" y2="97"/>
    <line x1="312" y1="128" x2="492" y2="128"/>
    <line x1="312" y1="159" x2="492" y2="159"/>
  </g>
  <!-- protein region -->
  <rect x="440" y="66" width="52" height="124" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
  <line x1="466" y1="66" x2="466" y2="190" stroke="#c9d3dd" stroke-width="1"/>
  <!-- VISIBLE SEAM between RNA and protein blocks -->
  <line x1="440" y1="60" x2="440" y2="198" stroke="#bc4749" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="378" y="205" font-size="10.5" fill="#2a6f97" text-anchor="middle">gene cols</text>
  <text x="466" y="205" font-size="10.5" fill="#6a994e" text-anchor="middle">prot</text>
  <text x="328" y="230" font-size="11" fill="#1b2a3a" text-anchor="start">ONE wide matrix &#160; n &#215; (p<tspan font-size="8" dy="3">r</tspan><tspan dy="-3"> + p</tspan><tspan font-size="8" dy="3">p</tspan><tspan dy="-3">)</tspan></text>

  <!-- prcomp arrow -->
  <line x1="495" y1="128" x2="573" y2="128" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="116" font-size="12" fill="#1b2a3a" text-anchor="middle" font-weight="bold">prcomp</text>

  <!-- ===================== STEP 2 : OUTPUTS ===================== -->
  <!-- (a) scores -->
  <text x="628" y="60" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">scores</text>
  <rect x="576" y="66" width="104" height="76" fill="#eef2f6" stroke="#1b2a3a" stroke-width="1.6"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="608" y1="66" x2="608" y2="142"/>
    <line x1="640" y1="66" x2="640" y2="142"/>
    <line x1="576" y1="91"  x2="680" y2="91"/>
    <line x1="576" y1="116" x2="680" y2="116"/>
  </g>
  <text x="628" y="158" font-size="10.5" fill="#1b2a3a" text-anchor="middle">joint latent space</text>
  <text x="628" y="172" font-size="10.5" fill="#1b2a3a" text-anchor="middle">(cells &#215; PCs)</text>

  <!-- (b) loadings vector, split by the SAME seam -->
  <text x="782" y="60" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">loadings</text>
  <!-- gene part (blue) -->
  <rect x="762" y="66" width="40" height="86" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="762" y1="87"  x2="802" y2="87"/>
    <line x1="762" y1="108" x2="802" y2="108"/>
    <line x1="762" y1="129" x2="802" y2="129"/>
  </g>
  <text x="812" y="112" font-size="10.5" fill="#2a6f97" text-anchor="start">gene part</text>
  <!-- protein part (green) -->
  <rect x="762" y="152" width="40" height="40" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
  <line x1="762" y1="172" x2="802" y2="172" stroke="#c9d3dd" stroke-width="1"/>
  <text x="812" y="176" font-size="10.5" fill="#6a994e" text-anchor="start">protein part</text>
  <!-- SAME seam splitting the loading vector -->
  <line x1="756" y1="152" x2="808" y2="152" stroke="#bc4749" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="755" y="208" font-size="10.5" fill="#1b2a3a" text-anchor="start">(p<tspan font-size="8" dy="3">r</tspan><tspan dy="-3"> + p</tspan><tspan font-size="8" dy="3">p</tspan><tspan dy="-3">) &#215; 1</tspan></text>

  <!-- ===================== RED WARNING CALLOUT ===================== -->
  <rect x="34" y="262" width="812" height="120" rx="8" fill="#fbeced" stroke="#bc4749" stroke-width="1.8"/>
  <!-- warning triangle -->
  <path d="M74,286 L94,326 L54,326 Z" fill="none" stroke="#bc4749" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="74" y1="299" x2="74" y2="314" stroke="#bc4749" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="74" cy="320" r="1.6" fill="#bc4749"/>
  <text x="120" y="294" font-size="14" fill="#bc4749" font-weight="bold">Warning &#8212; block-scaling is not optional</text>
  <text x="120" y="318" font-size="12.5" fill="#1b2a3a">Without block-scaling the big (RNA) block dominates the total variance &#8594;</text>
  <text x="120" y="338" font-size="12.5" fill="#1b2a3a">the PCs are essentially just RNA PCs, and the protein block contributes nothing.</text>
  <text x="120" y="362" font-size="11.5" fill="#bc4749" font-style="italic">Scale each block so its total variance is comparable before cbind.</text>
</svg>
