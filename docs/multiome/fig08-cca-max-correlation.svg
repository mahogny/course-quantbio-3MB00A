<svg xmlns="http://www.w3.org/2000/svg" width="880" height="416" viewBox="0 0 880 416" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowD" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: two feature spaces, each projected by a direction vector -->
  <rect x="14" y="14" width="346" height="300" rx="8" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- RNA feature space -->
  <text x="108" y="42" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="middle">RNA feature space</text>
  <rect x="44" y="52" width="128" height="104" rx="4" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <g fill="#2a6f97">
    <circle cx="80" cy="90" r="3"/><circle cx="96" cy="78" r="3"/><circle cx="118" cy="96" r="3"/>
    <circle cx="132" cy="82" r="3"/><circle cx="90" cy="116" r="3"/><circle cx="112" cy="120" r="3"/>
    <circle cx="128" cy="110" r="3"/><circle cx="72" cy="104" r="3"/><circle cx="104" cy="100" r="3"/>
    <circle cx="122" cy="132" r="3"/>
  </g>
  <!-- direction vector a -->
  <line x1="76" y1="128" x2="150" y2="66" stroke="#2a6f97" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="156" y="66" font-size="18" font-weight="bold" fill="#2a6f97" font-style="italic">a</text>

  <!-- protein feature space -->
  <text x="108" y="184" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="middle">protein feature space</text>
  <rect x="44" y="194" width="128" height="104" rx="4" fill="#fbecec" stroke="#c9d3dd" stroke-width="1.2"/>
  <g fill="#bc4749">
    <circle cx="80" cy="232" r="3"/><circle cx="98" cy="220" r="3"/><circle cx="120" cy="236" r="3"/>
    <circle cx="134" cy="224" r="3"/><circle cx="88" cy="258" r="3"/><circle cx="110" cy="262" r="3"/>
    <circle cx="128" cy="252" r="3"/><circle cx="74" cy="244" r="3"/><circle cx="106" cy="242" r="3"/>
    <circle cx="124" cy="274" r="3"/>
  </g>
  <!-- direction vector b -->
  <line x1="76" y1="270" x2="150" y2="208" stroke="#bc4749" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="156" y="208" font-size="18" font-weight="bold" fill="#bc4749" font-style="italic">b</text>

  <!-- projection: each cell to a scalar score -->
  <line x1="172" y1="104" x2="224" y2="104" stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <line x1="172" y1="246" x2="224" y2="246" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="232" y="100" font-size="14" fill="#2a6f97" font-style="italic">X</text>
  <text x="243" y="103" font-size="10" fill="#2a6f97">RNA</text>
  <text x="266" y="100" font-size="14" fill="#2a6f97" font-style="italic">a</text>
  <text x="232" y="242" font-size="14" fill="#bc4749" font-style="italic">X</text>
  <text x="243" y="245" font-size="10" fill="#bc4749">prot</text>
  <text x="264" y="242" font-size="14" fill="#bc4749" font-style="italic">b</text>
  <text x="266" y="172" font-size="12" fill="#1b2a3a" text-anchor="middle">project each cell</text>
  <text x="266" y="188" font-size="12" fill="#1b2a3a" text-anchor="middle">to a scalar score</text>
  <text x="266" y="290" font-size="11.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">one number</text>
  <text x="266" y="304" font-size="11.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">per cell</text>

  <!-- RIGHT PANEL: scatter of the two scores, tight along 45 deg -->
  <rect x="372" y="14" width="494" height="300" rx="8" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="505" y1="220" x2="825" y2="220"/>
    <line x1="505" y1="160" x2="825" y2="160"/>
    <line x1="505" y1="100" x2="825" y2="100"/>
    <line x1="585" y1="60" x2="585" y2="280"/>
    <line x1="665" y1="60" x2="665" y2="280"/>
    <line x1="745" y1="60" x2="745" y2="280"/>
  </g>

  <!-- axes -->
  <line x1="505" y1="280" x2="833" y2="280" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrowD)"/>
  <line x1="505" y1="280" x2="505" y2="52" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrowD)"/>

  <!-- ideal 45 deg reference line -->
  <line x1="512" y1="273" x2="805" y2="78" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- points: cells lie tightly along the diagonal -->
  <g fill="#1b2a3a">
    <circle cx="534" cy="261" r="4"/><circle cx="566" cy="236" r="4"/><circle cx="590" cy="224" r="4"/>
    <circle cx="624" cy="196" r="4"/><circle cx="648" cy="185" r="4"/><circle cx="682" cy="158" r="4"/>
    <circle cx="706" cy="147" r="4"/><circle cx="740" cy="119" r="4"/><circle cx="765" cy="108" r="4"/>
    <circle cx="792" cy="86" r="4"/>
  </g>

  <!-- annotation: maximized correlation -->
  <text x="524" y="96" font-size="12.5" fill="#6a994e" font-weight="bold">maximized</text>
  <text x="524" y="112" font-size="12" fill="#1b2a3a">corr( X<tspan font-size="9" baseline-shift="sub">RNA</tspan> a , X<tspan font-size="9" baseline-shift="sub">prot</tspan> b )</text>
  <text x="524" y="130" font-size="12" fill="#6a994e" font-weight="bold">&#8594; high canonical corr (r &#8776; 1)</text>
  <line x1="600" y1="135" x2="649" y2="183" stroke="#6a994e" stroke-width="1.4" marker-end="url(#arrowD)"/>

  <!-- x axis title (RNA colour) -->
  <text x="563" y="300" font-size="13" fill="#2a6f97" text-anchor="start" font-weight="bold"><tspan font-style="italic">X</tspan><tspan font-size="9" dy="3">RNA</tspan><tspan dy="-3" font-style="italic"> a</tspan><tspan font-style="normal">  (canonical variate 1, RNA)</tspan></text>
  <!-- y axis title (protein colour) -->
  <text x="392" y="278" font-size="13" fill="#bc4749" text-anchor="start" font-weight="bold" transform="rotate(-90 392 278)"><tspan font-style="italic">X</tspan><tspan font-size="9" dy="3">prot</tspan><tspan dy="-3" font-style="italic"> b</tspan><tspan font-style="normal">  (canonical variate 1, protein)</tspan></text>

  <!-- CONTRAST NOTE strip -->
  <text x="30" y="336" font-size="13" fill="#8a97a5">PCA asks: where is the variance?</text>
  <text x="560" y="336" font-size="13" fill="#1b2a3a">CCA asks: where do the modalities <tspan font-weight="bold" fill="#6a994e">AGREE</tspan>?</text>

  <!-- AMBER CAVEAT box -->
  <rect x="14" y="348" width="852" height="60" rx="8" fill="#fdf3e0" stroke="#d68c00" stroke-width="1.6"/>
  <!-- warning triangle -->
  <path d="M42,362 L56,388 L28,388 Z" fill="none" stroke="#a8690b" stroke-width="2" stroke-linejoin="round"/>
  <text x="42" y="385" font-size="15" fill="#a8690b" font-weight="bold" text-anchor="middle">!</text>
  <text x="74" y="374" font-size="13" fill="#a8690b" font-weight="bold">p &gt;&gt; n in omics &#8594; plain CCA overfits (correlation can hit 1 spuriously).</text>
  <text x="74" y="394" font-size="13" fill="#a8690b">Use sparse / regularized CCA (e.g. PMA) to select a few features per direction.</text>
</svg>
