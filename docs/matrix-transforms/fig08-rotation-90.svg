<svg xmlns="http://www.w3.org/2000/svg" viewBox="12.3 1.4 633.1 346.9" width="633.1" height="346.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="ahArc" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- origin at (220,205), scale 100 px / unit -->

  <!-- faint unit circle to emphasise preserved length -->
  <circle cx="220" cy="205" r="100" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- grid lines through origin (axes) -->
  <line x1="90" y1="205" x2="380" y2="205" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="220" y1="330" x2="220" y2="70" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- axis heads -->
  <line x1="360" y1="205" x2="378" y2="205" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="220" y1="90" x2="220" y2="72" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="384" y="210" font-size="15" fill="#1b2a3a">x</text>
  <text x="226" y="80" font-size="15" fill="#1b2a3a">y</text>

  <!-- secondary example: e2=(0,1) rotates to (-1,0) -->
  <line x1="220" y1="205" x2="120" y2="205" stroke="#bc4749" stroke-width="2" opacity="0.85" marker-end="url(#ahRed)"/>
  <path d="M 212,93 A 112,112 0 0 0 108,197" fill="none" stroke="#bc4749" stroke-width="1.4" opacity="0.7" stroke-dasharray="4 3" marker-end="url(#ahRed)"/>
  <text x="60" y="230" font-size="13" fill="#bc4749">R e<tspan font-size="10" dy="4">2</tspan><tspan dy="-4">=(−1,0)</tspan></text>

  <!-- e1 = (1,0) : solid arrow -->
  <line x1="220" y1="205" x2="320" y2="205" stroke="#1b2a3a" stroke-width="2.6" marker-end="url(#ah)"/>
  <text x="300" y="228" font-size="15" fill="#1b2a3a">e<tspan font-size="11" dy="4">1</tspan><tspan dy="-4">=(1,0)</tspan></text>

  <!-- image of e1 after R(90): (0,1) : blue arrow up -->
  <line x1="220" y1="205" x2="220" y2="105" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#ahBlue)"/>
  <text x="234" y="100" font-size="15" fill="#2a6f97">R e<tspan font-size="11" dy="4">1</tspan><tspan dy="-4">=(0,1)</tspan></text>

  <!-- CCW arc from (1,0) sweeping up to (0,1) -->
  <path d="M 280,205 A 60,60 0 0 0 228,146" fill="none" stroke="#6a994e" stroke-width="2" marker-end="url(#ahArc)"/>
  <text x="270" y="162" font-size="15" fill="#6a994e">θ = 90°</text>

  <!-- rigid annotation -->
  <text x="30" y="30" font-size="14.5" fill="#1b2a3a">direction changes, length stays 1 (rigid)</text>

  <!-- rotation matrix caption -->
  <g transform="translate(430,150)" fill="#1b2a3a">
    <text x="0" y="12" font-size="15">R(θ) =</text>
    <path d="M 70,-20 L 62,-20 L 62,28 L 70,28" fill="none" stroke="#1b2a3a" stroke-width="2"/>
    <text x="78" y="0" font-size="15">cos θ</text>
    <text x="130" y="0" font-size="15">−sin θ</text>
    <text x="78" y="22" font-size="15">sin θ</text>
    <text x="134" y="22" font-size="15">cos θ</text>
    <path d="M 180,-20 L 188,-20 L 188,28 L 180,28" fill="none" stroke="#1b2a3a" stroke-width="2"/>
    <text x="0" y="62" font-size="13.5" fill="#2a6f97">θ=90°:  cos=0, sin=1</text>
    <text x="0" y="104" font-size="15">R(90°) =</text>
    <path d="M 82,72 L 74,72 L 74,120 L 82,120" fill="none" stroke="#1b2a3a" stroke-width="2"/>
    <text x="90" y="92" font-size="15">0</text>
    <text x="118" y="92" font-size="15">−1</text>
    <text x="92" y="114" font-size="15">1</text>
    <text x="122" y="114" font-size="15">0</text>
    <path d="M 140,72 L 148,72 L 148,120 L 140,120" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  </g>
</svg>
