<svg xmlns="http://www.w3.org/2000/svg" viewBox="34.6 24.5 686.2 370.5" width="686.2" height="370.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowFaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb0c0"/>
    </marker>
  </defs>

  <!-- ==== Coordinate system: origin at (70,330), 50px per unit, y up ==== -->
  <!-- grid lines (x: 0..12, y: 0..5) -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical grid every unit -->
    <line x1="70"  y1="60" x2="70"  y2="330"/>
    <line x1="120" y1="60" x2="120" y2="330"/>
    <line x1="170" y1="60" x2="170" y2="330"/>
    <line x1="220" y1="60" x2="220" y2="330"/>
    <line x1="270" y1="60" x2="270" y2="330"/>
    <line x1="320" y1="60" x2="320" y2="330"/>
    <line x1="370" y1="60" x2="370" y2="330"/>
    <line x1="420" y1="60" x2="420" y2="330"/>
    <line x1="470" y1="60" x2="470" y2="330"/>
    <line x1="520" y1="60" x2="520" y2="330"/>
    <line x1="570" y1="60" x2="570" y2="330"/>
    <line x1="620" y1="60" x2="620" y2="330"/>
    <line x1="670" y1="60" x2="670" y2="330"/>
    <!-- horizontal grid every unit -->
    <line x1="70" y1="330" x2="670" y2="330"/>
    <line x1="70" y1="280" x2="670" y2="280"/>
    <line x1="70" y1="230" x2="670" y2="230"/>
    <line x1="70" y1="180" x2="670" y2="180"/>
    <line x1="70" y1="130" x2="670" y2="130"/>
    <line x1="70" y1="80"  x2="670" y2="80"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2">
    <line x1="70" y1="330" x2="690" y2="330" marker-end="url(#arrow)"/>
    <line x1="70" y1="330" x2="70"  y2="55"  marker-end="url(#arrow)"/>
  </g>
  <text x="694" y="335" font-size="15" fill="#1b2a3a">x</text>
  <text x="60"  y="52"  font-size="15" fill="#1b2a3a">y</text>

  <!-- x ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="middle">
    <text x="170" y="348">2</text>
    <text x="270" y="348">4</text>
    <text x="370" y="348">6</text>
    <text x="470" y="348">8</text>
    <text x="570" y="348">10</text>
    <text x="60" y="285" text-anchor="end">1</text>
    <text x="60" y="235" text-anchor="end">2</text>
    <text x="60" y="185" text-anchor="end">3</text>
    <text x="60" y="135" text-anchor="end">4</text>
    <text x="60" y="85"  text-anchor="end">5</text>
  </g>

  <!-- ==== Faint unit building blocks near origin ==== -->
  <!-- col1 = (1,0) faint: origin(70,330) -> (120,330) -->
  <line x1="70" y1="330" x2="120" y2="330" stroke="#9fb0c0" stroke-width="2" marker-end="url(#arrowFaint)"/>
  <!-- col2 = (2,1) faint: origin -> (170,280) -->
  <line x1="70" y1="330" x2="170" y2="280" stroke="#9fb0c0" stroke-width="2" marker-end="url(#arrowFaint)"/>
  <text x="98" y="323" font-size="12" fill="#9fb0c0">col1</text>
  <text x="150" y="300" font-size="12" fill="#9fb0c0">col2</text>

  <!-- ==== 3 x col1 : origin(70,330) -> (3,0)=(220,330) ==== -->
  <line x1="70" y1="330" x2="220" y2="330" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <text x="158" y="320" font-size="16" fill="#2a6f97" font-weight="bold">3 × col1</text>

  <!-- ==== 4 x col2 : from (3,0)=(220,330) vector (8,4) -> (11,4)=(620,130) ==== -->
  <line x1="220" y1="330" x2="620" y2="130" stroke="#6a994e" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <text x="360" y="215" font-size="16" fill="#6a994e" font-weight="bold" transform="rotate(-26.57 360 215)">4 × col2</text>

  <!-- ==== Resultant Ax : origin -> (11,4)=(620,130) ==== -->
  <line x1="70" y1="330" x2="620" y2="130" stroke="#bc4749" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <text x="300" y="255" font-size="17" fill="#bc4749" font-weight="bold" transform="rotate(-20 300 255)">Ax = (11, 4)</text>

  <!-- endpoint dot -->
  <circle cx="620" cy="130" r="4.5" fill="#bc4749"/>
  <circle cx="220" cy="330" r="4" fill="#2a6f97"/>

  <!-- tip-to-tail note -->
  <text x="240" y="373" font-size="12" fill="#1b2a3a" font-style="italic">tip-to-tail: place 4·col2 at the tip of 3·col1</text>
</svg>
