<svg xmlns="http://www.w3.org/2000/svg" viewBox="23.6 82 823.9 278" width="823.9" height="278" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===================== LEFT GRID (input) ===================== -->
  <g>
    <!-- grid lines -->
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="60" y1="300" x2="230" y2="300"/>
      <line x1="60" y1="250" x2="230" y2="250"/>
      <line x1="60" y1="200" x2="230" y2="200"/>
      <line x1="60" y1="150" x2="230" y2="150"/>
      <line x1="110" y1="140" x2="110" y2="300"/>
      <line x1="160" y1="140" x2="160" y2="300"/>
      <line x1="210" y1="140" x2="210" y2="300"/>
    </g>
    <!-- axes -->
    <g stroke="#1b2a3a" stroke-width="1.8">
      <line x1="60" y1="300" x2="235" y2="300" marker-end="url(#arrow)"/>
      <line x1="60" y1="300" x2="60" y2="135" marker-end="url(#arrow)"/>
    </g>
    <!-- ticks -->
    <g fill="#1b2a3a" font-size="12" text-anchor="middle">
      <text x="110" y="316">1</text>
      <text x="160" y="316">2</text>
      <text x="210" y="316">3</text>
      <text x="50" y="254">1</text>
      <text x="50" y="204">2</text>
      <text x="50" y="154">3</text>
    </g>
    <text x="243" y="304" font-size="14" fill="#1b2a3a">x</text>
    <text x="55" y="128" font-size="14" fill="#1b2a3a">y</text>
    <!-- input vector to (1,1) -->
    <line x1="60" y1="300" x2="110" y2="250" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <circle cx="110" cy="250" r="3" fill="#2a6f97"/>
    <text x="120" y="245" font-size="15" fill="#2a6f97" font-weight="bold">x = (1,1)</text>
    <text x="145" y="345" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">input vector</text>
  </g>

  <!-- ===================== CENTER MACHINE ===================== -->
  <g>
    <!-- entering arrow -->
    <line x1="255" y1="220" x2="335" y2="220" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- box -->
    <rect x="340" y="180" width="150" height="80" rx="14" ry="14" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <text x="415" y="205" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">A =</text>
    <!-- matrix bracket display -->
    <g font-size="15" fill="#1b2a3a" text-anchor="middle">
      <text x="405" y="232">2  0</text>
      <text x="405" y="250">0  3</text>
    </g>
    <path d="M388,220 v-14 h5 M388,220 v14 h5" stroke="#1b2a3a" stroke-width="1.5" fill="none"/>
    <path d="M448,220 v-14 h-5 M448,220 v14 h-5" stroke="#1b2a3a" stroke-width="1.5" fill="none"/>
    <!-- leaving arrow -->
    <line x1="495" y1="220" x2="600" y2="220" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="415" y="300" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">function machine</text>
    <text x="415" y="320" font-size="13" fill="#1b2a3a" text-anchor="middle">vector → vector</text>
    <text x="295" y="210" font-size="13" fill="#1b2a3a" text-anchor="middle">x</text>
    <text x="540" y="210" font-size="13" fill="#1b2a3a" text-anchor="middle">Ax</text>
  </g>

  <!-- ===================== RIGHT GRID (output) ===================== -->
  <g>
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="620" y1="300" x2="790" y2="300"/>
      <line x1="620" y1="250" x2="790" y2="250"/>
      <line x1="620" y1="200" x2="790" y2="200"/>
      <line x1="620" y1="150" x2="790" y2="150"/>
      <line x1="670" y1="140" x2="670" y2="300"/>
      <line x1="720" y1="140" x2="720" y2="300"/>
      <line x1="770" y1="140" x2="770" y2="300"/>
    </g>
    <g stroke="#1b2a3a" stroke-width="1.8">
      <line x1="620" y1="300" x2="795" y2="300" marker-end="url(#arrow)"/>
      <line x1="620" y1="300" x2="620" y2="135" marker-end="url(#arrow)"/>
    </g>
    <g fill="#1b2a3a" font-size="12" text-anchor="middle">
      <text x="670" y="316">1</text>
      <text x="720" y="316">2</text>
      <text x="770" y="316">3</text>
      <text x="610" y="254">1</text>
      <text x="610" y="204">2</text>
      <text x="610" y="154">3</text>
    </g>
    <text x="803" y="304" font-size="14" fill="#1b2a3a">x</text>
    <text x="615" y="128" font-size="14" fill="#1b2a3a">y</text>

    <!-- ghost input vector to (1,1) -->
    <line x1="620" y1="300" x2="670" y2="250" stroke="#2a6f97" stroke-width="2" stroke-dasharray="4 4" opacity="0.45" marker-end="url(#arrowBlue)"/>
    <circle cx="670" cy="250" r="2.5" fill="#2a6f97" opacity="0.45"/>

    <!-- output vector to (2,3) -->
    <line x1="620" y1="300" x2="720" y2="150" stroke="#bc4749" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <circle cx="720" cy="150" r="3" fill="#bc4749"/>
    <text x="728" y="145" font-size="15" fill="#bc4749" font-weight="bold">Ax = (2,3)</text>

    <!-- stretch annotations -->
    <path d="M670,268 L720,268" stroke="#6a994e" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.9"/>
    <path d="M670,268 L720,268" stroke="#6a994e" stroke-width="1.5" opacity="0.9"/>
    <text x="695" y="283" font-size="12" fill="#6a994e" text-anchor="middle" font-weight="bold">x ×2</text>

    <path d="M792,250 L792,150" stroke="#6a994e" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.9"/>
    <text x="815" y="200" font-size="12" fill="#6a994e" text-anchor="middle" font-weight="bold" transform="rotate(90 815 200)">y ×3</text>

    <text x="705" y="345" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">output vector</text>
  </g>

  <!-- title strip -->
  <text x="440" y="105" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">A matrix is a function on vectors:  A stretches x by 2 and y by 3</text>
</svg>
