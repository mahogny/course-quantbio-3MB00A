<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Posterior predictive checking: does the model regenerate our data?</text>

  <!-- LEFT: posterior cloud -->
  <rect x="20" y="70" width="180" height="150" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="110" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">posterior</text>
  <text x="110" y="110" text-anchor="middle" font-size="14" fill="#1b2a3a">p(θ | data)</text>
  <g fill="#2a6f97">
    <circle cx="70" cy="140" r="4"/><circle cx="105" cy="132" r="4"/><circle cx="150" cy="148" r="4"/>
    <circle cx="88" cy="165" r="4"/><circle cx="130" cy="160" r="4"/><circle cx="160" cy="180" r="4"/>
    <circle cx="66" cy="188" r="4"/><circle cx="110" cy="190" r="4"/>
  </g>
  <text x="70" y="212" text-anchor="middle" font-size="12" fill="#1b2a3a">θ⁽^1⁾</text>
  <text x="110" y="212" text-anchor="middle" font-size="12" fill="#1b2a3a">θ⁽^2⁾</text>
  <text x="152" y="212" text-anchor="middle" font-size="12" fill="#1b2a3a">… θ⁽ᔆ⁾</text>

  <!-- arrow to middle -->
  <line x1="204" y1="145" x2="286" y2="145" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245" y="128" text-anchor="middle" font-size="12" fill="#1b2a3a">for each draw,</text>
  <text x="245" y="172" text-anchor="middle" font-size="12" fill="#1b2a3a">simulate from</text>
  <text x="245" y="188" text-anchor="middle" font-size="12" fill="#1b2a3a">the NB error model</text>

  <!-- MIDDLE: stack of simulated histograms -->
  <g>
    <!-- back cards -->
    <rect x="318" y="86" width="150" height="118" rx="8" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
    <rect x="308" y="98" width="150" height="118" rx="8" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- front card -->
    <rect x="298" y="110" width="150" height="118" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <!-- histogram bars on front -->
    <g fill="#2a6f97">
      <rect x="312" y="180" width="14" height="34"/>
      <rect x="330" y="160" width="14" height="54"/>
      <rect x="348" y="150" width="14" height="64"/>
      <rect x="366" y="168" width="14" height="46"/>
      <rect x="384" y="184" width="14" height="30"/>
      <rect x="402" y="196" width="14" height="18"/>
      <rect x="420" y="204" width="14" height="10"/>
    </g>
    <line x1="308" y1="214" x2="440" y2="214" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <text x="373" y="248" text-anchor="middle" font-size="13" fill="#1b2a3a">y_rep⁽^1⁾, y_rep⁽^2⁾, …</text>
  <text x="373" y="264" text-anchor="middle" font-size="12" fill="#1b2a3a">(simulated datasets)</text>

  <!-- COMPARE two-way arrow -->
  <line x1="470" y1="150" x2="588" y2="150" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <text x="529" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">compare</text>

  <!-- RIGHT: observed histogram -->
  <rect x="600" y="86" width="160" height="142" rx="8" fill="#ffffff" stroke="#bc4749" stroke-width="2"/>
  <g fill="#bc4749">
    <rect x="616" y="160" width="15" height="54"/>
    <rect x="635" y="140" width="15" height="74"/>
    <rect x="654" y="152" width="15" height="62"/>
    <rect x="673" y="176" width="15" height="38"/>
    <rect x="692" y="150" width="15" height="64"/>
    <rect x="711" y="182" width="15" height="32"/>
    <rect x="730" y="168" width="15" height="46"/>
  </g>
  <line x1="610" y1="214" x2="752" y2="214" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="680" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#bc4749">y (observed data)</text>

  <!-- OUTCOME branches -->
  <line x1="529" y1="164" x2="529" y2="300" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="240" y1="300" x2="820" y2="300" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- green branch -->
  <line x1="240" y1="300" x2="240" y2="320" stroke="#6a994e" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(40,326)">
    <path d="M6,10 L11,16 L22,3" fill="none" stroke="#6a994e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="6" font-size="13" font-weight="bold" fill="#6a994e">simulated look like observed</text>
    <text x="34" y="24" font-size="13" fill="#1b2a3a">→ model reproduces the data</text>
  </g>

  <!-- red branch -->
  <line x1="640" y1="300" x2="640" y2="320" stroke="#bc4749" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(470,326)">
    <path d="M4,3 L18,17 M18,3 L4,17" fill="none" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
    <text x="30" y="6" font-size="13" font-weight="bold" fill="#bc4749">systematic mismatch</text>
    <text x="30" y="24" font-size="13" fill="#1b2a3a">→ model is missing something</text>
    <text x="30" y="40" font-size="11" fill="#1b2a3a">(wrong tail, too few zeros, missed skew)</text>
  </g>

  <!-- caption: integral -->
  <text x="440" y="410" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">y_rep ~ integral of p(y_rep | θ) · p(θ | data) dθ</text>
</svg>
