<svg xmlns="http://www.w3.org/2000/svg" width="900" height="448" viewBox="0 0 900 448" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">The generative story as a graph</text>

  <!-- ============ PRIOR HYPERPARAMETER BOXES (dashed) ============ -->
  <g fill="none" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="68"  y="45" width="104" height="26" rx="8"/>
    <rect x="218" y="45" width="104" height="26" rx="8"/>
    <rect x="358" y="45" width="104" height="26" rx="8"/>
    <rect x="600" y="45" width="80"  height="26" rx="8"/>
    <rect x="735" y="45" width="150" height="26" rx="8"/>
  </g>
  <g font-size="13" fill="#2a6f97" text-anchor="middle">
    <text x="120" y="62">Normal(0, 2)</text>
    <text x="270" y="62">Normal(0, 1)</text>
    <text x="410" y="62">Normal(0, 1)</text>
    <text x="640" y="62">Exp(1)</text>
    <text x="810" y="62">Gamma(0.01, 0.01)</text>
  </g>

  <!-- prior to parameter arrows -->
  <g stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="120" y1="71" x2="120" y2="93"/>
    <line x1="270" y1="71" x2="270" y2="93"/>
    <line x1="410" y1="71" x2="410" y2="93"/>
    <line x1="640" y1="71" x2="640" y2="93"/>
    <line x1="810" y1="71" x2="810" y2="93"/>
  </g>

  <!-- ============ LATENT PARAMETER NODES (solid) ============ -->
  <g stroke="#1b2a3a" stroke-width="2" fill="#eaf1f7">
    <ellipse cx="120" cy="118" rx="40" ry="23"/>
    <ellipse cx="270" cy="118" rx="40" ry="23"/>
    <ellipse cx="410" cy="118" rx="40" ry="23"/>
    <ellipse cx="640" cy="118" rx="48" ry="23"/>
    <ellipse cx="810" cy="118" rx="32" ry="23"/>
  </g>
  <g font-size="15" fill="#1b2a3a" text-anchor="middle">
    <text x="120" y="123">α</text>
    <text x="270" y="123">β_drug</text>
    <text x="410" y="123">β_age</text>
    <text x="640" y="123">σ_patient</text>
    <text x="810" y="123">φ</text>
  </g>

  <!-- ============ PATIENT PLATE ============ -->
  <rect x="585" y="175" width="118" height="150" rx="14" fill="none" stroke="#6a994e" stroke-width="1.6"/>
  <text x="644" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a994e">patient  p = 1..12</text>
  <!-- random intercept u_p (solid latent) -->
  <ellipse cx="644" cy="255" rx="36" ry="25" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="644" y="260" text-anchor="middle" font-size="15" fill="#1b2a3a">u_p</text>
  <text x="644" y="303" text-anchor="middle" font-size="11" fill="#1b2a3a">~ Normal(0, σ_patient)</text>
  <!-- sigma_patient into u_p -->
  <line x1="641" y1="141" x2="643" y2="228" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ OBSERVATION PLATE ============ -->
  <rect x="55" y="160" width="500" height="238" rx="14" fill="none" stroke="#2a6f97" stroke-width="1.6"/>
  <text x="150" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">sample  i = 1..24</text>

  <!-- offset (known data, dashed) -->
  <rect x="72" y="285" width="96" height="30" rx="8" fill="none" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="304" text-anchor="middle" font-size="12" fill="#2a6f97">log(n_cells,i)</text>

  <!-- deterministic node log mu_i (double outline) -->
  <ellipse cx="300" cy="240" rx="52" ry="26" fill="#ffffff" stroke="#6a994e" stroke-width="2"/>
  <ellipse cx="300" cy="240" rx="47" ry="21" fill="none" stroke="#6a994e" stroke-width="1.4"/>
  <text x="300" y="238" text-anchor="middle" font-size="15" fill="#1b2a3a">log μ_i</text>
  <text x="300" y="253" text-anchor="middle" font-size="10" fill="#6a994e">deterministic</text>

  <!-- observed node y_i (shaded / filled) -->
  <ellipse cx="300" cy="345" rx="32" ry="26" fill="#cdd8e2" stroke="#1b2a3a" stroke-width="2"/>
  <text x="300" y="351" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">y_i</text>
  <text x="300" y="390" text-anchor="middle" font-size="12" fill="#bc4749">y_i ~ NegBinomial(μ_i, φ)</text>

  <!-- arrows into log mu_i -->
  <g stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)" fill="none">
    <line x1="120" y1="141" x2="262" y2="223"/>
    <line x1="270" y1="141" x2="293" y2="214"/>
    <line x1="410" y1="141" x2="331" y2="222"/>
    <line x1="168" y1="296" x2="252" y2="252"/>
    <!-- u_p (patient[i]) into log mu_i -->
    <line x1="606" y1="252" x2="356" y2="244"/>
  </g>
  <text x="480" y="236" text-anchor="middle" font-size="12" font-style="italic" fill="#1b2a3a">patient[i]</text>

  <!-- log mu_i into y_i -->
  <line x1="300" y1="266" x2="300" y2="317" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- phi into y_i (routed along the right/bottom) -->
  <path d="M810,141 L810,345 L336,345" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#1b2a3a">dispersion</text>

  <!-- ============ BANNER ============ -->
  <rect x="150" y="408" width="600" height="32" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="450" y="429" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">posterior  proportional to  likelihood (NB)  ×  priors  —  Bayes theorem</text>
</svg>
