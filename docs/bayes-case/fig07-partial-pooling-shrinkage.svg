<svg xmlns="http://www.w3.org/2000/svg" width="657.7" height="388.6" viewBox="1.2 -5.6 657.7 388.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Partial pooling shrinks patients toward the cohort</text>

  <!-- Cohort grand mean: horizontal dashed line at y=195 -->
  <line x1="70" y1="195" x2="640" y2="195" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="636" y="187" text-anchor="end" font-size="13" fill="#1b2a3a">cohort grand mean (0)</text>

  <!-- Left and right axes (shared vertical scale) -->
  <line x1="230" y1="66" x2="230" y2="322" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="470" y1="66" x2="470" y2="322" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="230" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">no pooling</text>
  <text x="230" y="362" text-anchor="middle" font-size="12" fill="#5b7a99">(raw per-patient estimate)</text>
  <text x="470" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a994e">partial pooling</text>
  <text x="470" y="362" text-anchor="middle" font-size="12" fill="#5b7a99">(model estimate)</text>

  <!-- Vertical axis symbol -->
  <text x="30" y="200" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 30 200)">per-patient intercept  u_p</text>

  <!-- sigma_patient: between-patient spread indicator (+-1 sigma about the mean) -->
  <line x1="160" y1="140" x2="160" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="152" y1="140" x2="168" y2="140" stroke="#1b2a3a" stroke-width="1"/>
  <line x1="152" y1="250" x2="168" y2="250" stroke="#1b2a3a" stroke-width="1"/>
  <text x="130" y="195" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 130 195)">σ_patient = between-patient spread</text>

  <!-- Shrinkage arrows: raw (left) pulled toward the mean (right). Longer arrows for extreme patients. -->
  <g stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrow)" fill="none">
    <line x1="230" y1="85"     x2="460" y2="132.5"/>
    <line x1="230" y1="294"    x2="460" y2="251.8"/>
    <line x1="230" y1="112.5"  x2="460" y2="141.5"/>
    <line x1="230" y1="272"    x2="460" y2="245.6"/>
    <line x1="230" y1="134.5"  x2="460" y2="150.3"/>
    <line x1="230" y1="250"    x2="460" y2="235.2"/>
    <line x1="230" y1="156.5"  x2="460" y2="164.4"/>
    <line x1="230" y1="228"    x2="460" y2="221.7"/>
    <line x1="230" y1="173"    x2="460" y2="176.7"/>
    <line x1="230" y1="214.25" x2="460" y2="211.1"/>
    <line x1="230" y1="184"    x2="460" y2="185.6"/>
    <line x1="230" y1="203.25" x2="460" y2="202.2"/>
  </g>

  <!-- Noisy patient: horizontal error bar on the raw estimate (justifies larger shrinkage) -->
  <g stroke="#bc4749" stroke-width="1.8">
    <line x1="196" y1="85" x2="264" y2="85"/>
    <line x1="196" y1="79" x2="196" y2="91"/>
    <line x1="264" y1="79" x2="264" y2="91"/>
  </g>

  <!-- Left (raw) dots -->
  <g fill="#1b2a3a">
    <circle cx="230" cy="294" r="5.5"/>
    <circle cx="230" cy="112.5" r="5.5"/>
    <circle cx="230" cy="272" r="5.5"/>
    <circle cx="230" cy="134.5" r="5.5"/>
    <circle cx="230" cy="250" r="5.5"/>
    <circle cx="230" cy="156.5" r="5.5"/>
    <circle cx="230" cy="228" r="5.5"/>
    <circle cx="230" cy="173" r="5.5"/>
    <circle cx="230" cy="214.25" r="5.5"/>
    <circle cx="230" cy="184" r="5.5"/>
    <circle cx="230" cy="203.25" r="5.5"/>
  </g>
  <!-- Noisy raw dot highlighted -->
  <circle cx="230" cy="85" r="6" fill="#bc4749"/>

  <!-- Right (shrunk / model) dots -->
  <g fill="#6a994e">
    <circle cx="470" cy="132.5" r="5.5"/>
    <circle cx="470" cy="251.8" r="5.5"/>
    <circle cx="470" cy="141.5" r="5.5"/>
    <circle cx="470" cy="245.6" r="5.5"/>
    <circle cx="470" cy="150.3" r="5.5"/>
    <circle cx="470" cy="235.2" r="5.5"/>
    <circle cx="470" cy="164.4" r="5.5"/>
    <circle cx="470" cy="221.7" r="5.5"/>
    <circle cx="470" cy="176.7" r="5.5"/>
    <circle cx="470" cy="211.1" r="5.5"/>
    <circle cx="470" cy="185.6" r="5.5"/>
    <circle cx="470" cy="202.2" r="5.5"/>
  </g>

  <!-- Annotations -->
  <text x="360" y="98" text-anchor="middle" font-size="12" fill="#bc4749">noisy patient → shrunk more</text>
  <text x="360" y="303" text-anchor="middle" font-size="12" fill="#2a6f97">borrowing strength from the cohort</text>
</svg>
