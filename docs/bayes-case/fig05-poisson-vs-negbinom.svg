<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Negative binomial: the overdispersed cousin of Poisson</text>

  <!-- grid lines for probability -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="95" y1="237.9" x2="655" y2="237.9"/>
    <line x1="95" y1="175.9" x2="655" y2="175.9"/>
    <line x1="95" y1="113.8" x2="655" y2="113.8"/>
  </g>

  <!-- probability tick labels -->
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="88" y="304">0</text>
    <text x="88" y="242">0.02</text>
    <text x="88" y="180">0.04</text>
    <text x="88" y="118">0.06</text>
  </g>

  <!-- axes -->
  <line x1="95" y1="58" x2="95" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="95" y1="300" x2="668" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- x ticks -->
  <g stroke="#1b2a3a" stroke-width="1.5">
