  <text x="470" y="278" font-size="13" fill="#bc4749" font-weight="bold">heavy tail past 80</text>
  <line x1="466" y1="282" x2="600" y2="297" stroke="#bc4749" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="120" y="255" font-size="13" fill="#bc4749" font-weight="bold">mass near 0</text>

  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <rect x="380" y="60" width="285" height="58" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="392" y1="78" x2="418" y2="78" stroke="#2a6f97" stroke-width="2.4"/>
    <text x="425" y="82">Poisson  (Var = μ)</text>
    <line x1="392" y1="101" x2="418" y2="101" stroke="#bc4749" stroke-width="2.4"/>
    <text x="425" y="105">Negative binomial  (Var = μ + μ^2/φ)</text>
  </g>

  <!-- variance formula + note -->
  <g font-size="14" fill="#1b2a3a">
    <text x="360" y="372" text-anchor="middle" font-weight="bold">Var(y) = μ + μ^2/φ</text>
    <text x="360" y="392" text-anchor="middle" font-size="13" fill="#6a994e">φ → ∞ recovers Poisson;  small φ = strong overdispersion</text>
  </g>
</svg>
