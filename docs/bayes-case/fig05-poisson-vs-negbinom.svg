    <line x1="207" y1="300" x2="207" y2="305"/>
    <line x1="319" y1="300" x2="319" y2="305"/>
    <line x1="431" y1="300" x2="431" y2="305"/>
    <line x1="543" y1="300" x2="543" y2="305"/>
    <line x1="655" y1="300" x2="655" y2="305"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="95" y="319">0</text>
    <text x="207" y="319">20</text>
    <text x="319" y="319">40</text>
    <text x="431" y="319">60</text>
    <text x="543" y="319">80</text>
    <text x="655" y="319">100</text>
  </g>

  <!-- axis titles -->
  <text x="375" y="344" text-anchor="middle" font-size="14" fill="#1b2a3a">count  y</text>
  <text x="30" y="180" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 30 180)">probability</text>

