<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 14 672 316" width="672" height="316" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL ================= -->
  <!-- legend: e$values -->
  <text x="40" y="34" font-size="16" fill="#1b2a3a">e$values = [ <tspan fill="#2a6f97" font-weight="bold">3</tspan>, <tspan fill="#bc4749" font-weight="bold">1</tspan> ]</text>

  <!-- bracket label -->
  <text x="40" y="72" font-size="16" fill="#1b2a3a" font-weight="bold">e$vectors</text>

  <!-- matrix brackets -->
  <path d="M108 84 L98 84 L98 190 L108 190" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M296 84 L306 84 L306 190 L296 190" fill="none" stroke="#1b2a3a" stroke-width="2"/>

  <!-- column 1 highlight box (blue) -->
  <rect x="116" y="90" width="82" height="94" rx="5" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <!-- column 2 highlight box (orange) -->
  <rect x="206" y="90" width="82" height="94" rx="5" fill="#fbecec" stroke="#bc4749" stroke-width="2"/>

  <!-- matrix entries -->
  <text x="157" y="122" font-size="17" fill="#1b2a3a" text-anchor="middle">0.7071</text>
  <text x="247" y="122" font-size="17" fill="#1b2a3a" text-anchor="middle">-0.7071</text>
  <text x="157" y="166" font-size="17" fill="#1b2a3a" text-anchor="middle">0.7071</text>
  <text x="247" y="166" font-size="17" fill="#1b2a3a" text-anchor="middle">0.7071</text>

  <!-- NOT a row grey struck box across top row -->
  <rect x="116" y="100" width="172" height="22" rx="4" fill="#c9d3dd" fill-opacity="0.35" stroke="#9aa7b3" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="118" y1="111" x2="286" y2="111" stroke="#9aa7b3" stroke-width="1.6"/>
  <text x="322" y="115" font-size="13" fill="#7c8894" font-style="italic">NOT a row</text>

  <!-- column labels -->
  <text x="157" y="212" font-size="12.5" fill="#2a6f97" text-anchor="middle" font-weight="bold">column 1</text>
  <text x="157" y="228" font-size="12" fill="#2a6f97" text-anchor="middle">eigenvector, λ = 3</text>
  <text x="247" y="248" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">column 2</text>
  <text x="247" y="264" font-size="12" fill="#bc4749" text-anchor="middle">eigenvector, λ = 1</text>

  <!-- connectors from column boxes to labels -->
  <line x1="157" y1="184" x2="157" y2="200" stroke="#2a6f97" stroke-width="1.4"/>
  <line x1="247" y1="184" x2="247" y2="236" stroke="#bc4749" stroke-width="1.4"/>

  <!-- ================= RIGHT PANEL ================= -->
  <!-- panel geometry: origin at (540,150), scale 90 px per unit -->
  <!-- unit circle -->
  <circle cx="540" cy="150" r="90" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="440" y1="150" x2="640" y2="150" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="250" x2="540" y2="50" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="646" y="154" font-size="13" fill="#1b2a3a">x</text>
  <text x="546" y="52" font-size="13" fill="#1b2a3a">y</text>

  <!-- blue eigenvector to (0.707,0.707): screen (540+63.6, 150-63.6) -->
  <line x1="540" y1="150" x2="603.6" y2="86.4" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <circle cx="603.6" cy="86.4" r="2.6" fill="#2a6f97"/>
  <text x="610" y="80" font-size="13" fill="#2a6f97" font-weight="bold">λ=3</text>
  <text x="610" y="96" font-size="10.5" fill="#2a6f97">(0.707, 0.707)</text>

  <!-- orange eigenvector to (-0.707,0.707): screen (540-63.6, 150-63.6) -->
  <line x1="540" y1="150" x2="476.4" y2="86.4" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arrowOrange)"/>
  <circle cx="476.4" cy="86.4" r="2.6" fill="#bc4749"/>
  <text x="470" y="80" font-size="13" fill="#bc4749" font-weight="bold" text-anchor="end">λ=1</text>
  <text x="470" y="96" font-size="10.5" fill="#bc4749" text-anchor="end">(-0.707, 0.707)</text>

  <!-- ================= CAPTION ================= -->
  <text x="364" y="296" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">e$vectors[, k]  pairs with  e$values[k]</text>
  <text x="364" y="318" font-size="12.5" fill="#7c8894" text-anchor="middle" font-style="italic">(0.707, 0.707) is (1, 1) scaled to unit length &#8730;2</text>
</svg>
