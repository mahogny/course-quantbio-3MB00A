<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32.8 22 693.2 302" width="693.2" height="302" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b52ab"/>
    </marker>
  </defs>

  <!-- Plot geometry: origin at (200,180), unit = 130 px -->
  <!-- Unit circle -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="50" y1="180" x2="350" y2="180" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="200" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="356" y="184" font-size="14" fill="#1b2a3a">x</text>
  <text x="206" y="40" font-size="14" fill="#1b2a3a">y</text>

  <!-- Eigen-direction line: collinear with the arrows, through the origin, -->
  <!-- direction (-0.7071,-0.7071) up-left and (0.7071,0.7071) down-right; length 150 px each way -->
  <line x1="93.93" y1="73.93" x2="306.07" y2="286.07" stroke="#9aa7b4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- label the whole line in the free top-left corner, just above where the line ends -->
  <text x="18" y="48" font-size="13" fill="#6b7887">the eigen-direction</text>
  <text x="18" y="66" font-size="13" fill="#6b7887">(a whole line)</text>

  <!-- Arrow A: origin to (-0.707, 0.707) upper-left, tip on the unit circle at (108.1, 88.1) -->
  <line x1="200" y1="180" x2="108.1" y2="88.1" stroke="#6a994e" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="100" y="94" font-size="14" fill="#6a994e" text-anchor="end" font-weight="bold">v = (-0.707, 0.707)</text>

  <!-- Arrow B: origin to (0.707, -0.707) lower-right, tip on the unit circle at (291.9, 271.9) -->
  <line x1="200" y1="180" x2="291.9" y2="271.9" stroke="#7b52ab" stroke-width="2.5" marker-end="url(#arrowP)"/>
  <text x="313" y="291" font-size="14" fill="#7b52ab" font-weight="bold">−v = (0.707, −0.707)</text>

  <!-- Origin dot -->
  <circle cx="200" cy="180" r="3" fill="#1b2a3a"/>

  <!-- Caption box -->
  <rect x="380" y="120" width="260" height="152" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="396" y="150" font-size="14" fill="#1b2a3a">Both are unit length, both</text>
  <text x="396" y="171" font-size="14" fill="#1b2a3a">satisfy A v = λ v  (λ = 1).</text>
  <text x="396" y="199" font-size="14" fill="#bc4749">Sign is arbitrary;</text>
  <text x="396" y="220" font-size="14" fill="#bc4749">R may return either.</text>
  <text x="396" y="248" font-size="14" fill="#1b2a3a" font-weight="bold"><tspan x="396" dy="0">Compare directions,</tspan><tspan x="396" dy="20">not raw numbers.</tspan></text>
</svg>
