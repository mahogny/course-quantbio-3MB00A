<svg xmlns="http://www.w3.org/2000/svg" viewBox="101.6 10.9 450.7 414.9" width="450.7" height="414.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#bc4749"/>
    </marker>
    <marker id="ahGrey" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a97a4"/>
    </marker>
    <marker id="ahAxis" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- faint integer gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="280" y1="65" x2="280" y2="395"/>
    <line x1="390" y1="65" x2="390" y2="395"/>
    <line x1="115" y1="230" x2="455" y2="230"/>
    <line x1="115" y1="120" x2="455" y2="120"/>
  </g>

  <!-- 45-degree eigen guide line through origin -->
  <line x1="115" y1="395" x2="445" y2="65" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.55"/>
  <text x="450" y="72" font-size="13" fill="#1b2a3a" opacity="0.7">eigen-axis (45°)</text>

  <!-- axes -->
  <line x1="115" y1="340" x2="455" y2="340" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#ahAxis)"/>
  <line x1="170" y1="395" x2="170" y2="58" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#ahAxis)"/>
  <text x="452" y="358" font-size="14" fill="#1b2a3a">x</text>
  <text x="178" y="66" font-size="14" fill="#1b2a3a">y</text>
  <circle cx="170" cy="340" r="2.5" fill="#1b2a3a"/>

  <!-- non-eigenvector w = (1,0) grey solid -->
  <line x1="170" y1="340" x2="277" y2="340" stroke="#8a97a4" stroke-width="2" marker-end="url(#ahGrey)"/>
  <text x="248" y="333" font-size="13" fill="#6b7885">w=(1,0)</text>

  <!-- image A w = (2,1) grey dashed, different direction -->
  <line x1="170" y1="340" x2="388" y2="231" stroke="#8a97a4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahGrey)"/>
  <text x="396" y="238" font-size="13" fill="#6b7885">A w = (2,1)</text>
  <text x="300" y="300" font-size="13.5" fill="#6b7885" font-style="italic">a non-eigenvector</text>
  <text x="300" y="316" font-size="13.5" fill="#6b7885" font-style="italic">gets rotated</text>

  <!-- eigenvector v (unit) red solid, on the diagonal -->
  <line x1="170" y1="340" x2="247" y2="263" stroke="#bc4749" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <text x="196" y="278" font-size="14" fill="#bc4749" font-weight="bold">v (unit)</text>

  <!-- image A v = 3v red solid, same direction, longer -->
  <line x1="170" y1="340" x2="401" y2="109" stroke="#bc4749" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <text x="360" y="126" font-size="14" fill="#bc4749" font-weight="bold">A v = 3v = (2.121, 2.121)</text>

  <!-- matrix note -->
  <text x="118" y="34" font-size="14" fill="#1b2a3a">A = [[2,1],[1,2]],  λ = 3,  v = (0.707, 0.707)</text>

  <!-- caption -->
  <text x="330" y="410" font-size="14.5" fill="#1b2a3a" text-anchor="middle">Eigenvectors keep their direction; A just scales them by λ.</text>
</svg>
