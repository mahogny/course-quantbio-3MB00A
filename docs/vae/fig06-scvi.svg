<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <g font-size="19" fill="#1b2a3a" text-anchor="middle">
    <rect x="10" y="70" width="150" height="80" rx="10" fill="#f4f4f4" stroke="#1b2a3a" stroke-width="2"/>
    <text x="85" y="105" font-weight="bold">counts</text>
    <text x="85" y="130">of one cell</text>

    <rect x="200" y="70" width="150" height="80" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="275" y="117" font-weight="bold">encoder</text>

    <rect x="380" y="70" width="170" height="80" rx="10" fill="#fff4e6" stroke="#c4621a" stroke-width="2.5"/>
    <text x="465" y="105" font-weight="bold">z (10–30 numbers)</text>
    <text x="465" y="130" font-size="17">the cell's state</text>

    <rect x="580" y="70" width="150" height="80" rx="10" fill="#eef4ea" stroke="#6a994e" stroke-width="2"/>
    <text x="655" y="117" font-weight="bold">decoder</text>

    <rect x="770" y="70" width="180" height="80" rx="10" fill="#f4f4f4" stroke="#1b2a3a" stroke-width="2"/>
    <text x="860" y="105" font-weight="bold">NB per gene</text>
    <text x="860" y="130" font-size="17">mean + dispersion</text>

    <rect x="580" y="200" width="150" height="56" rx="10" fill="#f8eaea" stroke="#bc4749" stroke-width="2"/>
    <text x="655" y="234" font-weight="bold">batch label</text>

    <text x="465" y="200" fill="#c4621a">→ clustering, UMAP</text>
    <text x="465" y="226" fill="#c4621a">(batch mostly removed)</text>
    <text x="855" y="190">→ denoised expression;</text>
    <text x="855" y="216">"this cell as if it</text>
    <text x="855" y="242">were in batch A"</text>
    <text x="480" y="36" font-size="18" fill="#555">the decoder is told the batch, so z does not need to describe it</text>
  </g>
  <line x1="161" y1="110" x2="196" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="351" y1="110" x2="376" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="551" y1="110" x2="576" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="731" y1="110" x2="766" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="655" y1="199" x2="655" y2="154" stroke="#bc4749" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
