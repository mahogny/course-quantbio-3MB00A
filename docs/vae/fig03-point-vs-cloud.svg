<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Helvetica, Arial, sans-serif">
  <g font-size="19" fill="#1b2a3a" text-anchor="middle">
    <rect x="40" y="40" width="380" height="260" rx="10" fill="#fafafa" stroke="#cccccc" stroke-width="1.5"/>
    <text x="230" y="28" font-weight="bold">plain autoencoder: one point per cell</text>
    <circle cx="131" cy="102" r="6" fill="#2a6f97"/><circle cx="143" cy="86" r="6" fill="#2a6f97"/><circle cx="124" cy="79" r="6" fill="#2a6f97"/><circle cx="150" cy="109" r="6" fill="#2a6f97"/><circle cx="314" cy="83" r="6" fill="#bc4749"/><circle cx="329" cy="98" r="6" fill="#bc4749"/><circle cx="321" cy="67" r="6" fill="#bc4749"/><circle cx="306" cy="94" r="6" fill="#bc4749"/><circle cx="238" cy="269" r="6" fill="#6a994e"/><circle cx="253" cy="254" r="6" fill="#6a994e"/><circle cx="222" cy="257" r="6" fill="#6a994e"/><circle cx="245" cy="280" r="6" fill="#6a994e"/><text x="230" y="146" font-size="40" font-weight="bold" fill="#bc4749" text-anchor="middle">?</text>
    <text x="230" y="330">gaps between the groups;</text><text x="230" y="356">no notion of uncertainty</text>

