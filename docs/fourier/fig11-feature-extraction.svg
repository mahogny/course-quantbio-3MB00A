<svg xmlns="http://www.w3.org/2000/svg" width="646.2" height="375.6" viewBox="40.5 -5.1 646.2 375.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2f8fd"/>
      <stop offset="0.45" stop-color="#8fc7e8"/>
      <stop offset="1" stop-color="#1b2a3a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cA"><rect x="60"  y="64" width="78" height="78"/></clipPath>
    <clipPath id="cAs"><rect x="158" y="64" width="78" height="78"/></clipPath>
    <clipPath id="cB"><rect x="276" y="64" width="78" height="78"/></clipPath>
    <clipPath id="cBs"><rect x="374" y="64" width="78" height="78"/></clipPath>
    <clipPath id="cC"><rect x="492" y="64" width="78" height="78"/></clipPath>
    <clipPath id="cCs"><rect x="590" y="64" width="78" height="78"/></clipPath>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">From spectrum to interpretable texture features</text>

  <!-- ===================== PAIR A: periodic ===================== -->
  <text x="148" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">Periodic structure</text>
  <!-- image: regularly spaced striations -->
  <rect x="60" y="64" width="78" height="78" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <g clip-path="url(#cA)" stroke="#1b2a3a" stroke-width="4">
    <line x1="68"  y1="64" x2="68"  y2="142"/>
    <line x1="82"  y1="64" x2="82"  y2="142"/>
    <line x1="96"  y1="64" x2="96"  y2="142"/>
    <line x1="110" y1="64" x2="110" y2="142"/>
    <line x1="124" y1="64" x2="124" y2="142"/>
    <line x1="138" y1="64" x2="138" y2="142"/>
  </g>
  <text x="99" y="156" text-anchor="middle" font-size="10" fill="#5a6b7a">sarcomere bands</text>
  <!-- FFT arrow -->
  <line x1="139" y1="103" x2="157" y2="103" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="148" y="98" text-anchor="middle" font-size="9" fill="#5a6b7a">FFT</text>
  <!-- spectrum: symmetric peaks off-center -->
  <rect x="158" y="64" width="78" height="78" rx="4" fill="#1b2a3a"/>
  <g clip-path="url(#cAs)">
    <circle cx="175" cy="103" r="12" fill="url(#glow)"/>
    <circle cx="219" cy="103" r="12" fill="url(#glow)"/>
    <circle cx="175" cy="103" r="3"  fill="#f2f8fd"/>
    <circle cx="219" cy="103" r="3"  fill="#f2f8fd"/>
    <circle cx="197" cy="103" r="2.5" fill="#8fc7e8"/>
  </g>
  <text x="148" y="180" text-anchor="middle" font-size="11.5" fill="#2a6f97">peak location</text>
  <text x="148" y="194" text-anchor="middle" font-size="11.5" fill="#2a6f97">= spacing λ</text>

  <!-- ===================== PAIR B: oriented ===================== -->
  <text x="364" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a994e">Oriented texture</text>
  <!-- image: aligned diagonal fibres -->
  <rect x="276" y="64" width="78" height="78" rx="4" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.5"/>
  <g clip-path="url(#cB)" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round">
    <line x1="270" y1="150" x2="330" y2="58"/>
    <line x1="286" y1="150" x2="346" y2="58"/>
    <line x1="302" y1="150" x2="362" y2="58"/>
    <line x1="318" y1="150" x2="378" y2="58"/>
    <line x1="258" y1="150" x2="318" y2="58"/>
  </g>
  <text x="315" y="156" text-anchor="middle" font-size="10" fill="#5a6b7a">aligned fibres</text>
  <line x1="355" y1="103" x2="373" y2="103" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="98" text-anchor="middle" font-size="9" fill="#5a6b7a">FFT</text>
  <!-- spectrum: elongated streak perpendicular to fibres -->
  <rect x="374" y="64" width="78" height="78" rx="4" fill="#1b2a3a"/>
  <g clip-path="url(#cBs)">
    <!-- fibres run at 57deg; energy streak is perpendicular -->
    <ellipse cx="413" cy="103" rx="7" ry="30" fill="url(#glow)" transform="rotate(37 413 103)"/>
    <line x1="393" y1="88" x2="433" y2="118" stroke="#f2f8fd" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="413" cy="103" r="2.5" fill="#8fc7e8"/>
  </g>
  <text x="364" y="180" text-anchor="middle" font-size="11.5" fill="#6a994e">energy direction</text>
  <text x="364" y="194" text-anchor="middle" font-size="11.5" fill="#6a994e">= orientation θ</text>

  <!-- ===================== PAIR C: isotropic ===================== -->
  <text x="580" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">Isotropic tissue</text>
  <!-- image: random speckle -->
  <rect x="492" y="64" width="78" height="78" rx="4" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.5"/>
  <g clip-path="url(#cC)" fill="#1b2a3a">
    <circle cx="502" cy="76" r="2.4"/><circle cx="521" cy="72" r="1.8"/><circle cx="540" cy="80" r="2.6"/>
    <circle cx="558" cy="74" r="1.9"/><circle cx="510" cy="90" r="2.1"/><circle cx="531" cy="94" r="2.7"/>
    <circle cx="551" cy="90" r="1.7"/><circle cx="565" cy="96" r="2.3"/><circle cx="499" cy="104" r="2.5"/>
    <circle cx="518" cy="108" r="1.9"/><circle cx="538" cy="106" r="2.2"/><circle cx="556" cy="110" r="2.6"/>
    <circle cx="507" cy="122" r="2.3"/><circle cx="527" cy="126" r="1.8"/><circle cx="546" cy="122" r="2.5"/>
    <circle cx="562" cy="128" r="2.0"/><circle cx="515" cy="136" r="2.2"/><circle cx="535" cy="134" r="1.7"/>
    <circle cx="504" cy="134" r="1.9"/><circle cx="553" cy="136" r="2.3"/>
  </g>
  <text x="531" y="156" text-anchor="middle" font-size="10" fill="#5a6b7a">random speckle</text>
  <line x1="571" y1="103" x2="589" y2="103" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="98" text-anchor="middle" font-size="9" fill="#5a6b7a">FFT</text>
  <!-- spectrum: circular symmetric blob -->
  <rect x="590" y="64" width="78" height="78" rx="4" fill="#1b2a3a"/>
  <g clip-path="url(#cCs)">
    <circle cx="629" cy="103" r="26" fill="url(#glow)"/>
    <circle cx="629" cy="103" r="4" fill="#f2f8fd"/>
    <circle cx="629" cy="103" r="24" fill="none" stroke="#8fc7e8" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  </g>
  <text x="580" y="180" text-anchor="middle" font-size="11.5" fill="#bc4749">energy spread</text>
  <text x="580" y="194" text-anchor="middle" font-size="11.5" fill="#bc4749">= coarse vs fine</text>

  <!-- ===================== converge to feature vector ===================== -->
  <path d="M148,200 C148,222 360,222 360,238" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <path d="M580,200 C580,222 360,222 360,238" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="360" y1="200" x2="360" y2="240" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feature vector box -->
  <text x="360" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2a3a">feature vector</text>
  <g>
    <rect x="120" y="266" width="480" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <line x1="240" y1="266" x2="240" y2="306" stroke="#2a6f97" stroke-width="1.5"/>
    <line x1="360" y1="266" x2="360" y2="306" stroke="#2a6f97" stroke-width="1.5"/>
    <line x1="480" y1="266" x2="480" y2="306" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="180" y="291" text-anchor="middle" font-size="12" fill="#2a6f97">dominant freq</text>
    <text x="300" y="291" text-anchor="middle" font-size="12" fill="#6a994e">orientation</text>
    <text x="420" y="291" text-anchor="middle" font-size="12" fill="#bc4749">bandwidth</text>
    <text x="540" y="291" text-anchor="middle" font-size="16" fill="#5a6b7a">· · ·</text>
  </g>

  <!-- caption -->
  <text x="360" y="332" text-anchor="middle" font-size="12.5" fill="#1b2a3a">a compact, comparable feature vector →</text>
  <text x="360" y="350" text-anchor="middle" font-size="12.5" fill="#5a6b7a">feed into regression / clustering / classification</text>
</svg>
