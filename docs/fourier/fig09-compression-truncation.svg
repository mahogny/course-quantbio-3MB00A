<svg xmlns="http://www.w3.org/2000/svg" width="821.6" height="391.9" viewBox="5.3 -4.2 821.6 391.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== STEP 1: original image icon ===== -->
  <g transform="translate(30,60)">
    <text x="55" y="-16" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">original</text>
    <rect x="0" y="0" width="110" height="88" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
    <!-- sun -->
    <circle cx="82" cy="24" r="11" fill="#bc4749"/>
    <!-- mountains -->
    <path d="M0,88 L34,44 L58,68 L82,40 L110,88 Z" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.2"/>
  </g>

  <!-- transform arrow -->
  <g transform="translate(148,104)">
    <line x1="0" y1="0" x2="66" y2="0" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="34" y="-10" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">transform</text>
    <text x="34" y="18" text-anchor="middle" font-size="11" fill="#1b2a3a">DCT / FFT</text>
  </g>

  <!-- ===== STEP 2: frequency coefficients bar chart ===== -->
  <g transform="translate(232,44)">
    <text x="180" y="-14" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">frequency coefficients</text>
    <!-- baseline axis -->
    <line x1="0" y1="120" x2="360" y2="120" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="0" y2="8" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="182" y="150" text-anchor="middle" font-size="11" fill="#1b2a3a">low freq  →  high freq</text>

    <!-- KEEP bars: tall, low frequency (4 bars) -->
    <rect x="10"  y="18"  width="22" height="102" fill="#2a6f97"/>
    <rect x="40"  y="34"  width="22" height="86"  fill="#2a6f97"/>
    <rect x="70"  y="58"  width="22" height="62"  fill="#2a6f97"/>
    <rect x="100" y="80"  width="22" height="40"  fill="#2a6f97"/>

    <!-- DISCARD bars: tiny, high frequency (faded / near zero) -->
    <rect x="130" y="110" width="22" height="10" fill="#c9d3dd"/>
    <rect x="160" y="114" width="22" height="6"  fill="#c9d3dd"/>
    <rect x="190" y="112" width="22" height="8"  fill="#c9d3dd"/>
    <rect x="220" y="116" width="22" height="4"  fill="#c9d3dd"/>
    <rect x="250" y="113" width="22" height="7"  fill="#c9d3dd"/>
    <rect x="280" y="117" width="22" height="3"  fill="#c9d3dd"/>
    <rect x="310" y="115" width="22" height="5"  fill="#c9d3dd"/>
    <rect x="340" y="118" width="18" height="2"  fill="#c9d3dd"/>

    <!-- KEEP bracket -->
    <path d="M8,10 L8,2 L124,2 L124,10" fill="none" stroke="#6a994e" stroke-width="1.8"/>
    <text x="66" y="-2" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a994e">KEEP</text>
    <text x="66" y="163" text-anchor="middle" font-size="10.5" fill="#6a994e">few big, low-freq</text>

    <!-- DISCARD bracket -->
    <path d="M128,98 L128,90 L360,90 L360,98" fill="none" stroke="#bc4749" stroke-width="1.8"/>
    <text x="244" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4749">DISCARD (many tiny, high-freq)</text>
  </g>

  <!-- inverse transform arrow -->
  <g transform="translate(604,104)">
    <line x1="0" y1="0" x2="66" y2="0" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="34" y="-10" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">inverse</text>
    <text x="34" y="18" text-anchor="middle" font-size="11" fill="#1b2a3a">transform</text>
  </g>

  <!-- ===== STEP 3: reconstructed image icon (softened) ===== -->
  <g transform="translate(688,60)">
    <text x="55" y="-16" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">reconstructed</text>
    <rect x="0" y="0" width="110" height="88" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
    <!-- softened sun -->
    <circle cx="82" cy="24" r="11" fill="#bc4749" opacity="0.72"/>
    <!-- softened mountains (rounded, lower contrast) -->
    <path d="M0,88 Q17,66 34,48 Q46,58 58,66 Q70,52 82,44 Q96,66 110,88 Z" fill="#6a994e" opacity="0.82" stroke="#1b2a3a" stroke-width="0.8"/>
  </g>

  <!-- caption under step 3 -->
  <text x="743" y="176" text-anchor="middle" font-size="11" fill="#1b2a3a">stores far fewer numbers,</text>
  <text x="743" y="190" text-anchor="middle" font-size="11" fill="#1b2a3a">looks nearly the same</text>

  <!-- ===== warning callout ===== -->
  <g transform="translate(232,236)">
    <rect x="0" y="0" width="416" height="52" rx="6" fill="#fbeaea" stroke="#bc4749" stroke-width="1.5"/>
    <text x="16" y="24" font-size="14" font-weight="bold" fill="#bc4749">⚠ push too far → blocky artefacts</text>
    <text x="16" y="42" font-size="12" fill="#1b2a3a">JPEG applies the DCT on 8×8 blocks, so over-compression shows the grid</text>
  </g>

  <!-- ===== bottom PCA link note ===== -->
  <g transform="translate(232,318)">
    <line x1="0" y1="0" x2="416" y2="0" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="208" y="24" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">Link to PCA</text>
    <text x="208" y="44" text-anchor="middle" font-size="12" fill="#1b2a3a">same idea as truncating a PCA to its top components</text>
  </g>
</svg>
