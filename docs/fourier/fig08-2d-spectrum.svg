<svg xmlns="http://www.w3.org/2000/svg" viewBox="15.0 29.2 878 397.5" font-family="Helvetica, Arial, sans-serif" width="878" height="397.5">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/>
    </marker>
    <clipPath id="imgClip"><rect x="40" y="80" width="230" height="230"/></clipPath>
    <clipPath id="specClip"><rect x="470" y="80" width="230" height="230"/></clipPath>

    <radialGradient id="broad" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbf3d0"/>
      <stop offset="45%" stop-color="#f2e2a8"/>
      <stop offset="100%" stop-color="#dfe8ef"/>
    </radialGradient>
    <radialGradient id="dc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#cfe6ff"/>
      <stop offset="45%" stop-color="#2a6f97"/>
      <stop offset="100%" stop-color="#0d1622" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#bc4749" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== LEFT: image panel ===== -->
  <text x="155" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">image</text>
  <g clip-path="url(#imgClip)">
    <rect x="40" y="80" width="230" height="230" fill="url(#broad)"/>
    <!-- fine texture -->
    <g fill="#b9a86a" opacity="0.5">
      <circle cx="90" cy="120" r="2"/><circle cx="130" cy="150" r="1.6"/>
      <circle cx="180" cy="110" r="2.2"/><circle cx="215" cy="160" r="1.8"/>
      <circle cx="110" cy="210" r="2"/><circle cx="160" cy="240" r="1.6"/>
      <circle cx="200" cy="255" r="2.1"/><circle cx="75" cy="260" r="1.7"/>
      <circle cx="240" cy="215" r="1.9"/><circle cx="145" cy="185" r="1.5"/>
    </g>
    <!-- faint evenly-spaced horizontal stripe artefact -->
    <g stroke="#7d8894" stroke-width="2" opacity="0.35">
      <line x1="40" y1="96" x2="270" y2="96"/>
      <line x1="40" y1="116" x2="270" y2="116"/>
      <line x1="40" y1="136" x2="270" y2="136"/>
      <line x1="40" y1="156" x2="270" y2="156"/>
      <line x1="40" y1="176" x2="270" y2="176"/>
      <line x1="40" y1="196" x2="270" y2="196"/>
      <line x1="40" y1="216" x2="270" y2="216"/>
      <line x1="40" y1="236" x2="270" y2="236"/>
      <line x1="40" y1="256" x2="270" y2="256"/>
      <line x1="40" y1="276" x2="270" y2="276"/>
      <line x1="40" y1="296" x2="270" y2="296"/>
    </g>
  </g>
  <rect x="40" y="80" width="230" height="230" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="155" y="330" text-anchor="middle" font-size="12" fill="#6a994e">soft bright region + faint horizontal stripes</text>

  <!-- ===== middle transform arrow ===== -->
  <line x1="285" y1="195" x2="460" y2="195" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="186" text-anchor="middle" font-size="14" fill="#1b2a3a">2D Fourier transform</text>

  <!-- ===== RIGHT: spectrum panel (dark) ===== -->
  <text x="585" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">2D Fourier magnitude spectrum</text>
  <g clip-path="url(#specClip)">
    <rect x="470" y="80" width="230" height="230" fill="#0d1622"/>
    <!-- faint concentric rings: radial frequency increasing outward -->
    <g fill="none" stroke="#c9d3dd" stroke-width="1" opacity="0.22">
      <circle cx="585" cy="195" r="30"/>
      <circle cx="585" cy="195" r="58"/>
      <circle cx="585" cy="195" r="86"/>
      <circle cx="585" cy="195" r="114"/>
    </g>
    <!-- DC / low-frequency bright core -->
    <circle cx="585" cy="195" r="70" fill="url(#dc)"/>
    <!-- symmetric pair of isolated bright dots (mirrored through centre) -->
    <circle cx="585" cy="140" r="14" fill="url(#dot)"/>
    <circle cx="585" cy="140" r="4.5" fill="#ffffff"/>
    <circle cx="585" cy="250" r="14" fill="url(#dot)"/>
    <circle cx="585" cy="250" r="4.5" fill="#ffffff"/>
  </g>
  <rect x="470" y="80" width="230" height="230" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- DC label -->
  <line x1="512" y1="360" x2="575" y2="205" stroke="#2a6f97" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="378" font-size="12.5" fill="#2a6f97">DC / low frequencies = broad structure</text>

  <!-- high frequency corner labels -->
  <text x="694" y="98" text-anchor="end" font-size="10.5" fill="#c9d3dd" opacity="0.85">high freq</text>
  <text x="694" y="304" text-anchor="end" font-size="10.5" fill="#c9d3dd" opacity="0.85">high freq</text>
  <text x="585" y="400" text-anchor="middle" font-size="11.5" fill="#6a994e">outer edges / corners = fine detail &amp; noise</text>

  <!-- stripe-artefact callout -->
  <line x1="710" y1="138" x2="601" y2="140" stroke="#bc4749" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="712" y="128" font-size="12" fill="#bc4749" font-weight="bold">periodic stripe artefact</text>
  <text x="712" y="145" font-size="11" fill="#bc4749">= isolated bright dots</text>
  <text x="712" y="160" font-size="11" fill="#bc4749">at one frequency</text>
  <text x="712" y="177" font-size="11" fill="#bc4749">→ easy to delete</text>
</svg>
