<svg xmlns="http://www.w3.org/2000/svg" width="819.8" height="388.6" viewBox="-3.3 -2.7 819.8 388.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== PANEL 1: just the lowest ===== -->
  <g transform="translate(30,50)">
    <text x="115" y="-18" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">just the lowest</text>
    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="230" y2="90" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="228" y="108" font-size="12" fill="#1b2a3a">t</text>
    <!-- dashed square target: one period -->
    <path d="M0,25 L115,25 L115,155 L230,155" fill="none" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="5,4"/>
    <path d="M0,90 L0,25 M115,25 L115,155" fill="none" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="5,4"/>
    <!-- partial sum: single sine -->
    <path d="M0,90 C29,40 86,40 115,90 C144,140 201,140 230,90" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  </g>

  <!-- ===== PANEL 2: low + a few middle ===== -->
  <g transform="translate(295,50)">
    <text x="115" y="-18" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">low + a few middle</text>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="230" y2="90" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="228" y="108" font-size="12" fill="#1b2a3a">t</text>
    <path d="M0,25 L115,25 L115,155 L230,155" fill="none" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="5,4"/>
    <path d="M0,90 L0,25 M115,25 L115,155" fill="none" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="5,4"/>
    <!-- partial sum: flatter top/bottom, steeper sides, gentle ripples -->
    <path d="M0,90 C14,52 30,38 45,40 C58,42 62,52 70,50 C80,48 90,40 115,90 C140,140 150,132 160,130 C168,128 172,138 185,140 C200,142 216,128 230,90"
          fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  </g>

  <!-- ===== PANEL 3: low + middle + high ===== -->
  <g transform="translate(560,50)">
    <text x="115" y="-18" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">low + middle + high</text>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="230" y2="90" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="228" y="108" font-size="12" fill="#1b2a3a">t</text>
    <path d="M0,25 L115,25 L115,155 L230,155" fill="none" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="5,4"/>
    <path d="M0,90 L0,25 M115,25 L115,155" fill="none" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="5,4"/>
    <!-- partial sum: hugs square, steep edges, Gibbs overshoot near transitions -->
    <path d="M0,90 C4,45 6,18 12,14 C16,17 18,30 24,28 C30,26 30,24 38,25 C60,25 90,25 108,26
             C112,27 113,60 115,90
             C117,120 118,153 122,155 C144,155 174,155 192,154 C198,152 200,150 206,152 C212,154 214,163 218,166 C224,162 226,135 230,90"
          fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  </g>

  <!-- ===== bottom labels with arrows ===== -->
  <!-- label 1: low frequencies broad shape -> panel 1 curve -->
  <text x="120" y="360" text-anchor="middle" font-size="14" fill="#6a994e" font-weight="bold">low frequencies = broad shape</text>
  <path d="M120,344 C120,300 130,270 145,215" fill="none" stroke="#6a994e" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- label 2: high frequencies fine detail -> panel 3 edges -->
  <text x="640" y="360" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">high frequencies = fine detail / sharp edges</text>
  <path d="M660,344 C670,300 675,270 678,240" fill="none" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
