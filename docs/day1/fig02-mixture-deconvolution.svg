<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ LEFT: biopsy sample blob ============ -->
  <rect x="20" y="70" width="240" height="220" rx="60" ry="60" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="140" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Biopsy sample</text>

  <!-- Tumour cells (blue) x3 -->
  <circle cx="80"  cy="130" r="20" fill="#cfe2f0" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="150" cy="115" r="20" fill="#cfe2f0" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="200" cy="175" r="20" fill="#cfe2f0" stroke="#2a6f97" stroke-width="2"/>
  <!-- Immune cells (orange) x2 -->
  <circle cx="105" cy="205" r="20" fill="#fbe3cf" stroke="#e08a2e" stroke-width="2"/>
  <circle cx="175" cy="240" r="20" fill="#fbe3cf" stroke="#e08a2e" stroke-width="2"/>

  <!-- cell labels -->
  <text x="80"  y="135" text-anchor="middle" font-size="11" fill="#2a6f97" font-weight="bold">Tum</text>
  <text x="150" y="120" text-anchor="middle" font-size="11" fill="#2a6f97" font-weight="bold">Tum</text>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#2a6f97" font-weight="bold">Tum</text>
  <text x="105" y="210" text-anchor="middle" font-size="11" fill="#e08a2e" font-weight="bold">Imm</text>
  <text x="175" y="245" text-anchor="middle" font-size="11" fill="#e08a2e" font-weight="bold">Imm</text>

  <!-- big ? over the sample -->
  <text x="235" y="115" text-anchor="middle" font-size="52" font-weight="bold" fill="#bc4749" opacity="0.85">?</text>

  <!-- ============ ARROW: sequence the bulk ============ -->
  <line x1="268" y1="180" x2="360" y2="180" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="314" y="168" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">sequence</text>
  <text x="314" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a">the bulk</text>

  <!-- ============ RIGHT: bulk readout bars ============ -->
  <text x="560" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Measured bulk signal</text>

  <!-- G1 bar total = 8 -->
  <rect x="380" y="80" width="320" height="46" rx="8" fill="#f2f6fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="380" y="80" width="256" height="46" rx="8" fill="#dce9f4" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="396" y="109" font-size="16" fill="#1b2a3a" font-weight="bold">Gene G1 total = 8</text>

  <!-- G2 bar total = 9 -->
  <rect x="380" y="140" width="320" height="46" rx="8" fill="#f2f6fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="380" y="140" width="288" height="46" rx="8" fill="#dce9f4" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="396" y="169" font-size="16" fill="#1b2a3a" font-weight="bold">Gene G2 total = 9</text>

  <!-- ============ SIGNATURE LEGEND ============ -->
  <rect x="380" y="210" width="320" height="90" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="396" y="232" font-size="14" font-weight="bold" fill="#1b2a3a">Per-cell-type signature</text>

  <circle cx="404" cy="255" r="9" fill="#cfe2f0" stroke="#2a6f97" stroke-width="2"/>
  <text x="420" y="260" font-size="14" fill="#2a6f97" font-weight="bold">Tumour unit:</text>
  <text x="530" y="260" font-size="14" fill="#1b2a3a">G1 = 2, G2 = 1</text>

  <circle cx="404" cy="282" r="9" fill="#fbe3cf" stroke="#e08a2e" stroke-width="2"/>
  <text x="420" y="287" font-size="14" fill="#e08a2e" font-weight="bold">Immune unit:</text>
  <text x="530" y="287" font-size="14" fill="#1b2a3a">G1 = 1, G2 = 3</text>

  <!-- ============ BOTTOM CAPTION: the unknowns ============ -->
  <rect x="20" y="322" width="740" height="62" rx="10" fill="#fdf0f0" stroke="#bc4749" stroke-width="1.5"/>
  <text x="390" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#bc4749">How many units of each cell type?</text>
  <text x="390" y="371" text-anchor="middle" font-size="15" fill="#1b2a3a">
    <tspan font-weight="bold" fill="#2a6f97">2·x₁ + 1·x₂ = 8</tspan>
    <tspan dx="8" fill="#1b2a3a">and</tspan>
    <tspan dx="8" font-weight="bold" fill="#2a6f97">1·x₁ + 3·x₂ = 9</tspan>
    <tspan dx="12">→ solve for x₁ (tumour), x₂ (immune)</tspan>
  </text>
</svg>
