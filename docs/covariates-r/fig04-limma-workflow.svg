<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 210" width="1150" height="210" font-family="Helvetica, Arial, sans-serif">
<!-- limma workflow: counts -> voom -> lmFit -> eBayes -> topTable, with the design matrix feeding voom and lmFit -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect x="15" y="15" width="190" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="110.0" y="47" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold">counts</text>
<text x="110.0" y="71" font-size="15" fill="#5b6b7a" text-anchor="middle">genes × samples</text>
<rect x="247" y="15" width="190" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="342.0" y="47" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold" font-family="monospace">voom()</text>
<text x="342.0" y="71" font-size="15" fill="#5b6b7a" text-anchor="middle">log2, with weights</text>
<line x1="207" y1="53.0" x2="245" y2="53.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="479" y="15" width="190" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="574.0" y="47" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold" font-family="monospace">lmFit()</text>
<text x="574.0" y="71" font-size="15" fill="#5b6b7a" text-anchor="middle">one model per gene</text>
<line x1="439" y1="53.0" x2="477" y2="53.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="711" y="15" width="190" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="806.0" y="47" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold" font-family="monospace">eBayes()</text>
<text x="806.0" y="71" font-size="15" fill="#5b6b7a" text-anchor="middle">borrows across genes</text>
<line x1="671" y1="53.0" x2="709" y2="53.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="943" y="15" width="190" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="1038.0" y="47" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold" font-family="monospace">topTable()</text>
<text x="1038.0" y="71" font-size="15" fill="#5b6b7a" text-anchor="middle">logFC and p-values</text>
<line x1="903" y1="53.0" x2="941" y2="53.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="257" y="135" width="402" height="62" rx="8" fill="#eef4e8" stroke="#6a994e" stroke-width="2"/>
<text x="458.0" y="160" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold" font-family="monospace">design</text>
<text x="458.0" y="182" font-size="14" fill="#5b6b7a" text-anchor="middle" font-family="monospace">model.matrix(~ batch + sex + treatment)</text>
<line x1="342.0" y1="133" x2="342.0" y2="94" stroke="#6a994e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="574.0" y1="133" x2="574.0" y2="94" stroke="#6a994e" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
