<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11.7 38.2 747.7 372.4" font-family="Helvetica, Arial, sans-serif" width="747.7" height="372.4">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== SOURCE CELL 1: T cell ===== -->
  <circle cx="70" cy="95" r="30" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="70" cy="95" r="12" fill="#2a6f97" opacity="0.55"/>
  <text x="70" y="150" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">T cell</text>

  <!-- T cell bar chart: HIGH CD3D, ~0 MS4A1 -->
  <line x1="128" y1="130" x2="212" y2="130" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="138" y="72"  width="24" height="58" fill="#2a6f97"/>
  <rect x="178" y="126" width="24" height="4"  fill="#2a6f97" opacity="0.5"/>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#1b2a3a">CD3D</text>
  <text x="190" y="145" text-anchor="middle" font-size="11" fill="#1b2a3a">MS4A1</text>

  <!-- ===== SOURCE CELL 2: B cell ===== -->
  <circle cx="70" cy="255" r="30" fill="#fdf0e3" stroke="#d98a34" stroke-width="2"/>
  <circle cx="70" cy="255" r="12" fill="#d98a34" opacity="0.6"/>
  <text x="70" y="310" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">B cell</text>

  <!-- B cell bar chart: HIGH MS4A1, ~0 CD3D -->
  <line x1="128" y1="290" x2="212" y2="290" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="138" y="286" width="24" height="4"  fill="#d98a34" opacity="0.5"/>
  <rect x="178" y="232" width="24" height="58" fill="#d98a34"/>
  <text x="150" y="305" text-anchor="middle" font-size="11" fill="#1b2a3a">CD3D</text>
  <text x="190" y="305" text-anchor="middle" font-size="11" fill="#1b2a3a">MS4A1</text>

  <!-- ===== Arrows into droplet ===== -->
  <path d="M218,110 C 285,122 320,148 360,164" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M218,250 C 285,238 320,206 360,192" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Droplet with barcode ===== -->
  <path d="M382,132 C 358,166 354,186 382,206 C 410,186 406,166 382,132 Z"
        fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="370" y1="176" x2="370" y2="196" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="376" y1="176" x2="376" y2="196" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="382" y1="176" x2="382" y2="196" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="388" y1="176" x2="388" y2="196" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="394" y1="176" x2="394" y2="196" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="382" y="228" text-anchor="middle" font-size="12.5" fill="#1b2a3a" font-weight="bold">one barcode, two cells</text>

  <!-- ===== Arrow droplet to doublet ===== -->
  <path d="M416,168 C 460,168 490,168 524,168" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== DOUBLET cell (half blue / half orange) ===== -->
  <circle cx="560" cy="168" r="34" fill="#2a6f97" opacity="0.35"/>
  <path d="M560,134 A 34 34 0 0 1 560,202 Z" fill="#d98a34" opacity="0.45"/>
  <circle cx="560" cy="168" r="34" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="560" y1="134" x2="560" y2="202" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="560" y="222" text-anchor="middle" font-size="15" fill="#bc4749" font-weight="bold">DOUBLET</text>

  <!-- Doublet bar chart: BOTH high -->
  <line x1="616" y1="205" x2="708" y2="205" stroke="#c9d3dd" stroke-width="1.5"/>
  <rect x="628" y="147" width="26" height="58" fill="#2a6f97"/>
  <rect x="672" y="147" width="26" height="58" fill="#d98a34"/>
  <text x="641" y="220" text-anchor="middle" font-size="11" fill="#1b2a3a">CD3D</text>
  <text x="685" y="220" text-anchor="middle" font-size="11" fill="#1b2a3a">MS4A1</text>
  <text x="662" y="118" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">both high</text>

  <!-- ===== Red warning callout ===== -->
  <rect x="336" y="242" width="376" height="52" rx="6" fill="#fbeaea" stroke="#bc4749" stroke-width="1.8"/>
  <text x="352" y="263" font-size="12.5" fill="#bc4749" font-weight="bold">co-expresses markers that should be mutually exclusive</text>
  <text x="352" y="282" font-size="12.5" fill="#bc4749">→ masquerades as a fake hybrid / transitional cell type</text>

  <!-- ===== Second note ===== -->
  <text x="336" y="318" font-size="12.5" fill="#1b2a3a" font-weight="bold">signature: unusually high total counts &amp; genes</text>

  <!-- ===== Bottom caption ===== -->
  <line x1="14" y1="338" x2="712" y2="338" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="14" y="362" font-size="13" fill="#1b2a3a">detection tools (scDblFinder, DoubletFinder) simulate synthetic doublets by averaging random cell pairs,</text>
  <text x="14" y="382" font-size="13" fill="#1b2a3a">then flag real cells resembling them.  Doublet rate rises with cells loaded.</text>
</svg>
