<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 4 840 310" width="840" height="310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== PANEL 1: Exactly one ===================== -->
  <g transform="translate(20,50)">
    <text x="125" y="-22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Exactly one</text>

    <!-- axes -->
    <line x1="20" y1="230" x2="20" y2="20"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="20" y1="230" x2="240" y2="230" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="245" y="248" font-size="14" fill="#1b2a3a">x</text>
    <text x="2"  y="18"  font-size="14" fill="#1b2a3a">y</text>

    <!-- two lines with different slopes -->
    <line x1="30" y1="60"  x2="230" y2="210" stroke="#2a6f97" stroke-width="2"/>
    <line x1="30" y1="215" x2="230" y2="55"  stroke="#6a994e" stroke-width="2"/>

    <!-- intersection ~ (130,135) -->
    <circle cx="130" cy="135" r="6" fill="#bc4749"/>
    <text x="130" y="90" text-anchor="middle" font-size="13" fill="#bc4749">unique solution</text>
  </g>

  <!-- ===================== PANEL 2: None ===================== -->
  <g transform="translate(300,50)">
    <text x="125" y="-22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">None</text>

    <line x1="20" y1="230" x2="20" y2="20"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="20" y1="230" x2="240" y2="230" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="245" y="248" font-size="14" fill="#1b2a3a">x</text>
    <text x="2"  y="18"  font-size="14" fill="#1b2a3a">y</text>

    <!-- two parallel lines (same slope, shifted) -->
    <line x1="35" y1="200" x2="235" y2="60" stroke="#2a6f97" stroke-width="2"/>
    <line x1="35" y1="245" x2="235" y2="105" stroke="#6a994e" stroke-width="2"/>

    <text x="170" y="208" text-anchor="middle" font-size="13" fill="#bc4749">no common point</text>
  </g>

  <!-- ===================== PANEL 3: Infinitely many ===================== -->
  <g transform="translate(580,50)">
    <text x="125" y="-22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Infinitely many</text>

    <line x1="20" y1="230" x2="20" y2="20"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="20" y1="230" x2="240" y2="230" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="245" y="248" font-size="14" fill="#1b2a3a">x</text>
    <text x="2"  y="18"  font-size="14" fill="#1b2a3a">y</text>

    <!-- highlight glow: coincident lines -->
    <line x1="32" y1="205" x2="232" y2="55" stroke="#eaf1f7" stroke-width="12" stroke-linecap="round"/>
    <!-- two lines with slight offset so both are visible -->
    <line x1="32" y1="207" x2="232" y2="57" stroke="#6a994e" stroke-width="2.5"/>
    <line x1="32" y1="203" x2="232" y2="53" stroke="#2a6f97" stroke-width="2.5" stroke-dasharray="6 5"/>

    <text x="150" y="195" text-anchor="middle" font-size="13" fill="#1b2a3a">every point solves both</text>
  </g>
</svg>
