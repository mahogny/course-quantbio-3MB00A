<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 424" width="676" height="424" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ================= grid ================= -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical grid lines x1 = 1..9 -->
    <line x1="132" y1="342" x2="132" y2="30"/>
    <line x1="194" y1="342" x2="194" y2="30"/>
    <line x1="256" y1="342" x2="256" y2="30"/>
    <line x1="318" y1="342" x2="318" y2="30"/>
    <line x1="380" y1="342" x2="380" y2="30"/>
    <line x1="442" y1="342" x2="442" y2="30"/>
    <line x1="504" y1="342" x2="504" y2="30"/>
    <line x1="566" y1="342" x2="566" y2="30"/>
    <line x1="628" y1="342" x2="628" y2="30"/>
    <!-- horizontal grid lines x2 = 1..9 -->
    <line x1="70" y1="308" x2="660" y2="308"/>
    <line x1="70" y1="274" x2="660" y2="274"/>
    <line x1="70" y1="240" x2="660" y2="240"/>
    <line x1="70" y1="206" x2="660" y2="206"/>
    <line x1="70" y1="172" x2="660" y2="172"/>
    <line x1="70" y1="138" x2="660" y2="138"/>
    <line x1="70" y1="104" x2="660" y2="104"/>
    <line x1="70" y1="70"  x2="660" y2="70"/>
    <line x1="70" y1="36"  x2="660" y2="36"/>
  </g>

  <!-- ================= axes ================= -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="70" y1="342" x2="659" y2="342" marker-end="url(#arrow)"/>
    <line x1="70" y1="342" x2="70" y2="26" marker-end="url(#arrow)"/>
  </g>

  <!-- axis tick labels -->
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="70" y="360">0</text>
    <text x="194" y="360">2</text>
    <text x="318" y="360">4</text>
    <text x="442" y="360">6</text>
    <text x="566" y="360">8</text>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="62" y="278">2</text>
    <text x="62" y="210">4</text>
    <text x="62" y="142">6</text>
    <text x="62" y="74">8</text>
  </g>

  <!-- axis titles -->
  <text x="297" y="392" fill="#1b2a3a" font-size="16" text-anchor="start">x<tspan dy="3" font-size="11">1</tspan><tspan dy="-3"> (tumour units)</tspan></text>
  <text x="-67" y="0" fill="#1b2a3a" font-size="16" text-anchor="start" transform="translate(24,184) rotate(-90)">x<tspan dy="3" font-size="11">2</tspan><tspan dy="-3"> (immune units)</tspan></text>

  <!-- ================= line A: 2x1 + x2 = 8, (0,8)-(4,0) ================= -->
  <line x1="70" y1="70" x2="318" y2="342" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="150" y="150" fill="#2a6f97" font-size="16" font-weight="bold" text-anchor="start">2x<tspan dy="3" font-size="11">1</tspan><tspan dy="-3"> + x</tspan><tspan dy="3" font-size="11">2</tspan><tspan dy="-3"> = 8</tspan></text>

  <!-- ================= line B: x1 + 3x2 = 9, (0,3)-(9,0) ================= -->
  <line x1="70" y1="240" x2="628" y2="342" stroke="#bc4749" stroke-width="2.5"/>
  <text x="470" y="305" fill="#bc4749" font-size="16" font-weight="bold" text-anchor="start">x<tspan dy="3" font-size="11">1</tspan><tspan dy="-3"> + 3x</tspan><tspan dy="3" font-size="11">2</tspan><tspan dy="-3"> = 9</tspan></text>

  <!-- ================= intersection point (3,2) ================= -->
  <circle cx="256" cy="274" r="7" fill="#1b2a3a"/>
  <line x1="263" y1="267" x2="330" y2="222" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="334" y="220" fill="#1b2a3a" font-size="16" font-weight="bold" text-anchor="start">unique solution (3, 2)</text>

  <!-- ================= caption ================= -->
  <text x="350" y="413" fill="#1b2a3a" font-size="14" text-anchor="middle" font-style="italic">Square, non-singular A: the two independent equations pin down one point.</text>
</svg>
