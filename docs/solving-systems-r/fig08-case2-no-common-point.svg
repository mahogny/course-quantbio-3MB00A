<svg xmlns="http://www.w3.org/2000/svg" viewBox="33.8 25.4 648.7 386.5" width="648.7" height="386.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="340" x2="650" y2="340" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="340" x2="70"  y2="55"  stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="345" font-size="16" fill="#1b2a3a" font-style="italic">x<tspan font-size="11" dy="4">1</tspan></text>
  <text x="45"  y="46"  font-size="16" fill="#1b2a3a" font-style="italic">x<tspan font-size="11" dy="4">2</tspan></text>

  <!-- tick labels -->
  <text x="246" y="360" font-size="13" fill="#8894a1">2</text>
  <text x="336" y="360" font-size="13" fill="#8894a1">3</text>
  <text x="606" y="360" font-size="13" fill="#8894a1">6</text>
  <text x="52"  y="210" font-size="13" fill="#8894a1">3</text>
  <text x="52"  y="165" font-size="13" fill="#8894a1">4</text>

  <!-- shaded conflict triangle: (2,3),(2,4),(3,3) -->
  <polygon points="250,205 250,160 340,205" fill="#f6dcdd" stroke="#bc4749" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- three equations as lines -->
  <!-- x1 = 2 (vertical) -->
  <line x1="250" y1="340" x2="250" y2="70" stroke="#2a6f97" stroke-width="2"/>
  <!-- x2 = 3 (horizontal) -->
  <line x1="70" y1="205" x2="620" y2="205" stroke="#6a994e" stroke-width="2"/>
  <!-- x1 + x2 = 6 (diagonal) through (2,4) & (6,0) -->
  <line x1="70" y1="70" x2="610" y2="340" stroke="#1b2a3a" stroke-width="2"/>

  <!-- line equation labels -->
  <text x="258" y="90"  font-size="15" fill="#2a6f97" font-weight="bold">x<tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> = 2</tspan></text>
  <text x="512" y="198" font-size="15" fill="#6a994e" font-weight="bold">x<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> = 3</tspan></text>
  <text x="96"  y="98"  font-size="15" fill="#1b2a3a" font-weight="bold">x<tspan font-size="11" dy="4">1</tspan><tspan dy="-4"> + x</tspan><tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> = 6</tspan></text>

  <!-- pairwise intersection vertices -->
  <circle cx="250" cy="205" r="3.5" fill="#bc4749"/>
  <circle cx="250" cy="160" r="3.5" fill="#bc4749"/>
  <circle cx="340" cy="205" r="3.5" fill="#bc4749"/>

  <!-- red annotation -->
  <text x="438" y="115" font-size="14.5" fill="#bc4749" font-weight="bold">no single point lies on all</text>
  <text x="438" y="137" font-size="14.5" fill="#bc4749" font-weight="bold">three lines — no exact solution</text>
  <path d="M436,128 C398,150 348,175 303,190" stroke="#bc4749" stroke-width="1.5" fill="none" marker-end="url(#arrowR)"/>

  <!-- caption -->
  <text x="70" y="390" font-size="14" fill="#1b2a3a">More equations than unknowns and they conflict (2 + 3 ≠ 6).</text>
</svg>
