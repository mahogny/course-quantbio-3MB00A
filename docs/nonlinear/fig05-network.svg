<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d99ae"/>
    </marker>
  </defs>
  <!-- connections: input -> hidden (every input to every hidden unit = the matrix A) -->
  <g stroke="#2a6f97" stroke-width="2" opacity="0.75" fill="none">
    <line x1="152" y1="130" x2="413" y2="70"/>
    <line x1="152" y1="130" x2="413" y2="170"/>
    <line x1="152" y1="130" x2="413" y2="270"/>
    <line x1="152" y1="230" x2="413" y2="70"/>
    <line x1="152" y1="230" x2="413" y2="170"/>
    <line x1="152" y1="230" x2="413" y2="270"/>
  </g>
  <!-- connections: hidden -> output (the matrix C, here one row) -->
  <g stroke="#6a994e" stroke-width="2" opacity="0.85" fill="none">
    <line x1="487" y1="70" x2="733" y2="170"/>
    <line x1="487" y1="170" x2="733" y2="170"/>
    <line x1="487" y1="270" x2="733" y2="170"/>
  </g>
  <!-- input nodes -->
  <g font-size="24" fill="#1b2a3a" text-anchor="middle">
    <circle cx="120" cy="130" r="32" fill="#f4f4f4" stroke="#1b2a3a" stroke-width="2"/>
    <text x="120" y="138" font-style="italic">x</text>
    <circle cx="120" cy="230" r="32" fill="#f4f4f4" stroke="#1b2a3a" stroke-width="2"/>
    <text x="120" y="238" font-style="italic">y</text>
  </g>
  <!-- hidden nodes, each with a small ReLU glyph -->
  <g fill="#fff4e6" stroke="#c4621a" stroke-width="2.5">
    <circle cx="450" cy="70" r="37"/>
    <circle cx="450" cy="170" r="37"/>
    <circle cx="450" cy="270" r="37"/>
  </g>
  <g fill="none" stroke="#c4621a" stroke-width="3" stroke-linejoin="round">
    <polyline points="428,82 450,82 472,58"/>
    <polyline points="428,182 450,182 472,158"/>
    <polyline points="428,282 450,282 472,258"/>
  </g>
  <g font-size="22" fill="#1b2a3a" text-anchor="middle" font-style="italic">
    <text x="510" y="45">u</text>
    <text x="510" y="145">v</text>
    <text x="510" y="300">w</text>
  </g>
  <!-- output node -->
  <circle cx="770" cy="170" r="37" fill="#eef4ea" stroke="#6a994e" stroke-width="2.5"/>
  <text x="770" y="178" font-size="22" fill="#1b2a3a" text-anchor="middle">out</text>
  <!-- layer labels -->
  <g font-size="19" fill="#1b2a3a" text-anchor="middle">
    <text x="120" y="300" font-weight="bold">input</text>
    <text x="120" y="324">2 numbers</text>
    <text x="285" y="335" fill="#2a6f97" font-weight="bold">multiply by A, add b</text>
    <text x="285" y="359" fill="#2a6f97">(A is 3 × 2)</text>
    <text x="450" y="335" fill="#c4621a" font-weight="bold">ReLU</text>
    <text x="450" y="359" fill="#c4621a">max(0, ·)</text>
    <text x="625" y="335" fill="#6a994e" font-weight="bold">multiply by C, add d</text>
    <text x="625" y="359" fill="#6a994e">(C is 1 × 3)</text>
    <text x="770" y="240" font-weight="bold">output</text>
    <text x="450" y="390" font-size="17" fill="#8d99ae">hidden layer: 3 units</text>
  </g>
</svg>
