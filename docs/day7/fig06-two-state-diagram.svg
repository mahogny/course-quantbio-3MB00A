<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== State circles ===== -->
  <!-- R (resting) -->
  <circle cx="190" cy="170" r="60" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="190" y="164" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">R</text>
  <text x="190" y="188" text-anchor="middle" font-size="14" fill="#1b2a3a">resting</text>

  <!-- D (dividing) -->
  <circle cx="530" cy="170" r="60" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <text x="530" y="164" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">D</text>
  <text x="530" y="188" text-anchor="middle" font-size="14" fill="#1b2a3a">dividing</text>

  <!-- ===== Self-loop on R (top-left) ===== -->
  <path d="M 148 128 C 110 78, 190 60, 210 108" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="150" y="58" text-anchor="middle" font-size="16" fill="#2a6f97" font-weight="bold">0.9</text>

  <!-- ===== Self-loop on D (top-right) ===== -->
  <path d="M 510 108 C 530 60, 610 78, 572 128" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="570" y="58" text-anchor="middle" font-size="16" fill="#6a994e" font-weight="bold">0.5</text>

  <!-- ===== Curved arrow top: R -> D  labelled 0.1 ===== -->
  <path d="M 244 138 C 320 100, 400 100, 476 138" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="104" text-anchor="middle" font-size="16" fill="#bc4749" font-weight="bold">0.1</text>

  <!-- ===== Curved arrow bottom: D -> R  labelled 0.5 ===== -->
  <path d="M 476 202 C 400 240, 320 240, 244 202" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="252" text-anchor="middle" font-size="16" fill="#bc4749" font-weight="bold">0.5</text>

  <!-- ===== Row-sum annotations under each state ===== -->
  <text x="190" y="292" text-anchor="middle" font-size="14" fill="#1b2a3a">row R:  0.9 + 0.1 = 1</text>
  <text x="530" y="292" text-anchor="middle" font-size="14" fill="#1b2a3a">row D:  0.5 + 0.5 = 1</text>

  <!-- ===== Bottom caption ===== -->
  <text x="360" y="338" text-anchor="middle" font-size="14" fill="#1b2a3a">the diagram and the matrix carry exactly the same information;</text>
  <text x="360" y="358" text-anchor="middle" font-size="14" fill="#1b2a3a">self-loops are the diagonal entries</text>
</svg>
