<svg xmlns="http://www.w3.org/2000/svg" width="645.5" height="359.7" viewBox="-2.5 18.5 645.5 359.7" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- retained region shading (left of crossing) -->
  <rect x="70" y="50" width="179" height="270" fill="#eaf1f7"/>
  <text x="150" y="120" font-size="16" font-weight="bold" fill="#2a6f97" text-anchor="middle">retained</text>

  <!-- y gridlines and ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="70" y1="252.5" x2="600" y2="252.5"/>
    <line x1="70" y1="185" x2="600" y2="185"/>
    <line x1="70" y1="117.5" x2="600" y2="117.5"/>
    <line x1="70" y1="50" x2="600" y2="50"/>
  </g>
  <g font-size="12" fill="#5a6774" text-anchor="end">
    <text x="63" y="324">0</text>
    <text x="63" y="256.5">2</text>
    <text x="63" y="189">4</text>
    <text x="63" y="121.5">6</text>
    <text x="63" y="54">8</text>
  </g>

  <!-- Kaiser reference line at eigenvalue = 1 -->
  <line x1="70" y1="286.25" x2="600" y2="286.25" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="596" y="299" font-size="12" fill="#6a994e" text-anchor="end">λ = 1</text>

  <!-- axes -->
  <line x1="70" y1="320" x2="608" y2="320" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="320" x2="70" y2="44" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- x ticks 1..10 -->
  <g font-size="12" fill="#5a6774" text-anchor="middle">
    <line x1="90" y1="320" x2="90" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="90" y="338">1</text>
    <line x1="144" y1="320" x2="144" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="144" y="338">2</text>
    <line x1="198" y1="320" x2="198" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="198" y="338">3</text>
    <line x1="252" y1="320" x2="252" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="252" y="338">4</text>
    <line x1="306" y1="320" x2="306" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="306" y="338">5</text>
    <line x1="360" y1="320" x2="360" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="360" y="338">6</text>
    <line x1="414" y1="320" x2="414" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="414" y="338">7</text>
    <line x1="468" y1="320" x2="468" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="468" y="338">8</text>
    <line x1="522" y1="320" x2="522" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="522" y="338">9</text>
    <line x1="576" y1="320" x2="576" y2="325" stroke="#1b2a3a" stroke-width="1"/><text x="576" y="338">10</text>
  </g>

  <!-- axis titles -->
  <text x="339" y="360" font-size="14" fill="#1b2a3a" text-anchor="middle">PC index</text>
  <text x="26" y="185" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 26 185)">eigenvalue</text>

  <!-- crossing vertical guide -->
  <line x1="249" y1="60" x2="249" y2="320" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="249" cy="272" r="4" fill="#bc4749"/>
  <text x="249" y="47" font-size="14" fill="#bc4749" text-anchor="middle">keep PCs above the noise line</text>

  <!-- Curve B: randomised / permuted noise baseline (dashed grey) -->
  <polyline fill="none" stroke="#8a97a3" stroke-width="2" stroke-dasharray="6,4"
    points="90,262.6 144,266 198,269.4 252,272.75 306,276.1 360,277.8 414,279.5 468,281.2 522,282.9 576,284.6"/>

  <!-- Curve A: observed data (solid accent blue) -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.5"
    points="90,63.5 144,164.75 198,239 252,274.44 306,291.31 360,296.4 414,299.75 468,301.4 522,303.1 576,304.8"/>
  <g fill="#2a6f97">
    <circle cx="90" cy="63.5" r="3.5"/><circle cx="144" cy="164.75" r="3.5"/><circle cx="198" cy="239" r="3.5"/>
    <circle cx="252" cy="274.44" r="3.5"/><circle cx="306" cy="291.31" r="3.5"/><circle cx="360" cy="296.4" r="3.5"/>
    <circle cx="414" cy="299.75" r="3.5"/><circle cx="468" cy="301.4" r="3.5"/><circle cx="522" cy="303.1" r="3.5"/><circle cx="576" cy="304.8" r="3.5"/>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <line x1="330" y1="120" x2="366" y2="120" stroke="#2a6f97" stroke-width="2.5"/>
    <text x="374" y="124">observed data</text>
    <line x1="330" y1="142" x2="366" y2="142" stroke="#8a97a3" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="374" y="146">randomised / permuted data (noise baseline)</text>
    <line x1="330" y1="164" x2="366" y2="164" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="2,3"/>
    <text x="374" y="168">Kaiser: λ &gt; 1 (standardised data)</text>
  </g>
</svg>
