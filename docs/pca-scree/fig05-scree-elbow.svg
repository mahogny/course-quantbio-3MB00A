<svg xmlns="http://www.w3.org/2000/svg" width="646.2" height="371.5" viewBox="-11.4 21.7 646.2 371.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- region tints -->
  <rect x="60" y="40" width="167" height="270" fill="#eaf1f7" opacity="0.7"/>
  <rect x="227" y="40" width="383" height="270" fill="#f2f4f6" opacity="0.6"/>

  <!-- gridlines and y ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="60" y1="310" x2="610" y2="310"/>
    <line x1="60" y1="250" x2="610" y2="250"/>
    <line x1="60" y1="190" x2="610" y2="190"/>
    <line x1="60" y1="130" x2="610" y2="130"/>
    <line x1="60" y1="70"  x2="610" y2="70"/>
  </g>

  <!-- axes -->
  <line x1="60" y1="40" x2="60" y2="310" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="60" y1="310" x2="610" y2="310" stroke="#1b2a3a" stroke-width="2"/>

  <!-- y tick labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="54" y="314">0.0</text>
    <text x="54" y="254">0.1</text>
    <text x="54" y="194">0.2</text>
    <text x="54" y="134">0.3</text>
    <text x="54" y="74">0.4</text>
  </g>

  <!-- x tick labels 1..10 -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="80"  y="328">1</text>
    <text x="139" y="328">2</text>
    <text x="198" y="328">3</text>
    <text x="257" y="328">4</text>
    <text x="316" y="328">5</text>
    <text x="374" y="328">6</text>
    <text x="433" y="328">7</text>
    <text x="492" y="328">8</text>
    <text x="551" y="328">9</text>
    <text x="610" y="328">10</text>
  </g>

  <!-- axis titles -->
  <text x="335" y="352" font-size="15" fill="#1b2a3a" text-anchor="middle">PC index</text>
  <text x="18" y="175" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 18 175)">Proportion of variance explained (PVE)</text>

  <!-- scree curve: cliff then rubble slope -->
  <polyline points="80,58 139,202 198,268 257,289 316,292 374,295 433,298 492,300 551,302 610,304"
            fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <g fill="#2a6f97">
    <circle cx="80"  cy="58"  r="4.5"/>
    <circle cx="139" cy="202" r="4.5"/>
    <circle cx="198" cy="268" r="4.5"/>
    <circle cx="257" cy="289" r="4.5"/>
    <circle cx="316" cy="292" r="4.5"/>
    <circle cx="374" cy="295" r="4.5"/>
    <circle cx="433" cy="298" r="4.5"/>
    <circle cx="492" cy="300" r="4.5"/>
    <circle cx="551" cy="302" r="4.5"/>
    <circle cx="610" cy="304" r="4.5"/>
  </g>

  <!-- elbow circle at PC3 to PC4 transition -->
  <ellipse cx="228" cy="279" rx="42" ry="30" fill="none" stroke="#bc4749" stroke-width="2"/>
  <line x1="255" y1="255" x2="315" y2="205" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="322" y="205" font-size="15" fill="#bc4749" font-weight="bold">elbow</text>

  <!-- region labels -->
  <text x="143" y="110" font-size="13.5" fill="#2a6f97" text-anchor="middle" font-weight="bold">structure</text>
  <text x="143" y="127" font-size="12.5" fill="#2a6f97" text-anchor="middle">(steep drop)</text>
  <text x="470" y="150" font-size="13.5" fill="#6a994e" text-anchor="middle" font-weight="bold">noise</text>
  <text x="470" y="167" font-size="12.5" fill="#6a994e" text-anchor="middle">(flat tail)</text>
  <line x1="440" y1="175" x2="470" y2="290" stroke="#6a994e" stroke-width="1.3" stroke-dasharray="3,3"/>

  <!-- caption -->
  <text x="335" y="372" font-size="13" fill="#1b2a3a" text-anchor="middle" font-style="italic">keep PCs before the elbow (Cattell)</text>
</svg>
