<svg xmlns="http://www.w3.org/2000/svg" viewBox="25.3 24.1 570.5 380.9" font-family="Helvetica, Arial, sans-serif" width="570.5" height="380.9">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- elongated cloud envelope tinted along the major axis -->
  <ellipse cx="350" cy="205" rx="248" ry="70" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"
           transform="rotate(-24 350 205)"/>

  <!-- group A (teal band, lower side of minor axis) -->
  <circle cx="173.1" cy="309.7" r="5.5" fill="#2a9d8f"/>
  <circle cx="211.3" cy="297.0" r="5.5" fill="#2a9d8f"/>
  <circle cx="228.2" cy="290.7" r="5.5" fill="#2a9d8f"/>
  <circle cx="267.0" cy="281.2" r="5.5" fill="#2a9d8f"/>
  <circle cx="295.2" cy="271.1" r="5.5" fill="#2a9d8f"/>
  <circle cx="319.1" cy="242.7" r="5.5" fill="#2a9d8f"/>
  <circle cx="328.8" cy="239.8" r="5.5" fill="#2a9d8f"/>
  <circle cx="355.8" cy="236.9" r="5.5" fill="#2a9d8f"/>
  <circle cx="382.9" cy="214.6" r="5.5" fill="#2a9d8f"/>
  <circle cx="415.9" cy="207.1" r="5.5" fill="#2a9d8f"/>
  <circle cx="437.4" cy="195.0" r="5.5" fill="#2a9d8f"/>
  <circle cx="462.2" cy="189.4" r="5.5" fill="#2a9d8f"/>
  <circle cx="502.7" cy="165.7" r="5.5" fill="#2a9d8f"/>
  <circle cx="531.3" cy="162.2" r="5.5" fill="#2a9d8f"/>
  <circle cx="545.2" cy="154.3" r="5.5" fill="#2a9d8f"/>

  <!-- group B (orange band, upper side of minor axis) -->
  <circle cx="146.8" cy="265.6" r="5.5" fill="#e07a33"/>
  <circle cx="184.0" cy="237.4" r="5.5" fill="#e07a33"/>
  <circle cx="202.3" cy="229.4" r="5.5" fill="#e07a33"/>
  <circle cx="233.1" cy="216.8" r="5.5" fill="#e07a33"/>
  <circle cx="263.0" cy="212.4" r="5.5" fill="#e07a33"/>
  <circle cx="285.6" cy="207.9" r="5.5" fill="#e07a33"/>
  <circle cx="320.5" cy="181.5" r="5.5" fill="#e07a33"/>
  <circle cx="336.0" cy="181.1" r="5.5" fill="#e07a33"/>
  <circle cx="351.0" cy="163.1" r="5.5" fill="#e07a33"/>
  <circle cx="388.6" cy="151.3" r="5.5" fill="#e07a33"/>
  <circle cx="422.0" cy="145.9" r="5.5" fill="#e07a33"/>
  <circle cx="451.3" cy="127.6" r="5.5" fill="#e07a33"/>
  <circle cx="470.0" cy="128.2" r="5.5" fill="#e07a33"/>
  <circle cx="504.0" cy="96.7" r="5.5" fill="#e07a33"/>
  <circle cx="533.2" cy="95.8" r="5.5" fill="#e07a33"/>

  <!-- PC1: long arrow along the MAJOR (high variance) axis -->
  <line x1="135.3" y1="300.6" x2="564.7" y2="109.4" stroke="#1b2a3a" stroke-width="2.4" marker-end="url(#arw)"/>
  <text x="556" y="92" text-anchor="end" font-size="15" font-weight="bold" fill="#1b2a3a">PC1 = most variance</text>
  <text x="556" y="109" text-anchor="end" font-size="13" fill="#1b2a3a">(nuisance gradient)</text>

  <!-- true separation: short double arrow across the MINOR axis -->
  <line x1="322" y1="143" x2="378" y2="267" stroke="#bc4749" stroke-width="2.4"
        marker-start="url(#arwR)" marker-end="url(#arwR)"/>
  <text x="392" y="243" font-size="14.5" font-weight="bold" fill="#bc4749">true group separation</text>
  <text x="392" y="261" font-size="13" fill="#bc4749">(low variance)</text>

  <!-- annotation -->
  <text x="40" y="52" font-size="16" font-weight="bold" fill="#1b2a3a">PCA ranks the irrelevant axis first</text>

  <!-- legend -->
  <circle cx="52" cy="80" r="5.5" fill="#2a9d8f"/>
  <text x="64" y="85" font-size="13.5" fill="#1b2a3a">group A</text>
  <circle cx="140" cy="80" r="5.5" fill="#e07a33"/>
  <text x="152" y="85" font-size="13.5" fill="#1b2a3a">group B</text>

  <!-- caption -->
  <text x="360" y="386" text-anchor="middle" font-size="13.5" fill="#2a6f97">separation of known groups is a SUPERVISED question (OPLS / LDA)</text>
</svg>
