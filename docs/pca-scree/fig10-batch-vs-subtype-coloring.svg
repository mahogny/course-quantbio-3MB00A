<svg xmlns="http://www.w3.org/2000/svg" width="650.6" height="367.4" viewBox="10.8 6.9 650.6 367.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: coloured by subtype -->
  <text x="155" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">coloured by subtype</text>

  <!-- axes -->
  <line x1="55" y1="270" x2="270" y2="270" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="55" y1="270" x2="55" y2="58" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="163" y="292" text-anchor="middle" font-size="15" fill="#1b2a3a">PC1</text>
  <text x="40" y="165" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 40 165)">PC2</text>

  <!-- left cluster (subtypes mixed) -->
  <circle cx="100" cy="130" r="6" fill="#bc4749"/>
  <circle cx="120" cy="115" r="6" fill="#2a6f97"/>
  <circle cx="105" cy="160" r="6" fill="#2a6f97"/>
  <circle cx="125" cy="175" r="6" fill="#bc4749"/>
  <circle cx="95"  cy="200" r="6" fill="#bc4749"/>
  <circle cx="123" cy="215" r="6" fill="#2a6f97"/>
  <!-- right cluster (subtypes mixed) -->
  <circle cx="200" cy="125" r="6" fill="#2a6f97"/>
  <circle cx="220" cy="140" r="6" fill="#bc4749"/>
  <circle cx="205" cy="170" r="6" fill="#bc4749"/>
  <circle cx="225" cy="185" r="6" fill="#2a6f97"/>
  <circle cx="203" cy="210" r="6" fill="#bc4749"/>
  <circle cx="223" cy="200" r="6" fill="#2a6f97"/>

  <!-- legend left -->
  <circle cx="65" cy="315" r="6" fill="#bc4749"/>
  <text x="76" y="320" font-size="13" fill="#1b2a3a">subtype A</text>
  <circle cx="155" cy="315" r="6" fill="#2a6f97"/>
  <text x="166" y="320" font-size="13" fill="#1b2a3a">subtype B</text>

  <!-- RIGHT PANEL: coloured by batch -->
  <text x="500" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">coloured by batch (sequencing run)</text>

  <!-- axes -->
  <line x1="400" y1="270" x2="615" y2="270" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="270" x2="400" y2="58" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="292" text-anchor="middle" font-size="15" fill="#1b2a3a">PC1</text>
  <text x="385" y="165" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 385 165)">PC2</text>

  <!-- left cluster = batch 1 (green) -->
  <circle cx="445" cy="130" r="6" fill="#6a994e"/>
  <circle cx="465" cy="115" r="6" fill="#6a994e"/>
  <circle cx="450" cy="160" r="6" fill="#6a994e"/>
  <circle cx="470" cy="175" r="6" fill="#6a994e"/>
  <circle cx="440" cy="200" r="6" fill="#6a994e"/>
  <circle cx="468" cy="215" r="6" fill="#6a994e"/>
  <!-- right cluster = batch 2 (purple) -->
  <circle cx="545" cy="125" r="6" fill="#7b4f9e"/>
  <circle cx="565" cy="140" r="6" fill="#7b4f9e"/>
  <circle cx="550" cy="170" r="6" fill="#7b4f9e"/>
  <circle cx="570" cy="185" r="6" fill="#7b4f9e"/>
  <circle cx="548" cy="210" r="6" fill="#7b4f9e"/>
  <circle cx="568" cy="200" r="6" fill="#7b4f9e"/>

  <!-- legend right -->
  <circle cx="410" cy="315" r="6" fill="#6a994e"/>
  <text x="421" y="320" font-size="13" fill="#1b2a3a">batch 1</text>
  <circle cx="495" cy="315" r="6" fill="#7b4f9e"/>
  <text x="506" y="320" font-size="13" fill="#1b2a3a">batch 2</text>

  <!-- caption under right panel -->
  <text x="500" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#bc4749">PC1 = machine, not biology</text>
