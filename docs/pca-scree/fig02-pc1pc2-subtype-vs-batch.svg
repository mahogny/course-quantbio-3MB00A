<svg xmlns="http://www.w3.org/2000/svg" width="521.8" height="314.9" viewBox="55.1 34.8 521.8 314.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes: origin near centre -->
  <line x1="70" y1="310" x2="560" y2="310" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="55" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- axis pointers -->
  <line x1="70" y1="310" x2="560" y2="310" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)" opacity="0"/>
  <line x1="315" y1="310" x2="560" y2="310" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="200" x2="90" y2="55" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- axis labels -->
  <text x="540" y="335" font-size="17" fill="#1b2a3a" text-anchor="end">PC1</text>
  <text x="100" y="62" font-size="17" fill="#1b2a3a">PC2</text>

  <!-- left-lower cloud (~30 grey dots) -->
  <g fill="#6b7885">
    <circle cx="150" cy="255" r="5"/><circle cx="168" cy="240" r="5"/><circle cx="140" cy="270" r="5"/>
    <circle cx="185" cy="258" r="5"/><circle cx="160" cy="278" r="5"/><circle cx="200" cy="245" r="5"/>
    <circle cx="178" cy="272" r="5"/><circle cx="145" cy="235" r="5"/><circle cx="205" cy="265" r="5"/>
    <circle cx="132" cy="252" r="5"/><circle cx="192" cy="230" r="5"/><circle cx="215" cy="255" r="5"/>
    <circle cx="158" cy="222" r="5"/><circle cx="172" cy="290" r="5"/><circle cx="120" cy="262" r="5"/>
    <circle cx="210" cy="238" r="5"/><circle cx="190" cy="282" r="5"/><circle cx="228" cy="248" r="5"/>
    <circle cx="148" cy="288" r="5"/><circle cx="165" cy="252" r="5"/><circle cx="135" cy="245" r="5"/>
    <circle cx="182" cy="240" r="5"/><circle cx="198" cy="275" r="5"/><circle cx="125" cy="280" r="5"/>
    <circle cx="220" cy="272" r="5"/><circle cx="155" cy="265" r="5"/><circle cx="175" cy="225" r="5"/>
    <circle cx="205" cy="290" r="5"/><circle cx="240" cy="262" r="5"/><circle cx="112" cy="248" r="5"/>
  </g>

  <!-- right-upper cloud (~30 grey dots) -->
  <g fill="#6b7885">
    <circle cx="400" cy="160" r="5"/><circle cx="420" cy="145" r="5"/><circle cx="388" cy="175" r="5"/>
    <circle cx="435" cy="162" r="5"/><circle cx="410" cy="182" r="5"/><circle cx="450" cy="150" r="5"/>
    <circle cx="428" cy="176" r="5"/><circle cx="392" cy="140" r="5"/><circle cx="455" cy="170" r="5"/>
    <circle cx="378" cy="158" r="5"/><circle cx="442" cy="135" r="5"/><circle cx="468" cy="160" r="5"/>
    <circle cx="405" cy="128" r="5"/><circle cx="422" cy="195" r="5"/><circle cx="365" cy="168" r="5"/>
    <circle cx="460" cy="143" r="5"/><circle cx="440" cy="188" r="5"/><circle cx="478" cy="152" r="5"/>
    <circle cx="398" cy="192" r="5"/><circle cx="415" cy="158" r="5"/><circle cx="382" cy="150" r="5"/>
    <circle cx="432" cy="145" r="5"/><circle cx="448" cy="180" r="5"/><circle cx="372" cy="185" r="5"/>
    <circle cx="470" cy="178" r="5"/><circle cx="408" cy="170" r="5"/><circle cx="425" cy="130" r="5"/>
    <circle cx="455" cy="195" r="5"/><circle cx="490" cy="165" r="5"/><circle cx="360" cy="152" r="5"/>
  </g>

  <!-- question mark in circle, between the two clusters -->
  <circle cx="300" cy="118" r="34" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="300" y="133" font-size="42" fill="#2a6f97" text-anchor="middle" font-weight="bold">?</text>

  <!-- caption ribbon -->
  <rect x="238" y="162" width="124" height="26" rx="4" fill="#2a6f97"/>
  <text x="300" y="180" font-size="14" fill="#ffffff" text-anchor="middle">subtype vs batch?</text>

  <!-- legend swatches implying ambiguity -->
  <g font-size="13" fill="#1b2a3a">
    <rect x="360" y="255" width="16" height="16" rx="3" fill="#2a9d8f"/>
    <text x="382" y="268">tumour subtype?</text>
    <rect x="360" y="280" width="16" height="16" rx="3" fill="#e8963a"/>
    <text x="382" y="293">sequencing run?</text>
  </g>
</svg>
