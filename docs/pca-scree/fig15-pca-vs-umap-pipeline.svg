<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== TITLES / SECTION LABELS ===================== -->
  <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">high-dim data</text>

  <!-- ===================== LEFT: tangled high-dim cloud ===================== -->
  <g>
    <!-- curved manifold strands to suggest non-linear structure -->
    <path d="M40,150 C90,90 150,120 200,80" fill="none" stroke="#c9d3dd" stroke-width="2"/>
    <path d="M45,230 C110,270 160,210 215,250" fill="none" stroke="#c9d3dd" stroke-width="2"/>
    <path d="M60,190 C120,150 130,300 210,300" fill="none" stroke="#c9d3dd" stroke-width="2"/>
    <!-- blue cluster (curved arc, upper) -->
    <g fill="#2a6f97">
      <circle cx="55" cy="150" r="4"/><circle cx="80" cy="120" r="4"/><circle cx="105" cy="105" r="4"/>
      <circle cx="135" cy="95" r="4"/><circle cx="165" cy="92" r="4"/><circle cx="195" cy="82" r="4"/>
      <circle cx="120" cy="120" r="4"/><circle cx="150" cy="110" r="4"/><circle cx="90" cy="140" r="4"/>
    </g>
    <!-- red cluster (interleaved middle) -->
    <g fill="#bc4749">
      <circle cx="70" cy="195" r="4"/><circle cx="100" cy="180" r="4"/><circle cx="130" cy="175" r="4"/>
      <circle cx="160" cy="165" r="4"/><circle cx="185" cy="150" r="4"/><circle cx="205" cy="130" r="4"/>
      <circle cx="115" cy="205" r="4"/><circle cx="145" cy="195" r="4"/><circle cx="175" cy="180" r="4"/>
    </g>
    <!-- green cluster (lower arc) -->
    <g fill="#6a994e">
      <circle cx="60" cy="240" r="4"/><circle cx="90" cy="260" r="4"/><circle cx="120" cy="275" r="4"/>
      <circle cx="150" cy="285" r="4"/><circle cx="180" cy="290" r="4"/><circle cx="210" cy="295" r="4"/>
      <circle cx="105" cy="250" r="4"/><circle cx="140" cy="255" r="4"/><circle cx="170" cy="270" r="4"/>
    </g>
    <text x="130" y="330" text-anchor="middle" font-size="12" fill="#1b2a3a">curved / clustered structure</text>
  </g>

  <!-- ===================== PIPELINE ARROW 1: data -> PCA ===================== -->
  <line x1="240" y1="150" x2="360" y2="95" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2a3a">PCA</text>
  <text x="300" y="122" text-anchor="middle" font-size="11" fill="#2a6f97">top PCs, denoise</text>

  <!-- ===================== TOP PANEL: PCA (linear) ===================== -->
  <g>
    <rect x="368" y="40" width="230" height="150" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- axes -->
    <line x1="388" y1="175" x2="580" y2="175" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="388" y1="175" x2="388" y2="55" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="575" y="190" text-anchor="end" font-size="12" fill="#1b2a3a">PC1</text>
    <text x="382" y="62" text-anchor="end" font-size="12" fill="#1b2a3a">PC2</text>
    <!-- flattened / smeared overlapping ellipses -->
    <ellipse cx="470" cy="120" rx="55" ry="16" fill="#2a6f97" opacity="0.45"/>
    <ellipse cx="495" cy="128" rx="55" ry="16" fill="#bc4749" opacity="0.45"/>
    <ellipse cx="520" cy="122" rx="55" ry="16" fill="#6a994e" opacity="0.45"/>
    <text x="483" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">PCA (linear)</text>
    <text x="483" y="163" text-anchor="middle" font-size="11" fill="#bc4749">clusters flattened / smeared</text>
  </g>

  <!-- ===================== PIPELINE ARROW 2: PCA -> UMAP ===================== -->
  <line x1="483" y1="192" x2="483" y2="228" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="497" y="216" text-anchor="start" font-size="11" font-weight="bold" fill="#2a6f97">UMAP on top PCs</text>

  <!-- ===================== BOTTOM PANEL: UMAP (non-linear) ===================== -->
  <g>
    <rect x="368" y="232" width="230" height="150" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- axes -->
    <line x1="388" y1="367" x2="580" y2="367" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="388" y1="367" x2="388" y2="247" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="575" y="382" text-anchor="end" font-size="12" fill="#1b2a3a">UMAP1</text>
    <text x="382" y="254" text-anchor="end" font-size="12" fill="#1b2a3a">UMAP2</text>
    <!-- tight, well-separated islands -->
    <g fill="#2a6f97">
      <circle cx="430" cy="285" r="3"/><circle cx="440" cy="278" r="3"/><circle cx="448" cy="288" r="3"/>
      <circle cx="436" cy="295" r="3"/><circle cx="452" cy="280" r="3"/><circle cx="444" cy="286" r="3"/>
    </g>
    <g fill="#bc4749">
      <circle cx="540" cy="300" r="3"/><circle cx="550" cy="293" r="3"/><circle cx="558" cy="303" r="3"/>
      <circle cx="546" cy="310" r="3"/><circle cx="562" cy="295" r="3"/><circle cx="554" cy="301" r="3"/>
    </g>
    <g fill="#6a994e">
      <circle cx="475" cy="340" r="3"/><circle cx="485" cy="333" r="3"/><circle cx="493" cy="343" r="3"/>
      <circle cx="481" cy="350" r="3"/><circle cx="497" cy="335" r="3"/><circle cx="489" cy="341" r="3"/>
    </g>
    <text x="483" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">UMAP (non-linear)</text>
    <text x="483" y="277" text-anchor="middle" font-size="11" fill="#6a994e">nearby points kept nearby</text>
  </g>

  <!-- ===================== WARNING TAG ===================== -->
  <g>
    <rect x="618" y="252" width="248" height="52" rx="6" fill="#fff5f5" stroke="#bc4749" stroke-width="1.5"/>
    <text x="628" y="272" font-size="12" font-weight="bold" fill="#bc4749">⚠ distances between clusters</text>
    <text x="628" y="289" font-size="12" fill="#bc4749">NOT meaningful; stochastic</text>
  </g>

  <!-- ===================== RIGHT NOTE for PCA panel ===================== -->
  <text x="618" y="115" font-size="12" fill="#1b2a3a">linear projection:</text>
  <text x="618" y="132" font-size="12" fill="#1b2a3a">rotate + flatten only</text>

  <!-- ===================== CAPTION ===================== -->
  <text x="440" y="404" text-anchor="middle" font-size="13" font-style="italic" fill="#1b2a3a">today's how-many-PCs choice feeds UMAP</text>
</svg>
