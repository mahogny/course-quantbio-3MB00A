<svg xmlns="http://www.w3.org/2000/svg" width="500.9" height="366.5" viewBox="80.8 10.4 500.9 366.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- cloud centre at (300,200); tilt about 30 degrees below horizontal (screen y down) -->
  <!-- major axis direction (cos30, sin30) = (0.866, 0.5) -->

  <!-- faint dashed ellipse outlining spread, rotated 30 deg -->
  <ellipse cx="300" cy="200" rx="150" ry="60" fill="#eaf1f7" fill-opacity="0.5" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 5" transform="rotate(30 300 200)"/>

  <!-- ~50 grey dots forming oblong cloud along 30 deg axis -->
  <g fill="#8a96a3">
    <circle cx="300" cy="200" r="3"/>
    <circle cx="326" cy="215" r="3"/>
    <circle cx="274" cy="185" r="3"/>
    <circle cx="352" cy="230" r="3"/>
    <circle cx="248" cy="170" r="3"/>
    <circle cx="378" cy="245" r="3"/>
    <circle cx="222" cy="155" r="3"/>
    <circle cx="404" cy="260" r="3"/>
    <circle cx="196" cy="140" r="3"/>
    <circle cx="430" cy="275" r="3"/>
    <circle cx="313" cy="196" r="3"/>
    <circle cx="287" cy="204" r="3"/>
    <circle cx="339" cy="211" r="3"/>
    <circle cx="261" cy="189" r="3"/>
    <circle cx="318" cy="228" r="3"/>
    <circle cx="282" cy="172" r="3"/>
    <circle cx="344" cy="243" r="3"/>
    <circle cx="256" cy="157" r="3"/>
    <circle cx="292" cy="240" r="3"/>
    <circle cx="308" cy="160" r="3"/>
    <circle cx="366" cy="222" r="3"/>
    <circle cx="234" cy="178" r="3"/>
    <circle cx="392" cy="237" r="3"/>
    <circle cx="208" cy="163" r="3"/>
    <circle cx="330" cy="200" r="3"/>
    <circle cx="270" cy="200" r="3"/>
    <circle cx="356" cy="207" r="3"/>
    <circle cx="244" cy="193" r="3"/>
    <circle cx="301" cy="181" r="3"/>
    <circle cx="299" cy="219" r="3"/>
    <circle cx="327" cy="188" r="3"/>
    <circle cx="273" cy="212" r="3"/>
    <circle cx="353" cy="215" r="3"/>
    <circle cx="247" cy="185" r="3"/>
    <circle cx="380" cy="228" r="3"/>
    <circle cx="220" cy="172" r="3"/>
    <circle cx="336" cy="234" r="3"/>
    <circle cx="264" cy="166" r="3"/>
    <circle cx="362" cy="250" r="3"/>
    <circle cx="238" cy="150" r="3"/>
    <circle cx="288" cy="188" r="3"/>
    <circle cx="312" cy="212" r="3"/>
    <circle cx="345" cy="198" r="3"/>
    <circle cx="255" cy="202" r="3"/>
    <circle cx="410" cy="252" r="3"/>
    <circle cx="190" cy="148" r="3"/>
    <circle cx="322" cy="242" r="3"/>
    <circle cx="278" cy="158" r="3"/>
    <circle cx="368" cy="236" r="3"/>
    <circle cx="232" cy="164" r="3"/>
  </g>

  <!-- PC1 arrow: long, along major axis (30 deg). length ~150 -->
  <line x1="300" y1="200" x2="430" y2="275" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- PC2 arrow: short, perpendicular (minor axis). direction (-sin30, cos30)=(-0.5,0.866). length ~62 -->
  <line x1="300" y1="200" x2="269" y2="254" stroke="#bc4749" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- centre dot -->
  <circle cx="300" cy="200" r="3.5" fill="#1b2a3a"/>

  <!-- PC1 label -->
  <text x="440" y="288" font-size="15" font-weight="bold" fill="#1b2a3a">PC1 (eigenvector)</text>
  <text x="440" y="307" font-size="15" fill="#1b2a3a">variance = λ1</text>

  <!-- PC2 label -->
  <text x="95" y="258" font-size="15" font-weight="bold" fill="#bc4749">PC2 (eigenvector)</text>
  <text x="95" y="277" font-size="15" fill="#bc4749">variance = λ2</text>

  <!-- eigenvalue ordering near arrows -->
  <text x="360" y="185" font-size="17" font-weight="bold" fill="#2a6f97">λ1 ≥ λ2</text>

  <!-- note -->
  <text x="320" y="360" font-size="14" fill="#1b2a3a" text-anchor="middle" font-style="italic">eigenvalue = variance along that direction</text>

  <!-- title cue for tilt angle -->
  <text x="300" y="35" font-size="14" fill="#8a96a3" text-anchor="middle">2D point cloud, centred at origin, tilted ≈ θ = 30°</text>
</svg>
