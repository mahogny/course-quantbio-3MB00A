<svg xmlns="http://www.w3.org/2000/svg" viewBox="29 12 603 348" width="603" height="348" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== tiny two-node diagram: C -> G ===== -->
  <g>
    <circle cx="70" cy="205" r="26" fill="#f6dede" stroke="#bc4749" stroke-width="2"/>
    <text x="70" y="211" text-anchor="middle" font-size="20" fill="#1b2a3a">C</text>

    <circle cx="200" cy="205" r="26" fill="#e6f0dd" stroke="#6a994e" stroke-width="2"/>
    <text x="200" y="211" text-anchor="middle" font-size="20" fill="#1b2a3a">G</text>

    <line x1="98" y1="205" x2="170" y2="205" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="134" y="192" text-anchor="middle" font-size="16" fill="#2a6f97">p&#8202;<tspan font-size="12" dy="4">CG</tspan></text>
  </g>

  <!-- ===== matrix ===== -->
  <!-- matrix grid: top-left (340,90), cell 55, 4x4 -->

  <!-- TO label -->
  <text x="450" y="34" text-anchor="middle" font-size="15" fill="#2a6f97">TO — column j</text>
  <line x1="340" y1="46" x2="560" y2="46" stroke="#2a6f97" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FROM label (rotated) -->
  <text x="296" y="200" text-anchor="middle" font-size="15" fill="#bc4749" transform="rotate(-90 296 200)">FROM — row i</text>
  <line x1="308" y1="90" x2="308" y2="310" stroke="#bc4749" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C row shading (row index 1) -->
  <rect x="340" y="145" width="220" height="55" fill="#f6dede" opacity="0.6"/>
  <!-- G column shading (col index 2) -->
  <rect x="450" y="90" width="55" height="220" fill="#e6f0dd" opacity="0.6"/>
  <!-- intersection: strong highlight -->
  <rect x="450" y="145" width="55" height="55" fill="#2a6f97" opacity="0.85" stroke="#1b2a3a" stroke-width="2"/>

  <!-- column headers -->
  <text x="367.5" y="78" text-anchor="middle" font-size="17" fill="#1b2a3a">A</text>
  <text x="422.5" y="78" text-anchor="middle" font-size="17" fill="#1b2a3a">C</text>
  <text x="477.5" y="78" text-anchor="middle" font-size="17" fill="#6a994e" font-weight="bold">G</text>
  <text x="532.5" y="78" text-anchor="middle" font-size="17" fill="#1b2a3a">T</text>

  <!-- row labels -->
  <text x="330" y="123" text-anchor="end" font-size="17" fill="#1b2a3a">A</text>
  <text x="330" y="178" text-anchor="end" font-size="17" fill="#bc4749" font-weight="bold">C</text>
  <text x="330" y="233" text-anchor="end" font-size="17" fill="#1b2a3a">G</text>
  <text x="330" y="288" text-anchor="end" font-size="17" fill="#1b2a3a">T</text>

  <!-- grid lines -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="340" y1="90"  x2="560" y2="90"/>
    <line x1="340" y1="145" x2="560" y2="145"/>
    <line x1="340" y1="200" x2="560" y2="200"/>
    <line x1="340" y1="255" x2="560" y2="255"/>
    <line x1="340" y1="310" x2="560" y2="310"/>
    <line x1="340" y1="90" x2="340" y2="310"/>
    <line x1="395" y1="90" x2="395" y2="310"/>
    <line x1="450" y1="90" x2="450" y2="310"/>
    <line x1="505" y1="90" x2="505" y2="310"/>
    <line x1="560" y1="90" x2="560" y2="310"/>
  </g>
  <!-- outer frame -->
  <rect x="340" y="90" width="220" height="220" fill="none" stroke="#1b2a3a" stroke-width="2"/>

  <!-- p_CG label in the highlighted cell -->
  <text x="477.5" y="179" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">p&#8202;<tspan font-size="12" dy="4">CG</tspan></text>

  <!-- matrix name P -->
  <text x="580" y="205" font-size="22" fill="#1b2a3a" font-style="italic">= P</text>

  <!-- ===== bottom caption ===== -->
  <text x="235" y="343" text-anchor="start" font-size="15" fill="#1b2a3a">entry in row i (from), column j (to) = p<tspan font-size="11" dy="3">ij</tspan><tspan dy="-3"> = P(from i to j)</tspan></text>
</svg>
