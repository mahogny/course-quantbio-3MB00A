<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.3 4.3 861.4 382.6" width="861.4" height="382.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- P matrix above the chain -->
  <g font-size="16" fill="#1b2a3a">
    <text x="230" y="52" font-size="17" font-weight="bold">P =</text>
    <!-- bracket -->
    <path d="M275,30 L268,30 L268,66 L275,66" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
    <path d="M355,30 L362,30 L362,66 L355,66" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
    <text x="285" y="45" fill="#6a994e">0.9</text>
    <text x="325" y="45" fill="#bc4749">0.1</text>
    <text x="285" y="63" fill="#bc4749">0.5</text>
    <text x="325" y="63" fill="#6a994e">0.5</text>
  </g>
  <text x="380" y="55" font-size="12" fill="#1b2a3a">rows = current state, columns = next state</text>

  <!-- Chain of state row vectors -->
  <!-- box helper positions -->
  <g>
    <!-- x0 -->
    <rect x="30" y="150" width="150" height="60" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="105" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">x_0 = (1, 0)</text>
    <text x="105" y="197" text-anchor="middle" font-size="12" fill="#1b2a3a">start in state 1</text>

    <!-- x1 -->
    <rect x="250" y="150" width="150" height="60" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="325" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">x_1 = (0.9, 0.1)</text>
    <text x="325" y="197" text-anchor="middle" font-size="12" fill="#1b2a3a">after 1 step</text>

    <!-- x2 -->
    <rect x="470" y="150" width="160" height="60" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="550" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">x_2 = (0.86, 0.14)</text>
    <text x="550" y="197" text-anchor="middle" font-size="12" fill="#1b2a3a">after 2 steps</text>

    <!-- dots -->
    <text x="700" y="188" font-size="26" font-weight="bold" fill="#1b2a3a">· · ·</text>
  </g>

  <!-- Arrows labelled x P -->
  <g>
    <line x1="180" y1="180" x2="248" y2="180" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="214" y="170" text-anchor="middle" font-size="15" fill="#2a6f97" font-style="italic">× P</text>

    <line x1="400" y1="180" x2="468" y2="180" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="434" y="170" text-anchor="middle" font-size="15" fill="#2a6f97" font-style="italic">× P</text>

    <line x1="630" y1="180" x2="658" y2="180" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="650" y="170" text-anchor="middle" font-size="15" fill="#2a6f97" font-style="italic">× P</text>
  </g>

  <!-- Settling note at end of chain -->
  <g>
    <rect x="670" y="150" width="170" height="60" rx="8" fill="#f2f7ee" stroke="#6a994e" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="755" y="174" text-anchor="middle" font-size="12.5" fill="#6a994e">as t grows, x_t settles</text>
    <text x="755" y="190" text-anchor="middle" font-size="12.5" fill="#6a994e">toward a fixed</text>
    <text x="755" y="206" text-anchor="middle" font-size="12.5" fill="#6a994e">distribution (Day 8)</text>
  </g>

  <!-- Equivalence lines under the chain -->
  <g fill="#1b2a3a">
    <text x="430" y="262" text-anchor="middle" font-size="20" font-weight="bold">x_t = x_0 P^t</text>
    <text x="430" y="292" text-anchor="middle" font-size="14">entry (P^t)_ij = probability of going from state i to state j in exactly t steps</text>
  </g>

  <!-- Bottom caption -->
  <line x1="60" y1="330" x2="800" y2="330" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="430" y="360" text-anchor="middle" font-size="15" font-style="italic" fill="#1b2a3a">t steps = the t-th power of P  (composition of one-step maps)</text>
</svg>
