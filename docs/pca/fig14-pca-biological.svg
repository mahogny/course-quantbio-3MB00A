<svg xmlns="http://www.w3.org/2000/svg" width="684.3" height="384.3" viewBox="40.6 15.4 684.3 384.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="60" y1="280" x2="700" y2="280" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="345" x2="370" y2="35" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="303" font-size="15" fill="#1b2a3a" text-anchor="end">PC1 score</text>
  <text x="384" y="48" font-size="15" fill="#1b2a3a">PC2 score</text>
  <text x="378" y="298" font-size="12" fill="#1b2a3a">0</text>

  <!-- normal cluster (blue) -->
  <g fill="#2a6f97">
    <circle cx="180" cy="265" r="6"/>
    <circle cx="205" cy="286" r="6"/>
    <circle cx="222" cy="270" r="6"/>
    <circle cx="196" cy="253" r="6"/>
    <circle cx="232" cy="291" r="6"/>
    <circle cx="210" cy="278" r="6"/>
    <circle cx="172" cy="283" r="6"/>
  </g>
  <text x="203" y="325" font-size="15" fill="#2a6f97" text-anchor="middle" font-weight="bold">normal</text>

  <!-- tumour cluster (red) -->
  <g fill="#bc4749">
    <circle cx="492" cy="268" r="6"/>
    <circle cx="512" cy="288" r="6"/>
    <circle cx="532" cy="272" r="6"/>
    <circle cx="502" cy="255" r="6"/>
    <circle cx="526" cy="292" r="6"/>
    <circle cx="516" cy="278" r="6"/>
    <circle cx="548" cy="284" r="6"/>
  </g>
  <text x="518" y="325" font-size="15" fill="#bc4749" text-anchor="middle" font-weight="bold">tumour</text>

  <!-- outlier point -->
  <circle cx="425" cy="85" r="6" fill="#6a994e"/>
  <circle cx="425" cy="85" r="15" fill="none" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="440" y1="85" x2="500" y2="85" stroke="#6a994e" stroke-width="1.5"/>
  <text x="506" y="80" font-size="13" fill="#6a994e" font-weight="bold">outlier?</text>
  <text x="506" y="96" font-size="12" fill="#6a994e">failed library / contamination &#8212; check</text>

  <!-- PC1 separation bracket -->
  <path d="M203,205 L203,190 L518,190 L518,205" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="360" y1="190" x2="360" y2="180" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="360" y="172" font-size="13" fill="#1b2a3a" text-anchor="middle">biggest source of variation splits the groups</text>

  <!-- legend -->
  <rect x="560" y="130" width="140" height="62" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5" rx="4"/>
  <circle cx="578" cy="150" r="6" fill="#2a6f97"/>
  <text x="592" y="155" font-size="13" fill="#1b2a3a">normal</text>
  <circle cx="578" cy="174" r="6" fill="#bc4749"/>
  <text x="592" y="179" font-size="13" fill="#1b2a3a">tumour</text>

  <!-- unsupervised note -->
  <text x="60" y="378" font-size="13" fill="#1b2a3a" font-style="italic">unsupervised: labels were never used</text>
</svg>
