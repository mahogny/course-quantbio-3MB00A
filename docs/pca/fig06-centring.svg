<svg xmlns="http://www.w3.org/2000/svg" width="762.6" height="368.1" viewBox="-1.3 0.0 762.6 368.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="axtip" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
    <polygon id="star" points="0,-10 2.351,-3.236 9.511,-3.09 3.804,1.236 5.878,8.09 0,4 -5.878,8.09 -3.804,1.236 -9.511,-3.09 -2.351,-3.236" fill="#bc4749" stroke="#8a2f31" stroke-width="1"/>
  </defs>

  <!-- panel titles -->
  <text x="185" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">raw</text>
  <text x="595" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">centred</text>

  <!-- LEFT panel plot area -->
  <rect x="70" y="60" width="230" height="220" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>

  <!-- left gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="127.5" y1="60" x2="127.5" y2="280"/>
    <line x1="185" y1="60" x2="185" y2="280"/>
    <line x1="242.5" y1="60" x2="242.5" y2="280"/>
    <line x1="70" y1="225" x2="300" y2="225"/>
    <line x1="70" y1="170" x2="300" y2="170"/>
    <line x1="70" y1="115" x2="300" y2="115"/>
  </g>

  <!-- left axes -->
  <line x1="70" y1="280" x2="308" y2="280" stroke="#1b2a3a" stroke-width="2" marker-end="url(#axtip)"/>
  <line x1="70" y1="280" x2="70" y2="52" stroke="#1b2a3a" stroke-width="2" marker-end="url(#axtip)"/>

  <!-- left x ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="middle">
    <text x="70" y="296">0</text>
    <text x="127.5" y="296">2</text>
    <text x="185" y="296">4</text>
    <text x="242.5" y="296">6</text>
    <text x="300" y="296">8</text>
  </g>
  <!-- left y ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="end">
    <text x="64" y="284">2</text>
    <text x="64" y="229">4</text>
    <text x="64" y="174">6</text>
    <text x="64" y="119">8</text>
    <text x="64" y="64">10</text>
  </g>

  <text x="185" y="316" text-anchor="middle" font-size="13" fill="#1b2a3a">GENE_A</text>
  <text x="30" y="170" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 30 170)">GENE_B</text>

  <!-- left data points -->
  <g fill="#2a6f97">
    <circle cx="98.75" cy="197.5" r="5"/>
    <circle cx="156.25" cy="252.5" r="5"/>
    <circle cx="185" cy="170" r="5"/>
    <circle cx="213.75" cy="142.5" r="5"/>
    <circle cx="271.25" cy="87.5" r="5"/>
  </g>
  <g font-size="11" fill="#2a6f97">
    <text x="88" y="193">s1</text>
    <text x="145" y="248">s2</text>
    <text x="192" y="163">s3</text>
    <text x="221" y="138">s4</text>
    <text x="279" y="83">s5</text>
  </g>

  <!-- left centroid star -->
  <use href="#star" transform="translate(185,170)"/>
  <text x="185" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4749">mean (4,6)</text>

  <!-- centre arrow -->
  <line x1="315" y1="170" x2="443" y2="170" stroke="#1b2a3a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="379" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">subtract column means</text>
  <text x="334" y="196" text-anchor="start" font-size="13" fill="#1b2a3a">(μ<tspan font-size="9" dy="3">A</tspan><tspan font-size="13" dy="-3"> = 4,  μ</tspan><tspan font-size="9" dy="3">B</tspan><tspan font-size="13" dy="-3"> = 6)</tspan></text>

  <!-- RIGHT panel plot area -->
  <rect x="480" y="60" width="230" height="220" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>

  <!-- right gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="537.5" y1="60" x2="537.5" y2="280"/>
    <line x1="652.5" y1="60" x2="652.5" y2="280"/>
    <line x1="480" y1="225" x2="710" y2="225"/>
    <line x1="480" y1="115" x2="710" y2="115"/>
  </g>

  <!-- right bold axes crossing at origin -->
  <line x1="480" y1="170" x2="718" y2="170" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#axtip)"/>
  <line x1="595" y1="280" x2="595" y2="52" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#axtip)"/>

  <!-- right ticks -->
  <g font-size="11" fill="#1b2a3a" text-anchor="middle">
    <text x="480" y="296">-4</text>
    <text x="537.5" y="296">-2</text>
    <text x="652.5" y="296">2</text>
    <text x="710" y="296">4</text>
  </g>
  <g font-size="11" fill="#1b2a3a" text-anchor="end">
    <text x="589" y="284">-4</text>
    <text x="589" y="229">-2</text>
    <text x="589" y="119">2</text>
    <text x="589" y="64">4</text>
  </g>

  <text x="578" y="316" text-anchor="start" font-size="13" fill="#1b2a3a">A - μ<tspan font-size="9" dy="3">A</tspan></text>
  <text x="441" y="170" text-anchor="start" font-size="13" fill="#1b2a3a" transform="rotate(-90 458 170)">B - μ<tspan font-size="9" dy="3">B</tspan></text>

  <!-- right data points -->
  <g fill="#2a6f97">
    <circle cx="508.75" cy="197.5" r="5"/>
    <circle cx="566.25" cy="252.5" r="5"/>
    <circle cx="623.75" cy="142.5" r="5"/>
    <circle cx="681.25" cy="87.5" r="5"/>
  </g>

  <!-- right centroid star now at origin -->
  <use href="#star" transform="translate(595,170)"/>
  <text x="612" y="188" font-size="12" font-weight="bold" fill="#bc4749">(0,0)</text>

  <!-- right annotation -->
  <text x="595" y="344" text-anchor="middle" font-size="12.5" fill="#6a994e" font-weight="bold">cloud centred on origin;  each column sums to 0</text>
</svg>
