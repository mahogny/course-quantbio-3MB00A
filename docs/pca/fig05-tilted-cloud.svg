<svg xmlns="http://www.w3.org/2000/svg" width="558.0" height="339.3" viewBox="6.6 19.9 558.0 339.3" font-family="Helvetica, Arial, sans-serif">
  <!-- fig05: tilted, positively-correlated cloud of 5 samples over two genes -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Plot area: x GENE_A 0..8 -> px 90..470 ; y GENE_B 2..10 -> py 300..40 -->

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical: GENE_A 0,2,4,6,8 -->
    <line x1="90"  y1="40" x2="90"  y2="300"/>
    <line x1="185" y1="40" x2="185" y2="300"/>
    <line x1="280" y1="40" x2="280" y2="300"/>
    <line x1="375" y1="40" x2="375" y2="300"/>
    <line x1="470" y1="40" x2="470" y2="300"/>
    <!-- horizontal: GENE_B 2,4,6,8,10 -->
    <line x1="90" y1="300" x2="470" y2="300"/>
    <line x1="90" y1="235" x2="470" y2="235"/>
    <line x1="90" y1="170" x2="470" y2="170"/>
    <line x1="90" y1="105" x2="470" y2="105"/>
    <line x1="90" y1="40"  x2="470" y2="40"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="90" y1="300" x2="470" y2="300" marker-end="url(#arrow)"/>
    <line x1="90" y1="300" x2="90"  y2="40"  marker-end="url(#arrow)"/>
  </g>

  <!-- x tick labels: GENE_A -->
  <g fill="#1b2a3a" font-size="12" text-anchor="middle">
    <text x="90"  y="318">0</text>
    <text x="185" y="318">2</text>
    <text x="280" y="318">4</text>
    <text x="375" y="318">6</text>
    <text x="470" y="318">8</text>
  </g>
  <!-- y tick labels: GENE_B -->
  <g fill="#1b2a3a" font-size="12" text-anchor="end">
    <text x="82" y="304">2</text>
    <text x="82" y="239">4</text>
    <text x="82" y="174">6</text>
    <text x="82" y="109">8</text>
    <text x="82" y="44">10</text>
  </g>

  <!-- axis titles -->
  <text x="280" y="340" fill="#1b2a3a" font-size="16" font-weight="bold" text-anchor="middle">GENE_A</text>
  <text x="34" y="170" fill="#1b2a3a" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90 34 170)">GENE_B</text>

  <!-- faint elongated 'sausage' ellipse, tilted along the diagonal -->
  <!-- centre ~ (4,6) -> px 280, py 170 ; long axis toward top-right -->
  <ellipse cx="280" cy="170" rx="150" ry="46" fill="#2a6f97" fill-opacity="0.12"
           stroke="#2a6f97" stroke-opacity="0.35" stroke-width="1.5"
           transform="rotate(-38 280 170)"/>

  <!-- light dashed diagonal trend line through the cloud -->
  <line x1="120" y1="272" x2="452" y2="70" stroke="#bc4749" stroke-width="1.8"
        stroke-dasharray="7 5" stroke-opacity="0.8"/>

  <!-- data points  s1(1,5) s2(3,3) s3(4,6) s4(5,7) s5(7,9) -->
  <!-- map: px=90+x*47.5 ; py=300-(y-2)*32.5 -->
  <g fill="#1b2a3a">
    <circle cx="137.5" cy="202.5" r="6"/>   <!-- s1 (1,5) -->
    <circle cx="232.5" cy="267.5" r="6"/>   <!-- s2 (3,3) -->
    <circle cx="280"   cy="170"   r="6"/>   <!-- s3 (4,6) -->
    <circle cx="327.5" cy="137.5" r="6"/>   <!-- s4 (5,7) -->
    <circle cx="422.5" cy="72.5"  r="6"/>   <!-- s5 (7,9) -->
  </g>

  <!-- point labels -->
  <g fill="#1b2a3a" font-size="13" font-weight="bold">
    <text x="127" y="196" text-anchor="end">s1</text>
    <text x="243" y="272">s2</text>
    <text x="290" y="164">s3</text>
    <text x="338" y="132">s4</text>
    <text x="412" y="66" text-anchor="end">s5</text>
  </g>

  <!-- annotation -->
  <g font-size="13" fill="#6a994e">
    <text x="500" y="150" text-anchor="middle" font-weight="bold">genes rise</text>
    <text x="500" y="168" text-anchor="middle" font-weight="bold">together →</text>
    <text x="500" y="192" text-anchor="middle">tilted, elongated</text>
    <text x="500" y="208" text-anchor="middle">cloud; PCA finds</text>
    <text x="500" y="224" text-anchor="middle">its long axis</text>
  </g>
</svg>
