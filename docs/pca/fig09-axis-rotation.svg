<svg xmlns="http://www.w3.org/2000/svg" width="492.6" height="411.2" viewBox="135.7 -0.7 492.6 411.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <text x="330" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Principal components are new axes</text>

  <!-- original gene axes: faint grey dashed -->
  <line x1="150" y1="200" x2="500" y2="200" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="320" y1="70"  x2="320" y2="330" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="506" y="204" font-size="13" fill="#8a97a5">GENE_A (centred)</text>
  <text x="320" y="62"  text-anchor="middle" font-size="13" fill="#8a97a5">GENE_B (centred)</text>

  <!-- rotated PC axes: bold solid coloured through origin -->
  <line x1="214" y1="306" x2="426" y2="94" stroke="#2a6f97" stroke-width="2.5"/>
  <line x1="214" y1="94"  x2="426" y2="306" stroke="#6a994e" stroke-width="2.5"/>
  <text x="452" y="86"  font-size="15" font-weight="bold" fill="#2a6f97">PC1</text>
  <text x="430" y="320" font-size="15" font-weight="bold" fill="#6a994e">PC2</text>

  <!-- rotation arc GENE_A toward PC1 -->
  <path d="M 390 200 A 70 70 0 0 0 369.5 150.5" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="400" y="168" font-size="12.5" fill="#bc4749">rotate ~45°</text>

  <!-- origin -->
  <circle cx="320" cy="200" r="2.5" fill="#1b2a3a"/>

  <!-- the same 5 data points (unchanged) -->
  <g fill="#1b2a3a">
    <circle cx="200" cy="240" r="6"/>
    <circle cx="280" cy="320" r="6"/>
    <circle cx="320" cy="200" r="6"/>
    <circle cx="360" cy="160" r="6"/>
    <circle cx="440" cy="80"  r="6"/>
  </g>

  <!-- emphasis note -->
  <text x="330" y="356" text-anchor="middle" font-size="12.5" fill="#1b2a3a">Only the axes changed, not the data.</text>

  <!-- caption -->
  <text x="330" y="378" text-anchor="middle" font-size="12" fill="#5a6672">same points, new description — rotation only, nothing discarded</text>
  <text x="243" y="394" text-anchor="start" font-size="12" fill="#5a6672">(orthonormal:  u<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> &#183; u</tspan><tspan font-size="9" dy="3">j</tspan><tspan dy="-3"> = 0,   ||u</tspan><tspan font-size="9" dy="3">i</tspan><tspan dy="-3">|| = 1)</tspan></text>
</svg>
