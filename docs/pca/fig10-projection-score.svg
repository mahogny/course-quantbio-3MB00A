<svg xmlns="http://www.w3.org/2000/svg" viewBox="139.5 39.8 384.4 333.8" font-family="Helvetica, Arial, sans-serif" width="384.4" height="333.8">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c9d3dd"/>
    </marker>
    <marker id="arrowPC" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- faint GENE reference gridlines (axes through origin) -->
  <line x1="185" y1="200" x2="455" y2="200" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="335" x2="320" y2="55" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="204" font-size="13" fill="#8ea0b2">GENE_A</text>
  <text x="326" y="60" font-size="13" fill="#8ea0b2">GENE_B</text>

  <!-- PC1 direction line through origin at 45 degrees -->
  <line x1="185" y1="335" x2="452" y2="68" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrowPC)"/>
  <text x="328" y="86" font-size="15" fill="#1b2a3a">PC1 direction</text>
  <text x="328" y="104" font-size="15" fill="#1b2a3a">u = (1,1)/√2</text>

  <!-- origin dot -->
  <circle cx="320" cy="200" r="3.5" fill="#1b2a3a"/>
  <text x="326" y="220" font-size="12" fill="#1b2a3a">origin</text>

  <!-- faint centred points -->
  <circle cx="410" cy="140" r="5" fill="#c9d3dd"/>
  <circle cx="380" cy="170" r="5" fill="#c9d3dd"/>
  <circle cx="290" cy="260" r="5" fill="#c9d3dd"/>
  <circle cx="290" cy="200" r="5" fill="#c9d3dd"/>

  <!-- bold score segment along PC1 from origin to foot -->
  <line x1="320" y1="200" x2="260" y2="260" stroke="#2a6f97" stroke-width="4.5" stroke-linecap="round"/>

  <!-- dashed perpendicular from s1 to its foot -->
  <line x1="230" y1="230" x2="260" y2="260" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- right-angle marker at the foot -->
  <path d="M267,253 L260,246 L253,253" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- foot point -->
  <circle cx="260" cy="260" r="4.5" fill="#2a6f97"/>
  <text x="148" y="300" font-size="13" fill="#2a6f97">projection</text>
  <text x="148" y="316" font-size="13" fill="#2a6f97">onto PC1</text>
  <line x1="212" y1="289" x2="259" y2="261" stroke="#2a6f97" stroke-width="1"/>

  <!-- highlighted sample s1 -->
  <circle cx="230" cy="230" r="6.5" fill="#bc4749"/>
  <text x="188" y="220" font-size="14" fill="#bc4749" font-weight="bold">s<tspan font-size="10" dy="3">1</tspan><tspan font-size="14" dy="-3"> = (-3, -1)</tspan></text>

  <!-- score label -->
  <text x="336" y="236" font-size="14" fill="#2a6f97" font-weight="bold">score = x · u</text>
  <text x="336" y="254" font-size="14" fill="#2a6f97" font-weight="bold">= -2√2 ≈ -2.83</text>

  <!-- explanatory note -->
  <text x="320" y="360" font-size="14" fill="#1b2a3a" text-anchor="middle">score = length of the sample's shadow on the PC axis</text>
</svg>
