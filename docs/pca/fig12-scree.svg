<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 40.3 493 339.6" font-family="Helvetica, Arial, sans-serif" width="493" height="339.6">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- plot geometry: origin at (110,270), x to right, y up. y: 0..10 over 200px -> 20px per unit -->

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="110" y1="270" x2="500" y2="270"/>
    <line x1="110" y1="230" x2="500" y2="230"/>
    <line x1="110" y1="190" x2="500" y2="190"/>
    <line x1="110" y1="150" x2="500" y2="150"/>
    <line x1="110" y1="110" x2="500" y2="110"/>
    <line x1="110" y1="70"  x2="500" y2="70"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="110" y1="270" x2="110" y2="55" marker-end="url(#arrow)"/>
    <line x1="110" y1="270" x2="510" y2="270" marker-end="url(#arrow)"/>
  </g>

  <!-- y tick labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="100" y="275">0</text>
    <text x="100" y="235">2</text>
    <text x="100" y="195">4</text>
    <text x="100" y="155">6</text>
    <text x="100" y="115">8</text>
    <text x="100" y="75">10</text>
  </g>

  <!-- y axis title -->
  <text x="52" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 52 170)">variance (eigenvalue)</text>

  <!-- PC1 bar: height 9 -> 180px top at y=90, centered x=210 width 90 -->
  <rect x="165" y="90" width="90" height="180" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <!-- PC2 bar: height 1 -> 20px top at y=250, centered x=380 width 90 -->
  <rect x="335" y="250" width="90" height="20" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- scree connecting line across bar tops -->
  <polyline points="210,90 380,250" fill="none" stroke="#bc4749" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="210" cy="90" r="4" fill="#bc4749"/>
  <circle cx="380" cy="250" r="4" fill="#bc4749"/>

  <!-- bar value labels -->
  <text x="210" y="80" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">9 (90%)</text>
  <text x="392" y="246" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="start">1 (10%)</text>

  <!-- x category labels -->
  <g font-size="15" fill="#1b2a3a" text-anchor="middle">
    <text x="210" y="290">PC1</text>
    <text x="380" y="290">PC2</text>
  </g>

  <!-- note under x-axis -->
  <text x="110" y="316" font-size="12.5" fill="#6a994e">in real data, look for the elbow to decide how many PCs to keep</text>

  <!-- annotation: total variance / trace -->
  <text x="110" y="345" font-size="13" fill="#1b2a3a">total variance = trace(C) = 5 + 5 = 10 = 9 + 1</text>
  <text x="110" y="365" font-size="13" fill="#1b2a3a">fractions sum to 100%</text>
</svg>
