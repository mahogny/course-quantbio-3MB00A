<svg xmlns="http://www.w3.org/2000/svg" width="812.6" height="383.3" viewBox="-2.5 -5.9 812.6 383.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: unscaled -->
  <text x="140" y="30" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">unscaled</text>

  <!-- axes -->
  <line x1="45" y1="230" x2="290" y2="230" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="45" y1="230" x2="45" y2="70" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="255" font-size="13" fill="#1b2a3a" text-anchor="middle">gene X (range 0..10000)</text>
  <text x="30" y="150" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 30 150)">gene Y (0..2)</text>

  <!-- flat wide streak point cloud -->
  <g fill="#2a6f97" opacity="0.75">
    <circle cx="70" cy="164" r="3.2"/><circle cx="88" cy="160" r="3.2"/><circle cx="104" cy="166" r="3.2"/>
    <circle cx="120" cy="159" r="3.2"/><circle cx="138" cy="163" r="3.2"/><circle cx="152" cy="157" r="3.2"/>
    <circle cx="168" cy="165" r="3.2"/><circle cx="184" cy="160" r="3.2"/><circle cx="200" cy="162" r="3.2"/>
    <circle cx="216" cy="158" r="3.2"/><circle cx="232" cy="164" r="3.2"/><circle cx="248" cy="159" r="3.2"/>
    <circle cx="264" cy="163" r="3.2"/><circle cx="79" cy="168" r="3.2"/><circle cx="128" cy="156" r="3.2"/>
    <circle cx="176" cy="167" r="3.2"/><circle cx="224" cy="156" r="3.2"/><circle cx="256" cy="167" r="3.2"/>
  </g>

  <!-- PC1 hijacked, horizontal -->
  <line x1="62" y1="162" x2="272" y2="162" stroke="#bc4749" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="167" y="128" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">PC1 hijacked by units,</text>
  <text x="167" y="144" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">not biology</text>

  <!-- ARROW between panels -->
  <line x1="315" y1="150" x2="475" y2="150" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="395" y="128" font-size="12.5" fill="#1b2a3a" text-anchor="middle">divide each gene by its SD</text>
  <text x="395" y="176" font-size="12.5" fill="#1b2a3a" text-anchor="middle">(→ correlation matrix)</text>

  <!-- RIGHT PANEL: scaled -->
  <text x="640" y="30" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">scaled</text>

  <!-- axes centered -->
  <line x1="510" y1="150" x2="785" y2="150" stroke="#c9d3dd" stroke-width="1.2"/>
  <line x1="647" y1="255" x2="647" y2="55" stroke="#c9d3dd" stroke-width="1.2"/>
  <line x1="530" y1="150" x2="785" y2="150" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="647" y1="250" x2="647" y2="60" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="275" font-size="13" fill="#1b2a3a" text-anchor="middle">gene X (variance = 1)</text>
  <text x="672" y="52" font-size="12" fill="#6a994e" text-anchor="start">range −3..3</text>
  <text x="527" y="90" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 527 90)">gene Y (variance = 1)</text>

  <!-- round-ish diagonal cloud -->
  <g fill="#2a6f97" opacity="0.75">
    <circle cx="600" cy="196" r="3.2"/><circle cx="615" cy="188" r="3.2"/><circle cx="625" cy="178" r="3.2"/>
    <circle cx="633" cy="170" r="3.2"/><circle cx="642" cy="162" r="3.2"/><circle cx="650" cy="154" r="3.2"/>
    <circle cx="658" cy="146" r="3.2"/><circle cx="666" cy="138" r="3.2"/><circle cx="675" cy="128" r="3.2"/>
    <circle cx="685" cy="118" r="3.2"/><circle cx="622" cy="192" r="3.2"/><circle cx="638" cy="176" r="3.2"/>
    <circle cx="654" cy="160" r="3.2"/><circle cx="670" cy="144" r="3.2"/><circle cx="612" cy="176" r="3.2"/>
    <circle cx="628" cy="160" r="3.2"/><circle cx="662" cy="128" r="3.2"/><circle cx="646" cy="144" r="3.2"/>
  </g>

  <!-- PC1 along true diagonal -->
  <line x1="598" y1="200" x2="690" y2="112" stroke="#bc4749" stroke-width="3" marker-end="url(#arrowR)"/>
  <text x="695" y="105" font-size="12.5" fill="#bc4749" text-anchor="start" font-weight="bold">PC1</text>
  <text x="640" y="238" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">every gene equal say</text>

  <!-- CAPTION -->
  <text x="410" y="330" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">scale when units/ranges differ;</text>
  <text x="410" y="352" font-size="14" fill="#1b2a3a" text-anchor="middle">often leave unscaled for comparable log-expression</text>
</svg>
