<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15.0 24.7 902.2 335.8" width="902.2" height="335.8" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT: wide expression matrix -->
  <text x="30" y="70" font-size="17" font-weight="bold" fill="#1b2a3a">expression matrix</text>

  <!-- matrix outer frame, wide aspect ratio -->
  <rect x="30" y="90" width="420" height="150" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- vertical column grid lines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="150" y1="90" x2="150" y2="240"/>
    <line x1="180" y1="90" x2="180" y2="240"/>
    <line x1="210" y1="90" x2="210" y2="240"/>
    <line x1="240" y1="90" x2="240" y2="240"/>
    <line x1="270" y1="90" x2="270" y2="240"/>
    <line x1="300" y1="90" x2="300" y2="240"/>
    <line x1="330" y1="90" x2="330" y2="240"/>
    <line x1="360" y1="90" x2="360" y2="240"/>
    <line x1="390" y1="90" x2="390" y2="240"/>
    <line x1="420" y1="90" x2="420" y2="240"/>
  </g>
  <!-- horizontal row grid lines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="30" y1="120" x2="450" y2="120"/>
    <line x1="30" y1="150" x2="450" y2="150"/>
    <line x1="30" y1="180" x2="450" y2="180"/>
    <line x1="30" y1="210" x2="450" y2="210"/>
  </g>
  <!-- separator after row-label column -->
  <line x1="150" y1="90" x2="150" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- row (sample) labels -->
  <g font-size="12.5" fill="#1b2a3a">
    <text x="40" y="112">tumour_01</text>
    <text x="40" y="142">tumour_02</text>
    <text x="40" y="172">normal_01</text>
    <text x="40" y="202">normal_02</text>
    <text x="85" y="220" fill="#2a6f97" text-anchor="middle" font-size="15"><tspan x="85" dy="0">.</tspan><tspan x="85" dy="5">.</tspan><tspan x="85" dy="5">.</tspan></text>
  </g>

  <!-- a handful of filled data cells -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="middle">
    <text x="165" y="112">8.2</text>
    <text x="225" y="142">0.1</text>
    <text x="285" y="172">5.4</text>
    <text x="345" y="202">2.0</text>
    <text x="255" y="112">3.7</text>
    <text x="375" y="142">0.8</text>
  </g>

  <!-- horizontal ellipsis showing columns continue far right -->
  <text x="435" y="167" font-size="20" fill="#2a6f97" text-anchor="middle">…</text>

  <!-- bracket over the columns labelled 20,000 genes -->
  <path d="M150,80 L150,72 L450,72 L450,80" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="300" y="60" font-size="14" fill="#bc4749" text-anchor="middle" font-weight="bold">20,000 genes</text>

  <!-- rows brace label -->
  <text x="20" y="170" font-size="13" fill="#6a994e" text-anchor="middle" transform="rotate(-90 20 170)">samples</text>

  <!-- MIDDLE: bold PCA arrow -->
  <line x1="470" y1="165" x2="600" y2="165" stroke="#1b2a3a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="530" y="150" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">PCA</text>
  <text x="530" y="200" font-size="13" fill="#2a6f97" text-anchor="middle">thousands of</text>
  <text x="530" y="217" font-size="13" fill="#2a6f97" text-anchor="middle">dimensions → 2</text>

  <!-- RIGHT: small square 2-D scatter -->
  <!-- plot frame -->
  <rect x="640" y="90" width="220" height="220" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <!-- axis labels -->
  <text x="750" y="335" font-size="14" fill="#1b2a3a" text-anchor="middle">PC1</text>
  <text x="615" y="200" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 615 200)">PC2</text>

  <!-- cluster A: upper-left (tumour) -->
  <g fill="#bc4749">
    <circle cx="690" cy="135" r="6"/>
    <circle cx="712" cy="150" r="6"/>
    <circle cx="678" cy="162" r="6"/>
    <circle cx="705" cy="128" r="6"/>
    <circle cx="725" cy="168" r="6"/>
    <circle cx="695" cy="178" r="6"/>
  </g>
  <!-- cluster B: lower-right (normal) -->
  <g fill="#6a994e">
    <circle cx="795" cy="245" r="6"/>
    <circle cx="815" cy="262" r="6"/>
    <circle cx="782" cy="270" r="6"/>
    <circle cx="808" cy="238" r="6"/>
    <circle cx="828" cy="258" r="6"/>
    <circle cx="800" cy="278" r="6"/>
  </g>
</svg>
