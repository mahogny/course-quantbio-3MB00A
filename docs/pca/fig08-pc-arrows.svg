<svg xmlns="http://www.w3.org/2000/svg" width="409.3" height="364.0" viewBox="136.1 36.4 409.3 364.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- tilted covariance ellipse (major axis along PC1 at 45 deg) -->
  <ellipse cx="300" cy="200" rx="171" ry="57" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5" transform="rotate(-45 300 200)"/>

  <!-- axes -->
  <line x1="148" y1="200" x2="452" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="300" y1="352" x2="300" y2="48" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="456" y="204" font-size="13" fill="#1b2a3a">x</text>
  <text x="286" y="58" font-size="13" fill="#1b2a3a">y</text>

  <!-- centred data points -->
  <g fill="#1b2a3a">
    <circle cx="186" cy="238" r="4.5"/>
    <circle cx="262" cy="314" r="4.5"/>
    <circle cx="300" cy="200" r="4.5"/>
    <circle cx="338" cy="162" r="4.5"/>
    <circle cx="414" cy="86"  r="4.5"/>
  </g>

  <!-- PC1 arrow: long, direction (1,1)/sqrt2, length ~ sqrt(9)=3 -->
  <line x1="300" y1="200" x2="380.6" y2="119.4" stroke="#2a6f97" stroke-width="3" marker-end="url(#ahBlue)"/>
  <!-- PC2 arrow: short, direction (1,-1)/sqrt2, length ~ sqrt(1)=1 -->
  <line x1="300" y1="200" x2="326.9" y2="226.9" stroke="#bc4749" stroke-width="3" marker-end="url(#ahRed)"/>

  <!-- right angle marker at origin -->
  <path d="M311.3,188.7 L322.6,200 L311.3,211.3" fill="none" stroke="#1b2a3a" stroke-width="1.3"/>

  <!-- labels -->
  <text x="310" y="68" font-size="15" fill="#2a6f97" font-weight="bold">PC1:  u<tspan font-size="11" dy="4">1</tspan><tspan font-size="15" dy="-4"> = (1,1)/√2,  λ</tspan><tspan font-size="11" dy="4">1</tspan><tspan font-size="15" dy="-4"> = 9</tspan></text>
  <text x="332" y="256" font-size="15" fill="#bc4749" font-weight="bold">PC2:  u<tspan font-size="11" dy="4">2</tspan><tspan font-size="15" dy="-4"> = (1,−1)/√2,  λ</tspan><tspan font-size="11" dy="4">2</tspan><tspan font-size="15" dy="-4"> = 1</tspan></text>

  <!-- annotation -->
  <text x="300" y="386" font-size="14" fill="#1b2a3a" text-anchor="middle">arrow lengths ~ √variance;  9 >> 1</text>
</svg>
