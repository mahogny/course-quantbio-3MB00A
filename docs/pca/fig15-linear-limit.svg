<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 18 572 382" font-family="Helvetica, Arial, sans-serif" width="572" height="382">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- faint plane axes -->
  <path d="M120,330 L120,55 M120,330 L470,330" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- true curved manifold: arrow following the arc -->
  <path d="M 383.5,312.0 L 410.6,289.3 L 431.6,261.0 L 445.6,228.6 L 451.7,193.8 L 449.7,158.6 L 439.6,124.8 L 421.9,94.2 L 397.7,68.6 L 368.2,49.2 L 335.1,37.1 L 300.0,33.0 L 264.9,37.1 L 231.8,49.2 L 202.3,68.6 L 178.1,94.2 L 160.4,124.8 L 150.3,158.6 L 148.3,193.8 L 154.4,228.6 L 168.4,261.0 L 189.4,289.3 L 216.5,312.0" fill="none" stroke="#6a994e" stroke-width="2.5" stroke-linecap="round"
        marker-start="url(#ah)" marker-end="url(#ah)" opacity="0.9"/>

  <!-- the 23 interior points of the horseshoe -->
  <circle cx="368.7" cy="289.4" r="5" fill="#2a6f97"/>
  <circle cx="390.9" cy="270.8" r="5" fill="#2a6f97"/>
  <circle cx="408.3" cy="247.5" r="5" fill="#2a6f97"/>
  <circle cx="419.7" cy="220.9" r="5" fill="#2a6f97"/>
  <circle cx="424.8" cy="192.3" r="5" fill="#2a6f97"/>
  <circle cx="423.1" cy="163.3" r="5" fill="#2a6f97"/>
  <circle cx="414.8" cy="135.5" r="5" fill="#2a6f97"/>
  <circle cx="400.3" cy="110.4" r="5" fill="#2a6f97"/>
  <circle cx="380.3" cy="89.2" r="5" fill="#2a6f97"/>
  <circle cx="356.1" cy="73.3" r="5" fill="#2a6f97"/>
  <circle cx="328.8" cy="63.4" r="5" fill="#2a6f97"/>
  <circle cx="300.0" cy="60.0" r="5" fill="#2a6f97"/>
  <circle cx="271.2" cy="63.4" r="5" fill="#2a6f97"/>
  <circle cx="243.9" cy="73.3" r="5" fill="#2a6f97"/>
  <circle cx="219.7" cy="89.2" r="5" fill="#2a6f97"/>
  <circle cx="199.7" cy="110.4" r="5" fill="#2a6f97"/>
  <circle cx="185.2" cy="135.5" r="5" fill="#2a6f97"/>
  <circle cx="176.9" cy="163.3" r="5" fill="#2a6f97"/>
  <circle cx="175.2" cy="192.3" r="5" fill="#2a6f97"/>
  <circle cx="180.3" cy="220.9" r="5" fill="#2a6f97"/>
  <circle cx="191.7" cy="247.5" r="5" fill="#2a6f97"/>
  <circle cx="209.1" cy="270.8" r="5" fill="#2a6f97"/>
  <circle cx="231.3" cy="289.4" r="5" fill="#2a6f97"/>

  <!-- the two end points of the curve -->
  <circle cx="342.8" cy="302.5" r="7" fill="#bc4749" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="257.2" cy="302.5" r="7" fill="#bc4749" stroke="#ffffff" stroke-width="1.5"/>

  <!-- BOLD straight PC1 line: best-fit direction, chord across the arc -->
  <line x1="150" y1="182" x2="452" y2="168" stroke="#bc4749" stroke-width="3.5" stroke-linecap="round"/>
  <text x="300" y="142" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">PC1: straight-line combination</text>
  <text x="300" y="158" font-size="12" fill="#bc4749" text-anchor="middle">(best-fit straight direction)</text>

  <!-- short straight double-arrow between the two ends: what PCA "sees" -->
  <line x1="266.2" y1="316.5" x2="333.8" y2="316.5"
        stroke="#bc4749" stroke-width="2" stroke-dasharray="5 3"
        marker-start="url(#ahr)" marker-end="url(#ahr)"/>
  <text x="300" y="348" font-size="12.5" fill="#bc4749" text-anchor="middle">short straight-line gap → PC1 mixes the ends up</text>

  <!-- annotation: far apart along the true curve -->
  <text x="500" y="120" font-size="13.5" font-weight="bold" fill="#6a994e">curved structure</text>
  <text x="500" y="138" font-size="13.5" font-weight="bold" fill="#6a994e">not captured</text>
  <text x="500" y="158" font-size="12.5" fill="#4a6a3e">far apart along</text>
  <text x="500" y="174" font-size="12.5" fill="#4a6a3e">the true curve</text>
  <path d="M498,150 C470,150 452,140 439,128" fill="none" stroke="#6a994e" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- side note: unsupervised -->
  <rect x="470" y="205" width="196" height="56" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="482" y="226" font-size="12.5" font-weight="bold" fill="#1b2a3a">unsupervised:</text>
  <text x="482" y="243" font-size="12" fill="#1b2a3a">optimises variance,</text>
  <text x="482" y="256" font-size="12" fill="#1b2a3a">not class separation</text>

  <!-- caption -->
  <text x="391" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">PCA is linear; non-linear methods (t-SNE, UMAP) capture curved manifolds — later</text>
</svg>