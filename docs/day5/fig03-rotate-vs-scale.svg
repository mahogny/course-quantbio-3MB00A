<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a97a3"/>
    </marker>
    <marker id="ahBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6a994e"/>
    </marker>
    <marker id="ahAxis" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- light grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="80" y1="30" x2="80" y2="350"/>
    <line x1="160" y1="30" x2="160" y2="350"/>
    <line x1="240" y1="30" x2="240" y2="350"/>
    <line x1="320" y1="30" x2="320" y2="350"/>
    <line x1="400" y1="30" x2="400" y2="350"/>
    <line x1="80" y1="350" x2="430" y2="350"/>
    <line x1="80" y1="270" x2="430" y2="270"/>
    <line x1="80" y1="190" x2="430" y2="190"/>
    <line x1="80" y1="110" x2="430" y2="110"/>
    <line x1="80" y1="30"  x2="430" y2="30"/>
  </g>

  <!-- 45-degree eigen-line guide -->
  <line x1="80" y1="350" x2="376" y2="54" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="80" y1="350" x2="435" y2="350" marker-end="url(#ahAxis)"/>
    <line x1="80" y1="350" x2="80" y2="22" marker-end="url(#ahAxis)"/>
  </g>
  <text x="443" y="355" font-size="16" fill="#1b2a3a">x</text>
  <text x="72" y="20" font-size="16" fill="#1b2a3a" text-anchor="end">y</text>
  <circle cx="80" cy="350" r="2.5" fill="#1b2a3a"/>
  <text x="70" y="366" font-size="13" fill="#1b2a3a">O</text>

  <!-- matrix label -->
  <g font-size="16" fill="#1b2a3a">
    <text x="500" y="52">A =</text>
    <text x="546" y="45" font-size="15">2  1</text>
    <text x="546" y="65" font-size="15">1  2</text>
    <line x1="538" y1="30" x2="538" y2="72" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="600" y1="30" x2="600" y2="72" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>

  <!-- INPUT vectors: thin dashed gray -->
  <g stroke="#8a97a3" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="80" y1="350" x2="160" y2="350" marker-end="url(#ahGray)"/>
    <line x1="80" y1="350" x2="80"  y2="270" marker-end="url(#ahGray)"/>
    <line x1="80" y1="350" x2="160" y2="270" marker-end="url(#ahGray)"/>
  </g>
  <text x="118" y="368" font-size="12" fill="#8a97a3">(1,0)</text>
  <text x="40"  y="300" font-size="12" fill="#8a97a3">(0,1)</text>
  <text x="118" y="262" font-size="12" fill="#8a97a3">(1,1)</text>

  <!-- OUTPUT (2,1) blue -->
  <line x1="80" y1="350" x2="240" y2="270" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ahBlue)"/>
  <text x="250" y="272" font-size="13" fill="#2a6f97" font-weight="bold">(2,1)</text>
  <text x="250" y="303" font-size="13" fill="#bc4749">direction changed</text>

  <!-- OUTPUT (1,2) blue -->
  <line x1="80" y1="350" x2="160" y2="190" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ahBlue)"/>
  <text x="122" y="180" font-size="13" fill="#2a6f97" font-weight="bold">(1,2)</text>
  <text x="18"  y="150" font-size="13" fill="#bc4749">direction</text>
  <text x="18"  y="166" font-size="13" fill="#bc4749">changed</text>

  <!-- OUTPUT (3,3) green eigenvector -->
  <line x1="80" y1="350" x2="320" y2="110" stroke="#6a994e" stroke-width="4" marker-end="url(#ahGreen)"/>
  <text x="330" y="108" font-size="13" fill="#6a994e" font-weight="bold">(3,3)</text>
  <text x="330" y="132" font-size="14" fill="#6a994e" font-weight="bold">same line, ×3</text>
  <text x="330" y="150" font-size="13" fill="#6a994e">the eigenvector</text>

  <!-- caption -->
  <text x="360" y="390" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">rotation is the rule, pure scaling the exception.</text>
</svg>
