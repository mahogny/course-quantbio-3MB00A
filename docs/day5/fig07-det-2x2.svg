<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===================== LEFT: determinant ===================== -->
  <text x="180" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Determinant of a 2×2</text>

  <!-- bracket left -->
  <path d="M92,72 L82,72 L82,192 L92,192" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <!-- bracket right -->
  <path d="M268,72 L278,72 L278,192 L268,192" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- entries -->
  <text x="130" y="112" font-size="30" fill="#1b2a3a" text-anchor="middle" font-style="italic">a</text>
  <text x="230" y="112" font-size="30" fill="#1b2a3a" text-anchor="middle" font-style="italic">b</text>
  <text x="130" y="170" font-size="30" fill="#1b2a3a" text-anchor="middle" font-style="italic">c</text>
  <text x="230" y="170" font-size="30" fill="#1b2a3a" text-anchor="middle" font-style="italic">d</text>

  <!-- main diagonal arrow a -> d (red, +ad) -->
  <line x1="142" y1="118" x2="218" y2="160" stroke="#bc4749" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="252" y="150" font-size="17" fill="#bc4749" font-weight="bold">+ad</text>

  <!-- anti-diagonal arrow b -> c (blue, -bc) -->
  <line x1="218" y1="118" x2="142" y2="160" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="88" y="150" font-size="17" fill="#2a6f97" font-weight="bold" text-anchor="end">−bc</text>

  <!-- formula -->
  <text x="180" y="248" font-size="22" fill="#1b2a3a" text-anchor="middle">det =
    <tspan fill="#bc4749" font-weight="bold">ad</tspan>
    <tspan fill="#1b2a3a"> − </tspan>
    <tspan fill="#2a6f97" font-weight="bold">bc</tspan>
  </text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="320" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===================== RIGHT: A - λI ===================== -->
  <text x="620" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Building A − λI</text>

  <!-- highlight tints on diagonal cells -->
  <rect x="470" y="78" width="130" height="52" rx="6" fill="#fff3b0" stroke="#e0c341" stroke-width="1.5"/>
  <rect x="640" y="136" width="130" height="52" rx="6" fill="#fff3b0" stroke="#e0c341" stroke-width="1.5"/>

  <!-- bracket left -->
  <path d="M470,68 L460,68 L460,198 L470,198" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <!-- bracket right -->
  <path d="M770,68 L780,68 L780,198 L770,198" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- entries -->
  <text x="535" y="112" font-size="24" fill="#1b2a3a" text-anchor="middle" font-style="italic">a − λ</text>
  <text x="705" y="112" font-size="30" fill="#1b2a3a" text-anchor="middle" font-style="italic">b</text>
  <text x="535" y="170" font-size="30" fill="#1b2a3a" text-anchor="middle" font-style="italic">c</text>
  <text x="705" y="170" font-size="24" fill="#1b2a3a" text-anchor="middle" font-style="italic">d − λ</text>

  <!-- caption -->
  <text x="620" y="248" font-size="14" fill="#1b2a3a" text-anchor="middle">subtract λ from the diagonal entries only</text>
  <text x="620" y="268" font-size="14" fill="#1b2a3a" text-anchor="middle">— off-diagonals untouched</text>
</svg>
