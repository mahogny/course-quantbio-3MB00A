<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1120" height="330" fill="white"/>
<rect x="15" y="20" width="190" height="64" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="110" y="47" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">raw counts</text>
<text x="110" y="68" font-size="15" fill="#5b6b7a" text-anchor="middle">genes × samples</text>
<rect x="15" y="110" width="190" height="64" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="110" y="137" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">sample table</text>
<text x="110" y="158" font-size="15" fill="#5b6b7a" text-anchor="middle">batch, sex, treatment</text>
<rect x="232" y="60" width="340" height="70" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="402" y="90" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">DESeqDataSetFromMatrix(</text>
<text x="402" y="110" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">design = ~ batch + sex + treatment)</text>
<line x1="207" y1="55" x2="230" y2="82" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="207" y1="140" x2="230" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="402" y="50" font-size="13" fill="#5b6b7a" text-anchor="middle">the design formula from covariates</text>
<rect x="590" y="15" width="330" height="165" rx="8" fill="#ffffff" stroke="#2a6f97" stroke-width="2"/>
<text x="755" y="40" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold" font-family="monospace">DESeq(dds)</text>
<rect x="605" y="60" width="300" height="30" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="620" y="80" font-size="15" fill="#2a6f97" text-anchor="start" font-weight="bold">1</text>
<text x="640" y="80" font-size="13.5" fill="#1b2a3a" text-anchor="start">size factors: how deep was each sample</text>
<rect x="605" y="98" width="300" height="44" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="620" y="118" font-size="15" fill="#2a6f97" text-anchor="start" font-weight="bold">2</text>
<text x="640" y="118" font-size="13.5" fill="#1b2a3a" text-anchor="start">a count model per gene: noise depends</text>
<text x="640" y="135" font-size="13.5" fill="#1b2a3a" text-anchor="start">on the mean count (week 4)</text>
<rect x="605" y="150" width="300" height="30" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="620" y="170" font-size="15" fill="#2a6f97" text-anchor="start" font-weight="bold">3</text>
<text x="640" y="170" font-size="13.5" fill="#1b2a3a" text-anchor="start">a test for each coefficient</text>
<line x1="574" y1="95" x2="588" y2="95" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="590" y="225" width="330" height="80" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="755" y="252" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">results(dds, name =</text>
<text x="755" y="272" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">"treatment_treat_vs_ctrl")</text>
<text x="755" y="293" font-size="13" fill="#5b6b7a" text-anchor="middle">baseMean, log2FoldChange, lfcSE, padj</text>
<line x1="755" y1="182" x2="755" y2="223" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="955" y="225" width="155" height="80" rx="8" fill="#fbeeee" stroke="#bc4749" stroke-width="2"/>
<text x="1032" y="252" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">lfcShrink()</text>
<text x="1032" y="272" font-size="13" fill="#5b6b7a" text-anchor="middle">pull noisy fold</text>
<text x="1032" y="290" font-size="13" fill="#5b6b7a" text-anchor="middle">changes to 0</text>
<line x1="922" y1="265" x2="953" y2="265" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300" y="250" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">test with padj,</text>
<text x="300" y="270" font-size="14" fill="#1b2a3a" text-anchor="middle">rank and plot with the shrunken fold change</text>
</svg>