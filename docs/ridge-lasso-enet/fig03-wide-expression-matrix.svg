<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.0 15.7 654.5 282.3" font-family="Helvetica, Arial, sans-serif" width="654.5" height="282.3">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- title label for the design matrix -->
  <text x="70" y="52" fill="#1b2a3a" font-size="15">
    <tspan font-size="24" font-style="italic" font-weight="bold">X</tspan>
    <tspan dx="4">: gene-expression matrix</tspan>
  </text>

  <!-- genes axis label and arrow spanning full width -->
  <text x="310" y="82" fill="#2a6f97" font-size="16" font-weight="bold" text-anchor="middle">genes  (p = 20,000)</text>
  <line x1="70" y1="94" x2="550" y2="94" stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- design matrix X : wide and short (480 x 80) -->
  <rect x="70" y="110" width="480" height="80" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- scattered expression-value cells (darker) -->
  <rect x="118" y="120" width="24" height="10" fill="#2a6f97" opacity="0.55"/>
  <rect x="286" y="140" width="24" height="10" fill="#2a6f97" opacity="0.55"/>
  <rect x="406" y="170" width="24" height="10" fill="#2a6f97" opacity="0.55"/>
  <rect x="478" y="130" width="24" height="10" fill="#2a6f97" opacity="0.55"/>
  <rect x="190" y="160" width="24" height="10" fill="#2a6f97" opacity="0.55"/>
  <!-- medium cells -->
  <rect x="166" y="150" width="24" height="10" fill="#2a6f97" opacity="0.30"/>
  <rect x="334" y="110" width="24" height="10" fill="#2a6f97" opacity="0.30"/>
  <rect x="238" y="170" width="24" height="10" fill="#2a6f97" opacity="0.30"/>
  <rect x="430" y="150" width="24" height="10" fill="#2a6f97" opacity="0.30"/>
  <rect x="94" y="180" width="24" height="10" fill="#2a6f97" opacity="0.30"/>
  <rect x="502" y="160" width="24" height="10" fill="#2a6f97" opacity="0.30"/>
  <!-- lighter cells -->
  <rect x="214" y="130" width="24" height="10" fill="#ffffff" opacity="0.75"/>
  <rect x="358" y="160" width="24" height="10" fill="#ffffff" opacity="0.75"/>
  <rect x="142" y="170" width="24" height="10" fill="#ffffff" opacity="0.75"/>
  <rect x="454" y="120" width="24" height="10" fill="#ffffff" opacity="0.75"/>
  <rect x="310" y="180" width="24" height="10" fill="#ffffff" opacity="0.75"/>

  <!-- faint grid: vertical lines every 24, horizontal every 10 -->
  <path d="M70 110V190 M94 110V190 M118 110V190 M142 110V190 M166 110V190 M190 110V190 M214 110V190 M238 110V190 M262 110V190 M286 110V190 M310 110V190 M334 110V190 M358 110V190 M382 110V190 M406 110V190 M430 110V190 M454 110V190 M478 110V190 M502 110V190 M526 110V190 M550 110V190 M70 120H550 M70 130H550 M70 140H550 M70 150H550 M70 160H550 M70 170H550 M70 180H550" stroke="#c9d3dd" stroke-width="1" fill="none"/>

  <!-- patients axis: label and short vertical arrow down the left edge -->
  <text x="40" y="150" fill="#bc4749" font-size="15" font-weight="bold" text-anchor="middle" transform="rotate(-90 40 150)">patients (n = 40)</text>
  <line x1="58" y1="110" x2="58" y2="190" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- gap, then the phenotype vector y : same height as X -->
  <text x="617" y="82" fill="#6a994e" font-size="24" font-style="italic" font-weight="bold" text-anchor="middle">y</text>
  <rect x="600" y="110" width="34" height="80" fill="#eef4e9" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="600" y="110" width="34" height="10" fill="#6a994e" opacity="0.50"/>
  <rect x="600" y="120" width="34" height="10" fill="#6a994e" opacity="0.22"/>
  <rect x="600" y="130" width="34" height="10" fill="#6a994e" opacity="0.62"/>
  <rect x="600" y="140" width="34" height="10" fill="#ffffff" opacity="0.65"/>
  <rect x="600" y="150" width="34" height="10" fill="#6a994e" opacity="0.35"/>
  <rect x="600" y="160" width="34" height="10" fill="#6a994e" opacity="0.55"/>
  <rect x="600" y="170" width="34" height="10" fill="#6a994e" opacity="0.20"/>
  <rect x="600" y="180" width="34" height="10" fill="#6a994e" opacity="0.45"/>
  <path d="M600 120H634 M600 130H634 M600 140H634 M600 150H634 M600 160H634 M600 170H634 M600 180H634" stroke="#c9d3dd" stroke-width="1" fill="none"/>
  <text x="617" y="207" fill="#6a994e" font-size="12.5" text-anchor="middle">phenotype</text>
  <text x="617" y="221" fill="#6a994e" font-size="12.5" text-anchor="middle">(n = 40)</text>

  <!-- bold mismatch annotation (>> renders reliably; the Unicode much-greater-than glyph is dropped by cairosvg) -->
  <text x="213" y="250" fill="#1b2a3a" font-size="26" font-weight="bold" text-anchor="start" xml:space="preserve">p = 20,000  <tspan fill="#bc4749">&gt;&gt;</tspan>  n = 40</text>

  <!-- caption -->
  <text x="337" y="281" fill="#1b2a3a" font-size="15" text-anchor="middle">far more columns than rows &#8594; OLS underdetermined &amp; unstable</text>
</svg>
