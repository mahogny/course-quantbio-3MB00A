<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 8 737 362" width="737" height="362" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL : RIDGE ============ -->
  <g transform="translate(20,10)">
    <text x="112" y="28" font-size="18" font-weight="600" fill="#1b2a3a">Ridge:  ∑ β<tspan font-size="12" dy="4">j</tspan><tspan font-size="12" dy="-8">2</tspan><tspan font-size="18" dy="4"> ≤ t</tspan></text>

    <!-- axes -->
    <line x1="60" y1="250" x2="312" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="150" y1="322" x2="150" y2="86" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="318" y="255" font-size="15" fill="#1b2a3a">β<tspan font-size="11" dy="3">1</tspan></text>
    <text x="140" y="82" font-size="15" fill="#1b2a3a">β<tspan font-size="11" dy="3">2</tspan></text>

    <!-- RSS contour family (blue ellipses, centred on OLS) -->
    <g transform="rotate(-35 260 170)" fill="none" stroke-width="1.6">
      <ellipse cx="260" cy="170" rx="35"  ry="19"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="108" ry="59"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="138" ry="76"  stroke="#9dc3de"/>
      <!-- smallest ellipse that just touches the circle -->
      <ellipse cx="260" cy="170" rx="76"  ry="42"  stroke="#2a6f97" stroke-width="2.4"/>
    </g>

    <!-- ridge constraint: red disk at origin -->
    <circle cx="150" cy="250" r="60" fill="#bc4749" fill-opacity="0.12" stroke="#bc4749" stroke-width="2"/>

    <!-- OLS point -->
    <circle cx="260" cy="170" r="4.5" fill="#1b2a3a"/>
    <text x="270" y="164" font-size="15" fill="#1b2a3a">β&#770;<tspan font-size="11" dy="3">OLS</tspan></text>

    <!-- touch point (generic, both coords nonzero) -->
    <circle cx="195" cy="210" r="5" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="211" y1="293" x2="199" y2="214" stroke="#1b2a3a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="210" y="300" font-size="14" fill="#1b2a3a">touches at a generic point →</text>
    <text x="210" y="318" font-size="14" fill="#1b2a3a">both coefficients nonzero</text>
  </g>

  <!-- ============ RIGHT PANEL : LASSO ============ -->
  <g transform="translate(420,10)">
    <text x="112" y="28" font-size="18" font-weight="600" fill="#1b2a3a">Lasso:  ∑ |β<tspan font-size="12" dy="4">j</tspan><tspan font-size="18" dy="-4">| ≤ t</tspan></text>

    <!-- axes -->
    <line x1="60" y1="250" x2="312" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="150" y1="322" x2="150" y2="86" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="318" y="255" font-size="15" fill="#1b2a3a">β<tspan font-size="11" dy="3">1</tspan></text>
    <text x="140" y="82" font-size="15" fill="#1b2a3a">β<tspan font-size="11" dy="3">2</tspan></text>

    <!-- SAME RSS contour family -->
    <g transform="rotate(-35 260 170)" fill="none" stroke-width="1.6">
      <ellipse cx="260" cy="170" rx="35"  ry="19"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="76"  ry="42"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="108" ry="59"  stroke="#9dc3de"/>
      <!-- smallest ellipse that just touches the diamond corner -->
      <ellipse cx="260" cy="170" rx="138" ry="76"  stroke="#2a6f97" stroke-width="2.4"/>
    </g>

    <!-- lasso constraint: red diamond at origin (corners on the axes) -->
    <polygon points="220,250 150,180 80,250 150,320" fill="#bc4749" fill-opacity="0.12" stroke="#bc4749" stroke-width="2"/>

    <!-- OLS point -->
    <circle cx="260" cy="170" r="4.5" fill="#1b2a3a"/>
    <text x="270" y="164" font-size="15" fill="#1b2a3a">β&#770;<tspan font-size="11" dy="3">OLS</tspan></text>

    <!-- touch point at TOP corner on the beta2-axis -->
    <circle cx="150" cy="180" r="5" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="212" y1="200" x2="158" y2="182" stroke="#1b2a3a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="216" y="204" font-size="14" fill="#1b2a3a">touches at a corner</text>
    <text x="216" y="222" font-size="14" fill="#1b2a3a">on the axis →  β<tspan font-size="11" dy="3">1</tspan><tspan font-size="14" dy="-3"> = 0</tspan></text>
  </g>

  <!-- shared caption -->
  <text x="440" y="356" text-anchor="middle" font-size="15" font-style="italic" fill="#1b2a3a">the penalized estimate is where the smallest RSS ellipse first meets the budget region.</text>
</svg>
