<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 25.3 651.1 379.9" font-family="Helvetica, Arial, sans-serif" width="651.1" height="379.9">
  <style>
    :root{
      --ink:#1b2a3a; --muted:#c9d3dd; --axis:#5a6b7a;
      --lasso:#bc4749; --ridge:#2a6f97; --enet:#3d7a2a;
      --enetfill:#6a994e; --panel:#ffffff;
    }
    @media (prefers-color-scheme: dark){
      :root{ --ink:#e8eef4; --muted:#3a4657; --axis:#93a3b3;
        --lasso:#e06b6d; --ridge:#5aa6d0; --enet:#8fc470;
        --enetfill:#8fc470; --panel:#12202e; }
    }
    :root[data-theme="light"]{
      --ink:#1b2a3a; --muted:#c9d3dd; --axis:#5a6b7a;
      --lasso:#bc4749; --ridge:#2a6f97; --enet:#3d7a2a;
      --enetfill:#6a994e; --panel:#ffffff;
    }
    :root[data-theme="dark"]{
      --ink:#e8eef4; --muted:#3a4657; --axis:#93a3b3;
      --lasso:#e06b6d; --ridge:#5aa6d0; --enet:#8fc470;
      --enetfill:#8fc470; --panel:#12202e;
    }
    .ink{ fill:var(--ink); }
    .cap{ fill:var(--ink); }
  </style>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="var(--ink)"/>
    </marker>
    <marker id="ahc" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="var(--axis)"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="330" y1="345" x2="330" y2="45"  stroke="var(--axis)" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="170" y1="195" x2="500" y2="195" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="505" y="199" class="ink" font-size="15" font-style="italic">&#946;&#8321;</text>
  <text x="338" y="55"  class="ink" font-size="15" font-style="italic">&#946;&#8322;</text>
  <circle cx="330" cy="195" r="2.2" fill="var(--axis)"/>
  <text x="318" y="210" class="ink" font-size="11" opacity="0.7">0</text>

  <!-- ridge circle : alpha = 0 -->
  <circle cx="330" cy="195" r="125" fill="none" stroke="var(--ridge)" stroke-width="1.8" stroke-dasharray="2 5"/>

  <!-- lasso diamond : alpha = 1 -->
  <polygon points="330,70 455,195 330,320 205,195" fill="none" stroke="var(--lasso)" stroke-width="1.8" stroke-dasharray="8 5"/>

  <!-- elastic net rounded diamond : alpha = 0.5 (the star) -->
  <path d="M 330.0,70.0 L 342.5,76.7 L 355.0,84.2 L 367.5,92.6 L 380.0,102.1 L 392.5,112.7 L 405.0,124.7 L 417.5,138.4 L 430.0,154.2 L 442.5,172.6 L 455.0,195.0 L 442.5,217.4 L 430.0,235.8 L 417.5,251.6 L 405.0,265.3 L 392.5,277.3 L 380.0,287.9 L 367.5,297.4 L 355.0,305.8 L 342.5,313.3 L 330.0,320.0 L 317.5,313.3 L 305.0,305.8 L 292.5,297.4 L 280.0,287.9 L 267.5,277.3 L 255.0,265.3 L 242.5,251.6 L 230.0,235.8 L 217.5,217.4 L 205.0,195.0 L 217.5,172.6 L 230.0,154.2 L 242.5,138.4 L 255.0,124.7 L 267.5,112.7 L 280.0,102.1 L 292.5,92.6 L 305.0,84.2 L 317.5,76.7 L 330.0,70.0 Z"
        fill="var(--enetfill)" fill-opacity="0.16" stroke="var(--enet)" stroke-width="2.6"/>

  <!-- callout: corner kept -> sparsity (points to right corner) -->
  <line x1="527" y1="278" x2="454" y2="197" stroke="var(--axis)" stroke-width="1.3" marker-end="url(#ahc)"/>
  <circle cx="455" cy="195" r="3.4" fill="var(--enet)"/>
  <text x="512" y="296" class="ink" font-size="12.5" font-weight="bold">corners kept</text>
  <text x="512" y="312" class="ink" font-size="12">&#8594; still selects (sparsity)</text>

  <!-- callout: rounded side -> grouping (points to bulging upper-right side) -->
  <line x1="527" y1="108" x2="410" y2="127" stroke="var(--axis)" stroke-width="1.3" marker-end="url(#ahc)"/>
  <circle cx="405" cy="124.7" r="3.4" fill="var(--enet)"/>
  <text x="512" y="96"  class="ink" font-size="12.5" font-weight="bold">rounded sides</text>
  <text x="512" y="112" class="ink" font-size="12">&#8594; correlated genes</text>
  <text x="512" y="127" class="ink" font-size="12">&#160;&#160;&#160;grouped together</text>

  <!-- legend (top left) -->
  <g transform="translate(24,58)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="var(--lasso)" stroke-width="1.8" stroke-dasharray="8 5"/>
    <text x="32" y="4" class="ink" font-size="12.5">&#945; = 1  (lasso)</text>
    <line x1="0" y1="20" x2="26" y2="20" stroke="var(--ridge)" stroke-width="1.8" stroke-dasharray="2 5"/>
    <text x="32" y="24" class="ink" font-size="12.5">&#945; = 0  (ridge)</text>
    <line x1="0" y1="40" x2="26" y2="40" stroke="var(--enet)" stroke-width="2.6"/>
    <text x="32" y="44" class="ink" font-size="12.5" font-weight="bold">&#945; = 0.5  (elastic net)</text>
  </g>

  <!-- caption -->
  <text x="350" y="384" text-anchor="middle" class="cap" font-size="13.5">
    elastic net = a tunable mix; corners give feature selection, roundness gives the grouping effect.
  </text>
</svg>
