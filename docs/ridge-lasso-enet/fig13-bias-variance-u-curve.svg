<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.4 25.3 666.1 382.2" font-family="Helvetica, Arial, sans-serif" width="666.1" height="382.2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="320" x2="80" y2="46" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="320" x2="646" y2="320" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text transform="translate(30,190) rotate(-90)" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">prediction error</text>

  <!-- region labels -->
  <text x="92" y="74" font-size="14" font-weight="bold" fill="#bc4749">overfit</text>
  <text x="92" y="90" font-size="12" fill="#1b2a3a">low bias, high variance</text>
  <text x="640" y="86" text-anchor="end" font-size="14" font-weight="bold" fill="#bc4749">underfit</text>
  <text x="640" y="102" text-anchor="end" font-size="12" fill="#1b2a3a">high bias, low variance</text>

  <!-- test / CV error: U-shape (red, solid) -->
  <path d="M 80 106 C 165 215, 260 258, 340 256 C 430 254, 560 178, 620 152" fill="none" stroke="#bc4749" stroke-width="2.4"/>

  <!-- training error: monotone, lowest at far left (blue, dashed) -->
  <path d="M 80 300 C 250 288, 430 246, 620 206" fill="none" stroke="#2a6f97" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="120" y="310" font-size="12" fill="#2a6f97">← lowest at λ→0; can't be used to pick λ</text>

  <!-- best lambda: minimum of the U -->
  <line x1="340" y1="256" x2="340" y2="320" stroke="#6a994e" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="340" cy="256" r="5.2" fill="#bc4749" stroke="#ffffff" stroke-width="1"/>

  <!-- legend -->
  <rect x="250" y="56" width="216" height="52" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="264" y1="76" x2="296" y2="76" stroke="#2a6f97" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="304" y="80" font-size="13" fill="#1b2a3a">training error</text>
  <line x1="264" y1="96" x2="296" y2="96" stroke="#bc4749" stroke-width="2.4"/>
  <text x="304" y="100" font-size="13" fill="#1b2a3a">test / CV error</text>

  <!-- axis end annotations -->
  <text x="84" y="339" font-size="12.5" fill="#1b2a3a">small λ = OLS</text>
  <text x="340" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a994e">best λ</text>
  <text x="644" y="339" text-anchor="end" font-size="12.5" fill="#1b2a3a">large λ → β = 0 (flat line at mean y)</text>
  <text x="360" y="360" text-anchor="middle" font-size="13" fill="#1b2a3a">log(λ) increases →</text>

  <!-- caption -->
  <text x="340" y="386" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1b2a3a">training error alone would always choose OLS; cross-validation finds the λ that predicts NEW data best.</text>
</svg>
