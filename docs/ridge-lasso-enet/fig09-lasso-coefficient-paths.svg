<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.0 -0.6 711.2 367.4" font-family="Helvetica, Arial, sans-serif" width="711.2" height="367.4">
  <style>
    .ink   { fill: #1b2a3a; }
    .axis  { stroke: #1b2a3a; }
    .grid  { stroke: #c9d3dd; }
    .zero  { stroke: #7b8a99; }
    .tint  { fill: #eaf1f7; }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #e8eef4; }
      .axis { stroke: #cdd7e0; }
      .grid { stroke: #48586a; }
      .zero { stroke: #8b9aab; }
      .tint { fill: #223243; }
    }
  </style>

  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" class="ink"/>
  </marker>

  <text x="30" y="34" class="ink" font-size="19" font-weight="bold">Lasso: coefficients hit exactly 0, one by one.</text>

  <!-- faint vertical gridlines at two crossing lambdas -->
  <line class="grid" x1="230" y1="60" x2="230" y2="308" stroke-width="1" stroke-dasharray="3 4"/>
  <line class="grid" x1="440" y1="60" x2="440" y2="308" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="230" y="326" class="ink" font-size="12" text-anchor="middle" opacity="0.7">λ_1</text>
  <text x="440" y="326" class="ink" font-size="12" text-anchor="middle" opacity="0.7">λ_4</text>

  <!-- zero line -->
  <line class="zero" x1="90" y1="200" x2="628" y2="200" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="634" y="197" class="ink" font-size="12">β = 0</text>

  <!-- axes -->
  <line class="axis" x1="90" y1="60"  x2="90"  y2="308" stroke-width="2" marker-start="url(#arrow)"/>
  <line class="axis" x1="90" y1="308" x2="640" y2="308" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="70" class="ink" font-size="15" text-anchor="end">coefficient β</text>
  <text transform="translate(70,150) rotate(-90)" class="ink" font-size="15" text-anchor="middle" x="0" y="0" font-style="italic">β_j</text>
  <text x="470" y="344" class="ink" font-size="15">log(λ)  (more shrinkage →)</text>

  <!-- piecewise linear coefficient paths: descend then rest exactly on zero -->
  <!-- c1 blue -->
  <polyline points="90,82 160,120 230,200 628,200" fill="none" stroke="#2a6f97" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- c2 green -->
  <polyline points="90,104 200,150 300,200 628,200" fill="none" stroke="#6a994e" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- c3 red (negative, rises to zero) -->
  <polyline points="90,292 220,250 370,200 628,200" fill="none" stroke="#bc4749" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- c4 orange -->
  <polyline points="90,132 280,172 440,200 628,200" fill="none" stroke="#d98c00" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- c5 purple -->
  <polyline points="90,150 350,186 510,200 628,200" fill="none" stroke="#8256a3" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- c6 dark (negative, two kinks) -->
  <polyline points="90,272 300,240 450,216 560,200 628,200" fill="none" stroke="#1b2a3a" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- hollow circles where each path meets the zero axis -->
  <g fill="#ffffff" stroke-width="2">
    <circle cx="230" cy="200" r="4.5" stroke="#2a6f97"/>
    <circle cx="300" cy="200" r="4.5" stroke="#6a994e"/>
    <circle cx="370" cy="200" r="4.5" stroke="#bc4749"/>
    <circle cx="440" cy="200" r="4.5" stroke="#d98c00"/>
    <circle cx="510" cy="200" r="4.5" stroke="#8256a3"/>
    <circle cx="560" cy="200" r="4.5" stroke="#1b2a3a"/>
  </g>

  <!-- annotation -->
  <rect class="tint" x="352" y="72" width="288" height="52" rx="6"/>
  <text x="366" y="92" class="ink" font-size="12.5">each coefficient reaches exactly 0 and the</text>
  <text x="366" y="109" class="ink" font-size="12.5">gene is dropped → sparse model / selection.</text>
</svg>
