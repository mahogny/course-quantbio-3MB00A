<svg xmlns="http://www.w3.org/2000/svg" width="716.0" height="373.0" viewBox="-10.3 37.5 716.0 373.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shaded 95 percent credible interval under the curve, b = 0.001 to 0.035 -->
  <path d="M188.0,283.5 L230.9,238.8 L273.8,174.2 L316.7,108.3 L370.4,70 L424.0,108.3 L466.9,174.2 L509.8,238.8 L552.7,283.5 L552.7,320 L188.0,320 Z"
        fill="#2a6f97" fill-opacity="0.20"/>

  <!-- credible interval endpoint ticks -->
  <line x1="188.0" y1="320" x2="188.0" y2="283.5" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="552.7" y1="320" x2="552.7" y2="283.5" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- posterior density curve -->
  <path d="M70,318.6 L123.6,312.6 L177.3,291.1 L188.0,283.5 L230.9,238.8 L273.8,174.2 L316.7,108.3 L370.4,70 L424.0,108.3 L466.9,174.2 L509.8,238.8 L552.7,283.5 L595.6,306.7 L638.5,316.1 L660,318"
        fill="none" stroke="#2a6f97" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- dashed line at b = 0, sitting just left of the shaded region -->
  <line x1="177.3" y1="320" x2="177.3" y2="98" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="177.3" y="88" text-anchor="middle" font-size="15" fill="#bc4749" font-weight="bold">b = 0</text>

  <!-- axes -->
  <line x1="58" y1="320" x2="685" y2="320" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="58" y1="320" x2="58" y2="58" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="20" y="195" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 20 195)">posterior density</text>

  <!-- x axis reference ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="284.5" y1="320" x2="284.5" y2="325"/>
    <line x1="391.8" y1="320" x2="391.8" y2="325"/>
    <line x1="499.1" y1="320" x2="499.1" y2="325"/>
    <line x1="606.4" y1="320" x2="606.4" y2="325"/>
  </g>
  <g font-size="12" fill="#5a6b7a" text-anchor="middle">
    <text x="284.5" y="338">0.01</text>
    <text x="391.8" y="338">0.02</text>
    <text x="499.1" y="338">0.03</text>
    <text x="606.4" y="338">0.04</text>
  </g>

  <!-- credible interval endpoint labels -->
  <g font-size="13" fill="#2a6f97" font-weight="bold" text-anchor="middle">
    <text x="188.0" y="338">0.001</text>
    <text x="552.7" y="338">0.035</text>
  </g>

  <!-- band annotation -->
  <text x="370.4" y="292" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">95% credible interval</text>

  <!-- x axis title -->
  <text x="371" y="362" text-anchor="middle" font-size="14" fill="#1b2a3a">slope b (change in log-expression per year)</text>

  <!-- caption -->
  <text x="371" y="388" text-anchor="middle" font-size="14" fill="#1b2a3a" font-style="italic">the whole distribution, not one number</text>
</svg>
