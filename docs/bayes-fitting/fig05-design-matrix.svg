<svg xmlns="http://www.w3.org/2000/svg" viewBox="30.5 33.9 460 362.9" width="460" height="362.9" font-family="Helvetica, Arial, sans-serif">
  <!-- Recap: the least squares fit  |  design matrix layout for y = X beta + epsilon -->

  <!-- ===================== y vector (expression) ===================== -->
  <text x="80" y="64" font-size="20" font-style="italic" fill="#1b2a3a" text-anchor="middle">y</text>
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="55" y="80"  width="50" height="28" fill="#eaf1f7"/>
    <rect x="55" y="108" width="50" height="28" fill="#eaf1f7"/>
    <rect x="55" y="136" width="50" height="28" fill="#eaf1f7"/>
    <rect x="55" y="164" width="50" height="28" fill="#eaf1f7"/>
    <rect x="55" y="192" width="50" height="28" fill="#eaf1f7"/>
    <rect x="55" y="220" width="50" height="28" fill="#eaf1f7"/>
  </g>
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <text x="80" y="99">4.1</text>
    <text x="80" y="127">4.3</text>
    <text x="80" y="155">4.0</text>
    <text x="80" y="183">4.6</text>
    <text x="80" y="211">4.5</text>
    <text x="80" y="239">4.8</text>
  </g>
  <!-- brackets -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <path d="M 52 80 L 47 80 L 47 248 L 52 248"/>
    <path d="M 108 80 L 113 80 L 113 248 L 108 248"/>
  </g>
  <text x="80" y="270" font-size="13" fill="#2a6f97" text-anchor="middle">expression</text>

  <!-- ===================== equals ===================== -->
  <text x="134" y="172" font-size="26" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- ===================== X design matrix ===================== -->
  <text x="216" y="64" font-size="18" fill="#1b2a3a" text-anchor="middle">X  (design matrix)</text>
  <!-- column 1: intercept (1s), light blue -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="160" y="80"  width="48" height="28" fill="#dbe8f2"/>
    <rect x="160" y="108" width="48" height="28" fill="#dbe8f2"/>
    <rect x="160" y="136" width="48" height="28" fill="#dbe8f2"/>
    <rect x="160" y="164" width="48" height="28" fill="#dbe8f2"/>
    <rect x="160" y="192" width="48" height="28" fill="#dbe8f2"/>
    <rect x="160" y="220" width="48" height="28" fill="#dbe8f2"/>
  </g>
  <!-- column 2: age, light orange -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="208" y="80"  width="64" height="28" fill="#fde3c8"/>
    <rect x="208" y="108" width="64" height="28" fill="#fde3c8"/>
    <rect x="208" y="136" width="64" height="28" fill="#fde3c8"/>
    <rect x="208" y="164" width="64" height="28" fill="#fde3c8"/>
    <rect x="208" y="192" width="64" height="28" fill="#fde3c8"/>
    <rect x="208" y="220" width="64" height="28" fill="#fde3c8"/>
  </g>
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <text x="184" y="99">1</text>
    <text x="184" y="127">1</text>
    <text x="184" y="155">1</text>
    <text x="184" y="183">1</text>
    <text x="184" y="211">1</text>
    <text x="184" y="239">1</text>
    <text x="240" y="99">31</text>
    <text x="240" y="127">45</text>
    <text x="240" y="155">52</text>
    <text x="240" y="183">60</text>
    <text x="240" y="211">68</text>
    <text x="240" y="239">74</text>
  </g>
  <!-- brackets -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <path d="M 157 80 L 152 80 L 152 248 L 157 248"/>
    <path d="M 275 80 L 280 80 L 280 248 L 275 248"/>
  </g>
  <!-- column captions -->
  <text x="184" y="266" font-size="12.5" fill="#2a6f97" text-anchor="middle">intercept</text>
  <text x="184" y="281" font-size="12.5" fill="#2a6f97" text-anchor="middle">(coef a)</text>
  <text x="240" y="266" font-size="12.5" fill="#c9772e" text-anchor="middle">age</text>
  <text x="240" y="281" font-size="12.5" fill="#c9772e" text-anchor="middle">→ slope b</text>

  <!-- ===================== beta vector ===================== -->
  <text x="320" y="64" font-size="20" font-style="italic" fill="#1b2a3a" text-anchor="middle">β</text>
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="296" y="124" width="48" height="40" fill="#eaf1f7"/>
    <rect x="296" y="164" width="48" height="40" fill="#eaf1f7"/>
  </g>
  <g font-size="16" font-style="italic" fill="#1b2a3a" text-anchor="middle">
    <text x="320" y="149">a</text>
    <text x="320" y="189">b</text>
  </g>
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <path d="M 293 124 L 288 124 L 288 204 L 293 204"/>
    <path d="M 347 124 L 352 124 L 352 204 L 347 204"/>
  </g>
  <text x="320" y="228" font-size="12.5" fill="#6a994e" text-anchor="middle">coefficients</text>

  <!-- ===================== plus ===================== -->
  <text x="384" y="172" font-size="26" fill="#1b2a3a" text-anchor="middle">+</text>

  <!-- ===================== epsilon vector ===================== -->
  <text x="440" y="64" font-size="18" fill="#1b2a3a" text-anchor="middle">ε</text>
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="414" y="80"  width="52" height="28" fill="#f3f3f0"/>
    <rect x="414" y="108" width="52" height="28" fill="#f3f3f0"/>
    <rect x="414" y="136" width="52" height="28" fill="#f3f3f0"/>
    <rect x="414" y="164" width="52" height="28" fill="#f3f3f0"/>
    <rect x="414" y="192" width="52" height="28" fill="#f3f3f0"/>
    <rect x="414" y="220" width="52" height="28" fill="#f3f3f0"/>
  </g>
  <g font-size="14" fill="#1b2a3a">
    <text x="433" y="99">ε<tspan font-size="10" dy="3">1</tspan></text>
    <text x="433" y="127">ε<tspan font-size="10" dy="3">2</tspan></text>
    <text x="433" y="155">ε<tspan font-size="10" dy="3">3</tspan></text>
    <text x="433" y="183">ε<tspan font-size="10" dy="3">4</tspan></text>
    <text x="433" y="211">ε<tspan font-size="10" dy="3">5</tspan></text>
    <text x="433" y="239">ε<tspan font-size="10" dy="3">6</tspan></text>
  </g>
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <path d="M 411 80 L 406 80 L 406 248 L 411 248"/>
    <path d="M 469 80 L 474 80 L 474 248 L 469 248"/>
  </g>
  <text x="440" y="270" font-size="13" fill="#2a6f97" text-anchor="middle">noise</text>

  <!-- ===================== normal equations ===================== -->
  <line x1="47" y1="312" x2="474" y2="312" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="157" y="352" font-size="23" fill="#1b2a3a">β-hat  =  ( X<tspan font-size="15" dy="-8">T</tspan><tspan dy="8"> X )</tspan><tspan font-size="15" dy="-8">-1</tspan><tspan dy="8"> X</tspan><tspan font-size="15" dy="-8">T</tspan><tspan dy="8"> y</tspan></text>
  <text x="260.5" y="378" font-size="13" fill="#6a994e" text-anchor="middle">least-squares solution (normal equations)</text>
</svg>
