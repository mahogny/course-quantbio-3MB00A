<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.2 3.0 673.9 367.9" font-family="Helvetica, Arial, sans-serif" width="673.9" height="367.9">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- model equation -->
  <text x="92" y="34" font-size="16" fill="#1b2a3a">y_i = a + b·x_i + noise,&#160;&#160;&#160;noise ~ Normal(0, &#963;&#178;)</text>

  <!-- axes -->
  <line x1="90" y1="320" x2="632" y2="320" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="90" y1="320" x2="90" y2="52" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="588" y="342" font-size="15" fill="#1b2a3a">age (x)</text>
  <text transform="rotate(-90 34 195)" x="34" y="195" font-size="15" fill="#1b2a3a" text-anchor="middle">expression (y)</text>

  <!-- mean guide lines under the bells -->
  <line x1="250" y1="182.7" x2="250" y2="302.7" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="520" y1="86.1" x2="520" y2="206.1" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- regression line -->
  <line x1="90" y1="300" x2="620" y2="110.1" stroke="#2a6f97" stroke-width="2.6"/>

  <!-- vertical Gaussian bells centred on the line -->
  <path d="M250.78,182.7 L252.4,192.7 L256.1,202.7 L262.6,212.7 L271.2,222.7 L278.9,232.7 L282,242.7 L278.9,252.7 L271.2,262.7 L262.6,272.7 L256.1,282.7 L252.4,292.7 L250.78,302.7 Z" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.8"/>
  <path d="M520.78,86.1 L522.4,96.1 L526.1,106.1 L532.6,116.1 L541.2,126.1 L548.9,136.1 L552,146.1 L548.9,156.1 L541.2,166.1 L532.6,176.1 L526.1,186.1 L522.4,196.1 L520.78,206.1 Z" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.8"/>

  <!-- sigma half-width bracket on the right bell (centre to +1 sigma) -->
  <path d="M556,146.1 L562,146.1 L562,168.1 L556,168.1" fill="none" stroke="#6a994e" stroke-width="1.6"/>
  <text x="568" y="161" font-size="14" fill="#6a994e">&#963; (noise scale)</text>

  <!-- residual segments (point to line) -->
  <line x1="190" y1="279" x2="190" y2="264.2" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="450" y1="181" x2="450" y2="171.1" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="580" y1="133" x2="580" y2="124.6" stroke="#1b2a3a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="196" y="277" font-size="12" fill="#1b2a3a">residual</text>

  <!-- data points -->
  <circle cx="130" cy="275" r="4.5" fill="#bc4749"/>
  <circle cx="190" cy="279" r="4.5" fill="#bc4749"/>
  <circle cx="250" cy="233" r="4.5" fill="#bc4749"/>
  <circle cx="310" cy="234" r="4.5" fill="#bc4749"/>
  <circle cx="380" cy="186" r="4.5" fill="#bc4749"/>
  <circle cx="450" cy="181" r="4.5" fill="#bc4749"/>
  <circle cx="520" cy="139" r="4.5" fill="#bc4749"/>
  <circle cx="580" cy="133" r="4.5" fill="#bc4749"/>

  <!-- slope triangle -->
  <line x1="300" y1="224.8" x2="370" y2="224.8" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="370" y1="224.8" x2="370" y2="199.8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="378" y="206" font-size="13" fill="#1b2a3a">b (slope)</text>
  <text x="378" y="221" font-size="13" fill="#1b2a3a">= change per year</text>

  <!-- intercept marker -->
  <circle cx="90" cy="300" r="4.5" fill="#2a6f97"/>
  <line x1="112" y1="336" x2="93" y2="303" stroke="#1b2a3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="108" y="349" font-size="14" fill="#2a6f97">a (intercept)</text>
</svg>
