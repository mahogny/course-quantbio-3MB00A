<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">many slopes fit ~15 scattered donors</text>

  <!-- minimal gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="195" x2="600" y2="195"/>
    <line x1="90" y1="111.7" x2="600" y2="111.7"/>
    <line x1="90" y1="278.3" x2="600" y2="278.3"/>
  </g>

  <!-- faint candidate slopes (different slopes, all through cloud centre) -->
  <g stroke="#c9d3dd" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="107.6" y1="199.2" x2="572.2" y2="190.8"/>
    <line x1="107.6" y1="236.7" x2="572.2" y2="153.3"/>
    <line x1="107.6" y1="270.0" x2="572.2" y2="120.0"/>
    <line x1="107.6" y1="178.3" x2="572.2" y2="211.7"/>
    <line x1="107.6" y1="220.0" x2="572.2" y2="170.0"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="90" y1="320" x2="612" y2="320" marker-end="url(#arrow)"/>
    <line x1="90" y1="320" x2="90" y2="55" marker-end="url(#arrow)"/>
  </g>

  <!-- x ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="136.4" y1="320" x2="136.4" y2="325"/>
    <line x1="229.1" y1="320" x2="229.1" y2="325"/>
    <line x1="321.8" y1="320" x2="321.8" y2="325"/>
    <line x1="414.5" y1="320" x2="414.5" y2="325"/>
    <line x1="507.3" y1="320" x2="507.3" y2="325"/>
    <line x1="600" y1="320" x2="600" y2="325"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="136.4" y="339">30</text>
    <text x="229.1" y="339">40</text>
    <text x="321.8" y="339">50</text>
    <text x="414.5" y="339">60</text>
    <text x="507.3" y="339">70</text>
    <text x="600" y="339">80</text>
  </g>
  <text x="351" y="365" text-anchor="middle" font-size="15" fill="#1b2a3a">donor age (years)</text>

  <!-- y ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="85" y1="320" x2="90" y2="320"/>
    <line x1="85" y1="236.7" x2="90" y2="236.7"/>
    <line x1="85" y1="153.3" x2="90" y2="153.3"/>
    <line x1="85" y1="70" x2="90" y2="70"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="80" y="324">3.5</text>
    <text x="80" y="240.7">4.0</text>
    <text x="80" y="157.3">4.5</text>
    <text x="80" y="74">5.0</text>
  </g>
  <text x="26" y="188" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 26 188)">log-expression (normalised RNA-seq)</text>

  <!-- data points -->
  <g fill="#1b2a3a">
    <circle cx="117.8" cy="278.3" r="5.5"/>
    <circle cx="136.4" cy="211.7" r="5.5"/>
    <circle cx="173.5" cy="245.0" r="5.5"/>
    <circle cx="210.5" cy="178.3" r="5.5"/>
    <circle cx="247.6" cy="261.7" r="5.5"/>
    <circle cx="275.5" cy="186.7" r="5.5"/>
    <circle cx="303.3" cy="228.3" r="5.5"/>
    <circle cx="340.4" cy="161.7" r="5.5"/>
    <circle cx="368.2" cy="245.0" r="5.5"/>
    <circle cx="396.0" cy="145.0" r="5.5"/>
    <circle cx="433.1" cy="203.3" r="5.5"/>
    <circle cx="470.2" cy="136.7" r="5.5"/>
    <circle cx="507.3" cy="211.7" r="5.5"/>
    <circle cx="544.4" cy="128.3" r="5.5"/>
    <circle cx="581.5" cy="170.0" r="5.5"/>
  </g>
</svg>
