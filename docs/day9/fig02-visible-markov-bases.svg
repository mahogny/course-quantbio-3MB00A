<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb0bf"/>
    </marker>
  </defs>

  <!-- ===== thin, unlabelled transitions (muted) ===== -->
  <g stroke="#9fb0bf" stroke-width="1.6" fill="none">
    <!-- C -> A (top return) -->
    <line x1="464" y1="131" x2="236" y2="131" marker-end="url(#ahMuted)"/>
    <!-- C -> G (right edge) -->
    <line x1="521" y1="166" x2="521" y2="224" marker-end="url(#ahMuted)"/>
    <!-- G -> C (right edge) -->
    <line x1="499" y1="224" x2="499" y2="166" marker-end="url(#ahMuted)"/>
    <!-- G -> T (bottom edge) -->
    <line x1="464" y1="281" x2="236" y2="281" marker-end="url(#ahMuted)"/>
    <!-- T -> G (bottom edge) -->
    <line x1="236" y1="259" x2="464" y2="259" marker-end="url(#ahMuted)"/>
    <!-- T -> A (left return) -->
    <line x1="201" y1="224" x2="201" y2="166" marker-end="url(#ahMuted)"/>
    <!-- G -> A (diagonal return) -->
    <line x1="465.4" y1="256.8" x2="228.6" y2="145.8" marker-end="url(#ahMuted)"/>
    <!-- self loops -->
    <path d="M549.5,94.5 C587.6,70.4 559.6,42.4 535.5,80.5" marker-end="url(#ahMuted)"/>
    <path d="M549.5,295.5 C587.6,319.6 559.6,347.6 535.5,309.5" marker-end="url(#ahMuted)"/>
    <path d="M150.5,295.5 C112.4,319.6 140.4,347.6 164.5,309.5" marker-end="url(#ahMuted)"/>
  </g>

  <!-- ===== labelled transitions out of A (accent blue) ===== -->
  <g stroke="#2a6f97" stroke-width="2.4" fill="none">
    <!-- A -> C (top edge) -->
    <line x1="236" y1="109" x2="464" y2="109" marker-end="url(#ahBlue)"/>
    <!-- A -> T (left edge) -->
    <line x1="179" y1="166" x2="179" y2="224" marker-end="url(#ahBlue)"/>
    <!-- A -> G (diagonal) -->
    <line x1="234.6" y1="133.2" x2="471.4" y2="244.2" marker-end="url(#ahBlue)"/>
    <!-- A self loop -->
    <path d="M150.5,94.5 C112.4,70.4 140.4,42.4 164.5,80.5" marker-end="url(#ahBlue)"/>
  </g>

  <!-- ===== nodes ===== -->
  <g>
    <!-- A (emphasised) -->
    <circle cx="190" cy="120" r="46" fill="#dcebf6" stroke="#2a6f97" stroke-width="3"/>
    <text x="190" y="132" text-anchor="middle" font-size="36" font-weight="bold" fill="#1b2a3a">A</text>
    <!-- C -->
    <circle cx="510" cy="120" r="46" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <text x="510" y="132" text-anchor="middle" font-size="36" font-weight="bold" fill="#1b2a3a">C</text>
    <!-- G -->
    <circle cx="510" cy="270" r="46" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <text x="510" y="282" text-anchor="middle" font-size="36" font-weight="bold" fill="#1b2a3a">G</text>
    <!-- T -->
    <circle cx="190" cy="270" r="46" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <text x="190" y="282" text-anchor="middle" font-size="36" font-weight="bold" fill="#1b2a3a">T</text>
  </g>

  <!-- ===== probability labels for A's transitions ===== -->
  <g font-size="16" fill="#2a6f97" font-weight="bold">
    <text x="350" y="100" text-anchor="middle">A→C = 0.2</text>
    <text x="118" y="118" text-anchor="middle">A→A = 0.3</text>
    <text x="312" y="158" text-anchor="middle">A→G = 0.3</text>
    <text x="118" y="202" text-anchor="middle">A→T = 0.2</text>
  </g>
  <text x="350" y="216" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">(row A of P sums to 1)</text>

  <!-- ===== caption banner ===== -->
  <rect x="60" y="360" width="600" height="40" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="360" y="381" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">State = the letter you read — nothing is hidden.</text>
  <text x="360" y="396" text-anchor="middle" font-size="12" fill="#6a994e">every state is directly observed (a visible Markov chain)</text>
</svg>
