<svg xmlns="http://www.w3.org/2000/svg" width="725.0" height="410.9" viewBox="9.9 -6.0 725.0 410.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="30" y="30" font-size="20" font-weight="bold" fill="#1b2a3a">Shrinkage, drawn</text>

  <!-- biomarker axis -->
  <line x1="200" y1="58" x2="200" y2="348" stroke="#1b2a3a" stroke-width="1.4"/>
  <text x="150" y="205" font-size="14" fill="#1b2a3a" transform="rotate(-90 150 205)" text-anchor="middle">biomarker</text>

  <!-- column headers -->
  <text x="250" y="52" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">raw mean</text>
  <text x="500" y="52" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">shrunken estimate</text>

  <!-- grand mean dashed line -->
  <line x1="200" y1="200" x2="560" y2="200" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="205" y="194" font-size="13" fill="#1b2a3a" font-style="italic">grand mean</text>

  <!-- ===== Patient 1  n=2  red (big move) ===== -->
  <line x1="250" y1="80" x2="500" y2="145" stroke="#bc4749" stroke-width="3"/>
  <circle cx="250" cy="80" r="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="2"/>
  <circle cx="500" cy="145" r="6" fill="#bc4749"/>
  <text x="238" y="84" font-size="12" fill="#bc4749" text-anchor="end">n=2</text>

  <!-- ===== Patient 2  medium  blue ===== -->
  <line x1="250" y1="120" x2="500" y2="162" stroke="#2a6f97" stroke-width="2.4"/>
  <circle cx="250" cy="120" r="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="500" cy="162" r="6" fill="#2a6f97"/>

  <!-- ===== Patient 3  n=20  green (tiny move) ===== -->
  <line x1="250" y1="165" x2="500" y2="172" stroke="#6a994e" stroke-width="2"/>
  <circle cx="250" cy="165" r="6" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <circle cx="500" cy="172" r="6" fill="#6a994e"/>
  <text x="238" y="169" font-size="12" fill="#6a994e" text-anchor="end">n=20</text>

  <!-- ===== Patient 4  n=20  green (tiny move) ===== -->
  <line x1="250" y1="240" x2="500" y2="232" stroke="#6a994e" stroke-width="2"/>
  <circle cx="250" cy="240" r="6" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <circle cx="500" cy="232" r="6" fill="#6a994e"/>
  <text x="238" y="244" font-size="12" fill="#6a994e" text-anchor="end">n=20</text>

  <!-- ===== Patient 5  medium  blue ===== -->
  <line x1="250" y1="285" x2="500" y2="248" stroke="#2a6f97" stroke-width="2.4"/>
  <circle cx="250" cy="285" r="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="500" cy="248" r="6" fill="#2a6f97"/>

  <!-- ===== Patient 6  n=2  red (big move) ===== -->
  <line x1="250" y1="330" x2="500" y2="258" stroke="#bc4749" stroke-width="3"/>
  <circle cx="250" cy="330" r="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="2"/>
  <circle cx="500" cy="258" r="6" fill="#bc4749"/>
  <text x="238" y="334" font-size="12" fill="#bc4749" text-anchor="end">n=2</text>

  <!-- ===== annotations ===== -->
  <!-- small/noisy move most -->
  <text x="576" y="332" font-size="13" fill="#bc4749">small / noisy groups</text>
  <text x="576" y="348" font-size="13" fill="#bc4749">move most</text>
  <line x1="568" y1="326" x2="506" y2="264" stroke="#bc4749" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- high-n barely move -->
  <text x="576" y="222" font-size="13" fill="#6a994e">high-n groups barely</text>
  <text x="576" y="238" font-size="13" fill="#6a994e">move · earned their spot</text>
  <line x1="572" y1="228" x2="508" y2="232" stroke="#6a994e" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- never past the grand mean -->
  <text x="576" y="150" font-size="13" fill="#1b2a3a">never past the</text>
  <text x="576" y="166" font-size="13" fill="#1b2a3a">grand mean</text>
  <line x1="600" y1="172" x2="554" y2="199" stroke="#1b2a3a" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- movement legend -->
  <text x="30" y="382" font-size="12" fill="#1b2a3a">line colour = movement:</text>
  <line x1="188" y1="378" x2="212" y2="378" stroke="#bc4749" stroke-width="3"/>
  <text x="218" y="382" font-size="12" fill="#bc4749">large</text>
  <line x1="262" y1="378" x2="286" y2="378" stroke="#2a6f97" stroke-width="2.4"/>
  <text x="292" y="382" font-size="12" fill="#2a6f97">medium</text>
  <line x1="352" y1="378" x2="376" y2="378" stroke="#6a994e" stroke-width="2"/>
  <text x="382" y="382" font-size="12" fill="#6a994e">small</text>
</svg>
