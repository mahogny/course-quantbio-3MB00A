<svg xmlns="http://www.w3.org/2000/svg" width="593.6" height="391.5" viewBox="23.2 -4.0 593.6 391.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="3">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">The replicate question</text>

  <!-- divider -->
  <line x1="320" y1="44" x2="320" y2="330" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- LEFT PANEL -->
  <text x="160" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Biological replicates</text>

  <!-- P1 green -->
  <g>
    <circle cx="70" cy="110" r="14" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.5"/>
    <path d="M52,150 Q52,124 70,124 Q88,124 88,150 Z" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.5"/>
    <text x="70" y="168" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">P1</text>
  </g>
  <!-- P2 blue (broader) -->
  <g>
    <circle cx="160" cy="110" r="16" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <path d="M138,150 Q138,122 160,122 Q182,122 182,150 Z" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="160" y="168" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">P2</text>
  </g>
  <!-- P3 red (narrow) -->
  <g>
    <circle cx="250" cy="110" r="12" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.5"/>
    <path d="M236,150 Q236,126 250,126 Q264,126 264,150 Z" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.5"/>
    <text x="250" y="168" text-anchor="middle" font-size="13" fill="#bc4749" font-weight="bold">P3</text>
  </g>

  <!-- bracket -->
  <path d="M55,190 L55,200 L265,200 L265,190" fill="none" stroke="#1b2a3a" stroke-width="1.2"/>
  <line x1="160" y1="200" x2="160" y2="210" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="160" y="228" text-anchor="middle" font-size="12.5" fill="#1b2a3a">independent units</text>
  <text x="160" y="245" text-anchor="middle" font-size="12.5" fill="#1b2a3a">→ biological variation</text>
  <text x="160" y="262" text-anchor="middle" font-size="12.5" fill="#1b2a3a">(generalise to population)</text>

  <!-- RIGHT PANEL -->
  <text x="480" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Technical replicates</text>

  <!-- one patient P1 blue -->
  <g>
    <circle cx="480" cy="92" r="14" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <path d="M462,130 Q462,106 480,106 Q498,106 498,130 Z" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="480" y="148" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">P1</text>
  </g>

  <!-- single blood tube -->
  <g>
    <rect x="472" y="158" width="16" height="30" rx="3" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.5"/>
    <rect x="472" y="176" width="16" height="12" rx="3" fill="#bc4749" opacity="0.5"/>
    <text x="510" y="178" font-size="11" fill="#1b2a3a">blood tube</text>
  </g>

  <!-- branching arrows -->
  <path d="M478,190 L440,214" fill="none" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M482,190 L520,214" fill="none" stroke="#1b2a3a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- assay 1 (same blue) -->
  <g>
    <rect x="418" y="220" width="14" height="26" rx="3" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <rect x="418" y="234" width="14" height="12" rx="3" fill="#2a6f97" opacity="0.5"/>
    <text x="425" y="262" text-anchor="middle" font-size="11.5" fill="#2a6f97">assay 1</text>
  </g>
  <!-- assay 2 (same blue) -->
  <g>
    <rect x="528" y="220" width="14" height="26" rx="3" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <rect x="528" y="234" width="14" height="12" rx="3" fill="#2a6f97" opacity="0.5"/>
    <text x="535" y="262" text-anchor="middle" font-size="11.5" fill="#2a6f97">assay 2</text>
  </g>

  <!-- bracket right -->
  <path d="M405,278 L405,288 L555,288 L555,278" fill="none" stroke="#1b2a3a" stroke-width="1.2"/>
  <line x1="480" y1="288" x2="480" y2="298" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="480" y="315" text-anchor="middle" font-size="12.5" fill="#1b2a3a">same unit remeasured</text>
  <text x="480" y="332" text-anchor="middle" font-size="12.5" fill="#1b2a3a">→ measurement/assay noise only</text>

  <!-- bottom caption -->
  <line x1="40" y1="348" x2="600" y2="348" stroke="#c9d3dd" stroke-width="1"/>
  <text x="320" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">n for generalising = number of biological units (here 3), not total measurements</text>
</svg>
