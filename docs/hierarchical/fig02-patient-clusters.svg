<svg xmlns="http://www.w3.org/2000/svg" viewBox="28.3 -2.7 621.3 382.9" width="621.3" height="382.9" font-family="Helvetica, Arial, sans-serif">
  <!-- transparent background, no fill rect -->

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">30 measurements, but only 6 patients</text>

  <!-- Plot geometry: x axis biomarker value, lanes y from 70 to 300 -->
  <!-- grand mean vertical dashed line at x=340 spanning lanes -->
  <line x1="340" y1="62" x2="340" y2="322" stroke="#1b2a3a" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="340" y="340" text-anchor="middle" font-size="14" fill="#1b2a3a">grand mean</text>

  <!-- Horizontal axis -->
  <line x1="70" y1="322" x2="600" y2="322" stroke="#c9d3dd" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="70" y="360" text-anchor="start" font-size="13" fill="#1b2a3a">low</text>
  <text x="600" y="360" text-anchor="end" font-size="13" fill="#1b2a3a">high</text>
  <text x="335" y="360" text-anchor="middle" font-size="14" fill="#1b2a3a">biomarker value</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c9d3dd"/>
    </marker>
  </defs>

  <!-- Lanes: 6 lanes, each y-center, cluster center cx, dots tightly around cx -->

  <!-- P1: mean left of grand mean -->
  <g>
    <text x="60" y="76" text-anchor="end" font-size="13" fill="#1b2a3a">P1</text>
    <line x1="70" y1="72" x2="600" y2="72" stroke="#eaf1f7" stroke-width="12"/>
    <circle cx="245" cy="70" r="3" fill="#2a6f97"/>
    <circle cx="252" cy="74" r="3" fill="#2a6f97"/>
    <circle cx="258" cy="69" r="3" fill="#2a6f97"/>
    <circle cx="250" cy="72" r="3" fill="#2a6f97"/>
    <circle cx="263" cy="73" r="3" fill="#2a6f97"/>
    <circle cx="254" cy="72" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  </g>

  <!-- P2 -->
  <g>
    <text x="60" y="116" text-anchor="end" font-size="13" fill="#1b2a3a">P2</text>
    <line x1="70" y1="112" x2="600" y2="112" stroke="#eaf1f7" stroke-width="12"/>
    <circle cx="392" cy="110" r="3" fill="#2a6f97"/>
    <circle cx="400" cy="114" r="3" fill="#2a6f97"/>
    <circle cx="406" cy="109" r="3" fill="#2a6f97"/>
    <circle cx="398" cy="112" r="3" fill="#2a6f97"/>
    <circle cx="410" cy="113" r="3" fill="#2a6f97"/>
    <circle cx="401" cy="112" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  </g>

  <!-- P3 -->
  <g>
    <text x="60" y="156" text-anchor="end" font-size="13" fill="#1b2a3a">P3</text>
    <line x1="70" y1="152" x2="600" y2="152" stroke="#eaf1f7" stroke-width="12"/>
    <circle cx="300" cy="150" r="3" fill="#2a6f97"/>
    <circle cx="308" cy="154" r="3" fill="#2a6f97"/>
    <circle cx="314" cy="149" r="3" fill="#2a6f97"/>
    <circle cx="305" cy="152" r="3" fill="#2a6f97"/>
    <circle cx="318" cy="153" r="3" fill="#2a6f97"/>
    <circle cx="309" cy="152" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  </g>

  <!-- P4 -->
  <g>
    <text x="60" y="196" text-anchor="end" font-size="13" fill="#1b2a3a">P4</text>
    <line x1="70" y1="192" x2="600" y2="192" stroke="#eaf1f7" stroke-width="12"/>
    <circle cx="430" cy="190" r="3" fill="#2a6f97"/>
    <circle cx="438" cy="194" r="3" fill="#2a6f97"/>
    <circle cx="444" cy="189" r="3" fill="#2a6f97"/>
    <circle cx="435" cy="192" r="3" fill="#2a6f97"/>
    <circle cx="448" cy="193" r="3" fill="#2a6f97"/>
    <circle cx="439" cy="192" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  </g>

  <!-- P5 -->
  <g>
    <text x="60" y="236" text-anchor="end" font-size="13" fill="#1b2a3a">P5</text>
    <line x1="70" y1="232" x2="600" y2="232" stroke="#eaf1f7" stroke-width="12"/>
    <circle cx="200" cy="230" r="3" fill="#2a6f97"/>
    <circle cx="208" cy="234" r="3" fill="#2a6f97"/>
    <circle cx="214" cy="229" r="3" fill="#2a6f97"/>
    <circle cx="205" cy="232" r="3" fill="#2a6f97"/>
    <circle cx="218" cy="233" r="3" fill="#2a6f97"/>
    <circle cx="209" cy="232" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  </g>

  <!-- P6 -->
  <g>
    <text x="60" y="276" text-anchor="end" font-size="13" fill="#1b2a3a">P6</text>
    <line x1="70" y1="272" x2="600" y2="272" stroke="#eaf1f7" stroke-width="12"/>
    <circle cx="352" cy="270" r="3" fill="#2a6f97"/>
    <circle cx="360" cy="274" r="3" fill="#2a6f97"/>
    <circle cx="366" cy="269" r="3" fill="#2a6f97"/>
    <circle cx="357" cy="272" r="3" fill="#2a6f97"/>
    <circle cx="370" cy="273" r="3" fill="#2a6f97"/>
    <circle cx="361" cy="272" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  </g>

  <!-- Annotation: ~5 measurements / patient near P1 lane -->
  <text x="632" y="70" text-anchor="end" font-size="13" fill="#6a994e">~5 measurements / patient</text>
  <line x1="470" y1="70" x2="270" y2="72" stroke="#6a994e" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Annotation: patients differ, spanning spread of lane means -->
  <line x1="209" y1="300" x2="439" y2="300" stroke="#6a994e" stroke-width="1.4"/>
  <line x1="209" y1="296" x2="209" y2="304" stroke="#6a994e" stroke-width="1.4"/>
  <line x1="439" y1="296" x2="439" y2="304" stroke="#6a994e" stroke-width="1.4"/>
  <text x="324" y="316" text-anchor="middle" font-size="13" fill="#6a994e">patients differ</text>

  <!-- Legend for open circle = patient mean -->
  <circle cx="470" cy="205" r="6" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="482" y="209" text-anchor="start" font-size="12" fill="#1b2a3a">= patient mean</text>
</svg>
