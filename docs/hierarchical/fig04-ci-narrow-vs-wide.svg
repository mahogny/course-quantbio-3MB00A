<svg xmlns="http://www.w3.org/2000/svg" width="548" height="342" viewBox="96 6 548 342" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="368" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Pseudoreplication</text>

  <!-- Axis geometry: x=0 (null) at pixel 300, effect axis at y=280 -->
  <!-- Null dashed vertical line: broken to route around the green label row -->
  <line x1="300" y1="100" x2="300" y2="173" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="300" y1="194" x2="300" y2="280" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Effect-size axis -->
  <line x1="120" y1="280" x2="600" y2="280" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="120" y1="280" x2="608" y2="280" stroke="#1b2a3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="575" y="300" text-anchor="middle" font-size="13" fill="#1b2a3a">effect size</text>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#1b2a3a">null (x = 0)</text>

  <!-- Shared point estimate at pixel x=380 -->
  <!-- ================= TOP: pseudoreplicated (narrow) ================= -->
  <text x="120" y="86" font-size="15" font-weight="bold" fill="#bc4749">Pseudoreplicated (n = 240 cells treated as independent)</text>
  <!-- narrow error bar around x=380, y=122 -->
  <line x1="356" y1="122" x2="404" y2="122" stroke="#bc4749" stroke-width="3"/>
  <line x1="356" y1="111" x2="356" y2="133" stroke="#bc4749" stroke-width="3"/>
  <line x1="404" y1="111" x2="404" y2="133" stroke="#bc4749" stroke-width="3"/>
  <circle cx="380" cy="122" r="6" fill="#1b2a3a"/>
  <text x="420" y="127" font-size="13" fill="#bc4749">SE too small &#8594; p too optimistic</text>

  <!-- ================= BOTTOM: correct (wide) ================= -->
  <text x="120" y="188" font-size="15" font-weight="bold" fill="#6a994e">Correct (hierarchical, n = 3 animals)</text>
  <!-- wide error bar around x=380, y=222 -->
  <line x1="270" y1="222" x2="490" y2="222" stroke="#6a994e" stroke-width="3"/>
  <line x1="270" y1="210" x2="270" y2="234" stroke="#6a994e" stroke-width="3"/>
  <line x1="490" y1="210" x2="490" y2="234" stroke="#6a994e" stroke-width="3"/>
  <circle cx="380" cy="222" r="6" fill="#1b2a3a"/>
  <text x="500" y="227" font-size="13" fill="#6a994e">honest width</text>

  <!-- Shared estimate guide -->
  <line x1="380" y1="130" x2="380" y2="214" stroke="#2a6f97" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="386" y="160" font-size="12" fill="#2a6f97">same estimate</text>

  <!-- Caption -->
  <text x="368" y="332" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">Same data, same estimate &#8212; the wrong model just shrinks the error bar.</text>
</svg>
