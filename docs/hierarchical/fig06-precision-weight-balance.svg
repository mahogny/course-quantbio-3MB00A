<svg xmlns="http://www.w3.org/2000/svg" viewBox="45.5 -2.5 539.9 404.5" width="539.9" height="404.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Partial pooling and shrinkage</text>
  <text x="146" y="46" text-anchor="start" font-size="14" fill="#1b2a3a">μ<tspan font-size="10" dy="3">i</tspan><tspan dy="-3"> = w</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3"> · y</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3"> + (1 − w</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3">) · μ  (precision-weighted average)</tspan></text>

  <!-- ======================= Scenario (a) ======================= -->
  <text x="60" y="86" font-size="14" font-weight="bold" fill="#1b2a3a">(a) Data-rich group (large n<tspan font-size="10" dy="3">i</tspan><tspan dy="-3">)</tspan></text>

  <!-- end labels -->
  <text x="70" y="112" font-size="13" fill="#2a6f97">y<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> own mean</tspan></text>
  <text x="70" y="128" font-size="12" fill="#2a6f97">w<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> = n</tspan><tspan font-size="9" dy="3">i</tspan><tspan dy="-3">/σ</tspan><tspan font-size="9" dy="-4">2</tspan></text>
  <text x="570" y="112" text-anchor="end" font-size="13" fill="#6a994e">μ grand mean</text>
  <text x="505" y="128" text-anchor="start" font-size="12" fill="#6a994e">1 − w<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> = 1/τ</tspan><tspan font-size="9" dy="-4">2</tspan></text>

  <!-- beam (a): pivot near own-mean end (x=180) -->
  <line x1="90" y1="150" x2="550" y2="150" stroke="#1b2a3a" stroke-width="3"/>
  <!-- fulcrum -->
  <polygon points="180,150 165,182 195,182" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- big weight on left (heavy own data) -->
  <rect x="70" y="135" width="30" height="30" rx="3" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <!-- small weight on right -->
  <rect x="536" y="142" width="16" height="16" rx="2" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.5"/>
  <!-- pointer at balance = fulcrum -->
  <line x1="180" y1="150" x2="180" y2="200" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="175" y="216" text-anchor="start" font-size="13" font-weight="bold" fill="#bc4749">μ<tspan font-size="9" dy="3">i</tspan></text>
  <text x="230" y="205" font-size="12" fill="#bc4749">leans on itself → little shrinkage</text>

  <!-- ======================= Scenario (b) ======================= -->
  <text x="60" y="266" font-size="14" font-weight="bold" fill="#1b2a3a">(b) Data-poor or alike groups (small n<tspan font-size="10" dy="3">i</tspan><tspan dy="-3"> or small τ</tspan><tspan font-size="10" dy="-4">2</tspan><tspan dy="4">)</tspan></text>

  <text x="70" y="292" font-size="13" fill="#2a6f97">y<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> own mean</tspan></text>
  <text x="70" y="308" font-size="12" fill="#2a6f97">w<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> small</tspan></text>
  <text x="570" y="292" text-anchor="end" font-size="13" fill="#6a994e">μ grand mean</text>
  <text x="508" y="308" text-anchor="start" font-size="12" fill="#6a994e">1 − w<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> large</tspan></text>

  <!-- beam (b): pivot near grand-mean end (x=470) -->
  <line x1="90" y1="330" x2="550" y2="330" stroke="#1b2a3a" stroke-width="3"/>
  <polygon points="470,330 455,362 485,362" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- small weight on left -->
  <rect x="78" y="322" width="16" height="16" rx="2" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <!-- big weight on right (crowd) -->
  <rect x="524" y="315" width="30" height="30" rx="3" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <!-- pointer at balance = fulcrum -->
  <line x1="470" y1="330" x2="470" y2="380" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="435" y="322" text-anchor="end" font-size="12" fill="#bc4749">leans on the crowd → strong shrinkage</text>
  <text x="465" y="396" text-anchor="start" font-size="13" font-weight="bold" fill="#bc4749">μ<tspan font-size="9" dy="3">i</tspan></text>
</svg>
