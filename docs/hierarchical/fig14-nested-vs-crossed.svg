<svg xmlns="http://www.w3.org/2000/svg" viewBox="43.6 -11.4 841.9 423.9" width="841.9" height="423.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="3">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Pitfalls and good practice</text>

  <!-- Divider -->
  <line x1="440" y1="46" x2="440" y2="360" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===================== LEFT: NESTED ===================== -->
  <text x="215" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a6f97">Nested</text>

  <!-- Hospital root -->
  <rect x="170" y="76" width="90" height="30" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.4"/>
  <text x="215" y="96" text-anchor="middle" font-size="14" fill="#1b2a3a">Hospital</text>

  <!-- Branches to hospital A / B -->
  <line x1="215" y1="106" x2="120" y2="138" stroke="#c9d3dd" stroke-width="1.4"/>
  <line x1="215" y1="106" x2="310" y2="138" stroke="#c9d3dd" stroke-width="1.4"/>

  <rect x="82" y="138" width="76" height="28" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="120" y="157" text-anchor="middle" font-size="13" fill="#1b2a3a">Hosp A</text>
  <rect x="272" y="138" width="76" height="28" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="310" y="157" text-anchor="middle" font-size="13" fill="#1b2a3a">Hosp B</text>

  <!-- Patients under A -->
  <line x1="120" y1="166" x2="86" y2="200" stroke="#c9d3dd" stroke-width="1.2"/>
  <line x1="120" y1="166" x2="154" y2="200" stroke="#c9d3dd" stroke-width="1.2"/>
  <circle cx="86" cy="212" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="86" y="216" text-anchor="middle" font-size="12" fill="#1b2a3a">P1</text>
  <circle cx="154" cy="212" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="154" y="216" text-anchor="middle" font-size="12" fill="#1b2a3a">P2</text>

  <!-- Patients under B -->
  <line x1="310" y1="166" x2="276" y2="200" stroke="#c9d3dd" stroke-width="1.2"/>
  <line x1="310" y1="166" x2="344" y2="200" stroke="#c9d3dd" stroke-width="1.2"/>
  <circle cx="276" cy="212" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="276" y="216" text-anchor="middle" font-size="12" fill="#1b2a3a">P3</text>
  <circle cx="344" cy="212" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="344" y="216" text-anchor="middle" font-size="12" fill="#1b2a3a">P4</text>

  <!-- Cells under each patient -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="86" y1="227" x2="74" y2="258"/>
    <line x1="86" y1="227" x2="98" y2="258"/>
    <line x1="154" y1="227" x2="142" y2="258"/>
    <line x1="154" y1="227" x2="166" y2="258"/>
    <line x1="276" y1="227" x2="264" y2="258"/>
    <line x1="276" y1="227" x2="288" y2="258"/>
    <line x1="344" y1="227" x2="332" y2="258"/>
    <line x1="344" y1="227" x2="356" y2="258"/>
  </g>
  <g fill="#bc4749">
    <circle cx="74" cy="266" r="6"/>
    <circle cx="98" cy="266" r="6"/>
    <circle cx="142" cy="266" r="6"/>
    <circle cx="166" cy="266" r="6"/>
    <circle cx="264" cy="266" r="6"/>
    <circle cx="288" cy="266" r="6"/>
    <circle cx="332" cy="266" r="6"/>
    <circle cx="356" cy="266" r="6"/>
  </g>
  <text x="215" y="292" text-anchor="middle" font-size="12" fill="#6a994e" font-style="italic">cells (each belongs to one patient)</text>

  <!-- Left formula -->
  <rect x="120" y="308" width="190" height="30" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="215" y="328" text-anchor="middle" font-size="15" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">(1 | hospital/patient)</text>
  <text x="215" y="356" text-anchor="middle" font-size="12" fill="#1b2a3a">strictly branching · one parent each</text>

  <!-- ===================== RIGHT: CROSSED ===================== -->
  <text x="660" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#bc4749">Crossed</text>

  <!-- Batch row (top) -->
  <rect x="520" y="80" width="60" height="28" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.3"/>
  <text x="550" y="99" text-anchor="middle" font-size="13" fill="#1b2a3a">B1</text>
  <rect x="740" y="80" width="60" height="28" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.3"/>
  <text x="770" y="99" text-anchor="middle" font-size="13" fill="#1b2a3a">B2</text>
  <text x="512" y="98" text-anchor="end" font-size="12" fill="#2a6f97" font-weight="bold">Batch</text>

  <!-- Measurement grid (middle) -->
  <g fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1">
    <rect x="520" y="176" width="26" height="26" rx="4"/>
    <rect x="583" y="176" width="26" height="26" rx="4"/>
    <rect x="646" y="176" width="26" height="26" rx="4"/>
    <rect x="709" y="176" width="26" height="26" rx="4"/>
    <rect x="772" y="176" width="26" height="26" rx="4"/>
    <rect x="835" y="176" width="26" height="26" rx="4"/>
  </g>
  <text x="512" y="193" text-anchor="end" font-size="11" fill="#1b2a3a" font-style="italic">measure</text>

  <!-- Crossing lines: measurements to BATCH (top) -->
  <g stroke="#2a6f97" stroke-width="1.1" opacity="0.85">
    <line x1="533" y1="176" x2="550" y2="108"/>
    <line x1="596" y1="176" x2="550" y2="108"/>
    <line x1="659" y1="176" x2="770" y2="108"/>
    <line x1="722" y1="176" x2="550" y2="108"/>
    <line x1="785" y1="176" x2="770" y2="108"/>
    <line x1="848" y1="176" x2="770" y2="108"/>
  </g>

  <!-- Crossing lines: measurements to PATIENT (bottom) -->
  <g stroke="#6a994e" stroke-width="1.1" opacity="0.85">
    <line x1="533" y1="202" x2="550" y2="260"/>
    <line x1="596" y1="202" x2="660" y2="260"/>
    <line x1="659" y1="202" x2="550" y2="260"/>
    <line x1="722" y1="202" x2="770" y2="260"/>
    <line x1="785" y1="202" x2="660" y2="260"/>
    <line x1="848" y1="202" x2="770" y2="260"/>
  </g>

  <!-- Patient row (bottom) -->
  <text x="512" y="277" text-anchor="end" font-size="12" fill="#6a994e" font-weight="bold">Patient</text>
  <circle cx="550" cy="272" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="550" y="276" text-anchor="middle" font-size="12" fill="#1b2a3a">P1</text>
  <circle cx="660" cy="272" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="660" y="276" text-anchor="middle" font-size="12" fill="#1b2a3a">P2</text>
  <circle cx="770" cy="272" r="15" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.3"/>
  <text x="770" y="276" text-anchor="middle" font-size="12" fill="#1b2a3a">P3</text>

  <text x="660" y="300" text-anchor="middle" font-size="12" fill="#bc4749" font-style="italic">patients recur across batches</text>

  <!-- Right formula -->
  <rect x="545" y="308" width="230" height="30" rx="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.2"/>
  <text x="660" y="328" text-anchor="middle" font-size="15" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">(1 | batch) + (1 | patient)</text>
  <text x="660" y="356" text-anchor="middle" font-size="12" fill="#1b2a3a">two independent factors · lines cross</text>

  <!-- Caption -->
  <text x="440" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Write the grouping to match the design.</text>
</svg>
