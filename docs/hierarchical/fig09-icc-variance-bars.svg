<svg xmlns="http://www.w3.org/2000/svg" width="764.2" height="436.2" viewBox="7.8 -4.5 764.2 436.2" font-family="Helvetica, Arial, sans-serif">
  <!-- The variance partition (ICC) -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">The variance partition (ICC)</text>

  <!-- Legend -->
  <rect x="250" y="46" width="16" height="16" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.6"/>
  <text x="272" y="59" font-size="14" fill="#1b2a3a">τ^2 between patients</text>
  <rect x="430" y="46" width="16" height="16" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.6"/>
  <text x="452" y="59" font-size="14" fill="#1b2a3a">σ^2 within patient</text>

  <!-- Plot geometry: bars 250px tall, top y=90, bottom y=340 -->
  <!-- Baseline -->
  <line x1="70" y1="340" x2="750" y2="340" stroke="#c9d3dd" stroke-width="1"/>
  <text x="60" y="90" text-anchor="end" font-size="12" fill="#1b2a3a">100%</text>
  <text x="60" y="219" text-anchor="end" font-size="12" fill="#1b2a3a">50%</text>
  <text x="60" y="344" text-anchor="end" font-size="12" fill="#1b2a3a">0%</text>
  <line x1="65" y1="90" x2="750" y2="90" stroke="#c9d3dd" stroke-width="0.5"/>
  <line x1="65" y1="215" x2="750" y2="215" stroke="#c9d3dd" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- BAR A: ICC ~ 0.9 (high) -->
  <!-- tau2 = 90% (225px), sigma2 = 10% (25px) -->
  <text x="165" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">ICC ≈ 0.9 (high)</text>
  <rect x="115" y="90" width="100" height="225" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.6"/>
  <rect x="115" y="315" width="100" height="25" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.6"/>
  <text x="165" y="205" text-anchor="middle" font-size="13" fill="#eaf1f7">τ^2</text>
  <text x="165" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">high ICC</text>

  <!-- BAR B: ICC ~ 0.5 -->
  <!-- tau2 = 50% (125px), sigma2 = 50% (125px) -->
  <text x="410" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">ICC ≈ 0.5</text>
  <rect x="360" y="90" width="100" height="125" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.6"/>
  <rect x="360" y="215" width="100" height="125" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.6"/>
  <text x="410" y="157" text-anchor="middle" font-size="13" fill="#eaf1f7">τ^2</text>
  <text x="410" y="282" text-anchor="middle" font-size="13" fill="#1b2a3a">σ^2</text>
  <text x="410" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">half and half</text>

  <!-- BAR C: ICC ~ 0.1 (low) -->
  <!-- tau2 = 10% (25px), sigma2 = 90% (225px) -->
  <text x="655" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">ICC ≈ 0.1 (low)</text>
  <rect x="605" y="90" width="100" height="25" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.6"/>
  <rect x="605" y="115" width="100" height="225" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.6"/>
  <text x="655" y="235" text-anchor="middle" font-size="13" fill="#1b2a3a">σ^2</text>
  <text x="655" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">low ICC</text>

  <!-- Annotations -->
  <text x="165" y="386" text-anchor="middle" font-size="10.5" fill="#2a6f97">patients differ a lot</text>
  <text x="165" y="399" text-anchor="middle" font-size="10.5" fill="#2a6f97">effective n ≈ n patients · grouping matters</text>

  <text x="655" y="386" text-anchor="middle" font-size="10.5" fill="#6a994e">patients interchangeable</text>
  <text x="655" y="399" text-anchor="middle" font-size="10.5" fill="#6a994e">complete pooling nearly fine</text>

  <!-- Caption formula -->
  <text x="410" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">ICC = τ^2 / (τ^2 + σ^2)</text>
  <text x="410" y="407" text-anchor="middle" font-size="10.5" fill="#1b2a3a">fraction of total variance that is between-group</text>
</svg>
