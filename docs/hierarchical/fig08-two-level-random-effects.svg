<svg xmlns="http://www.w3.org/2000/svg" width="925" height="420" viewBox="0 0 925 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6a994e"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">Random effects: the two-level model</text>
  <text x="24" y="50" font-size="14" fill="#2a6f97">y·ij = μ + b·i + ε·ij</text>

  <!-- baseline reference line at mu -->
  <line x1="150" y1="150" x2="700" y2="150" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="705" y="154" font-size="12" fill="#c9d3dd">baseline = μ</text>

  <!-- TOP level: mu node -->
  <rect x="60" y="70" width="150" height="34" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="135" y="86" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">μ</text>
  <text x="135" y="99" font-size="10.5" fill="#1b2a3a" text-anchor="middle">overall mean (fixed effect)</text>

  <!-- bracket from mu to shared distribution -->
  <path d="M212,87 C245,87 245,150 278,150" fill="none" stroke="#2a6f97" stroke-width="1.4" marker-end="url(#arrBlue)"/>

  <!-- shared bell curve for b_i -->
  <g transform="translate(300,110)">
    <path d="M0,44 C20,44 24,4 45,4 C66,4 70,44 90,44" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.6"/>
    <line x1="0" y1="44" x2="90" y2="44" stroke="#2a6f97" stroke-width="1"/>
    <line x1="45" y1="8" x2="45" y2="44" stroke="#2a6f97" stroke-width="0.8" stroke-dasharray="3 2"/>
  </g>
  <text x="345" y="100" font-size="12.5" font-weight="bold" fill="#2a6f97" text-anchor="middle">b·i ~ N(0, τ^2)</text>
  <text x="345" y="172" font-size="10.5" fill="#2a6f97" text-anchor="middle">between-patient spread</text>
  <text x="345" y="185" font-size="10.5" fill="#2a6f97" text-anchor="middle">τ estimated from data</text>

  <!-- MIDDLE level: three patient nodes as offset ticks -->
  <!-- P1: offset up (+b1) -->
  <g>
    <line x1="200" y1="150" x2="200" y2="128" stroke="#bc4749" stroke-width="2"/>
    <circle cx="200" cy="128" r="4" fill="#bc4749"/>
    <text x="200" y="118" font-size="11" font-weight="bold" fill="#bc4749" text-anchor="middle">P1</text>
    <text x="200" y="252" font-size="9.5" fill="#bc4749" text-anchor="middle">μ + b·1</text>
  </g>
  <!-- P2: offset down (-b2) -->
  <g>
    <line x1="425" y1="150" x2="425" y2="168" stroke="#bc4749" stroke-width="2"/>
    <circle cx="425" cy="168" r="4" fill="#bc4749"/>
    <text x="425" y="184" font-size="11" font-weight="bold" fill="#bc4749" text-anchor="middle">P2</text>
    <text x="425" y="252" font-size="9.5" fill="#bc4749" text-anchor="middle">μ + b·2</text>
  </g>
  <!-- P3: offset up small (+b3) -->
  <g>
    <line x1="640" y1="150" x2="640" y2="137" stroke="#bc4749" stroke-width="2"/>
    <circle cx="640" cy="137" r="4" fill="#bc4749"/>
    <text x="640" y="127" font-size="11" font-weight="bold" fill="#bc4749" text-anchor="middle">P3</text>
    <text x="640" y="252" font-size="9.5" fill="#bc4749" text-anchor="middle">μ + b·3</text>
  </g>

  <!-- draws from shared bell to each patient (dashed guides) -->
  <path d="M360,120 C400,150 300,150 205,128" fill="none" stroke="#2a6f97" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>
  <path d="M368,138 C420,150 430,155 425,166" fill="none" stroke="#2a6f97" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>
  <path d="M372,128 C500,150 620,145 638,137" fill="none" stroke="#2a6f97" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>

  <!-- BOTTOM level: measurement leaves y_ij -->
  <!-- P1 measurements (baseline 128) -->
  <g stroke="#6a994e" stroke-width="1.4">
    <line x1="200" y1="128" x2="150" y2="300" marker-end="url(#arrGreen)"/>
    <line x1="200" y1="128" x2="200" y2="300" marker-end="url(#arrGreen)"/>
    <line x1="200" y1="128" x2="250" y2="300" marker-end="url(#arrGreen)"/>
  </g>
  <g fill="#6a994e" font-size="10" text-anchor="middle">
    <circle cx="150" cy="305" r="3.5"/><text x="150" y="322">y·11</text>
    <circle cx="200" cy="305" r="3.5"/><text x="200" y="322">y·12</text>
    <circle cx="250" cy="305" r="3.5"/><text x="250" y="322">y·13</text>
  </g>

  <!-- P2 measurements (baseline 168) -->
  <g stroke="#6a994e" stroke-width="1.4">
    <line x1="425" y1="168" x2="390" y2="300" marker-end="url(#arrGreen)"/>
    <line x1="425" y1="168" x2="460" y2="300" marker-end="url(#arrGreen)"/>
  </g>
  <g fill="#6a994e" font-size="10" text-anchor="middle">
    <circle cx="390" cy="305" r="3.5"/><text x="390" y="322">y·21</text>
    <circle cx="460" cy="305" r="3.5"/><text x="460" y="322">y·22</text>
  </g>

  <!-- P3 measurements (baseline 137) -->
  <g stroke="#6a994e" stroke-width="1.4">
    <line x1="640" y1="137" x2="600" y2="300" marker-end="url(#arrGreen)"/>
    <line x1="640" y1="137" x2="650" y2="300" marker-end="url(#arrGreen)"/>
    <line x1="640" y1="137" x2="700" y2="300" marker-end="url(#arrGreen)"/>
  </g>
  <g fill="#6a994e" font-size="10" text-anchor="middle">
    <circle cx="600" cy="305" r="3.5"/><text x="600" y="322">y·31</text>
    <circle cx="650" cy="305" r="3.5"/><text x="650" y="322">y·32</text>
    <circle cx="700" cy="305" r="3.5"/><text x="700" y="322">y·33</text>
  </g>

  <!-- small noise bell for eps -->
  <g transform="translate(300,340)">
    <path d="M0,30 C13,30 16,4 30,4 C44,4 47,30 60,30" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.4"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#6a994e" stroke-width="1"/>
  </g>
  <text x="378" y="352" font-size="12" font-weight="bold" fill="#6a994e">ε·ij ~ N(0, σ^2)</text>
  <text x="378" y="366" font-size="10.5" fill="#6a994e">within-patient noise</text>

  <!-- RIGHT annotations: two variance levels -->
  <!-- upper link tau^2 -->
  <line x1="760" y1="150" x2="760" y2="110" stroke="#2a6f97" stroke-width="1"/>
  <text x="770" y="120" font-size="12.5" font-weight="bold" fill="#2a6f97">τ^2 = between patients</text>
  <text x="770" y="135" font-size="11" fill="#2a6f97">(biological)</text>

  <!-- lower link sigma^2 -->
  <line x1="760" y1="220" x2="760" y2="290" stroke="#6a994e" stroke-width="1"/>
  <text x="770" y="240" font-size="12.5" font-weight="bold" fill="#6a994e">σ^2 = within patient</text>
  <text x="770" y="255" font-size="11" fill="#6a994e">(technical)</text>

  <!-- callout emphasis -->
  <rect x="60" y="378" width="620" height="30" rx="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.2"/>
  <text x="72" y="397" font-size="12" fill="#bc4749">The b·i are <tspan font-weight="bold">draws from one shared distribution</tspan> N(0, τ^2) — not free per-patient parameters.</text>
</svg>
