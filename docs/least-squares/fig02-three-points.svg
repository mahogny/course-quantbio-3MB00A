<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 640 395" width="640" height="395" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- Geometry: x px = 110 + 110*x ; y px = 360 - 45*y -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="110" y1="45" x2="110" y2="360"/>
    <line x1="220" y1="45" x2="220" y2="360"/>
    <line x1="330" y1="45" x2="330" y2="360"/>
    <line x1="70" y1="315" x2="390" y2="315"/>
    <line x1="70" y1="270" x2="390" y2="270"/>
    <line x1="70" y1="225" x2="390" y2="225"/>
    <line x1="70" y1="180" x2="390" y2="180"/>
    <line x1="70" y1="135" x2="390" y2="135"/>
    <line x1="70" y1="90"  x2="390" y2="90"/>
    <line x1="70" y1="45"  x2="390" y2="45"/>
  </g>
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="70" y1="360" x2="405" y2="360" marker-end="url(#arrow)"/>
    <line x1="70" y1="360" x2="70" y2="30" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="110" y="378">0</text><text x="220" y="378">1</text><text x="330" y="378">2</text>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="62" y="364">0</text><text x="62" y="319">1</text><text x="62" y="274">2</text>
    <text x="62" y="229">3</text><text x="62" y="184">4</text><text x="62" y="139">5</text>
    <text x="62" y="94">6</text><text x="62" y="49">7</text>
  </g>
  <text x="240" y="402" font-size="14" fill="#1b2a3a" text-anchor="middle">hours after heat shock (x)</text>
  <text transform="rotate(-90 26 200)" x="26" y="200" font-size="14" fill="#1b2a3a" text-anchor="middle">log2 expression (y)</text>

  <!-- three candidate lines, none passes through all points -->
  <g stroke="#5a6b7a" stroke-width="1.6" stroke-dasharray="6 4" fill="none">
    <!-- through points 1 and 2: y = 1 + x -->
    <line x1="110" y1="315" x2="374" y2="207"/>
    <!-- through points 2 and 3: y = -2 + 4x ; from x=0.5 (y=0) to x=2.25 (y=7) -->
    <line x1="165" y1="360" x2="357.5" y2="45"/>
    <!-- through points 1 and 3: y = 1 + 2.5x ; to x=2.4 (y=7) -->
    <line x1="110" y1="315" x2="374" y2="45"/>
  </g>

  <!-- data points (0,1), (1,2), (2,6) -->
  <g fill="#2a6f97" stroke="#ffffff" stroke-width="1.5">
    <circle cx="110" cy="315" r="7"/>
    <circle cx="220" cy="270" r="7"/>
    <circle cx="330" cy="90" r="7"/>
  </g>
  <g font-size="14" fill="#2a6f97" font-weight="bold">
    <text x="122" y="336">(0, 1)</text>
    <text x="232" y="292">(1, 2)</text>
    <text x="282" y="80">(2, 6)</text>
  </g>

  <!-- annotations -->
  <text x="420" y="140" font-size="15" fill="#1b2a3a">3 points, 2 unknowns (a, b)</text>
  <text x="420" y="175" font-size="14" fill="#5a6b7a">any two points fix a line …</text>
  <text x="420" y="198" font-size="14" fill="#5a6b7a">… which then misses the third</text>
  <text x="420" y="250" font-size="15" fill="#bc4749" font-weight="bold">no exact solution</text>
</svg>
