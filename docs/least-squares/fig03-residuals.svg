<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 650 395" width="650" height="395" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- Geometry: x px = 110 + 110*x ; y px = 360 - 45*y -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="110" y1="45" x2="110" y2="360"/>
    <line x1="220" y1="45" x2="220" y2="360"/>
    <line x1="330" y1="45" x2="330" y2="360"/>
    <line x1="70" y1="315" x2="390" y2="315"/>
    <line x1="70" y1="270" x2="390" y2="270"/>
    <line x1="70" y1="225" x2="390" y2="225"/>
    <line x1="70" y1="180" x2="390" y2="180"/>
    <line x1="70" y1="135" x2="390" y2="135"/>
    <line x1="70" y1="90"  x2="390" y2="90"/>
    <line x1="70" y1="45"  x2="390" y2="45"/>
  </g>
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="70" y1="360" x2="405" y2="360" marker-end="url(#arrow)"/>
    <line x1="70" y1="360" x2="70" y2="30" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="110" y="378">0</text><text x="220" y="378">1</text><text x="330" y="378">2</text>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="62" y="364">0</text><text x="62" y="319">1</text><text x="62" y="274">2</text>
    <text x="62" y="229">3</text><text x="62" y="184">4</text><text x="62" y="139">5</text>
    <text x="62" y="94">6</text><text x="62" y="49">7</text>
  </g>
  <text x="240" y="402" font-size="14" fill="#1b2a3a" text-anchor="middle">hours after heat shock (x)</text>
  <text transform="rotate(-90 26 200)" x="26" y="200" font-size="14" fill="#1b2a3a" text-anchor="middle">log2 expression (y)</text>

  <!-- another line, y = 1 + 2.5x (through first and last point) -->
  <line x1="110" y1="315" x2="374" y2="45" stroke="#5a6b7a" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- best line y = 0.5 + 2.5x : x=0 -> 337.5 ; x=2.4 (y=6.5) -> 67.5 -->
  <line x1="110" y1="337.5" x2="374" y2="67.5" stroke="#6a994e" stroke-width="3"/>

  <!-- residuals (vertical) from fitted (0,0.5),(1,3),(2,5.5) to data -->
  <g stroke="#bc4749" stroke-width="2.6">
    <line x1="110" y1="337.5" x2="110" y2="315"/>
    <line x1="220" y1="225" x2="220" y2="270"/>
    <line x1="330" y1="112.5" x2="330" y2="90"/>
  </g>
  <g font-size="14" fill="#bc4749" font-weight="bold">
    <text x="122" y="334">+0.5</text>
    <text x="232" y="254">−1</text>
    <text x="318" y="98" text-anchor="end">+0.5</text>
  </g>

  <!-- fitted values -->
  <g fill="#ffffff" stroke="#6a994e" stroke-width="2">
    <circle cx="110" cy="337.5" r="4.5"/>
    <circle cx="220" cy="225" r="4.5"/>
    <circle cx="330" cy="112.5" r="4.5"/>
  </g>
  <!-- data points -->
  <g fill="#2a6f97" stroke="#ffffff" stroke-width="1.5">
    <circle cx="110" cy="315" r="7"/>
    <circle cx="220" cy="270" r="7"/>
    <circle cx="330" cy="90" r="7"/>
  </g>

  <!-- legend / numbers -->
  <line x1="420" y1="120" x2="455" y2="120" stroke="#6a994e" stroke-width="3"/>
  <text x="463" y="125" font-size="15" fill="#1b2a3a">best: y = 0.5 + 2.5x</text>
  <text x="463" y="147" font-size="14" fill="#5a6b7a">sum of squares 1.5</text>
  <line x1="420" y1="190" x2="455" y2="190" stroke="#5a6b7a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="463" y="195" font-size="15" fill="#1b2a3a">other: y = 1 + 2.5x</text>
  <text x="463" y="217" font-size="14" fill="#5a6b7a">sum of squares 2.25</text>
  <line x1="420" y1="260" x2="420" y2="285" stroke="#bc4749" stroke-width="2.6"/>
  <text x="434" y="272" font-size="15" fill="#1b2a3a">residual = data − fitted</text>
  <text x="434" y="294" font-size="14" fill="#5a6b7a">(0.5, −1, 0.5)</text>
</svg>
