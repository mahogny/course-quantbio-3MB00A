<svg xmlns="http://www.w3.org/2000/svg" viewBox="31.3 20.1 607.2 289.9" width="607.2" height="289.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="80" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a6f97">u</text>
  <text x="160" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#bc4749">v</text>

  <!-- u column -->
  <rect x="50" y="70" width="60" height="60" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="80" y="108" text-anchor="middle" font-size="26" fill="#1b2a3a">3</text>
  <rect x="50" y="150" width="60" height="60" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="80" y="188" text-anchor="middle" font-size="26" fill="#1b2a3a">2</text>

  <!-- v column -->
  <rect x="130" y="70" width="60" height="60" rx="4" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
  <text x="160" y="108" text-anchor="middle" font-size="26" fill="#1b2a3a">1</text>
  <rect x="130" y="150" width="60" height="60" rx="4" fill="#fbeceb" stroke="#bc4749" stroke-width="2"/>
  <text x="160" y="188" text-anchor="middle" font-size="26" fill="#1b2a3a">4</text>

  <!-- pairing bracket: top row -->
  <path d="M200,100 C240,100 240,100 282,100" fill="none" stroke="#6a994e" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- pairing bracket: bottom row -->
  <path d="M200,180 C240,180 240,180 282,180" fill="none" stroke="#6a994e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- top product -->
  <text x="330" y="107" text-anchor="middle" font-size="24" fill="#1b2a3a">3 × 1 =</text>
  <text x="376" y="107" text-anchor="start" font-size="24" font-weight="bold" fill="#6a994e">3</text>
  <text x="330" y="128" text-anchor="middle" font-size="13" fill="#6a994e">top pairs with top</text>

  <!-- bottom product -->
  <text x="330" y="187" text-anchor="middle" font-size="24" fill="#1b2a3a">2 × 4 =</text>
  <text x="376" y="187" text-anchor="start" font-size="24" font-weight="bold" fill="#6a994e">8</text>
  <text x="330" y="208" text-anchor="middle" font-size="13" fill="#6a994e">bottom pairs with bottom</text>

  <!-- plus sign combining -->
  <path d="M430,107 C470,107 470,140 508,148" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M430,187 C470,187 470,156 508,150" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="458" y="158" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b2a3a">+</text>

  <!-- boxed scalar result -->
  <rect x="510" y="118" width="110" height="66" rx="6" fill="#eef6ea" stroke="#6a994e" stroke-width="2.5"/>
  <text x="565" y="150" text-anchor="middle" font-size="18" fill="#1b2a3a">3 + 8 =</text>
  <text x="565" y="176" text-anchor="middle" font-size="26" font-weight="bold" fill="#6a994e">11</text>

  <!-- formula line -->
  <text x="319" y="252" text-anchor="middle" font-size="20" fill="#1b2a3a">u · v = (3×1) + (2×4) =</text>
  <text x="430" y="252" text-anchor="start" font-size="20" font-weight="bold" fill="#6a994e">11</text>

  <!-- caption -->
  <text x="320" y="294" text-anchor="middle" font-size="17" font-style="italic" fill="#2a6f97">output is ONE number (a scalar)</text>
</svg>
