<svg xmlns="http://www.w3.org/2000/svg" viewBox="113.4 82.8 340.6 280.4" width="340.6" height="280.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="axArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="vecArrow" markerWidth="11" markerHeight="11" refX="8" refY="3.8" orient="auto">
      <path d="M0,0 L8.5,3.8 L0,7.6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- GeneA-GeneC (front, GeneB=0) plane -->
  <rect x="150" y="120" width="210" height="180" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="256" y="136" font-size="13" fill="#8a97a4" font-style="italic" text-anchor="middle">GeneB = 0 plane</text>

  <!-- Axes -->
  <line x1="150" y1="300" x2="366" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#axArrow)"/>
  <line x1="150" y1="300" x2="150" y2="112" stroke="#1b2a3a" stroke-width="2" marker-end="url(#axArrow)"/>
  <line x1="150" y1="300" x2="272" y2="234" stroke="#1b2a3a" stroke-width="2" marker-end="url(#axArrow)"/>

  <!-- Axis labels -->
  <text x="374" y="304" font-size="16" fill="#1b2a3a" font-weight="bold">GeneA</text>
  <text x="150" y="106" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="middle">GeneC</text>
  <text x="288" y="262" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="middle">GeneB</text>

  <!-- Guide lines from arrowhead to axes -->
  <line x1="318" y1="160" x2="318" y2="300" stroke="#9aa8b5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="318" y1="160" x2="150" y2="160" stroke="#9aa8b5" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Tick marks + values -->
  <line x1="318" y1="296" x2="318" y2="304" stroke="#1b2a3a" stroke-width="2"/>
  <text x="318" y="320" font-size="15" fill="#1b2a3a" text-anchor="middle">12</text>
  <line x1="146" y1="160" x2="154" y2="160" stroke="#1b2a3a" stroke-width="2"/>
  <text x="140" y="165" font-size="15" fill="#1b2a3a" text-anchor="end">7</text>
  <text x="143" y="316" font-size="15" fill="#1b2a3a" text-anchor="end">0</text>

  <!-- The vector -->
  <line x1="150" y1="300" x2="318" y2="160" stroke="#2a6f97" stroke-width="3" marker-end="url(#vecArrow)"/>
  <circle cx="150" cy="300" r="3.5" fill="#1b2a3a"/>
  <circle cx="318" cy="160" r="4" fill="#2a6f97"/>

  <!-- Vector label -->
  <text x="328" y="152" font-size="17" fill="#2a6f97" font-weight="bold">x = (12, 0, 7)</text>

  <!-- Caption -->
  <text x="285" y="352" font-size="15" fill="#5a6672" text-anchor="middle" font-style="italic">the same 3 numbers = one arrow in gene-space</text>
</svg>
