<svg xmlns="http://www.w3.org/2000/svg" viewBox="49.5 33.5 550.6 321.3" width="550.6" height="321.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Geometry: origin at (80,300), unit = 44 px, axes 0..5 -->
  <!-- Grid lines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical grid at x=1..5 -->
    <line x1="124" y1="80" x2="124" y2="300"/>
    <line x1="168" y1="80" x2="168" y2="300"/>
    <line x1="212" y1="80" x2="212" y2="300"/>
    <line x1="256" y1="80" x2="256" y2="300"/>
    <line x1="300" y1="80" x2="300" y2="300"/>
    <!-- horizontal grid at y=1..5 -->
    <line x1="80" y1="256" x2="300" y2="256"/>
    <line x1="80" y1="212" x2="300" y2="212"/>
    <line x1="80" y1="168" x2="300" y2="168"/>
    <line x1="80" y1="124" x2="300" y2="124"/>
    <line x1="80" y1="80"  x2="300" y2="80"/>
  </g>

  <!-- Axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="80" y1="300" x2="330" y2="300" marker-end="url(#arrow)"/>
    <line x1="80" y1="300" x2="80" y2="60" marker-end="url(#arrow)"/>
  </g>

  <!-- Axis ticks + labels -->
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="124" y="318">1</text>
    <text x="168" y="318">2</text>
    <text x="212" y="318">3</text>
    <text x="256" y="318">4</text>
    <text x="300" y="318">5</text>
    <text x="343" y="304">x</text>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="72" y="261">1</text>
    <text x="72" y="217">2</text>
    <text x="72" y="173">3</text>
    <text x="72" y="129">4</text>
    <text x="72" y="85">5</text>
  </g>
  <text x="72" y="56" fill="#1b2a3a" font-size="13" text-anchor="middle">y</text>
  <text x="70" y="318" fill="#1b2a3a" font-size="13" text-anchor="middle">0</text>

  <!-- Right-angle square at origin -->
  <path d="M80,282 L98,282 L98,300" fill="none" stroke="#6a994e" stroke-width="1.8"/>
  <text x="112" y="278" fill="#6a994e" font-size="13">90°</text>

  <!-- Vector u = (2,0): horizontal -->
  <line x1="80" y1="300" x2="168" y2="300" stroke="#bc4749" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="150" y="336" fill="#bc4749" font-size="16" font-weight="bold" text-anchor="middle">u = (2,0)</text>

  <!-- Vector v = (0,5): vertical -->
  <line x1="80" y1="300" x2="80" y2="80" stroke="#2a6f97" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="92" y="76" fill="#2a6f97" font-size="16" font-weight="bold" text-anchor="start">v = (0,5)</text>

  <!-- Caption -->
  <g font-size="15" fill="#1b2a3a">
    <text x="380" y="150" font-weight="bold">Orthogonality = a right angle</text>
    <text x="380" y="182">u · v = 2·0 + 0·5 = </text>
    <text x="510" y="182" fill="#6a994e" font-weight="bold">0</text>
    <text x="402" y="210">perpendicular</text>
    <text x="402" y="234">independent directions</text>
  </g>

  <!-- Implication arrows (drawn: cairosvg drops the U+21D2 glyph) -->
  <g stroke="#1b2a3a" stroke-width="1.6" fill="none">
    <line x1="380" y1="205" x2="396" y2="205" marker-end="url(#arrow)"/>
    <line x1="380" y1="229" x2="396" y2="229" marker-end="url(#arrow)"/>
  </g>
</svg>
