<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ================= TOP ROW: pi P = pi ================= -->
  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a6f97">π P = π   (π is a LEFT eigenvector of P, eigenvalue 1)</text>

  <!-- row vector pi (1x4) -->
  <g>
    <rect x="60" y="70" width="120" height="30" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <line x1="90" y1="70" x2="90" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="120" y1="70" x2="120" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="150" y1="70" x2="150" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <text x="120" y="91" text-anchor="middle" font-size="16" fill="#1b2a3a">π π π π</text>
    <text x="120" y="120" text-anchor="middle" font-size="12" fill="#2a6f97">π  (1×4)</text>
  </g>

  <!-- matrix P (4x4) -->
  <g>
    <rect x="210" y="55" width="90" height="90" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="232.5" y1="55" x2="232.5" y2="145" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="255" y1="55" x2="255" y2="145" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="277.5" y1="55" x2="277.5" y2="145" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="210" y1="77.5" x2="300" y2="77.5" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="210" y1="100" x2="300" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="210" y1="122.5" x2="300" y2="122.5" stroke="#c9d3dd" stroke-width="1"/>
    <text x="255" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">P</text>
    <text x="255" y="165" text-anchor="middle" font-size="12" fill="#1b2a3a">P  (4×4)</text>
  </g>

  <text x="325" y="100" text-anchor="middle" font-size="24" fill="#1b2a3a">=</text>

  <!-- result row vector pi (1x4) -->
  <g>
    <rect x="350" y="70" width="120" height="30" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <line x1="380" y1="70" x2="380" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="410" y1="70" x2="410" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="440" y1="70" x2="440" y2="100" stroke="#c9d3dd" stroke-width="1"/>
    <text x="410" y="91" text-anchor="middle" font-size="16" fill="#1b2a3a">π π π π</text>
    <text x="410" y="120" text-anchor="middle" font-size="12" fill="#2a6f97">π  (1×4)</text>
  </g>

  <!-- shape-flow annotation -->
  <text x="680" y="100" text-anchor="middle" font-size="15" fill="#6a994e">(1×4)(4×4) = (1×4)</text>

  <!-- ================= TRANSPOSE DIVIDER ================= -->
  <line x1="40" y1="200" x2="500" y2="200" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
  <g>
    <line x1="270" y1="180" x2="270" y2="222" stroke="#bc4749" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="284" y="190" text-anchor="start" font-size="16" font-weight="bold" fill="#bc4749">≡  transpose  (·)<tspan font-size="11" dy="-6">T</tspan></text>
  </g>

  <!-- ================= BOTTOM ROW: P^T pi^T = pi^T ================= -->
  <text x="212" y="252" text-anchor="start" font-size="17" font-weight="bold" fill="#2a6f97">P<tspan font-size="11" dy="-6">T</tspan><tspan dy="6"> π</tspan><tspan font-size="11" dy="-6">T</tspan><tspan dy="6"> = π</tspan><tspan font-size="11" dy="-6">T</tspan><tspan dy="6">   (π</tspan><tspan font-size="11" dy="-6">T</tspan><tspan dy="6"> is a RIGHT eigenvector of P</tspan><tspan font-size="11" dy="-6">T</tspan><tspan dy="6">, eigenvalue 1)</tspan></text>

  <!-- matrix P^T (4x4) -->
  <g>
    <rect x="120" y="278" width="90" height="90" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="142.5" y1="278" x2="142.5" y2="368" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="165" y1="278" x2="165" y2="368" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="187.5" y1="278" x2="187.5" y2="368" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="120" y1="300.5" x2="210" y2="300.5" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="120" y1="323" x2="210" y2="323" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="120" y1="345.5" x2="210" y2="345.5" stroke="#c9d3dd" stroke-width="1"/>
    <text x="155" y="328" text-anchor="start" font-size="20" font-weight="bold" fill="#1b2a3a">P<tspan font-size="13" dy="-7">T</tspan></text>
    <text x="138" y="388" text-anchor="start" font-size="12" fill="#1b2a3a">P<tspan font-size="8" dy="-4">T</tspan><tspan dy="4">  (4×4)</tspan></text>
  </g>

  <!-- column vector pi^T (4x1) -->
  <g>
    <rect x="235" y="278" width="30" height="90" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <line x1="235" y1="300.5" x2="265" y2="300.5" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="235" y1="323" x2="265" y2="323" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="235" y1="345.5" x2="265" y2="345.5" stroke="#c9d3dd" stroke-width="1"/>
    <text x="250" y="294" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="250" y="316" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="250" y="339" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="250" y="361" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="226" y="388" text-anchor="start" font-size="12" fill="#2a6f97">π<tspan font-size="8" dy="-4">T</tspan><tspan dy="4"> (4×1)</tspan></text>
  </g>

  <text x="290" y="328" text-anchor="middle" font-size="24" fill="#1b2a3a">=</text>

  <!-- result column vector pi^T (4x1) -->
  <g>
    <rect x="315" y="278" width="30" height="90" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <line x1="315" y1="300.5" x2="345" y2="300.5" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="315" y1="323" x2="345" y2="323" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="315" y1="345.5" x2="345" y2="345.5" stroke="#c9d3dd" stroke-width="1"/>
    <text x="330" y="294" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="330" y="316" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="330" y="339" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="330" y="361" text-anchor="middle" font-size="14" fill="#1b2a3a">π</text>
    <text x="306" y="388" text-anchor="start" font-size="12" fill="#2a6f97">π<tspan font-size="8" dy="-4">T</tspan><tspan dy="4"> (4×1)</tspan></text>
  </g>

  <!-- shape-flow annotation -->
  <text x="680" y="328" text-anchor="middle" font-size="15" fill="#6a994e">(4×4)(4×1) = (4×1)</text>

  <!-- ================= CAPTIONS ================= -->
  <rect x="486" y="128" width="388" height="34" rx="5" fill="#fbeaea" stroke="#bc4749" stroke-width="1.5"/>
  <text x="680" y="150" text-anchor="middle" font-size="12.5" fill="#bc4749">eigen() in R returns RIGHT eigenvectors → use eigen(t(P))</text>

  <text x="680" y="360" text-anchor="middle" font-size="13" fill="#1b2a3a">eigenvalue = 1 is the largest for any stochastic matrix</text>
</svg>
