<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.0 -8.7 790.2 373.4" width="790.2" height="373.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Long-run base composition of a sequence generated by P</text>

  <!-- Y axis -->
  <line x1="110" y1="70" x2="110" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- X axis -->
  <line x1="110" y1="320" x2="630" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- Y ticks and gridlines -->
  <g font-size="12" fill="#1b2a3a">
    <line x1="106" y1="320"   x2="110" y2="320"   stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="324" text-anchor="end">0.00</text>
    <line x1="106" y1="284.3" x2="110" y2="284.3" stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="288" text-anchor="end">0.05</text>
    <line x1="106" y1="248.6" x2="110" y2="248.6" stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="252" text-anchor="end">0.10</text>
    <line x1="106" y1="212.9" x2="110" y2="212.9" stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="217" text-anchor="end">0.15</text>
    <line x1="106" y1="177.1" x2="110" y2="177.1" stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="181" text-anchor="end">0.20</text>
    <line x1="106" y1="141.4" x2="110" y2="141.4" stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="145" text-anchor="end">0.25</text>
    <line x1="106" y1="105.7" x2="110" y2="105.7" stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="110" text-anchor="end">0.30</text>
    <line x1="106" y1="70"    x2="110" y2="70"    stroke="#1b2a3a" stroke-width="1.5"/><text x="102" y="74"  text-anchor="end">0.35</text>
  </g>

  <!-- Y axis label -->
  <text x="34" y="195" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 34 195)">equilibrium frequency</text>

  <!-- Bars: A=0.232 C=0.281 G=0.194 T=0.293 ; pixel h = value/0.35*250 -->
  <!-- A green -->
  <rect x="138.75" y="154.3" width="70" height="165.7" fill="#6a994e" fill-opacity="0.85" stroke="#4f7539" stroke-width="1.5"/>
  <text x="173.75" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">23.2%</text>
  <!-- C blue -->
  <rect x="266.25" y="119.3" width="70" height="200.7" fill="#2a6f97" fill-opacity="0.85" stroke="#1d5170" stroke-width="1.5"/>
  <text x="301.25" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">28.1%</text>
  <!-- G amber, HIGHLIGHTED -->
  <rect x="393.75" y="181.4" width="70" height="138.6" fill="#d99a3e" fill-opacity="0.90" stroke="#bc4749" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="428.75" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#bc4749">19.4%</text>
  <!-- T red -->
  <rect x="521.25" y="110.7" width="70" height="209.3" fill="#bc4749" fill-opacity="0.85" stroke="#8f3335" stroke-width="1.5"/>
  <text x="556.25" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">29.3%</text>

  <!-- X labels -->
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="173.75" y="342" fill="#4f7539">A</text>
    <text x="301.25" y="342" fill="#1d5170">C</text>
    <text x="428.75" y="342" fill="#bc4749">G</text>
    <text x="556.25" y="342" fill="#8f3335">T</text>
  </g>

  <!-- Uniform 25% dashed reference line -->
  <line x1="110" y1="141.4" x2="630" y2="141.4" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="626" y="135" text-anchor="end" font-size="13" font-style="italic" fill="#1b2a3a">uniform 25%</text>

  <!-- Callout for G -->
  <g>
    <rect x="470" y="230" width="298" height="58" rx="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="1.5"/>
    <text x="484" y="252" font-size="13.5" font-weight="bold" fill="#bc4749">G is rarest</text>
    <text x="484" y="269" font-size="12.5" fill="#1b2a3a">consequence of the CpG dip</text>
    <text x="484" y="284" font-size="12.5" fill="#1b2a3a">(p(C→G) = 0.05)</text>
    <!-- pointer from box to top of G bar -->
    <path d="M470,250 C445,215 445,200 435,190" fill="none" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  </g>
</svg>
