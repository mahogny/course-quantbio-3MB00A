<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 34 634 339" width="634" height="339" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <clipPath id="plot">
      <rect x="72" y="44" width="484" height="282"/>
    </clipPath>
  </defs>

  <!-- ===== axes ===== -->
  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="72" y1="255.5" x2="556" y2="255.5"/>
    <line x1="72" y1="185.0" x2="556" y2="185.0"/>
    <line x1="72" y1="114.5" x2="556" y2="114.5"/>
    <line x1="193" y1="44" x2="193" y2="326"/>
    <line x1="314" y1="44" x2="314" y2="326"/>
    <line x1="435" y1="44" x2="435" y2="326"/>
  </g>
  <!-- axis frame -->
  <line x1="72" y1="44" x2="72" y2="326" stroke="#1b2a3a" stroke-width="1.8"/>
  <line x1="72" y1="326" x2="556" y2="326" stroke="#1b2a3a" stroke-width="1.8"/>

  <!-- y ticks / labels -->
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="65" y="330">0</text>
    <text x="65" y="259.5">0.10</text>
    <text x="65" y="189">0.20</text>
    <text x="65" y="118.5">0.30</text>
    <text x="65" y="48">0.40</text>
  </g>
  <text x="24" y="185" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 24 185)">probability</text>

  <!-- x ticks / labels -->
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="72" y="343">0</text>
    <text x="193" y="343">5</text>
    <text x="314" y="343">10</text>
    <text x="435" y="343">15</text>
    <text x="556" y="343">20</text>
  </g>
  <text x="314" y="363" font-size="15" fill="#1b2a3a" text-anchor="middle">step n</text>

  <!-- ===== equilibrium reference lines (dotted) ===== -->
  <g stroke-width="1.4" stroke-dasharray="2 3" fill="none">
    <line x1="72" y1="162.4" x2="556" y2="162.4" stroke="#2a6f97"/>
    <line x1="72" y1="127.9" x2="556" y2="127.9" stroke="#bc4749"/>
    <line x1="72" y1="189.2" x2="556" y2="189.2" stroke="#6a994e"/>
    <line x1="72" y1="119.4" x2="556" y2="119.4" stroke="#1b2a3a"/>
  </g>

  <!-- ===== trajectories (clipped to plot box) ===== -->
  <g clip-path="url(#plot)" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- start = A : solid -->
    <path stroke="#2a6f97" d="M184.88,44.00 L193.0,57.68 L217.2,87.01 L241.4,108.13 L265.6,123.34 L289.8,134.29 L314.0,142.17 L338.2,147.84 L362.4,151.93 L386.6,154.87 L410.8,156.99 L435.0,158.52 L459.2,159.62 L483.4,160.41 L507.6,160.98 L531.8,161.39 L556.0,161.68"/>
    <path stroke="#bc4749" d="M72.0,326.00 L96.2,270.53 L120.4,230.59 L144.6,201.84 L168.8,181.13 L193.0,166.23 L217.2,155.49 L241.4,147.77 L265.6,142.20 L289.8,138.20 L314.0,135.31 L338.2,133.24 L362.4,131.74 L386.6,130.66 L410.8,129.89 L435.0,129.33 L459.2,128.93 L483.4,128.64 L507.6,128.43 L531.8,128.28 L556.0,128.17"/>
    <path stroke="#6a994e" d="M72.0,326.00 L96.2,287.70 L120.4,260.13 L144.6,240.28 L168.8,225.99 L193.0,215.69 L217.2,208.28 L241.4,202.95 L265.6,199.11 L289.8,196.34 L314.0,194.35 L338.2,192.92 L362.4,191.88 L386.6,191.14 L410.8,190.61 L435.0,190.22 L459.2,189.94 L483.4,189.74 L507.6,189.60 L531.8,189.50 L556.0,189.42"/>
    <path stroke="#1b2a3a" d="M72.0,326.00 L96.2,268.16 L120.4,226.52 L144.6,196.53 L168.8,174.95 L193.0,159.40 L217.2,148.21 L241.4,140.15 L265.6,134.35 L289.8,130.18 L314.0,127.17 L338.2,125.00 L362.4,123.44 L386.6,122.32 L410.8,121.51 L435.0,120.93 L459.2,120.51 L483.4,120.21 L507.6,119.99 L531.8,119.84 L556.0,119.72"/>

    <!-- start = T : dashed -->
    <g stroke-dasharray="7 4">
      <path stroke="#2a6f97" d="M72.0,326.00 L96.2,280.20 L120.4,247.23 L144.6,223.49 L168.8,206.39 L193.0,194.09 L217.2,185.23 L241.4,178.85 L265.6,174.25 L289.8,170.94 L314.0,168.56 L338.2,166.85 L362.4,165.61 L386.6,164.73 L410.8,164.09 L435.0,163.62 L459.2,163.29 L483.4,163.05 L507.6,162.88 L531.8,162.76 L556.0,162.67"/>
      <path stroke="#bc4749" d="M72.0,326.00 L96.2,270.53 L120.4,230.59 L144.6,201.84 L168.8,181.13 L193.0,166.23 L217.2,155.49 L241.4,147.77 L265.6,142.20 L289.8,138.20 L314.0,135.31 L338.2,133.24 L362.4,131.74 L386.6,130.66 L410.8,129.89 L435.0,129.33 L459.2,128.93 L483.4,128.64 L507.6,128.43 L531.8,128.28 L556.0,128.17"/>
      <path stroke="#6a994e" d="M72.0,326.00 L96.2,287.70 L120.4,260.13 L144.6,240.28 L168.8,225.99 L193.0,215.69 L217.2,208.28 L241.4,202.95 L265.6,199.11 L289.8,196.34 L314.0,194.35 L338.2,192.92 L362.4,191.88 L386.6,191.14 L410.8,190.61 L435.0,190.22 L459.2,189.94 L483.4,189.74 L507.6,189.60 L531.8,189.50 L556.0,189.42"/>
      <path stroke="#1b2a3a" d="M211.82,44.00 L217.2,50.00 L241.4,69.44 L265.6,83.44 L289.8,93.52 L314.0,100.77 L338.2,106.00 L362.4,109.76 L386.6,112.47 L410.8,114.42 L435.0,115.82 L459.2,116.84 L483.4,117.56 L507.6,118.09 L531.8,118.46 L556.0,118.74"/>
    </g>
  </g>

  <!-- off scale start markers: A from A (blue) and T from T (dark) begin at p=1 above the axis -->
  <g>
    <path d="M184.88,66 L184.88,47" stroke="#2a6f97" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <path d="M211.82,66 L211.82,47" stroke="#1b2a3a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <g font-size="11" fill="#5a6b7a">
      <text x="300" y="64">solid A &amp; dashed T start</text>
      <text x="300" y="78">off the top at p = 1 (n = 0)</text>
    </g>
  </g>

  <!-- ===== right-axis equilibrium labels ===== -->
  <g font-size="11.5" font-weight="bold">
    <text x="561" y="118" fill="#1b2a3a">π<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"> = 0.293</tspan></text>
    <text x="561" y="131" fill="#bc4749">π<tspan dy="3" font-size="9">C</tspan><tspan dy="-3"> = 0.281</tspan></text>
    <text x="561" y="166" fill="#2a6f97">π<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = 0.232</tspan></text>
    <text x="561" y="193" fill="#6a994e">π<tspan dy="3" font-size="9">G</tspan><tspan dy="-3"> = 0.194</tspan></text>
  </g>
  <text x="561" y="103" font-size="11" fill="#5a6b7a" font-style="italic">equilibrium π</text>

  <!-- ===== callout ===== -->
  <g>
    <path d="M452,240 C468,230 480,212 490,192" stroke="#1b2a3a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <text x="300" y="228" font-size="13.5" fill="#1b2a3a" font-weight="bold">both starts forget where they began</text>
    <text x="300" y="245" font-size="13.5" fill="#1b2a3a" font-weight="bold">→ same distribution</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="12" fill="#1b2a3a">
    <rect x="356" y="256" width="196" height="62" rx="4" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
    <!-- line style key -->
    <line x1="366" y1="271" x2="394" y2="271" stroke="#1b2a3a" stroke-width="2"/>
    <text x="400" y="275">solid = start at A</text>
    <line x1="366" y1="289" x2="394" y2="289" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="400" y="293">dashed = start at T</text>
    <!-- colour key -->
    <g font-size="11.5">
      <rect x="366" y="304" width="10" height="10" fill="#2a6f97"/><text x="380" y="313">A</text>
      <rect x="408" y="304" width="10" height="10" fill="#bc4749"/><text x="422" y="313">C</text>
      <rect x="450" y="304" width="10" height="10" fill="#6a994e"/><text x="464" y="313">G</text>
      <rect x="492" y="304" width="10" height="10" fill="#1b2a3a"/><text x="506" y="313">T</text>
    </g>
  </g>
</svg>
