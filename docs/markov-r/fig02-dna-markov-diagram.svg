<svg xmlns="http://www.w3.org/2000/svg" viewBox="65.6 30 612.9 397.2" width="612.9" height="397.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a6f97"/></marker>
    <marker id="ah-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa7b4"/></marker>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bc4749"/></marker>
  </defs>

  <!-- ============ THIN / GRAY ARROWS (recede) ============ -->
  <g fill="none" stroke="#9aa7b4" stroke-width="1.2" marker-end="url(#ah-gray)">
    <!-- counter-clockwise edges -->
    <path d="M510,133 Q360,160 214,133"/>            <!-- C->A -->
    <path d="M528,290 Q495,220 528,152"/>            <!-- G->C -->
    <path d="M210,308 Q360,282 506,308"/>            <!-- T->G -->
    <path d="M192,152 Q225,220 192,288"/>            <!-- A->T -->
    <!-- diagonals -->
    <path d="M210,136 Q390,190 510,304"/>            <!-- A->G -->
    <path d="M510,304 Q330,250 210,136"/>            <!-- G->A -->
    <path d="M510,136 Q330,190 210,304"/>            <!-- C->T -->
    <path d="M210,304 Q390,250 510,136"/>            <!-- T->C -->
  </g>
  <g fill="#8a97a4" font-size="11" text-anchor="middle">
    <text x="360" y="172">0.25</text>   <!-- C->A -->
    <text x="481" y="223">0.25</text>   <!-- G->C -->
    <text x="360" y="276">0.25</text>   <!-- T->G -->
    <text x="241" y="223">0.25</text>   <!-- A->T -->
    <text x="278" y="176">0.25</text>   <!-- A->G -->
    <text x="452" y="272">0.25</text>   <!-- G->A -->
    <text x="452" y="173">0.35</text>   <!-- C->T -->
    <text x="278" y="267">0.30</text>   <!-- T->C -->
  </g>

  <!-- ============ PROMINENT CLOCKWISE CYCLE (blue) ============ -->
  <g fill="none" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#ah-blue)">
    <path d="M212,107 Q360,80 508,107"/>            <!-- A->C 0.20 -->
    <path d="M510,332 Q360,362 212,332"/>            <!-- G->T 0.25 -->
    <path d="M168,290 Q132,220 168,150"/>            <!-- T->A 0.15 -->
  </g>
  <g fill="#2a6f97" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="360" y="70">0.20</text>    <!-- A->C -->
    <text x="360" y="382">0.25</text>   <!-- G->T -->
    <text x="112" y="224">0.15</text>   <!-- T->A -->
  </g>

  <!-- ============ HIGHLIGHTED C->G (red, CpG dip) ============ -->
  <path d="M553,150 Q592,220 553,290" fill="none" stroke="#bc4749" stroke-width="2.6" marker-end="url(#ah-red)"/>
  <text x="606" y="182" font-size="16" font-weight="bold" fill="#bc4749">0.05</text>
  <text x="606" y="212" font-size="13" font-weight="bold" fill="#bc4749">CpG dip:</text>
  <text x="606" y="230" font-size="13" fill="#bc4749">G rarely</text>
  <text x="606" y="247" font-size="13" fill="#bc4749">follows C</text>

  <!-- ============ SELF-LOOPS (diagonal probabilities, blue) ============ -->
  <g fill="none" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#ah-blue)">
    <path d="M148.05,108.37 C102.93,75.5 135.5,42.93 168.37,88.05"/>   <!-- A->A -->
    <path d="M551.63,88.05 C584.5,42.93 617.07,75.5 571.95,108.37"/>   <!-- C->C -->
    <path d="M571.95,331.63 C617.07,364.5 584.5,397.07 551.63,351.95"/> <!-- G->G -->
    <path d="M168.37,351.95 C135.5,397.07 102.93,364.5 148.05,331.63"/> <!-- T->T -->
  </g>
  <g fill="#2a6f97" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="96" y="52">0.30</text>     <!-- A->A -->
    <text x="624" y="52">0.35</text>    <!-- C->C -->
    <text x="624" y="392">0.25</text>   <!-- G->G -->
    <text x="96" y="392">0.30</text>    <!-- T->T -->
  </g>

  <!-- ============ NODES ============ -->
  <g stroke="#1b2a3a" stroke-width="2" fill="#eaf1f7">
    <circle cx="180" cy="120" r="34"/>
    <circle cx="540" cy="120" r="34"/>
    <circle cx="540" cy="320" r="34"/>
    <circle cx="180" cy="320" r="34"/>
  </g>
  <g fill="#1b2a3a" font-size="26" font-weight="bold" text-anchor="middle">
    <text x="180" y="130">A</text>
    <text x="540" y="130">C</text>
    <text x="540" y="330">G</text>
    <text x="180" y="330">T</text>
  </g>

  <!-- ============ CAPTION ============ -->
  <text x="360" y="410" font-size="14" fill="#1b2a3a" text-anchor="middle" font-style="italic">each row of P sums to 1</text>
</svg>
