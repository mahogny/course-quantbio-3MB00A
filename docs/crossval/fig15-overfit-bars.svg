<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 388" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">Detecting overfitting in practice</text>

  <!-- Plot geometry: baseline y=320, top y=70, error 0 to 1 -->
  <!-- y = 320 minus error times 250 -->

  <!-- Axes -->
  <line x1="95" y1="60" x2="95" y2="320" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="95" y1="320" x2="600" y2="320" stroke="#1b2a3a" stroke-width="2"/>

  <!-- Y axis ticks -->
  <text x="86" y="325" text-anchor="end" font-size="13" fill="#1b2a3a">0</text>
  <line x1="90" y1="320" x2="95" y2="320" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="86" y="200" text-anchor="end" font-size="13" fill="#1b2a3a">0.5</text>
  <line x1="90" y1="195" x2="95" y2="195" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="86" y="75" text-anchor="end" font-size="13" fill="#1b2a3a">1.0</text>
  <line x1="90" y1="70" x2="95" y2="70" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- Y axis title -->
  <text x="32" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a" transform="rotate(-90 32 195)">error</text>

  <!-- gridline at 0.5 -->
  <line x1="95" y1="195" x2="600" y2="195" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Legend -->
  <rect x="430" y="52" width="18" height="12" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="454" y="62" font-size="13" fill="#1b2a3a">train error</text>
  <rect x="530" y="52" width="18" height="12" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="554" y="62" font-size="13" fill="#1b2a3a">CV error</text>

  <!-- ===== OVERFIT GROUP ===== -->
  <!-- train error 0.06 : y = 320 minus 0.06*250 = 305 -->
  <rect x="150" y="305" width="55" height="15" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- CV error 0.90 : y = 320 minus 0.90*250 = 95 -->
  <rect x="215" y="95" width="55" height="225" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- reference dashes at the two bar tops -->
  <line x1="177" y1="305" x2="305" y2="305" stroke="#bc4749" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="242" y1="95" x2="305" y2="95" stroke="#bc4749" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- big bracket between the two tops -->
  <path d="M300,305 h8 V95 h-8" fill="none" stroke="#bc4749" stroke-width="2"/>
  <line x1="338" y1="200" x2="309" y2="200" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="344" y="190" font-size="15" font-weight="bold" fill="#bc4749">big gap</text>
  <text x="344" y="213" font-size="14" fill="#bc4749">= overfitting</text>

  <!-- group label -->
  <text x="210" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Overfit</text>

  <!-- ===== HEALTHY GROUP ===== -->
  <!-- train error 0.34 : y = 320 minus 0.34*250 = 235 -->
  <rect x="470" y="235" width="55" height="85" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- CV error 0.40 : y = 320 minus 0.40*250 = 220 -->
  <rect x="535" y="220" width="55" height="100" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- small gap bracket -->
  <line x1="497" y1="235" x2="600" y2="235" stroke="#6a994e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="562" y1="220" x2="600" y2="220" stroke="#6a994e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M596,235 h6 V220 h-6" fill="none" stroke="#6a994e" stroke-width="2"/>
  <text x="598" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a994e">small gap</text>

  <!-- group label -->
  <text x="530" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Healthy</text>

  <!-- Bottom caption -->
  <text x="330" y="367" text-anchor="middle" font-size="13.5" font-style="italic" fill="#1b2a3a">large train-vs-CV gap → shrink harder (increase λ) or get more samples</text>
</svg>
