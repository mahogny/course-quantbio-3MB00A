<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- top axis title: number of non zero genes -->
  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#1b2a3a">non-zero genes (model size)</text>

  <!-- horizontal band: min CV error + 1 SE level -->
  <rect x="80" y="275.5" width="600" height="9" fill="#eaf1f7"/>
  <line x1="80" y1="280" x2="680" y2="280" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="676" y="271" text-anchor="end" font-size="12" fill="#7a8794">min CV error + 1 SE</text>

  <!-- faint horizontal grid -->
  <line x1="80" y1="130" x2="680" y2="130" stroke="#c9d3dd" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="180" x2="680" y2="180" stroke="#c9d3dd" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="230" x2="680" y2="230" stroke="#c9d3dd" stroke-width="1" opacity="0.6"/>

  <!-- plot axes -->
  <line x1="80" y1="80" x2="80" y2="330" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="80" y1="330" x2="690" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- top axis line with gene-count ticks -->
  <line x1="80" y1="80" x2="680" y2="80" stroke="#1b2a3a" stroke-width="1.5"/>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <line x1="110" y1="80" x2="110" y2="73" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="110" y="68">40</text>
    <line x1="245" y1="80" x2="245" y2="73" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="245" y="68">25</text>
    <line x1="380" y1="80" x2="380" y2="73" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="380" y="68">12</text>
    <line x1="515" y1="80" x2="515" y2="73" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="515" y="68">5</text>
    <line x1="650" y1="80" x2="650" y2="73" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="650" y="68">2</text>
  </g>

  <!-- vertical dashed line: lambda.min -->
  <line x1="272" y1="80" x2="272" y2="330" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="6,4"/>
  <!-- vertical dashed line: lambda.1se (rightmost model still within the +1 SE band) -->
  <line x1="326" y1="80" x2="326" y2="330" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="6,4"/>

  <!-- faint U-curve guide through the dots -->
  <polyline points="110,196.7 164,246.7 218,280 272,296.7 326,290 380,276.7 434,256.7 488,230 542,196.7 596,156.7 650,113.3"
            fill="none" stroke="#bc4749" stroke-width="1.5" opacity="0.25"/>

  <!-- error bars (+/- 1 SE across folds) -->
  <g stroke="#bc4749" stroke-width="1.5">
    <line x1="110" y1="178.7" x2="110" y2="214.7"/><line x1="106" y1="178.7" x2="114" y2="178.7"/><line x1="106" y1="214.7" x2="114" y2="214.7"/>
    <line x1="164" y1="230.7" x2="164" y2="262.7"/><line x1="160" y1="230.7" x2="168" y2="230.7"/><line x1="160" y1="262.7" x2="168" y2="262.7"/>
    <line x1="218" y1="265" x2="218" y2="295"/><line x1="214" y1="265" x2="222" y2="265"/><line x1="214" y1="295" x2="222" y2="295"/>
    <line x1="272" y1="282.7" x2="272" y2="310.7"/><line x1="268" y1="282.7" x2="276" y2="282.7"/><line x1="268" y1="310.7" x2="276" y2="310.7"/>
    <line x1="326" y1="276" x2="326" y2="304"/><line x1="322" y1="276" x2="330" y2="276"/><line x1="322" y1="304" x2="330" y2="304"/>
    <line x1="380" y1="261.7" x2="380" y2="291.7"/><line x1="376" y1="261.7" x2="384" y2="261.7"/><line x1="376" y1="291.7" x2="384" y2="291.7"/>
    <line x1="434" y1="240.7" x2="434" y2="272.7"/><line x1="430" y1="240.7" x2="438" y2="240.7"/><line x1="430" y1="272.7" x2="438" y2="272.7"/>
    <line x1="488" y1="212" x2="488" y2="248"/><line x1="484" y1="212" x2="492" y2="212"/><line x1="484" y1="248" x2="492" y2="248"/>
    <line x1="542" y1="176.7" x2="542" y2="216.7"/><line x1="538" y1="176.7" x2="546" y2="176.7"/><line x1="538" y1="216.7" x2="546" y2="216.7"/>
    <line x1="596" y1="134.7" x2="596" y2="178.7"/><line x1="592" y1="134.7" x2="600" y2="134.7"/><line x1="592" y1="178.7" x2="600" y2="178.7"/>
    <line x1="650" y1="89.3" x2="650" y2="137.3"/><line x1="646" y1="89.3" x2="654" y2="89.3"/><line x1="646" y1="137.3" x2="654" y2="137.3"/>
  </g>

  <!-- red CV-error dots -->
  <g fill="#bc4749">
    <circle cx="110" cy="196.7" r="4.5"/>
    <circle cx="164" cy="246.7" r="4.5"/>
    <circle cx="218" cy="280" r="4.5"/>
    <circle cx="272" cy="296.7" r="5"/>
    <circle cx="326" cy="290" r="4.5"/>
    <circle cx="380" cy="276.7" r="4.5"/>
    <circle cx="434" cy="256.7" r="4.5"/>
    <circle cx="488" cy="230" r="4.5"/>
    <circle cx="542" cy="196.7" r="4.5"/>
    <circle cx="596" cy="156.7" r="4.5"/>
    <circle cx="650" cy="113.3" r="4.5"/>
  </g>

  <!-- lambda.min label -->
  <text x="266" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#2a6f97">λ.min</text>
  <text x="266" y="120" text-anchor="end" font-size="12" fill="#2a6f97">(lowest CV error)</text>

  <!-- lambda.1se label -->
  <text x="333" y="104" text-anchor="start" font-size="14" font-weight="bold" fill="#6a994e">λ.1se</text>
  <text x="333" y="120" text-anchor="start" font-size="12" fill="#6a994e">(simplest within 1 SE)</text>

  <!-- axis labels -->
  <text x="385" y="358" text-anchor="middle" font-size="15" fill="#1b2a3a">log(λ)  →</text>
  <text x="26" y="205" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 26 205)">CV error (binomial deviance or 1 − AUC)</text>

  <!-- caption -->
  <text x="385" y="388" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">the U-curve, now measured</text>
</svg>
