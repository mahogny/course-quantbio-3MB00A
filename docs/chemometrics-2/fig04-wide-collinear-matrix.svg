<svg xmlns="http://www.w3.org/2000/svg" width="591.9" height="395.6" viewBox="9.4 -8.2 591.9 395.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- title annotation p much greater than n -->
  <text x="300" y="22" text-anchor="middle" font-size="22" font-weight="bold" fill="#bc4749">p &gt;&gt; n</text>

  <!-- TOP bracket: p wavelengths spanning full width of X -->
  <path d="M60,58 L60,50 L500,50 L500,58" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="280" y="42" text-anchor="middle" font-size="14" fill="#1b2a3a">p wavelengths (columns)</text>

  <!-- LEFT bracket: n samples -->
  <path d="M50,68 L42,68 L42,238 L50,238" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="36" y="153" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 36 153)">n samples (rows)</text>

  <!-- X matrix: wide rectangle -->
  <rect x="60" y="68" width="440" height="170" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- faint vertical stripes: several adjacent near identical columns -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="80"  y1="68" x2="80"  y2="238"/>
    <line x1="98"  y1="68" x2="98"  y2="238"/>
    <line x1="116" y1="68" x2="116" y2="238"/>
    <line x1="134" y1="68" x2="134" y2="238"/>
    <line x1="152" y1="68" x2="152" y2="238"/>
    <line x1="170" y1="68" x2="170" y2="238"/>
    <line x1="188" y1="68" x2="188" y2="238"/>
    <line x1="206" y1="68" x2="206" y2="238"/>
    <line x1="224" y1="68" x2="224" y2="238"/>
    <line x1="242" y1="68" x2="242" y2="238"/>
    <line x1="260" y1="68" x2="260" y2="238"/>
    <line x1="278" y1="68" x2="278" y2="238"/>
    <line x1="296" y1="68" x2="296" y2="238"/>
    <line x1="314" y1="68" x2="314" y2="238"/>
    <line x1="332" y1="68" x2="332" y2="238"/>
    <line x1="350" y1="68" x2="350" y2="238"/>
    <line x1="368" y1="68" x2="368" y2="238"/>
    <line x1="386" y1="68" x2="386" y2="238"/>
    <line x1="404" y1="68" x2="404" y2="238"/>
    <line x1="422" y1="68" x2="422" y2="238"/>
    <line x1="440" y1="68" x2="440" y2="238"/>
    <line x1="458" y1="68" x2="458" y2="238"/>
    <line x1="476" y1="68" x2="476" y2="238"/>
  </g>

  <!-- highlight box around ~4 neighbouring near duplicate columns inside X (kept left of the centred X label) -->
  <rect x="125" y="68" width="72" height="170" fill="none" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- X label inside -->
  <text x="280" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">X : n × p spectra</text>

  <!-- y vector: tall thin single column, same height as X -->
  <rect x="522" y="68" width="30" height="170" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="522" y1="102" x2="552" y2="102"/>
    <line x1="522" y1="136" x2="552" y2="136"/>
    <line x1="522" y1="170" x2="552" y2="170"/>
    <line x1="522" y1="204" x2="552" y2="204"/>
  </g>
  <text x="537" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a994e" transform="rotate(-90 537 158)">y</text>
  <text x="575" y="153" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(90 575 153)">y : target (concentration or class)</text>

  <!-- magnified callout of 4 neighbouring columns almost identical -->
  <line x1="161" y1="238" x2="115" y2="288" stroke="#2a6f97" stroke-width="1.2"/>
  <line x1="161" y1="238" x2="265" y2="288" stroke="#2a6f97" stroke-width="1.2"/>
  <rect x="115" y="288" width="150" height="66" fill="#ffffff" stroke="#2a6f97" stroke-width="1.8"/>
  <!-- 4 nearly identical bar profiles -->
  <g>
    <rect x="125" y="300" width="26" height="42" fill="#c9d3dd" stroke="#2a6f97" stroke-width="1"/>
    <rect x="159" y="299" width="26" height="43" fill="#c9d3dd" stroke="#2a6f97" stroke-width="1"/>
    <rect x="193" y="300" width="26" height="42" fill="#c9d3dd" stroke="#2a6f97" stroke-width="1"/>
    <rect x="227" y="301" width="26" height="41" fill="#c9d3dd" stroke="#2a6f97" stroke-width="1"/>
  </g>
  <text x="190" y="296" text-anchor="middle" font-size="10" fill="#2a6f97">≈ ≈ ≈</text>

  <!-- callout caption -->
  <text x="190" y="368" text-anchor="middle" font-size="12.5" fill="#bc4749">neighbouring wavelengths ≈ duplicated info → collinear</text>

  <!-- side note about X-transpose-X not invertible -->
  <text x="435" y="300" text-anchor="start" font-size="13" fill="#bc4749">X<tspan font-size="9" dy="-5">T</tspan><tspan dy="5" dx="2">X not invertible</tspan></text>
  <text x="435" y="318" text-anchor="start" font-size="13" fill="#bc4749">→ plain lm() breaks</text>
</svg>
