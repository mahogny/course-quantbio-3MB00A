<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="18" font-weight="bold" fill="#1b2a3a">Classification of spectra: latent-space view</text>

  <!-- axes -->
  <line x1="80" y1="322" x2="552" y2="322" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="80" y1="322" x2="80" y2="42" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="505" y="340" font-size="15" fill="#1b2a3a">PC1 (LV1)</text>
  <text x="34" y="185" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 34 185)">PC2 (LV2)</text>

  <!-- dashed decision boundaries (PLS-DA / LDA) -->
  <g stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="7 5" fill="none" opacity="0.75">
    <line x1="280" y1="175" x2="300" y2="46"/>
    <line x1="280" y1="175" x2="110" y2="320"/>
    <line x1="280" y1="175" x2="470" y2="315"/>
  </g>

  <!-- SIMCA per-class confidence ellipses -->
  <ellipse cx="175" cy="118" rx="46" ry="38" transform="rotate(-18 175 118)" fill="#eaf1f7" fill-opacity="0.7" stroke="#2a6f97" stroke-width="1.6" stroke-dasharray="3 3"/>
  <ellipse cx="422" cy="124" rx="48" ry="40" transform="rotate(12 422 124)" fill="#fdf3e7" fill-opacity="0.7" stroke="#e69f00" stroke-width="1.6" stroke-dasharray="3 3"/>
  <ellipse cx="286" cy="252" rx="52" ry="32" transform="rotate(-6 286 252)" fill="#eef4e8" fill-opacity="0.7" stroke="#6a994e" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- class A: blue circles -->
  <g fill="#2a6f97">
    <circle cx="150" cy="98" r="5"/><circle cx="180" cy="92" r="5"/><circle cx="165" cy="115" r="5"/>
    <circle cx="195" cy="112" r="5"/><circle cx="145" cy="130" r="5"/><circle cx="178" cy="135" r="5"/>
    <circle cx="200" cy="102" r="5"/><circle cx="160" cy="148" r="5"/>
  </g>

  <!-- class B: orange triangles -->
  <g fill="#e69f00">
    <polygon points="398,96 392,107 404,107"/><polygon points="432,92 426,103 438,103"/>
    <polygon points="412,116 406,127 418,127"/><polygon points="445,112 439,123 451,123"/>
    <polygon points="395,132 389,143 401,143"/><polygon points="438,136 432,147 444,147"/>
    <polygon points="458,122 452,133 464,133"/><polygon points="418,146 412,157 424,157"/>
  </g>

  <!-- class C: green squares -->
  <g fill="#6a994e">
    <rect x="255" y="231" width="10" height="10"/><rect x="285" y="227" width="10" height="10"/>
    <rect x="267" y="251" width="10" height="10"/><rect x="300" y="247" width="10" height="10"/>
    <rect x="250" y="261" width="10" height="10"/><rect x="283" y="269" width="10" height="10"/>
    <rect x="313" y="257" width="10" height="10"/><rect x="295" y="235" width="10" height="10"/>
  </g>

  <!-- cluster labels -->
  <text x="118" y="82" font-size="13" fill="#2a6f97" font-weight="bold">tissue A</text>
  <text x="440" y="86" font-size="13" fill="#c07f00" font-weight="bold">tissue B</text>
  <text x="238" y="298" font-size="13" fill="#5a8442" font-weight="bold">control</text>

  <!-- the outlier: new sample, fits no model -->
  <polygon points="490,272 493.2,280.6 502.4,281.0 495.2,286.7 497.6,295.5 490,290.5 482.4,295.5 484.8,286.7 477.6,281.0 486.8,280.6"
           fill="#bc4749" stroke="#7a2e2f" stroke-width="1.2"/>
  <circle cx="490" cy="285" r="20" fill="none" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- annotation arrow to outlier -->
  <path d="M300,352 C380,360 450,320 486,300" fill="none" stroke="#bc4749" stroke-width="1.6" marker-end="url(#arrowr)"/>
  <text x="96" y="352" font-size="14" fill="#bc4749" font-weight="bold">new sample fits no class model</text>
  <text x="96" y="371" font-size="14" fill="#bc4749">SIMCA answer: &#8220;none of them&#8221;</text>

  <!-- legend panel -->
  <rect x="572" y="58" width="112" height="200" rx="6" fill="#ffffff" fill-opacity="0.6" stroke="#c9d3dd" stroke-width="1.2"/>
  <text x="582" y="76" font-size="13" font-weight="bold" fill="#1b2a3a">Legend</text>

  <circle cx="590" cy="96" r="5" fill="#2a6f97"/>
  <text x="602" y="100" font-size="12" fill="#1b2a3a">tissue A</text>
  <polygon points="590,113 584,124 596,124" fill="#e69f00"/>
  <text x="602" y="123" font-size="12" fill="#1b2a3a">tissue B</text>
  <rect x="585" y="135" width="10" height="10" fill="#6a994e"/>
  <text x="602" y="144" font-size="12" fill="#1b2a3a">control</text>
  <polygon points="590,156 592.6,163 599.9,163.3 594.2,167.8 596.1,174.8 590,171 583.9,174.8 585.8,167.8 580.1,163.3 587.4,163"
           fill="#bc4749"/>
  <text x="602" y="169" font-size="12" fill="#1b2a3a">unknown</text>

  <ellipse cx="590" cy="192" rx="12" ry="7" fill="none" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="582" y="212" font-size="11" fill="#1b2a3a">= SIMCA model</text>
  <text x="582" y="226" font-size="11" fill="#1b2a3a">(per class)</text>
  <line x1="580" y1="238" x2="600" y2="238" stroke="#1b2a3a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="582" y="252" font-size="11" fill="#1b2a3a">= LDA / PLS-DA</text>
</svg>
