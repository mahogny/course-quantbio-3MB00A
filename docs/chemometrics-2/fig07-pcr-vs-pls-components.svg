<svg xmlns="http://www.w3.org/2000/svg" width="651.0" height="358.3" viewBox="41.1 41.1 651.0 358.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGrey" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#6b7885"/>
    </marker>
    <marker id="arrowAcc" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#bc4749"/>
    </marker>
    <linearGradient id="ybar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e6eff8"/>
      <stop offset="1" stop-color="#102e47"/>
    </linearGradient>
  </defs>

  <!-- axes -->
  <line x1="92" y1="60" x2="92" y2="316" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="92" y1="316" x2="588" y2="316" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="340" y="340" text-anchor="middle" font-size="14" fill="#1b2a3a">X-direction 1 (largest X variance)</text>
  <text x="70" y="188" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 70 188)">X-direction 2</text>

  <!-- muted ellipse showing the elongated spread, long axis horizontal -->
  <ellipse cx="322" cy="190" rx="150" ry="62" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- sample points coloured by target y (light = low y, dark = high y) -->
  <circle cx="326.2" cy="209.5" r="6.5" fill="#a4b3c1" stroke="#1b2a3a" stroke-width="0.8"/>
