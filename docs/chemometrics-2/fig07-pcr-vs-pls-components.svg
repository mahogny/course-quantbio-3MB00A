  <!-- cloud centre -->
  <circle cx="322" cy="190" r="3" fill="#1b2a3a"/>

  <!-- PCR arrow: solid grey along long axis (biggest X variance, y-blind) -->
  <line x1="322" y1="190" x2="474" y2="190" stroke="#6b7885" stroke-width="3" marker-end="url(#arrowGrey)"/>
  <text x="486" y="182" font-size="13.5" font-weight="bold" fill="#4a5560">PCR: PC1 =</text>
  <text x="486" y="198" font-size="13.5" fill="#4a5560">biggest variation</text>
  <text x="486" y="214" font-size="13.5" fill="#4a5560">in X (y-blind)</text>

  <!-- PLS arrow: solid accent along the y-gradient direction (y-aware) -->
  <line x1="322" y1="190" x2="448" y2="108" stroke="#bc4749" stroke-width="3" marker-end="url(#arrowAcc)"/>
  <text x="300" y="78" font-size="13.5" font-weight="bold" fill="#bc4749">PLS: component</text>
  <text x="300" y="94" font-size="13.5" fill="#bc4749">aligned with y (y-aware)</text>

  <!-- y colour bar -->
  <rect x="628" y="96" width="18" height="150" fill="url(#ybar)" stroke="#1b2a3a" stroke-width="1"/>
  <text x="637" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">y</text>
  <text x="652" y="104" font-size="11.5" fill="#1b2a3a">high</text>
  <text x="652" y="245" font-size="11.5" fill="#1b2a3a">low</text>

  <!-- takeaway -->
  <text x="340" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">PLS points where y changes, not just where X spreads most</text>
