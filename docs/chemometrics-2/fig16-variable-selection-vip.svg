<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shared vertical selection bands, spanning both panels -->
  <rect x="160" y="40"  width="55" height="135" fill="#6a994e" opacity="0.16"/>
  <rect x="160" y="235" width="55" height="120" fill="#6a994e" opacity="0.16"/>
  <rect x="340" y="40"  width="60" height="135" fill="#6a994e" opacity="0.16"/>
  <rect x="340" y="235" width="60" height="120" fill="#6a994e" opacity="0.16"/>
  <rect x="490" y="40"  width="70" height="135" fill="#6a994e" opacity="0.16"/>
  <rect x="490" y="235" width="70" height="120" fill="#6a994e" opacity="0.16"/>

  <!-- ===================== TOP PANEL: spectrum ===================== -->
  <text x="90" y="30" font-size="15" font-weight="bold" fill="#1b2a3a">Absorbance spectrum</text>

  <!-- panel frame axes -->
  <line x1="90" y1="40" x2="90" y2="175" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="90" y1="175" x2="620" y2="175" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="46" y="112" font-size="13" fill="#1b2a3a" transform="rotate(-90 46 112)" text-anchor="middle">Absorbance</text>

  <!-- teal spectrum curve -->
  <path d="M90,150 C120,140 140,120 165,90 C185,66 205,70 215,100
           C240,140 300,138 345,112 C365,100 385,86 400,96
           C430,118 470,132 495,116 C520,100 545,64 560,78
           C585,100 605,130 620,138"
        fill="none" stroke="#2a6f97" stroke-width="2.2"/>

  <!-- band labels -->
  <text x="355" y="55" font-size="12.5" fill="#3d6b28" text-anchor="middle" font-weight="bold">selected informative bands</text>
  <text x="355" y="70" font-size="11" fill="#3d6b28" text-anchor="middle">(chemically meaningful)</text>
  <text x="270" y="167" font-size="10.5" fill="#7a8794" text-anchor="middle">dropped: noisy, uninformative</text>
  <text x="450" y="167" font-size="10.5" fill="#7a8794" text-anchor="middle">dropped</text>

  <!-- ===================== BOTTOM PANEL: VIP scores ===================== -->
  <text x="90" y="225" font-size="15" font-weight="bold" fill="#1b2a3a">VIP-score profile</text>

  <line x1="90" y1="235" x2="90" y2="355" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="90" y1="355" x2="620" y2="355" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="46" y="295" font-size="13" fill="#1b2a3a" transform="rotate(-90 46 295)" text-anchor="middle">VIP score</text>

  <!-- VIP = 1 threshold, y=307; baseline (VIP=0) y=355 -->
  <line x1="90" y1="307" x2="620" y2="307" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="98" y="302" font-size="11.5" fill="#bc4749" font-weight="bold">VIP = 1</text>

  <!-- VIP curve: peaks cross the threshold exactly under shaded bands -->
  <path d="M90,347 C120,345 145,344 160,335 C175,322 182,275 188,278 C196,282 205,320 215,335
           C245,346 300,348 340,340 C355,332 365,268 370,270 C378,274 388,325 400,338
           C440,347 470,346 490,336 C510,324 520,258 525,262 C535,270 548,326 560,338
           C585,347 605,349 620,349"
        fill="none" stroke="#1b2a3a" stroke-width="2.2"/>

  <!-- markers where peaks cross: keep -->
  <circle cx="188" cy="278" r="3" fill="#6a994e"/>
  <circle cx="370" cy="270" r="3" fill="#6a994e"/>
  <circle cx="525" cy="262" r="3" fill="#6a994e"/>
  <text x="525" y="250" font-size="12.5" fill="#3d6b28" font-weight="bold" text-anchor="middle">VIP &gt; 1 → keep</text>

  <!-- x-axis (shared) tick labels -->
  <text x="90"  y="372" font-size="11" fill="#1b2a3a" text-anchor="middle">1000</text>
  <text x="266" y="372" font-size="11" fill="#1b2a3a" text-anchor="middle">1500</text>
  <text x="443" y="372" font-size="11" fill="#1b2a3a" text-anchor="middle">2000</text>
  <text x="620" y="372" font-size="11" fill="#1b2a3a" text-anchor="middle">2500</text>
  <text x="355" y="372" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Wavelength (nm)</text>

  <!-- caution strip -->
  <rect x="45" y="381" width="575" height="17" rx="3" fill="#bc4749" opacity="0.12"/>
  <text x="332" y="393" font-size="11" fill="#bc4749" text-anchor="middle" font-weight="bold">select INSIDE the cross-validation loop, not before — otherwise reported error is optimistic</text>
</svg>
