<svg xmlns="http://www.w3.org/2000/svg" width="869.7" height="315.2" viewBox="16.4 45.0 869.7 315.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- faint vertical gridlines every 150 nm -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="70" x2="90" y2="250"/>
    <line x1="139" y1="70" x2="139" y2="250"/>
    <line x1="188" y1="70" x2="188" y2="250"/>
    <line x1="237" y1="70" x2="237" y2="250"/>
    <line x1="286" y1="70" x2="286" y2="250"/>
    <line x1="335" y1="70" x2="335" y2="250"/>
    <line x1="384" y1="70" x2="384" y2="250"/>
    <line x1="433" y1="70" x2="433" y2="250"/>
    <line x1="482" y1="70" x2="482" y2="250"/>
    <line x1="531" y1="70" x2="531" y2="250"/>
    <line x1="580" y1="70" x2="580" y2="250"/>
  </g>

  <!-- axes -->
  <g stroke="#8a97a4" stroke-width="1.6" fill="none">
    <line x1="90" y1="250" x2="580" y2="250"/>
    <line x1="90" y1="250" x2="90" y2="70"/>
  </g>

  <!-- small x ticks every 50 nm to convey hundreds of channels -->
  <g stroke="#8a97a4" stroke-width="1">
    <line x1="90" y1="250" x2="90" y2="256"/>
    <line x1="106.3" y1="250" x2="106.3" y2="255"/>
    <line x1="122.7" y1="250" x2="122.7" y2="255"/>
    <line x1="139" y1="250" x2="139" y2="256"/>
    <line x1="155.3" y1="250" x2="155.3" y2="255"/>
    <line x1="171.7" y1="250" x2="171.7" y2="255"/>
    <line x1="188" y1="250" x2="188" y2="256"/>
    <line x1="204.3" y1="250" x2="204.3" y2="255"/>
    <line x1="220.7" y1="250" x2="220.7" y2="255"/>
    <line x1="237" y1="250" x2="237" y2="256"/>
    <line x1="253.3" y1="250" x2="253.3" y2="255"/>
    <line x1="269.7" y1="250" x2="269.7" y2="255"/>
    <line x1="286" y1="250" x2="286" y2="256"/>
    <line x1="302.3" y1="250" x2="302.3" y2="255"/>
    <line x1="318.7" y1="250" x2="318.7" y2="255"/>
    <line x1="335" y1="250" x2="335" y2="256"/>
    <line x1="351.3" y1="250" x2="351.3" y2="255"/>
    <line x1="367.7" y1="250" x2="367.7" y2="255"/>
    <line x1="384" y1="250" x2="384" y2="256"/>
    <line x1="400.3" y1="250" x2="400.3" y2="255"/>
    <line x1="416.7" y1="250" x2="416.7" y2="255"/>
    <line x1="433" y1="250" x2="433" y2="256"/>
    <line x1="449.3" y1="250" x2="449.3" y2="255"/>
    <line x1="465.7" y1="250" x2="465.7" y2="255"/>
    <line x1="482" y1="250" x2="482" y2="256"/>
    <line x1="498.3" y1="250" x2="498.3" y2="255"/>
    <line x1="514.7" y1="250" x2="514.7" y2="255"/>
    <line x1="531" y1="250" x2="531" y2="256"/>
    <line x1="547.3" y1="250" x2="547.3" y2="255"/>
    <line x1="563.7" y1="250" x2="563.7" y2="255"/>
    <line x1="580" y1="250" x2="580" y2="256"/>
  </g>

  <!-- x-axis labels -->
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="90" y="270">1000</text>
    <text x="253" y="270">1500</text>
    <text x="417" y="270">2000</text>
    <text x="580" y="270">2500</text>
  </g>

  <!-- axis titles -->
  <text x="335" y="290" fill="#1b2a3a" font-size="15" text-anchor="middle">Wavelength (nm)</text>
  <text x="52" y="160" fill="#1b2a3a" font-size="15" text-anchor="middle" transform="rotate(-90 52 160)">Absorbance</text>

  <!-- absorbance spectrum: single teal curve, broad overlapping peaks -->
  <path fill="none" stroke="#2a9d8f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
    d="M 90.0,236.7 L 98.2,232.3 L 106.3,225.4 L 114.5,215.7 L 122.7,203.9 L 130.8,191.9 L 139.0,182.5 L 147.2,178.1 L 155.3,180.0 L 163.5,187.3 L 171.7,197.6 L 179.8,207.1 L 188.0,211.4 L 196.2,207.1 L 204.3,192.2 L 212.5,168.8 L 220.7,143.8 L 228.8,126.8 L 237.0,125.3 L 245.2,140.4 L 253.3,165.9 L 261.5,192.9 L 269.7,214.5 L 277.8,228.1 L 286.0,234.9 L 294.2,236.9 L 302.3,235.9 L 310.5,232.5 L 318.7,226.7 L 326.8,217.8 L 335.0,205.5 L 343.2,189.4 L 351.3,170.2 L 359.5,149.1 L 367.7,128.1 L 375.8,109.9 L 384.0,96.8 L 392.2,91.0 L 400.3,93.2 L 408.5,102.9 L 416.7,118.0 L 424.8,135.5 L 433.0,152.1 L 441.2,164.5 L 449.3,170.7 L 457.5,170.1 L 465.7,163.9 L 473.8,155.2 L 482.0,147.8 L 490.2,145.0 L 498.3,149.0 L 506.5,159.4 L 514.7,174.5 L 522.8,191.2 L 531.0,206.7 L 539.2,219.4 L 547.3,228.5 L 555.5,234.4 L 563.7,237.8 L 571.8,239.6 L 580.0,240.4"/>

  <!-- curly brace spanning the whole wavelength axis -->
  <path fill="none" stroke="#8a97a4" stroke-width="1.8" stroke-linecap="round"
    d="M 90,300 C 90,309 96,310 105,310 L 328,310 C 334,310 335,313 335,320 C 335,313 336,310 342,310 L 565,310 C 574,310 580,309 580,300"/>
  <text x="335" y="336" fill="#1b2a3a" font-size="15" text-anchor="middle" font-style="italic">hundreds of correlated channels</text>

  <!-- big arrow: pattern collapses to one scalar -->
  <line x1="600" y1="150" x2="682" y2="150" stroke="#1b2a3a" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- boxed scalar output -->
  <rect x="700" y="112" width="160" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="780" y="140" fill="#1b2a3a" font-size="14" text-anchor="middle">one number we want</text>
  <text x="780" y="168" fill="#2a6f97" font-size="20" text-anchor="middle" font-weight="bold">protein = 12.4 %</text>

  <!-- caption under the arrow -->
  <text x="641" y="212" fill="#5a6773" font-size="12.5" text-anchor="middle" font-style="italic">the answer is in</text>
  <text x="641" y="228" fill="#5a6773" font-size="12.5" text-anchor="middle" font-style="italic">the pattern,</text>
  <text x="641" y="244" fill="#5a6773" font-size="12.5" text-anchor="middle" font-style="italic">not one channel</text>
</svg>
