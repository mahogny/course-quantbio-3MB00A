  <line x1="48" y1="248" x2="48" y2="58" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#axtip)"/>
  <text x="143" y="266" text-anchor="middle" font-size="12" fill="#1b2a3a">Wavelength →</text>
  <text x="38" y="156" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 38 156)">signal</text>
  <text x="143" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#bc4749">baseline drift + scatter</text>

