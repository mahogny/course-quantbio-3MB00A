  <text x="648" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#bc4749">−</text>
  <text x="672" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a994e">+</text>
  <text x="702" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#bc4749">−</text>

  <!-- panel 3 axes -->
  <line x1="572" y1="248" x2="776" y2="248" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#axtip)"/>
  <line x1="572" y1="248" x2="572" y2="58" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#axtip)"/>
  <text x="667" y="266" text-anchor="middle" font-size="12" fill="#1b2a3a">Wavelength →</text>
  <text x="552" y="156" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 552 156)">d/dλ</text>
  <text x="667" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a6f97">overlapping peaks sharpened</text>

  <!-- ===================== WARNING BANNER ===================== -->
  <rect x="48" y="316" width="714" height="60" rx="6" fill="#f7e7e7" stroke="#bc4749" stroke-width="1.8"/>
  <!-- drawn warning triangle icon (emoji glyph does not render in cairosvg) -->
  <path d="M88,331 L103,357 L73,357 Z" fill="#bc4749" stroke="#bc4749" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="88" y="354" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">!</text>
  <text x="405" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#bc4749">Preprocessing choices are FIXED on TRAINING data,</text>
  <text x="405" y="360" text-anchor="middle" font-size="14" fill="#8a2f31">then re-applied identically to new data — never fit on the test set.</text>
</svg>
