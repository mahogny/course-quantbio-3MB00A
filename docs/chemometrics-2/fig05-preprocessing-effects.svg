    <path d="M 310.0,242.0 L 326.0,241.2 L 338.7,233.4 L 346.7,214.5 L 354.7,176.1 L 362.7,123.9 L 370.7,83.3 L 375.5,76.4 L 383.4,96.4 L 391.4,132.4 L 397.8,149.5 L 401.0,150.7 L 407.4,139.9 L 415.4,115.7 L 423.4,102.8 L 429.7,110.6 L 437.7,140.2 L 445.7,178.0 L 453.7,209.3 L 461.7,228.5 L 469.7,237.4 L 477.6,240.7 L 485.6,241.7 L 500.0,242.0"/>
