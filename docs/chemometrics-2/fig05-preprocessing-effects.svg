    <path d="M 310.0,238.0 L 326.0,237.3 L 338.7,229.5 L 346.7,210.5 L 354.7,172.1 L 362.7,120.0 L 370.7,79.4 L 375.5,72.4 L 383.4,92.5 L 391.4,128.5 L 397.8,145.6 L 401.0,146.8 L 407.4,136.0 L 415.4,111.8 L 423.4,98.9 L 429.7,106.7 L 437.7,136.3 L 445.7,174.1 L 453.7,205.4 L 461.7,224.5 L 469.7,233.5 L 477.6,236.8 L 485.6,237.8 L 500.0,238.0"/>
  </g>

  <!-- panel 2 axes -->
  <line x1="310" y1="248" x2="514" y2="248" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#axtip)"/>
  <line x1="310" y1="248" x2="310" y2="58" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#axtip)"/>
  <text x="405" y="266" text-anchor="middle" font-size="12" fill="#1b2a3a">Wavelength →</text>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#1b2a3a" transform="rotate(-90 300 156)">signal</text>
  <text x="405" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a994e">nuisance removed, peaks aligned</text>

  <!-- arrow panel 2 to 3 (raised to clear panel 3 y-axis title) -->
  <line x1="510" y1="112" x2="566" y2="112" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== PANEL 3: 1st DERIVATIVE ===================== -->
  <text x="667" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">1st derivative</text>
  <text x="667" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">(Savitzky–Golay)</text>
  <rect x="572" y="64" width="190" height="184" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>

  <!-- zero line -->
  <line x1="572" y1="156" x2="762" y2="156" stroke="#c9d3dd" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="569" y="160" text-anchor="end" font-size="11" fill="#1b2a3a">0</text>

  <!-- derivative curve with positive / negative lobes -->
  <path fill="none" stroke="#2a6f97" stroke-width="2"
    d="M 572.0,156.0 L 588.0,154.2 L 597.5,146.0 L 605.5,127.4 L 611.9,104.7 L 618.3,84.6 L 621.5,80.6 L 626.3,87.4 L 632.7,121.7 L 639.1,169.9 L 645.4,198.2 L 648.6,209.1 L 653.4,200.6 L 659.8,169.2 L 666.2,136.3 L 671.0,122.3 L 674.2,120.5 L 680.6,134.0 L 687.0,162.1 L 693.3,190.6 L 699.7,207.5 L 702.9,210.0 L 707.7,207.1 L 714.1,195.3 L 722.1,177.8 L 730.1,165.3 L 738.1,159.1 L 747.6,156.6 L 762.0,156.0"/>

  <!-- lobe polarity markers -->
