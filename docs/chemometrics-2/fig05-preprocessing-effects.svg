  <text x="405" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">(SNV / MSC)</text>
  <rect x="310" y="64" width="190" height="184" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>

  <!-- flat baseline guide -->
  <line x1="310" y1="242" x2="500" y2="242" stroke="#6a994e" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.85"/>
  <!-- peak alignment guide -->
  <line x1="375" y1="70" x2="375" y2="248" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="3 3"/>

