<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===================== MAIN PANEL: scores scatter ===================== -->
  <text x="98" y="24" text-anchor="start" font-size="15" font-weight="bold" fill="#1b2a3a">T<tspan font-size="10" dy="-5">2</tspan><tspan dy="5"> : distance WITHIN the model plane</tspan></text>

  <!-- PC axes -->
  <line x1="55" y1="170" x2="420" y2="170" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="235" y1="300" x2="235" y2="38" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="188" text-anchor="end" font-size="14" fill="#1b2a3a">PC1</text>
  <text x="248" y="48" font-size="14" fill="#1b2a3a">PC2</text>

  <!-- Hotelling T2 confidence ellipse (95%) -->
  <ellipse cx="235" cy="170" rx="120" ry="82" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="163" y="272" text-anchor="start" font-size="12.5" fill="#2a6f97">Hotelling T<tspan font-size="8.5" dy="-4">2</tspan><tspan dy="4"> limit (95%)</tspan></text>

  <!-- normal cluster ~25 points -->
  <g fill="#1b2a3a">
    <circle cx="230" cy="165" r="3.2"/>
    <circle cx="245" cy="160" r="3.2"/>
    <circle cx="220" cy="175" r="3.2"/>
    <circle cx="250" cy="178" r="3.2"/>
    <circle cx="235" cy="150" r="3.2"/>
    <circle cx="225" cy="155" r="3.2"/>
    <circle cx="262" cy="170" r="3.2"/>
    <circle cx="210" cy="168" r="3.2"/>
    <circle cx="240" cy="185" r="3.2"/>
    <circle cx="228" cy="182" r="3.2"/>
    <circle cx="255" cy="158" r="3.2"/>
    <circle cx="213" cy="160" r="3.2"/>
    <circle cx="238" cy="172" r="3.2"/>
    <circle cx="248" cy="168" r="3.2"/>
    <circle cx="222" cy="165" r="3.2"/>
    <circle cx="232" cy="178" r="3.2"/>
    <circle cx="258" cy="180" r="3.2"/>
    <circle cx="212" cy="178" r="3.2"/>
    <circle cx="244" cy="152" r="3.2"/>
    <circle cx="230" cy="190" r="3.2"/>
    <circle cx="252" cy="188" r="3.2"/>
    <circle cx="218" cy="150" r="3.2"/>
    <circle cx="236" cy="162" r="3.2"/>
    <circle cx="264" cy="158" r="3.2"/>
    <circle cx="242" cy="176" r="3.2"/>
  </g>

  <!-- high T2 red point: inside plane, outside ellipse -->
  <circle cx="392" cy="170" r="5" fill="#bc4749"/>
  <line x1="235" y1="170" x2="386" y2="170" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="368" y="150" text-anchor="start" font-size="12" font-weight="bold" fill="#bc4749">high T<tspan font-size="8.5" dy="-4">2</tspan></text>
  <text x="384" y="230" text-anchor="middle" font-size="11.5" fill="#bc4749">unusual but KNOWN</text>
  <text x="384" y="245" text-anchor="middle" font-size="11.5" fill="#bc4749">type of variation</text>

  <!-- divider -->
  <line x1="450" y1="30" x2="450" y2="290" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ===================== INSET: 3D off-plane schematic ===================== -->
  <text x="665" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Q / SPE : distance OFF the model</text>

  <!-- model plane (PC1 to PC2 subspace) as a parallelogram -->
  <polygon points="510,150 700,110 800,180 610,225" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="655" y="248" text-anchor="middle" font-size="12" fill="#2a6f97">model plane (PC1 to PC2)</text>

  <!-- points lying ON the plane -->
  <g fill="#1b2a3a">
    <circle cx="580" cy="165" r="3"/>
    <circle cx="620" cy="150" r="3"/>
    <circle cx="660" cy="158" r="3"/>
    <circle cx="700" cy="150" r="3"/>
    <circle cx="640" cy="182" r="3"/>
    <circle cx="690" cy="178" r="3"/>
    <circle cx="600" cy="182" r="3"/>
  </g>

  <!-- point floating ABOVE the plane with perpendicular dropped line -->
  <line x1="655" y1="60" x2="655" y2="163" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowred)"/>
  <circle cx="655" cy="163" r="2.5" fill="#bc4749"/>
  <circle cx="655" cy="55" r="5.5" fill="#bc4749"/>
  <!-- small right-angle tick at foot -->
  <path d="M648,163 L648,156 L655,156" fill="none" stroke="#bc4749" stroke-width="1.2"/>
  <text x="655" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4749">Q / SPE</text>
  <text x="770" y="95" text-anchor="middle" font-size="11.5" fill="#bc4749">variation</text>
  <text x="770" y="110" text-anchor="middle" font-size="11.5" fill="#bc4749">NEVER seen</text>

  <!-- ===================== CONTROL CHART ===================== -->
  <text x="440" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">monitoring chart</text>
  <!-- axes -->
  <line x1="70" y1="330" x2="70" y2="400" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="70" y1="400" x2="855" y2="400" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="848" y="416" text-anchor="end" font-size="12" fill="#1b2a3a">sample index</text>
  <text x="60" y="336" text-anchor="end" font-size="12" fill="#1b2a3a">stat</text>

  <!-- control limit -->
  <line x1="70" y1="342" x2="850" y2="342" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="850" y="338" text-anchor="end" font-size="11.5" fill="#bc4749">control limit</text>

  <!-- bars: most in-spec (green), one over limit (red) -->
  <g stroke="#6a994e" stroke-width="1">
    <rect x="90"  y="372" width="20" height="28" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="150" y="366" width="20" height="34" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="210" y="378" width="20" height="22" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="270" y="360" width="20" height="40" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="330" y="370" width="20" height="30" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="390" y="356" width="20" height="44" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="450" y="374" width="20" height="26" fill="#6a994e" fill-opacity="0.5"/>
  </g>
  <!-- out of spec bar -->
  <rect x="510" y="322" width="20" height="78" fill="#bc4749" fill-opacity="0.65" stroke="#bc4749" stroke-width="1"/>
  <g stroke="#6a994e" stroke-width="1">
    <rect x="570" y="364" width="20" height="36" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="630" y="376" width="20" height="24" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="690" y="368" width="20" height="32" fill="#6a994e" fill-opacity="0.5"/>
    <rect x="750" y="358" width="20" height="42" fill="#6a994e" fill-opacity="0.5"/>
  </g>

  <!-- warning marker on the offending sample -->
  <path d="M520,300 L531,318 L509,318 Z" fill="#bc4749"/>
  <text x="520" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">!</text>
  <text x="520" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#bc4749">out of spec → investigate</text>

  <!-- ===================== CAPTION ===================== -->
  <text x="262" y="424" text-anchor="start" font-size="13" font-weight="bold" fill="#1b2a3a">T<tspan font-size="9" dy="-4">2</tspan><tspan dy="4"> = far WITHIN the model  ·  Q/SPE = far FROM the model</tspan></text>
</svg>
