<svg xmlns="http://www.w3.org/2000/svg" width="842.4" height="371.3" viewBox="14.9 9.8 842.4 371.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- top bracket: all samples split once -->
  <path d="M40,58 L40,52 L820,52 L820,58" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="430" y="44" text-anchor="middle" font-size="14" fill="#1b2a3a">all available samples (n) — split ONCE, up front</text>

  <!-- the three way split bar 60 / 20 / 20 -->
  <rect x="40"  y="64" width="468" height="60" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="508" y="64" width="156" height="60" fill="#e8a33d" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="664" y="64" width="156" height="60" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- segment names and sizes -->
  <text x="274" y="92" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">TRAIN</text>
  <text x="274" y="112" text-anchor="middle" font-size="12" fill="#ffffff">~60%</text>

  <text x="586" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">VALIDATE</text>
  <text x="586" y="112" text-anchor="middle" font-size="12" fill="#1b2a3a">~20%</text>

  <text x="748" y="92" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">TEST</text>
  <text x="748" y="112" text-anchor="middle" font-size="12" fill="#ffffff">~20%  locked</text>

  <!-- padlock icon on TEST segment -->
  <g stroke="#ffffff" stroke-width="1.8" fill="none">
    <path d="M690,80 v-4 a6,6 0 0 1 12,0 v4"/>
  </g>
  <rect x="686" y="80" width="20" height="15" rx="2" fill="#ffffff" stroke="#bc4749" stroke-width="1"/>
  <circle cx="696" cy="86" r="2" fill="#bc4749"/>
  <line x1="696" y1="87" x2="696" y2="91" stroke="#bc4749" stroke-width="1.5"/>

  <!-- job of each segment -->
  <text x="274" y="152" text-anchor="middle" font-size="15" fill="#1b2a3a">fit the model</text>

  <text x="586" y="148" text-anchor="middle" font-size="13" fill="#1b2a3a">tune:</text>
  <text x="586" y="167" text-anchor="middle" font-size="13" fill="#1b2a3a">preprocessing, #components,</text>
  <text x="586" y="186" text-anchor="middle" font-size="13" fill="#1b2a3a">variable selection</text>

  <text x="748" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">touch ONCE,</text>
  <text x="748" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">report RMSEP</text>

  <!-- error tag: RMSEC points at TRAIN -->
  <line x1="200" y1="126" x2="175" y2="238" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="66" y="240" width="222" height="34" rx="6" fill="#eef4e9" stroke="#6a994e" stroke-width="1.8"/>
  <text x="177" y="262" text-anchor="middle" font-size="13.5" fill="#1b2a3a">RMSEC (train) — optimistic</text>

  <!-- error tag: RMSEP points at TEST -->
  <line x1="810" y1="126" x2="792" y2="238" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="560" y="240" width="272" height="34" rx="6" fill="#f7eaea" stroke="#bc4749" stroke-width="2"/>
  <text x="696" y="262" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#bc4749">RMSEP (test) — the number you trust</text>

  <!-- caution strip -->
  <rect x="40" y="298" width="780" height="58" rx="8" fill="#fdf3e0" stroke="#e8a33d" stroke-width="2"/>
  <path d="M76,338 L88,314 L100,338 Z" fill="none" stroke="#bc4749" stroke-width="2"/>
  <text x="88" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">!</text>
  <text x="120" y="322" font-size="13.5" fill="#1b2a3a">Everything fit on data — scaling, #components, selection — must be decided</text>
  <text x="120" y="342" font-size="13.5" fill="#1b2a3a">WITHOUT the test set, or RMSEP is contaminated.</text>
</svg>
