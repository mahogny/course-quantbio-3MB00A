    <circle cx="777" cy="176" r="4.5" fill="#e08e2f"/>
    <circle cx="761" cy="174" r="4.5" fill="#2a6f97"/>
    <circle cx="774" cy="161" r="4.5" fill="#e08e2f"/>
    <!-- F6 -->
    <circle cx="830" cy="182" r="4.5" fill="#e08e2f"/>
    <circle cx="838" cy="189" r="4.5" fill="#2a6f97"/>
    <circle cx="821" cy="188" r="4.5" fill="#e08e2f"/>
  </g>
  <!-- dashed rings hinting at spurious tiny clusters -->
  <g fill="none" stroke="#bc4749" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7">
    <circle cx="661" cy="91" r="17"/>
    <circle cx="742" cy="79" r="17"/>
    <circle cx="819" cy="109" r="17"/>
    <circle cx="684" cy="159" r="17"/>
    <circle cx="769" cy="169" r="17"/>
    <circle cx="830" cy="186" r="15"/>
  </g>
  <text x="734" y="212" text-anchor="middle" font-size="12" fill="#1b2a3a">over-split into noise</text>

  <!-- ===== resolution arrow under the panels ===== -->
  <line x1="40" y1="258" x2="840" y2="258" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="279" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">increasing clustering resolution</text>

  <!-- ===== bottom caption ===== -->
  <line x1="40" y1="303" x2="840" y2="303" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="440" y="330" text-anchor="middle" font-size="13.5" fill="#1b2a3a">An unnameable cluster is a signal to re-cluster / adjust resolution / check QC —</text>
  <text x="440" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6a994e">annotation and clustering are one loop.</text>
</svg>
