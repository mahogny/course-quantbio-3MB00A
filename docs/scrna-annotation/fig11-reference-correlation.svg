<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.6 26.9 879.3 415.0" font-family="Helvetica, Arial, sans-serif" width="879.3" height="415.0">
  <defs>
    <marker id="aDark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6f97"/>
    </marker>
    <marker id="aRed" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bc4749"/>
    </marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6a994e"/>
    </marker>
    <marker id="aOrange" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e07a2f"/>
    </marker>
  </defs>

  <!-- expression-space axes -->
  <line x1="150" y1="340" x2="470" y2="340" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="170" y1="352" x2="170" y2="52" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="452" y="356" font-size="11.5" fill="#9aa8b5" font-style="italic">gene-expression space</text>

  <!-- leader lines to right-hand labels -->
  <g stroke="#c9d3dd" stroke-width="1.2">
    <line x1="256" y1="105" x2="446" y2="105"/>
    <line x1="310" y1="133" x2="446" y2="133"/>
    <line x1="350" y1="166" x2="446" y2="166"/>
    <line x1="377" y1="200" x2="446" y2="200"/>
    <line x1="419" y1="323" x2="446" y2="323"/>
  </g>

  <!-- reference centroid arrows -->
  <line x1="170" y1="340" x2="256" y2="105" stroke="#e07a2f" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="170" y1="340" x2="310" y2="133" stroke="#bc4749" stroke-width="2.5" marker-end="url(#aRed)"/>
  <line x1="170" y1="340" x2="377" y2="200" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <line x1="170" y1="340" x2="419" y2="323" stroke="#6a994e" stroke-width="2.5" marker-end="url(#aGreen)"/>

  <!-- query cell: bold central arrow -->
  <line x1="170" y1="340" x2="350" y2="166" stroke="#1b2a3a" stroke-width="3.6" marker-end="url(#aDark)"/>

  <!-- origin dot -->
  <circle cx="170" cy="340" r="4" fill="#1b2a3a"/>

  <!-- smallest-angle arc between query and T-cell -->
  <path d="M248.8,286.9 A95,95 0 0 1 238.3,274.0" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="235" y="303" font-size="14" fill="#1b2a3a" font-style="italic">θ</text>

  <!-- note on the smallest angle -->
  <path d="M150,262 L232,281" fill="none" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="20" y="250" font-size="12.5" fill="#1b2a3a" font-style="italic">smallest angle</text>
  <text x="20" y="266" font-size="12.5" fill="#1b2a3a" font-style="italic">= highest correlation</text>

  <!-- right-hand labels with correlation values -->
  <text x="450" y="109" font-size="14.5" fill="#e07a2f">NK reference   ·   r = 0.28</text>
  <text x="450" y="137" font-size="14.5" fill="#bc4749">B-cell reference   ·   r = 0.31</text>
  <text x="450" y="162" font-size="14.5" font-weight="bold" fill="#1b2a3a">query cell (your data):</text>
  <text x="450" y="180" font-size="14.5" font-weight="bold" fill="#1b2a3a">expression vector</text>
  <text x="450" y="205" font-size="14.5" font-weight="bold" fill="#2a6f97">T-cell reference   ·   r = 0.82</text>
  <text x="726" y="205" font-size="13" fill="#6a994e">◄ best</text>
  <text x="450" y="327" font-size="14.5" fill="#6a994e">Macrophage reference   ·   r = 0.20</text>

  <!-- result box -->
  <rect x="450" y="234" width="398" height="60" rx="10" fill="#eaf1f7" stroke="#6a994e" stroke-width="2.2"/>
  <text x="649" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">assign label = T cell</text>
  <text x="649" y="282" text-anchor="middle" font-size="13.5" fill="#1b2a3a">highest correlation wins</text>

  <!-- footer -->
  <text x="450" y="398" text-anchor="middle" font-size="12" fill="#1b2a3a">correlation = cosine of centred, normalised vectors;   e.g. SingleR, Azimuth, CellTypist.</text>
  <text x="450" y="414" text-anchor="middle" font-size="12" fill="#bc4749" font-style="italic">Caveat: a cell type absent from the reference cannot be labelled correctly.</text>
</svg>
