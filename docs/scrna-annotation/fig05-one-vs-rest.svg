<svg xmlns="http://www.w3.org/2000/svg" width="866" height="386" viewBox="0 0 866 386" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRedR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowRedL" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL: split cells ===================== -->
  <text x="24" y="34" font-size="16" font-weight="bold" fill="#1b2a3a">Split all cells into two groups</text>

  <!-- Group 1 label (highlighted cluster) -->
  <text x="24" y="60" font-size="14" font-weight="bold" fill="#2a6f97">Group 1 = cluster k</text>
  <line x1="70" y1="66" x2="93" y2="96" stroke="#2a6f97" stroke-width="1.5"/>

  <!-- highlighted cloud (cluster k) -->
  <g fill="#2a6f97">
    <circle cx="78" cy="105" r="5.5"/><circle cx="95" cy="100" r="5.5"/><circle cx="110" cy="108" r="5.5"/>
    <circle cx="85" cy="120" r="5.5"/><circle cx="102" cy="122" r="5.5"/><circle cx="118" cy="116" r="5.5"/>
    <circle cx="90" cy="112" r="5.5"/><circle cx="108" cy="98" r="5.5"/><circle cx="72" cy="116" r="5.5"/>
    <circle cx="100" cy="130" r="5.5"/>
  </g>

  <!-- greyed-out clouds (all other cells) -->
  <g fill="#8a97a5">
    <circle cx="205" cy="112" r="5"/><circle cx="222" cy="110" r="5"/><circle cx="232" cy="122" r="5"/><circle cx="208" cy="128" r="5"/><circle cx="224" cy="130" r="5"/><circle cx="215" cy="120" r="5"/>
    <circle cx="290" cy="157" r="5"/><circle cx="308" cy="155" r="5"/><circle cx="316" cy="168" r="5"/><circle cx="295" cy="172" r="5"/><circle cx="305" cy="170" r="5"/><circle cx="300" cy="162" r="5"/>
    <circle cx="150" cy="197" r="5"/><circle cx="168" cy="195" r="5"/><circle cx="175" cy="208" r="5"/><circle cx="152" cy="214" r="5"/><circle cx="165" cy="210" r="5"/><circle cx="158" cy="202" r="5"/>
    <circle cx="260" cy="227" r="5"/><circle cx="278" cy="229" r="5"/><circle cx="285" cy="240" r="5"/><circle cx="262" cy="245" r="5"/><circle cx="274" cy="238" r="5"/><circle cx="255" cy="235" r="5"/>
    <circle cx="100" cy="247" r="5"/><circle cx="118" cy="249" r="5"/><circle cx="125" cy="260" r="5"/><circle cx="102" cy="264" r="5"/><circle cx="114" cy="257" r="5"/><circle cx="95" cy="253" r="5"/>
  </g>

  <!-- curly brace under the grey clouds -->
  <path d="M 55,282 C 55,291 63,291 90,291 L 182,291 C 199,291 202,293 209,300 C 216,293 219,291 236,291 L 328,291 C 355,291 363,291 363,282"
        fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="209" y="322" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Group 2 = the rest</text>
  <text x="209" y="340" font-size="12" fill="#8a97a5" text-anchor="middle">(all other cells)</text>

  <!-- ===================== BOLD ARROW to right panel ===================== -->
  <line x1="378" y1="188" x2="436" y2="188" stroke="#2a6f97" stroke-width="4.5" marker-end="url(#arrowBlue)"/>
  <text x="407" y="176" font-size="12" fill="#2a6f97" text-anchor="middle" font-weight="bold">for each gene</text>

  <!-- ===================== RIGHT PANEL: one gene, two violins ===================== -->
  <text x="498" y="34" font-size="16" font-weight="bold" fill="#1b2a3a">One gene: compare the two groups</text>

  <!-- Group 1 violin (shifted to high expression) -->
  <path d="M 590,110 C 620,95 660,82 700,82 C 740,82 765,95 780,110 C 765,125 740,138 700,138 C 660,138 620,125 590,110 z"
        fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="792" y="106" font-size="13" font-weight="bold" fill="#2a6f97">Group 1</text>
  <text x="792" y="122" font-size="11" fill="#8a97a5">(cluster k)</text>

  <!-- Group 2 violin (concentrated near zero) -->
  <path d="M 505,200 C 515,180 530,170 545,170 C 562,170 585,184 610,197 C 615,199 618,200 622,200 C 618,200 615,201 610,203 C 585,216 562,230 545,230 C 530,230 515,220 505,200 z"
        fill="#e2e7ec" stroke="#8a97a5" stroke-width="1.8"/>
  <text x="632" y="196" font-size="13" font-weight="bold" fill="#5c6a78">Group 2</text>
  <text x="632" y="212" font-size="11" fill="#8a97a5">(the rest)</text>

  <!-- mean markers -->
  <line x1="545" y1="82" x2="545" y2="256" stroke="#8a97a5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="700" y1="82" x2="700" y2="256" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="545" y="70" font-size="12" fill="#8a97a5" text-anchor="middle">mean2</text>
  <text x="700" y="70" font-size="12" fill="#2a6f97" text-anchor="middle" font-weight="bold">mean1</text>

  <!-- the shift (effect) double arrow -->
  <line x1="545" y1="150" x2="700" y2="150" stroke="#bc4749" stroke-width="2" marker-start="url(#arrowRedL)" marker-end="url(#arrowRedR)"/>
  <text x="623" y="143" font-size="12" fill="#bc4749" text-anchor="middle" font-weight="bold">shift</text>

  <!-- shared expression axis -->
  <line x1="500" y1="256" x2="815" y2="256" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrowDark)"/>
  <line x1="512" y1="251" x2="512" y2="261" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="512" y="274" font-size="12" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="662" y="274" font-size="13" fill="#1b2a3a" text-anchor="middle">expression →</text>

  <!-- ===================== OUTPUTS ===================== -->
  <text x="498" y="304" font-size="14" font-weight="bold" fill="#bc4749">log<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> fold change = log</tspan><tspan font-size="10" dy="3">2</tspan><tspan dy="-3">(mean1 / mean2)</tspan></text>
  <text x="498" y="321" font-size="11" fill="#8a97a5">effect size: how big is the difference</text>
  <text x="498" y="346" font-size="14" font-weight="bold" fill="#1b2a3a">p-value: is the shift bigger than chance?</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="420" y="376" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">Repeat this split for every cluster.</text>
</svg>
