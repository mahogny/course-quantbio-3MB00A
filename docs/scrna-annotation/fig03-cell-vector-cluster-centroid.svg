<svg xmlns="http://www.w3.org/2000/svg" width="598.7" height="373.1" viewBox="30.0 3.3 598.7 373.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="dArrEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="dArrStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#bc4749"/>
    </marker>
    <g id="star">
      <polygon points="0,-13 3.06,-4.21 12.36,-4.02 4.94,1.61 7.64,10.51 0,5.2 -7.64,10.51 -4.94,1.61 -12.36,-4.02 -3.06,-4.21"
               stroke="#1b2a3a" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- axes -->
  <line x1="90" y1="330" x2="610" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="330" x2="90" y2="40" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="90" cy="330" r="3" fill="#1b2a3a"/>
  <text x="96" y="350" font-size="13" fill="#1b2a3a">origin</text>
  <text x="430" y="356" font-size="15" fill="#1b2a3a">gene A expression</text>
  <text x="58" y="185" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 58 185)">gene B expression</text>
  <text x="255" y="30" font-size="13" fill="#7a8794" font-style="italic">schematic: real space is G-dimensional</text>

  <!-- main cluster tint -->
  <ellipse cx="365" cy="133" rx="62" ry="52" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- main cluster points -->
  <g fill="#2a6f97">
    <circle cx="330" cy="110" r="5"/>
    <circle cx="350" cy="95" r="5"/>
    <circle cx="375" cy="105" r="5"/>
    <circle cx="395" cy="120" r="5"/>
    <circle cx="345" cy="130" r="5"/>
    <circle cx="365" cy="135" r="5"/>
    <circle cx="385" cy="140" r="5"/>
    <circle cx="340" cy="150" r="5"/>
    <circle cx="360" cy="160" r="5"/>
    <circle cx="380" cy="120" r="5"/>
    <circle cx="320" cy="135" r="5"/>
    <circle cx="355" cy="175" r="5"/>
    <circle cx="400" cy="150" r="5"/>
  </g>
  <!-- highlighted individual cell -->
  <circle cx="418" cy="128" r="6" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- second, fainter cluster -->
  <g opacity="0.5">
    <ellipse cx="477" cy="252" rx="38" ry="28" fill="#eef4ea" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="4 4"/>
    <g fill="#6a994e">
      <circle cx="455" cy="245" r="4.5"/>
      <circle cx="470" cy="238" r="4.5"/>
      <circle cx="492" cy="248" r="4.5"/>
      <circle cx="465" cy="263" r="4.5"/>
      <circle cx="488" cy="263" r="4.5"/>
      <circle cx="502" cy="252" r="4.5"/>
    </g>
    <use href="#star" x="477" y="252" fill="#6a994e"/>
  </g>

  <!-- centroid vector (dashed) from origin to main star -->
  <line x1="90" y1="330" x2="360" y2="140" stroke="#bc4749" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#dArrEnd)"/>

  <!-- individual cell vector (solid) from origin to highlighted dot -->
  <line x1="90" y1="330" x2="414" y2="130" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- main centroid star on top -->
  <use href="#star" x="365" y="133" fill="#bc4749"/>

  <!-- labels for vectors -->
  <text x="430" y="118" font-size="14" fill="#2a6f97">one cell = a vector x</text>
  <text x="398" y="88" font-size="14" fill="#bc4749" font-weight="bold">centroid</text>
  <text x="398" y="105" font-size="12.5" fill="#bc4749">= mean vector = typical profile</text>

  <!-- markers: horizontal double arrow between centroid gene-A coords -->
  <line x1="365" y1="133" x2="365" y2="306" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="477" y1="252" x2="477" y2="306" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="365" y1="306" x2="477" y2="306" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="6 4"
        marker-start="url(#dArrStart)" marker-end="url(#dArrEnd)"/>
  <text x="421" y="324" font-size="12.5" fill="#bc4749" text-anchor="middle">markers = coordinates</text>
  <text x="421" y="339" font-size="12.5" fill="#bc4749" text-anchor="middle">where centroids differ</text>
</svg>
