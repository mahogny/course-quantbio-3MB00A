<svg xmlns="http://www.w3.org/2000/svg" viewBox="34.3 -9.6 920.8 417.2" font-family="Helvetica, Arial, sans-serif" width="920.8" height="417.2">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bc4749"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- flow boxes -->
  <g>
    <rect x="150" y="18" width="330" height="58" rx="12" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="315" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">1 · Find markers</text>
    <text x="315" y="63" text-anchor="middle" font-size="13" fill="#1b2a3a">one-vs-rest DE for each cluster</text>
  </g>

  <g>
    <rect x="150" y="108" width="330" height="62" rx="12" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="315" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">2 · Compare top genes to signatures</text>
    <text x="315" y="153" text-anchor="middle" font-size="13" fill="#1b2a3a">CellMarker, PanglaoDB, in-house list</text>
  </g>

  <g>
    <rect x="150" y="202" width="330" height="52" rx="12" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="315" y="224" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">3 · Label with the best match</text>
    <text x="315" y="244" text-anchor="middle" font-size="13" fill="#1b2a3a">assign a cell-type name to the cluster</text>
  </g>

  <g>
    <rect x="150" y="286" width="330" height="52" rx="12" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
    <text x="315" y="308" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">4 · Sanity-check on the UMAP</text>
    <text x="315" y="328" text-anchor="middle" font-size="13" fill="#1b2a3a">does the label sit where it should?</text>
  </g>

  <!-- downward arrows -->
  <line x1="315" y1="76" x2="315" y2="106" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="170" x2="315" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="254" x2="315" y2="284" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feedback loop: box 4 back to box 1 on the left -->
  <path d="M150,312 C60,312 60,47 148,47" fill="none" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="70" y="185" text-anchor="middle" font-size="12.5" fill="#bc4749" transform="rotate(-90 70 185)">if unnameable → re-cluster / adjust resolution</text>

  <!-- human-in-the-loop banner -->
  <text x="315" y="378" text-anchor="middle" font-size="13.5" font-style="italic" fill="#bc4749">human-in-the-loop iterative cycle — not a one-shot pipeline</text>

  <!-- worked callout to the right of box 2 -->
  <line x1="480" y1="139" x2="522" y2="139" stroke="#6a994e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="524" y="96" width="404" height="96" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="540" y="120" font-size="13" fill="#1b2a3a">cluster 3 top genes:</text>
  <text x="540" y="140" font-size="13.5" font-weight="bold" fill="#2a6f97">CD3D · CD3E · IL7R · CD2 · CD3G</text>
  <text x="540" y="163" font-size="15" font-weight="bold" fill="#6a994e">→  T cell</text>
  <rect x="694" y="150" width="226" height="24" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="702" y="167" font-size="11.5" font-family="Courier New, monospace" fill="#1b2a3a">RenameIdents(obj, `3`="T cell")</text>
</svg>
