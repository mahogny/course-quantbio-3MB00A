<svg xmlns="http://www.w3.org/2000/svg" viewBox="54.7 10.4 706.2 402.2" font-family="Helvetica, Arial, sans-serif" width="706.2" height="402.2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <linearGradient id="expr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe9f3"/>
      <stop offset="1" stop-color="#16324a"/>
    </linearGradient>
  </defs>

  <!-- gene row labels -->
  <text x="150" y="97" text-anchor="end" font-size="16" font-weight="bold" fill="#1b2a3a">CD3D</text>
  <text x="150" y="114" text-anchor="end" font-size="12" fill="#6a994e">good marker</text>
  <text x="150" y="162" text-anchor="end" font-size="16" font-weight="bold" fill="#1b2a3a">ACTB</text>
  <text x="150" y="179" text-anchor="end" font-size="12" fill="#bc4749">housekeeping</text>

  <!-- grid guides -->
  <line x1="180" y1="100" x2="550" y2="100" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="180" y1="165" x2="550" y2="165" stroke="#c9d3dd" stroke-width="1"/>

  <!-- cluster axis labels -->
  <text x="200" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">0</text>
  <text x="255" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">1</text>
  <text x="310" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">2</text>
  <text x="365" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">3</text>
  <text x="420" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">4</text>
  <text x="475" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">5</text>
  <text x="530" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">6</text>
  <text x="365" y="234" text-anchor="middle" font-size="13" fill="#5a6b7a">cluster</text>

  <!-- CD3D row: tiny pale dots everywhere except cluster 3 -->
  <circle cx="200" cy="100" r="4" fill="#dbe9f3" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="255" cy="100" r="4" fill="#dbe9f3" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="310" cy="100" r="4" fill="#dbe9f3" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="420" cy="100" r="4" fill="#dbe9f3" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="475" cy="100" r="4" fill="#dbe9f3" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="530" cy="100" r="4" fill="#dbe9f3" stroke="#c9d3dd" stroke-width="1"/>
  <!-- CD3D cluster 3: big dark dot -->
  <circle cx="365" cy="100" r="21" fill="#16324a"/>

  <!-- ACTB row: medium mid-shade dots across ALL clusters -->
  <circle cx="200" cy="165" r="14" fill="#5a92ba"/>
  <circle cx="255" cy="165" r="14" fill="#5a92ba"/>
  <circle cx="310" cy="165" r="14" fill="#5a92ba"/>
  <circle cx="365" cy="165" r="15" fill="#5a92ba"/>
  <circle cx="420" cy="165" r="14" fill="#5a92ba"/>
  <circle cx="475" cy="165" r="14" fill="#5a92ba"/>
  <circle cx="530" cy="165" r="14" fill="#5a92ba"/>
  <text x="565" y="169" font-size="12" fill="#bc4749">on everywhere</text>
  <text x="565" y="184" font-size="12" fill="#bc4749">not a marker</text>

  <!-- sensitivity callout, points up to the big dot -->
  <text x="200" y="290" font-size="13" font-weight="bold" fill="#6a994e">sensitivity</text>
  <text x="200" y="307" font-size="12" fill="#1b2a3a">dot big in the target cluster</text>
  <text x="200" y="323" font-size="12" fill="#1b2a3a">(pct.1 high) · 98% expressing, high</text>
  <text x="200" y="339" font-size="12" fill="#1b2a3a">specific AND sensitive</text>
  <path d="M285,286 C315,250 325,175 365,121" fill="none" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- specificity callout, points down to a tiny pale dot -->
  <text x="430" y="40" font-size="13" font-weight="bold" fill="#2a6f97">specificity</text>
  <text x="430" y="57" font-size="12" fill="#1b2a3a">dots small elsewhere (pct.2 low)</text>
  <path d="M470,62 C476,78 478,89 476,96" fill="none" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- size legend -->
  <text x="625" y="252" font-size="12" font-weight="bold" fill="#1b2a3a">Fraction expressing</text>
  <circle cx="645" cy="278" r="4" fill="#7a8a99"/>
  <text x="675" y="282" font-size="12" fill="#1b2a3a">10%</text>
  <circle cx="645" cy="312" r="15" fill="#7a8a99"/>
  <text x="675" y="316" font-size="12" fill="#1b2a3a">98%</text>

  <!-- colour legend -->
  <text x="625" y="352" font-size="12" font-weight="bold" fill="#1b2a3a">Mean expression</text>
  <rect x="625" y="362" width="110" height="12" fill="url(#expr)" stroke="#c9d3dd" stroke-width="1"/>
  <text x="625" y="390" font-size="11" fill="#5a6b7a">low</text>
  <text x="735" y="390" text-anchor="end" font-size="11" fill="#5a6b7a">high</text>
</svg>
