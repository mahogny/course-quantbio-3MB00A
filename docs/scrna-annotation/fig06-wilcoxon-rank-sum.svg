<svg xmlns="http://www.w3.org/2000/svg" width="667" height="353" viewBox="30 25 667 353" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- TOP STRIP: zero inflated skewed histogram -->
  <line x1="45" y1="118" x2="220" y2="118" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="45"  y="40"  width="16" height="78" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="63"  y="84"  width="16" height="34" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="81"  y="98"  width="16" height="20" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="99"  y="105" width="16" height="13" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="117" y="109" width="16" height="9"  fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="135" y="112" width="16" height="6"  fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="153" y="114" width="16" height="4"  fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="171" y="115" width="16" height="3"  fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <rect x="189" y="116" width="16" height="2"  fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="53" y="134" font-size="12" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="200" y="134" font-size="12" fill="#1b2a3a" text-anchor="middle">counts →</text>

  <text x="240" y="66" font-size="15" fill="#1b2a3a" font-weight="bold">counts are sparse &amp; skewed</text>
  <text x="240" y="88" font-size="15" fill="#1b2a3a">not Gaussian  →  use ranks</text>

  <!-- LEGEND -->
  <circle cx="250" cy="150" r="7" fill="#2a6f97"/>
  <text x="264" y="155" font-size="14" fill="#1b2a3a">Group 1 (cluster k)</text>
  <circle cx="440" cy="150" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <text x="454" y="155" font-size="14" fill="#1b2a3a">Group 2 (rest)</text>

  <!-- ANNOTATION over blue cluster -->
  <text x="510" y="196" font-size="14" fill="#1b2a3a" text-anchor="middle">group-1 cells sit systematically higher in the ranking</text>
  <text x="510" y="214" font-size="14" fill="#6a994e" text-anchor="middle" font-weight="bold">→ gene is up in cluster k</text>
  <!-- bracket linking the annotation to the high-rank region of the axis -->
  <path d="M395,263 L395,255 L650,255 L650,263" fill="none" stroke="#2a6f97" stroke-width="1.8"/>
  <line x1="522" y1="255" x2="522" y2="224" stroke="#2a6f97" stroke-width="1.8"/>

  <!-- MAIN AXIS: rank -->
  <line x1="55" y1="272" x2="680" y2="272" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- grey dots (Group 2) crowd LEFT, blue dots (Group 1) crowd RIGHT -->
  <circle cx="75"  cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="108" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="141" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="174" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="207" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="240" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="273" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="306" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="339" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="372" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="405" cy="272" r="7" fill="#aeb9c4" stroke="#7d8a97" stroke-width="1.5"/>
  <circle cx="438" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="471" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="504" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="537" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="570" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="603" cy="272" r="7" fill="#2a6f97"/>
  <circle cx="636" cy="272" r="7" fill="#2a6f97"/>

  <!-- rank numbers under a few dots -->
  <text x="75"  y="294" font-size="12" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="108" y="294" font-size="12" fill="#1b2a3a" text-anchor="middle">2</text>
  <text x="141" y="294" font-size="12" fill="#1b2a3a" text-anchor="middle">3</text>
  <text x="405" y="294" font-size="12" fill="#1b2a3a" text-anchor="middle">···</text>
  <text x="636" y="294" font-size="12" fill="#1b2a3a" text-anchor="middle">N</text>

  <!-- axis title -->
  <text x="367" y="326" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">rank  (low expression → high expression)</text>

  <!-- side note -->
  <text x="55" y="360" font-size="13" fill="#bc4749" font-style="italic">non-parametric: uses order, not raw values.</text>
</svg>
