<svg xmlns="http://www.w3.org/2000/svg" width="675.4" height="372.0" viewBox="52.9 40.4 675.4 372.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahGrey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a3"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- feature axes -->
  <line x1="90" y1="340" x2="500" y2="340" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="90" y1="340" x2="90" y2="60" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="500" y="358" font-size="14" fill="#1b2a3a" text-anchor="end">feature 1</text>
  <text x="82" y="66" font-size="14" fill="#1b2a3a" text-anchor="end" transform="rotate(-90 82 66)">feature 2</text>

  <!-- scatter: orange = high Y (case), teal = low Y (control) -->
  <g stroke="#ffffff" stroke-width="0.8">
    <circle cx="283.6" cy="227.3" r="5" fill="#2a9d8f"/>
    <circle cx="277.1" cy="206.7" r="5" fill="#2a9d8f"/>
    <circle cx="217.6" cy="237.3" r="5" fill="#2a9d8f"/>
    <circle cx="400.4" cy="170.4" r="5" fill="#e28430"/>
    <circle cx="392.0" cy="169.2" r="5" fill="#e28430"/>
    <circle cx="336.0" cy="193.5" r="5" fill="#e28430"/>
    <circle cx="166.0" cy="292.0" r="5" fill="#2a9d8f"/>
    <circle cx="349.1" cy="196.4" r="5" fill="#e28430"/>
    <circle cx="135.2" cy="231.8" r="5" fill="#2a9d8f"/>
    <circle cx="218.3" cy="229.7" r="5" fill="#2a9d8f"/>
    <circle cx="325.8" cy="191.7" r="5" fill="#e28430"/>
    <circle cx="337.8" cy="168.9" r="5" fill="#e28430"/>
    <circle cx="330.9" cy="201.9" r="5" fill="#e28430"/>
    <circle cx="261.9" cy="272.0" r="5" fill="#2a9d8f"/>
    <circle cx="361.1" cy="210.9" r="5" fill="#e28430"/>
    <circle cx="238.5" cy="212.5" r="5" fill="#2a9d8f"/>
    <circle cx="269.2" cy="216.3" r="5" fill="#2a9d8f"/>
    <circle cx="357.2" cy="185.5" r="5" fill="#e28430"/>
    <circle cx="251.0" cy="200.4" r="5" fill="#2a9d8f"/>
    <circle cx="268.6" cy="254.7" r="5" fill="#2a9d8f"/>
    <circle cx="233.1" cy="243.2" r="5" fill="#2a9d8f"/>
    <circle cx="320.4" cy="152.8" r="5" fill="#e28430"/>
    <circle cx="318.5" cy="233.8" r="5" fill="#2a9d8f"/>
    <circle cx="123.0" cy="278.3" r="5" fill="#2a9d8f"/>
    <circle cx="281.9" cy="190.0" r="5" fill="#e28430"/>
    <circle cx="342.1" cy="183.6" r="5" fill="#e28430"/>
    <circle cx="183.0" cy="283.3" r="5" fill="#2a9d8f"/>
    <circle cx="368.0" cy="200.4" r="5" fill="#e28430"/>
    <circle cx="428.0" cy="155.7" r="5" fill="#e28430"/>
    <circle cx="296.0" cy="169.6" r="5" fill="#e28430"/>
  </g>

  <!-- centroid -->
  <circle cx="300" cy="205" r="3.5" fill="#1b2a3a"/>

  <!-- PCA axis: grey dashed, along elongated cloud (max variance) -->
  <line x1="300" y1="205" x2="435.9" y2="141.6" stroke="#8a97a3" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ahGrey)"/>

  <!-- PLS axis: bold red, along orange-vs-teal gradient (max covariance) -->
  <line x1="300" y1="205" x2="348.7" y2="84.5" stroke="#bc4749" stroke-width="3.2" marker-end="url(#ahRed)"/>

  <!-- angle between the two axes -->
  <path d="M354.4,179.6 A60 60 0 0 0 322.5,149.4" fill="none" stroke="#1b2a3a" stroke-width="1.3"/>
  <text x="352" y="158" font-size="14" fill="#1b2a3a">θ</text>

  <!-- axis labels -->
  <text x="440" y="132" font-size="14" fill="#6a7784" font-weight="bold">PCA axis: max var(Xw)</text>
  <text x="356" y="80" font-size="14" fill="#bc4749" font-weight="bold">PLS axis: max cov(Xw, Y)</text>

  <!-- legend -->
  <circle cx="120" cy="82" r="5" fill="#e28430"/>
  <text x="132" y="87" font-size="13" fill="#1b2a3a">high Y  (case)</text>
  <circle cx="120" cy="104" r="5" fill="#2a9d8f"/>
  <text x="132" y="109" font-size="13" fill="#1b2a3a">low Y  (control)</text>

  <!-- side note box -->
  <rect x="470" y="182" width="238" height="96" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="482" y="207" font-size="13.5" fill="#1b2a3a" font-weight="bold">cov(Xw, Y) =</text>
  <text x="482" y="229" font-size="13.5" fill="#1b2a3a">std(Xw) · cor(Xw, Y) · std(Y)</text>
  <text x="482" y="253" font-size="13" fill="#2a6f97">→ must both vary AND</text>
  <text x="482" y="270" font-size="13" fill="#2a6f97">    track Y</text>

  <!-- caption -->
  <text x="360" y="390" font-size="14.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">PLS tilts the axis away from loudest toward Y-relevant.</text>
</svg>
