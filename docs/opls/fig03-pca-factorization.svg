<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 8 811 347" width="811" height="347" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ===================== FACTORISATION ROW  X = T Pt ===================== -->

  <!-- X : samples x features, centred (wide and tall) -->
  <rect x="70" y="55" width="150" height="130" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="100" y1="55" x2="100" y2="185"/>
    <line x1="130" y1="55" x2="130" y2="185"/>
    <line x1="160" y1="55" x2="160" y2="185"/>
    <line x1="190" y1="55" x2="190" y2="185"/>
    <line x1="70" y1="88" x2="220" y2="88"/>
    <line x1="70" y1="120" x2="220" y2="120"/>
    <line x1="70" y1="153" x2="220" y2="153"/>
  </g>
  <text x="145" y="128" font-size="30" font-weight="bold" fill="#1b2a3a" text-anchor="middle">X</text>
  <!-- feature bracket (columns) -->
  <path d="M70,48 L70,40 L220,40 L220,48" fill="none" stroke="#bc4749" stroke-width="1.6"/>
  <text x="145" y="30" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">features</text>
  <!-- samples bracket (rows) -->
  <text x="52" y="120" font-size="13" fill="#6a994e" text-anchor="middle" transform="rotate(-90 52 120)">samples</text>
  <text x="145" y="204" font-size="12.5" fill="#1b2a3a" text-anchor="middle">centred data matrix</text>

  <!-- approximately-equal sign -->
  <text x="252" y="130" font-size="30" fill="#1b2a3a" text-anchor="middle">&#8776;</text>

  <!-- T : scores, tall and narrow (few columns = few latent axes) -->
  <rect x="292" y="55" width="52" height="130" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="309" y1="55" x2="309" y2="185"/>
    <line x1="326" y1="55" x2="326" y2="185"/>
    <line x1="292" y1="88" x2="344" y2="88"/>
    <line x1="292" y1="120" x2="344" y2="120"/>
    <line x1="292" y1="153" x2="344" y2="153"/>
  </g>
  <text x="318" y="128" font-size="26" font-weight="bold" fill="#2a6f97" text-anchor="middle">T</text>
  <text x="318" y="204" font-size="12.5" fill="#2a6f97" text-anchor="middle" font-weight="bold">scores</text>
  <text x="318" y="219" font-size="11.5" fill="#2a6f97" text-anchor="middle">sample coords</text>
  <!-- one row per SAMPLE annotation (label above T, arrow into a row) -->
  <text x="316" y="36" font-size="11.5" fill="#6a994e" text-anchor="middle">one row per</text>
  <text x="316" y="49" font-size="11.5" fill="#6a994e" text-anchor="middle" font-weight="bold">SAMPLE</text>
  <line x1="300" y1="53" x2="293" y2="64" stroke="#6a994e" stroke-width="1.4" marker-end="url(#arrowgreen)"/>

  <!-- multiplication dot -->
  <text x="366" y="128" font-size="26" fill="#1b2a3a" text-anchor="middle">&#183;</text>

  <!-- Pt : loadings, short and wide (few rows = few latent axes) -->
  <rect x="386" y="98" width="160" height="52" fill="#eaf1f7" stroke="#bc4749" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="386" y1="115" x2="546" y2="115"/>
    <line x1="386" y1="132" x2="546" y2="132"/>
    <line x1="418" y1="98" x2="418" y2="150"/>
    <line x1="450" y1="98" x2="450" y2="150"/>
    <line x1="482" y1="98" x2="482" y2="150"/>
    <line x1="514" y1="98" x2="514" y2="150"/>
  </g>
  <text x="466" y="133" font-size="26" font-weight="bold" fill="#bc4749" text-anchor="middle">P<tspan font-size="15" dy="-9">T</tspan></text>
  <text x="466" y="169" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">loadings</text>
  <text x="466" y="184" font-size="11.5" fill="#bc4749" text-anchor="middle">feature contributions</text>
  <!-- one column per FEATURE annotation (label above Pt, arrow into a column) -->
  <text x="530" y="62" font-size="11.5" fill="#bc4749" text-anchor="middle">one column</text>
  <text x="530" y="75" font-size="11.5" fill="#bc4749" text-anchor="middle" font-weight="bold">per FEATURE</text>
  <line x1="530" y1="81" x2="530" y2="98" stroke="#bc4749" stroke-width="1.4" marker-end="url(#arrowred)"/>

  <!-- low-rank callout linking the narrow dimensions of T and Pt (routed below the captions) -->
  <path d="M344,186 C400,248 500,248 546,150" fill="none" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="392" y="272" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="bold">only a few latent axes</text>
  <text x="392" y="288" font-size="12" fill="#1b2a3a" text-anchor="middle">(low rank: k &lt;&lt; features)</text>

  <!-- ===================== SCATTER : PC directions ===================== -->
  <text x="720" y="45" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">geometry of the scores</text>

  <!-- grey point cloud (deliberately all one colour: PCA never sees Y) -->
  <g fill="#7d8a97">
    <circle cx="618" cy="230" r="6"/>
    <circle cx="640" cy="215" r="6"/>
    <circle cx="655" cy="228" r="6"/>
    <circle cx="668" cy="205" r="6"/>
    <circle cx="682" cy="212" r="6"/>
    <circle cx="690" cy="196" r="6"/>
    <circle cx="700" cy="188" r="6"/>
    <circle cx="712" cy="200" r="6"/>
    <circle cx="720" cy="178" r="6"/>
    <circle cx="732" cy="185" r="6"/>
    <circle cx="742" cy="168" r="6"/>
    <circle cx="755" cy="176" r="6"/>
    <circle cx="766" cy="158" r="6"/>
    <circle cx="780" cy="165" r="6"/>
    <circle cx="792" cy="150" r="6"/>
  </g>

  <!-- PC1 : long axis, bold arrow through the cloud -->
  <line x1="600" y1="238" x2="812" y2="140" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#arrowblue)"/>
  <text x="700" y="128" font-size="13" fill="#2a6f97" text-anchor="middle" font-weight="bold">PC1 = direction of maximum variance</text>

  <!-- PC2 : shorter perpendicular arrow -->
  <line x1="704" y1="192" x2="742" y2="252" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="762" y="252" font-size="13" fill="#1b2a3a" text-anchor="start" font-weight="bold">PC2</text>

  <!-- ===================== CAPTION STRIP ===================== -->
  <rect x="70" y="308" width="760" height="34" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="450" y="330" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Unsupervised &#8212; no Y anywhere in the picture.</text>
</svg>
