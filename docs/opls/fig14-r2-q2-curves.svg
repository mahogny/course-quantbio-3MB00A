<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- faint vertical gridlines at each component -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="120" y1="60" x2="120" y2="300"/>
    <line x1="196" y1="60" x2="196" y2="300"/>
    <line x1="272" y1="60" x2="272" y2="300"/>
    <line x1="348" y1="60" x2="348" y2="300"/>
    <line x1="424" y1="60" x2="424" y2="300"/>
    <line x1="500" y1="60" x2="500" y2="300"/>
  </g>

  <!-- widening R2Y to Q2 gap shaded at high component counts -->
  <polygon points="348,82 424,74 500,70 500,290 424,240 348,190" fill="#bc4749" fill-opacity="0.12"/>

  <!-- axes -->
  <line x1="108" y1="60" x2="108" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="108" y1="300" x2="510" y2="300" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- y tick labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="100" y="64">1.0</text>
    <text x="100" y="164">0.5</text>
    <text x="100" y="264">0</text>
    <text x="100" y="304">-0.2</text>
  </g>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="104" y1="60" x2="108" y2="60"/>
    <line x1="104" y1="160" x2="108" y2="160"/>
    <line x1="104" y1="260" x2="108" y2="260"/>
    <line x1="104" y1="300" x2="108" y2="300"/>
  </g>

  <!-- dashed zero reference line -->
  <line x1="108" y1="260" x2="505" y2="260" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- x tick labels: number of components added -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="120" y="316">1</text>
    <text x="196" y="316">2</text>
    <text x="272" y="316">3</text>
    <text x="348" y="316">4</text>
    <text x="424" y="316">5</text>
    <text x="500" y="316">6</text>
  </g>

  <!-- axis titles -->
  <text x="309" y="336" text-anchor="middle" font-size="14" fill="#1b2a3a">number of components added</text>
  <text x="34" y="180" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 34 180)">variance explained / predicted</text>

  <!-- Curve A: R2Y in-sample fit, monotone rising -->
  <polyline points="120,170 196,124 272,96 348,82 424,74 500,70" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  <g fill="#2a6f97">
    <circle cx="120" cy="170" r="3.2"/>
    <circle cx="196" cy="124" r="3.2"/>
    <circle cx="272" cy="96" r="3.2"/>
    <circle cx="348" cy="82" r="3.2"/>
    <circle cx="424" cy="74" r="3.2"/>
    <circle cx="500" cy="70" r="3.2"/>
  </g>
  <text x="498" y="58" text-anchor="end" font-size="14" font-weight="bold" fill="#2a6f97">R2Y (in-sample fit)</text>

  <!-- Curve B: Q2 cross-validated, rises to peak then turns down -->
  <polyline points="120,180 196,140 272,156 348,190 424,240 500,290" fill="none" stroke="#6a994e" stroke-width="2.5"/>
  <g fill="#6a994e">
    <circle cx="120" cy="180" r="3.2"/>
    <circle cx="272" cy="156" r="3.2"/>
    <circle cx="348" cy="190" r="3.2"/>
    <circle cx="424" cy="240" r="3.2"/>
    <circle cx="500" cy="290" r="3.2"/>
  </g>
  <text x="126" y="216" font-size="14" font-weight="bold" fill="#6a994e">Q2 (cross-validated prediction)</text>
  <text x="126" y="234" font-size="13" font-style="italic" fill="#6a994e">the honest number</text>

  <!-- peak of Q2 marked, stop here -->
  <circle cx="196" cy="140" r="6" fill="#ffffff" stroke="#6a994e" stroke-width="2.5"/>
  <text x="150" y="106" font-size="13" font-weight="bold" fill="#6a994e" text-anchor="middle">stop here</text>
  <line x1="163" y1="112" x2="190" y2="134" stroke="#6a994e" stroke-width="1.5" marker-end="url(#arrowred)"/>

  <!-- R2Y annotation upper left -->
  <text x="133" y="26" font-size="13.5" fill="#1b2a3a">always looks good; never decreases →</text>
  <text x="133" y="43" font-size="13.5" fill="#1b2a3a">can't tell you when to stop</text>
  <line x1="378" y1="48" x2="352" y2="80" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- vertical gap bracket at right edge -->
  <path d="M508,70 h6 V290 h-6" fill="none" stroke="#bc4749" stroke-width="1.5"/>
  <text x="522" y="150" font-size="13.5" font-weight="bold" fill="#bc4749">overfitting:</text>
  <text x="522" y="168" font-size="13.5" fill="#bc4749">high R2Y but</text>
  <text x="522" y="186" font-size="13.5" fill="#bc4749">low / negative Q2</text>

  <!-- mini two-box legend -->
  <g>
    <rect x="522" y="212" width="220" height="34" rx="3" fill="#eef6ea" stroke="#6a994e" stroke-width="1.5"/>
    <rect x="530" y="220" width="16" height="16" rx="2" fill="#6a994e"/>
    <text x="554" y="227" font-size="12.5" fill="#1b2a3a">Healthy: Q2 close to R2Y,</text>
    <text x="554" y="242" font-size="12.5" fill="#1b2a3a">both &gt; 0</text>

    <rect x="522" y="254" width="220" height="34" rx="3" fill="#f7ecec" stroke="#bc4749" stroke-width="1.5"/>
    <rect x="530" y="262" width="16" height="16" rx="2" fill="#bc4749"/>
    <text x="554" y="269" font-size="12.5" fill="#1b2a3a">Warning: big R2 − Q2 gap</text>
    <text x="554" y="284" font-size="12.5" fill="#1b2a3a">(memorising, not learning)</text>
  </g>

  <!-- caption -->
  <text x="309" y="405" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">R2 rises forever; Q2 tells you when you have stopped learning and started memorising.</text>
</svg>
