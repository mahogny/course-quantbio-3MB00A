<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <circle cx="590" cy="20" r="6" fill="#e07a2f" stroke="#ffffff" stroke-width="1"/>
    <text x="601" y="24">case</text>
    <circle cx="662" cy="20" r="6" fill="#2a9d8f" stroke="#ffffff" stroke-width="1"/>
    <text x="673" y="24">control</text>
  </g>

  <!-- ================= LEFT PANEL ================= -->
  <text x="225" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">PCA: PC1 dominated by batch</text>

  <!-- faint batch clusters (the loudest axis is the nuisance) -->
  <ellipse cx="150" cy="178" rx="66" ry="92" fill="#eaf1f7" opacity="0.7" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <ellipse cx="300" cy="178" rx="66" ry="92" fill="#eaf1f7" opacity="0.7" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="150" y="98" text-anchor="middle" font-size="11.5" fill="#6b7a8a" font-style="italic">day 1 batch</text>
  <text x="300" y="98" text-anchor="middle" font-size="11.5" fill="#6b7a8a" font-style="italic">day 2 batch</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="392" y2="300" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="60" y1="300" x2="60" y2="54" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="380" y="317" text-anchor="end" font-size="14" fill="#1b2a3a">PC1</text>
  <text x="70" y="66" font-size="14" fill="#1b2a3a">PC2</text>

  <!-- batch 1 : cases (orange) -->
  <g fill="#e07a2f" stroke="#ffffff" stroke-width="1">
    <circle cx="120" cy="140" r="5"/><circle cx="150" cy="120" r="5"/><circle cx="135" cy="180" r="5"/><circle cx="165" cy="155" r="5"/><circle cx="115" cy="210" r="5"/>
    <circle cx="180" cy="195" r="5"/><circle cx="145" cy="230" r="5"/><circle cx="170" cy="112" r="5"/><circle cx="125" cy="170" r="5"/><circle cx="155" cy="205" r="5"/>
  </g>
  <!-- batch 1 : controls (teal) -->
  <g fill="#2a9d8f" stroke="#ffffff" stroke-width="1">
    <circle cx="130" cy="130" r="5"/><circle cx="160" cy="175" r="5"/><circle cx="140" cy="215" r="5"/><circle cx="175" cy="140" r="5"/><circle cx="110" cy="165" r="5"/>
    <circle cx="185" cy="122" r="5"/><circle cx="150" cy="150" r="5"/><circle cx="120" cy="195" r="5"/><circle cx="165" cy="225" r="5"/><circle cx="140" cy="108" r="5"/>
  </g>
  <!-- batch 2 : cases (orange) -->
  <g fill="#e07a2f" stroke="#ffffff" stroke-width="1">
    <circle cx="270" cy="150" r="5"/><circle cx="300" cy="125" r="5"/><circle cx="285" cy="190" r="5"/><circle cx="320" cy="160" r="5"/><circle cx="260" cy="215" r="5"/>
    <circle cx="335" cy="200" r="5"/><circle cx="295" cy="230" r="5"/><circle cx="315" cy="116" r="5"/><circle cx="275" cy="175" r="5"/><circle cx="305" cy="210" r="5"/>
  </g>
  <!-- batch 2 : controls (teal) -->
  <g fill="#2a9d8f" stroke="#ffffff" stroke-width="1">
    <circle cx="280" cy="135" r="5"/><circle cx="310" cy="180" r="5"/><circle cx="290" cy="220" r="5"/><circle cx="325" cy="145" r="5"/><circle cx="265" cy="160" r="5"/>
    <circle cx="340" cy="126" r="5"/><circle cx="300" cy="155" r="5"/><circle cx="270" cy="200" r="5"/><circle cx="315" cy="228" r="5"/><circle cx="290" cy="110" r="5"/>
  </g>

  <text x="225" y="341" text-anchor="middle" font-size="13" fill="#bc4749">Colour by disease → no clean separation.</text>

  <!-- ================= SUPERVISION ARROW ================= -->
  <line x1="404" y1="180" x2="474" y2="180" stroke="#2a6f97" stroke-width="4.5" marker-end="url(#arrowBold)"/>
  <text x="439" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">supervision</text>

  <!-- ================= RIGHT PANEL ================= -->
  <text x="645" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">A supervised axis</text>

  <!-- axes -->
  <line x1="490" y1="300" x2="820" y2="300" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="490" y1="300" x2="490" y2="54" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="808" y="317" text-anchor="end" font-size="14" fill="#1b2a3a">predictive direction</text>
  <text x="500" y="66" font-size="14" fill="#1b2a3a">other</text>

  <!-- separating gap guide -->
  <line x1="645" y1="90" x2="645" y2="290" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- controls (teal) grouped LEFT -->
  <g fill="#2a9d8f" stroke="#ffffff" stroke-width="1">
    <circle cx="520" cy="150" r="5"/><circle cx="540" cy="120" r="5"/><circle cx="530" cy="190" r="5"/><circle cx="560" cy="160" r="5"/><circle cx="515" cy="215" r="5"/>
    <circle cx="575" cy="200" r="5"/><circle cx="545" cy="230" r="5"/><circle cx="565" cy="116" r="5"/><circle cx="525" cy="175" r="5"/><circle cx="555" cy="210" r="5"/>
    <circle cx="535" cy="135" r="5"/><circle cx="560" cy="175" r="5"/><circle cx="540" cy="222" r="5"/><circle cx="578" cy="145" r="5"/><circle cx="512" cy="160" r="5"/>
    <circle cx="585" cy="126" r="5"/><circle cx="550" cy="150" r="5"/><circle cx="520" cy="197" r="5"/><circle cx="565" cy="228" r="5"/><circle cx="540" cy="108" r="5"/>
  </g>
  <!-- cases (orange) grouped RIGHT -->
  <g fill="#e07a2f" stroke="#ffffff" stroke-width="1">
    <circle cx="680" cy="150" r="5"/><circle cx="700" cy="120" r="5"/><circle cx="690" cy="190" r="5"/><circle cx="720" cy="160" r="5"/><circle cx="675" cy="215" r="5"/>
    <circle cx="735" cy="200" r="5"/><circle cx="705" cy="230" r="5"/><circle cx="725" cy="116" r="5"/><circle cx="685" cy="175" r="5"/><circle cx="715" cy="210" r="5"/>
    <circle cx="695" cy="135" r="5"/><circle cx="720" cy="175" r="5"/><circle cx="700" cy="222" r="5"/><circle cx="738" cy="145" r="5"/><circle cx="672" cy="160" r="5"/>
    <circle cx="748" cy="126" r="5"/><circle cx="710" cy="150" r="5"/><circle cx="680" cy="197" r="5"/><circle cx="725" cy="228" r="5"/><circle cx="700" cy="108" r="5"/>
  </g>

  <text x="645" y="341" text-anchor="middle" font-size="13" fill="#6a994e">Same data, axis chosen to track the outcome.</text>

  <!-- ================= PULL QUOTE STRIP ================= -->
  <rect x="40" y="356" width="800" height="36" rx="7" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="440" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">PCA finds the loudest variation, not the relevant variation.</text>
</svg>
