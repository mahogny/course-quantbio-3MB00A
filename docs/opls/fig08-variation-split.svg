<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b3"/>
    </marker>
  </defs>

  <!-- TOP: systematic variation box -->
  <rect x="230" y="14" width="260" height="46" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="360" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Systematic variation in X</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#1b2a3a">(everything structured, before splitting)</text>

  <!-- fan out arrows -->
  <path d="M300,60 L175,96" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M420,60 L545,96" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- faint residual arrow straight down -->
  <path d="M360,60 L360,330" fill="none" stroke="#9aa7b3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGrey)"/>

  <!-- LEFT stream: predictive -->
  <rect x="55" y="100" width="240" height="52" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="175" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">PREDICTIVE</text>
  <text x="175" y="140" text-anchor="middle" font-size="12.5" fill="#1b2a3a">(correlated with Y)</text>

  <!-- bold arrow toward Y target -->
  <path d="M175,152 L175,214" fill="none" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <circle cx="175" cy="232" r="16" fill="#bc4749" stroke="#1b2a3a" stroke-width="2"/>
  <text x="175" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Y</text>
  <text x="175" y="270" text-anchor="middle" font-size="12" fill="#1b2a3a">for a single Y</text>
  <text x="175" y="286" text-anchor="middle" font-size="12" fill="#1b2a3a" font-weight="bold">→ exactly ONE predictive component</text>

  <!-- RIGHT stream: orthogonal -->
  <rect x="400" y="100" width="290" height="52" rx="6" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <text x="545" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a994e">ORTHOGONAL</text>
  <text x="545" y="140" text-anchor="middle" font-size="12.5" fill="#1b2a3a">(uncorrelated with Y)</text>

  <!-- orthogonal arrow points 90deg away from direction-to-Y -->
  <!-- direction to Y (down-left) implied; draw horizontal arrow to the right, perpendicular -->
  <path d="M545,152 L545,180" fill="none" stroke="#6a994e" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M545,180 L648,180" fill="none" stroke="#6a994e" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <!-- faint guide toward Y and right-angle symbol -->
  <path d="M545,180 L545,214" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M545,168 L557,168 L557,180" fill="none" stroke="#6a994e" stroke-width="1.8"/>
  <text x="522" y="205" text-anchor="middle" font-size="10.5" fill="#9aa7b3">(toward Y)</text>

  <text x="545" y="238" text-anchor="middle" font-size="12" fill="#1b2a3a" font-weight="bold">structured nuisance:</text>
  <text x="545" y="255" text-anchor="middle" font-size="12" fill="#1b2a3a">batch, age/sex/BMI, physiology</text>
  <text x="545" y="271" text-anchor="middle" font-size="12" fill="#1b2a3a" font-weight="bold">→ one or MORE orthogonal components</text>

  <!-- Residual noise box -->
  <rect x="300" y="330" width="120" height="34" rx="6" fill="#eef1f4" stroke="#9aa7b3" stroke-width="1.5"/>
  <text x="360" y="352" text-anchor="middle" font-size="13" fill="#7a8794">Residual noise E</text>

  <!-- Mini inset: geometric orthogonality -->
  <g>
    <rect x="18" y="300" width="150" height="82" rx="6" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <circle cx="55" cy="352" r="3.5" fill="#1b2a3a"/>
    <!-- predictive axis (horizontal, toward Y, blue) -->
    <path d="M55,352 L145,352" fill="none" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <!-- orthogonal axis (vertical, green) -->
    <path d="M55,352 L55,312" fill="none" stroke="#6a994e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <!-- right angle -->
    <path d="M55,342 L65,342 L65,352" fill="none" stroke="#1b2a3a" stroke-width="1.3"/>
    <text x="92" y="371" text-anchor="middle" font-size="9.5" fill="#2a6f97">predictive (toward Y)</text>
    <text x="72" y="322" text-anchor="start" font-size="9.5" fill="#6a994e">orthogonal</text>
    <text x="72" y="333" text-anchor="start" font-size="9.5" fill="#6a994e">(perp. to Y)</text>
  </g>

  <!-- Caption -->
  <text x="360" y="392" text-anchor="middle" font-size="12.5" fill="#1b2a3a" font-style="italic">Same information as PLS, rearranged: Y-signal in one axis, nuisance set aside.</text>
</svg>
