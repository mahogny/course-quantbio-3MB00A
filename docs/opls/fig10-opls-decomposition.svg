<svg xmlns="http://www.w3.org/2000/svg" viewBox="12.4 13.8 786.1 379.6" width="786.1" height="379.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- faint guide tying the two t_p together, drawn first so it sits behind labels -->
  <line x1="229" y1="192" x2="229" y2="286" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===================== TOP: X = ... equation row ===================== -->

  <!-- (1) X : wide-ish tall data matrix -->
  <rect x="50" y="70" width="120" height="120" fill="#eef4f9" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="98" y1="70" x2="98" y2="190"/>
    <line x1="122" y1="70" x2="122" y2="190"/>
    <line x1="146" y1="70" x2="146" y2="190"/>
    <line x1="50" y1="94" x2="170" y2="94"/>
    <line x1="50" y1="118" x2="170" y2="118"/>
    <line x1="50" y1="142" x2="170" y2="142"/>
    <line x1="50" y1="166" x2="170" y2="166"/>
  </g>
  <text x="60" y="130" font-size="12" fill="#6b7885">features →</text>
  <text x="44" y="130" font-size="12" fill="#6b7885" text-anchor="middle" transform="rotate(-90 44 130)">samples ↓</text>
  <text x="110" y="204" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">X</text>
  <text x="110" y="222" font-size="12" fill="#6b7885" text-anchor="middle">samples × features</text>

  <!-- "=" -->
  <text x="196" y="140" font-size="28" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- (3) PREDICTIVE rank-1 outer product : t_p (column) × p_p^T (row) -->
  <!-- t_p : a single tall thin column, one cell per sample -->
  <rect x="220" y="70" width="18" height="120" fill="#dbe9f3" stroke="#2a6f97" stroke-width="2"/>
  <g stroke="#9fc3dd" stroke-width="1">
    <line x1="220" y1="90" x2="238" y2="90"/>
    <line x1="220" y1="110" x2="238" y2="110"/>
    <line x1="220" y1="130" x2="238" y2="130"/>
    <line x1="220" y1="150" x2="238" y2="150"/>
    <line x1="220" y1="170" x2="238" y2="170"/>
  </g>
  <!-- multiplication -->
  <text x="248" y="139" font-size="16" fill="#2a6f97" text-anchor="middle">×</text>
  <!-- p_p^T : a single short thin row -->
  <rect x="258" y="121" width="110" height="18" fill="#dbe9f3" stroke="#2a6f97" stroke-width="2"/>
  <g stroke="#9fc3dd" stroke-width="1">
    <line x1="276" y1="121" x2="276" y2="139"/>
    <line x1="294" y1="121" x2="294" y2="139"/>
    <line x1="312" y1="121" x2="312" y2="139"/>
    <line x1="330" y1="121" x2="330" y2="139"/>
    <line x1="348" y1="121" x2="348" y2="139"/>
  </g>
  <!-- factor labels -->
  <text x="229" y="204" font-size="13" font-weight="bold" fill="#2a6f97" text-anchor="middle">t_p (n×1)</text>
  <text x="313" y="204" font-size="13" font-weight="bold" fill="#2a6f97" text-anchor="middle">p_p^T (1×f)</text>
  <!-- underbrace + group label -->
  <path d="M220,213 L220,221 L368,221 L368,213" fill="none" stroke="#2a6f97" stroke-width="1.6"/>
  <text x="294" y="237" font-size="13" font-weight="bold" fill="#2a6f97" text-anchor="middle">PREDICTIVE (rank 1)</text>

  <!-- red callout: emphasise t_p is a SINGLE column -->
  <text x="252" y="46" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="middle">t_p : one column, one value per sample</text>
  <line x1="240" y1="52" x2="230" y2="68" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- "+" -->
  <text x="394" y="140" font-size="28" fill="#1b2a3a" text-anchor="middle">+</text>

  <!-- (5) ORTHOGONAL : T_o (few columns) × P_o^T (few rows) -->
  <rect x="420" y="70" width="52" height="120" fill="#dfe6ee" stroke="#8a97a5" stroke-width="2"/>
  <g stroke="#b5c0cc" stroke-width="1">
    <line x1="437.3" y1="70" x2="437.3" y2="190"/>
    <line x1="454.7" y1="70" x2="454.7" y2="190"/>
    <line x1="420" y1="94" x2="472" y2="94"/>
    <line x1="420" y1="118" x2="472" y2="118"/>
    <line x1="420" y1="142" x2="472" y2="142"/>
    <line x1="420" y1="166" x2="472" y2="166"/>
  </g>
  <text x="481" y="139" font-size="16" fill="#6b7885" text-anchor="middle">×</text>
  <rect x="492" y="104" width="110" height="52" fill="#dfe6ee" stroke="#8a97a5" stroke-width="2"/>
  <g stroke="#b5c0cc" stroke-width="1">
    <line x1="492" y1="121.3" x2="602" y2="121.3"/>
    <line x1="492" y1="138.7" x2="602" y2="138.7"/>
    <line x1="519.5" y1="104" x2="519.5" y2="156"/>
    <line x1="547" y1="104" x2="547" y2="156"/>
    <line x1="574.5" y1="104" x2="574.5" y2="156"/>
  </g>
  <text x="446" y="204" font-size="13" font-weight="bold" fill="#6b7885" text-anchor="middle">T_o (n×r)</text>
  <text x="547" y="204" font-size="13" font-weight="bold" fill="#6b7885" text-anchor="middle">P_o^T (r×f)</text>
  <path d="M420,213 L420,221 L602,221 L602,213" fill="none" stroke="#8a97a5" stroke-width="1.6"/>
  <text x="511" y="237" font-size="13" font-weight="bold" fill="#6b7885" text-anchor="middle">ORTHOGONAL (several components)</text>

  <!-- "+" -->
  <text x="628" y="140" font-size="28" fill="#1b2a3a" text-anchor="middle">+</text>

  <!-- (7) E : faint full-size residual -->
  <rect x="655" y="70" width="120" height="120" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1.6"/>
  <g stroke="#e3eaf1" stroke-width="1">
    <line x1="691" y1="70" x2="691" y2="190"/>
    <line x1="715" y1="70" x2="715" y2="190"/>
    <line x1="739" y1="70" x2="739" y2="190"/>
    <line x1="655" y1="106" x2="775" y2="106"/>
    <line x1="655" y1="142" x2="775" y2="142"/>
    <line x1="655" y1="166" x2="775" y2="166"/>
  </g>
  <g fill="#c9d3dd">
    <circle cx="678" cy="88" r="1.6"/><circle cx="724" cy="99" r="1.6"/><circle cx="702" cy="123" r="1.6"/>
    <circle cx="750" cy="134" r="1.6"/><circle cx="686" cy="156" r="1.6"/><circle cx="732" cy="176" r="1.6"/>
    <circle cx="762" cy="80" r="1.6"/><circle cx="708" cy="182" r="1.6"/>
  </g>
  <text x="715" y="204" font-size="16" font-weight="bold" fill="#9aa7b3" text-anchor="middle">E</text>
  <text x="715" y="222" font-size="12" fill="#9aa7b3" text-anchor="middle">residual (faint)</text>

  <!-- ===================== BOTTOM: prediction equation ===================== -->
  <text x="150" y="310" font-size="18" fill="#1b2a3a">Ŷ  =</text>
  <rect x="208" y="291" width="42" height="26" rx="4" fill="#dbe9f3" stroke="#2a6f97" stroke-width="2"/>
  <text x="229" y="310" font-size="17" font-weight="bold" fill="#2a6f97" text-anchor="middle">t_p</text>
  <text x="258" y="310" font-size="18" fill="#1b2a3a">· c  +  intercept</text>

  <!-- arrow + note: prediction uses predictive score only -->
  <line x1="470" y1="285" x2="246" y2="289" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="474" y="300" font-size="13.5" font-weight="bold" fill="#bc4749">prediction uses the predictive score t_p ONLY</text>
  <text x="474" y="318" font-size="12" fill="#bc4749">(T_o and E never enter Ŷ)</text>

  <!-- ===================== CAPTION ===================== -->
  <text x="450" y="368" font-size="14" fill="#1b2a3a" text-anchor="middle">One number per sample, t_p, carries the disease signal; everything Y-irrelevant lives in T_o or E.</text>
</svg>
