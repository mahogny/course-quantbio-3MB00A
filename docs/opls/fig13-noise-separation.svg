<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowsh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- top banner: p much greater than n -->
  <rect x="16" y="8" width="688" height="30" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="360" y="28" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="middle">p &gt;&gt; n :  thousands of features, dozens of samples</text>

  <!-- faint in sample watermark -->
  <text x="270" y="240" font-size="40" fill="#c9d3dd" opacity="0.55" font-weight="bold" text-anchor="middle" transform="rotate(-20 270 240)">training data only</text>

  <!-- score plot axes through origin (297,205) -->
  <line x1="80" y1="205" x2="500" y2="205" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="297" y1="322" x2="297" y2="62" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="290" y="342" font-size="14" fill="#1b2a3a" font-weight="bold" text-anchor="middle">predictive score  t_p</text>
  <text x="305" y="72" font-size="14" fill="#1b2a3a" font-weight="bold">orthogonal score  t_o</text>

  <!-- dashed separation boundary -->
  <line x1="297" y1="98" x2="297" y2="322" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"/>

  <!-- teal (class A) points, all on the LEFT of t_p -->
  <g fill="#2a6f97">
    <circle cx="150" cy="140" r="6"/>
    <circle cx="180" cy="120" r="6"/>
    <circle cx="135" cy="182" r="6"/>
    <circle cx="200" cy="165" r="6"/>
    <circle cx="165" cy="212" r="6"/>
    <circle cx="140" cy="252" r="6"/>
    <circle cx="196" cy="240" r="6"/>
    <circle cx="222" cy="200" r="6"/>
    <circle cx="160" cy="292" r="6"/>
    <circle cx="212" cy="286" r="6"/>
    <circle cx="185" cy="176" r="6"/>
    <circle cx="238" cy="150" r="6"/>
  </g>

  <!-- orange (class B) points, all on the RIGHT of t_p -->
  <g fill="#e08a2e">
    <circle cx="360" cy="136" r="6"/>
    <circle cx="392" cy="116" r="6"/>
    <circle cx="345" cy="176" r="6"/>
    <circle cx="412" cy="160" r="6"/>
    <circle cx="376" cy="216" r="6"/>
    <circle cx="350" cy="256" r="6"/>
    <circle cx="406" cy="246" r="6"/>
    <circle cx="432" cy="196" r="6"/>
    <circle cx="366" cy="292" r="6"/>
    <circle cx="418" cy="286" r="6"/>
    <circle cx="386" cy="172" r="6"/>
    <circle cx="444" cy="146" r="6"/>
  </g>

  <!-- RIGHT COLUMN: shuffle warning + legend + inset -->

  <!-- dice icon signalling randomness -->
  <rect x="512" y="46" width="30" height="30" rx="6" fill="#ffffff" stroke="#bc4749" stroke-width="2"/>
  <circle cx="527" cy="61" r="2.6" fill="#bc4749"/>
  <circle cx="519" cy="53" r="2.6" fill="#bc4749"/>
  <circle cx="535" cy="53" r="2.6" fill="#bc4749"/>
  <circle cx="519" cy="69" r="2.6" fill="#bc4749"/>
  <circle cx="535" cy="69" r="2.6" fill="#bc4749"/>
  <!-- shuffle arrows -->
  <path d="M556,50 q22,0 30,20" fill="none" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrowsh)"/>
  <path d="M586,52 q-22,0 -30,20" fill="none" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrowsh)"/>

  <text x="512" y="98" font-size="14" fill="#bc4749" font-weight="bold">RANDOMLY SHUFFLED</text>
  <text x="512" y="116" font-size="14" fill="#bc4749" font-weight="bold">labels</text>
  <text x="512" y="134" font-size="14" fill="#bc4749">(no real difference)</text>

  <!-- legend swatches -->
  <circle cx="522" cy="158" r="6" fill="#2a6f97"/>
  <text x="536" y="163" font-size="13" fill="#1b2a3a">class A (shuffled)</text>
  <circle cx="522" cy="180" r="6" fill="#e08a2e"/>
  <text x="536" y="185" font-size="13" fill="#1b2a3a">class B (shuffled)</text>

  <!-- inset caption box -->
  <rect x="506" y="200" width="204" height="132" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="518" y="224" font-size="12.5" fill="#1b2a3a">With more features than</text>
  <text x="518" y="243" font-size="12.5" fill="#1b2a3a">samples, some combination</text>
  <text x="518" y="262" font-size="12.5" fill="#1b2a3a">lines up with ANY</text>
  <text x="518" y="281" font-size="12.5" fill="#1b2a3a">labelling — even random —</text>
  <text x="518" y="300" font-size="12.5" fill="#1b2a3a">by chance.</text>

  <!-- bottom cautionary caption -->
  <rect x="16" y="358" width="688" height="52" rx="8" fill="#f7e9e9" stroke="#bc4749" stroke-width="1.8"/>
  <text x="360" y="380" font-size="15" fill="#bc4749" font-weight="bold" text-anchor="middle">Separation from noise alone.</text>
  <text x="360" y="400" font-size="15" fill="#bc4749" font-weight="bold" text-anchor="middle">A clean split is NOT, by itself, evidence of a real effect.</text>
</svg>
