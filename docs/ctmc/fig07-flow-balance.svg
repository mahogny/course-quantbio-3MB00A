<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 10 560 290" width="560" height="290" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- ON: 1/3 of cells -->
  <circle cx="190" cy="150" r="62" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="190" y="146" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">ON</text>
  <text x="190" y="174" text-anchor="middle" font-size="18" fill="#1b2a3a">π<tspan baseline-shift="sub" font-size="70%">ON</tspan></text>
  <!-- OFF -->
  <circle cx="530" cy="150" r="62" fill="#f8eaea" stroke="#bc4749" stroke-width="2.5"/>
  <text x="530" y="146" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">OFF</text>
  <text x="530" y="174" text-anchor="middle" font-size="18" fill="#1b2a3a">π<tspan baseline-shift="sub" font-size="70%">OFF</tspan></text>
  <!-- flow ON -> OFF -->
  <path d="M 242 118 C 320 75, 400 75, 478 118" fill="none" stroke="#2a6f97" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="360" y="60" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a6f97">flow ON→OFF = π<tspan baseline-shift="sub" font-size="70%">ON</tspan> · a</text>
  <!-- flow OFF -> ON -->
  <path d="M 478 182 C 400 225, 320 225, 242 182" fill="none" stroke="#bc4749" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="360" y="250" text-anchor="middle" font-size="20" font-weight="bold" fill="#bc4749">flow OFF→ON = π<tspan baseline-shift="sub" font-size="70%">OFF</tspan> · b</text>
  <text x="360" y="285" text-anchor="middle" font-size="18" fill="#1b2a3a">balance: the two flows are equal</text>
</svg>
