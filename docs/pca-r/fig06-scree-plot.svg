<svg xmlns="http://www.w3.org/2000/svg" width="644.5" height="374.4" viewBox="5.0 24.4 644.5 374.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- gridlines at 0.25 0.5 0.75 1.0 -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="120" y1="255" x2="560" y2="255"/>
    <line x1="120" y1="190" x2="560" y2="190"/>
    <line x1="120" y1="125" x2="560" y2="125"/>
    <line x1="120" y1="60"  x2="560" y2="60"/>
  </g>

  <!-- axes -->
  <line x1="120" y1="60" x2="120" y2="320" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="120" y1="320" x2="560" y2="320" stroke="#1b2a3a" stroke-width="2"/>

  <!-- y tick labels -->
  <g fill="#1b2a3a" font-size="14" text-anchor="end">
    <text x="110" y="325">0%</text>
    <text x="110" y="260">25%</text>
    <text x="110" y="195">50%</text>
    <text x="110" y="130">75%</text>
    <text x="110" y="65">100%</text>
  </g>

  <!-- y axis title -->
  <text x="34" y="190" fill="#1b2a3a" font-size="15" text-anchor="middle" transform="rotate(-90 34 190)">Proportion of variance explained</text>

  <!-- bars: PC1 saturated, PC2 medium, PC3 faint -->
  <rect x="170" y="146.6" width="60" height="173.4" fill="#2a6f97"/>
  <rect x="310" y="233.4" width="60" height="86.6" fill="#2a6f97" opacity="0.55"/>
  <rect x="450" y="317" width="60" height="3" fill="#2a6f97" opacity="0.18" stroke="#c9d3dd" stroke-width="1"/>

  <!-- bar value labels -->
  <g font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold">
    <text x="200" y="138">66.7%</text>
    <text x="340" y="225">33.3%</text>
    <text x="480" y="308">0%</text>
  </g>

  <!-- x axis labels -->
  <g font-size="15" text-anchor="middle" fill="#1b2a3a">
    <text x="200" y="342">PC1</text>
    <text x="340" y="342">PC2</text>
    <text x="480" y="342">PC3</text>
  </g>

  <!-- cumulative line with dots -->
  <polyline points="200,146.6 340,60 480,60" fill="none" stroke="#bc4749" stroke-width="2"/>
  <g fill="#bc4749">
    <circle cx="200" cy="146.6" r="4.5"/>
    <circle cx="340" cy="60" r="4.5"/>
    <circle cx="480" cy="60" r="4.5"/>
  </g>
  <text x="352" y="53" fill="#bc4749" font-size="14" font-weight="bold">100%</text>
  <text x="500" y="76" fill="#bc4749" font-size="13">cumulative</text>

  <!-- elbow annotation arrow pointing to steep drop between PC1 and PC2 -->
  <path d="M420,150 C330,150 300,175 273,195" fill="none" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="428" y="148" fill="#1b2a3a" font-size="13.5">elbow → keep PC1 (and PC2)</text>

  <!-- 2D note -->
  <text x="480" y="378" fill="#6a994e" font-size="12.5" text-anchor="middle">PC3 = 0: geneA/geneB perfectly correlated (data is 2D)</text>
</svg>
