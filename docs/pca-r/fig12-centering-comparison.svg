<svg xmlns="http://www.w3.org/2000/svg" width="827.6" height="446.5" viewBox="16.2 -3.6 827.6 446.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="axDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- panel titles -->
  <text x="196" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Uncentered</text>
  <text x="196" y="52" text-anchor="middle" font-size="12.5" fill="#1b2a3a" opacity="0.75">cloud sits far up in the top-right quadrant</text>
  <text x="626" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Centered (subtract each gene mean)</text>
  <text x="626" y="52" text-anchor="middle" font-size="12.5" fill="#1b2a3a" opacity="0.75">same cloud, centroid moved onto the origin</text>

  <!-- panel divider -->
  <line x1="425" y1="70" x2="425" y2="360" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ============ LEFT PANEL: axes ============ -->
  <line x1="40" y1="323" x2="362" y2="323" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#axDark)"/>
  <line x1="76" y1="362" x2="76" y2="88" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#axDark)"/>
  <text x="356" y="342" text-anchor="end" font-size="12.5" fill="#1b2a3a">gene A</text>
  <text x="84" y="96" font-size="12.5" fill="#1b2a3a">gene B</text>

  <!-- LEFT origin crosshair + bold dot -->
  <circle cx="76" cy="323" r="4.5" fill="#1b2a3a"/>
  <text x="66" y="345" text-anchor="end" font-size="12" fill="#1b2a3a">0,0</text>

  <!-- LEFT point cloud (elongated, tilted, offset from origin) -->
  <g fill="#1b2a3a" opacity="0.72">
    <circle cx="236.2" cy="224.4" r="3.3"/>
    <circle cx="250.2" cy="224.2" r="3.3"/>
    <circle cx="236.9" cy="213.7" r="3.3"/>
    <circle cx="250.9" cy="213.4" r="3.3"/>
    <circle cx="239.6" cy="204.2" r="3.3"/>
    <circle cx="260.7" cy="210.8" r="3.3"/>
    <circle cx="252.7" cy="200.7" r="3.3"/>
    <circle cx="245.6" cy="193.8" r="3.3"/>
    <circle cx="264.6" cy="199.2" r="3.3"/>
    <circle cx="255.4" cy="191.2" r="3.3"/>
    <circle cx="272.4" cy="195.4" r="3.3"/>
    <circle cx="257.0" cy="183.7" r="3.3"/>
    <circle cx="267.7" cy="184.4" r="3.3"/>
    <circle cx="257.4" cy="175.7" r="3.3"/>
    <circle cx="275.3" cy="183.2" r="3.3"/>
    <circle cx="266.7" cy="174.1" r="3.3"/>
    <circle cx="282.0" cy="178.8" r="3.3"/>
    <circle cx="265.5" cy="166.5" r="3.3"/>
    <circle cx="279.4" cy="168.9" r="3.3"/>
    <circle cx="266.0" cy="158.5" r="3.3"/>
    <circle cx="287.1" cy="165.1" r="3.3"/>
    <circle cx="277.9" cy="157.0" r="3.3"/>
    <circle cx="288.6" cy="157.7" r="3.3"/>
    <circle cx="274.2" cy="146.6" r="3.3"/>
    <circle cx="289.1" cy="149.6" r="3.3"/>
    <circle cx="281.0" cy="142.2" r="3.3"/>
    <circle cx="298.9" cy="147.0" r="3.3"/>
    <circle cx="287.8" cy="135.0" r="3.3"/>
    <circle cx="298.4" cy="138.4" r="3.3"/>
    <circle cx="288.3" cy="127.0" r="3.3"/>
  </g>

  <!-- LEFT centroid marker -->
  <circle cx="268" cy="179" r="5.5" fill="none" stroke="#bc4749" stroke-width="2"/>
  <line x1="263" y1="177" x2="212" y2="150" stroke="#1b2a3a" stroke-width="1"/>
  <text x="208" y="146" text-anchor="end" font-size="12" fill="#1b2a3a">centroid</text>
  <text x="208" y="160" text-anchor="end" font-size="12" fill="#1b2a3a">(gene means)</text>

  <!-- LEFT PC1: from origin TO the centroid (chases the offset) -->
  <line x1="76" y1="323" x2="262.5" y2="182.5" stroke="#bc4749" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="139" y="248" font-size="15" font-weight="bold" fill="#bc4749" transform="rotate(-37 139 248)">PC1</text>

  <!-- ============ RIGHT PANEL: axes ============ -->
  <line x1="470" y1="227" x2="792" y2="227" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#axDark)"/>
  <line x1="626" y1="362" x2="626" y2="88" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#axDark)"/>
  <text x="786" y="246" text-anchor="end" font-size="12.5" fill="#1b2a3a">gene A</text>
  <text x="634" y="96" font-size="12.5" fill="#1b2a3a">gene B</text>

  <!-- RIGHT point cloud (same shape, translated onto origin) -->
  <g fill="#1b2a3a" opacity="0.72">
    <circle cx="594.2" cy="272.4" r="3.3"/>
    <circle cx="608.2" cy="272.2" r="3.3"/>
    <circle cx="594.9" cy="261.7" r="3.3"/>
    <circle cx="608.9" cy="261.4" r="3.3"/>
    <circle cx="597.6" cy="252.2" r="3.3"/>
    <circle cx="618.7" cy="258.8" r="3.3"/>
    <circle cx="610.7" cy="248.7" r="3.3"/>
    <circle cx="603.6" cy="241.8" r="3.3"/>
    <circle cx="622.6" cy="247.2" r="3.3"/>
    <circle cx="613.4" cy="239.2" r="3.3"/>
    <circle cx="630.4" cy="243.4" r="3.3"/>
    <circle cx="615.0" cy="231.7" r="3.3"/>
    <circle cx="625.7" cy="232.4" r="3.3"/>
    <circle cx="615.4" cy="223.7" r="3.3"/>
    <circle cx="633.3" cy="231.2" r="3.3"/>
    <circle cx="624.7" cy="222.1" r="3.3"/>
    <circle cx="640.0" cy="226.8" r="3.3"/>
    <circle cx="623.5" cy="214.5" r="3.3"/>
    <circle cx="637.4" cy="216.9" r="3.3"/>
    <circle cx="624.0" cy="206.5" r="3.3"/>
    <circle cx="645.1" cy="213.1" r="3.3"/>
    <circle cx="635.9" cy="205.0" r="3.3"/>
    <circle cx="646.6" cy="205.7" r="3.3"/>
    <circle cx="632.2" cy="194.6" r="3.3"/>
    <circle cx="647.1" cy="197.6" r="3.3"/>
    <circle cx="639.0" cy="190.2" r="3.3"/>
    <circle cx="656.9" cy="195.0" r="3.3"/>
    <circle cx="645.8" cy="183.0" r="3.3"/>
    <circle cx="656.4" cy="186.4" r="3.3"/>
    <circle cx="646.3" cy="175.0" r="3.3"/>
  </g>

  <!-- RIGHT PC1: aligned with the cloud's genuine long axis, through origin -->
  <line x1="594.8" y1="281" x2="657.2" y2="173" stroke="#6a994e" stroke-width="3" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="662" y="170" font-size="15" font-weight="bold" fill="#6a994e">PC1</text>

  <!-- RIGHT PC2: shorter, perpendicular, through origin -->
  <line x1="650.9" y1="241.4" x2="601.1" y2="212.6" stroke="#2a6f97" stroke-width="2.4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="572" y="206" font-size="13.5" font-weight="bold" fill="#2a6f97">PC2</text>

  <!-- RIGHT origin crosshair + bold dot -->
  <circle cx="626" cy="227" r="4.5" fill="#1b2a3a"/>
  <line x1="671" y1="301" x2="628" y2="231" stroke="#1b2a3a" stroke-width="1"/>
  <text x="675" y="300" font-size="12" fill="#1b2a3a">centroid = origin (0,0)</text>

  <!-- ============ annotations ============ -->
  <text x="196" y="380" text-anchor="middle" font-size="13" fill="#bc4749">PC1 chases the offset from origin —</text>
  <text x="196" y="396" text-anchor="middle" font-size="13" fill="#bc4749">it tells you nothing about shape</text>

  <text x="626" y="380" text-anchor="middle" font-size="13" fill="#6a994e">PC1 now follows the true</text>
  <text x="626" y="396" text-anchor="middle" font-size="13" fill="#6a994e">direction of variation</text>

  <!-- formula subtitle -->
  <text x="300" y="416" text-anchor="start" font-size="14.5" font-weight="bold" fill="#1b2a3a">centered value = x<tspan font-size="10.5" dy="3.5">ij</tspan><tspan dy="-3.5"> − (mean of gene j)</tspan></text>
</svg>
