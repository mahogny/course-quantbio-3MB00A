<svg xmlns="http://www.w3.org/2000/svg" width="648.7" height="365.4" viewBox="9.8 24.2 648.7 365.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- plot frame bounds: x 90..630, y 70..330, origin at 360,200 -->
  <!-- zero crosshairs -->
  <line x1="90" y1="200" x2="640" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="360" y1="70" x2="360" y2="330" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- faint vertical dashed separator near PC1 = 0 -->
  <line x1="360" y1="70" x2="360" y2="330" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.55"/>

  <!-- axes -->
  <line x1="90" y1="330" x2="640" y2="330" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="330" stroke="#1b2a3a" stroke-width="2"/>

  <!-- axis titles carry percent variance -->
  <text x="365" y="368" fill="#1b2a3a" font-size="16" text-anchor="middle" font-weight="bold">PC1 (67% of variance)</text>
  <text x="40" y="200" fill="#1b2a3a" font-size="16" text-anchor="middle" font-weight="bold" transform="rotate(-90 40 200)">PC2 (33% of variance)</text>

  <!-- healthy points (teal): sample1, sample2 on the left (negative PC1) -->
  <!-- sample1 (-1.643, 0.866) -> (146.4, 113.4) -->
  <circle cx="146.4" cy="113.4" r="8.5" fill="#2a9d8f" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="146.4" y="96" fill="#1b2a3a" font-size="14" text-anchor="middle" font-weight="bold">sample1</text>
  <!-- sample2 (-0.548, -0.866) -> (288.8, 286.6) -->
  <circle cx="288.8" cy="286.6" r="8.5" fill="#2a9d8f" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="288.8" y="270" fill="#1b2a3a" font-size="14" text-anchor="middle" font-weight="bold">sample2</text>

  <!-- tumor points (orange): sample3, sample4 on the right (positive PC1) -->
  <!-- sample3 (0.548, -0.866) -> (431.2, 286.6) -->
  <circle cx="431.2" cy="286.6" r="8.5" fill="#e08e0b" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="431.2" y="270" fill="#1b2a3a" font-size="14" text-anchor="middle" font-weight="bold">sample3</text>
  <!-- sample4 (1.643, 0.866) -> (573.6, 113.4) -->
  <circle cx="573.6" cy="113.4" r="8.5" fill="#e08e0b" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="573.6" y="96" fill="#1b2a3a" font-size="14" text-anchor="middle" font-weight="bold">sample4</text>

  <!-- legend (lower-left corner, clear of all data points) -->
  <g font-size="14" fill="#1b2a3a">
    <rect x="98" y="260" width="150" height="52" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
    <circle cx="116" cy="278" r="7" fill="#2a9d8f" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="132" y="283">healthy</text>
    <circle cx="116" cy="302" r="7" fill="#e08e0b" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="132" y="307">tumor</text>
  </g>

  <!-- annotation: groups separate along PC1 -->
  <text x="205" y="188" fill="#bc4749" font-size="13.5" text-anchor="middle" font-weight="bold">healthy</text>
  <text x="505" y="188" fill="#bc4749" font-size="13.5" text-anchor="middle" font-weight="bold">tumor</text>
  <path d="M230,178 C280,178 315,178 348,190" fill="none" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M478,178 C428,178 405,178 372,190" fill="none" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="52" fill="#bc4749" font-size="13.5" text-anchor="middle" font-weight="bold">groups separate along PC1 → read PC1 loadings for the driver genes</text>
</svg>
