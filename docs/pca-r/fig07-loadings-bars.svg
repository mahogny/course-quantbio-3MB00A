<svg xmlns="http://www.w3.org/2000/svg" width="623.8" height="391.2" viewBox="-0.6 15.3 623.8 391.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- shared geometry: panel plot centers at x=175 (PC1) and x=490 (PC2); scale 1 unit = 110px; rows y=120,168,216 -->

  <!-- LEFT PANEL: PC1 loadings -->
  <text x="175" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">PC1 loadings</text>

  <!-- axis grid ticks -->
  <line x1="65" y1="252" x2="285" y2="252" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="65" y1="248" x2="65" y2="256" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="285" y1="248" x2="285" y2="256" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="65" y="272" text-anchor="middle" font-size="12" fill="#1b2a3a">&#8722;1</text>
  <text x="175" y="272" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="285" y="272" text-anchor="middle" font-size="12" fill="#1b2a3a">+1</text>

  <!-- zero line -->
  <line x1="175" y1="96" x2="175" y2="252" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- gene labels -->
  <text x="58" y="124" text-anchor="end" font-size="14" fill="#1b2a3a">geneA</text>
  <text x="58" y="172" text-anchor="end" font-size="14" fill="#1b2a3a">geneB</text>
  <text x="58" y="220" text-anchor="end" font-size="14" fill="#1b2a3a">geneC</text>

  <!-- geneA +0.707 (positive, blue) -->
  <rect x="175" y="108" width="78" height="24" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <rect x="175" y="108" width="78" height="24" fill="#2a6f97" opacity="0.75"/>
  <text x="259" y="124" font-size="12" fill="#2a6f97" font-weight="bold">+0.707</text>

  <!-- geneB +0.707 (positive, blue) -->
  <rect x="175" y="156" width="78" height="24" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <rect x="175" y="156" width="78" height="24" fill="#2a6f97" opacity="0.75"/>
  <text x="259" y="172" font-size="12" fill="#2a6f97" font-weight="bold">+0.707</text>

  <!-- geneC 0.000 (zero stub) -->
  <rect x="172" y="204" width="6" height="24" fill="#c9d3dd" stroke="#8a97a4" stroke-width="1.2"/>
  <text x="185" y="220" font-size="12" fill="#8a97a4">0.000</text>

  <!-- LEFT annotation -->
  <text x="60" y="312" font-size="13" fill="#1b2a3a">PC1 = geneA &amp; geneB together (the trend);</text>
  <text x="60" y="330" font-size="13" fill="#1b2a3a">geneC absent</text>

  <!-- divider -->
  <line x1="330" y1="60" x2="330" y2="300" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- RIGHT PANEL: PC2 loadings -->
  <text x="490" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">PC2 loadings</text>

  <!-- axis grid ticks -->
  <line x1="380" y1="252" x2="600" y2="252" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="380" y1="248" x2="380" y2="256" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="600" y1="248" x2="600" y2="256" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#1b2a3a">&#8722;1</text>
  <text x="490" y="272" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="600" y="272" text-anchor="middle" font-size="12" fill="#1b2a3a">+1</text>

  <!-- zero line -->
  <line x1="490" y1="96" x2="490" y2="252" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- gene labels -->
  <text x="373" y="124" text-anchor="end" font-size="14" fill="#1b2a3a">geneA</text>
  <text x="373" y="172" text-anchor="end" font-size="14" fill="#1b2a3a">geneB</text>
  <text x="373" y="220" text-anchor="end" font-size="14" fill="#1b2a3a">geneC</text>

  <!-- geneA 0.000 (zero stub) -->
  <rect x="487" y="108" width="6" height="24" fill="#c9d3dd" stroke="#8a97a4" stroke-width="1.2"/>
  <text x="500" y="124" font-size="12" fill="#8a97a4">0.000</text>

  <!-- geneB 0.000 (zero stub) -->
  <rect x="487" y="156" width="6" height="24" fill="#c9d3dd" stroke="#8a97a4" stroke-width="1.2"/>
  <text x="500" y="172" font-size="12" fill="#8a97a4">0.000</text>

  <!-- geneC -1.000 (negative, red, full length left) -->
  <rect x="380" y="204" width="110" height="24" fill="#f6e9e9" stroke="#bc4749" stroke-width="1.8"/>
  <rect x="380" y="204" width="110" height="24" fill="#bc4749" opacity="0.72"/>
  <text x="386" y="220" text-anchor="start" font-size="12" fill="#ffffff" font-weight="bold">&#8722;1.000</text>

  <!-- RIGHT annotation -->
  <text x="375" y="312" font-size="13" fill="#1b2a3a">PC2 = the geneC wobble,</text>
  <text x="375" y="330" font-size="13" fill="#1b2a3a">independent</text>

  <!-- bottom takeaway -->
  <line x1="60" y1="346" x2="600" y2="346" stroke="#c9d3dd" stroke-width="1.2"/>
  <text x="330" y="368" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">magnitude = contribution &#183; sign = direction</text>
  <text x="135" y="386" text-anchor="start" font-size="13" fill="#6a994e" font-weight="bold">eigenvectors are unit-length (0.707<tspan dy="-5" font-size="9">2</tspan><tspan dy="5" font-size="13"> + 0.707</tspan><tspan dy="-5" font-size="9">2</tspan><tspan dy="5" font-size="13"> = 1) and orthogonal</tspan></text>
</svg>
