<svg xmlns="http://www.w3.org/2000/svg" viewBox="31.4 -6.0 819.1 410.8" width="819.1" height="410.8" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a994e"/>
    </marker>
    <marker id="curv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- =============== LEFT PANEL =============== -->
  <text x="215" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Pure rotation  [[0,−1],[1,0]]</text>

  <!-- axes -->
  <g transform="translate(215,205)">
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="0" y1="150" x2="0" y2="-150" stroke="#c9d3dd" stroke-width="1.5"/>

    <!-- input vectors (dashed gray) and rotated outputs (solid blue) -->
    <!-- v1 = (110,0) -> (0,-110) i.e. up on screen -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahB)"/>
    <path d="M96 -18 A 100 100 0 0 0 18 -96" fill="none" stroke="#2a6f97" stroke-width="1.5" marker-end="url(#curv)"/>

    <!-- v2 = (0,110)[down screen] -> (-110,0) -->
    <line x1="0" y1="0" x2="0" y2="110" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <line x1="0" y1="0" x2="-110" y2="0" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahB)"/>

    <!-- v3 diagonal (90,90)[down-right] -> (-90,90)[down-left] -->
    <line x1="0" y1="0" x2="90" y2="90" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <line x1="0" y1="0" x2="-90" y2="90" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahB)"/>
    <path d="M92 78 A 116 116 0 0 0 78 -92" fill="none" stroke="#2a6f97" stroke-width="1.2" marker-end="url(#curv)" opacity="0.6"/>

    <!-- v4 diagonal up-left (-90,-90)[up-left screen] -> (90,-90)[up-right] -->
    <line x1="0" y1="0" x2="-90" y2="-90" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <line x1="0" y1="0" x2="90" y2="-90" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahB)"/>
  </g>

  <text x="215" y="378" text-anchor="middle" font-size="15" font-style="italic" fill="#bc4749">every direction moves — no real eigenvector</text>

  <!-- divider -->
  <line x1="430" y1="45" x2="430" y2="355" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- =============== RIGHT PANEL =============== -->
  <text x="645" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Repeated eigenvalue  [[2,0],[0,2]]</text>

  <g transform="translate(645,205)">
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="0" y1="150" x2="0" y2="-150" stroke="#c9d3dd" stroke-width="1.5"/>

    <!-- each: short dashed input, collinear solid green output twice as long -->
    <!-- dir right -->
    <line x1="0" y1="0" x2="140" y2="0" stroke="#6a994e" stroke-width="2" marker-end="url(#ahG)"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

    <!-- dir up -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#6a994e" stroke-width="2" marker-end="url(#ahG)"/>
    <line x1="0" y1="0" x2="0" y2="-65" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

    <!-- dir down-right diag -->
    <line x1="0" y1="0" x2="120" y2="120" stroke="#6a994e" stroke-width="2" marker-end="url(#ahG)"/>
    <line x1="0" y1="0" x2="60" y2="60" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

    <!-- dir up-left diag -->
    <line x1="0" y1="0" x2="-120" y2="-120" stroke="#6a994e" stroke-width="2" marker-end="url(#ahG)"/>
    <line x1="0" y1="0" x2="-60" y2="-60" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

    <!-- dir down-left -->
    <line x1="0" y1="0" x2="-130" y2="90" stroke="#6a994e" stroke-width="2" marker-end="url(#ahG)"/>
    <line x1="0" y1="0" x2="-65" y2="45" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

    <text x="150" y="-115" text-anchor="middle" font-size="16" font-weight="bold" fill="#6a994e">λ = 2</text>
  </g>

  <text x="645" y="378" text-anchor="middle" font-size="15" font-style="italic" fill="#6a994e">every direction is an eigenvector, λ = 2 (scales equally)</text>
</svg>
