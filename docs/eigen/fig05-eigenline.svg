<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 720 416" width="720" height="416" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6a994e"/>
    </marker>
    <marker id="ahd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bc4749"/>
    </marker>
    <marker id="axh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9d3dd"/>
    </marker>
  </defs>

  <!-- faint axes through origin (origin at 300,220) -->
  <line x1="40" y1="220" x2="690" y2="220" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#axh)"/>
  <line x1="300" y1="380" x2="300" y2="18" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#axh)"/>
  <text x="682" y="238" font-size="13" fill="#9aa8b5">x</text>
  <text x="308" y="28" font-size="13" fill="#9aa8b5">y</text>

  <!-- the one bold eigen-line through origin, direction (1,1) -->
  <line x1="184" y1="336" x2="516" y2="4" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"/>

  <!-- arrows: all lie on this single line -->
  <!-- 2v = (2,2) -->
  <line x1="300" y1="220" x2="420" y2="100" stroke="#6a994e" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- v = (1,1) -->
  <line x1="300" y1="220" x2="360" y2="160" stroke="#6a994e" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- 0.5v = (0.5,0.5) -->
  <line x1="300" y1="220" x2="330" y2="190" stroke="#6a994e" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- -v = (-1,-1) -->
  <line x1="300" y1="220" x2="240" y2="280" stroke="#bc4749" stroke-width="2.4" marker-end="url(#ahd)"/>

  <!-- origin dot -->
  <circle cx="300" cy="220" r="4" fill="#1b2a3a"/>
  <text x="278" y="238" font-size="13" fill="#1b2a3a">0</text>

  <!-- arrow labels -->
  <text x="428" y="98" font-size="15" fill="#6a994e" font-weight="bold">2v = (2, 2)</text>
  <text x="366" y="150" font-size="15" fill="#6a994e" font-weight="bold">v = (1, 1)</text>
  <text x="336" y="184" font-size="13" fill="#6a994e">0.5v = (0.5, 0.5)</text>
  <text x="150" y="298" font-size="15" fill="#bc4749" font-weight="bold">−v = (−1, −1)</text>

  <!-- callout -->
  <rect x="452" y="250" width="252" height="142" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="466" y="276" font-size="15" fill="#1b2a3a" font-weight="bold">One eigen-line, λ = 3</text>
  <text x="466" y="300" font-size="13.5" fill="#1b2a3a">every nonzero multiple is the</text>
  <text x="466" y="318" font-size="13.5" fill="#1b2a3a">same eigenvector — they all</text>
  <text x="466" y="336" font-size="13.5" fill="#1b2a3a">lie on this single line.</text>
  <text x="466" y="360" font-size="13" fill="#2a6f97">R normalises to length 1:</text>
  <text x="466" y="380" font-size="13" fill="#2a6f97" font-weight="bold">(0.707, 0.707)</text>
</svg>
