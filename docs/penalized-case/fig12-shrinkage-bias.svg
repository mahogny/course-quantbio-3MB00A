<svg xmlns="http://www.w3.org/2000/svg" viewBox="125 30 476 412" font-family="Helvetica, Arial, sans-serif" width="476" height="412">
  <defs>
    <marker id="axar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="biasar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- dead zone band: coefficients inside are zeroed -->
  <rect x="296.5" y="52" width="87" height="292" fill="#eaf1f7"/>
  <line x1="296.5" y1="52" x2="296.5" y2="344" stroke="#2a6f97" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.7"/>
  <line x1="383.5" y1="52" x2="383.5" y2="344" stroke="#2a6f97" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.7"/>
  <text x="272" y="214" text-anchor="end" font-size="12" fill="#2a6f97">&#8722;&#955;</text>
  <text x="392" y="214" font-size="12" fill="#2a6f97">+&#955;</text>

  <!-- axes through origin -->
  <line x1="150" y1="195" x2="528" y2="195" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#axar)"/>
  <line x1="340" y1="352" x2="340" y2="44" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#axar)"/>
  <text x="348" y="208" font-size="12" fill="#6a6f75">0</text>

  <!-- axis titles -->
  <text x="524" y="233" text-anchor="end" font-size="14.5" fill="#1b2a3a">unpenalized (OLS) coefficient</text>
  <text x="150" y="60" font-size="14.5" fill="#1b2a3a">lasso estimate</text>

  <!-- identity line y = x (dashed) -->
  <line x1="195" y1="340" x2="485" y2="50" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="402" y="112" text-anchor="middle" font-size="13.5" fill="#1b2a3a" transform="rotate(-45 402 112)">unbiased  (no shrinkage,  y = x)</text>

  <!-- soft-threshold curve: sign(x)*max(|x|-lambda,0) -->
  <polyline points="160,331 296.5,195 383.5,195 520,59" fill="none" stroke="#2a6f97" stroke-width="2.6"/>

  <!-- dead zone label -->
  <text x="238" y="128" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">small coefficients</text>
  <text x="238" y="145" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">set exactly to 0</text>
  <line x1="270" y1="150" x2="330" y2="192" stroke="#6a994e" stroke-width="1.3" marker-end="url(#axar)" opacity="0.8"/>

  <!-- shrinkage arrow 1 (large positive coeff pulled down toward 0) -->
  <circle cx="456" cy="79" r="4" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <circle cx="456" cy="122.5" r="4" fill="#2a6f97"/>
  <line x1="456" y1="84" x2="456" y2="117" stroke="#bc4749" stroke-width="2" marker-end="url(#biasar)"/>

  <!-- shrinkage arrow 2 (large negative coeff pulled up toward 0) -->
  <circle cx="246" cy="289" r="4" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
  <circle cx="246" cy="245.75" r="4" fill="#2a6f97"/>
  <line x1="246" y1="284" x2="246" y2="251" stroke="#bc4749" stroke-width="2" marker-end="url(#biasar)"/>

  <text x="486" y="103" font-size="13" fill="#bc4749" font-weight="bold">magnitudes</text>
  <text x="486" y="120" font-size="13" fill="#bc4749" font-weight="bold">biased low</text>

  <!-- sign flip: two near-zero OLS points, both collapse to 0 -->
  <circle cx="357" cy="178" r="3.6" fill="none" stroke="#bc4749" stroke-width="1.5"/>
  <circle cx="323" cy="212" r="3.6" fill="none" stroke="#bc4749" stroke-width="1.5"/>
  <line x1="357" y1="181" x2="357" y2="192" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#biasar)"/>
  <line x1="323" y1="209" x2="323" y2="198" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#biasar)"/>
  <line x1="440" y1="180" x2="361" y2="178" stroke="#bc4749" stroke-width="1.2" opacity="0.8" marker-end="url(#biasar)"/>
  <text x="443" y="170" font-size="12.5" fill="#bc4749">small coeff: sign can</text>
  <text x="443" y="187" font-size="12.5" fill="#bc4749">flip between resamples</text>

  <!-- caption -->
  <line x1="140" y1="372" x2="586" y2="372" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="205" y="390" text-anchor="start" font-size="13.5" fill="#1b2a3a">Shrinkage trades bias for variance <tspan font-style="italic">on purpose</tspan> &#8212;</text>
  <text x="150" y="408" text-anchor="start" font-size="13.5" fill="#1b2a3a">coefficients <tspan font-weight="bold">rank</tspan> predictors, they are not clean effect sizes.</text>
  <text x="363" y="426" text-anchor="middle" font-size="13.5" fill="#bc4749" font-weight="bold">Do not attach naive p-values.</text>
</svg>
