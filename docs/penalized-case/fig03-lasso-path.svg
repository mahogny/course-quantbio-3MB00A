<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.2 14.1 656.7 380.2" font-family="Helvetica, Arial, sans-serif" width="656.7" height="380.2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- axes frame -->
  <line x1="90" y1="335" x2="90" y2="35" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="320" x2="640" y2="320" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- zero reference line (beta = 0) -->
  <line x1="90" y1="180" x2="625" y2="180" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="82" y="184" text-anchor="end" font-size="13" fill="#7d8a97">0</text>

  <!-- lambda.1se vertical dashed line -->
  <line x1="470" y1="45" x2="470" y2="320" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.75"/>
  <text x="470" y="338" text-anchor="middle" font-size="13" fill="#1b2a3a" font-style="italic">lambda.1se</text>

  <!-- coefficient paths: each shrinks smoothly to exactly zero at its own lambda -->
  <!-- curve 8 (killed early) -->
  <polyline points="90,205 150,194 200,186 250,180 625,180" fill="none" stroke="#7d8a97" stroke-width="1.8"/>
  <!-- curve 7 -->
  <polyline points="90,149 160,161 230,172 300,180 625,180" fill="none" stroke="#9e5a63" stroke-width="1.8"/>
  <!-- curve 6 -->
  <polyline points="90,219 160,207 250,193 360,180 625,180" fill="none" stroke="#5a8ca8" stroke-width="1.8"/>
  <!-- curve 5 -->
  <polyline points="90,131 170,144 250,157 330,169 430,180 625,180" fill="none" stroke="#b07a2a" stroke-width="1.8"/>
  <!-- curve 4 (dies just after lambda.1se) -->
  <polyline points="90,236 180,221 270,207 360,194 450,184 490,180 625,180" fill="none" stroke="#7a5ea8" stroke-width="1.8"/>
  <!-- curve 3 (survivor, green) -->
  <polyline points="90,110 180,127 270,144 360,159 450,172 520,180 625,180" fill="none" stroke="#6a994e" stroke-width="2"/>
  <!-- curve 2 ABCB1 (survivor, red) -->
  <polyline points="90,264 180,245 270,227 360,210 450,195 520,184 560,180 625,180" fill="none" stroke="#bc4749" stroke-width="2.2"/>
  <!-- curve 1 TYMS (survivor, blue) -->
  <polyline points="90,75 180,96 270,118 360,138 450,155 520,168 560,174 605,180 625,180" fill="none" stroke="#2a6f97" stroke-width="2.2"/>

  <!-- gene labels on surviving curves -->
  <text x="238" y="112" text-anchor="end" font-size="14" fill="#2a6f97" font-weight="bold">TYMS</text>
  <line x1="240" y1="112" x2="270" y2="118" stroke="#2a6f97" stroke-width="1"/>
  <text x="238" y="230" text-anchor="end" font-size="14" fill="#bc4749" font-weight="bold">ABCB1</text>
  <line x1="240" y1="226" x2="270" y2="227" stroke="#bc4749" stroke-width="1"/>

  <!-- upward-right annotation arrow -->
  <line x1="500" y1="115" x2="610" y2="58" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <!-- annotation caption -->
  <text x="150" y="52" font-size="13.5" fill="#1b2a3a">larger λ  →  more coefficients</text>
  <text x="150" y="70" font-size="13.5" fill="#1b2a3a">exactly zero  →  sparser signature</text>

  <!-- axis labels -->
  <text x="360" y="372" text-anchor="middle" font-size="15" fill="#1b2a3a">log λ (penalty strength)</text>
  <text x="118" y="312" text-anchor="middle" font-size="12" fill="#7d8a97">small λ</text>
  <text x="600" y="312" text-anchor="middle" font-size="12" fill="#7d8a97">large λ</text>
  <text x="34" y="185" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 34 185)">coefficient  β_j</text>
</svg>
