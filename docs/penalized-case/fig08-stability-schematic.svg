<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 900 344" width="900" height="344" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ================= LEFT : full data ================= -->
  <text x="78" y="150" font-size="14.5" font-weight="bold" fill="#1b2a3a" text-anchor="middle">full data</text>
  <rect x="20" y="158" width="116" height="90" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="20" y1="173" x2="136" y2="173"/>
    <line x1="20" y1="188" x2="136" y2="188"/>
    <line x1="20" y1="203" x2="136" y2="203"/>
    <line x1="20" y1="218" x2="136" y2="218"/>
    <line x1="20" y1="233" x2="136" y2="233"/>
    <line x1="49" y1="158" x2="49" y2="248"/>
    <line x1="78" y1="158" x2="78" y2="248"/>
    <line x1="107" y1="158" x2="107" y2="248"/>
  </g>
  <text x="78" y="266" font-size="12.5" fill="#1b2a3a" text-anchor="middle">80 cell lines × genes</text>

  <!-- ================= fan-out arrows ================= -->
  <line x1="140" y1="196" x2="182" y2="66"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="200" x2="182" y2="121" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="204" x2="182" y2="176" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="212" x2="182" y2="256" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= subsample stack ================= -->
  <!-- box 1 : highlight rows 0,2,4 -->
  <rect x="185" y="47" width="112" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="185" y="47"    width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="59.6"  width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="72.2"  width="112" height="6.3" fill="#cfe0ef"/>
  <text x="241" y="99" font-size="11" fill="#1b2a3a" text-anchor="middle">random half (40 lines)</text>

  <!-- box 2 : highlight rows 1,2,5 -->
  <rect x="185" y="102" width="112" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="185" y="108.3" width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="114.6" width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="133.7" width="112" height="6.3" fill="#cfe0ef"/>
  <text x="241" y="154" font-size="11" fill="#1b2a3a" text-anchor="middle">random half (40 lines)</text>

  <!-- box 3 : highlight rows 0,3,4 -->
  <rect x="185" y="157" width="112" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="185" y="157"    width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="176.1"  width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="182.4"  width="112" height="6.3" fill="#cfe0ef"/>
  <text x="241" y="209" font-size="11" fill="#1b2a3a" text-anchor="middle">random half (40 lines)</text>

  <!-- vertical ellipsis implying 100 total (drawn dots; glyph drops in cairosvg) -->
  <circle cx="241" cy="219" r="1.7" fill="#1b2a3a"/>
  <circle cx="241" cy="225" r="1.7" fill="#1b2a3a"/>
  <circle cx="241" cy="231" r="1.7" fill="#1b2a3a"/>

  <!-- box B : highlight rows 1,3,5 -->
  <rect x="185" y="237" width="112" height="38" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="185" y="243.3" width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="256.5" width="112" height="6.3" fill="#cfe0ef"/>
  <rect x="185" y="268.7" width="112" height="6.3" fill="#cfe0ef"/>
  <text x="241" y="289" font-size="11" fill="#1b2a3a" text-anchor="middle">random half (40 lines)</text>

  <text x="241" y="34" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="middle">B = 100 subsamples</text>

  <!-- ================= per-subsample lasso + selected genes ================= -->
  <line x1="299" y1="66"  x2="329" y2="66"  stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="299" y1="121" x2="329" y2="121" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="299" y1="176" x2="329" y2="176" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="299" y1="256" x2="329" y2="256" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="10.5" text-anchor="middle">
    <rect x="332" y="49" width="152" height="34" rx="5" fill="#f2f7fb" stroke="#2a6f97" stroke-width="1.4"/>
    <text x="408" y="63" fill="#2a6f97" font-weight="bold">lasso fit → genes</text>
    <text x="408" y="77" fill="#1b2a3a">{TYMS, ABCB1, MKI67}</text>

    <rect x="332" y="104" width="152" height="34" rx="5" fill="#f2f7fb" stroke="#2a6f97" stroke-width="1.4"/>
    <text x="408" y="118" fill="#2a6f97" font-weight="bold">lasso fit → genes</text>
    <text x="408" y="132" fill="#1b2a3a">{TYMS, ABCB1, PCNA}</text>

    <rect x="332" y="159" width="152" height="34" rx="5" fill="#f2f7fb" stroke="#2a6f97" stroke-width="1.4"/>
    <text x="408" y="173" fill="#2a6f97" font-weight="bold">lasso fit → genes</text>
    <text x="408" y="187" fill="#1b2a3a">{TYMS, PCNA, MKI67}</text>

    <rect x="332" y="239" width="152" height="34" rx="5" fill="#f2f7fb" stroke="#2a6f97" stroke-width="1.4"/>
    <text x="408" y="253" fill="#2a6f97" font-weight="bold">lasso fit → genes</text>
    <text x="408" y="267" fill="#1b2a3a">{TYMS, ABCB1, PCNA}</text>
  </g>

  <!-- ================= collapse / converging arrows ================= -->
  <line x1="487" y1="66"  x2="556" y2="176" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <line x1="487" y1="121" x2="556" y2="178" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <line x1="487" y1="176" x2="556" y2="180" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <line x1="487" y1="256" x2="556" y2="184" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="512" y="118" font-size="10.5" fill="#2a6f97" text-anchor="middle" transform="rotate(-52 512 118)">count how often</text>
  <text x="524" y="230" font-size="10.5" fill="#2a6f97" text-anchor="middle" transform="rotate(38 524 230)">each gene is picked</text>

  <!-- ================= RIGHT : selection-frequency bar chart ================= -->
  <!-- title: pi-hat rendered as base pi + drawn caret (combining hat drops in cairosvg) -->
  <text x="782" y="42" font-size="14.5" font-weight="bold" fill="#1b2a3a" text-anchor="end">selection frequency</text>
  <text x="787" y="42" font-size="14.5" font-weight="bold" fill="#1b2a3a" text-anchor="start">π</text>
  <path d="M787,29 L792,24 L797,29" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>

  <!-- frequency axis 0 to 1 -->
  <line x1="585" y1="60" x2="585" y2="298" stroke="#1b2a3a" stroke-width="1.6"/>
  <line x1="585" y1="298" x2="862" y2="298" stroke="#1b2a3a" stroke-width="1.6"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="720" y1="60" x2="720" y2="298"/>
    <line x1="855" y1="60" x2="855" y2="298"/>
  </g>
  <g font-size="11.5" fill="#1b2a3a" text-anchor="middle">
    <text x="585" y="313">0</text>
    <text x="720" y="313">0.5</text>
    <text x="855" y="313">1.0</text>
  </g>

  <!-- bars : x0=585, scale 270 px per unit -->
  <!-- TYMS 0.94 -->
  <rect x="585" y="70" width="253.8" height="24" fill="#6a994e"/>
  <text x="590" y="66" font-size="12" fill="#1b2a3a">TYMS</text>
  <text x="844" y="87" font-size="11.5" fill="#6a994e" font-weight="bold">0.94</text>
  <!-- ABCB1 0.88 -->
  <rect x="585" y="115" width="237.6" height="24" fill="#6a994e"/>
  <text x="590" y="111" font-size="12" fill="#1b2a3a">ABCB1</text>
  <text x="828" y="132" font-size="11.5" fill="#6a994e" font-weight="bold">0.88</text>
  <!-- PCNA 0.55 (label right of dashed line so the line does not cross it) -->
  <rect x="585" y="160" width="148.5" height="24" fill="#2a6f97" opacity="0.5"/>
  <text x="590" y="156" font-size="12" fill="#1b2a3a">PCNA</text>
  <text x="753" y="177" font-size="11.5" fill="#2a6f97" font-weight="bold">0.55</text>
  <!-- MKI67 0.51 -->
  <rect x="585" y="205" width="137.7" height="24" fill="#2a6f97" opacity="0.5"/>
  <text x="590" y="201" font-size="12" fill="#1b2a3a">MKI67</text>
  <text x="753" y="222" font-size="11.5" fill="#2a6f97" font-weight="bold">0.51</text>
  <!-- faint gene 0.08 -->
  <rect x="585" y="250" width="21.6" height="24" fill="#bc4749" opacity="0.4"/>
  <text x="590" y="246" font-size="12" fill="#1b2a3a">HPRT1</text>
  <text x="612" y="267" font-size="11.5" fill="#bc4749" font-weight="bold">0.08</text>
  <text x="650" y="267" font-size="11" fill="#bc4749" font-style="italic">coin-flip winner — discard</text>

  <!-- threshold at pi = 0.6  ->  x = 585 + 0.6*270 = 747 -->
  <line x1="747" y1="62" x2="747" y2="252" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="6 4"/>
  <!-- label sits directly above the dashed line, in the band below the title -->
  <text x="747" y="58" font-size="12.5" font-weight="bold" fill="#bc4749" text-anchor="middle">π ≥ 0.6 threshold</text>

  <!-- kept / discarded annotation -->
  <text x="874" y="78" font-size="11" fill="#6a994e" font-weight="bold" text-anchor="start" transform="rotate(90 874 78)">keep (stable)</text>

  <!-- ================= caption ================= -->
  <text x="450" y="345" font-size="14.5" font-weight="bold" fill="#1b2a3a" text-anchor="middle">stop asking which genes lasso selects — ask which it selects reliably.</text>
</svg>
