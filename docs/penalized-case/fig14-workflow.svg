<svg xmlns="http://www.w3.org/2000/svg" width="852.7" height="406" viewBox="28.7 -2 852.7 406" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <text x="333" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">A defensible pharmacogenomics workflow</text>

  <!-- ================= BOX 1 ================= -->
  <rect x="96" y="40" width="474" height="52" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <circle cx="70" cy="66" r="17" fill="#1b2a3a"/>
  <text x="70" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1</text>
  <text x="112" y="62" font-size="12" fill="#1b2a3a">Assemble standardized samples × genes matrix + log IC<tspan dy="2.5" font-size="9">50</tspan><tspan dy="-2.5"> response —</tspan></text>
  <text x="112" y="80" font-size="12" font-weight="bold" fill="#bc4749">keep all preprocessing INSIDE the cross-validation</text>

  <line x1="333" y1="92" x2="333" y2="112" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= BOX 2 : the PREDICTOR ================= -->
  <rect x="96" y="114" width="474" height="52" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <circle cx="70" cy="140" r="17" fill="#2a6f97"/>
  <text x="70" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
  <text x="112" y="136" font-size="12" fill="#1b2a3a">Fit elastic net (cv.glmnet, tune both α and λ) → prediction;</text>
  <text x="112" y="154" font-size="12" font-weight="bold" fill="#2a6f97">report HELD-OUT performance</text>

  <line x1="333" y1="166" x2="333" y2="186" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= BOX 3 : the interpretable GENE LIST ================= -->
  <rect x="96" y="188" width="474" height="52" rx="8" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <circle cx="70" cy="214" r="17" fill="#6a994e"/>
  <text x="70" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3</text>
  <text x="112" y="210" font-size="12" fill="#1b2a3a">Stability selection (subsample + refit) → selection frequencies;</text>
  <text x="112" y="228" font-size="12" fill="#1b2a3a">report genes above threshold; report <tspan font-weight="bold" fill="#6a994e">MODULES</tspan> where a group splits</text>

  <line x1="333" y1="240" x2="333" y2="260" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= BOX 4 ================= -->
  <rect x="96" y="262" width="474" height="52" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <circle cx="70" cy="288" r="17" fill="#1b2a3a"/>
  <text x="70" y="294" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4</text>
  <text x="112" y="284" font-size="12" fill="#1b2a3a">Read shortlist as <tspan font-weight="bold" fill="#bc4749">HYPOTHESES</tspan>: cross-reference pathways,</text>
  <text x="112" y="302" font-size="12" fill="#1b2a3a">propose perturbation experiments to test causality</text>

  <line x1="333" y1="314" x2="333" y2="334" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= BOX 5 ================= -->
  <rect x="96" y="336" width="474" height="52" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <circle cx="70" cy="362" r="17" fill="#1b2a3a"/>
  <text x="70" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">5</text>
  <text x="112" y="358" font-size="12" fill="#1b2a3a">Write methods paragraph: standardization, α/λ rule (lambda.1se),</text>
  <text x="112" y="376" font-size="12" fill="#1b2a3a">CV scheme, resampling count B, threshold, seed</text>

  <!-- ================= SIDE BRANCH: split of duties ================= -->
  <!-- connector from box 2 -->
  <line x1="570" y1="140" x2="617" y2="140" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#arrowblue)"/>
  <!-- connector from box 3 -->
  <line x1="570" y1="214" x2="617" y2="214" stroke="#6a994e" stroke-width="1.6" marker-end="url(#arrowgreen)"/>

  <!-- PREDICTOR label -->
  <rect x="618" y="122" width="238" height="36" rx="7" fill="#ffffff" stroke="#2a6f97" stroke-width="1.6"/>
  <text x="737" y="139" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a6f97">the PREDICTOR</text>
  <text x="737" y="152" text-anchor="middle" font-size="10.5" fill="#2a6f97">how well can we forecast response?</text>

  <!-- GENE LIST label -->
  <rect x="618" y="196" width="238" height="36" rx="7" fill="#ffffff" stroke="#6a994e" stroke-width="1.6"/>
  <text x="737" y="213" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6a994e">the interpretable GENE LIST</text>
  <text x="737" y="226" text-anchor="middle" font-size="10.5" fill="#6a994e">which genes are worth testing?</text>

  <!-- brace tying the two together -->
  <path d="M602,140 C592,140 592,177 582,177 C592,177 592,214 602,214" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- do-not-conflate note -->
  <text x="737" y="264" text-anchor="middle" font-size="12.5" font-style="italic" fill="#bc4749">different questions —</text>
  <text x="737" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" font-style="italic" fill="#bc4749">do not conflate</text>
</svg>
