<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <!-- one factor, three levels: group means and what the coefficients measure -->
  <!-- axes: y = 330 - 28*(v - 5) -->
  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6a994e"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/></marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/></marker>
  </defs>

  <line x1="80" y1="330" x2="660" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <g font-size="16.2" fill="#1b2a3a" text-anchor="end">
    <line x1="74" y1="302" x2="80" y2="302" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="307">6</text>
    <line x1="74" y1="246" x2="80" y2="246" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="251">8</text>
    <line x1="74" y1="190" x2="80" y2="190" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="195">10</text>
    <line x1="74" y1="134" x2="80" y2="134" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="139">12</text>
    <line x1="74" y1="78" x2="80" y2="78" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="83">14</text>
  </g>
  <text x="32" y="190" font-size="17.5" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 32 190)">expression</text>
  <g font-size="18.8" fill="#1b2a3a" text-anchor="middle">
    <text x="190" y="354">batch A</text>
    <text x="190" y="372" font-size="15.6" fill="#5b6b7a">(reference)</text>
    <text x="320" y="354">batch B</text>
    <text x="450" y="354">batch C</text>
  </g>

  <!-- reference level: mean of A, extended across the plot -->
  <line x1="80" y1="190" x2="640" y2="190" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="88" y="182" font-size="17.5" fill="#1b2a3a">β<tspan dy="4" font-size="12.5">0</tspan><tspan dy="-4"> = 10</tspan></text>

  <!-- data points (each group's points average to its mean) -->
  <g fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1">
    <circle cx="178" cy="212.4" r="5"/><circle cx="196" cy="173.2" r="5"/><circle cx="184" cy="201.2" r="5"/><circle cx="204" cy="164.8" r="5"/><circle cx="190" cy="198.4" r="5"/>
    <circle cx="308" cy="153.6" r="5"/><circle cx="326" cy="111.6" r="5"/><circle cx="314" cy="139.6" r="5"/><circle cx="334" cy="117.2" r="5"/><circle cx="320" cy="148" r="5"/>
    <circle cx="438" cy="296.4" r="5"/><circle cx="456" cy="248.8" r="5"/><circle cx="444" cy="279.6" r="5"/><circle cx="464" cy="262.8" r="5"/><circle cx="450" cy="282.4" r="5"/>
  </g>

  <!-- group means -->
  <g stroke="#1b2a3a" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="190" x2="220" y2="190"/>
    <line x1="290" y1="134" x2="350" y2="134"/>
    <line x1="420" y1="274" x2="480" y2="274"/>
  </g>
  <g font-size="15.6" fill="#5b6b7a">
    <text x="226" y="210">mean 10</text>
    <text x="284" y="139" text-anchor="end">mean 12</text>
    <text x="414" y="296" text-anchor="end">mean 7</text>
  </g>

  <!-- beta_B: B - A -->
  <line x1="365" y1="190" x2="365" y2="137" stroke="#6a994e" stroke-width="2.6" marker-end="url(#ah-g)"/>
  <text x="372" y="168" font-size="18.8" fill="#6a994e" font-weight="bold">β<tspan dy="4" font-size="13.8">B</tspan><tspan dy="-4"> = +2</tspan></text>

  <!-- beta_C: C - A -->
  <line x1="495" y1="190" x2="495" y2="271" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#ah-b)"/>
  <text x="502" y="236" font-size="18.8" fill="#2a6f97" font-weight="bold">β<tspan dy="4" font-size="13.8">C</tspan><tspan dy="-4"> = −3</tspan></text>

  <!-- beta_C - beta_B: C - B -->
  <line x1="350" y1="134" x2="620" y2="134" stroke="#bc4749" stroke-width="1.3" stroke-dasharray="3 4"/>
  <line x1="480" y1="274" x2="620" y2="274" stroke="#bc4749" stroke-width="1.3" stroke-dasharray="3 4"/>
  <line x1="610" y1="134" x2="610" y2="271" stroke="#bc4749" stroke-width="2.6" marker-end="url(#ah-r)"/>
  <text x="616" y="96" font-size="18.8" fill="#bc4749" font-weight="bold" text-anchor="middle">C − B:</text>
  <text x="616" y="116" font-size="18.8" fill="#bc4749" font-weight="bold" text-anchor="middle">β<tspan dy="4" font-size="13.8">C</tspan><tspan dy="-4"> − β</tspan><tspan dy="4" font-size="13.8">B</tspan><tspan dy="-4"> = −5</tspan></text>
</svg>
