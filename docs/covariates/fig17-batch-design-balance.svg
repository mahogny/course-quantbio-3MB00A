<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="318" viewBox="0 0 1000 318" font-family="Helvetica, Arial, sans-serif">
  <!-- batch x treatment layouts: confounded, partly confounded, balanced -->
  <text x="135.0" y="36" font-size="16" fill="#bc4749" text-anchor="middle" font-weight="bold">Perfectly confounded</text>
  <text x="170" y="64" font-size="12" fill="#5b6b7a" text-anchor="middle" font-weight="normal">sequencing batch</text>
  <text x="130.0" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">A</text>
  <text x="210.0" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B</text>
  <text x="80" y="122" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">ctrl</text>
  <rect x="90" y="94" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="130.0" y="123" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">4</text>
  <rect x="170" y="94" width="80" height="44" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="210.0" y="123" font-size="20" fill="#bc4749" text-anchor="middle" font-weight="bold">0</text>
  <text x="80" y="166" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">treat</text>
  <rect x="90" y="138" width="80" height="44" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="130.0" y="167" font-size="20" fill="#bc4749" text-anchor="middle" font-weight="bold">0</text>
  <rect x="170" y="138" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="210.0" y="167" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">4</text>
  <text x="135.0" y="212" font-size="14" fill="#bc4749" text-anchor="middle" font-weight="bold">no unique β</text>
  <text x="135.0" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">batchB column = treatmenttreat</text>
  <text x="135.0" y="250" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">cannot be fixed by analysis:</text>
  <text x="135.0" y="268" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">redesign the experiment</text>
  <text x="475.0" y="36" font-size="16" fill="#2a6f97" text-anchor="middle" font-weight="bold">Partly confounded</text>
  <text x="510" y="64" font-size="12" fill="#5b6b7a" text-anchor="middle" font-weight="normal">sequencing batch</text>
  <text x="470.0" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">A</text>
  <text x="550.0" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B</text>
  <text x="420" y="122" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">ctrl</text>
  <rect x="430" y="94" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="470.0" y="123" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">1</text>
  <rect x="510" y="94" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="550.0" y="123" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">3</text>
  <text x="420" y="166" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">treat</text>
  <rect x="430" y="138" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="470.0" y="167" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">3</text>
  <rect x="510" y="138" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="550.0" y="167" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">1</text>
  <text x="475.0" y="212" font-size="14" fill="#2a6f97" text-anchor="middle" font-weight="bold">unique β</text>
  <text x="475.0" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">but batch and treatment tangle:</text>
  <text x="475.0" y="250" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">the unadjusted difference misleads</text>
  <text x="475.0" y="268" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">→ Confounding &amp; Simpson's paradox</text>
  <text x="815.0" y="36" font-size="16" fill="#6a994e" text-anchor="middle" font-weight="bold">Balanced</text>
  <text x="850" y="64" font-size="12" fill="#5b6b7a" text-anchor="middle" font-weight="normal">sequencing batch</text>
  <text x="810.0" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">A</text>
  <text x="890.0" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B</text>
  <text x="760" y="122" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">ctrl</text>
  <rect x="770" y="94" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="810.0" y="123" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2</text>
  <rect x="850" y="94" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="890.0" y="123" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2</text>
  <text x="760" y="166" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">treat</text>
  <rect x="770" y="138" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="810.0" y="167" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2</text>
  <rect x="850" y="138" width="80" height="44" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="890.0" y="167" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2</text>
  <text x="815.0" y="212" font-size="14" fill="#6a994e" text-anchor="middle" font-weight="bold">unique β</text>
  <text x="815.0" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">batch and treatment separate</text>
  <text x="815.0" y="250" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">cleanly; each batch contains</text>
  <text x="815.0" y="268" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal">both treatments</text>
  <text x="500.0" y="304" font-size="13" fill="#5b6b7a" text-anchor="middle" font-weight="normal">Numbers = samples in each treatment × batch cell (8 samples, design ~ batch + treatment).</text>
</svg>
