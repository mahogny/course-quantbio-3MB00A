<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- time after treatment: factor (one mean per time point) vs continuous (one slope) -->
  <!-- axes: x = 80 + 20*h, y = 330 - 22*v -->
  <line x1="80" y1="330" x2="580" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="80" y1="40" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <line x1="80" y1="330" x2="80" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="80" y="352">0</text>
    <line x1="200" y1="330" x2="200" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="200" y="352">6</text>
    <line x1="320" y1="330" x2="320" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="320" y="352">12</text>
    <line x1="440" y1="330" x2="440" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="440" y="352">18</text>
    <line x1="560" y1="330" x2="560" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="560" y="352">24</text>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <line x1="74" y1="330" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="335">0</text>
    <line x1="74" y1="242" x2="80" y2="242" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="247">4</text>
    <line x1="74" y1="154" x2="80" y2="154" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="159">8</text>
    <line x1="74" y1="66" x2="80" y2="66" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="71">12</text>
  </g>
  <text x="330" y="378" font-size="14" fill="#1b2a3a" text-anchor="middle">hours after treatment</text>
  <text x="30" y="185" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 30 185)">expression</text>

  <!-- continuous model: least-squares line through the six points -->
  <line x1="80" y1="188.8" x2="560" y2="158.2" stroke="#2a6f97" stroke-width="2.4"/>

  <!-- factor model: one mean per time point (green bars) -->
  <g stroke="#6a994e" stroke-width="4" stroke-linecap="round">
    <line x1="84" y1="242" x2="112" y2="242"/>
    <line x1="184" y1="110" x2="216" y2="110"/>
    <line x1="544" y1="176" x2="576" y2="176"/>
  </g>
  <!-- data: two samples per time point -->
  <g fill="#1b2a3a">
    <circle cx="80" cy="253" r="4.5"/><circle cx="80" cy="231" r="4.5"/>
    <circle cx="200" cy="121" r="4.5"/><circle cx="200" cy="99" r="4.5"/>
    <circle cx="560" cy="187" r="4.5"/><circle cx="560" cy="165" r="4.5"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#6a994e">
    <text x="120" y="247">4</text>
    <text x="224" y="115">10</text>
    <text x="536" y="181" text-anchor="end">7</text>
  </g>

  <!-- legend / explanation column -->
  <g font-size="14" fill="#1b2a3a">
    <line x1="612" y1="80" x2="644" y2="80" stroke="#6a994e" stroke-width="4" stroke-linecap="round"/>
    <text x="654" y="85" font-weight="bold" fill="#6a994e">time as a factor</text>
    <text x="654" y="105">~ time  (0h, 6h, 24h)</text>
    <text x="654" y="125">3 columns: (Intercept),</text>
    <text x="654" y="145">time6h, time24h</text>
    <text x="654" y="165">→ any shape: rise, then fall</text>

    <line x1="612" y1="215" x2="644" y2="215" stroke="#2a6f97" stroke-width="2.4"/>
    <text x="654" y="220" font-weight="bold" fill="#2a6f97">time as a number</text>
    <text x="654" y="240">~ hours  (0, 6, 24)</text>
    <text x="654" y="260">2 columns: (Intercept),</text>
    <text x="654" y="280">hours</text>
    <text x="654" y="300">→ one straight line only</text>
  </g>
</svg>
