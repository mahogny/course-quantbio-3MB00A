<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <!-- treatment x sex with interaction: four group means, and where the interaction sits -->
  <!-- axes: y = 330 - 32*(v - 4) -->
  <defs>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/></marker>
  </defs>

  <line x1="80" y1="330" x2="560" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <g font-size="16" fill="#1b2a3a" text-anchor="end">
    <line x1="74" y1="298" x2="80" y2="298" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="303">5</text>
    <line x1="74" y1="234" x2="80" y2="234" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="239">7</text>
    <line x1="74" y1="170" x2="80" y2="170" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="175">9</text>
    <line x1="74" y1="106" x2="80" y2="106" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="111">11</text>
  </g>
  <text x="32" y="190" font-size="17.5" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 32 190)">expression</text>
  <g font-size="19" fill="#1b2a3a" text-anchor="middle">
    <text x="200" y="356">ctrl</text>
    <text x="440" y="356">treat</text>
  </g>

  <!-- legend -->
  <circle cx="104" cy="62" r="6" fill="#2a6f97"/><text x="116" y="68" font-size="17" fill="#2a6f97">female</text>
  <circle cx="104" cy="88" r="6" fill="#6a994e"/><text x="116" y="94" font-size="17" fill="#6a994e">male</text>

  <!-- lines through the group means -->
  <line x1="165" y1="298" x2="405" y2="234" stroke="#2a6f97" stroke-width="2.2"/>
  <line x1="235" y1="266" x2="475" y2="106" stroke="#6a994e" stroke-width="2.2"/>
  <!-- male line if there were no interaction: parallel to the female line -->
  <line x1="235" y1="266" x2="475" y2="202" stroke="#6a994e" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- data points -->
  <g fill="#2a6f97" fill-opacity="0.45" stroke="#2a6f97" stroke-width="1">
    <circle cx="157" cy="310.8" r="5"/><circle cx="171" cy="282" r="5"/><circle cx="161" cy="304.4" r="5"/><circle cx="173" cy="294.8" r="5"/>
    <circle cx="397" cy="250" r="5"/><circle cx="411" cy="214.8" r="5"/><circle cx="401" cy="240.4" r="5"/><circle cx="413" cy="230.8" r="5"/>
  </g>
  <g fill="#6a994e" fill-opacity="0.45" stroke="#6a994e" stroke-width="1">
    <circle cx="227" cy="282" r="5"/><circle cx="241" cy="246.8" r="5"/><circle cx="231" cy="272.4" r="5"/><circle cx="243" cy="262.8" r="5"/>
    <circle cx="467" cy="125.2" r="5"/><circle cx="481" cy="83.6" r="5"/><circle cx="471" cy="112.4" r="5"/><circle cx="483" cy="102.8" r="5"/>
  </g>

  <!-- group means -->
  <g stroke-width="4" stroke-linecap="round">
    <line x1="147" y1="298" x2="183" y2="298" stroke="#2a6f97"/>
    <line x1="387" y1="234" x2="423" y2="234" stroke="#2a6f97"/>
    <line x1="217" y1="266" x2="253" y2="266" stroke="#6a994e"/>
    <line x1="457" y1="106" x2="493" y2="106" stroke="#6a994e"/>
  </g>
  <g font-size="15" fill="#5b6b7a">
    <text x="141" y="303" text-anchor="end">5</text>
    <text x="381" y="239" text-anchor="end">7</text>
    <text x="259" y="271">6</text>
    <text x="451" y="96" text-anchor="end">11</text>
  </g>

  <!-- treatment effect in each sex -->
  <text x="290" y="306" font-size="17" fill="#2a6f97" font-weight="bold">+2</text>
  <text x="318" y="190" font-size="17" fill="#6a994e" font-weight="bold">+5</text>

  <!-- where treated males would be without interaction -->
  <circle cx="475" cy="202" r="7" fill="#ffffff" stroke="#6a994e" stroke-width="2.2"/>
  <line x1="483" y1="202" x2="515" y2="202" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="493" y1="106" x2="515" y2="106" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="530" y="224" font-size="15" fill="#5b6b7a">no interaction:</text>
  <text x="530" y="243" font-size="15" fill="#5b6b7a">6 + 2 = 8</text>

  <!-- the interaction coefficient -->
  <line x1="510" y1="202" x2="510" y2="109" stroke="#bc4749" stroke-width="2.8" marker-end="url(#ah-r)"/>
  <text x="522" y="150" font-size="19" fill="#bc4749" font-weight="bold">interaction</text>
  <text x="522" y="173" font-size="19" fill="#bc4749" font-weight="bold">= 11 − 8 = +3</text>
</svg>
