<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- a typical time course: two genes after a stimulus; one linear in time, one transient peak -->
  <!-- axes per panel: x = x0 + 13*h, y = 330 - 22*v -->
  <g><!-- gene A: steady rise -->
    <text x="236" y="30" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">gene A: steady rise</text>
    <line x1="80" y1="330" x2="404" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="80" y1="50" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
    <g font-size="13" fill="#1b2a3a" text-anchor="middle">
      <line x1="80" y1="330" x2="80" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="80" y="352">0</text>
      <line x1="158" y1="330" x2="158" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="158" y="352">6</text>
      <line x1="236" y1="330" x2="236" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="236" y="352">12</text>
      <line x1="314" y1="330" x2="314" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="314" y="352">18</text>
      <line x1="392" y1="330" x2="392" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="392" y="352">24</text>
    </g>
    <g font-size="13" fill="#1b2a3a" text-anchor="end">
      <line x1="74" y1="330" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="335">0</text>
      <line x1="74" y1="242" x2="80" y2="242" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="247">4</text>
      <line x1="74" y1="154" x2="80" y2="154" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="159">8</text>
      <line x1="74" y1="66" x2="80" y2="66" stroke="#1b2a3a" stroke-width="1.5"/><text x="68" y="71">12</text>
    </g>
    <text x="236" y="374" font-size="14" fill="#1b2a3a" text-anchor="middle">hours after stimulus</text>
    <text x="30" y="190" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 30 190)">expression</text>
    <line x1="80" y1="284.7" x2="392" y2="112.2" stroke="#2a6f97" stroke-width="2.4"/>
    <g fill="#1b2a3a"><circle cx="80" cy="286" r="4.5"/><circle cx="158" cy="235.4" r="4.5"/><circle cx="236" cy="206.8" r="4.5"/><circle cx="314" cy="151.8" r="4.5"/><circle cx="392" cy="112.2" r="4.5"/></g>
    <text x="236" y="395" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="middle">slope fits: one number, +0.33 per hour</text>
  </g>
  <g><!-- gene B: transient peak -->
    <text x="676" y="30" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">gene B: transient peak</text>
    <line x1="520" y1="330" x2="844" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="520" y1="50" x2="520" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
    <g font-size="13" fill="#1b2a3a" text-anchor="middle">
      <line x1="520" y1="330" x2="520" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="520" y="352">0</text>
      <line x1="598" y1="330" x2="598" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="598" y="352">6</text>
      <line x1="676" y1="330" x2="676" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="676" y="352">12</text>
      <line x1="754" y1="330" x2="754" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="754" y="352">18</text>
      <line x1="832" y1="330" x2="832" y2="336" stroke="#1b2a3a" stroke-width="1.5"/><text x="832" y="352">24</text>
    </g>
    <g font-size="13" fill="#1b2a3a" text-anchor="end">
      <line x1="514" y1="330" x2="520" y2="330" stroke="#1b2a3a" stroke-width="1.5"/><text x="508" y="335">0</text>
      <line x1="514" y1="242" x2="520" y2="242" stroke="#1b2a3a" stroke-width="1.5"/><text x="508" y="247">4</text>
      <line x1="514" y1="154" x2="520" y2="154" stroke="#1b2a3a" stroke-width="1.5"/><text x="508" y="159">8</text>
      <line x1="514" y1="66" x2="520" y2="66" stroke="#1b2a3a" stroke-width="1.5"/><text x="508" y="71">12</text>
    </g>
    <text x="676" y="374" font-size="14" fill="#1b2a3a" text-anchor="middle">hours after stimulus</text>
    <polyline points="520,264 598,110 676,187 754,237.6 832,253" fill="none" stroke="#6a994e" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="520" y1="189.2" x2="832" y2="231.4" stroke="#2a6f97" stroke-width="2.4"/>
    <g fill="#1b2a3a"><circle cx="520" cy="264" r="4.5"/><circle cx="598" cy="110" r="4.5"/><circle cx="676" cy="187" r="4.5"/><circle cx="754" cy="237.6" r="4.5"/><circle cx="832" cy="253" r="4.5"/></g>
    <text x="676" y="395" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="middle">slope ≈ 0: the peak at 6 h is missed</text>
  </g>
  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <line x1="700" y1="62" x2="728" y2="62" stroke="#2a6f97" stroke-width="2.4"/><text x="736" y="67">time as a number (slope)</text>
    <line x1="700" y1="84" x2="728" y2="84" stroke="#6a994e" stroke-width="2" stroke-dasharray="6 4"/><text x="736" y="89">follows each time point</text>
  </g>
</svg>
