<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.0 13.1 677.0 397.0" width="677.0" height="397.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="70" y1="40" x2="70" y2="330" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="70" y1="330" x2="650" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text transform="translate(26,238) rotate(-90)" font-size="16" fill="#1b2a3a">log-likelihood</text>
  <text x="360" y="360" text-anchor="middle" font-size="16" fill="#1b2a3a">parameters θ</text>

  <!-- Likelihood landscape: two peaks, lower-left local, higher-right global -->
  <path d="M70,300
           C130,300 160,250 200,175
           C230,120 250,120 280,175
           C310,235 330,255 360,250
           C395,244 410,190 440,120
           C470,55 500,55 530,120
           C560,185 590,240 650,270"
        fill="none" stroke="#2a6f97" stroke-width="2.5"/>

  <!-- peak reference dashed lines -->
  <line x1="240" y1="115" x2="240" y2="330" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="485" y1="52" x2="485" y2="330" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="240" y="105" text-anchor="middle" font-size="13" fill="#bc4749">local peak</text>
  <text x="485" y="42" text-anchor="middle" font-size="13" fill="#6a994e">global peak</text>

  <!-- Init A: ball on left slope climbing to local optimum -->
  <path d="M130,290 C150,270 175,235 205,180" fill="none" stroke="#bc4749" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <circle cx="128" cy="292" r="8" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="240" cy="120" r="7" fill="#fbe3e3" stroke="#bc4749" stroke-width="2"/>
  <text x="120" y="315" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">init A</text>
  <text x="150" y="150" font-size="13" fill="#bc4749">init A → local optimum</text>

  <!-- Init B: ball nearer right slope climbing to global peak -->
  <path d="M410,175 C430,145 455,105 480,62" fill="none" stroke="#6a994e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <circle cx="408" cy="178" r="8" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="485" cy="57" r="7" fill="#e6efdd" stroke="#6a994e" stroke-width="2"/>
  <text x="418" y="200" text-anchor="middle" font-size="14" fill="#6a994e" font-weight="bold">init B</text>
  <text x="500" y="90" font-size="13" fill="#6a994e">init B → global optimum</text>

  <!-- Caption -->
  <text x="340" y="388" text-anchor="middle" font-size="14" fill="#1b2a3a">EM climbs to the nearest peak, not the global one → run several inits, keep the best likelihood</text>
</svg>
