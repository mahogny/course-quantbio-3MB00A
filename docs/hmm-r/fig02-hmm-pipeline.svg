<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13.2 16.9 906.3 369.1" width="906.3" height="369.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== Node 1: initHMM (the model) ===== -->
  <rect x="14" y="86" width="210" height="200" rx="12" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="119" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a6f97">initHMM</text>
  <text x="119" y="128" text-anchor="middle" font-size="12" fill="#1b2a3a">the model λ = (A, B, π)</text>
  <line x1="30" y1="138" x2="208" y2="138" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="30" y="160" font-size="13" fill="#1b2a3a">hidden states {H, L}</text>
  <text x="30" y="185" font-size="13" fill="#1b2a3a">transition matrix A</text>
  <text x="30" y="210" font-size="13" fill="#1b2a3a">emission matrix B</text>
  <text x="30" y="235" font-size="13" fill="#1b2a3a">initial distribution π</text>
  <text x="119" y="272" text-anchor="middle" font-size="11" fill="#6a994e" font-weight="bold">four ingredients</text>

  <!-- arrow init -> sim -->
  <line x1="224" y1="186" x2="270" y2="186" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Node 2: simHMM (two outputs) ===== -->
  <rect x="270" y="120" width="170" height="132" rx="12" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="355" y="144" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a6f97">simHMM</text>
  <text x="355" y="161" text-anchor="middle" font-size="11" fill="#1b2a3a">draw a sequence</text>
  <!-- chip: observations -->
  <rect x="286" y="172" width="138" height="30" rx="6" fill="#ffffff" stroke="#6a994e" stroke-width="1.8"/>
  <text x="300" y="191" text-anchor="start" font-size="12" fill="#1b2a3a">observations x</text>
  <text x="381" y="191" text-anchor="start" font-size="12" fill="#6a994e" font-weight="bold">(data)</text>
  <!-- chip: true states -->
  <rect x="286" y="208" width="138" height="30" rx="6" fill="#ffffff" stroke="#bc4749" stroke-width="1.8"/>
  <text x="300" y="227" text-anchor="start" font-size="12" fill="#1b2a3a">true states z</text>
  <text x="373" y="227" text-anchor="start" font-size="12" fill="#bc4749" font-weight="bold">(hidden)</text>

  <!-- fan-out from observations chip (start at box edge so shafts do not cross the box border) -->
  <line x1="440" y1="187" x2="484" y2="74"  stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="187" x2="484" y2="186" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="187" x2="484" y2="298" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="459" y="160" font-size="12" fill="#6a994e" font-style="italic">x</text>

  <!-- ===== Three task rows ===== -->

  <!-- (a) LIKELIHOOD -->
  <rect x="484" y="44" width="190" height="60" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="579" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">forward (&amp; backward)</text>
  <text x="579" y="90" text-anchor="middle" font-size="12" fill="#1b2a3a">score the model</text>
  <line x1="674" y1="74" x2="716" y2="74" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="716" y="52" width="150" height="44" rx="8" fill="#ffffff" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="791" y="72" text-anchor="middle" font-size="14" fill="#1b2a3a">likelihood P(x)</text>
  <text x="791" y="88" text-anchor="middle" font-size="10" letter-spacing="2" fill="#2a6f97" font-weight="bold">LIKELIHOOD</text>

  <!-- (b) DECODING -->
  <rect x="484" y="156" width="190" height="60" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="579" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">viterbi</text>
  <text x="579" y="202" text-anchor="middle" font-size="12" fill="#1b2a3a">most-likely state path</text>
  <line x1="674" y1="186" x2="716" y2="186" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="716" y="164" width="150" height="44" rx="8" fill="#ffffff" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="791" y="184" text-anchor="middle" font-size="14" fill="#1b2a3a">best path z*</text>
  <text x="791" y="200" text-anchor="middle" font-size="10" letter-spacing="2" fill="#2a6f97" font-weight="bold">DECODING</text>

  <!-- (c) LEARNING -->
  <rect x="484" y="268" width="190" height="60" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="579" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">baumWelch</text>
  <text x="579" y="314" text-anchor="middle" font-size="12" fill="#1b2a3a">fit params to data</text>
  <line x1="674" y1="298" x2="716" y2="298" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="716" y="276" width="150" height="44" rx="8" fill="#ffffff" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="791" y="296" text-anchor="middle" font-size="14" fill="#1b2a3a">learn A, B, π</text>
  <text x="791" y="312" text-anchor="middle" font-size="10" letter-spacing="2" fill="#2a6f97" font-weight="bold">LEARNING</text>

  <!-- footer roadmap label -->
  <text x="440" y="356" text-anchor="middle" font-size="12" fill="#1b2a3a" font-style="italic">model  →  simulated data  →  the three inference problems</text>
</svg>
