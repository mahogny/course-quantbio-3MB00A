<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 31 847 354" width="847" height="354" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ================= TOP ROW: hidden path ================= -->
  <!-- shaded "hidden" band -->
  <rect x="70" y="70" width="640" height="90" rx="10" fill="#eef2f5" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="78" y="60" font-size="16" font-weight="bold" fill="#1b2a3a">hidden path z</text>
  <text x="205" y="60" font-size="14" fill="#8494a3" font-style="italic">(normally unknown)</text>

  <!-- transition arrows between circles (sampled from A) -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="147" y1="115" x2="223" y2="115"/>
    <line x1="277" y1="115" x2="353" y2="115"/>
    <line x1="407" y1="115" x2="483" y2="115"/>
    <line x1="537" y1="115" x2="613" y2="115"/>
  </g>
  <text x="380" y="82" font-size="13" fill="#1b2a3a" text-anchor="middle">transitions sampled from A</text>

  <!-- hidden-state circles -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <circle cx="120" cy="115" r="27" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="120" y="122" fill="#1b2a3a">H</text>
    <circle cx="250" cy="115" r="27" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="250" y="122" fill="#1b2a3a">H</text>
    <circle cx="380" cy="115" r="27" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="380" y="122" fill="#1b2a3a">H</text>
    <circle cx="510" cy="115" r="27" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="510" y="122" fill="#1b2a3a">H</text>
    <circle cx="640" cy="115" r="27" fill="#fbeceb" stroke="#bc4749" stroke-width="2.5"/>
    <text x="640" y="122" fill="#bc4749">L</text>
  </g>

  <!-- ================= emission arrows (state emits base via B) ================= -->
  <g stroke="#2a6f97" stroke-width="2" fill="none" marker-end="url(#arrowBlue)">
    <line x1="120" y1="144" x2="120" y2="243"/>
    <line x1="250" y1="144" x2="250" y2="243"/>
    <line x1="380" y1="144" x2="380" y2="243"/>
    <line x1="510" y1="144" x2="510" y2="243"/>
  </g>
  <!-- last emission in red to match L switch -->
  <line x1="640" y1="144" x2="640" y2="243" stroke="#bc4749" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="686" y="197" font-size="13" fill="#2a6f97">emit via B</text>

  <!-- ================= BOTTOM ROW: observed bases ================= -->
  <text x="78" y="315" font-size="16" font-weight="bold" fill="#6a994e">observed bases x</text>
  <text x="215" y="315" font-size="14" fill="#6a994e" font-style="italic">(your data)</text>

  <g font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="95" y="245" width="50" height="50" rx="6" fill="#eef6ea" stroke="#6a994e" stroke-width="2"/>
    <text x="120" y="278" fill="#1b2a3a">G</text>
    <rect x="225" y="245" width="50" height="50" rx="6" fill="#eef6ea" stroke="#6a994e" stroke-width="2"/>
    <text x="250" y="278" fill="#1b2a3a">C</text>
    <rect x="355" y="245" width="50" height="50" rx="6" fill="#eef6ea" stroke="#6a994e" stroke-width="2"/>
    <text x="380" y="278" fill="#1b2a3a">C</text>
    <rect x="485" y="245" width="50" height="50" rx="6" fill="#eef6ea" stroke="#6a994e" stroke-width="2"/>
    <text x="510" y="278" fill="#1b2a3a">G</text>
    <rect x="615" y="245" width="50" height="50" rx="6" fill="#eef6ea" stroke="#6a994e" stroke-width="2"/>
    <text x="640" y="278" fill="#1b2a3a">A</text>
  </g>

  <!-- position index -->
  <g font-size="12" fill="#8494a3" text-anchor="middle">
    <text x="120" y="335">pos 1</text>
    <text x="250" y="335">pos 2</text>
    <text x="380" y="335">pos 3</text>
    <text x="510" y="335">pos 4</text>
    <text x="640" y="335">pos 5</text>
  </g>

  <!-- ================= switch caption at position 5 ================= -->
  <path d="M735 95 Q698 132 662 100" stroke="#bc4749" stroke-width="1.8" fill="none" marker-end="url(#arrowRed)"/>
  <text x="716" y="86" font-size="13" font-weight="bold" fill="#bc4749">pos 5: state switches H &#8594; L</text>

  <!-- ================= observed vs hidden legend ================= -->
  <text y="365" font-size="13" fill="#1b2a3a" text-anchor="start"><tspan x="112">Only the </tspan><tspan x="166" fill="#6a994e" font-weight="bold">bottom row (bases)</tspan><tspan x="288"> is observed &#8212; the </tspan><tspan x="404" fill="#2a6f97" font-weight="bold">top row (states)</tspan><tspan x="502"> is hidden ground truth.</tspan></text>
</svg>
