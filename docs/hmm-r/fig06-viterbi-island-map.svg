<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 8 746 380" width="746" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#1b2a3a">Viterbi decoding: runs of H = predicted CpG islands</text>

  <!-- ==== geometry: 9 positions ==== -->
  <!-- x centers: pos i center = 70 + (i-1)*68 ; cell width 60 -->

  <!-- shaded island blocks (H runs) behind the axis -->
  <!-- run1: pos1-4 -->
  <rect x="42" y="60" width="272" height="120" rx="8" fill="#f6e5e5" stroke="#bc4749" stroke-width="1.5"/>
  <!-- background gap L: pos5-7 -->
  <rect x="314" y="60" width="204" height="120" rx="8" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- run2: pos8-9 -->
  <rect x="518" y="60" width="136" height="120" rx="8" fill="#f6e5e5" stroke="#bc4749" stroke-width="1.5"/>

  <text x="178" y="76" font-size="12.5" text-anchor="middle" fill="#bc4749" font-weight="bold">predicted CpG island</text>
  <text x="416" y="76" font-size="12.5" text-anchor="middle" fill="#9aa7b3">background</text>
  <text x="586" y="76" font-size="12.5" text-anchor="middle" fill="#bc4749" font-weight="bold">predicted CpG island</text>

  <!-- genomic axis -->
  <line x1="42" y1="130" x2="678" y2="130" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="594" y="197" font-size="12" fill="#1b2a3a">genomic position</text>

  <!-- tick marks, position numbers, decoded state labels -->
  <!-- pos 1 -->
  <g font-size="15" text-anchor="middle">
    <!-- position ticks -->
    <line x1="70" y1="124" x2="70" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="138" y1="124" x2="138" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="206" y1="124" x2="206" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="274" y1="124" x2="274" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="342" y1="124" x2="342" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="410" y1="124" x2="410" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="478" y1="124" x2="478" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="546" y1="124" x2="546" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="614" y1="124" x2="614" y2="136" stroke="#1b2a3a" stroke-width="2"/>
    <!-- position numbers below axis -->
    <text x="70"  y="152" fill="#5a6b7a" font-size="12">1</text>
    <text x="138" y="152" fill="#5a6b7a" font-size="12">2</text>
    <text x="206" y="152" fill="#5a6b7a" font-size="12">3</text>
    <text x="274" y="152" fill="#5a6b7a" font-size="12">4</text>
    <text x="342" y="152" fill="#5a6b7a" font-size="12">5</text>
    <text x="410" y="152" fill="#5a6b7a" font-size="12">6</text>
    <text x="478" y="152" fill="#5a6b7a" font-size="12">7</text>
    <text x="546" y="152" fill="#5a6b7a" font-size="12">8</text>
    <text x="614" y="152" fill="#5a6b7a" font-size="12">9</text>
  </g>

  <!-- decoded state label row (Viterbi path) -->
  <text x="36" y="112" font-size="12.5" text-anchor="end" fill="#1b2a3a">decoded path</text>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="70"  y="108" fill="#bc4749">H</text>
    <text x="138" y="108" fill="#bc4749">H</text>
    <text x="206" y="108" fill="#bc4749">H</text>
    <text x="274" y="108" fill="#bc4749">H</text>
    <text x="342" y="108" fill="#2a6f97">L</text>
    <text x="410" y="108" fill="#2a6f97">L</text>
    <text x="478" y="108" fill="#2a6f97">L</text>
    <text x="546" y="108" fill="#bc4749">H</text>
    <text x="614" y="108" fill="#bc4749">H</text>
  </g>

  <!-- ==== rle segmentation bar ==== -->
  <text x="36" y="265" font-size="13" text-anchor="end" fill="#1b2a3a" font-weight="bold">rle(path)</text>

  <!-- segment 1: H length 4 (pos1-4) -->
  <rect x="42" y="240" width="272" height="42" rx="5" fill="#f6e5e5" stroke="#bc4749" stroke-width="2"/>
  <text x="178" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#bc4749">H</text>
  <text x="178" y="278" font-size="12" text-anchor="middle" fill="#8a5052">len = 4</text>

  <!-- segment 2: L length 3 (pos5-7) -->
  <rect x="314" y="240" width="204" height="42" rx="5" fill="#e6eef4" stroke="#2a6f97" stroke-width="2"/>
  <text x="416" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#2a6f97">L</text>
  <text x="416" y="278" font-size="12" text-anchor="middle" fill="#3f6a86">len = 3</text>

  <!-- segment 3: H length 2 (pos8-9) -->
  <rect x="518" y="240" width="136" height="42" rx="5" fill="#f6e5e5" stroke="#bc4749" stroke-width="2"/>
  <text x="586" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#bc4749">H</text>
  <text x="586" y="278" font-size="12" text-anchor="middle" fill="#8a5052">len = 2</text>

  <!-- connectors from island blocks to rle segments -->
  <line x1="178" y1="181" x2="178" y2="238" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="416" y1="181" x2="416" y2="238" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="586" y1="181" x2="586" y2="238" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- readout callouts -->
  <path d="M178,282 L196,304" stroke="#6a994e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <path d="M586,282 L566,304" stroke="#6a994e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="382" y="316" font-size="13.5" text-anchor="middle" fill="#6a994e" font-weight="bold">two H-runs reported as CpG islands (positions 1–4 and 8–9)</text>

  <!-- accuracy tag -->
  <rect x="42" y="340" width="330" height="34" rx="17" fill="#eef4ea" stroke="#6a994e" stroke-width="1.5"/>
  <text x="60" y="362" font-size="13.5" fill="#3f6a2e">accuracy = mean(path == true) ≈ 0.87</text>
</svg>
