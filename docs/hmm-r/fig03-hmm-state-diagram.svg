<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.6 -6.1 671.5 409.2" width="671.5" height="409.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== TRANSITIONS (matrix A) ===================== -->
  <!-- start arrow splitting to both states (pi) -->
  <circle cx="60" cy="120" r="5" fill="#1b2a3a"/>
  <text x="60" y="106" font-size="14" fill="#1b2a3a" text-anchor="middle">start</text>
  <path d="M65,120 C120,80 150,72 200,88" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M65,122 C260,220 400,180 500,138" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="150" y="70" font-size="14" fill="#2a6f97" text-anchor="middle">π = 0.5</text>
  <text x="300" y="205" font-size="14" fill="#2a6f97" text-anchor="middle">π = 0.5</text>

  <!-- H state -->
  <circle cx="270" cy="130" r="62" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="270" y="126" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">H</text>
  <text x="270" y="148" font-size="13" fill="#1b2a3a" text-anchor="middle">(GC-rich)</text>

  <!-- L state -->
  <circle cx="590" cy="130" r="62" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="590" y="126" font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">L</text>
  <text x="590" y="148" font-size="13" fill="#1b2a3a" text-anchor="middle">(normal)</text>

  <!-- self-loop H (top) -->
  <path d="M235,88 C205,30 335,30 305,88" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="270" y="34" font-size="16" fill="#1b2a3a" text-anchor="middle">0.8</text>

  <!-- self-loop L (top) -->
  <path d="M555,88 C525,30 655,30 625,88" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="590" y="34" font-size="16" fill="#1b2a3a" text-anchor="middle">0.7</text>

  <!-- H -> L (upper curve) -->
  <path d="M330,110 C400,80 460,80 530,110" fill="none" stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="430" y="80" font-size="16" fill="#2a6f97" text-anchor="middle">0.2</text>

  <!-- L -> H (lower curve) -->
  <path d="M530,150 C460,180 400,180 330,150" fill="none" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="430" y="196" font-size="16" fill="#bc4749" text-anchor="middle">0.3</text>

  <text x="430" y="24" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">transition matrix A  (rows sum to 1)</text>

  <!-- ===================== EMISSIONS (matrix B) ===================== -->
  <text x="430" y="246" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">emission matrix B  (each distribution sums to 1)</text>

  <!-- H emission chart -->
  <!-- baseline y=370, chart scale: prob*220px -->
  <!-- axis -->
  <line x1="185" y1="370" x2="360" y2="370" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="185" y1="280" x2="185" y2="370" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- bars A=0.1 C=0.4 G=0.4 T=0.1 -->
  <rect x="195" y="348" width="30" height="22" fill="#2a6f97"/>
  <rect x="240" y="282" width="30" height="88" fill="#6a994e"/>
  <rect x="285" y="282" width="30" height="88" fill="#6a994e"/>
  <rect x="330" y="348" width="30" height="22" fill="#2a6f97"/>
  <text x="210" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">A</text>
  <text x="255" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">C</text>
  <text x="300" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">G</text>
  <text x="345" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">T</text>
  <text x="210" y="343" font-size="11" fill="#1b2a3a" text-anchor="middle">.1</text>
  <text x="255" y="277" font-size="11" fill="#1b2a3a" text-anchor="middle">.4</text>
  <text x="300" y="277" font-size="11" fill="#1b2a3a" text-anchor="middle">.4</text>
  <text x="345" y="343" font-size="11" fill="#1b2a3a" text-anchor="middle">.1</text>
  <text x="270" y="262" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">H emissions</text>

  <!-- L emission chart -->
  <line x1="505" y1="370" x2="680" y2="370" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="505" y1="280" x2="505" y2="370" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- bars A=0.3 C=0.2 G=0.2 T=0.3 -->
  <rect x="515" y="304" width="30" height="66" fill="#2a6f97"/>
  <rect x="560" y="326" width="30" height="44" fill="#6a994e"/>
  <rect x="605" y="326" width="30" height="44" fill="#6a994e"/>
  <rect x="650" y="304" width="30" height="66" fill="#2a6f97"/>
  <text x="530" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">A</text>
  <text x="575" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">C</text>
  <text x="620" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">G</text>
  <text x="665" y="384" font-size="13" fill="#1b2a3a" text-anchor="middle">T</text>
  <text x="530" y="299" font-size="11" fill="#1b2a3a" text-anchor="middle">.3</text>
  <text x="575" y="321" font-size="11" fill="#1b2a3a" text-anchor="middle">.2</text>
  <text x="620" y="321" font-size="11" fill="#1b2a3a" text-anchor="middle">.2</text>
  <text x="665" y="299" font-size="11" fill="#1b2a3a" text-anchor="middle">.3</text>
  <text x="590" y="262" font-size="13" font-weight="bold" fill="#1b2a3a" text-anchor="middle">L emissions</text>

  <!-- connectors state -> its emission chart -->
  <line x1="270" y1="192" x2="270" y2="262" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="590" y1="192" x2="590" y2="262" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
