<svg xmlns="http://www.w3.org/2000/svg" viewBox="49.3 18.7 548.2 387.4" width="548.2" height="387.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- plot frame -->
  <!-- axes: x from 90..470, y from 60..300 -->
  <line x1="90" y1="300" x2="500" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="300" x2="90" y2="50" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- x axis label -->
  <text x="280" y="335" font-size="15" fill="#1b2a3a" text-anchor="middle">number of hidden states</text>
  <!-- y axis label -->
  <text x="82" y="42" font-size="14" fill="#1b2a3a" text-anchor="middle">score</text>

  <!-- x ticks 1..5 mapped: 1->130, 2->205, 3->280, 4->355, 5->430 -->
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <line x1="130" y1="300" x2="130" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="205" y1="300" x2="205" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="280" y1="300" x2="280" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="355" y1="300" x2="355" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="430" y1="300" x2="430" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="130" y="320">1</text>
    <text x="205" y="320">2</text>
    <text x="280" y="320">3</text>
    <text x="355" y="320">4</text>
    <text x="430" y="320">5</text>
  </g>

  <!-- BIC minimum vertical dashed line at 2 states -->
  <line x1="205" y1="300" x2="205" y2="80" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Curve 1: training log-likelihood, monotonically increasing (blue) -->
  <polyline points="130,255 205,180 280,135 355,110 430,98" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
  <g fill="#2a6f97">
    <circle cx="130" cy="255" r="3.5"/>
    <circle cx="205" cy="180" r="3.5"/>
    <circle cx="280" cy="135" r="3.5"/>
    <circle cx="355" cy="110" r="3.5"/>
    <circle cx="430" cy="98" r="3.5"/>
  </g>

  <!-- Curve 2: AIC/BIC penalised, U-shaped, min at 2 (green) -->
  <polyline points="130,150 205,205 280,195 355,150 430,90" fill="none" stroke="#6a994e" stroke-width="2.5"/>
  <g fill="#6a994e">
    <circle cx="130" cy="150" r="3.5"/>
    <circle cx="280" cy="195" r="3.5"/>
    <circle cx="355" cy="150" r="3.5"/>
    <circle cx="430" cy="90" r="3.5"/>
  </g>

  <!-- star at BIC minimum (2 states) -->
  <path d="M205,205 l3.4,7 7.6,1.1 -5.5,5.4 1.3,7.6 -6.8,-3.6 -6.8,3.6 1.3,-7.6 -5.5,-5.4 7.6,-1.1 Z"
        fill="#bc4749" stroke="#bc4749" stroke-width="1" transform="translate(0,-8)"/>

  <!-- Curve 1 label -->
  <text x="440" y="92" font-size="14" fill="#2a6f97" font-weight="bold">training log-likelihood</text>
  <text x="440" y="110" font-size="12" fill="#2a6f97">likelihood always improves</text>
  <text x="440" y="126" font-size="12" fill="#2a6f97">→ cannot pick the number</text>

  <!-- Curve 2 label (moved clear of the dashed BIC line) -->
  <text x="300" y="222" font-size="14" fill="#6a994e" font-weight="bold">AIC / BIC (penalised)</text>
  <text x="300" y="243" font-size="12" fill="#6a994e">penalty picks a sweet spot</text>

  <!-- BIC min annotation -->
  <text x="205" y="72" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">BIC minimum</text>
  <text x="205" y="358" font-size="12.5" fill="#bc4749" text-anchor="middle">biology: island vs background = 2</text>

  <!-- bottom note -->
  <text x="90" y="388" font-size="12.5" fill="#1b2a3a">more states = more parameters = more data needed, more local optima</text>
</svg>
