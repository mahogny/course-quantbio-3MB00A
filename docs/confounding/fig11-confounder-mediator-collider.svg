<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6a994e"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c08a1e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/></marker>
  </defs>
  <text x="150" y="28" font-size="16" font-weight="bold" fill="#6a994e" text-anchor="middle">Confounder</text>
  <ellipse cx="150" cy="78" rx="62" ry="26" fill="#eaf1f7" stroke="#6a994e" stroke-width="2.5"/>
  <text x="150" y="83" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">age, sex</text>
  <rect x="18" y="160" width="100" height="40" rx="7" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="68" y="185" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">treatment</text>
  <rect x="182" y="160" width="100" height="40" rx="7" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="232" y="185" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">expression</text>
  <line x1="120" y1="180" x2="180" y2="180" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arb)"/>
  <line x1="120" y1="101" x2="80" y2="158" stroke="#6a994e" stroke-width="2.4" marker-end="url(#arg)"/>
  <line x1="180" y1="101" x2="220" y2="158" stroke="#6a994e" stroke-width="2.4" marker-end="url(#arg)"/>
  <text x="150" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle">causes both treatment and</text>
  <text x="150" y="250" font-size="13" fill="#1b2a3a" text-anchor="middle">outcome (measured before)</text>
  <rect x="20" y="268" width="260" height="34" rx="6" fill="#f7f9fb" stroke="#6a994e" stroke-width="1.5"/>
  <text x="150" y="290" font-size="13.5" font-weight="bold" fill="#6a994e" text-anchor="middle">ADJUST for it</text>
  <text x="450" y="28" font-size="16" font-weight="bold" fill="#c08a1e" text-anchor="middle">Mediator</text>
  <ellipse cx="450" cy="78" rx="62" ry="26" fill="#eaf1f7" stroke="#c08a1e" stroke-width="2.5"/>
  <text x="450" y="83" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">drug level</text>
  <rect x="318" y="160" width="100" height="40" rx="7" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="368" y="185" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">treatment</text>
  <rect x="482" y="160" width="100" height="40" rx="7" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="532" y="185" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">expression</text>
  <line x1="420" y1="180" x2="480" y2="180" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arb)"/>
  <line x1="380" y1="158" x2="420" y2="103" stroke="#c08a1e" stroke-width="2.4" marker-end="url(#ara)"/>
  <line x1="480" y1="101" x2="520" y2="158" stroke="#c08a1e" stroke-width="2.4" marker-end="url(#ara)"/>
  <text x="450" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle">lies on the path from</text>
  <text x="450" y="250" font-size="13" fill="#1b2a3a" text-anchor="middle">treatment to outcome</text>
  <rect x="320" y="268" width="260" height="34" rx="6" fill="#f7f9fb" stroke="#c08a1e" stroke-width="1.5"/>
  <text x="450" y="290" font-size="13.5" font-weight="bold" fill="#c08a1e" text-anchor="middle">do NOT adjust (total effect)</text>
  <text x="750" y="28" font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">Collider</text>
  <ellipse cx="750" cy="78" rx="62" ry="26" fill="#eaf1f7" stroke="#bc4749" stroke-width="2.5"/>
  <text x="750" y="83" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">side effects</text>
  <rect x="618" y="160" width="100" height="40" rx="7" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="668" y="185" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">treatment</text>
  <rect x="782" y="160" width="100" height="40" rx="7" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
  <text x="832" y="185" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">expression</text>
  <line x1="720" y1="180" x2="780" y2="180" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arb)"/>
  <line x1="680" y1="158" x2="720" y2="103" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arr)"/>
  <line x1="820" y1="158" x2="780" y2="103" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arr)"/>
  <text x="750" y="232" font-size="13" fill="#1b2a3a" text-anchor="middle">is caused by both</text>
  <text x="750" y="250" font-size="13" fill="#1b2a3a" text-anchor="middle">treatment and outcome</text>
  <rect x="620" y="268" width="260" height="34" rx="6" fill="#f7f9fb" stroke="#bc4749" stroke-width="1.5"/>
  <text x="750" y="290" font-size="13.5" font-weight="bold" fill="#bc4749" text-anchor="middle">do NOT adjust: creates bias</text>
  <line x1="300" y1="44" x2="300" y2="304" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="600" y1="44" x2="600" y2="304" stroke="#c9d3dd" stroke-width="1"/>
  <text x="450" y="324" font-size="12.5" fill="#5a6b7a" text-anchor="middle" font-style="italic">Blue arrow = the effect we want. Only the confounder adds a false association that adjustment removes.</text>
</svg>
