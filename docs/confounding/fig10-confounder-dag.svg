<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 42 560 358" width="560" height="358" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== Main DAG panel ===== -->
  
  <!-- age node (prominent common cause) -->
  <ellipse cx="300" cy="95" rx="66" ry="40" fill="#eaf1f7" stroke="#bc4749" stroke-width="3"/>
  <text x="300" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b2a3a">age</text>
  <text x="300" y="110" font-size="12" text-anchor="middle" fill="#7a5a5a">common cause</text>

  <!-- treatment group node -->
  <rect x="80" y="255" width="150" height="58" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="155" y="280" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">treatment</text>
  <text x="155" y="299" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">group</text>

  <!-- expression outcome node -->
  <rect x="370" y="255" width="160" height="58" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="450" y="280" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">expression</text>
  <text x="450" y="299" font-size="13" text-anchor="middle" fill="#1b2a3a">(outcome)</text>

  <!-- confounding arrows (red) -->
  <path d="M258 128 L169 255" fill="none" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <path d="M342 128 L436 255" fill="none" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <text x="300" y="200" font-size="13" font-weight="bold" text-anchor="middle" fill="#bc4749">confounding paths</text>
  <text x="300" y="217" font-size="12" text-anchor="middle" fill="#bc4749">age drives both</text>

  <!-- effect of interest (blue) -->
  <path d="M232 288 L369 288" fill="none" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <text x="298" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#2a6f97">effect of interest</text>

  <!-- caption -->
  <text x="30" y="372" font-size="12.5" fill="#1b2a3a">A confounder influences BOTH the predictor and the outcome;</text>
  <text x="30" y="390" font-size="12.5" fill="#1b2a3a">ignoring it biases the estimated treatment effect.</text>

</svg>
