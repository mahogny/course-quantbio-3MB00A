<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 408" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/>
    </marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6a994e"/>
    </marker>
    <linearGradient id="ageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f0f8"/>
      <stop offset="1" stop-color="#1b2a3a"/>
    </linearGradient>
  </defs>

  <!-- ============ LEFT PANEL : Ignoring age ============ -->
  <text x="220" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Ignoring age</text>

  <!-- axes -->
  <line x1="60" y1="70" x2="60" y2="295" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="60" y1="295" x2="380" y2="295" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="34" y="185" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90,34,185)">expression</text>
  <text x="160" y="313" text-anchor="middle" font-size="14" fill="#1b2a3a">control</text>
  <text x="300" y="313" text-anchor="middle" font-size="14" fill="#1b2a3a">treated</text>

  <!-- control points (low, neutral grey) -->
  <circle cx="150" cy="226" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="168" cy="247" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="158" cy="213" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="172" cy="233" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="148" cy="240" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="165" cy="222" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <!-- treated points (high, neutral grey) -->
  <circle cx="292" cy="130" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="308" cy="102" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="298" cy="118" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="312" cy="111" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="288" cy="134" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="305" cy="98" r="5" fill="#9aa7b3" stroke="#6b7a88" stroke-width="1"/>

  <!-- mean bars -->
  <line x1="138" y1="230" x2="182" y2="230" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="280" y1="116" x2="320" y2="116" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- big apparent gap : double arrow -->
  <line x1="228" y1="172" x2="228" y2="118" stroke="#bc4749" stroke-width="2" marker-end="url(#arRed)"/>
  <line x1="228" y1="174" x2="228" y2="228" stroke="#bc4749" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="240" y="169" font-size="13.5" fill="#bc4749">big apparent</text>
  <text x="240" y="185" font-size="13.5" fill="#bc4749">gap</text>

  <!-- ============ RIGHT PANEL : Accounting for age ============ -->
  <text x="630" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Accounting for age</text>

  <line x1="470" y1="70" x2="470" y2="295" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="470" y1="295" x2="790" y2="295" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="444" y="185" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90,444,185)">expression</text>
  <text x="570" y="313" text-anchor="middle" font-size="14" fill="#1b2a3a">control</text>
  <text x="710" y="313" text-anchor="middle" font-size="14" fill="#1b2a3a">treated</text>

  <!-- control points : mostly young (light) -->
  <circle cx="560" cy="226" r="5" fill="#e8f0f8" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="578" cy="247" r="5" fill="#d3e4f2" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="568" cy="213" r="5" fill="#c3dcef" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="582" cy="233" r="5" fill="#e8f0f8" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="558" cy="240" r="5" fill="#d3e4f2" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="575" cy="222" r="5" fill="#94bfdd" stroke="#6b7a88" stroke-width="1"/>
  <!-- treated points : mostly old (dark) -->
  <circle cx="702" cy="130" r="5" fill="#34618a" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="718" cy="102" r="5" fill="#1b2a3a" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="708" cy="118" r="5" fill="#274a6b" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="722" cy="111" r="5" fill="#1b2a3a" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="698" cy="134" r="5" fill="#5a97c2" stroke="#6b7a88" stroke-width="1"/>
  <circle cx="715" cy="98" r="5" fill="#1b2a3a" stroke="#6b7a88" stroke-width="1"/>

  <!-- age-matched reference bars (dashed) -->
  <line x1="588" y1="188" x2="622" y2="188" stroke="#6a994e" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="588" y1="152" x2="622" y2="152" stroke="#6a994e" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- shrunken gap : small double arrow -->
  <line x1="605" y1="169" x2="605" y2="153" stroke="#6a994e" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="605" y1="171" x2="605" y2="187" stroke="#6a994e" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="616" y="166" font-size="13" fill="#4d7238">gap shrinks once</text>
  <text x="616" y="182" font-size="13" fill="#4d7238">age is matched</text>

  <!-- age colour legend -->
  <text x="630" y="332" text-anchor="middle" font-size="13" fill="#1b2a3a">age:  young  →  old</text>
  <rect x="560" y="337" width="140" height="11" fill="url(#ageGrad)" stroke="#c9d3dd" stroke-width="1"/>

  <!-- ============ caption strip ============ -->
  <rect x="20" y="356" width="820" height="44" rx="4" fill="#eaf1f7"/>
  <text x="430" y="374" text-anchor="middle" font-size="13.5" fill="#1b2a3a">treatment and age are tangled — untangling estimates the effect</text>
  <text x="430" y="391" text-anchor="middle" font-size="13.5" fill="#1b2a3a">as if both groups had the same age distribution.</text>
</svg>
