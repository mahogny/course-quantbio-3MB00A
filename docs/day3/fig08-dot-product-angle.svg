<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Boxed key identity -->
  <rect x="230" y="18" width="300" height="46" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="380" y="47" text-anchor="middle" font-size="20" fill="#1b2a3a">u·v = ||u|| ||v|| cos(θ)</text>

  <!-- ================= Panel 1 : theta = 0 ================= -->
  <g transform="translate(30,110)">
    <rect x="0" y="0" width="210" height="210" rx="6" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- origin at (35,175) -->
    <!-- arrow v (blue) -->
    <line x1="35" y1="175" x2="175" y2="55" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahb)"/>
    <!-- arrow u (red), nearly overlapping, slightly shorter/rotated -->
    <line x1="35" y1="175" x2="160" y2="63" stroke="#bc4749" stroke-width="2" marker-end="url(#ahr)"/>
    <!-- small angle arc -->
    <path d="M 74 141 A 52 52 0 0 1 78 137" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="155" y="48" font-size="14" fill="#2a6f97">v</text>
    <text x="150" y="78" font-size="14" fill="#bc4749">u</text>
    <text x="105" y="35" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">θ = 0, cos = 1</text>
    <text x="105" y="200" text-anchor="middle" font-size="14" fill="#6a994e">u·v large &amp; positive</text>
  </g>

  <!-- ================= Panel 2 : theta = 90 ================= -->
  <g transform="translate(275,110)">
    <rect x="0" y="0" width="210" height="210" rx="6" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- origin at (35,175) -->
    <!-- arrow v (blue) horizontal -->
    <line x1="35" y1="175" x2="180" y2="175" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahb)"/>
    <!-- arrow u (red) vertical -->
    <line x1="35" y1="175" x2="35" y2="55" stroke="#bc4749" stroke-width="2" marker-end="url(#ahr)"/>
    <!-- right-angle square at origin -->
    <path d="M 35 155 L 55 155 L 55 175" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="185" y="180" font-size="14" fill="#2a6f97">v</text>
    <text x="24" y="52" font-size="14" fill="#bc4749">u</text>
    <text x="105" y="35" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">θ = 90°, cos = 0</text>
    <text x="105" y="200" text-anchor="middle" font-size="14" fill="#1b2a3a">u·v = 0</text>
  </g>

  <!-- ================= Panel 3 : theta = 180 ================= -->
  <g transform="translate(520,110)">
    <rect x="0" y="0" width="210" height="210" rx="6" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- origin at (105,115) center -->
    <!-- arrow v (blue) pointing right -->
    <line x1="105" y1="115" x2="185" y2="115" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahb)"/>
    <!-- arrow u (red) pointing left along same line -->
    <line x1="105" y1="115" x2="25" y2="115" stroke="#bc4749" stroke-width="2" marker-end="url(#ahr)"/>
    <!-- half-circle arc marking 180 deg -->
    <path d="M 155 115 A 50 50 0 0 1 55 115" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="180" y="108" font-size="14" fill="#2a6f97">v</text>
    <text x="28" y="108" font-size="14" fill="#bc4749">u</text>
    <text x="105" y="35" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">θ = 180°, cos = -1</text>
    <text x="105" y="200" text-anchor="middle" font-size="14" fill="#bc4749">u·v large &amp; negative</text>
  </g>
</svg>
