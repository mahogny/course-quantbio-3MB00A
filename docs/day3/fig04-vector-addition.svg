<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Plot geometry: origin at (60, 330), 45 px per unit, axes 0..6 -->
  <!-- Gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical gridlines x=0..6 -->
    <line x1="60"  y1="60" x2="60"  y2="330"/>
    <line x1="105" y1="60" x2="105" y2="330"/>
    <line x1="150" y1="60" x2="150" y2="330"/>
    <line x1="195" y1="60" x2="195" y2="330"/>
    <line x1="240" y1="60" x2="240" y2="330"/>
    <line x1="285" y1="60" x2="285" y2="330"/>
    <line x1="330" y1="60" x2="330" y2="330"/>
    <!-- horizontal gridlines y=0..6 -->
    <line x1="60" y1="330" x2="330" y2="330"/>
    <line x1="60" y1="285" x2="330" y2="285"/>
    <line x1="60" y1="240" x2="330" y2="240"/>
    <line x1="60" y1="195" x2="330" y2="195"/>
    <line x1="60" y1="150" x2="330" y2="150"/>
    <line x1="60" y1="105" x2="330" y2="105"/>
    <line x1="60" y1="60"  x2="330" y2="60"/>
  </g>

  <!-- Axes -->
  <g stroke="#1b2a3a" stroke-width="2">
    <line x1="60" y1="330" x2="345" y2="330" marker-end="url(#arrowDark)"/>
    <line x1="60" y1="330" x2="60"  y2="52"  marker-end="url(#arrowDark)"/>
  </g>

  <!-- Axis tick labels -->
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="60"  y="349">0</text>
    <text x="105" y="349">1</text>
    <text x="150" y="349">2</text>
    <text x="195" y="349">3</text>
    <text x="240" y="349">4</text>
    <text x="285" y="349">5</text>
    <text x="330" y="349">6</text>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="52" y="335">0</text>
    <text x="52" y="290">1</text>
    <text x="52" y="245">2</text>
    <text x="52" y="200">3</text>
    <text x="52" y="155">4</text>
    <text x="52" y="110">5</text>
    <text x="52" y="65">6</text>
  </g>
  <text x="345" y="349" fill="#1b2a3a" font-size="13" text-anchor="start">x</text>
  <text x="46" y="55" fill="#1b2a3a" font-size="13" text-anchor="middle">y</text>

  <!-- Faint parallelogram completing the figure -->
  <!-- origin(60,330) - a(195,240) - a+b(240,60) - b(105,150) -->
  <polygon points="60,330 195,240 240,60 105,150" fill="#eaf1f7" fill-opacity="0.55" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Arrow a: origin (0,0) -> (3,2)  = (60,330)->(195,240) -->
  <line x1="60" y1="330" x2="192" y2="242" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <text x="118" y="303" fill="#1b2a3a" font-size="15" font-weight="bold">a = (3,2)</text>

  <!-- Arrow b (tip-to-tail): (3,2) -> (4,6)  = (195,240)->(240,60) -->
  <line x1="195" y1="240" x2="238" y2="64" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="248" y="150" fill="#2a6f97" font-size="15" font-weight="bold">b = (1,4)</text>

  <!-- Resultant a+b: origin (0,0) -> (4,6) = (60,330)->(240,60) -->
  <line x1="60" y1="330" x2="236" y2="66" stroke="#bc4749" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <text x="78" y="150" fill="#bc4749" font-size="16" font-weight="bold" transform="rotate(-56 78 150)">a + b = (4,6)</text>

  <!-- Point marker at (4,6) -->
  <circle cx="240" cy="60" r="4.5" fill="#bc4749"/>
  <circle cx="195" cy="240" r="3.5" fill="#1b2a3a"/>
</svg>
