<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ TOP: matrix equation A x = b ============ -->

  <!-- Matrix A -->
  <!-- gene / column labels -->
  <text x="150" y="42" font-size="13" fill="#2a6f97" text-anchor="middle">tumour</text>
  <text x="205" y="42" font-size="13" fill="#bc4749" text-anchor="middle">immune</text>

  <!-- bracket -->
  <path d="M112 55 L104 55 L104 145 L112 145" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M243 55 L251 55 L251 145 L243 145" fill="none" stroke="#1b2a3a" stroke-width="2"/>

  <!-- column 1 (tumour) tint -->
  <rect x="122" y="60" width="56" height="80" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <!-- column 2 (immune) tint -->
  <rect x="178" y="60" width="56" height="80" fill="#f7ecec" stroke="#bc4749" stroke-width="1.5"/>

  <text x="150" y="88" font-size="20" fill="#2a6f97" text-anchor="middle">2</text>
  <text x="150" y="128" font-size="20" fill="#2a6f97" text-anchor="middle">1</text>
  <text x="206" y="88" font-size="20" fill="#bc4749" text-anchor="middle">1</text>
  <text x="206" y="128" font-size="20" fill="#bc4749" text-anchor="middle">3</text>

  <!-- gene row labels -->
  <text x="98" y="86" font-size="12" fill="#1b2a3a" text-anchor="end">gene 1</text>
  <text x="98" y="126" font-size="12" fill="#1b2a3a" text-anchor="end">gene 2</text>

  <text x="177" y="170" font-size="13" fill="#1b2a3a" text-anchor="middle" font-style="italic">A  (known signatures)</text>

  <!-- x vector -->
  <path d="M300 55 L292 55 L292 145 L300 145" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M345 55 L353 55 L353 145 L345 145" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="304" y="60" width="37" height="80" fill="#f2f5f8" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="322" y="90" font-size="18" fill="#1b2a3a" text-anchor="middle">x₁</text>
  <text x="322" y="128" font-size="18" fill="#1b2a3a" text-anchor="middle">x₂</text>
  <text x="322" y="100" font-size="0"></text>
  <text x="322" y="170" font-size="13" fill="#1b2a3a" text-anchor="middle" font-style="italic">x  fractions (unknown)</text>
  <text x="368" y="108" font-size="30" fill="#c9d3dd" text-anchor="middle">?</text>

  <!-- equals -->
  <text x="405" y="108" font-size="26" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- b vector as stacked bar -->
  <path d="M462 55 L454 55 L454 145 L462 145" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M505 55 L513 55 L513 145 L505 145" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="466" y="60" width="37" height="80" fill="#eef1ee" stroke="#6a994e" stroke-width="1.5"/>
  <text x="484" y="90" font-size="18" fill="#1b2a3a" text-anchor="middle">8</text>
  <text x="484" y="128" font-size="18" fill="#1b2a3a" text-anchor="middle">9</text>
  <text x="484" y="170" font-size="13" fill="#1b2a3a" text-anchor="middle" font-style="italic">b  measured bulk</text>

  <!-- x·A operator dot -->
  <text x="272" y="108" font-size="22" fill="#1b2a3a" text-anchor="middle">·</text>

  <!-- ============ RIGHT: mixing intuition as weighted sum ============ -->
  <!-- separator -->
  <line x1="560" y1="40" x2="560" y2="360" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="720" y="42" font-size="13" fill="#1b2a3a" text-anchor="middle" font-style="italic">bulk = ∑ (fraction × signature)</text>

  <!-- 3 x tumour -->
  <text x="590" y="98" font-size="18" fill="#1b2a3a" text-anchor="middle">3</text>
  <text x="612" y="98" font-size="18" fill="#1b2a3a" text-anchor="middle">·</text>
  <path d="M638 68 L630 68 L630 118 L638 118" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <path d="M672 68 L680 68 L680 118 L672 118" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <text x="655" y="88" font-size="16" fill="#2a6f97" text-anchor="middle">2</text>
  <text x="655" y="110" font-size="16" fill="#2a6f97" text-anchor="middle">1</text>
  <text x="655" y="138" font-size="11" fill="#2a6f97" text-anchor="middle">tumour</text>

  <text x="702" y="98" font-size="20" fill="#1b2a3a" text-anchor="middle">+</text>

  <!-- 2 x immune -->
  <text x="728" y="98" font-size="18" fill="#1b2a3a" text-anchor="middle">2</text>
  <text x="750" y="98" font-size="18" fill="#1b2a3a" text-anchor="middle">·</text>
  <path d="M776 68 L768 68 L768 118 L776 118" fill="none" stroke="#bc4749" stroke-width="2"/>
  <path d="M810 68 L818 68 L818 118 L810 118" fill="none" stroke="#bc4749" stroke-width="2"/>
  <text x="793" y="88" font-size="16" fill="#bc4749" text-anchor="middle">1</text>
  <text x="793" y="110" font-size="16" fill="#bc4749" text-anchor="middle">3</text>
  <text x="793" y="138" font-size="11" fill="#bc4749" text-anchor="middle">immune</text>

  <!-- arrow down to result -->
  <line x1="720" y1="160" x2="720" y2="205" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- weighted stacked bars visual: gene1 and gene2 -->
  <text x="628" y="238" font-size="12" fill="#1b2a3a" text-anchor="end">gene 1</text>
  <!-- gene1: tumour 3*2=6 blue, immune 2*1=2 red -> total 8 -->
  <rect x="636" y="228" width="120" height="16" fill="#2a6f97"/>
  <rect x="756" y="228" width="40" height="16" fill="#bc4749"/>
  <text x="806" y="241" font-size="14" fill="#1b2a3a">= 8</text>

  <text x="628" y="270" font-size="12" fill="#1b2a3a" text-anchor="end">gene 2</text>
  <!-- gene2: tumour 3*1=3 blue, immune 2*3=6 red -> total 9 -->
  <rect x="636" y="260" width="60" height="16" fill="#2a6f97"/>
  <rect x="696" y="260" width="120" height="16" fill="#bc4749"/>
  <text x="826" y="273" font-size="14" fill="#1b2a3a">= 9</text>

  <!-- scale hint -->
  <text x="720" y="300" font-size="11" fill="#1b2a3a" text-anchor="middle">bar length ∝ contribution to bulk</text>

  <!-- ============ CAPTION ============ -->
  <text x="440" y="382" font-size="14" fill="#1b2a3a" text-anchor="middle">Solve for the fractions x that mix the known signatures into the measured bulk.</text>
</svg>
