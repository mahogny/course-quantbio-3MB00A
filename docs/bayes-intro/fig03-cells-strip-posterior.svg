<svg xmlns="http://www.w3.org/2000/svg" width="578.1" height="405.5" viewBox="60.1 -2.4 578.1 405.5" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== TOP: strip of 20 cells, 6 positive ===== -->
  <text x="350" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">20 cells, 6 positive</text>

  <!-- row 1 -->
  <circle cx="260" cy="52" r="12" fill="#2a9d8f" stroke="#1f7a70" stroke-width="1.5"/>
  <circle cx="305" cy="52" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="350" cy="52" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="395" cy="52" r="12" fill="#2a9d8f" stroke="#1f7a70" stroke-width="1.5"/>
  <circle cx="440" cy="52" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <!-- row 2 -->
  <circle cx="260" cy="87" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="305" cy="87" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="350" cy="87" r="12" fill="#2a9d8f" stroke="#1f7a70" stroke-width="1.5"/>
  <circle cx="395" cy="87" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="440" cy="87" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <!-- row 3 -->
  <circle cx="260" cy="122" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="305" cy="122" r="12" fill="#2a9d8f" stroke="#1f7a70" stroke-width="1.5"/>
  <circle cx="350" cy="122" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="395" cy="122" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="440" cy="122" r="12" fill="#2a9d8f" stroke="#1f7a70" stroke-width="1.5"/>
  <!-- row 4 -->
  <circle cx="260" cy="157" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="305" cy="157" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="350" cy="157" r="12" fill="#2a9d8f" stroke="#1f7a70" stroke-width="1.5"/>
  <circle cx="395" cy="157" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>
  <circle cx="440" cy="157" r="12" fill="none" stroke="#9aa7b3" stroke-width="1.8"/>

  <!-- ===== BOTTOM: posterior density over p in [0,1] ===== -->

  <!-- shaded area under the curve -->
  <path d="M80,340 L107,339.8 L134,334.9 L161,313.9 L188,277.4 L215,243.2 L242,230
           L269,241.9 L296,268.5 L323,297.1 L350,318.8 L377,331.4 L404,337.2
           L431,339.3 L458,339.9 L485,340 L620,340 Z"
        fill="#d9efec" stroke="none"/>

  <!-- density curve -->
  <path d="M80,340 L107,339.8 L134,334.9 L161,313.9 L188,277.4 L215,243.2 L242,230
           L269,241.9 L296,268.5 L323,297.1 L350,318.8 L377,331.4 L404,337.2
           L431,339.3 L458,339.9 L485,340 L620,340"
        fill="none" stroke="#2a9d8f" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- parameter axis -->
  <line x1="80" y1="340" x2="620" y2="340" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="345" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="620" y1="340" x2="620" y2="345" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="80" y="359" text-anchor="middle" font-size="13" fill="#546272">0</text>
  <text x="620" y="359" text-anchor="middle" font-size="13" fill="#546272">1</text>

  <!-- dashed line at p-hat = 0.30 -->
  <line x1="242" y1="340" x2="242" y2="212" stroke="#1b2a3a" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="242" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">p^ = 6/20 = 0.30</text>

  <!-- axis label -->
  <text x="350" y="384" text-anchor="middle" font-size="15" fill="#1b2a3a">p = true fraction positive</text>

</svg>
