<svg xmlns="http://www.w3.org/2000/svg" viewBox="15.0 -1.0 790.8 338.1" font-family="Helvetica, Arial, sans-serif" width="790.8" height="338.1">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== Panel 1: Prior ===== -->
  <text x="140" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#e09f3e">Prior  P(H)</text>
  <path d="M40,190.7 L50,172.2 L60,155.7 L70,144.2 L80,140 L90,144.2 L100,155.7 L110,172.2 L120,190.7 L130,208.1 L140,222.6 L150,233.4 L160,240.7 L170,245.2 L180,247.7 L190,249 L200,249.6 L220,249.9 L240,250 L40,250 Z" fill="#e09f3e" fill-opacity="0.22"/>
  <path d="M40,190.7 L50,172.2 L60,155.7 L70,144.2 L80,140 L90,144.2 L100,155.7 L110,172.2 L120,190.7 L130,208.1 L140,222.6 L150,233.4 L160,240.7 L170,245.2 L180,247.7 L190,249 L200,249.6 L220,249.9 L240,250" fill="none" stroke="#e09f3e" stroke-width="2.2"/>
  <line x1="40" y1="250" x2="248" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">0</text>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">0.5</text>
  <text x="240" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">1</text>
  <text x="256" y="254" font-size="13" font-style="italic" fill="#1b2a3a">p</text>

  <!-- multiply sign -->
  <text x="270" y="180" text-anchor="middle" font-size="34" fill="#1b2a3a">&#215;</text>

  <!-- ===== Panel 2: Likelihood ===== -->
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a6f97">Likelihood  P(D | H)</text>
  <path d="M300,248.4 L310,243.9 L320,231.1 L330,204.5 L340,165.1 L350,126.5 L360,110 L370,126.5 L380,165.1 L390,204.5 L400,231.1 L410,243.9 L420,248.4 L430,249.7 L440,249.95 L460,250 L500,250 L300,250 Z" fill="#2a6f97" fill-opacity="0.18"/>
  <path d="M300,248.4 L310,243.9 L320,231.1 L330,204.5 L340,165.1 L350,126.5 L360,110 L370,126.5 L380,165.1 L390,204.5 L400,231.1 L410,243.9 L420,248.4 L430,249.7 L440,249.95 L460,250 L500,250" fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <line x1="300" y1="250" x2="508" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">0</text>
  <text x="400" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">0.5</text>
  <text x="500" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">1</text>
  <text x="516" y="254" font-size="13" font-style="italic" fill="#1b2a3a">p</text>

  <!-- proportional-to sign -->
  <text x="530" y="176" text-anchor="middle" font-size="30" fill="#1b2a3a">&#8733;</text>

  <!-- ===== Panel 3: Posterior ===== -->
  <text x="660" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a9d8f">Posterior  P(H | D)</text>
  <path d="M560,250 L580,248.1 L590,233.7 L600,180.1 L604,146.9 L608,113.9 L612,89.2 L616,80 L620,89.2 L624,113.9 L628,146.9 L632,180.1 L640,227 L650,246.9 L660,249.8 L680,250 L760,250 L560,250 Z" fill="#2a9d8f" fill-opacity="0.22"/>
  <path d="M560,250 L580,248.1 L590,233.7 L600,180.1 L604,146.9 L608,113.9 L612,89.2 L616,80 L620,89.2 L624,113.9 L628,146.9 L632,180.1 L640,227 L650,246.9 L660,249.8 L680,250 L760,250" fill="none" stroke="#2a9d8f" stroke-width="2.4"/>
  <line x1="560" y1="250" x2="768" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">0</text>
  <text x="660" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">0.5</text>
  <text x="760" y="266" text-anchor="middle" font-size="11" fill="#5a6b7a">1</text>
  <text x="776" y="254" font-size="13" font-style="italic" fill="#1b2a3a">p</text>

  <!-- peak reference marks: show the pull from 0.2 to 0.3 to 0.28 -->
  <line x1="80" y1="140" x2="80" y2="250" stroke="#e09f3e" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="360" y1="110" x2="360" y2="250" stroke="#2a6f97" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="616" y1="80" x2="616" y2="250" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="80" y="132" text-anchor="middle" font-size="10" fill="#c78a2e">0.2</text>
  <text x="360" y="102" text-anchor="middle" font-size="10" fill="#2a6f97">0.30</text>
  <text x="616" y="72" text-anchor="middle" font-size="10" fill="#2a9d8f">0.28</text>

  <!-- teaching caption -->
  <text x="400" y="312" text-anchor="middle" font-size="14" fill="#1b2a3a">broad belief  &#215;  data&#8217;s verdict  &#8594;  sharper posterior, pulled between the two</text>
</svg>
