  <line x1="55" y1="246" x2="55" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="185" y1="246" x2="185" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="315" y1="246" x2="315" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="55" y="268" text-anchor="middle" font-size="12" fill="#1b2a3a">0</text>
  <text x="185" y="268" text-anchor="middle" font-size="12" fill="#1b2a3a">0.5</text>
  <text x="315" y="268" text-anchor="middle" font-size="12" fill="#1b2a3a">1</text>

  <!-- dashed line at p = 0.25 -->
  <line x1="120" y1="250" x2="120" y2="118" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="290" text-anchor="middle" font-size="12" fill="#1b2a3a">0.25</text>

  <!-- axis label: PARAMETER -->
  <text x="130" y="308" font-size="15" font-weight="bold" fill="#1b2a3a"><tspan font-style="italic">p</tspan>  (parameter)</text>

  <!-- region label with leader -->
  <line x1="236" y1="187" x2="193" y2="236" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="238" y="168" font-size="13" fill="#2a6f97">P(<tspan font-style="italic">p</tspan> &gt; 0.25 | data)</text>
  <text x="238" y="184" font-size="13" font-weight="bold" fill="#2a6f97">≈ 0.75</text>

  <!-- ============ divider ============ -->
  <line x1="350" y1="52" x2="350" y2="330" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ============ RIGHT PANEL: Frequentist ============ -->
  <text x="512" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#bc4749">Frequentist: p-value</text>

  <!-- shaded tail area to the right of observed 0.30 -->
  <polygon fill="#2a6f97" fill-opacity="0.28" stroke="none"
    points="543.75,250.00 543.75,205.58 546.45,213.30 549.15,220.12 551.85,226.03 554.55,231.05 557.25,235.24 559.95,238.67 562.65,241.43 565.35,243.61 568.05,245.31 570.75,246.60 573.45,247.58 576.15,248.30 578.85,248.82 581.55,249.20 584.25,249.46 586.95,249.64 589.65,249.77 592.35,249.85 595.05,249.90 597.75,249.94 600.45,249.96 603.15,249.98 605.85,249.99 610.58,249.99 615.30,250.00 645.00,250.00"/>

  <!-- sampling distribution under H0 (bell) -->
  <polyline fill="none" stroke="#1b2a3a" stroke-width="2"
    points="375.00,250.00 428.32,249.83 441.15,248.82 449.25,246.60 455.32,243.12 460.05,238.67 464.10,233.25 467.48,227.37 470.85,220.12 474.23,211.45 477.60,201.39 480.98,190.10 484.35,177.86 487.72,165.09 491.10,152.32 494.47,140.19 497.85,129.35 501.23,120.45 503.92,115.11 506.62,111.60 508.65,110.26 510.00,110.00 511.35,110.26 513.38,111.60 516.08,115.11 518.77,120.45 522.15,129.35 525.52,140.19 528.90,152.32 532.27,165.09 535.65,177.86 539.02,190.10 542.40,201.39 545.77,211.45 549.15,220.12 552.52,227.37 555.90,233.25 559.95,238.67 564.00,242.59 568.05,245.31 572.10,247.13 576.15,248.30 580.20,249.02 584.25,249.46 588.98,249.74 593.70,249.88 599.10,249.95 605.85,249.99 615.30,250.00 645.00,250.00"/>

  <!-- axis -->
  <line x1="368" y1="250" x2="655" y2="250" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ticks: 0.1, 0.2, 0.3, 0.4 -->
  <line x1="408.75" y1="246" x2="408.75" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="476.25" y1="246" x2="476.25" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="543.75" y1="246" x2="543.75" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="611.25" y1="246" x2="611.25" y2="254" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="408.75" y="268" text-anchor="middle" font-size="12" fill="#1b2a3a">0.10</text>
  <text x="476.25" y="268" text-anchor="middle" font-size="12" fill="#1b2a3a">0.20</text>
  <text x="611.25" y="268" text-anchor="middle" font-size="12" fill="#1b2a3a">0.40</text>

  <!-- H0 centre marker at 0.25 -->
  <line x1="510" y1="250" x2="510" y2="110" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="474" y="102" font-size="12" fill="#1b2a3a">H<tspan font-size="9" dy="3">0</tspan><tspan dy="-3">: </tspan><tspan font-style="italic">p</tspan> = 0.25</text>

  <!-- observed value dashed line at 0.30 -->
  <line x1="543.75" y1="250" x2="543.75" y2="200" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="543.75" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4749">observed 0.30</text>

  <!-- axis label: DATA STATISTIC -->
  <text x="512" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">sample fraction  (data statistic)</text>

  <!-- tail label with leader -->
  <line x1="606" y1="210" x2="558" y2="240" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="655" y="182" text-anchor="end" font-size="13" font-weight="bold" fill="#2a6f97">p-value =</text>
  <text x="655" y="198" text-anchor="end" font-size="12" fill="#2a6f97">P(data this extreme</text>
  <text x="608" y="214" font-size="12" fill="#2a6f97">| H<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> true)</tspan></text>

  <!-- ============ punchline ============ -->
  <text x="96" y="350" font-size="13" fill="#1b2a3a">integrate over the <tspan font-weight="bold" fill="#2a6f97">parameter</tspan></text>
  <text x="350" y="350" text-anchor="middle" font-size="13" fill="#1b2a3a">vs</text>
  <text x="438" y="350" font-size="13" fill="#1b2a3a">integrate over the <tspan font-weight="bold" fill="#bc4749">data</tspan></text>
  <text x="350" y="372" text-anchor="middle" font-size="12" fill="#1b2a3a">same accent shade — different axis, different question</text>
</svg>
