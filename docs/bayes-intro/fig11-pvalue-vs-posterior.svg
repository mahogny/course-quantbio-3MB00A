  <polyline fill="none" stroke="#1b2a3a" stroke-width="2"
    points="55.00,250.00 68.00,249.78 75.80,247.69 81.00,243.52 86.20,235.88 91.40,224.19 96.60,208.63 101.80,190.15 107.00,170.30 112.20,150.94 117.40,133.94 122.60,120.84 127.80,112.71 133.00,110.00 138.20,112.58 143.40,119.83 148.60,130.78 153.80,144.27 159.00,159.11 164.20,174.23 169.40,188.71 174.60,201.91 179.80,213.40 185.00,223.00 190.20,230.71 195.40,236.66 200.60,241.10 205.80,244.27 211.00,246.45 216.20,247.89 221.40,248.81 226.60,249.35 231.80,249.67 237.00,249.84 242.20,249.93 247.40,249.97 252.60,249.99 260.40,250.00 315.00,250.00"/>

  <!-- axis -->
