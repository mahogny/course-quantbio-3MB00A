<svg xmlns="http://www.w3.org/2000/svg" width="717.2" height="375.9" viewBox="33.7 23.3 717.2 375.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arwk" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- incident bundle I0: full height -->
  <g stroke="#2a6f97" stroke-width="2" marker-end="url(#arw)">
    <line x1="95" y1="72"  x2="198" y2="72"/>
    <line x1="95" y1="97"  x2="198" y2="97"/>
    <line x1="95" y1="122" x2="198" y2="122"/>
    <line x1="95" y1="147" x2="198" y2="147"/>
    <line x1="95" y1="172" x2="198" y2="172"/>
    <line x1="95" y1="197" x2="198" y2="197"/>
  </g>
  <text x="95" y="55" font-size="15" font-weight="bold" fill="#1b2a3a">I0 (incident)</text>

  <!-- cuvette -->
  <rect x="200" y="60" width="100" height="150" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- transmitted bundle I: thinner and shorter -->
  <g stroke="#2a6f97" stroke-width="1.5" marker-end="url(#arw)">
    <line x1="302" y1="118" x2="372" y2="118"/>
    <line x1="302" y1="140" x2="372" y2="140"/>
    <line x1="302" y1="162" x2="372" y2="162"/>
  </g>
  <text x="305" y="200" font-size="15" font-weight="bold" fill="#1b2a3a">I (transmitted)</text>

  <!-- path length dimension -->
  <line x1="200" y1="225" x2="300" y2="225" stroke="#1b2a3a" stroke-width="1.5" marker-start="url(#arwk)" marker-end="url(#arwk)"/>
  <text x="250" y="243" font-size="14" fill="#1b2a3a" text-anchor="middle">path length</text>

  <!-- formula box 1 -->
  <rect x="55" y="270" width="250" height="52" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="70" y="292" font-size="15" fill="#1b2a3a">T = I / I0</text>
  <text x="70" y="313" font-size="14" fill="#2a6f97">I0 = 100, I = 25 → T = 0.25</text>

  <!-- formula box 2 -->
  <rect x="55" y="332" width="360" height="46" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="70" y="361" font-size="15" fill="#1b2a3a">A = −log10(T) = −log10(0.25) = 0.60</text>

  <!-- inset plot -->
  <!-- axes -->
  <line x1="520" y1="60" x2="520" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="520" y1="240" x2="730" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- grid ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="570" y1="60" x2="570" y2="240"/>
    <line x1="620" y1="60" x2="620" y2="240"/>
    <line x1="670" y1="60" x2="670" y2="240"/>
    <line x1="520" y1="150" x2="730" y2="150"/>
  </g>
  <!-- axis labels -->
  <text x="625" y="262" font-size="13" fill="#1b2a3a" text-anchor="middle">transmittance T</text>
  <text x="512" y="150" font-size="13" fill="#1b2a3a" text-anchor="end" transform="rotate(-90 512 150)">absorbance A</text>
  <text x="520" y="255" font-size="11" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="720" y="255" font-size="11" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="515" y="244" font-size="11" fill="#1b2a3a" text-anchor="end">0</text>
  <text x="515" y="154" font-size="11" fill="#1b2a3a" text-anchor="end">1</text>

  <!-- curve A = -log10(T) -->
  <path d="M720,240 L680,231 L640,220 L600,204 L570,186 L560,177 L540,150 L530,123 L526,103 L524,87 L523,76 L522,60"
        fill="none" stroke="#bc4749" stroke-width="2"/>

  <!-- marked points -->
  <circle cx="570" cy="186" r="3.5" fill="#1b2a3a"/>
  <text x="575" y="182" font-size="11" fill="#1b2a3a">(0.25, 0.60)</text>
  <circle cx="540" cy="150" r="3.5" fill="#1b2a3a"/>
  <text x="546" y="145" font-size="11" fill="#1b2a3a">(0.1, 1.0)</text>
  <circle cx="720" cy="240" r="3.5" fill="#1b2a3a"/>

  <!-- annotation -->
  <text x="625" y="290" font-size="12.5" fill="#6a994e" text-anchor="middle">absorbance is the modelled quantity</text>
  <text x="625" y="306" font-size="12.5" fill="#6a994e" text-anchor="middle">— it behaves linearly</text>
</svg>
