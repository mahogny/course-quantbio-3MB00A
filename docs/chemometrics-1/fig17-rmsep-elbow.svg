<svg xmlns="http://www.w3.org/2000/svg" width="674.2" height="388.3" viewBox="18 16.2 674.2 388.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- overfitting shaded region ncomp greater than 6 -->
  <rect x="440" y="50" width="220" height="280" fill="#bc4749" opacity="0.08"/>
  <text x="550" y="118" text-anchor="middle" font-size="13" fill="#bc4749">overfitting: too many</text>
  <text x="550" y="135" text-anchor="middle" font-size="13" fill="#bc4749">components refit noise</text>

  <!-- y gridlines -->
  <line x1="90" y1="330" x2="660" y2="330" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="90" y1="260" x2="660" y2="260" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="90" y1="190" x2="660" y2="190" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="90" y1="120" x2="660" y2="120" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="90" y1="50"  x2="660" y2="50"  stroke="#c9d3dd" stroke-width="1"/>

  <!-- axes -->
  <line x1="90" y1="330" x2="670" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="330" x2="90" y2="40" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- elbow marker -->
  <line x1="290" y1="330" x2="290" y2="60" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- RMSEP curve -->
  <polyline points="110,78 170,190 230,260 290,295 350,299 410,298 470,292 530,285 590,277 650,267"
            fill="none" stroke="#2a6f97" stroke-width="2.2"/>

  <!-- data points -->
  <circle cx="110" cy="78"  r="4" fill="#2a6f97"/>
  <circle cx="170" cy="190" r="4" fill="#2a6f97"/>
  <circle cx="230" cy="260" r="4" fill="#2a6f97"/>
  <circle cx="290" cy="295" r="5.5" fill="#6a994e" stroke="#1b2a3a" stroke-width="1.2"/>
  <circle cx="350" cy="299" r="4" fill="#2a6f97"/>
  <circle cx="410" cy="298" r="4" fill="#2a6f97"/>
  <circle cx="470" cy="292" r="4" fill="#2a6f97"/>
  <circle cx="530" cy="285" r="4" fill="#2a6f97"/>
  <circle cx="590" cy="277" r="4" fill="#2a6f97"/>
  <circle cx="650" cy="267" r="4" fill="#2a6f97"/>

  <!-- x ticks and labels 1..10 -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="110" y="350">1</text>
    <text x="170" y="350">2</text>
    <text x="230" y="350">3</text>
    <text x="290" y="350">4</text>
    <text x="350" y="350">5</text>
    <text x="410" y="350">6</text>
    <text x="470" y="350">7</text>
    <text x="530" y="350">8</text>
    <text x="590" y="350">9</text>
    <text x="650" y="350">10</text>
  </g>

  <!-- axis titles -->
  <text x="380" y="382" text-anchor="middle" font-size="15" fill="#1b2a3a">number of components (ncomp)</text>
  <text x="48" y="185" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 48 185)">RMSEP (CV root-mean-square error of prediction)</text>

  <!-- elbow call-out -->
  <text x="300" y="205" font-size="13" fill="#6a994e">pick the smallest sensible ncomp —</text>
  <text x="300" y="222" font-size="13" fill="#6a994e">where CV error stops improving</text>
  <line x1="298" y1="230" x2="290" y2="290" stroke="#6a994e" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
