<svg xmlns="http://www.w3.org/2000/svg" width="891.1" height="415.1" viewBox="4.8 21.3 891.1 415.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ================= TOP: CALIBRATION DATA -> LEARN -> COEFFICIENTS ================= -->

  <!-- X : stacked mini spectra (n x p) -->
  <text x="122" y="60" font-size="18" font-weight="bold" font-style="italic" fill="#2a6f97" text-anchor="middle">X</text>
  <rect x="45" y="70" width="155" height="120" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="45" y1="100" x2="200" y2="100"/>
    <line x1="45" y1="130" x2="200" y2="130"/>
    <line x1="45" y1="160" x2="200" y2="160"/>
  </g>
  <g fill="none" stroke="#2a6f97" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="52,94 72,82 92,88 112,78 132,86 152,76 172,84 193,90"/>
    <polyline points="52,124 72,112 92,118 112,108 132,120 152,110 172,122 193,116"/>
    <polyline points="52,154 72,146 92,152 112,142 132,150 152,140 172,152 193,148"/>
    <polyline points="52,184 72,172 92,180 112,170 132,182 152,168 172,180 193,186"/>
  </g>
  <text x="122" y="207" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">spectra (fast)</text>
  <text x="122" y="223" font-size="11.5" fill="#1b2a3a" text-anchor="middle">n samples × p wavelengths</text>

  <!-- pairing tie -->
  <text x="212" y="134" font-size="16" fill="#1b2a3a" text-anchor="middle">↔</text>

  <!-- y : column of reference numbers -->
  <text x="251" y="60" font-size="18" font-weight="bold" font-style="italic" fill="#6a994e" text-anchor="middle">y</text>
  <rect x="225" y="70" width="52" height="120" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="225" y1="100" x2="277" y2="100"/>
    <line x1="225" y1="130" x2="277" y2="130"/>
    <line x1="225" y1="160" x2="277" y2="160"/>
  </g>
  <g font-size="15" fill="#6a994e" text-anchor="middle" font-weight="bold">
    <text x="251" y="90">3.1</text>
    <text x="251" y="120">5.8</text>
    <text x="251" y="150">2.4</text>
    <text x="251" y="180">4.7</text>
  </g>
  <text x="251" y="207" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">reference concentrations</text>
  <text x="251" y="223" font-size="11.5" fill="#6a994e" text-anchor="middle" font-style="italic">gold-standard assay</text>

  <!-- LEARN arrow -->
  <line x1="298" y1="115" x2="450" y2="115" stroke="#1b2a3a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="372" y="104" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">learn</text>
  <text x="372" y="135" font-size="12" fill="#1b2a3a" text-anchor="middle" font-style="italic">fit regression</text>

  <!-- b : coefficient profile over wavelength -->
  <text x="580" y="60" font-size="18" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">b</text>
  <!-- zero line -->
  <line x1="458" y1="140" x2="704" y2="140" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="450" y="144" font-size="12" fill="#1b2a3a" text-anchor="end">0</text>
  <!-- signed weight bars -->
  <g stroke="none">
    <rect x="460" y="114" width="16" height="26" fill="#2a6f97"/>
    <rect x="482" y="102" width="16" height="38" fill="#2a6f97"/>
    <rect x="504" y="124" width="16" height="16" fill="#2a6f97"/>
    <rect x="526" y="140" width="16" height="14" fill="#bc4749"/>
    <rect x="548" y="140" width="16" height="30" fill="#bc4749"/>
    <rect x="570" y="130" width="16" height="10" fill="#2a6f97"/>
    <rect x="592" y="112" width="16" height="28" fill="#2a6f97"/>
    <rect x="614" y="140" width="16" height="20" fill="#bc4749"/>
    <rect x="636" y="106" width="16" height="34" fill="#2a6f97"/>
    <rect x="658" y="140" width="16" height="10" fill="#bc4749"/>
    <rect x="680" y="122" width="16" height="18" fill="#2a6f97"/>
  </g>
  <!-- profile curve over bar tops -->
  <polyline points="468,114 490,102 512,124 534,154 556,170 578,130 600,112 622,160 644,106 666,150 688,122"
            fill="none" stroke="#1b2a3a" stroke-width="2" stroke-linejoin="round"/>
  <text x="580" y="196" font-size="13" fill="#1b2a3a" text-anchor="middle">one weight b_j per wavelength   (wavelength λ →)</text>

  <!-- intercept box b0 -->
  <rect x="724" y="98" width="70" height="42" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="759" y="120" font-size="18" font-weight="bold" font-style="italic" fill="#1b2a3a" text-anchor="middle">b0</text>
  <text x="759" y="135" font-size="11" fill="#1b2a3a" text-anchor="middle">intercept</text>
  <text x="580" y="216" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="bold">coefficient vector  b  +  intercept  b0</text>

  <!-- ================= divider ================= -->
  <line x1="30" y1="238" x2="870" y2="238" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ================= BOTTOM: NEW SAMPLE PATH ================= -->
  <text x="45" y="260" font-size="15" fill="#1b2a3a" font-weight="bold">new sample</text>

  <!-- x_new : single spectrum -->
  <rect x="45" y="270" width="155" height="54" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <polyline points="52,314 72,302 92,308 112,298 132,306 152,296 172,304 193,310"
            fill="none" stroke="#2a6f97" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="122" y="342" font-size="13.5" fill="#1b2a3a" text-anchor="middle">x_new  —  a 2-second spectrum</text>

  <!-- arrow into formula -->
  <line x1="205" y1="297" x2="252" y2="297" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- prediction formula with highlighted dot product -->
  <rect x="258" y="277" width="300" height="42" rx="6" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <!-- highlight box behind the dot product b . x_new -->
  <rect x="392" y="284" width="126" height="28" rx="4" fill="#f6e3e4"/>
  <text x="284" y="305" font-size="19" fill="#1b2a3a" text-anchor="start">
    <tspan font-style="italic">ŷ</tspan><tspan> = </tspan><tspan font-style="italic" font-weight="bold">b</tspan><tspan font-size="12" dy="4">0</tspan><tspan dy="-4"> + </tspan></text>
  <text x="400" y="305" font-size="19" text-anchor="start">
    <tspan font-style="italic" font-weight="bold" fill="#2a6f97">b</tspan><tspan font-size="22" font-weight="bold" fill="#bc4749"> · </tspan><tspan font-style="italic" font-weight="bold" fill="#2a6f97">x</tspan><tspan font-size="12" dy="4" fill="#2a6f97">new</tspan>
  </text>
  <text x="455" y="336" font-size="11.5" fill="#bc4749" text-anchor="middle">a single dot product</text>

  <!-- arrow to prediction -->
  <line x1="562" y1="297" x2="614" y2="297" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- predicted number -->
  <text x="712" y="266" font-size="12.5" fill="#6a994e" text-anchor="middle">predicted concentration</text>
  <rect x="624" y="277" width="176" height="42" rx="6" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <text x="712" y="305" font-size="20" fill="#6a994e" text-anchor="middle" font-weight="bold">ŷ ≈ 4.3 g/L</text>

  <!-- ================= CAPTION ================= -->
  <text x="450" y="388" font-size="14.5" fill="#1b2a3a" text-anchor="middle">train once on samples measured both ways — then a two-second spectrum replaces the slow assay</text>
  <text x="450" y="408" font-size="15" fill="#6a994e" text-anchor="middle" font-weight="bold">prediction is a single dot product</text>
</svg>
