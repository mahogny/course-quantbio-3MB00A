<svg xmlns="http://www.w3.org/2000/svg" width="615.1" height="360.7" viewBox="27.9 2.3 615.1 360.7" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="320" x2="600" y2="320" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="320" x2="80" y2="30" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="592" y="345" font-size="16" fill="#1b2a3a" text-anchor="end">concentration c</text>
  <text x="90" y="42" font-size="16" fill="#1b2a3a">absorbance A</text>

  <!-- origin -->
  <circle cx="80" cy="320" r="3.5" fill="#1b2a3a"/>
  <text x="70" y="338" font-size="14" fill="#1b2a3a" text-anchor="end">0</text>

  <!-- ideal calibration line (accent blue), through origin -->
  <line x1="80" y1="320" x2="500" y2="21" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="470" y="55" font-size="15" fill="#2a6f97" text-anchor="end">A = (ε·L)·c</text>
  <text x="470" y="74" font-size="13" fill="#2a6f97" text-anchor="end">slope = ε·L</text>

  <!-- faint deviation curve: follows line at low c, bends below at high c -->
  <path d="M80,320 C 210,227 300,170 500,150" fill="none" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.75"/>
  <text x="512" y="150" font-size="12.5" fill="#bc4749">deviation at high c /</text>
  <text x="512" y="167" font-size="12.5" fill="#bc4749">scattering</text>
  <text x="512" y="184" font-size="12.5" fill="#bc4749">(Beer–Lambert limit)</text>

  <!-- guide c=1 -> A=0.30 -->
  <line x1="240" y1="320" x2="240" y2="206" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="240" y1="206" x2="80" y2="206" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="240" cy="206" r="4.5" fill="#2a6f97"/>
  <text x="240" y="338" font-size="14" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="72" y="211" font-size="14" fill="#1b2a3a" text-anchor="end">0.30</text>

  <!-- guide c=2 -> A=0.60 -->
  <line x1="400" y1="320" x2="400" y2="92" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="92" x2="80" y2="92" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="400" cy="92" r="4.5" fill="#2a6f97"/>
  <text x="400" y="338" font-size="14" fill="#1b2a3a" text-anchor="middle">2</text>
  <text x="72" y="97" font-size="14" fill="#1b2a3a" text-anchor="end">0.60</text>

  <!-- call-out: double c to double A -->
  <text x="150" y="150" font-size="15" fill="#6a994e" font-weight="bold">double c → double A</text>
  <path d="M235,152 C 300,145 350,120 396,98" fill="none" stroke="#6a994e" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
</svg>
