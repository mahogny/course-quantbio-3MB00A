<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.0 0.0 821.1 371.5" width="821.1" height="371.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- top bracket: p count over the columns -->
  <text x="545" y="34" font-size="15" font-weight="bold" fill="#bc4749" text-anchor="middle">p = 700 wavelengths</text>
  <path d="M260,58 L260,50 L830,50 L830,58" fill="none" stroke="#bc4749" stroke-width="1.8"/>

  <!-- column (wavelength) headers -->
  <g font-size="14" fill="#1b2a3a">
    <text x="268" y="80">λ<tspan font-size="10" dy="3">1</tspan></text>
    <text x="338" y="80">λ<tspan font-size="10" dy="3">2</tspan></text>
    <text x="408" y="80">λ<tspan font-size="10" dy="3">3</tspan></text>
    <text x="808" y="80">λ<tspan font-size="10" dy="3">p</tspan></text>
  </g>
  <g fill="#2a6f97" stroke="none">
    <circle cx="600" cy="76" r="1.8"/>
    <circle cx="612" cy="76" r="1.8"/>
    <circle cx="624" cy="76" r="1.8"/>
  </g>

  <!-- matrix name -->
  <text x="60" y="176" font-size="22" font-weight="bold" font-style="italic" fill="#1b2a3a">X =</text>

  <!-- left brace: n count over the rows -->
  <path d="M158,95 L150,95 L150,245 L158,245" fill="none" stroke="#6a994e" stroke-width="1.8"/>
  <text x="133" y="170" font-size="13" font-weight="bold" fill="#6a994e" text-anchor="middle" transform="rotate(-90 133 170)">n = 50 samples</text>

  <!-- row (sample) labels -->
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="248" y="114">sample 1</text>
    <text x="248" y="144">sample 2</text>
    <text x="248" y="174">sample 3</text>
    <circle cx="226" cy="202" r="1.6" fill="#2a6f97" stroke="none"/>
    <circle cx="226" cy="210" r="1.6" fill="#2a6f97" stroke="none"/>
    <circle cx="226" cy="218" r="1.6" fill="#2a6f97" stroke="none"/>
    <text x="248" y="240">sample n</text>
  </g>

  <!-- matrix body tint -->
  <rect x="250" y="95" width="580" height="150" fill="#eaf1f7" stroke="none"/>

  <!-- faint column grid lines (= wavelengths) -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="335" y1="95" x2="335" y2="245"/>
    <line x1="405" y1="95" x2="405" y2="245"/>
    <line x1="475" y1="95" x2="475" y2="245"/>
    <line x1="615" y1="95" x2="615" y2="245"/>
    <line x1="685" y1="95" x2="685" y2="245"/>
    <line x1="755" y1="95" x2="755" y2="245"/>
  </g>
  <!-- faint row separators -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="250" y1="125" x2="830" y2="125"/>
    <line x1="250" y1="155" x2="830" y2="155"/>
    <line x1="250" y1="185" x2="830" y2="185"/>
    <line x1="250" y1="215" x2="830" y2="215"/>
  </g>

  <!-- each row rendered as a wiggly spectrum (rows = spectra) -->
  <g fill="none" stroke="#2a6f97" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="265,110 300,105 335,100 370,112 405,102 440,115 475,107 510,96 545,110 580,117 615,104 650,109 685,101 720,113 755,106 790,111 825,108"/>
    <polyline points="265,140 300,133 335,146 370,122 405,138 440,149 475,129 510,141 545,147 580,124 615,144 650,134 685,149 720,131 755,142 790,139 825,140"/>
    <polyline points="265,170 300,177 335,161 370,174 405,156 440,171 475,181 510,165 545,171 580,159 615,175 650,168 685,161 720,179 755,167 790,170 825,169"/>
    <polyline points="265,230 300,223 335,237 370,216 405,234 440,243 475,221 510,231 545,239 580,219 615,235 650,226 685,241 720,225 755,232 790,229 825,230"/>
  </g>

  <!-- vertical ellipsis for the middle rows -->
  <g fill="#2a6f97" stroke="none">
    <circle cx="540" cy="198" r="2"/>
    <circle cx="540" cy="207" r="2"/>
    <circle cx="540" cy="216" r="2"/>
  </g>

  <!-- matrix brackets (large) -->
  <path d="M258,90 L250,90 L250,250 L258,250" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <path d="M822,90 L830,90 L830,250 L822,250" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- annotation below -->
  <text x="490" y="275" font-size="13.5" fill="#1b2a3a" text-anchor="middle">rows = samples,  columns = wavelengths  —  same layout as a gene-expression matrix (samples × features)</text>
  <text x="490" y="294" font-size="12.5" font-style="italic" fill="#6a994e" text-anchor="middle">each row is drawn as its own spectrum (intensity vs wavelength)</text>

  <!-- bold call-out arrow spanning the width -->
  <line x1="252" y1="322" x2="828" y2="322" stroke="#1b2a3a" stroke-width="4" marker-start="url(#arrowL)" marker-end="url(#arrow)"/>
  <text x="540" y="345" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">wide:  p >> n   (many more wavelengths than samples)</text>
</svg>
