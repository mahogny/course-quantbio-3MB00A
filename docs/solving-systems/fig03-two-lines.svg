<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.4 28.6 557.1 398.5" width="557.1" height="398.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical grid: x1 = 1..5 -->
    <line x1="170" y1="60" x2="170" y2="330"/>
    <line x1="260" y1="60" x2="260" y2="330"/>
    <line x1="350" y1="60" x2="350" y2="330"/>
    <line x1="440" y1="60" x2="440" y2="330"/>
    <line x1="530" y1="60" x2="530" y2="330"/>
    <!-- horizontal grid: x2 = 1..5 -->
    <line x1="80" y1="276" x2="530" y2="276"/>
    <line x1="80" y1="222" x2="530" y2="222"/>
    <line x1="80" y1="168" x2="530" y2="168"/>
    <line x1="80" y1="114" x2="530" y2="114"/>
    <line x1="80" y1="60"  x2="530" y2="60"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="80" y1="330" x2="545" y2="330" marker-end="url(#arrow)"/>
    <line x1="80" y1="330" x2="80"  y2="50"  marker-end="url(#arrow)"/>
  </g>

  <!-- axis tick labels -->
  <g fill="#1b2a3a" font-size="13" text-anchor="middle">
    <text x="80"  y="349">0</text>
    <text x="170" y="349">1</text>
    <text x="260" y="349">2</text>
    <text x="350" y="349">3</text>
    <text x="440" y="349">4</text>
    <text x="530" y="349">5</text>
  </g>
  <g fill="#1b2a3a" font-size="13" text-anchor="end">
    <text x="72" y="335">0</text>
    <text x="72" y="281">1</text>
    <text x="72" y="227">2</text>
    <text x="72" y="173">3</text>
    <text x="72" y="119">4</text>
    <text x="72" y="65">5</text>
  </g>

  <!-- axis titles -->
  <text x="246" y="378" fill="#1b2a3a" font-size="16" text-anchor="start">x<tspan> (tumour units)</tspan></text>
  <text x="-28.5" y="195" fill="#1b2a3a" font-size="16" text-anchor="start" transform="rotate(-90 34 195)">y<tspan> (immune units)</tspan></text>

  <!-- Line 1: 2x1 + x2 = 8  (blue) from (1.5,5) to (4,0) -->
  <line x1="215" y1="60" x2="440" y2="330" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="166" y="55" fill="#2a6f97" font-size="15" font-weight="bold" text-anchor="start">2x<tspan> + y</tspan><tspan> = 8</tspan></text>

  <!-- Line 2: x1 + 3x2 = 9 (orange) from (0,3) to (5,1.333) -->
  <line x1="80" y1="168" x2="530" y2="258" stroke="#e08a1e" stroke-width="2.5"/>
  <text x="431" y="232" fill="#e08a1e" font-size="15" font-weight="bold" text-anchor="start">x<tspan> + 3y</tspan><tspan> = 9</tspan></text>

  <!-- intersection point (3,2) -->
  <circle cx="350" cy="222" r="6" fill="#1b2a3a"/>
  <line x1="350" y1="222" x2="410" y2="150" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="380" y="123" width="150" height="26" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1"/>
  <text x="410" y="141" fill="#1b2a3a" font-size="14" text-anchor="start">(x<tspan> = 3, y</tspan><tspan> = 2)</tspan></text>

  <!-- caption -->
  <text x="350" y="408" fill="#1b2a3a" font-size="16" text-anchor="middle" font-style="italic">Solving the system = finding where the two lines meet.</text>
</svg>
