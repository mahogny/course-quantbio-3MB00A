<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect x="0" y="0" width="1080" height="300" fill="white"/>
<rect x="10" y="8" width="336" height="284" rx="10" fill="#f4f7fa" stroke="#c9d6e2"/>
<text x="178" y="36" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1. Multiply an equation</text>
<text x="178" y="58" font-size="15" fill="#1b2a3a" text-anchor="middle">by a non-zero number</text>
<text x="178" y="98" font-size="20" fill="#1b2a3a" text-anchor="middle">2x + y = 8</text>
<text x="178" y="126" font-size="20" fill="#1b2a3a" text-anchor="middle">x + 3y = 9</text>
<line x1="178" y1="140" x2="178" y2="190" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="190" y="171" font-size="17" font-weight="bold" fill="#2a6f97">R1 × 3</text>
<text x="178" y="226" font-size="20" fill="#bc4749" text-anchor="middle">6x + 3y = 24</text>
<text x="178" y="254" font-size="20" fill="#1b2a3a" text-anchor="middle">x + 3y = 9</text>
<rect x="367" y="8" width="336" height="284" rx="10" fill="#f4f7fa" stroke="#c9d6e2"/>
<text x="535" y="36" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">2. Add a multiple of one</text>
<text x="535" y="58" font-size="15" fill="#1b2a3a" text-anchor="middle">equation to another</text>
<text x="535" y="98" font-size="20" fill="#1b2a3a" text-anchor="middle">2x + y = 8</text>
<text x="535" y="126" font-size="20" fill="#1b2a3a" text-anchor="middle">x + 3y = 9</text>
<line x1="535" y1="140" x2="535" y2="190" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="547" y="171" font-size="17" font-weight="bold" fill="#2a6f97">R2 − ½ R1</text>
<text x="535" y="226" font-size="20" fill="#1b2a3a" text-anchor="middle">2x + y = 8</text>
<text x="535" y="254" font-size="20" fill="#bc4749" text-anchor="middle">0x + 2.5y = 5</text>
<rect x="724" y="8" width="336" height="284" rx="10" fill="#f4f7fa" stroke="#c9d6e2"/>
<text x="892" y="36" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">3. Swap two equations</text>
<text x="892" y="58" font-size="15" fill="#1b2a3a" text-anchor="middle">(only reorders them)</text>
<text x="892" y="98" font-size="20" fill="#1b2a3a" text-anchor="middle">2x + y = 8</text>
<text x="892" y="126" font-size="20" fill="#1b2a3a" text-anchor="middle">x + 3y = 9</text>
<line x1="892" y1="140" x2="892" y2="190" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="904" y="171" font-size="17" font-weight="bold" fill="#2a6f97">R1 ↔ R2</text>
<text x="892" y="226" font-size="20" fill="#bc4749" text-anchor="middle">x + 3y = 9</text>
<text x="892" y="254" font-size="20" fill="#bc4749" text-anchor="middle">2x + y = 8</text>
</svg>