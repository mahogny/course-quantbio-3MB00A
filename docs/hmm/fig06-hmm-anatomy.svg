<svg xmlns="http://www.w3.org/2000/svg" viewBox="25.3 49.8 679.3 340.4" width="679.3" height="340.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#6a994e"/>
    </marker>
    <marker id="arrowPi" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ============ pi = initial distribution ============ -->
  <circle cx="70" cy="150" r="24" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="70" y="156" text-anchor="middle" font-size="20" fill="#2a6f97" font-weight="bold">π</text>
  <text x="70" y="200" text-anchor="middle" font-size="13" fill="#2a6f97">start</text>

  <!-- start arrows from pi into H and L -->
  <path d="M92,138 Q160,110 245,120" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowPi)"/>
  <path d="M92,162 Q220,190 405,138" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowPi)"/>

  <!-- ============ A = transition matrix cluster ============ -->
  <rect x="215" y="70" width="290" height="130" rx="10" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="90" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">A = transition matrix</text>
  <text x="360" y="107" text-anchor="middle" font-size="12" fill="#1b2a3a">(states × states, rows sum to 1)</text>

  <!-- state H -->
  <circle cx="285" cy="150" r="28" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="285" y="157" text-anchor="middle" font-size="20" fill="#1b2a3a" font-weight="bold">H</text>
  <!-- state L -->
  <circle cx="435" cy="150" r="28" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="435" y="157" text-anchor="middle" font-size="20" fill="#1b2a3a" font-weight="bold">L</text>

  <!-- transition H -> L -->
  <path d="M310,138 Q360,122 410,138" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- transition L -> H -->
  <path d="M410,162 Q360,178 310,162" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- self-loop H -->
  <path d="M268,127 Q252,95 288,105 Q300,110 300,130" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- self-loop L -->
  <path d="M452,127 Q468,95 432,105 Q420,110 420,130" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ B = emission matrix cluster ============ -->
  <rect x="215" y="270" width="290" height="95" rx="10" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="347" text-anchor="middle" font-size="14" fill="#6a994e" font-weight="bold">B = emission matrix</text>

  <!-- four symbol boxes -->
  <g fill="#f0f6ec" stroke="#6a994e" stroke-width="2">
    <rect x="255" y="290" width="44" height="40" rx="5"/>
    <rect x="315" y="290" width="44" height="40" rx="5"/>
    <rect x="375" y="290" width="44" height="40" rx="5"/>
    <rect x="435" y="290" width="44" height="40" rx="5"/>
  </g>
  <g font-size="18" fill="#6a994e" font-weight="bold" text-anchor="middle">
    <text x="277" y="316">A</text>
    <text x="337" y="316">C</text>
    <text x="397" y="316">G</text>
    <text x="457" y="316">T</text>
  </g>

  <!-- emission arrows from H to four symbols -->
  <g fill="none" stroke="#6a994e" stroke-width="1.6" opacity="0.85">
    <path d="M275,175 L272,285" marker-end="url(#arrowB)"/>
    <path d="M283,175 L330,285" marker-end="url(#arrowB)"/>
    <path d="M291,175 L390,285" marker-end="url(#arrowB)"/>
    <path d="M298,175 L448,285" marker-end="url(#arrowB)"/>
  </g>
  <!-- emission arrows from L to four symbols -->
  <g fill="none" stroke="#6a994e" stroke-width="1.6" opacity="0.55" stroke-dasharray="4 3">
    <path d="M422,175 L280,285" marker-end="url(#arrowB)"/>
    <path d="M430,175 L340,285" marker-end="url(#arrowB)"/>
    <path d="M438,175 L398,285" marker-end="url(#arrowB)"/>
    <path d="M448,175 L455,285" marker-end="url(#arrowB)"/>
  </g>
  <text x="360" y="361" text-anchor="middle" font-size="12" fill="#6a994e">(states × symbols, rows sum to 1)</text>

  <!-- ============ legend ============ -->
  <g font-size="13.5" fill="#1b2a3a">
    <text x="545" y="120" font-weight="bold" font-size="14">Four ingredients</text>
    <circle cx="552" cy="146" r="9" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="552" y="150" text-anchor="middle" font-size="11">1</text>
    <text x="568" y="150">hidden states {H, L}</text>

    <circle cx="552" cy="176" r="9" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="552" y="180" text-anchor="middle" font-size="11">2</text>
    <text x="568" y="180" fill="#1b2a3a" font-weight="bold">A</text><text x="584" y="180">transitions</text>

    <circle cx="552" cy="206" r="9" fill="#f0f6ec" stroke="#6a994e" stroke-width="1.5"/>
    <text x="552" y="210" text-anchor="middle" font-size="11">3</text>
    <text x="568" y="210" fill="#6a994e" font-weight="bold">B</text><text x="584" y="210">emissions</text>

    <circle cx="552" cy="236" r="9" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="552" y="240" text-anchor="middle" font-size="11">4</text>
    <text x="568" y="240" fill="#2a6f97" font-weight="bold">π</text><text x="584" y="240">initial distribution</text>
  </g>
</svg>
