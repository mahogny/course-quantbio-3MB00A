<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.0 -10.8 883.9 351.3" width="883.9" height="351.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== HIDDEN region ===== -->
  <text x="50" y="26" font-size="16" font-weight="bold" fill="#bc4749">HIDDEN: region label you actually want</text>

  <!-- H bar: GC-rich, spans bases 2..14 -->
  <rect x="67" y="46" width="428" height="52" rx="6"
        fill="#e6efe0" stroke="#6a994e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="88" y="82" font-size="30" font-weight="bold" fill="#6a994e">?</text>
  <text x="288" y="77" font-size="15.5" font-weight="bold" fill="#3f6a2e" text-anchor="middle">GC-rich?  (hidden state H)</text>

  <!-- L bar: normal, spans bases 15..25 -->
  <rect x="496" y="46" width="362" height="52" rx="6"
        fill="#eaf1f7" stroke="#2a6f97" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="516" y="82" font-size="30" font-weight="bold" fill="#2a6f97">?</text>
  <text x="686" y="77" font-size="15.5" font-weight="bold" fill="#1e5171" text-anchor="middle">normal?  (hidden state L)</text>

  <!-- ===== emits arrows ===== -->
  <line x1="281" y1="100" x2="281" y2="234" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="292" y="172" font-size="14" font-style="italic" fill="#1b2a3a">emits</text>

  <line x1="677" y1="100" x2="677" y2="234" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="688" y="172" font-size="14" font-style="italic" fill="#1b2a3a">emits</text>

  <!-- ===== VISIBLE DNA track ===== -->
  <rect x="34" y="240" width="832" height="46" rx="6" fill="#f4f8fb" stroke="#c9d3dd" stroke-width="1.5"/>

  <g font-size="19" font-weight="bold" fill="#1b2a3a" text-anchor="middle">
    <text x="50" y="270">A</text>
    <text x="83" y="270">T</text>
    <text x="116" y="270">G</text>
    <text x="149" y="270">C</text>
    <text x="182" y="270">G</text>
    <text x="215" y="270">C</text>
    <text x="248" y="270">G</text>
    <text x="281" y="270">C</text>
    <text x="314" y="270">G</text>
    <text x="347" y="270">G</text>
    <text x="380" y="270">C</text>
    <text x="413" y="270">C</text>
    <text x="446" y="270">G</text>
    <text x="479" y="270">C</text>
    <text x="512" y="270">A</text>
    <text x="545" y="270">T</text>
    <text x="578" y="270">A</text>
    <text x="611" y="270">T</text>
    <text x="644" y="270">A</text>
    <text x="677" y="270">A</text>
    <text x="710" y="270">T</text>
    <text x="743" y="270">T</text>
    <text x="776" y="270">A</text>
    <text x="809" y="270">C</text>
    <text x="842" y="270">A</text>
  </g>

  <text x="50" y="312" font-size="16" font-weight="bold" fill="#2a6f97">VISIBLE: bases you can read (emissions)</text>
</svg>
