<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8.5 3.3 895.4 401.4" width="895.4" height="401.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- initial guess box -->
  <rect x="18" y="30" width="150" height="52" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="93" y="52" text-anchor="middle" font-size="14" fill="#1b2a3a">initial guess of</text>
  <text x="93" y="71" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">A, B, π</text>

  <!-- entry arrow into loop -->
  <path d="M168 66 C 210 66, 230 90, 250 112" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- E-step box -->
  <rect x="255" y="70" width="200" height="90" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="355" y="94" text-anchor="middle" font-size="16" fill="#2a6f97" font-weight="bold">E-step</text>
  <text x="355" y="116" text-anchor="middle" font-size="13" fill="#1b2a3a">softly infer the hidden</text>
  <text x="355" y="133" text-anchor="middle" font-size="13" fill="#1b2a3a">states given current</text>
  <text x="355" y="150" text-anchor="middle" font-size="13" fill="#1b2a3a" font-weight="bold">A, B, π</text>

  <!-- M-step box -->
  <rect x="255" y="245" width="200" height="90" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="355" y="269" text-anchor="middle" font-size="16" fill="#2a6f97" font-weight="bold">M-step</text>
  <text x="350" y="291" text-anchor="end" font-size="13" fill="#1b2a3a">re-estimate</text>
  <text x="356" y="291" text-anchor="start" font-size="13" font-weight="bold" fill="#1b2a3a">A, B, π</text>
  <text x="355" y="308" text-anchor="middle" font-size="13" fill="#1b2a3a">from those inferred</text>
  <text x="355" y="325" text-anchor="middle" font-size="13" fill="#1b2a3a">states</text>

  <!-- loop arrows: E -> M (right curve) -->
  <path d="M455 130 C 520 150, 520 255, 455 275" fill="none" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#arrowB)"/>
  <text x="524" y="148" text-anchor="middle" font-size="13" fill="#2a6f97">new state</text>
  <text x="524" y="164" text-anchor="middle" font-size="13" fill="#2a6f97">estimates</text>

  <!-- loop arrows: M -> E (left curve) with repeat label -->
  <path d="M255 275 C 190 255, 190 150, 255 130" fill="none" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#arrowB)"/>
  <text x="100" y="205" text-anchor="middle" font-size="13" fill="#2a6f97">repeat until</text>
  <text x="100" y="222" text-anchor="middle" font-size="13" fill="#2a6f97">converged</text>

  <!-- caution flags -->
  <g>
    <path d="M300 175 l0 32 M300 175 l24 7 l-24 7" fill="#bc4749" stroke="#bc4749" stroke-width="1.5"/>
    <path d="M300 175 l24 7 l-24 7 z" fill="#bc4749"/>
  </g>
  <text x="330" y="187" font-size="12.5" fill="#bc4749" font-weight="bold">finds only a LOCAL optimum</text>
  <text x="330" y="204" font-size="12.5" fill="#bc4749">sensitive to the starting guess</text>

  <!-- contrasting labelled-data path -->
  <line x1="560" y1="30" x2="560" y2="370" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="590" y="52" font-size="15" fill="#6a994e" font-weight="bold">If labelled data:</text>

  <rect x="590" y="70" width="270" height="90" rx="10" fill="#eef4e9" stroke="#6a994e" stroke-width="2"/>
  <text x="725" y="98" text-anchor="middle" font-size="14" fill="#1b2a3a">just count transitions</text>
  <text x="725" y="117" text-anchor="middle" font-size="14" fill="#1b2a3a">&amp; emissions,</text>
  <text x="725" y="136" text-anchor="middle" font-size="14" fill="#1b2a3a">then normalise</text>
  <text x="725" y="152" text-anchor="middle" font-size="12.5" fill="#6a994e">(one shot, easy)</text>

  <path d="M725 160 L 725 200" fill="none" stroke="#6a994e" stroke-width="2.2" marker-end="url(#arrowG)"/>
  <rect x="640" y="205" width="170" height="40" rx="8" fill="#eef4e9" stroke="#6a994e" stroke-width="1.5"/>
  <text x="725" y="230" text-anchor="middle" font-size="15" fill="#6a994e" font-weight="bold">A, B, π  (done)</text>

  <!-- convergence inset -->
  <rect x="600" y="278" width="250" height="100" rx="8" fill="#ffffff" fill-opacity="0.0" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="725" y="296" text-anchor="middle" font-size="12.5" fill="#1b2a3a">convergence (EM)</text>
  <!-- axes -->
  <line x1="625" y1="365" x2="835" y2="365" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="365" x2="625" y2="305" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="835" y="379" text-anchor="end" font-size="11" fill="#1b2a3a">iterations</text>
  <text x="632" y="316" text-anchor="start" font-size="10" fill="#1b2a3a">likelihood</text>
  <!-- rising-to-plateau curve -->
  <path d="M628 360 C 660 358, 675 330, 720 318 C 760 308, 800 307, 832 306" fill="none" stroke="#2a6f97" stroke-width="2.2"/>
</svg>
