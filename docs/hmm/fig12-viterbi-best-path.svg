<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.9 -10.5 690.1 406.3" width="690.1" height="406.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- equation -->
  <text x="252" y="23" text-anchor="start" font-size="19" fill="#1b2a3a">z* = argmax</text>
  <text x="356" y="29" text-anchor="start" font-size="12" font-style="italic" fill="#1b2a3a">z</text>
  <text x="368" y="23" text-anchor="start" font-size="19" fill="#1b2a3a">P(z | x)</text>

  <!-- Row labels -->
  <text x="40" y="90" text-anchor="middle" font-size="17" fill="#bc4749" font-weight="bold">H</text>
  <text x="40" y="180" text-anchor="middle" font-size="17" fill="#2a6f97" font-weight="bold">L</text>
  <text x="40" y="112" text-anchor="middle" font-size="11" fill="#8a97a5">CpG</text>
  <text x="40" y="202" text-anchor="middle" font-size="11" fill="#8a97a5">bg</text>

  <!-- coordinates: columns t=1..6 at x = 110,220,330,440,550,660 ; H y=85, L y=175 -->

  <!-- FADED transition edges (all node-to-node between consecutive columns) -->
  <g stroke="#c9d3dd" stroke-width="1.5" fill="none">
    <!-- t1->t2 -->
    <line x1="110" y1="85" x2="220" y2="85"/>
    <line x1="110" y1="85" x2="220" y2="175"/>
    <line x1="110" y1="175" x2="220" y2="85"/>
    <line x1="110" y1="175" x2="220" y2="175"/>
    <!-- t2->t3 -->
    <line x1="220" y1="85" x2="330" y2="85"/>
    <line x1="220" y1="85" x2="330" y2="175"/>
    <line x1="220" y1="175" x2="330" y2="85"/>
    <line x1="220" y1="175" x2="330" y2="175"/>
    <!-- t3->t4 -->
    <line x1="330" y1="85" x2="440" y2="85"/>
    <line x1="330" y1="85" x2="440" y2="175"/>
    <line x1="330" y1="175" x2="440" y2="85"/>
    <line x1="330" y1="175" x2="440" y2="175"/>
    <!-- t4->t5 -->
    <line x1="440" y1="85" x2="550" y2="85"/>
    <line x1="440" y1="85" x2="550" y2="175"/>
    <line x1="440" y1="175" x2="550" y2="85"/>
    <line x1="440" y1="175" x2="550" y2="175"/>
    <!-- t5->t6 -->
    <line x1="550" y1="85" x2="660" y2="85"/>
    <line x1="550" y1="85" x2="660" y2="175"/>
    <line x1="550" y1="175" x2="660" y2="85"/>
    <line x1="550" y1="175" x2="660" y2="175"/>
  </g>

  <!-- BOLD best path: L, H, H, H, L, L
       t1 L(110,175) -> t2 H(220,85) -> t3 H(330,85) -> t4 H(440,85) -> t5 L(550,175) -> t6 L(660,175) -->
  <g stroke="#1b2a3a" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
    <line x1="110" y1="175" x2="216" y2="90"/>
    <line x1="220" y1="85" x2="326" y2="85"/>
    <line x1="330" y1="85" x2="436" y2="85"/>
    <line x1="440" y1="85" x2="546" y2="170"/>
    <line x1="550" y1="175" x2="656" y2="175"/>
  </g>

  <!-- all nodes (draw after edges) -->
  <g font-size="13" text-anchor="middle">
    <!-- H row nodes -->
    <circle cx="110" cy="85" r="14" fill="#f2f4f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <circle cx="220" cy="85" r="15" fill="#f7dfe0" stroke="#bc4749" stroke-width="2.5"/>
    <circle cx="330" cy="85" r="15" fill="#f7dfe0" stroke="#bc4749" stroke-width="2.5"/>
    <circle cx="440" cy="85" r="15" fill="#f7dfe0" stroke="#bc4749" stroke-width="2.5"/>
    <circle cx="550" cy="85" r="14" fill="#f2f4f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <circle cx="660" cy="85" r="14" fill="#f2f4f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- L row nodes -->
    <circle cx="110" cy="175" r="15" fill="#dcebf5" stroke="#2a6f97" stroke-width="2.5"/>
    <circle cx="220" cy="175" r="14" fill="#f2f4f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <circle cx="330" cy="175" r="14" fill="#f2f4f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <circle cx="440" cy="175" r="14" fill="#f2f4f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <circle cx="550" cy="175" r="15" fill="#dcebf5" stroke="#2a6f97" stroke-width="2.5"/>
    <circle cx="660" cy="175" r="15" fill="#dcebf5" stroke="#2a6f97" stroke-width="2.5"/>
  </g>

  <!-- island bracket over H nodes columns 2-4 -->
  <path d="M204 60 L204 51 L456 51 L456 60" fill="none" stroke="#6a994e" stroke-width="2"/>
  <text x="330" y="46" text-anchor="middle" font-size="14" fill="#6a994e" font-weight="bold">predicted CpG island</text>

  <!-- observed bases row -->
  <line x1="90" y1="238" x2="680" y2="238" stroke="#c9d3dd" stroke-width="1"/>
  <text x="52" y="262" text-anchor="middle" font-size="12" fill="#8a97a5">x =</text>
  <g font-size="20" text-anchor="middle" fill="#1b2a3a" font-family="monospace">
    <text x="110" y="266">A</text>
    <text x="220" y="266">G</text>
    <text x="330" y="266">C</text>
    <text x="440" y="266">G</text>
    <text x="550" y="266">T</text>
    <text x="660" y="266">A</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8a97a5">
    <text x="110" y="284">t=1</text>
    <text x="220" y="284">2</text>
    <text x="330" y="284">3</text>
    <text x="440" y="284">4</text>
    <text x="550" y="284">5</text>
    <text x="660" y="284">6</text>
  </g>

  <!-- predicted state sequence readout -->
  <text x="214" y="316" text-anchor="start" font-size="14" fill="#1b2a3a">z* =</text>
  <text x="250" y="316" text-anchor="start" font-size="14" font-weight="bold" fill="#2a6f97">L</text>
  <text x="266" y="316" text-anchor="start" font-size="14" font-weight="bold" fill="#bc4749">H  H  H</text>
  <text x="328" y="316" text-anchor="start" font-size="14" font-weight="bold" fill="#2a6f97">L  L</text>
  <text x="366" y="316" text-anchor="start" font-size="14" fill="#8a97a5">→  run of H = island</text>

  <!-- caption -->
  <text x="360" y="356" text-anchor="middle" font-size="13" fill="#1b2a3a">Viterbi = same DP as forward but takes max and remembers the choice;</text>
  <text x="360" y="376" text-anchor="middle" font-size="13" fill="#1b2a3a">read off runs of H as island annotation.</text>
</svg>
