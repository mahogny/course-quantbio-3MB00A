<svg xmlns="http://www.w3.org/2000/svg" viewBox="51.5 -2.5 616.9 406.9" width="616.9" height="406.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===== HIDDEN layer bracket ===== -->
  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">HIDDEN layer: a Markov chain over states GC-rich / normal</text>
  <path d="M70,36 L70,44 L650,44 L650,36" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- hidden nodes -->
  <g stroke="#1b2a3a" stroke-width="2">
    <circle cx="120" cy="110" r="34" fill="#d7dee6"/>
    <circle cx="280" cy="110" r="34" fill="#d7dee6"/>
    <circle cx="440" cy="110" r="34" fill="#d7dee6"/>
    <circle cx="600" cy="110" r="34" fill="#d7dee6"/>
  </g>
  <g font-size="20" fill="#1b2a3a" text-anchor="start" font-style="italic">
    <text x="111" y="117">z<tspan font-size="13" dy="5">1</tspan></text>
    <text x="271" y="117">z<tspan font-size="13" dy="5">2</tspan></text>
    <text x="431" y="117">z<tspan font-size="13" dy="5">3</tspan></text>
    <text x="591" y="117">z<tspan font-size="13" dy="5">4</tspan></text>
  </g>

  <!-- transition arrows -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="156" y1="110" x2="244" y2="110"/>
    <line x1="316" y1="110" x2="404" y2="110"/>
    <line x1="476" y1="110" x2="564" y2="110"/>
  </g>
  <text x="360" y="65" text-anchor="middle" font-size="14" fill="#1b2a3a" font-style="italic">transitions (matrix A)</text>

  <!-- emission arrows -->
  <g stroke="#2a6f97" stroke-width="2" fill="none" marker-end="url(#arrowBlue)">
    <line x1="120" y1="146" x2="120" y2="242"/>
    <line x1="280" y1="146" x2="280" y2="242"/>
    <line x1="440" y1="146" x2="440" y2="242"/>
    <line x1="600" y1="146" x2="600" y2="242"/>
  </g>
  <text x="360" y="200" text-anchor="middle" font-size="14" fill="#2a6f97" font-style="italic">emissions (matrix B)</text>

  <!-- visible nodes -->
  <g stroke="#1b2a3a" stroke-width="2">
    <rect x="88" y="245" width="64" height="64" rx="4" fill="#eaf1f7"/>
    <rect x="248" y="245" width="64" height="64" rx="4" fill="#eaf1f7"/>
    <rect x="408" y="245" width="64" height="64" rx="4" fill="#eaf1f7"/>
    <rect x="568" y="245" width="64" height="64" rx="4" fill="#eaf1f7"/>
  </g>
  <g font-size="20" fill="#1b2a3a" text-anchor="start" font-style="italic">
    <text x="111" y="284">x<tspan font-size="13" dy="5">1</tspan></text>
    <text x="271" y="284">x<tspan font-size="13" dy="5">2</tspan></text>
    <text x="431" y="284">x<tspan font-size="13" dy="5">3</tspan></text>
    <text x="591" y="284">x<tspan font-size="13" dy="5">4</tspan></text>
  </g>

  <!-- ===== VISIBLE layer bracket ===== -->
  <path d="M70,320 L70,328 L650,328 L650,320" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="360" y="346" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">VISIBLE layer: emitted bases A C G T — the only thing you observe</text>

  <!-- note -->
  <text x="360" y="384" text-anchor="middle" font-size="14" fill="#bc4749">across = transition,  down = emission;  you see only the bottom row.</text>
</svg>
