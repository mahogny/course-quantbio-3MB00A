<svg xmlns="http://www.w3.org/2000/svg" width="565.2" height="398.1" viewBox="50 -0.8 565.2 398.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">The Beta prior on a probability θ</text>

  <!-- axes -->
  <line x1="90" y1="300" x2="580" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="315" x2="90" y2="52" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- x ticks -->
  <line x1="90" y1="300" x2="90" y2="307" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="325" y1="300" x2="325" y2="307" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="560" y1="300" x2="560" y2="307" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="90" y="323" text-anchor="middle" font-size="14" fill="#1b2a3a">0</text>
  <text x="325" y="323" text-anchor="middle" font-size="14" fill="#1b2a3a">0.5</text>
  <text x="560" y="323" text-anchor="middle" font-size="14" fill="#1b2a3a">1</text>

  <!-- axis labels -->
  <text x="590" y="304" font-size="16" font-style="italic" fill="#1b2a3a">θ</text>
  <text x="63" y="176" text-anchor="middle" font-size="13.5" fill="#1b2a3a" transform="rotate(-90 63 176)">density</text>

  <!-- density = 1 gridline reference at y=150 -->
  <line x1="86" y1="150" x2="90" y2="150" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="82" y="154" text-anchor="end" font-size="13" fill="#7a8794">1</text>

  <!-- Curve B: Beta(1,1) flat uniform, dashed red -->
  <line x1="90" y1="150" x2="560" y2="150" stroke="#bc4749" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- Curve A: Beta(2,2) light tint fill under curve -->
  <path d="M90,300 L113.5,257.3 137,219 160.5,185.3 184,156 207.5,131.3 231,111 254.5,95.3 278,84 301.5,77.3 325,75 348.5,77.3 372,84 395.5,95.3 419,111 442.5,131.3 466,156 489.5,185.3 513,219 536.5,257.3 560,300 Z" fill="#eaf1f7"/>

  <!-- Curve A: Beta(2,2) solid blue -->
  <polyline points="90,300 113.5,257.3 137,219 160.5,185.3 184,156 207.5,131.3 231,111 254.5,95.3 278,84 301.5,77.3 325,75 348.5,77.3 372,84 395.5,95.3 419,111 442.5,131.3 466,156 489.5,185.3 513,219 536.5,257.3 560,300"
    fill="none" stroke="#2a6f97" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- legend / labels -->
  <line x1="100" y1="352" x2="130" y2="352" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="136" y="357" font-size="13.5" fill="#1b2a3a">Beta(2,2): gentle hump, favours 1/2, rarely near 0 or 1</text>

  <line x1="100" y1="374" x2="130" y2="374" stroke="#bc4749" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="136" y="379" font-size="13.5" fill="#1b2a3a">Beta(1,1): flat / uniform prior</text>
</svg>
