<svg xmlns="http://www.w3.org/2000/svg" width="878.2" height="373.6" viewBox="-6.2 -10.5 878.2 373.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b2a3a">Two front-ends, one engine</text>

  <!-- rstan front end (top) -->
  <rect x="20" y="70" width="240" height="76" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="140" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a6f97">rstan</text>
  <text x="140" y="114" text-anchor="middle" font-size="12.5" fill="#1b2a3a">you write gene_marker.stan by hand</text>
  <text x="140" y="132" text-anchor="middle" font-size="12.5" fill="#1b2a3a">(data / parameters / model blocks)</text>

  <!-- brms front end (bottom) -->
  <rect x="20" y="240" width="240" height="76" rx="8" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <text x="140" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#6a994e">brms</text>
  <text x="140" y="284" text-anchor="middle" font-size="12.5" fill="#1b2a3a">an lm-style R formula, e.g.</text>
  <text x="140" y="303" text-anchor="middle" font-size="13" font-style="italic" fill="#1b2a3a">expressed ~ treatment</text>

  <!-- brms auto-generates a .stan node -->
  <line x1="260" y1="278" x2="336" y2="278" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="266" text-anchor="middle" font-size="11.5" fill="#6a994e">auto-generates</text>
  <rect x="340" y="256" width="110" height="44" rx="8" fill="#f3f6ea" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="395" y="283" text-anchor="middle" font-size="13" fill="#1b2a3a">.stan model</text>

  <!-- both feed into engine -->
  <!-- rstan direct into engine -->
  <path d="M260,108 C400,108 440,150 500,178" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- generated .stan into engine -->
  <path d="M450,272 C480,262 490,240 500,222" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stan engine central box -->
  <rect x="500" y="152" width="230" height="96" rx="16" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="2"/>
  <text x="615" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Stan engine</text>
  <text x="615" y="206" text-anchor="middle" font-size="12.5" fill="#eaf1f7">compiles to C++,</text>
  <text x="615" y="224" text-anchor="middle" font-size="12.5" fill="#eaf1f7">runs HMC / NUTS sampler</text>

  <!-- engine to posterior -->
  <line x1="730" y1="200" x2="742" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Posterior box (wrap of narrow right column) -->
  <rect x="742" y="150" width="104" height="100" rx="8" fill="#fbeaea" stroke="#bc4749" stroke-width="2"/>
  <text x="794" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">Posterior</text>
  <text x="794" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">draws</text>
  <text x="794" y="228" text-anchor="middle" font-size="11.5" fill="#1b2a3a">(the fit object)</text>

  <!-- contrast annotation -->
  <text x="140" y="168" text-anchor="middle" font-size="11.5" fill="#2a6f97" font-style="italic">exposes the blocks</text>
  <text x="140" y="338" text-anchor="middle" font-size="11.5" fill="#6a994e" font-style="italic">hides them</text>
</svg>
