<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 5 659 349" font-family="Helvetica, Arial, sans-serif" width="659" height="349">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <text x="385" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Anatomy of a Stan model</text>

  <!-- BLOCK 1 data -->
  <rect x="250" y="58" width="300" height="72" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="266" y="80" font-size="16" font-weight="bold" fill="#1b2a3a">data { }</text>
  <text x="350" y="80" font-size="13" fill="#6a994e">the KNOWNS</text>
  <text x="266" y="102" font-size="13" fill="#1b2a3a" font-family="monospace">int&lt;lower=0&gt; N;</text>
  <text x="266" y="120" font-size="13" fill="#1b2a3a" font-family="monospace">int&lt;lower=0&gt; y;</text>

  <!-- BLOCK 2 parameters -->
  <rect x="250" y="160" width="300" height="60" rx="6" fill="#eaf1f7" stroke="#bc4749" stroke-width="2"/>
  <text x="266" y="182" font-size="16" font-weight="bold" fill="#1b2a3a">parameters { }</text>
  <text x="392" y="182" font-size="13" fill="#bc4749">the UNKNOWNS</text>
  <text x="266" y="206" font-size="13" fill="#1b2a3a" font-family="monospace">real&lt;lower=0,upper=1&gt; theta;</text>

  <!-- BLOCK 3 model -->
  <rect x="250" y="250" width="300" height="82" rx="6" fill="#eaf1f7" stroke="#6a994e" stroke-width="2"/>
  <text x="266" y="272" font-size="16" font-weight="bold" fill="#1b2a3a">model { }</text>
  <text x="352" y="272" font-size="13" fill="#2a6f97">PRIORS + LIKELIHOOD</text>
  <text x="266" y="296" font-size="13" fill="#1b2a3a" font-family="monospace">theta ~ beta(2, 2);</text>
  <text x="266" y="316" font-size="13" fill="#1b2a3a" font-family="monospace">y ~ binomial(N, theta);</text>

  <!-- downward arrows between blocks -->
  <line x1="400" y1="130" x2="400" y2="159" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="400" y2="249" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- data in from LEFT -->
  <line x1="70" y1="96" x2="250" y2="96" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="70" y="74" font-size="13" fill="#2a6f97">R passes</text>
  <text x="70" y="88" font-size="13" font-weight="bold" fill="#2a6f97" font-family="monospace">list(N = 20, y = 13)</text>

  <!-- draws out to RIGHT -->
  <line x1="550" y1="291" x2="700" y2="291" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="628" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a6f97">posterior draws</text>
  <text x="628" y="308" text-anchor="middle" font-size="13" fill="#2a6f97">of θ</text>

  <!-- vertical order caption beside stack -->
  <text x="218" y="224" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 218 224)">order matters:  data → parameters → model</text>
</svg>
