<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.9 20.0 674.0 388.1" font-family="Helvetica, Arial, sans-serif" width="674.0" height="388.1">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- column highlight tints for the two on cells -->
  <rect x="160" y="52" width="70" height="270" fill="#2a6f97" opacity="0.08"/>
  <rect x="370" y="52" width="70" height="270" fill="#2a6f97" opacity="0.08"/>

  <!-- column labels -->
  <g font-size="12" text-anchor="middle" fill="#1b2a3a">
    <text x="125" y="48">cell_1</text>
    <text x="195" y="48" font-weight="bold" fill="#2a6f97">cell_2</text>
    <text x="265" y="48">cell_3</text>
    <text x="335" y="48">cell_4</text>
    <text x="405" y="48" font-weight="bold" fill="#2a6f97">cell_5</text>
    <text x="475" y="48">cell_6</text>
    <text x="545" y="48">cell_7</text>
    <text x="615" y="48">cell_8</text>
  </g>

  <!-- row (gene) labels -->
  <g font-size="13" text-anchor="end" fill="#1b2a3a" font-weight="bold">
    <text x="82" y="72">PCNA</text>
    <text x="82" y="96">MCM2</text>
    <text x="82" y="120">MCM6</text>
    <text x="82" y="144">TYMS</text>
    <text x="82" y="168">RRM2</text>
    <text x="82" y="192">GINS2</text>
  </g>

  <!-- heatmap cells (6 genes x 8 cells), light=low to dark=high log-norm expression -->
  <g stroke="#ffffff" stroke-width="1.5">
    <!-- PCNA -->
    <rect x="90"  y="56" width="70" height="24" fill="#d4e3f0"/>
    <rect x="160" y="56" width="70" height="24" fill="#1b2a3a"/>
    <rect x="230" y="56" width="70" height="24" fill="#eaf1f7"/>
    <rect x="300" y="56" width="70" height="24" fill="#d4e3f0"/>
    <rect x="370" y="56" width="70" height="24" fill="#2a6f97"/>
    <rect x="440" y="56" width="70" height="24" fill="#eaf1f7"/>
    <rect x="510" y="56" width="70" height="24" fill="#d4e3f0"/>
    <rect x="580" y="56" width="70" height="24" fill="#eaf1f7"/>
    <!-- MCM2 -->
    <rect x="90"  y="80" width="70" height="24" fill="#eaf1f7"/>
    <rect x="160" y="80" width="70" height="24" fill="#2a6f97"/>
    <rect x="230" y="80" width="70" height="24" fill="#d4e3f0"/>
    <rect x="300" y="80" width="70" height="24" fill="#eaf1f7"/>
    <rect x="370" y="80" width="70" height="24" fill="#1b2a3a"/>
    <rect x="440" y="80" width="70" height="24" fill="#d4e3f0"/>
    <rect x="510" y="80" width="70" height="24" fill="#eaf1f7"/>
    <rect x="580" y="80" width="70" height="24" fill="#d4e3f0"/>
    <!-- MCM6 -->
    <rect x="90"  y="104" width="70" height="24" fill="#d4e3f0"/>
    <rect x="160" y="104" width="70" height="24" fill="#1b2a3a"/>
    <rect x="230" y="104" width="70" height="24" fill="#eaf1f7"/>
    <rect x="300" y="104" width="70" height="24" fill="#d4e3f0"/>
    <rect x="370" y="104" width="70" height="24" fill="#2a6f97"/>
    <rect x="440" y="104" width="70" height="24" fill="#eaf1f7"/>
    <rect x="510" y="104" width="70" height="24" fill="#d4e3f0"/>
    <rect x="580" y="104" width="70" height="24" fill="#eaf1f7"/>
    <!-- TYMS -->
    <rect x="90"  y="128" width="70" height="24" fill="#eaf1f7"/>
    <rect x="160" y="128" width="70" height="24" fill="#2a6f97"/>
    <rect x="230" y="128" width="70" height="24" fill="#d4e3f0"/>
    <rect x="300" y="128" width="70" height="24" fill="#eaf1f7"/>
    <rect x="370" y="128" width="70" height="24" fill="#1b2a3a"/>
    <rect x="440" y="128" width="70" height="24" fill="#eaf1f7"/>
    <rect x="510" y="128" width="70" height="24" fill="#d4e3f0"/>
    <rect x="580" y="128" width="70" height="24" fill="#d4e3f0"/>
    <!-- RRM2 -->
    <rect x="90"  y="152" width="70" height="24" fill="#d4e3f0"/>
    <rect x="160" y="152" width="70" height="24" fill="#1b2a3a"/>
    <rect x="230" y="152" width="70" height="24" fill="#eaf1f7"/>
    <rect x="300" y="152" width="70" height="24" fill="#a9c8e0"/>
    <rect x="370" y="152" width="70" height="24" fill="#2a6f97"/>
    <rect x="440" y="152" width="70" height="24" fill="#d4e3f0"/>
    <rect x="510" y="152" width="70" height="24" fill="#eaf1f7"/>
    <rect x="580" y="152" width="70" height="24" fill="#eaf1f7"/>
    <!-- GINS2 -->
    <rect x="90"  y="176" width="70" height="24" fill="#eaf1f7"/>
    <rect x="160" y="176" width="70" height="24" fill="#2a6f97"/>
    <rect x="230" y="176" width="70" height="24" fill="#d4e3f0"/>
    <rect x="300" y="176" width="70" height="24" fill="#eaf1f7"/>
    <rect x="370" y="176" width="70" height="24" fill="#1b2a3a"/>
    <rect x="440" y="176" width="70" height="24" fill="#eaf1f7"/>
    <rect x="510" y="176" width="70" height="24" fill="#d4e3f0"/>
    <rect x="580" y="176" width="70" height="24" fill="#d4e3f0"/>
  </g>

  <!-- average down each column -->
  <line x1="350" y1="204" x2="350" y2="252" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="362" y="232" font-size="13" fill="#1b2a3a" font-style="italic">average down each column</text>

  <!-- score row: one bar per cell -->
  <line x1="90" y1="322" x2="650" y2="322" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="82" y="318" font-size="13" text-anchor="end" fill="#1b2a3a" font-weight="bold">Score_S(c)</text>
  <g>
    <rect x="105" y="314" width="40" height="8"  fill="#2a6f97"/>
    <rect x="175" y="270" width="40" height="52" fill="#1b2a3a"/>
    <rect x="245" y="314" width="40" height="8"  fill="#2a6f97"/>
    <rect x="315" y="311" width="40" height="11" fill="#2a6f97"/>
    <rect x="385" y="270" width="40" height="52" fill="#1b2a3a"/>
    <rect x="455" y="316" width="40" height="6"  fill="#2a6f97"/>
    <rect x="525" y="311" width="40" height="11" fill="#2a6f97"/>
    <rect x="595" y="314" width="40" height="8"  fill="#2a6f97"/>
  </g>

  <!-- formula -->
  <text x="350" y="358" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">Score_S(c) = (1/|S|) &#183; &#8721; x_gc   (g in S)</text>

  <!-- note -->
  <text x="350" y="386" text-anchor="middle" font-size="13" font-style="italic" fill="#2a6f97">one number per cell summarising the S program; don't trust any single gene</text>
</svg>
