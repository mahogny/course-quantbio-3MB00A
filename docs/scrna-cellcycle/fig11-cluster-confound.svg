<svg xmlns="http://www.w3.org/2000/svg" width="891.2" height="405" viewBox="4.8 8 891.2 405" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- PANEL A: Split -->
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b2a3a">A. Split</text>
  <text x="30" y="52" font-size="13" fill="#1b2a3a">one type split by phase</text>

  <!-- single-identity blob outline -->
  <ellipse cx="225" cy="140" rx="120" ry="78" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- dashed cluster boundary tearing the blob in two -->
  <path d="M225,62 C245,95 205,120 225,150 C245,185 205,205 225,222" fill="none" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- G1 cluster (blue circles, left) -->
  <circle cx="150" cy="110" r="7" fill="#2a6f97"/>
  <circle cx="178" cy="150" r="7" fill="#2a6f97"/>
  <circle cx="140" cy="140" r="7" fill="#2a6f97"/>
  <circle cx="192" cy="118" r="7" fill="#2a6f97"/>
  <circle cx="160" cy="182" r="7" fill="#2a6f97"/>
  <circle cx="200" cy="165" r="7" fill="#2a6f97"/>
  <circle cx="135" cy="170" r="7" fill="#2a6f97"/>
  <text x="120" y="235" font-size="13" font-weight="bold" fill="#2a6f97">G1 cluster</text>

  <!-- cycling cluster (red circles, right) SAME shape = same identity -->
  <circle cx="258" cy="112" r="7" fill="#bc4749"/>
  <circle cx="282" cy="150" r="7" fill="#bc4749"/>
  <circle cx="305" cy="128" r="7" fill="#bc4749"/>
  <circle cx="262" cy="172" r="7" fill="#bc4749"/>
  <circle cx="292" cy="185" r="7" fill="#bc4749"/>
  <circle cx="315" cy="160" r="7" fill="#bc4749"/>
  <circle cx="245" cy="140" r="7" fill="#bc4749"/>
  <text x="252" y="235" font-size="13" font-weight="bold" fill="#bc4749">cycling cluster</text>

  <text x="30" y="258" font-size="12.5" fill="#1b2a3a" font-style="italic">same identity, split into two clusters</text>

  <!-- PANEL B: Merge -->
  <text x="500" y="34" font-size="17" font-weight="bold" fill="#1b2a3a">B. Merge</text>
  <text x="500" y="52" font-size="13" fill="#1b2a3a">two types fused because both divide</text>

  <!-- one cluster boundary enclosing two different types -->
  <ellipse cx="670" cy="140" rx="130" ry="80" fill="#fbeded" stroke="#1b2a3a" stroke-width="2"/>

  <!-- type 1: circles, coloured cycling (red) -->
  <circle cx="610" cy="112" r="7" fill="#bc4749"/>
  <circle cx="638" cy="150" r="7" fill="#bc4749"/>
  <circle cx="600" cy="150" r="7" fill="#bc4749"/>
  <circle cx="655" cy="120" r="7" fill="#bc4749"/>
  <circle cx="618" cy="185" r="7" fill="#bc4749"/>

  <!-- type 2: triangles, also coloured cycling (red) -->
  <polygon points="712,104 720,120 704,120" fill="#bc4749"/>
  <polygon points="742,140 750,156 734,156" fill="#bc4749"/>
  <polygon points="700,150 708,166 692,166" fill="#bc4749"/>
  <polygon points="730,178 738,194 722,194" fill="#bc4749"/>
  <polygon points="695,124 703,140 687,140" fill="#bc4749"/>

  <text x="560" y="235" font-size="13" fill="#1b2a3a">type 1</text>
  <circle cx="612" cy="231" r="5.5" fill="#bc4749"/>
  <text x="700" y="235" font-size="13" fill="#1b2a3a">type 2</text>
  <polygon points="752,224 759,237 745,237" fill="#bc4749"/>
  <text x="500" y="258" font-size="12.5" fill="#1b2a3a" font-style="italic">both marked cycling → one cluster hides two types</text>

  <!-- divider -->
  <line x1="30" y1="272" x2="870" y2="272" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- CROSS-TAB TABLE -->
  <text x="40" y="294" font-size="15" font-weight="bold" fill="#1b2a3a">clusters × phase</text>

  <!-- column headers -->
  <text x="205" y="316" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">G1</text>
  <text x="275" y="316" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">S</text>
  <text x="345" y="316" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">G2M</text>

  <!-- grid -->
  <line x1="40"  y1="324" x2="380" y2="324" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="40"  y1="362" x2="380" y2="362" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="40"  y1="400" x2="380" y2="400" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="170" y1="300" x2="170" y2="400" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="240" y1="300" x2="240" y2="400" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="310" y1="300" x2="310" y2="400" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="380" y1="300" x2="380" y2="400" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="40"  y1="300" x2="40"  y2="400" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- highlight cells -->
  <rect x="170" y="324" width="70" height="38" fill="#eaf1f7"/>
  <rect x="240" y="362" width="70" height="38" fill="#fbeded"/>
  <rect x="310" y="362" width="70" height="38" fill="#fbeded"/>

  <!-- Cluster 0 row -->
  <text x="48"  y="348" font-size="14" fill="#1b2a3a">Cluster 0</text>
  <text x="205" y="348" font-size="14" font-weight="bold" fill="#2a6f97" text-anchor="middle">410</text>
  <text x="275" y="348" font-size="14" fill="#1b2a3a" text-anchor="middle">12</text>
  <text x="345" y="348" font-size="14" fill="#1b2a3a" text-anchor="middle">8</text>

  <!-- Cluster 3 row -->
  <text x="48"  y="386" font-size="14" fill="#1b2a3a">Cluster 3</text>
  <text x="205" y="386" font-size="14" fill="#1b2a3a" text-anchor="middle">18</text>
  <text x="275" y="386" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="middle">205</text>
  <text x="345" y="386" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="middle">190</text>

  <!-- annotations -->
  <line x1="382" y1="343" x2="440" y2="343" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="446" y="347" font-size="13" fill="#2a6f97">almost all G1</text>

  <line x1="382" y1="381" x2="440" y2="381" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="446" y="378" font-size="13" fill="#bc4749">almost all cycling</text>
  <text x="446" y="394" font-size="13" font-weight="bold" fill="#bc4749">→ red flag: cell-cycle artefact?</text>

  <!-- caveat -->
  <rect x="446" y="300" width="424" height="34" rx="5" fill="#f2f7ee" stroke="#6a994e" stroke-width="1.5"/>
  <text x="456" y="315" font-size="12" fill="#1b2a3a">but some real types (transit-amplifying) genuinely proliferate —</text>
  <text x="456" y="329" font-size="12" font-weight="bold" fill="#6a994e">flag to investigate, not a verdict</text>
</svg>
