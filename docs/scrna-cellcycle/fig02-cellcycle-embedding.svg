  <path d="M 178 315 C 300 300, 400 220, 470 128" fill="none" stroke="#1b2a3a" stroke-width="2.2" stroke-opacity="0.75" stroke-dasharray="1 0" marker-end="url(#arrow)"/>
  <text x="300" y="300" font-size="14" fill="#1b2a3a" transform="rotate(-27 300 300)">how far through the cycle</text>

  <!-- caption in the right margin, clear of all data points (max data x is 551) -->
  <text x="558" y="95" font-size="12.5" fill="#1b2a3a">dividing cells drift off &#8212;</text>
