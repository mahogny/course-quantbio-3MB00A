<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.7 -7.0 870.6 414.5" font-family="Helvetica, Arial, sans-serif" width="870.6" height="414.5">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL : Read the loadings ================= -->
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Read the loadings</text>

  <!-- baseline / zero axis -->
  <line x1="140" y1="60" x2="140" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <text x="140" y="318" font-size="12" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="300" y="318" font-size="12.5" fill="#1b2a3a" text-anchor="middle">PC1 loading  →</text>

  <!-- highlighted cell-cycle genes (long positive bars) -->
  <g font-size="13" fill="#1b2a3a">
    <rect x="140" y="66"  width="235" height="18" fill="#2a6f97"/>
    <text x="134" y="79" text-anchor="end" font-weight="bold">MKI67</text>
    <rect x="140" y="90"  width="215" height="18" fill="#2a6f97"/>
    <text x="134" y="103" text-anchor="end" font-weight="bold">TOP2A</text>
    <rect x="140" y="114" width="190" height="18" fill="#2a6f97"/>
    <text x="134" y="127" text-anchor="end" font-weight="bold">PCNA</text>
    <rect x="140" y="138" width="172" height="18" fill="#2a6f97"/>
    <text x="134" y="151" text-anchor="end" font-weight="bold">TYMS</text>
    <rect x="140" y="162" width="150" height="18" fill="#2a6f97"/>
    <text x="134" y="175" text-anchor="end" font-weight="bold">CCNB1</text>
  </g>

  <!-- cluster of other genes: tiny near-zero bars -->
  <g fill="#c9d3dd">
    <rect x="140" y="192" width="18" height="9"/>
    <rect x="140" y="204" width="10" height="9"/>
    <rect x="140" y="216" width="22" height="9"/>
    <rect x="140" y="228" width="7"  height="9"/>
    <rect x="140" y="240" width="15" height="9"/>
    <rect x="140" y="252" width="12" height="9"/>
    <rect x="140" y="264" width="20" height="9"/>
    <rect x="140" y="276" width="9"  height="9"/>
    <rect x="140" y="288" width="14" height="9"/>
  </g>
  <text x="134" y="245" text-anchor="end" font-size="12" fill="#8895a3" font-style="italic">other genes</text>

  <!-- annotation -->
  <line x1="300" y1="204" x2="300" y2="184" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="222" font-size="12.5" fill="#bc4749" font-weight="bold">top-loading genes are</text>
  <text x="235" y="239" font-size="12.5" fill="#bc4749" font-weight="bold">cell-cycle genes</text>
  <text x="235" y="263" font-size="12.5" fill="#1b2a3a">→ this PC IS the</text>
  <text x="235" y="280" font-size="12.5" fill="#1b2a3a">   cell cycle</text>

  <!-- divider -->
  <line x1="440" y1="20" x2="440" y2="330" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ================= RIGHT PANEL : Correlate with a covariate ============ -->
  <text x="470" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Correlate with a covariate</text>

  <!-- axes -->
  <line x1="510" y1="300" x2="850" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="300" x2="510" y2="55"  stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="325" font-size="13" fill="#1b2a3a" text-anchor="middle">PC1 score</text>
  <text x="497" y="175" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 497 175)">cell-cycle score</text>

  <!-- grid ticks -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="510" y1="240" x2="850" y2="240"/>
    <line x1="510" y1="180" x2="850" y2="180"/>
    <line x1="510" y1="120" x2="850" y2="120"/>
  </g>

  <!-- upward trend line -->
  <line x1="525" y1="285" x2="835" y2="80" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- scatter cloud (green points, positive linear) -->
  <g fill="#6a994e" opacity="0.85">
    <circle cx="540" cy="278" r="4.5"/>
    <circle cx="560" cy="262" r="4.5"/>
    <circle cx="558" cy="285" r="4.5"/>
    <circle cx="585" cy="255" r="4.5"/>
    <circle cx="590" cy="272" r="4.5"/>
    <circle cx="612" cy="245" r="4.5"/>
    <circle cx="620" cy="228" r="4.5"/>
    <circle cx="635" cy="255" r="4.5"/>
    <circle cx="650" cy="222" r="4.5"/>
    <circle cx="662" cy="238" r="4.5"/>
    <circle cx="675" cy="205" r="4.5"/>
    <circle cx="688" cy="222" r="4.5"/>
    <circle cx="700" cy="196" r="4.5"/>
    <circle cx="712" cy="180" r="4.5"/>
    <circle cx="708" cy="210" r="4.5"/>
    <circle cx="735" cy="168" r="4.5"/>
    <circle cx="742" cy="185" r="4.5"/>
    <circle cx="758" cy="150" r="4.5"/>
    <circle cx="770" cy="165" r="4.5"/>
    <circle cx="785" cy="132" r="4.5"/>
    <circle cx="798" cy="148" r="4.5"/>
    <circle cx="812" cy="118" r="4.5"/>
    <circle cx="825" cy="102" r="4.5"/>
    <circle cx="805" cy="128" r="4.5"/>
    <circle cx="775" cy="145" r="4.5"/>
    <circle cx="600" cy="260" r="4.5"/>
  </g>

  <!-- correlation labels -->
  <rect x="530" y="70" width="150" height="52" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="545" y="92" font-size="14" fill="#6a994e" font-weight="bold">S score:  r = 0.71</text>
  <text x="545" y="112" font-size="13" fill="#1b2a3a">G2M score:  r = 0.66</text>

  <!-- ================= FOOTER ================= -->
  <line x1="30" y1="352" x2="850" y2="352" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="440" y="380" font-size="14" fill="#1b2a3a" text-anchor="middle">Same recipe diagnoses batch, depth (nCount), stress (percent.mt)</text>
</svg>
