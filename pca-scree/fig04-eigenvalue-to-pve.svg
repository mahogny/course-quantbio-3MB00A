<svg xmlns="http://www.w3.org/2000/svg" viewBox="39.6 -3.6 595.4 363.1" font-family="Helvetica, Arial, sans-serif" width="595.4" height="363.1">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: raw eigenvalues -->
  <text x="97" y="28" font-size="16" fill="#1b2a3a">raw eigenvalues &#955;<tspan font-size="11" dy="4">k</tspan></text>

  <!-- left axes -->
  <line x1="60" y1="60" x2="60" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="60" y1="300" x2="290" y2="300" stroke="#1b2a3a" stroke-width="2"/>

  <!-- left bars: values 8.4 3.6 1.4 0.5 0.3 0.2, scale 24px per unit, max height ~ 8.4*24=201.6 -->
  <rect x="72"  y="98"  width="28" height="202" fill="#2a6f97"/>
  <rect x="108" y="214" width="28" height="86"  fill="#2a6f97"/>
  <rect x="144" y="266" width="28" height="34"  fill="#2a6f97"/>
  <rect x="180" y="288" width="28" height="12"  fill="#2a6f97"/>
  <rect x="216" y="293" width="28" height="7"   fill="#2a6f97"/>
  <rect x="252" y="295" width="28" height="5"   fill="#2a6f97"/>

  <!-- left x labels -->
  <text x="86"  y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC1</text>
  <text x="122" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC2</text>
  <text x="158" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC3</text>
  <text x="194" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC4</text>
  <text x="230" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC5</text>
  <text x="266" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC6</text>
  <text x="175" y="340" text-anchor="middle" font-size="13" fill="#1b2a3a">PC index</text>

  <!-- ARROW between panels -->
  <line x1="300" y1="180" x2="360" y2="180" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="168" text-anchor="middle" font-size="12" fill="#1b2a3a">divide by</text>
  <text x="332" y="204" text-anchor="middle" font-size="12" fill="#1b2a3a">total variance</text>

  <!-- RIGHT PANEL: PVE -->
  <text x="428" y="28" font-size="16" fill="#1b2a3a">PVE<tspan font-size="11" dy="4">k</tspan><tspan dy="-4"> = &#955;</tspan><tspan font-size="11" dy="4">k</tspan><tspan dy="-4"> / &#8721; &#955;</tspan><tspan font-size="11" dy="4">j</tspan></text>

  <!-- right axes -->
  <line x1="380" y1="60" x2="380" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="380" y1="300" x2="620" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <!-- y tick at 1.0 -->
  <line x1="375" y1="90" x2="380" y2="90" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="370" y="94" text-anchor="end" font-size="11" fill="#1b2a3a">1</text>
  <text x="370" y="304" text-anchor="end" font-size="11" fill="#1b2a3a">0</text>

  <!-- right bars: proportions 0.42 0.18 0.07 0.025 0.015 0.01, scale 210px per unit (1.0 -> 210, top at y=90) -->
  <rect x="396" y="212" width="28" height="88" fill="#2a6f97"/>
  <rect x="432" y="262" width="28" height="38" fill="#2a6f97"/>
  <rect x="468" y="285" width="28" height="15" fill="#2a6f97"/>
  <rect x="504" y="295" width="28" height="5"  fill="#2a6f97"/>
  <rect x="540" y="297" width="28" height="3"  fill="#2a6f97"/>
  <rect x="576" y="298" width="28" height="2"  fill="#2a6f97"/>

  <!-- right bar value labels -->
  <text x="410" y="204" text-anchor="middle" font-size="12" fill="#1b2a3a">0.42</text>
  <text x="446" y="254" text-anchor="middle" font-size="12" fill="#1b2a3a">0.18</text>
  <text x="482" y="277" text-anchor="middle" font-size="12" fill="#1b2a3a">0.07</text>

  <!-- right x labels -->
  <text x="410" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC1</text>
  <text x="446" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC2</text>
  <text x="482" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC3</text>
  <text x="518" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC4</text>
  <text x="554" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC5</text>
  <text x="590" y="318" text-anchor="middle" font-size="12" fill="#1b2a3a">PC6</text>
  <text x="500" y="340" text-anchor="middle" font-size="13" fill="#1b2a3a">PC index</text>

  <!-- brace over PC1-PC3 -->
  <path d="M396,182 C396,172 401,172 411,172 L474,172 C484,172 489,172 489,162 C489,172 494,172 504,172 C494,172 489,172 489,182"
        fill="none" stroke="#6a994e" stroke-width="2"/>
  <text x="482" y="150" text-anchor="middle" font-size="13" fill="#6a994e">cumulative = 0.42 + 0.18 + 0.07 = 0.67 (67%)</text>
</svg>
