<svg xmlns="http://www.w3.org/2000/svg" width="858.1" height="366.0" viewBox="16.8 -3.0 858.1 366.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: scale = FALSE -->
  <text x="220" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">scale. = FALSE (covariance PCA)</text>

  <!-- axes -->
  <line x1="60" y1="230" x2="410" y2="230" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="70" y1="90" x2="70" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="235" y="258" text-anchor="middle" font-size="14" fill="#1b2a3a">feature 1 (high-variance gene)</text>
  <text x="52" y="165" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 52 165)">feature 2</text>

  <!-- data cloud: hugely stretched horizontally -->
  <g fill="#8a97a4" opacity="0.85">
    <circle cx="95" cy="162" r="4"/><circle cx="120" cy="156" r="4"/><circle cx="150" cy="164" r="4"/>
    <circle cx="178" cy="150" r="4"/><circle cx="205" cy="160" r="4"/><circle cx="232" cy="152" r="4"/>
    <circle cx="258" cy="166" r="4"/><circle cx="285" cy="154" r="4"/><circle cx="312" cy="162" r="4"/>
    <circle cx="340" cy="156" r="4"/><circle cx="368" cy="164" r="4"/><circle cx="392" cy="158" r="4"/>
    <circle cx="135" cy="170" r="4"/><circle cx="222" cy="146" r="4"/><circle cx="300" cy="170" r="4"/>
    <circle cx="110" cy="150" r="4"/><circle cx="248" cy="158" r="4"/><circle cx="355" cy="150" r="4"/>
    <circle cx="190" cy="168" r="4"/><circle cx="270" cy="148" r="4"/>
  </g>

  <!-- PC1 arrow: almost pure horizontal -->
  <line x1="235" y1="159" x2="400" y2="157" stroke="#2a6f97" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="345" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">PC1</text>
  <text x="235" y="298" text-anchor="middle" font-size="13" font-style="italic" fill="#bc4749">big-variance feature dominates</text>

  <!-- divider -->
  <line x1="440" y1="60" x2="440" y2="300" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT PANEL: scale = TRUE -->
  <text x="660" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">scale. = TRUE (correlation PCA)</text>

  <!-- axes -->
  <line x1="500" y1="230" x2="850" y2="230" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="510" y1="90" x2="510" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="675" y="258" text-anchor="middle" font-size="14" fill="#1b2a3a">feature 1 (rescaled, σ = 1)</text>
  <text x="492" y="165" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 492 165)">feature 2</text>

  <!-- data cloud: rounder, diagonal correlation -->
  <g fill="#8a97a4" opacity="0.85">
    <circle cx="600" cy="195" r="4"/><circle cx="620" cy="180" r="4"/><circle cx="640" cy="188" r="4"/>
    <circle cx="655" cy="168" r="4"/><circle cx="670" cy="175" r="4"/><circle cx="660" cy="158" r="4"/>
    <circle cx="685" cy="165" r="4"/><circle cx="700" cy="150" r="4"/><circle cx="715" cy="160" r="4"/>
    <circle cx="720" cy="140" r="4"/><circle cx="735" cy="148" r="4"/><circle cx="750" cy="132" r="4"/>
    <circle cx="628" cy="200" r="4"/><circle cx="648" cy="178" r="4"/><circle cx="612" cy="170" r="4"/>
    <circle cx="678" cy="182" r="4"/><circle cx="708" cy="168" r="4"/><circle cx="690" cy="145" r="4"/>
    <circle cx="732" cy="162" r="4"/><circle cx="668" cy="192" r="4"/>
  </g>

  <!-- PC1 arrow: diagonal -->
  <line x1="640" y1="182" x2="748" y2="128" stroke="#2a6f97" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="718" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">PC1</text>
  <text x="680" y="298" text-anchor="middle" font-size="13" font-style="italic" fill="#6a994e">all features weighted equally</text>

  <!-- CAPTION spanning both -->
  <text x="440" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">same data, different PCs and different scree plot</text>
</svg>
