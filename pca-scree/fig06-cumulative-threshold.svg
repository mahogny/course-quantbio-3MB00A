<svg xmlns="http://www.w3.org/2000/svg" width="689.4" height="401.3" viewBox="-4.9 9.7 689.4 401.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- y axis gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="80" y1="265" x2="650" y2="265"/>
    <line x1="80" y1="190" x2="650" y2="190"/>
    <line x1="80" y1="115" x2="650" y2="115"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="80" y1="340" x2="662" y2="340" marker-end="url(#arrow)"/>
    <line x1="80" y1="340" x2="80" y2="32" marker-end="url(#arrow)"/>
  </g>

  <!-- y axis tick labels -->
  <g fill="#1b2a3a" font-size="14" text-anchor="end">
    <text x="72" y="345">0</text>
    <text x="72" y="270">0.25</text>
    <text x="72" y="195">0.5</text>
    <text x="72" y="120">0.75</text>
    <text x="72" y="45">1.0</text>
  </g>

  <!-- x axis ticks and labels -->
  <g fill="#1b2a3a" font-size="14" text-anchor="middle">
    <text x="80" y="360">1</text>
    <text x="131.8" y="360">2</text>
    <text x="183.6" y="360">3</text>
    <text x="235.5" y="360">4</text>
    <text x="287.3" y="360">5</text>
    <text x="339.1" y="360">6</text>
    <text x="390.9" y="360">7</text>
    <text x="442.7" y="360">8</text>
    <text x="494.5" y="360">9</text>
    <text x="546.4" y="360">10</text>
    <text x="598.2" y="360">11</text>
    <text x="650" y="360">12</text>
  </g>

  <!-- axis titles -->
  <text x="371" y="388" fill="#1b2a3a" font-size="16" text-anchor="middle">number of PCs (k)</text>
  <text x="26" y="190" fill="#1b2a3a" font-size="16" text-anchor="middle" transform="rotate(-90 26 190)">cumulative PVE</text>

  <!-- 90% threshold horizontal dashed line -->
  <line x1="80" y1="70" x2="650" y2="70" stroke="#bc4749" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="646" y="63" fill="#bc4749" font-size="14" text-anchor="end" font-weight="bold">90% threshold</text>

  <!-- vertical drop line at k=7 -->
  <line x1="390.9" y1="68.5" x2="390.9" y2="340" stroke="#bc4749" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- cumulative PVE curve -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
    points="80,214 131.8,160 183.6,139 235.5,119.5 287.3,100 339.1,82 390.9,68.5 442.7,59.5 494.5,53.5 546.4,49.6 598.2,47.5 650,46"/>

  <!-- data points -->
  <g fill="#2a6f97">
    <circle cx="80" cy="214" r="3.5"/>
    <circle cx="131.8" cy="160" r="3.5"/>
    <circle cx="183.6" cy="139" r="3.5"/>
    <circle cx="235.5" cy="119.5" r="3.5"/>
    <circle cx="287.3" cy="100" r="3.5"/>
    <circle cx="339.1" cy="82" r="3.5"/>
    <circle cx="442.7" cy="59.5" r="3.5"/>
    <circle cx="494.5" cy="53.5" r="3.5"/>
    <circle cx="546.4" cy="49.6" r="3.5"/>
    <circle cx="598.2" cy="47.5" r="3.5"/>
    <circle cx="650" cy="46" r="3.5"/>
  </g>

  <!-- highlighted crossing point at k=7 -->
  <circle cx="390.9" cy="68.5" r="6.5" fill="#6a994e" stroke="#ffffff" stroke-width="2"/>

  <!-- annotation for k=7 -->
  <text x="405" y="112" fill="#6a994e" font-size="13.5" font-weight="bold">smallest k with</text>
  <text x="405" y="129" fill="#6a994e" font-size="13.5" font-weight="bold">cumulative PVE ≥ 0.90</text>

  <!-- note near flat tail -->
  <text x="560" y="95" fill="#1b2a3a" font-size="12.5" text-anchor="middle">last few percent</text>
  <text x="560" y="111" fill="#1b2a3a" font-size="12.5" text-anchor="middle">cost many PCs</text>
</svg>
