<svg xmlns="http://www.w3.org/2000/svg" width="650.0" height="284.7" viewBox="24.6 82.0 650.0 284.7" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="300" x2="620" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="70" y1="300" x2="70" y2="120" stroke="#1b2a3a" stroke-width="2"/>
  <polygon points="620,300 611,295 611,305" fill="#1b2a3a"/>
  <polygon points="70,120 65,129 75,129" fill="#1b2a3a"/>
  <text x="628" y="305" font-size="16" fill="#1b2a3a">PC1</text>
  <text x="58" y="112" font-size="16" fill="#1b2a3a" text-anchor="middle">PC2</text>

  <!-- tight grey blob of ~40 samples on the left -->
  <g fill="#8b98a5">
    <circle cx="120" cy="210" r="4"/><circle cx="132" cy="198" r="4"/><circle cx="127" cy="223" r="4"/>
    <circle cx="141" cy="212" r="4"/><circle cx="115" cy="196" r="4"/><circle cx="136" cy="230" r="4"/>
    <circle cx="150" cy="204" r="4"/><circle cx="123" cy="188" r="4"/><circle cx="144" cy="224" r="4"/>
    <circle cx="112" cy="218" r="4"/><circle cx="158" cy="216" r="4"/><circle cx="130" cy="212" r="4"/>
    <circle cx="148" cy="192" r="4"/><circle cx="118" cy="234" r="4"/><circle cx="138" cy="184" r="4"/>
    <circle cx="126" cy="206" r="4"/><circle cx="154" cy="228" r="4"/><circle cx="110" cy="206" r="4"/>
    <circle cx="143" cy="200" r="4"/><circle cx="134" cy="220" r="4"/><circle cx="121" cy="200" r="4"/>
    <circle cx="152" cy="196" r="4"/><circle cx="116" cy="224" r="4"/><circle cx="140" cy="216" r="4"/>
    <circle cx="128" cy="232" r="4"/><circle cx="146" cy="208" r="4"/><circle cx="119" cy="212" r="4"/>
    <circle cx="156" cy="200" r="4"/><circle cx="124" cy="216" r="4"/><circle cx="137" cy="204" r="4"/>
    <circle cx="113" cy="202" r="4"/><circle cx="149" cy="220" r="4"/><circle cx="131" cy="228" r="4"/>
    <circle cx="122" cy="194" r="4"/><circle cx="145" cy="188" r="4"/><circle cx="117" cy="210" r="4"/>
    <circle cx="153" cy="210" r="4"/><circle cx="135" cy="196" r="4"/><circle cx="125" cy="200" r="4"/>
    <circle cx="142" cy="232" r="4"/>
  </g>

  <!-- lone red outlier far right -->
  <circle cx="560" cy="210" r="7" fill="#bc4749"/>
  <text x="560" y="188" font-size="14" fill="#bc4749" text-anchor="middle" font-weight="bold">aberrant sample</text>

  <!-- PC1 arrow bent toward the outlier -->
  <line x1="135" y1="210" x2="552" y2="210" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="200" font-size="15" fill="#2a6f97" font-style="italic">PC1 bent toward the outlier</text>

  <!-- annotation near blob -->
  <line x1="180" y1="262" x2="140" y2="238" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="184" y="272" font-size="13.5" fill="#5a6570">all other samples squashed together</text>

  <!-- caption -->
  <text x="330" y="345" font-size="15" fill="#1b2a3a" text-anchor="middle">a PC that explains only ONE point's variance</text>
</svg>
