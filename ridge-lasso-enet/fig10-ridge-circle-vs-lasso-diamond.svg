<svg xmlns="http://www.w3.org/2000/svg" viewBox="57.1 0.6 808.4 435.9" width="808.4" height="435.9" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL : RIDGE ============ -->
  <g transform="translate(20,10)">
    <text x="185" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#1b2a3a">Ridge:  ∑ β_j^2 ≤ t</text>

    <!-- axes -->
    <line x1="60" y1="250" x2="312" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="150" y1="322" x2="150" y2="86" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="318" y="255" font-size="15" fill="#1b2a3a">β_1</text>
    <text x="140" y="82" font-size="15" fill="#1b2a3a">β_2</text>

    <!-- RSS contour family (blue ellipses, centred on OLS) -->
    <g transform="rotate(-35 260 170)" fill="none" stroke-width="1.6">
      <ellipse cx="260" cy="170" rx="35"  ry="19"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="108" ry="59"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="138" ry="76"  stroke="#9dc3de"/>
      <!-- smallest ellipse that just touches the circle -->
      <ellipse cx="260" cy="170" rx="76"  ry="42"  stroke="#2a6f97" stroke-width="2.4"/>
    </g>

    <!-- ridge constraint: red disk at origin -->
    <circle cx="150" cy="250" r="60" fill="#bc4749" fill-opacity="0.12" stroke="#bc4749" stroke-width="2"/>

    <!-- OLS point -->
    <circle cx="260" cy="170" r="4.5" fill="#1b2a3a"/>
    <text x="270" y="164" font-size="15" fill="#1b2a3a">β̂_OLS</text>

    <!-- touch point (generic, both coords nonzero) -->
    <circle cx="195" cy="210" r="5" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="200" y1="286" x2="196" y2="216" stroke="#1b2a3a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="118" y="302" font-size="14" fill="#1b2a3a">touches at a generic point →</text>
    <text x="118" y="320" font-size="14" fill="#1b2a3a">both coefficients nonzero</text>
  </g>

  <!-- ============ RIGHT PANEL : LASSO ============ -->
  <g transform="translate(460,10)">
    <text x="185" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#1b2a3a">Lasso:  ∑ |β_j| ≤ t</text>

    <!-- axes -->
    <line x1="60" y1="250" x2="312" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="150" y1="322" x2="150" y2="86" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="318" y="255" font-size="15" fill="#1b2a3a">β_1</text>
    <text x="140" y="82" font-size="15" fill="#1b2a3a">β_2</text>

    <!-- SAME RSS contour family -->
    <g transform="rotate(-35 260 170)" fill="none" stroke-width="1.6">
      <ellipse cx="260" cy="170" rx="35"  ry="19"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="76"  ry="42"  stroke="#9dc3de"/>
      <ellipse cx="260" cy="170" rx="108" ry="59"  stroke="#9dc3de"/>
      <!-- smallest ellipse that just touches the diamond corner -->
      <ellipse cx="260" cy="170" rx="138" ry="76"  stroke="#2a6f97" stroke-width="2.4"/>
    </g>

    <!-- lasso constraint: red diamond at origin (corners on the axes) -->
    <polygon points="220,250 150,180 80,250 150,320" fill="#bc4749" fill-opacity="0.12" stroke="#bc4749" stroke-width="2"/>

    <!-- OLS point -->
    <circle cx="260" cy="170" r="4.5" fill="#1b2a3a"/>
    <text x="270" y="164" font-size="15" fill="#1b2a3a">β̂_OLS</text>

    <!-- touch point at TOP corner on the β2-axis -->
    <circle cx="150" cy="180" r="5" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.2"/>
    <line x1="212" y1="196" x2="158" y2="182" stroke="#1b2a3a" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="214" y="196" font-size="14" fill="#1b2a3a">touches at a corner</text>
    <text x="214" y="214" font-size="14" fill="#1b2a3a">on the axis →  β_1 = 0</text>
  </g>

  <!-- shared caption -->
  <text x="440" y="410" text-anchor="middle" font-size="15" font-style="italic" fill="#1b2a3a">the penalized estimate is where the smallest RSS ellipse first meets the budget region.</text>
</svg>
