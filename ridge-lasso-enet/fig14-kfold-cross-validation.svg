<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" width="900" height="375" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      /* Base colours are set as presentation attributes (light theme) so every
         renderer, including cairosvg, shows them. Dark theme overrides via class. */
      @media (prefers-color-scheme: dark) {
        .ink   { fill:   #e6edf3; }
        .inkS  { stroke: #e6edf3; }
        .train { fill:   #2b3b4b; stroke: #4c6076; }
        .grid  { stroke: #54636f; }
        .tint  { fill:   #22303d; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ================= TITLE LINE ================= -->
  <text x="320" y="26" font-size="14.5" font-weight="bold" class="ink" fill="#1b2a3a" text-anchor="middle">all n samples, split into k = 10 equal folds</text>

  <!-- ================= TOP BAR : 10 fold blocks (blue ramp) ================= -->
  <g stroke-width="1.5" class="inkS" stroke="#1b2a3a">
    <rect x="70"  y="34" width="50" height="28" fill="#e8f0f8"/>
    <rect x="120" y="34" width="50" height="28" fill="#d3e3f1"/>
    <rect x="170" y="34" width="50" height="28" fill="#bcd4ea"/>
    <rect x="220" y="34" width="50" height="28" fill="#a3c4e0"/>
    <rect x="270" y="34" width="50" height="28" fill="#86b0d6"/>
    <rect x="320" y="34" width="50" height="28" fill="#6a9bc8"/>
    <rect x="370" y="34" width="50" height="28" fill="#4f86ba"/>
    <rect x="420" y="34" width="50" height="28" fill="#3a70a3"/>
    <rect x="470" y="34" width="50" height="28" fill="#2a5a86"/>
    <rect x="520" y="34" width="50" height="28" fill="#1b4568"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="95"  y="53" fill="#1b2a3a">1</text>
    <text x="145" y="53" fill="#1b2a3a">2</text>
    <text x="195" y="53" fill="#1b2a3a">3</text>
    <text x="245" y="53" fill="#1b2a3a">4</text>
    <text x="295" y="53" fill="#1b2a3a">5</text>
    <text x="345" y="53" fill="#ffffff">6</text>
    <text x="395" y="53" fill="#ffffff">7</text>
    <text x="445" y="53" fill="#ffffff">8</text>
    <text x="495" y="53" fill="#ffffff">9</text>
    <text x="545" y="53" fill="#ffffff">10</text>
  </g>
  <text x="590" y="52" font-size="12.5" class="ink" fill="#1b2a3a">fold 1 … fold 10</text>

  <!-- ================= 10 ITERATION ROWS ================= -->
  <text x="70" y="84" font-size="12" class="ink" fill="#1b2a3a" opacity="0.85">10 iterations (rows) — each fold is the test set exactly once:</text>

  <!-- per-row train background -->
  <g class="train" stroke="#a7bccf" stroke-width="1" fill="#e3edf6">
    <rect x="70" y="92"  width="500" height="20"/>
    <rect x="70" y="116" width="500" height="20"/>
    <rect x="70" y="140" width="500" height="20"/>
    <rect x="70" y="164" width="500" height="20"/>
    <rect x="70" y="188" width="500" height="20"/>
    <rect x="70" y="212" width="500" height="20"/>
    <rect x="70" y="236" width="500" height="20"/>
    <rect x="70" y="260" width="500" height="20"/>
    <rect x="70" y="284" width="500" height="20"/>
    <rect x="70" y="308" width="500" height="20"/>
  </g>

  <!-- diagonal held-out TEST blocks (red) -->
  <g fill="#bc4749" stroke="#8f3336" stroke-width="1.2">
    <rect x="70"  y="92"  width="50" height="20"/>
    <rect x="120" y="116" width="50" height="20"/>
    <rect x="170" y="140" width="50" height="20"/>
    <rect x="220" y="164" width="50" height="20"/>
    <rect x="270" y="188" width="50" height="20"/>
    <rect x="320" y="212" width="50" height="20"/>
    <rect x="370" y="236" width="50" height="20"/>
    <rect x="420" y="260" width="50" height="20"/>
    <rect x="470" y="284" width="50" height="20"/>
    <rect x="520" y="308" width="50" height="20"/>
  </g>
  <g fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">
    <text x="95"  y="106">TEST</text>
    <text x="145" y="130">TEST</text>
    <text x="195" y="154">TEST</text>
    <text x="245" y="178">TEST</text>
    <text x="295" y="202">TEST</text>
    <text x="345" y="226">TEST</text>
    <text x="395" y="250">TEST</text>
    <text x="445" y="274">TEST</text>
    <text x="495" y="298">TEST</text>
    <text x="545" y="322">TEST</text>
  </g>

  <!-- vertical fold dividers across the row block -->
  <g class="grid" stroke="#c9d3dd" stroke-width="1">
    <line x1="120" y1="92" x2="120" y2="328"/>
    <line x1="170" y1="92" x2="170" y2="328"/>
    <line x1="220" y1="92" x2="220" y2="328"/>
    <line x1="270" y1="92" x2="270" y2="328"/>
    <line x1="320" y1="92" x2="320" y2="328"/>
    <line x1="370" y1="92" x2="370" y2="328"/>
    <line x1="420" y1="92" x2="420" y2="328"/>
    <line x1="470" y1="92" x2="470" y2="328"/>
    <line x1="520" y1="92" x2="520" y2="328"/>
  </g>

  <!-- iteration index -->
  <g font-size="12" class="ink" fill="#1b2a3a" text-anchor="end">
    <text x="62" y="107">1</text>
    <text x="62" y="131">2</text>
    <text x="62" y="155">3</text>
    <text x="62" y="179">4</text>
    <text x="62" y="203">5</text>
    <text x="62" y="227">6</text>
    <text x="62" y="251">7</text>
    <text x="62" y="275">8</text>
    <text x="62" y="299">9</text>
    <text x="62" y="323">10</text>
  </g>

  <!-- legend: train vs test -->
  <g font-size="12" class="ink" fill="#1b2a3a">
    <rect x="70" y="336" width="16" height="11" class="train" fill="#e3edf6" stroke="#a7bccf" stroke-width="1"/>
    <text x="91" y="345">train (9 folds)</text>
    <rect x="190" y="336" width="16" height="11" fill="#bc4749" stroke="#8f3336" stroke-width="1"/>
    <text x="211" y="345">held-out test fold</text>
  </g>

  <!-- ================= CURLY BRACE then AVERAGE BOX ================= -->
  <path d="M580,92 C592,92 588,206 600,210 C588,214 592,328 580,328"
        fill="none" stroke="#2a6f97" stroke-width="2"/>
  <line x1="600" y1="210" x2="642" y2="210" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="642" y="164" width="248" height="90" rx="6" fill="#eaf1f7" class="tint inkS" stroke="#1b2a3a" stroke-width="2"/>
  <text x="766" y="196" font-size="14" class="ink" fill="#1b2a3a" text-anchor="middle">average the 10 fold errors</text>
  <text x="766" y="228" font-size="15.5" font-weight="bold" fill="#2a6f97" text-anchor="middle">→ CV error for this λ</text>

  <!-- ================= CAPTION : grid over lambda ================= -->
  <text x="642" y="282" font-size="13" font-weight="bold" class="ink" fill="#1b2a3a">repeat over a grid of λ:</text>
  <text x="642" y="301" font-size="12.5" fill="#6a994e" font-weight="bold">λ.min</text>
  <text x="695" y="301" font-size="12.5" class="ink" fill="#1b2a3a">= lowest CV error</text>
  <text x="642" y="319" font-size="12.5" fill="#6a994e" font-weight="bold">λ.1se</text>
  <text x="695" y="319" font-size="12.5" class="ink" fill="#1b2a3a">= simplest within 1 SE</text>

  <!-- ================= BOTTOM LABEL ================= -->
  <text x="320" y="365" font-size="13.5" font-weight="bold" class="ink" fill="#1b2a3a" text-anchor="middle">train on 9 folds, predict the held-out fold — every sample is held out exactly once</text>
</svg>
