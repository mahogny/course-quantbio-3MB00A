<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="11" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L10,3.2 L0,6.4 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===== RSS valley: long narrow ellipses hugging the line ===== -->
  <g transform="rotate(45 342 158)">
    <ellipse cx="342" cy="158" rx="162" ry="27" fill="#eaf1f7" fill-opacity="0.55" stroke="#2a6f97" stroke-width="1.3"/>
    <ellipse cx="342" cy="158" rx="116" ry="17" fill="#eaf1f7" fill-opacity="0.7" stroke="#2a6f97" stroke-width="1.3"/>
    <ellipse cx="342" cy="158" rx="70" ry="9" fill="#eaf1f7" fill-opacity="0.85" stroke="#2a6f97" stroke-width="1.4"/>
  </g>
  <text x="612" y="98" font-size="12.5" fill="#2a6f97" text-anchor="middle">elongated RSS contours</text>
  <text x="612" y="114" font-size="12.5" fill="#2a6f97" text-anchor="middle">(a long, flat trough)</text>

  <!-- ===== axes ===== -->
  <line x1="170" y1="200" x2="486" y2="200" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300" y1="332" x2="300" y2="22" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="492" y="215" font-size="15" fill="#1b2a3a">β1 (gene g1)</text>
  <text x="306" y="34" font-size="15" fill="#1b2a3a">β2 (gene g2)</text>

  <!-- axis ticks -->
  <g font-size="11" fill="#7d8a97" text-anchor="middle">
    <text x="216" y="216">-2</text>
    <text x="384" y="216">2</text>
    <text x="468" y="216">4</text>
    <text x="288" y="36" text-anchor="end">4</text>
    <text x="288" y="120" text-anchor="end">2</text>
    <text x="288" y="288" text-anchor="end">-2</text>
  </g>

  <!-- ===== ridge constraint ball  b1^2 + b2^2 <= t ===== -->
  <circle cx="300" cy="200" r="59" fill="#6a994e" fill-opacity="0.10" stroke="#6a994e" stroke-width="1.7"/>
  <text x="246" y="223" font-size="12" fill="#6a994e">β1^2 + β2^2 ≤ t</text>

  <!-- ===== solution valley line  b1 + b2 = 2 ===== -->
  <line x1="195" y1="11" x2="486" y2="301" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="399" y="215" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(45 399 215)">β1 + β2 = 2  (solution valley)</text>
  <text x="512" y="286" font-size="12.5" fill="#7d8a97">line extends</text>
  <text x="512" y="302" font-size="12.5" fill="#7d8a97">off-screen →</text>

  <!-- ===== off-screen OLS solution (huge, sign-flipped) ===== -->
  <line x1="222" y1="41" x2="118" y2="12" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="14" y="30" font-size="13.5" fill="#bc4749" font-weight="bold">(100, -98)</text>
  <text x="14" y="46" font-size="12" fill="#bc4749">huge, sign-flipped</text>

  <!-- ===== example OLS solutions on the valley ===== -->
  <circle cx="258" cy="74" r="5" fill="#2a6f97"/>
  <text x="266" y="70" font-size="13" fill="#2a6f97">(-1, 3)</text>
  <circle cx="426" cy="242" r="5" fill="#2a6f97"/>
  <text x="434" y="247" font-size="13" fill="#2a6f97">(3, -1)</text>

  <!-- ===== ridge solution: tangent point (1,1) ===== -->
  <circle cx="342" cy="158" r="6.5" fill="#6a994e" stroke="#ffffff" stroke-width="1.3"/>
  <line x1="352" y1="152" x2="404" y2="128" stroke="#6a994e" stroke-width="1.1"/>
  <text x="410" y="124" font-size="13.5" fill="#6a994e" font-weight="bold">Ridge → (1, 1)</text>
  <text x="410" y="140" font-size="12.5" fill="#6a994e">smallest, balanced (β1 ≈ β2)</text>

  <!-- ===== bottom annotation ===== -->
  <text x="360" y="392" font-size="13.5" fill="#1b2a3a" text-anchor="middle">OLS: any point on the valley (unstable) — Ridge picks the shortest, spreading weight evenly.</text>
</svg>
