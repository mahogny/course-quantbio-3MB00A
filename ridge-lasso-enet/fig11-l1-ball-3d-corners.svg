<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.6 -0.9 779.4 411.7" font-family="Helvetica, Arial, sans-serif" width="779.4" height="411.7">
  <defs>
    <marker id="arrowN" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a97a3"/>
    </marker>
  </defs>

  <!-- heading -->
  <text x="20" y="34" font-size="16" font-weight="bold" fill="#1b2a3a">L1 ball (lasso):  |β1| + |β2| + |β3| ≤ t</text>

  <!-- coordinate axes through origin (330,185) -->
  <g stroke="#8a97a3" stroke-width="1.5">
    <line x1="233" y1="129" x2="427" y2="241" marker-end="url(#arrowA)"/>
    <line x1="427" y1="129" x2="233" y2="241" marker-end="url(#arrowA)"/>
    <line x1="330" y1="297" x2="330" y2="72" marker-end="url(#arrowA)"/>
  </g>
  <text x="432" y="252" font-size="15" fill="#1b2a3a">β1</text>
  <text x="205" y="252" font-size="15" fill="#1b2a3a">β2</text>
  <text x="298" y="78" font-size="15" fill="#1b2a3a">β3</text>

  <!-- faint shaded front face  V1+ V2+ V3+ -->
  <polygon points="408,230 252,230 330,95" fill="#2a6f97" opacity="0.10"/>

  <!-- hidden (back) edges: dashed -->
  <g stroke="#9fb0bd" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <line x1="252" y1="140" x2="408" y2="140"/>
    <line x1="408" y1="140" x2="330" y2="275"/>
    <line x1="252" y1="140" x2="330" y2="275"/>
  </g>

  <!-- visible (front) edges: solid -->
  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <line x1="252" y1="230" x2="330" y2="95"/>
    <line x1="330" y1="95" x2="408" y2="230"/>
    <line x1="408" y1="230" x2="408" y2="140"/>
    <line x1="408" y1="230" x2="330" y2="275"/>
    <line x1="252" y1="230" x2="252" y2="140"/>
    <line x1="252" y1="230" x2="330" y2="275"/>
    <line x1="330" y1="95" x2="252" y2="140"/>
    <line x1="330" y1="95" x2="408" y2="140"/>
  </g>

  <!-- highlighted EDGE in coordinate plane β3 = 0 (green overlay) -->
  <line x1="408" y1="230" x2="252" y2="230" stroke="#6a994e" stroke-width="4.5"/>

  <!-- small dots on all corners -->
  <g fill="#1b2a3a">
    <circle cx="408" cy="230" r="3"/>
    <circle cx="252" cy="230" r="3"/>
    <circle cx="408" cy="140" r="3"/>
    <circle cx="252" cy="140" r="3"/>
    <circle cx="330" cy="275" r="3"/>
  </g>
  <!-- origin -->
  <circle cx="330" cy="185" r="2.5" fill="#8a97a3"/>

  <!-- highlighted VERTEX on β3 axis (0,0,t) -->
  <circle cx="330" cy="95" r="7" fill="#bc4749" stroke="#ffffff" stroke-width="1.5"/>

  <!-- vertex callout -->
  <path d="M440,88 Q392,86 342,94" fill="none" stroke="#1b2a3a" stroke-width="1.4" marker-end="url(#arrowN)"/>
  <text x="446" y="80" font-size="13.5" fill="#1b2a3a">vertex on an axis</text>
  <text x="446" y="97" font-size="13.5" fill="#bc4749">→ other 2 coefficients = 0</text>

  <!-- edge callout -->
  <path d="M175,250 Q235,240 292,231" fill="none" stroke="#1b2a3a" stroke-width="1.4" marker-end="url(#arrowN)"/>
  <text x="24" y="240" font-size="13.5" fill="#1b2a3a">edge in a coordinate plane</text>
  <text x="24" y="257" font-size="13.5" fill="#6a994e">→ 1 coefficient = 0</text>

  <!-- L2 ghost ball (ridge) -->
  <g>
    <circle cx="660" cy="180" r="70" fill="#eaf1f7" opacity="0.6" stroke="#9fb0bd" stroke-width="1.6"/>
    <ellipse cx="660" cy="180" rx="70" ry="22" fill="none" stroke="#c9d3dd" stroke-width="1.3"/>
    <ellipse cx="660" cy="180" rx="22" ry="70" fill="none" stroke="#c9d3dd" stroke-width="1.3"/>
  </g>
  <text x="660" y="278" font-size="13.5" fill="#1b2a3a" text-anchor="middle">L2 ball: smooth, no corners</text>
  <text x="660" y="295" font-size="13.5" fill="#8a97a3" text-anchor="middle">→ nothing zeroed</text>

  <!-- caption -->
  <text x="410" y="368" font-size="13.5" fill="#1b2a3a" text-anchor="middle">The pointy corners and edges lie in coordinate subspaces, so touching them sets many coefficients to exactly zero —</text>
  <text x="410" y="386" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">how lasso prunes thousands of genes to a handful.</text>
</svg>
