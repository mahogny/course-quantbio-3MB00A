<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL : CORRECT ================= -->
  <rect x="12" y="12" width="500" height="376" rx="10" fill="#f4f9f4" stroke="#6a994e" stroke-width="2"/>
  <text x="262" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">P %*% P  (matrix power, CORRECT)</text>

  <!-- first M -->
  <text x="70" y="120" font-size="26" fill="#1b2a3a">[</text>
  <!-- row1 highlight -->
  <rect x="82" y="86" width="72" height="30" rx="4" fill="#cfe3f2" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="98" y="108" font-size="20" fill="#1b2a3a">a</text>
  <text x="132" y="108" font-size="20" fill="#1b2a3a">b</text>
  <text x="98" y="140" font-size="20" fill="#1b2a3a">c</text>
  <text x="132" y="140" font-size="20" fill="#1b2a3a">d</text>
  <text x="160" y="128" font-size="26" fill="#1b2a3a">]</text>

  <text x="184" y="122" font-size="22" fill="#1b2a3a">·</text>

  <!-- second M -->
  <text x="204" y="120" font-size="26" fill="#1b2a3a">[</text>
  <!-- col1 highlight -->
  <rect x="216" y="86" width="34" height="62" rx="4" fill="#dbeecf" stroke="#6a994e" stroke-width="1.5"/>
  <text x="226" y="108" font-size="20" fill="#1b2a3a">a</text>
  <text x="262" y="108" font-size="20" fill="#1b2a3a">b</text>
  <text x="226" y="140" font-size="20" fill="#1b2a3a">c</text>
  <text x="262" y="140" font-size="20" fill="#1b2a3a">d</text>
  <text x="288" y="128" font-size="26" fill="#1b2a3a">]</text>

  <!-- dot product explanation -->
  <text x="70" y="192" font-size="16" fill="#2a6f97" font-weight="bold">row 1 (a, b)  ·  col 1 (a, c)</text>
  <text x="70" y="216" font-size="18" fill="#1b2a3a">result[1,1] =</text>
  <text x="188" y="216" font-size="18" font-weight="bold" fill="#6a994e">a·a + b·c</text>

  <!-- arrow to result cell -->
  <path d="M235 226 Q235 258 165 274" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result matrix -->
  <text x="70" y="330" font-size="24" fill="#1b2a3a">[</text>
  <rect x="86" y="256" width="86" height="34" rx="4" fill="#e6f2dc" stroke="#6a994e" stroke-width="1.5"/>
  <text x="129" y="280" text-anchor="middle" font-size="15" fill="#1b2a3a">a·a+b·c</text>
  <text x="222" y="280" text-anchor="middle" font-size="15" fill="#1b2a3a">a·b+b·d</text>
  <text x="129" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">c·a+d·c</text>
  <text x="222" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">c·b+d·d</text>
  <text x="272" y="330" font-size="24" fill="#1b2a3a">]</text>
  <text x="70" y="368" font-size="14" fill="#6a994e">dot products mix rows &amp; columns — a real 2-step matrix</text>

  <!-- ================= RIGHT PANEL : WRONG ================= -->
  <rect x="540" y="12" width="328" height="376" rx="10" fill="#fbf1f1" stroke="#bc4749" stroke-width="2"/>
  <text x="704" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">P^2  (elementwise, WRONG)</text>

  <!-- red X badge -->
  <circle cx="704" cy="86" r="20" fill="#fff" stroke="#bc4749" stroke-width="2.5"/>
  <path d="M695 77 L713 95 M713 77 L695 95" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>

  <text x="590" y="180" font-size="18" fill="#1b2a3a">each entry squared on its own</text>

  <!-- result matrix -->
  <text x="600" y="250" font-size="30" fill="#1b2a3a">[</text>
  <rect x="618" y="212" width="52" height="34" rx="4" fill="#f4d7d7" stroke="#bc4749" stroke-width="1.5"/>
  <text x="644" y="236" text-anchor="middle" font-size="18" fill="#bc4749">a²</text>
  <text x="716" y="236" text-anchor="middle" font-size="18" fill="#bc4749">b²</text>
  <text x="644" y="278" text-anchor="middle" font-size="18" fill="#bc4749">c²</text>
  <text x="716" y="278" text-anchor="middle" font-size="18" fill="#bc4749">d²</text>
  <text x="742" y="262" font-size="30" fill="#1b2a3a">]</text>

  <text x="590" y="330" font-size="14" fill="#bc4749" font-weight="bold">squares each entry independently —</text>
  <text x="590" y="350" font-size="14" fill="#bc4749" font-weight="bold">NOT a 2-step transition matrix</text>

  <!-- ≠ between panels -->
  <text x="524" y="215" text-anchor="middle" font-size="30" font-weight="bold" fill="#bc4749">≠</text>
</svg>
