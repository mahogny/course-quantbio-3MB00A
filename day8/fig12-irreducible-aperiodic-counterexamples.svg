<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="410" y1="40" x2="410" y2="300" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ================= LEFT PANEL: Periodic ================= -->
  <text x="205" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#bc4749">Periodic (not aperiodic)</text>

  <!-- node 1 -->
  <circle cx="120" cy="110" r="30" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="120" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">1</text>
  <!-- node 2 -->
  <circle cx="290" cy="110" r="30" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="290" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">2</text>

  <!-- arrow 1 -> 2 (top curve) -->
  <path d="M147,96 A 95 95 0 0 1 263,96" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="60" text-anchor="middle" font-size="15" fill="#2a6f97">1</text>
  <!-- arrow 2 -> 1 (bottom curve) -->
  <path d="M263,124 A 95 95 0 0 1 147,124" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="170" text-anchor="middle" font-size="15" fill="#2a6f97">1</text>

  <!-- annotation left -->
  <text x="205" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">start at 1 oscillates 1→2→1→2… never settles</text>
  <text x="205" y="235" text-anchor="middle" font-size="13" fill="#1b2a3a">π=(0.5, 0.5) still solves πP = π,</text>
  <text x="205" y="253" text-anchor="middle" font-size="13" fill="#bc4749">but power iteration does not converge</text>

  <!-- ================= RIGHT PANEL: Reducible ================= -->
  <text x="615" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#bc4749">Reducible (not irreducible)</text>

  <!-- Cluster A {1,2} -->
  <rect x="450" y="60" width="140" height="110" rx="10" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a994e">group A</text>
  <circle cx="490" cy="125" r="24" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="490" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">1</text>
  <circle cx="555" cy="125" r="24" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="555" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">2</text>
  <path d="M510,111 A 42 42 0 0 1 535,111" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M535,139 A 42 42 0 0 1 510,139" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cluster B {3,4} -->
  <rect x="640" y="60" width="140" height="110" rx="10" fill="#eaf1f7" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="710" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a994e">group B</text>
  <circle cx="680" cy="125" r="24" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="680" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">3</text>
  <circle cx="745" cy="125" r="24" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="745" y="131" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">4</text>
  <path d="M700,111 A 42 42 0 0 1 725,111" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M725,139 A 42 42 0 0 1 700,139" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- "no crossing" marker between clusters -->
  <line x1="600" y1="115" x2="630" y2="115" stroke="#bc4749" stroke-width="2"/>
  <line x1="608" y1="107" x2="622" y2="123" stroke="#bc4749" stroke-width="2"/>
  <line x1="622" y1="107" x2="608" y2="123" stroke="#bc4749" stroke-width="2"/>
  <text x="615" y="150" text-anchor="middle" font-size="11" fill="#bc4749">no crossing</text>

  <!-- annotation right -->
  <text x="615" y="215" text-anchor="middle" font-size="13" fill="#1b2a3a">two isolated groups →</text>
  <text x="615" y="235" text-anchor="middle" font-size="13" fill="#bc4749">many stationary distributions</text>
  <text x="615" y="253" text-anchor="middle" font-size="13" fill="#1b2a3a">(one per group)</text>

  <!-- ================= BOTTOM CAPTION ================= -->
  <rect x="60" y="320" width="700" height="52" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="410" y="343" text-anchor="middle" font-size="15" fill="#1b2a3a">Our DNA matrix has all entries &gt; 0  →  irreducible AND aperiodic</text>
  <text x="410" y="363" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">→  unique π</text>
</svg>
