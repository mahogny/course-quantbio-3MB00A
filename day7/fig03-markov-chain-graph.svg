<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa8b5"/>
    </marker>
  </defs>

  <!-- band labels -->
  <text x="120" y="60" font-size="16" fill="#8a97a3" text-anchor="middle" font-style="italic">past</text>
  <text x="450" y="60" font-size="16" fill="#2a6f97" text-anchor="middle" font-weight="bold">present</text>
  <text x="600" y="60" font-size="16" fill="#1b2a3a" text-anchor="middle" font-style="italic">future</text>

  <!-- forbidden curved arrow X2 -> X4 -->
  <path d="M 300 175 C 380 260, 520 260, 600 175" fill="none" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <!-- red X strike -->
  <g stroke="#bc4749" stroke-width="4" stroke-linecap="round">
    <line x1="438" y1="238" x2="462" y2="262"/>
    <line x1="462" y1="238" x2="438" y2="262"/>
  </g>

  <!-- chain arrows -->
  <line x1="152" y1="150" x2="268" y2="150" stroke="#9aa8b5" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <line x1="302" y1="150" x2="418" y2="150" stroke="#9aa8b5" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <line x1="452" y1="150" x2="568" y2="150" stroke="#1b2a3a" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- nodes: past (grey) -->
  <g>
    <circle cx="120" cy="150" r="28" fill="#eef1f4" stroke="#9aa8b5" stroke-width="1.8"/>
    <text x="120" y="156" font-size="17" fill="#8a97a3" text-anchor="middle">X₀</text>
  </g>
  <g>
    <circle cx="210" cy="150" r="28" fill="#eef1f4" stroke="#9aa8b5" stroke-width="1.8"/>
    <text x="210" y="156" font-size="17" fill="#8a97a3" text-anchor="middle">X₁</text>
  </g>
  <g>
    <circle cx="300" cy="150" r="28" fill="#eef1f4" stroke="#9aa8b5" stroke-width="1.8"/>
    <text x="300" y="156" font-size="17" fill="#8a97a3" text-anchor="middle">X₂</text>
  </g>

  <!-- present X3 highlighted -->
  <g>
    <circle cx="450" cy="150" r="30" fill="#eaf1f7" stroke="#2a6f97" stroke-width="3"/>
    <text x="450" y="156" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold">X₃</text>
  </g>

  <!-- future X4 -->
  <g>
    <circle cx="600" cy="150" r="28" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
    <text x="600" y="156" font-size="17" fill="#1b2a3a" text-anchor="middle">X₄</text>
  </g>

  <!-- edge label X3 -> X4 -->
  <text x="525" y="108" font-size="14" fill="#1b2a3a" text-anchor="middle">p&#8203;ᵢⱼ = P(X&#8202;ₜ₊₁ = j | Xₜ = i)</text>

  <!-- caption -->
  <text x="360" y="345" font-size="17" fill="#1b2a3a" text-anchor="middle" font-style="italic">future is independent of the past given the present</text>
</svg>
