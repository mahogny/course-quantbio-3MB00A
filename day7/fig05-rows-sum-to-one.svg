<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL: MATRIX ===================== -->
  <!-- column headers -->
  <g font-size="15" fill="#1b2a3a" text-anchor="middle">
    <text x="120" y="52">A</text>
    <text x="170" y="52">C</text>
    <text x="220" y="52">G</text>
    <text x="270" y="52">T</text>
  </g>

  <!-- matrix bracket left/right -->
  <path d="M78,60 L72,60 L72,222 L78,222" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M292,60 L298,60 L298,222 L292,222" fill="none" stroke="#1b2a3a" stroke-width="2"/>

  <!-- row A highlighted background -->
  <rect x="82" y="63" width="206" height="34" fill="#eaf1f7"/>

  <!-- row labels -->
  <g font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">
    <text x="52" y="85">A</text>
    <text x="52" y="123">C</text>
    <text x="52" y="161">G</text>
    <text x="52" y="199">T</text>
  </g>

  <!-- matrix values -->
  <g font-size="15" fill="#1b2a3a" text-anchor="middle">
    <!-- row A -->
    <text x="120" y="85">0.3</text><text x="170" y="85">0.2</text><text x="220" y="85">0.2</text><text x="270" y="85">0.3</text>
    <!-- row C -->
    <text x="120" y="123">0.1</text><text x="170" y="123">0.4</text><text x="220" y="123">0.4</text><text x="270" y="123">0.1</text>
    <!-- row G -->
    <text x="120" y="161">0.1</text><text x="170" y="161">0.4</text><text x="220" y="161">0.4</text><text x="270" y="161">0.1</text>
    <!-- row T -->
    <text x="120" y="199">0.3</text><text x="170" y="199">0.2</text><text x="220" y="199">0.2</text><text x="270" y="199">0.3</text>
  </g>

  <!-- brace to right of row A -->
  <path d="M308,66 q8,0 8,8 v6 q0,6 6,6 q-6,0 -6,6 v6 q0,8 -8,8"
        fill="none" stroke="#2a6f97" stroke-width="2"/>
  <text x="330" y="85" font-size="15" fill="#2a6f97">0.3 + 0.2 + 0.2 + 0.3 = 1</text>

  <!-- check marks for other three rows -->
  <g stroke="#6a994e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312,120 l5,6 l9,-13"/>
    <path d="M312,158 l5,6 l9,-13"/>
    <path d="M312,196 l5,6 l9,-13"/>
  </g>
  <g font-size="13" fill="#6a994e">
    <text x="332" y="124">= 1</text>
    <text x="332" y="162">= 1</text>
    <text x="332" y="200">= 1</text>
  </g>

  <!-- note under columns -->
  <text x="185" y="252" font-size="14" fill="#bc4749" text-anchor="middle">columns do NOT generally sum to 1</text>

  <!-- ===================== RIGHT PANEL: STATE GRAPH ===================== -->
  <!-- central node A -->
  <circle cx="600" cy="150" r="34" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="600" y="157" font-size="22" fill="#1b2a3a" text-anchor="middle" font-weight="bold">A</text>

  <!-- self loop back to A -->
  <path d="M578,127 C548,95 585,80 610,92 C632,102 628,120 622,127"
        fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="70" font-size="15" fill="#2a6f97" text-anchor="middle">0.3</text>

  <!-- small target nodes -->
  <!-- C top-right -->
  <circle cx="770" cy="95" r="18" fill="#fff" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="770" y="101" font-size="15" fill="#1b2a3a" text-anchor="middle">C</text>
  <!-- G right -->
  <circle cx="800" cy="175" r="18" fill="#fff" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="800" y="181" font-size="15" fill="#1b2a3a" text-anchor="middle">G</text>
  <!-- T bottom-right -->
  <circle cx="760" cy="255" r="18" fill="#fff" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="760" y="261" font-size="15" fill="#1b2a3a" text-anchor="middle">T</text>

  <!-- arrows A -> C,G,T -->
  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <path d="M632,138 L749,101" marker-end="url(#arrow)"/>
    <path d="M634,157 L778,171" marker-end="url(#arrow)"/>
    <path d="M628,175 L742,244" marker-end="url(#arrow)"/>
  </g>
  <g font-size="15" fill="#2a6f97">
    <text x="690" y="108">0.2</text>
    <text x="700" y="158">0.2</text>
    <text x="672" y="228">0.3</text>
  </g>

  <!-- annotation: leaving probabilities sum to 1 -->
  <text x="620" y="300" font-size="14" fill="#6a994e" text-anchor="middle">leaving probabilities sum to 1</text>

  <!-- divider -->
  <line x1="440" y1="55" x2="440" y2="300" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- bottom caption -->
  <text x="440" y="360" font-size="16" fill="#1b2a3a" text-anchor="middle" font-style="italic">each row = the complete outgoing distribution of one state</text>
</svg>
