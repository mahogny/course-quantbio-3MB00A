<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a3"/>
    </marker>
  </defs>

  <!-- ===== history boxes (greyed, ignored): A C G T A A ===== -->
  <g font-family="'Courier New', monospace" font-size="26" text-anchor="middle">
    <g>
      <rect x="40"  y="120" width="44" height="44" rx="4" fill="#eef1f4" stroke="#c9d3dd" stroke-width="1.5"/>
      <text x="62"  y="152" fill="#8a97a3">A</text>
    </g>
    <g>
      <rect x="90"  y="120" width="44" height="44" rx="4" fill="#eef1f4" stroke="#c9d3dd" stroke-width="1.5"/>
      <text x="112" y="152" fill="#8a97a3">C</text>
    </g>
    <g>
      <rect x="140" y="120" width="44" height="44" rx="4" fill="#eef1f4" stroke="#c9d3dd" stroke-width="1.5"/>
      <text x="162" y="152" fill="#8a97a3">G</text>
    </g>
    <g>
      <rect x="190" y="120" width="44" height="44" rx="4" fill="#eef1f4" stroke="#c9d3dd" stroke-width="1.5"/>
      <text x="212" y="152" fill="#8a97a3">T</text>
    </g>
    <g>
      <rect x="240" y="120" width="44" height="44" rx="4" fill="#eef1f4" stroke="#c9d3dd" stroke-width="1.5"/>
      <text x="262" y="152" fill="#8a97a3">A</text>
    </g>
    <g>
      <rect x="290" y="120" width="44" height="44" rx="4" fill="#eef1f4" stroke="#c9d3dd" stroke-width="1.5"/>
      <text x="312" y="152" fill="#8a97a3">A</text>
    </g>
  </g>

  <!-- ===== current base C (highlighted) ===== -->
  <g font-family="'Courier New', monospace" font-size="26" text-anchor="middle">
    <rect x="340" y="120" width="44" height="44" rx="4" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2.5"/>
    <text x="362" y="152" fill="#1b2a3a" font-weight="bold">C</text>
  </g>

  <!-- current base pointer/marker -->
  <path d="M362,86 L362,110 M354,102 L362,112 L370,102" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <text x="362" y="76" text-anchor="middle" font-size="15" fill="#2a6f97" font-weight="bold">current base</text>

  <!-- ===== history brace + label ===== -->
  <path d="M40,178 q0,8 8,8 L179,186 q8,0 8,8 q0,-8 8,-8 L326,186 q8,0 8,-8"
        fill="none" stroke="#8a97a3" stroke-width="1.5"/>
  <text x="187" y="210" text-anchor="middle" font-size="15" fill="#8a97a3">history — ignored</text>

  <!-- ===== fanning candidate arrows from C into next slot ===== -->
  <g stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <path d="M388,140 L556,102" marker-end="url(#ah)"/>
    <path d="M388,141 L556,127" marker-end="url(#ah)"/>
    <path d="M388,143 L556,151" marker-end="url(#ah)"/>
    <path d="M388,144 L556,176" marker-end="url(#ah)"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="17" fill="#2a6f97" font-weight="bold" text-anchor="middle">
    <text x="486" y="103">A</text>
    <text x="486" y="122">C</text>
    <text x="486" y="158">G</text>
    <text x="486" y="180">T</text>
  </g>

  <!-- ===== next base empty slot ===== -->
  <g font-family="'Courier New', monospace" font-size="34" text-anchor="middle">
    <rect x="596" y="118" width="48" height="48" rx="4" fill="#ffffff" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="620" y="155" fill="#bc4749" font-weight="bold">?</text>
  </g>
  <text x="620" y="106" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">next base</text>

  <!-- ===== bottom caption ===== -->
  <text x="380" y="360" text-anchor="middle" font-size="15.5" fill="#1b2a3a">The next base depends ONLY on the current base <tspan font-family="'Courier New', monospace" font-weight="bold" fill="#2a6f97">C</tspan> — not on what came before</text>
  <text x="380" y="382" text-anchor="middle" font-size="15.5" fill="#1b2a3a">(the Markov property).</text>
</svg>
