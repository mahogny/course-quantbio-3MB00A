<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/>
    </marker>
  </defs>
  <!-- y(v) = 330 - (v - 8) * 16.25 ; ctrl centre x=230, treat centre x=470 -->


  <!-- axes -->
  <line x1="110" y1="60" x2="110" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="110" y1="330" x2="580" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="104" y1="297.5" x2="110" y2="297.5"/>
    <line x1="104" y1="265" x2="110" y2="265"/>
    <line x1="104" y1="232.5" x2="110" y2="232.5"/>
    <line x1="104" y1="200" x2="110" y2="200"/>
    <line x1="104" y1="167.5" x2="110" y2="167.5"/>
    <line x1="104" y1="135" x2="110" y2="135"/>
    <line x1="104" y1="102.5" x2="110" y2="102.5"/>
    <line x1="104" y1="70" x2="110" y2="70"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="99" y="301.5">10</text>
    <text x="99" y="269">12</text>
    <text x="99" y="236.5">14</text>
    <text x="99" y="204">16</text>
    <text x="99" y="171.5">18</text>
    <text x="99" y="139">20</text>
    <text x="99" y="106.5">22</text>
    <text x="99" y="74">24</text>
  </g>
  <text x="58" y="195" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 58 195)">expression</text>
  <text x="230" y="350" font-size="14" fill="#1b2a3a" text-anchor="middle">ctrl (control)</text>
  <text x="470" y="350" font-size="14" fill="#1b2a3a" text-anchor="middle">treat (drug)</text>
  <text x="230" y="367" font-size="12" fill="#5a6b7a" text-anchor="middle">1 in A, 3 in B</text>
  <text x="470" y="367" font-size="12" fill="#5a6b7a" text-anchor="middle">3 in A, 1 in B</text>

  <!-- within-batch lines (dashed) -->
  <line x1="200" y1="297.5" x2="446" y2="265" stroke="#2a6f97" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="256" y1="135" x2="500" y2="102.5" stroke="#6a994e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="300" font-size="14" font-weight="bold" fill="#2a6f97">+2 within A</text>
  <text x="352" y="104" font-size="14" font-weight="bold" fill="#6a994e">+2 within B</text>

  <!-- points: batch A blue, batch B green -->
  <g fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.8">
    <circle cx="200" cy="297.5" r="6.5"/>
    <circle cx="430" cy="265" r="6.5"/>
    <circle cx="446" cy="265" r="6.5"/>
    <circle cx="462" cy="265" r="6.5"/>
  </g>
  <g fill="#6a994e" stroke="#1b2a3a" stroke-width="0.8">
    <circle cx="240" cy="135" r="6.5"/>
    <circle cx="256" cy="135" r="6.5"/>
    <circle cx="272" cy="135" r="6.5"/>
    <circle cx="500" cy="102.5" r="6.5"/>
  </g>

  <!-- overall group means -->
  <line x1="185" y1="175.6" x2="285" y2="175.6" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="420" y1="224.4" x2="520" y2="224.4" stroke="#1b2a3a" stroke-width="3"/>
  <text x="235" y="197" font-size="13" fill="#1b2a3a" text-anchor="middle">mean 17.5</text>
  <text x="470" y="245" font-size="13" fill="#1b2a3a" text-anchor="middle">mean 14.5</text>

  <!-- unadjusted difference -->
  <line x1="285" y1="175.6" x2="360" y2="175.6" stroke="#bc4749" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="360" y1="224.4" x2="420" y2="224.4" stroke="#bc4749" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="360" y1="177" x2="360" y2="222" stroke="#bc4749" stroke-width="2.2" marker-end="url(#arRed)"/>
  <text x="368" y="205" font-size="15" font-weight="bold" fill="#bc4749">−3</text>

  <!-- legend / summary column -->
  <g font-size="13" fill="#1b2a3a">
    <circle cx="622" cy="78" r="6.5" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.8"/>
    <text x="636" y="83">batch A (baseline 10)</text>
    <circle cx="622" cy="102" r="6.5" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.8"/>
    <text x="636" y="107">batch B (baseline 20)</text>
    <line x1="610" y1="126" x2="634" y2="126" stroke="#1b2a3a" stroke-width="3"/>
    <text x="642" y="131">group mean, batches pooled</text>
  </g>

  <rect x="604" y="152" width="282" height="74" rx="6" fill="#fbeeee" stroke="#bc4749" stroke-width="1.2"/>
  <text x="616" y="174" font-size="13" font-weight="bold" fill="#bc4749">ignore batch:  expr ~ treatment</text>
  <text x="616" y="194" font-size="13" fill="#1b2a3a">drug − control = 14.5 − 17.5 = −3</text>
  <text x="616" y="213" font-size="13" fill="#1b2a3a">"the drug lowers expression"</text>

  <rect x="604" y="238" width="282" height="74" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="616" y="260" font-size="13" font-weight="bold" fill="#2a6f97">adjust:  expr ~ treatment + batch</text>
  <text x="616" y="280" font-size="13" fill="#1b2a3a">12 − 10 = +2  and  22 − 20 = +2</text>
  <text x="616" y="299" font-size="13" fill="#1b2a3a">"the drug raises expression by 2"</text>

  <text x="604" y="340" font-size="12.5" fill="#1b2a3a">The pooled means compare mostly-B controls</text>
  <text x="604" y="357" font-size="12.5" fill="#1b2a3a">with mostly-A drug samples: the batch</text>
  <text x="604" y="374" font-size="12.5" fill="#1b2a3a">difference (10) leaks into the drug effect.</text>
</svg>
