<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 900 334" width="900" height="334" font-family="Helvetica, Arial, sans-serif">
  <!-- x: px = 100 + (bmi - 18) * 28 ; y: py = 330 - (expr - 4) * 11 -->

  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="100" y1="330" x2="550" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="156" y1="330" x2="156" y2="336"/>
    <line x1="268" y1="330" x2="268" y2="336"/>
    <line x1="380" y1="330" x2="380" y2="336"/>
    <line x1="492" y1="330" x2="492" y2="336"/>
    <line x1="94" y1="286" x2="100" y2="286"/>
    <line x1="94" y1="242" x2="100" y2="242"/>
    <line x1="94" y1="198" x2="100" y2="198"/>
    <line x1="94" y1="154" x2="100" y2="154"/>
    <line x1="94" y1="110" x2="100" y2="110"/>
    <line x1="94" y1="66" x2="100" y2="66"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="156" y="350">20</text>
    <text x="268" y="350">24</text>
    <text x="380" y="350">28</text>
    <text x="492" y="350">32</text>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="89" y="290">8</text>
    <text x="89" y="246">12</text>
    <text x="89" y="202">16</text>
    <text x="89" y="158">20</text>
    <text x="89" y="114">24</text>
    <text x="89" y="70">28</text>
  </g>
  <text x="325" y="372" font-size="14" fill="#1b2a3a" text-anchor="middle">BMI</text>
  <text x="50" y="195" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 50 195)">expression</text>

  <!-- pooled line (dashed red): expr = 45.71 - 1.143 * bmi -->
  <line x1="100" y1="97.4" x2="548" y2="298.6" stroke="#bc4749" stroke-width="2.4" stroke-dasharray="8 5"/>

  <!-- within-sex lines, slope +1 -->
  <line x1="128" y1="165" x2="296" y2="99" stroke="#2a6f97" stroke-width="2.4"/>
  <line x1="352" y1="297" x2="520" y2="231" stroke="#6a994e" stroke-width="2.4"/>

  <!-- points -->
  <g fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.8">
    <circle cx="156" cy="154" r="6"/>
    <circle cx="212" cy="132" r="6"/>
    <circle cx="268" cy="110" r="6"/>
  </g>
  <g fill="#6a994e" stroke="#1b2a3a" stroke-width="0.8">
    <circle cx="380" cy="286" r="6"/>
    <circle cx="436" cy="264" r="6"/>
    <circle cx="492" cy="242" r="6"/>
  </g>
  <text x="306" y="102" font-size="15" font-weight="bold" fill="#2a6f97">F</text>
  <text x="530" y="234" font-size="15" font-weight="bold" fill="#6a994e">M</text>

  <!-- legend / summary column -->
  <g font-size="13" fill="#1b2a3a">
    <circle cx="612" cy="74" r="6" fill="#2a6f97" stroke="#1b2a3a" stroke-width="0.8"/>
    <text x="626" y="79">females (lighter, higher expression)</text>
    <circle cx="612" cy="98" r="6" fill="#6a994e" stroke="#1b2a3a" stroke-width="0.8"/>
    <text x="626" y="103">males (heavier, lower expression)</text>
  </g>

  <rect x="596" y="124" width="290" height="70" rx="6" fill="#fbeeee" stroke="#bc4749" stroke-width="1.2"/>
  <line x1="608" y1="146" x2="636" y2="146" stroke="#bc4749" stroke-width="2.4" stroke-dasharray="8 5"/>
  <text x="644" y="151" font-size="13" font-weight="bold" fill="#bc4749">expr ~ bmi</text>
  <text x="608" y="174" font-size="13" fill="#1b2a3a">slope ≈ −1.1: "higher BMI, lower expr"</text>

  <rect x="596" y="206" width="290" height="70" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.2"/>
  <line x1="608" y1="228" x2="636" y2="228" stroke="#2a6f97" stroke-width="2.4"/>
  <text x="644" y="233" font-size="13" font-weight="bold" fill="#2a6f97">expr ~ bmi + sex</text>
  <text x="608" y="256" font-size="13" fill="#1b2a3a">slope = +1 within each sex; sexM = −20</text>

  <text x="596" y="306" font-size="12.5" fill="#1b2a3a">Sex drives both BMI and expression, so the</text>
  <text x="596" y="323" font-size="12.5" fill="#1b2a3a">pooled slope mostly measures the F/M gap,</text>
  <text x="596" y="340" font-size="12.5" fill="#1b2a3a">not what BMI does within a person's sex.</text>
</svg>
