<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8899"/>
    </marker>
  </defs>

  <text x="440" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Approach 3: MOFA-style shared factors</text>

  <!-- ============ TOP ROW: RNA ============ -->
  <!-- X_RNA -->
  <rect x="30" y="66" width="96" height="72" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="63" y="106" text-anchor="start" font-size="14" fill="#1b2a3a">X<tspan font-size="10" dy="3">RNA</tspan></text>
  <text x="78" y="156" text-anchor="middle" font-size="11" fill="#5b6b7a">cells &#215; genes</text>

  <text x="146" y="107" text-anchor="middle" font-size="18" fill="#1b2a3a">&#8776;</text>

  <!-- Z (top instance) -->
  <rect x="162" y="66" width="40" height="72" fill="#fbeaea" stroke="#bc4749" stroke-width="1.8"/>
  <text x="182" y="106" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">Z</text>

  <text x="216" y="107" text-anchor="middle" font-size="16" fill="#1b2a3a">&#183;</text>

  <!-- W_RNA (factors x genes) with one silenced factor row -->
  <rect x="230" y="66" width="150" height="72" fill="#ffffff" stroke="#2a6f97" stroke-width="1.8"/>
  <!-- highlighted factor row: silent/grey in RNA -->
  <rect x="230" y="93" width="150" height="18" fill="#c9d3dd"/>
  <line x1="230" y1="93" x2="380" y2="93" stroke="#c9d3dd" stroke-width="0.8"/>
  <line x1="230" y1="111" x2="380" y2="111" stroke="#c9d3dd" stroke-width="0.8"/>
  <rect x="230" y="66" width="150" height="72" fill="none" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="289" y="83" text-anchor="start" font-size="13" fill="#1b2a3a">W<tspan font-size="9" dy="3">RNA</tspan></text>
  <text x="305" y="106" text-anchor="middle" font-size="10" fill="#7a8899">&#8776; 0 (silent)</text>
  <text x="305" y="130" text-anchor="middle" font-size="10" fill="#5b6b7a">factors &#215; genes</text>

  <text x="398" y="107" text-anchor="middle" font-size="18" fill="#1b2a3a">+</text>

  <!-- noise RNA -->
  <rect x="412" y="82" width="40" height="40" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="432" y="108" text-anchor="middle" font-size="13" fill="#7a8899">&#949;</text>

  <!-- ============ BOTTOM ROW: prot ============ -->
  <rect x="30" y="256" width="96" height="72" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="65" y="296" text-anchor="start" font-size="14" fill="#1b2a3a">X<tspan font-size="10" dy="3">prot</tspan></text>
  <text x="78" y="346" text-anchor="middle" font-size="11" fill="#5b6b7a">cells &#215; proteins</text>

  <text x="146" y="297" text-anchor="middle" font-size="18" fill="#1b2a3a">&#8776;</text>

  <!-- Z (bottom instance, identical) -->
  <rect x="162" y="256" width="40" height="72" fill="#fbeaea" stroke="#bc4749" stroke-width="1.8"/>
  <text x="182" y="296" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">Z</text>

  <text x="216" y="297" text-anchor="middle" font-size="16" fill="#1b2a3a">&#183;</text>

  <!-- W_prot (factors x proteins) with one ACTIVE factor row -->
  <rect x="230" y="256" width="150" height="72" fill="#ffffff" stroke="#2a6f97" stroke-width="1.8"/>
  <rect x="230" y="283" width="150" height="18" fill="#6a994e"/>
  <rect x="230" y="256" width="150" height="72" fill="none" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="291" y="273" text-anchor="start" font-size="13" fill="#1b2a3a">W<tspan font-size="9" dy="3">prot</tspan></text>
  <text x="305" y="296" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">strong (active)</text>
  <text x="305" y="320" text-anchor="middle" font-size="10" fill="#5b6b7a">factors &#215; proteins</text>

  <text x="398" y="297" text-anchor="middle" font-size="18" fill="#1b2a3a">+</text>

  <rect x="412" y="272" width="40" height="40" fill="none" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="432" y="298" text-anchor="middle" font-size="13" fill="#7a8899">&#949;</text>

  <!-- ============ SHARED Z linkage ============ -->
  <path d="M182,138 L182,256" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5,4" fill="none"/>
  <rect x="128" y="182" width="108" height="30" rx="4" fill="#fbeaea" stroke="#bc4749" stroke-width="1.5"/>
  <text x="182" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4749">same shared Z</text>
  <text x="182" y="209" text-anchor="middle" font-size="10" fill="#8a4a4b">cells &#215; factors</text>

  <!-- highlighted factor callout: link both W rows to the green callout box, routing clear of the + and noise box -->
  <line x1="380" y1="102" x2="476" y2="183" stroke="#7a8899" stroke-width="1.4" marker-end="url(#arrGrey)"/>
  <line x1="380" y1="292" x2="476" y2="213" stroke="#6a994e" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- callout box for factor active/silent -->
  <rect x="476" y="150" width="384" height="96" rx="6" fill="#f4f8fb" stroke="#6a994e" stroke-width="1.6"/>
  <text x="490" y="172" font-size="12.5" fill="#1b2a3a">One factor row: <tspan fill="#6a994e" font-weight="bold">active in proteins</tspan>,</text>
  <text x="490" y="190" font-size="12.5" fill="#1b2a3a"><tspan fill="#7a8899" font-weight="bold">silent (&#8776; 0) in RNA</tspan>.</text>
  <text x="490" y="214" font-size="12" fill="#3a4a5a">A factor can be active in some modalities and silent</text>
  <text x="490" y="230" font-size="12" fill="#3a4a5a">in others &#8594; distinguishes <tspan font-weight="bold">shared vs modality-specific</tspan> biology.</text>

  <!-- side note -->
  <rect x="476" y="66" width="384" height="70" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.4"/>
  <text x="490" y="88" font-size="12.5" font-weight="bold" fill="#2a6f97">Why MOFA scales:</text>
  <text x="490" y="107" font-size="12" fill="#1b2a3a">&#183; handles &gt; 2 modalities</text>
  <text x="490" y="124" font-size="12" fill="#1b2a3a">&#183; missing data &#183; per-block noise models</text>

  <!-- caption -->
  <text x="440" y="372" text-anchor="middle" font-size="13" font-style="italic" fill="#1b2a3a">PCA generalized to several matrices, with one shared Z and per-modality loadings</text>
</svg>
