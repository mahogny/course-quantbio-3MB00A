<svg xmlns="http://www.w3.org/2000/svg" viewBox="15.4 17.6 871.8 404.6" font-family="Helvetica, Arial, sans-serif" width="871.8" height="404.6">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Left panel: RNA loadings -->
  <text x="40" y="55" font-size="17" font-weight="bold" fill="#2a6f97">top RNA loadings on factor 1</text>
  <line x1="140" y1="80" x2="140" y2="330" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- highlighted CD3 genes -->
  <rect x="140" y="86" width="188" height="20" fill="#bc4749"/>
  <text x="132" y="101" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">CD3D</text>
  <rect x="140" y="116" width="178" height="20" fill="#bc4749"/>
  <text x="132" y="131" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">CD3E</text>
  <rect x="140" y="146" width="162" height="20" fill="#bc4749"/>
  <text x="132" y="161" font-size="14" fill="#1b2a3a" text-anchor="end" font-weight="bold">CD3G</text>

  <!-- grey genes -->
  <rect x="140" y="176" width="112" height="20" fill="#c9d3dd"/>
  <text x="132" y="191" font-size="13" fill="#5a6672" text-anchor="end">IL7R</text>
  <rect x="140" y="206" width="94" height="20" fill="#c9d3dd"/>
  <text x="132" y="221" font-size="13" fill="#5a6672" text-anchor="end">CD2</text>
  <rect x="140" y="236" width="78" height="20" fill="#c9d3dd"/>
  <text x="132" y="251" font-size="13" fill="#5a6672" text-anchor="end">LCK</text>
  <rect x="140" y="266" width="60" height="20" fill="#c9d3dd"/>
  <text x="132" y="281" font-size="13" fill="#5a6672" text-anchor="end">CD28</text>
  <rect x="140" y="296" width="44" height="20" fill="#c9d3dd"/>
  <text x="132" y="311" font-size="13" fill="#5a6672" text-anchor="end">GZMK</text>
  <text x="245" y="350" font-size="12" fill="#8a95a1" text-anchor="middle">loading magnitude →</text>

  <!-- Right panel: protein loadings -->
  <text x="565" y="55" font-size="17" font-weight="bold" fill="#6a994e">top protein loadings on factor 1</text>
  <line x1="620" y1="80" x2="620" y2="330" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- highlighted CD3 protein -->
  <rect x="620" y="86" width="150" height="20" fill="#bc4749"/>
  <text x="624" y="80" font-size="14" fill="#1b2a3a" font-weight="bold">CD3</text>

  <!-- grey proteins -->
  <rect x="620" y="116" width="80" height="20" fill="#c9d3dd"/>
  <text x="612" y="131" font-size="13" fill="#5a6672" text-anchor="end">CD4</text>
  <rect x="620" y="146" width="66" height="20" fill="#c9d3dd"/>
  <text x="612" y="161" font-size="13" fill="#5a6672" text-anchor="end">CD8</text>
  <rect x="620" y="176" width="50" height="20" fill="#c9d3dd"/>
  <text x="612" y="191" font-size="13" fill="#5a6672" text-anchor="end">CD2</text>
  <rect x="620" y="206" width="40" height="20" fill="#c9d3dd"/>
  <text x="612" y="221" font-size="13" fill="#5a6672" text-anchor="end">CD5</text>
  <rect x="620" y="236" width="32" height="20" fill="#c9d3dd"/>
  <text x="612" y="251" font-size="13" fill="#5a6672" text-anchor="end">CD7</text>
  <text x="700" y="350" font-size="12" fill="#8a95a1" text-anchor="middle">loading magnitude →</text>
  <text x="775" y="101" font-size="12" fill="#5a6672">(surface protein)</text>

  <!-- Bracket over the three CD3 gene bars -->
  <path d="M336,86 q10,0 10,10 l0,26 q0,10 10,10 q-10,0 -10,10 l0,26 q0,10 -10,10"
        fill="none" stroke="#bc4749" stroke-width="2"/>

  <!-- Arrow from gene bracket to protein CD3 bar -->
  <path d="M356,132 C460,132 500,96 616,96" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connecting annotation -->
  <text x="451" y="188" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">same factor, both languages</text>
  <text x="451" y="206" font-size="13" fill="#bc4749" text-anchor="middle" font-weight="bold">→ co-varying = concordance</text>

  <!-- Caption -->
  <text x="451" y="378" font-size="12.5" fill="#1b2a3a" text-anchor="middle">genes AND proteins with large loadings on the same factor rise and fall in step across cells</text>
  <text x="451" y="395" font-size="12.5" fill="#1b2a3a" text-anchor="middle">→ cross-modal corroboration ("T-cell" factor)</text>
</svg>
