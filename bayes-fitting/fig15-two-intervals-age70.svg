<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">the individual band is always wider</text>

  <!-- highlight band around age 70 -->
  <rect x="484" y="60" width="52" height="260" fill="#eaf1f7" opacity="0.7"/>

  <!-- minimal gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="236.7" x2="612" y2="236.7"/>
    <line x1="90" y1="153.3" x2="612" y2="153.3"/>
  </g>

  <!-- vertical dashed guide at age = 70 -->
  <line x1="507.3" y1="320" x2="507.3" y2="66" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="507.3" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">age = 70</text>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="90" y1="320" x2="612" y2="320" marker-end="url(#arrow)"/>
    <line x1="90" y1="320" x2="90" y2="52" marker-end="url(#arrow)"/>
  </g>

  <!-- x ticks -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="136.4" y1="320" x2="136.4" y2="325"/>
    <line x1="229.1" y1="320" x2="229.1" y2="325"/>
    <line x1="321.8" y1="320" x2="321.8" y2="325"/>
    <line x1="414.5" y1="320" x2="414.5" y2="325"/>
    <line x1="507.3" y1="320" x2="507.3" y2="325"/>
    <line x1="600" y1="320" x2="600" y2="325"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="136.4" y="339">30</text>
    <text x="229.1" y="339">40</text>
    <text x="321.8" y="339">50</text>
    <text x="414.5" y="339">60</text>
    <text x="507.3" y="339">70</text>
    <text x="600" y="339">80</text>
  </g>
  <text x="351" y="364" text-anchor="middle" font-size="15" fill="#1b2a3a">age</text>
  <text x="26" y="190" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 26 190)">expression</text>

  <!-- fitted mean line (solid, upward sloping) -->
  <line x1="107.6" y1="265" x2="581.5" y2="120" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- point on the line at age 70 -->
  <circle cx="507.3" cy="142.7" r="4.5" fill="#1b2a3a"/>

  <!-- SHORT bar: credible interval for the MEAN (blue, narrow) -->
  <g stroke="#2a6f97" stroke-width="3" fill="none">
    <line x1="496" y1="125.7" x2="496" y2="159.7"/>
    <line x1="489" y1="125.7" x2="503" y2="125.7"/>
    <line x1="489" y1="159.7" x2="503" y2="159.7"/>
  </g>

  <!-- LONG bar: prediction interval for ONE donor (red, wide) -->
  <g stroke="#bc4749" stroke-width="3" fill="none">
    <line x1="521" y1="79.7" x2="521" y2="205.7"/>
    <line x1="514" y1="79.7" x2="528" y2="79.7"/>
    <line x1="514" y1="205.7" x2="528" y2="205.7"/>
  </g>

  <!-- legend / labels (upper left, empty region) -->
  <!-- blue swatch -->
  <g stroke="#2a6f97" stroke-width="3" fill="none">
    <line x1="126" y1="73" x2="126" y2="89"/>
    <line x1="121" y1="73" x2="131" y2="73"/>
    <line x1="121" y1="89" x2="131" y2="89"/>
  </g>
  <g font-size="13.5" fill="#2a6f97">
    <text x="142" y="77" font-weight="bold">fitted(): credible interval for the MEAN line</text>
    <text x="142" y="93">uncertainty in a and b only (narrow)</text>
  </g>

  <!-- red swatch -->
  <g stroke="#bc4749" stroke-width="3" fill="none">
    <line x1="126" y1="113" x2="126" y2="149"/>
    <line x1="121" y1="113" x2="131" y2="113"/>
    <line x1="121" y1="149" x2="131" y2="149"/>
  </g>
  <g font-size="13.5" fill="#bc4749">
    <text x="142" y="125" font-weight="bold">predict(): prediction interval for ONE new donor</text>
    <text x="142" y="141">adds noise σ (wider)</text>
  </g>

  <!-- span annotation: mean vs new donor -->
  <line x1="466" y1="125.7" x2="466" y2="159.7" stroke="#2a6f97" stroke-width="1.2" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
  <line x1="551" y1="79.7" x2="551" y2="205.7" stroke="#bc4749" stroke-width="1.2" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
  <text x="558" y="146" font-size="12" fill="#bc4749">+σ</text>
</svg>
