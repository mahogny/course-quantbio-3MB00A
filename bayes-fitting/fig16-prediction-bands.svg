<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 20 677 380" font-family="Helvetica, Arial, sans-serif" width="677" height="380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- outer prediction band (widest, lighter tint) -->
  <polygon points="90,211.2 162.5,198.7 235.1,183.8 307.6,167.5 380.2,150.2 452.7,132.2 525.3,113.2 597.8,92.5 660,72.9 660,155.9 597.8,166.5 525.3,181.0 452.7,197.2 380.2,214.4 307.6,232.3 235.1,251.2 162.5,271.5 90,294.2"
    fill="#dce9f3" stroke="#a9cae4" stroke-width="1"/>

  <!-- inner credible band (narrow, stronger tint) -->
  <polygon points="90,225.1 162.5,215.8 235.1,204.2 307.6,190.1 380.2,173.6 452.7,154.6 525.3,133.1 597.8,109.2 660,86.8 660,142.0 597.8,149.8 525.3,161.1 452.7,174.8 380.2,191.0 307.6,209.7 235.1,230.8 162.5,254.4 90,280.3"
    fill="#a9cae4" stroke="#7fb0d6" stroke-width="1"/>

  <!-- fitted regression line -->
  <polyline points="90,252.7 162.5,235.1 235.1,217.5 307.6,199.9 380.2,182.3 452.7,164.7 525.3,147.1 597.8,129.5 660,114.4"
    fill="none" stroke="#2a6f97" stroke-width="2.5"/>

  <!-- scatter data points (gentle upward trend) -->
  <g fill="#1b2a3a">
    <circle cx="110.7" cy="238.0" r="3.6"/>
    <circle cx="141.8" cy="255.6" r="3.6"/>
    <circle cx="183.3" cy="210.7" r="3.6"/>
    <circle cx="224.7" cy="229.6" r="3.6"/>
    <circle cx="266.2" cy="196.4" r="3.6"/>
    <circle cx="297.3" cy="221.7" r="3.6"/>
    <circle cx="328.4" cy="189.1" r="3.6"/>
    <circle cx="369.8" cy="196.4" r="3.6"/>
    <circle cx="400.9" cy="159.9" r="3.6"/>
    <circle cx="432.0" cy="177.5" r="3.6"/>
    <circle cx="473.5" cy="150.0" r="3.6"/>
    <circle cx="515.0" cy="165.1" r="3.6"/>
    <circle cx="556.4" cy="127.9" r="3.6"/>
    <circle cx="608.2" cy="136.7" r="3.6"/>
    <circle cx="639.3" cy="100.1" r="3.6"/>
  </g>

  <!-- axes -->
  <line x1="90" y1="40" x2="90" y2="330" stroke="#1b2a3a" stroke-width="1.6"/>
  <line x1="90" y1="330" x2="665" y2="330" stroke="#1b2a3a" stroke-width="1.6"/>

  <!-- x ticks -->
  <g stroke="#1b2a3a" stroke-width="1.2">
    <line x1="141.8" y1="330" x2="141.8" y2="335"/>
    <line x1="245.5" y1="330" x2="245.5" y2="335"/>
    <line x1="349.1" y1="330" x2="349.1" y2="335"/>
    <line x1="452.7" y1="330" x2="452.7" y2="335"/>
    <line x1="556.4" y1="330" x2="556.4" y2="335"/>
    <line x1="660" y1="330" x2="660" y2="335"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="141.8" y="349">30</text>
    <text x="245.5" y="349">40</text>
    <text x="349.1" y="349">50</text>
    <text x="452.7" y="349">60</text>
    <text x="556.4" y="349">70</text>
    <text x="660" y="349">80</text>
  </g>

  <!-- y ticks -->
  <g stroke="#1b2a3a" stroke-width="1.2">
    <line x1="85" y1="330" x2="90" y2="330"/>
    <line x1="85" y1="233.3" x2="90" y2="233.3"/>
    <line x1="85" y1="136.7" x2="90" y2="136.7"/>
    <line x1="85" y1="40" x2="90" y2="40"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="81" y="334">3.5</text>
    <text x="81" y="237.3">4.0</text>
    <text x="81" y="140.7">4.5</text>
    <text x="81" y="44">5.0</text>
  </g>

  <!-- axis titles -->
  <text x="377" y="382" font-size="15" fill="#1b2a3a" text-anchor="middle">age (years)</text>
  <text x="26" y="185" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 26 185)">log-expression</text>

  <!-- legend -->
  <g font-size="13.5" fill="#1b2a3a">
    <rect x="108" y="48" width="20" height="12" fill="#a9cae4" stroke="#7fb0d6" stroke-width="1"/>
    <text x="134" y="58">95% credible band for the mean line</text>
    <rect x="108" y="68" width="20" height="12" fill="#dce9f3" stroke="#a9cae4" stroke-width="1"/>
    <text x="134" y="78">95% prediction band for a new donor (adds σ)</text>
  </g>

  <!-- annotation: extrapolation at the extreme -->
  <text x="470" y="300" font-size="13.5" fill="#bc4749" text-anchor="middle" font-weight="bold">wider = extrapolation,</text>
  <text x="470" y="316" font-size="13.5" fill="#bc4749" text-anchor="middle" font-weight="bold">less confidence</text>
  <line x1="552" y1="291" x2="646" y2="158" stroke="#1b2a3a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- annotation: narrow waist where data densest -->
  <text x="349" y="255" font-size="12.5" fill="#6a994e" text-anchor="middle">narrowest where data densest</text>
  <line x1="378" y1="240" x2="385" y2="183" stroke="#6a994e" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
