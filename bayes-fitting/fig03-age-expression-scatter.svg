<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">many slopes fit 12 scattered donors</text>

  <!-- minimal gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="247.5" x2="600" y2="247.5"/>
    <line x1="90" y1="190.0" x2="600" y2="190.0"/>
    <line x1="90" y1="132.5" x2="600" y2="132.5"/>
  </g>

  <!-- faint candidate slopes (-0.005 to 0.065 per year, all through the cloud centre) -->
  <g stroke="#c9d3dd" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="121.5" y1="168.6" x2="600.0" y2="185.2"/>
    <line x1="121.5" y1="192.6" x2="600.0" y2="159.3"/>
    <line x1="121.5" y1="224.7" x2="600.0" y2="124.7"/>
    <line x1="121.5" y1="256.8" x2="600.0" y2="90.1"/>
    <line x1="121.5" y1="280.9" x2="600.0" y2="64.1"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="90" y1="320" x2="612" y2="320" marker-end="url(#arrow)"/>
    <line x1="90" y1="320" x2="90" y2="55" marker-end="url(#arrow)"/>
  </g>

  <!-- x ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="105.0" y1="320" x2="105.0" y2="325"/>
    <line x1="187.5" y1="320" x2="187.5" y2="325"/>
    <line x1="270.0" y1="320" x2="270.0" y2="325"/>
    <line x1="352.5" y1="320" x2="352.5" y2="325"/>
    <line x1="435.0" y1="320" x2="435.0" y2="325"/>
    <line x1="517.5" y1="320" x2="517.5" y2="325"/>
    <line x1="600.0" y1="320" x2="600.0" y2="325"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="105.0" y="339">20</text>
    <text x="187.5" y="339">30</text>
    <text x="270.0" y="339">40</text>
    <text x="352.5" y="339">50</text>
    <text x="435.0" y="339">60</text>
    <text x="517.5" y="339">70</text>
    <text x="600.0" y="339">80</text>
  </g>
  <text x="351" y="365" text-anchor="middle" font-size="15" fill="#1b2a3a">donor age (years)</text>

  <!-- y ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="85" y1="305.0" x2="90" y2="305.0"/>
    <line x1="85" y1="247.5" x2="90" y2="247.5"/>
    <line x1="85" y1="190.0" x2="90" y2="190.0"/>
    <line x1="85" y1="132.5" x2="90" y2="132.5"/>
    <line x1="85" y1="75.0" x2="90" y2="75.0"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="80" y="309.0">4.0</text>
    <text x="80" y="251.5">5.0</text>
    <text x="80" y="194.0">6.0</text>
    <text x="80" y="136.5">7.0</text>
    <text x="80" y="79.0">8.0</text>
  </g>
  <text x="26" y="188" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 26 188)">log-expression (normalised RNA-seq)</text>

  <!-- data points: the 12 donors of the demos -->
  <g fill="#1b2a3a">
    <circle cx="129.8" cy="282.0" r="5.5"/>
    <circle cx="179.2" cy="201.5" r="5.5"/>
    <circle cx="220.5" cy="247.5" r="5.5"/>
    <circle cx="253.5" cy="207.2" r="5.5"/>
    <circle cx="303.0" cy="126.8" r="5.5"/>
    <circle cx="327.8" cy="149.8" r="5.5"/>
    <circle cx="369.0" cy="92.2" r="5.5"/>
    <circle cx="402.0" cy="178.5" r="5.5"/>
    <circle cx="443.2" cy="190.0" r="5.5"/>
    <circle cx="484.5" cy="109.5" r="5.5"/>
    <circle cx="525.8" cy="144.0" r="5.5"/>
    <circle cx="583.5" cy="190.0" r="5.5"/>
  </g>
</svg>
