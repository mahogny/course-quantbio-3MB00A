  <text x="215" y="341" font-size="14" fill="#5b6b7a" text-anchor="end">4 columns, 4 left over</text>
  <line x1="449" y1="326" x2="564" y2="326" stroke="#2a6f97" stroke-width="4" stroke-linecap="round"/>
  <line x1="449" y1="318" x2="449" y2="334" stroke="#2a6f97" stroke-width="2.5"/>
  <line x1="564" y1="318" x2="564" y2="334" stroke="#2a6f97" stroke-width="2.5"/>
  <circle cx="506" cy="326" r="7" fill="#2a6f97"/>
  <line x1="230" y1="360" x2="626.0" y2="360" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="230" y1="360" x2="230" y2="366" stroke="#1b2a3a" stroke-width="1.5"/><text x="230" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">-2</text>
  <line x1="318" y1="360" x2="318" y2="366" stroke="#1b2a3a" stroke-width="1.5"/><text x="318" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">-1</text>
  <line x1="406" y1="360" x2="406" y2="366" stroke="#1b2a3a" stroke-width="1.5"/><text x="406" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">0</text>
  <line x1="494" y1="360" x2="494" y2="366" stroke="#1b2a3a" stroke-width="1.5"/><text x="494" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">1</text>
  <line x1="582" y1="360" x2="582" y2="366" stroke="#1b2a3a" stroke-width="1.5"/><text x="582" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">2</text>
  <text x="428.0" y="410" font-size="15" fill="#1b2a3a" text-anchor="middle">coefficient, with 95% confidence interval</text>
