<svg xmlns="http://www.w3.org/2000/svg" width="640" height="425" viewBox="0 0 640 425" font-family="Helvetica, Arial, sans-serif">
  <!-- one gene, 8 mice: batch coefficients near 0, and the treatment interval with / without batch (lm + confint) -->
  <line x1="406" y1="40" x2="406" y2="360" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="406" y="30" font-size="15" fill="#5b6b7a" text-anchor="middle">0 = no effect</text>
