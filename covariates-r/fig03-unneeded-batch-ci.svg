  <text x="12" y="88" font-size="14" fill="#5b6b7a">(model with batch)</text>
  <text x="215" y="132" font-size="17" fill="#1b2a3a" text-anchor="end">batchB</text>
  <line x1="299" y1="136" x2="566" y2="136" stroke="#e09f3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="299" y1="128" x2="299" y2="144" stroke="#e09f3e" stroke-width="2.5"/>
  <line x1="566" y1="128" x2="566" y2="144" stroke="#e09f3e" stroke-width="2.5"/>
  <circle cx="432" cy="136" r="7" fill="#e09f3e"/>
  <text x="215" y="177" font-size="17" fill="#1b2a3a" text-anchor="end">batchC</text>
  <line x1="256" y1="181" x2="556" y2="181" stroke="#e09f3e" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="173" x2="256" y2="189" stroke="#e09f3e" stroke-width="2.5"/>
  <line x1="556" y1="173" x2="556" y2="189" stroke="#e09f3e" stroke-width="2.5"/>
  <circle cx="406" cy="181" r="7" fill="#e09f3e"/>
  <line x1="12" y1="208" x2="628" y2="208" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="12" y="236" font-size="16" fill="#1b2a3a" font-weight="bold">treatmenttreat</text>
  <text x="215" y="270" font-size="17" fill="#1b2a3a" text-anchor="end">with batch</text>
  <text x="215" y="289" font-size="14" fill="#5b6b7a" text-anchor="end">6 columns, 2 left over</text>
  <line x1="391" y1="274" x2="608" y2="274" stroke="#bc4749" stroke-width="4" stroke-linecap="round"/>
  <line x1="391" y1="266" x2="391" y2="282" stroke="#bc4749" stroke-width="2.5"/>
  <line x1="608" y1="266" x2="608" y2="282" stroke="#bc4749" stroke-width="2.5"/>
  <circle cx="499" cy="274" r="7" fill="#bc4749"/>
