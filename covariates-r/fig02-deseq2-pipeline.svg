<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker><marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/></marker></defs>
<rect width="1120" height="300" fill="white"/>
<rect x="15" y="25" width="200" height="70" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="115.0" y="55.0" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">count matrix</text>
<text x="115.0" y="75.0" font-size="15" fill="#5b6b7a" text-anchor="middle">genes × samples</text>
<rect x="15" y="125" width="200" height="70" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="115.0" y="145.0" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">colData</text>
<text x="115.0" y="165.0" font-size="15" fill="#5b6b7a" text-anchor="middle">one row per sample:</text>
<text x="115.0" y="185.0" font-size="15" fill="#5b6b7a" text-anchor="middle">batch, sex, treatment</text>
<rect x="255" y="75" width="340" height="70" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="425.0" y="105.0" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">DESeqDataSetFromMatrix(</text>
<text x="425.0" y="125.0" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">design = ~ batch + sex + treatment)</text>
<rect x="640" y="75" width="160" height="70" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="720.0" y="105.0" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace" font-weight="bold">DESeq(dds)</text>
<text x="720.0" y="125.0" font-size="15" fill="#5b6b7a" text-anchor="middle">fits every gene</text>
<rect x="845" y="62" width="260" height="96" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
<text x="975.0" y="95.0" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">results(dds, name =</text>
<text x="975.0" y="115.0" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-family="monospace">"treatment_treat_vs_ctrl")</text>
<text x="975.0" y="135.0" font-size="15" fill="#5b6b7a" text-anchor="middle">log2FoldChange, padj</text>
<line x1="217" y1="60" x2="253" y2="96" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="217" y1="160" x2="253" y2="124" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="597" y1="110" x2="638" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="802" y1="110" x2="843" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="425" y="64" font-size="13" fill="#5b6b7a" text-anchor="middle">builds X once, checks its rank</text>
<line x1="425" y1="147" x2="425" y2="203" stroke="#bc4749" stroke-width="2.2" marker-end="url(#arrowr)"/>
<text x="435" y="181" font-size="13" fill="#bc4749">rank of X &lt; number of columns</text>
<rect x="275" y="205" width="300" height="80" rx="8" fill="#fbeeee" stroke="#bc4749" stroke-width="2"/>
<text x="425.0" y="230.0" font-size="15" fill="#bc4749" text-anchor="middle">Error: the model matrix is</text>
<text x="425.0" y="250.0" font-size="15" fill="#bc4749" text-anchor="middle" font-weight="bold">not full rank</text>
<text x="425.0" y="270.0" font-size="15" fill="#5b6b7a" text-anchor="middle">fix the experiment, not the code</text>
<text x="680" y="135" font-size="13" fill="#5b6b7a" text-anchor="middle"></text>
</svg>