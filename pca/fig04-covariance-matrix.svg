<svg xmlns="http://www.w3.org/2000/svg" viewBox="113.4 -0.3 540.2 392.6" font-family="Helvetica, Arial, sans-serif" width="540.2" height="392.6">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M8,1 L1,4.5 L8,8 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowEnd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- top annotation -->
  <text x="390" y="26" text-anchor="middle" font-size="15" fill="#1b2a3a">
    C is symmetric  →  real, non-negative eigenvalues; orthogonal eigenvectors
  </text>

  <!-- column labels -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="middle">
    <text x="205" y="78">gene_1</text>
    <text x="255" y="78">gene_2</text>
    <text x="305" y="78">gene_3</text>
    <text x="355" y="78">gene_4</text>
    <text x="405" y="78">gene_5</text>
    <text x="447" y="78" fill="#5a6b7a">…</text>
    <text x="485" y="78" font-style="italic">gene_p</text>
  </g>

  <!-- row labels -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="end">
    <text x="172" y="109">gene_1</text>
    <text x="172" y="159">gene_2</text>
    <text x="172" y="209">gene_3</text>
    <text x="172" y="259">gene_4</text>
    <text x="172" y="309">gene_5</text>
    <text x="172" y="345" font-style="italic">gene_p</text>
  </g>

  <!-- grid cells: 5x5. origin x=180 y=85, cell 50 -->
  <!-- off-diagonal fill cool, diagonal warm -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <!-- row 0 -->
    <rect x="180" y="85"  width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="230" y="85"  width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="85"  width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="85"  width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="85"  width="50" height="50" fill="#eaf1f7"/>
    <!-- row 1 -->
    <rect x="180" y="135" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="135" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="280" y="135" width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="135" width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="135" width="50" height="50" fill="#eaf1f7"/>
    <!-- row 2 -->
    <rect x="180" y="185" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="185" width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="185" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="330" y="185" width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="185" width="50" height="50" fill="#eaf1f7"/>
    <!-- row 3 -->
    <rect x="180" y="235" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="235" width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="235" width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="235" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="380" y="235" width="50" height="50" fill="#eaf1f7"/>
    <!-- row 4 -->
    <rect x="180" y="285" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="285" width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="285" width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="285" width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="285" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
  </g>

  <!-- ellipsis toward gene_p (bottom-right continuation) -->
  <text x="447" y="215" text-anchor="middle" font-size="20" fill="#5a6b7a">⋱</text>

  <!-- dashed main diagonal line -->
  <line x1="182" y1="87" x2="428" y2="333" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- entry text C_ij in a general (off-diagonal) cell: row0 col3 -->
  <text x="355" y="115" text-anchor="middle" font-size="13" fill="#2a6f97" font-style="italic">C_ij</text>

  <!-- symmetric mirrored cells: (row1,col3) and (row3,col1) -->
  <!-- cell (i=1,j=3): x 330..380 y135..185 center (355,160) -->
  <!-- cell (j=3,i=1): x 230..280 y235..285 center (255,260) -->
  <rect x="330" y="135" width="50" height="50" fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <rect x="230" y="235" width="50" height="50" fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <text x="355" y="164" text-anchor="middle" font-size="12" fill="#1b2a3a" font-style="italic">C_ij</text>
  <text x="255" y="264" text-anchor="middle" font-size="12" fill="#1b2a3a" font-style="italic">C_ji</text>

  <!-- curved double-headed arrow connecting mirrored cells -->
  <path d="M348,178 C420,235 320,215 262,242" fill="none" stroke="#2a6f97" stroke-width="1.8"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="360" y="228" text-anchor="middle" font-size="12.5" fill="#2a6f97" font-style="italic">C_ij = C_ji  (symmetric)</text>

  <!-- diagonal bracket + label (right side) -->
  <path d="M508,90 C520,90 520,205 532,208 C520,211 520,330 508,330" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="542" y="200" font-size="12.5" fill="#bc4749">diagonal =</text>
  <text x="542" y="217" font-size="12.5" fill="#bc4749" font-style="italic">var(gene_i)</text>

  <!-- off-diagonal legend swatch -->
  <rect x="180" y="360" width="20" height="16" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="207" y="373" font-size="12.5" fill="#2a6f97">off-diagonal = cov(gene_i, gene_j)</text>

  <!-- diagonal legend swatch -->
  <rect x="440" y="360" width="20" height="16" fill="#bc4749" fill-opacity="0.30" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="467" y="373" font-size="12.5" fill="#bc4749">diagonal = var(gene_i)</text>
</svg>
