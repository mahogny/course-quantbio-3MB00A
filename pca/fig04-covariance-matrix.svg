<svg xmlns="http://www.w3.org/2000/svg" viewBox="113.4 -0.3 540.2 372.3" font-family="Helvetica, Arial, sans-serif" width="540.2" height="372.3">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M8,1 L1,4.5 L8,8 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowEnd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- top annotation -->
  <text x="390" y="26" text-anchor="middle" font-size="15" fill="#1b2a3a">
    C is symmetric  →  real, non-negative eigenvalues; orthogonal eigenvectors
  </text>

  <!-- column labels -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="middle">
    <text x="205" y="60">gene_1</text>
    <text x="255" y="60">gene_2</text>
    <text x="305" y="60">gene_3</text>
    <text x="355" y="60">gene_4</text>
    <text x="405" y="60">gene_5</text>
    <text x="447" y="60" fill="#5a6b7a">…</text>
    <text x="485" y="60" font-style="italic">gene_p</text>
  </g>

  <!-- row labels -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="end">
    <text x="172" y="91">gene_1</text>
    <text x="172" y="141">gene_2</text>
    <text x="172" y="191">gene_3</text>
    <text x="172" y="241">gene_4</text>
    <text x="172" y="291">gene_5</text>
    <text x="172" y="327" font-style="italic">gene_p</text>
  </g>

  <!-- grid cells: 5x5. origin x=180 y=67, cell 50 -->
  <!-- off-diagonal fill cool, diagonal warm -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <!-- row 0 -->
    <rect x="180" y="67"  width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="230" y="67"  width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="67"  width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="67"  width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="67"  width="50" height="50" fill="#eaf1f7"/>
    <!-- row 1 -->
    <rect x="180" y="117" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="117" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="280" y="117" width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="117" width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="117" width="50" height="50" fill="#eaf1f7"/>
    <!-- row 2 -->
    <rect x="180" y="167" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="167" width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="167" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="330" y="167" width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="167" width="50" height="50" fill="#eaf1f7"/>
    <!-- row 3 -->
    <rect x="180" y="217" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="217" width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="217" width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="217" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
    <rect x="380" y="217" width="50" height="50" fill="#eaf1f7"/>
    <!-- row 4 -->
    <rect x="180" y="267" width="50" height="50" fill="#eaf1f7"/>
    <rect x="230" y="267" width="50" height="50" fill="#eaf1f7"/>
    <rect x="280" y="267" width="50" height="50" fill="#eaf1f7"/>
    <rect x="330" y="267" width="50" height="50" fill="#eaf1f7"/>
    <rect x="380" y="267" width="50" height="50" fill="#bc4749" fill-opacity="0.30"/>
  </g>

  <!-- ellipsis toward gene_p (bottom-right continuation) -->
  <g fill="#5a6b7a">
    <circle cx="441" cy="185" r="1.6"/>
    <circle cx="448" cy="194" r="1.6"/>
    <circle cx="455" cy="203" r="1.6"/>
  </g>

  <!-- dashed main diagonal line -->
  <line x1="182" y1="69" x2="428" y2="315" stroke="#bc4749" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- entry text C_ij in a general (off-diagonal) cell: row0 col3 -->
  <text x="348" y="97" text-anchor="start" font-size="13" fill="#2a6f97" font-style="italic"><tspan>C</tspan><tspan dy="3" font-size="9">ij</tspan></text>

  <!-- symmetric mirrored cells: (row1,col3) and (row3,col1) -->
  <!-- cell (i=1,j=3): x 330..380 y117..167 -->
  <!-- cell (j=3,i=1): x 230..280 y217..267 -->
  <rect x="330" y="117" width="50" height="50" fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <rect x="230" y="217" width="50" height="50" fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <text x="348" y="146" text-anchor="start" font-size="12" fill="#1b2a3a" font-style="italic"><tspan>C</tspan><tspan dy="2.5" font-size="8.5">ij</tspan></text>
  <text x="248" y="246" text-anchor="start" font-size="12" fill="#1b2a3a" font-style="italic"><tspan>C</tspan><tspan dy="2.5" font-size="8.5">ji</tspan></text>

  <!-- curved double-headed arrow connecting mirrored cells -->
  <path d="M350,168 C410,210 322,200 258,217" fill="none" stroke="#2a6f97" stroke-width="1.8"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <!-- symmetric relation label: placed below the lower box, clear of diagonal and arrow -->
  <text x="246" y="293" text-anchor="start" font-size="12.5" fill="#2a6f97" font-style="italic"><tspan>C</tspan><tspan dy="3" font-size="8.5">ij</tspan><tspan dy="-3">&#160;=&#160;C</tspan><tspan dy="3" font-size="8.5">ji</tspan><tspan dy="-3">&#160;(symmetric)</tspan></text>

  <!-- diagonal bracket + label (right side) -->
  <path d="M508,72 C520,72 520,190 532,193 C520,196 520,312 508,312" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <text x="542" y="185" font-size="12.5" fill="#bc4749">diagonal =</text>
  <text x="542" y="202" font-size="12.5" fill="#bc4749" font-style="italic">var(gene_i)</text>

  <!-- off-diagonal legend swatch -->
  <rect x="180" y="340" width="20" height="16" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="207" y="353" font-size="12.5" fill="#2a6f97">off-diagonal = cov(gene_i, gene_j)</text>

  <!-- diagonal legend swatch -->
  <rect x="440" y="340" width="20" height="16" fill="#bc4749" fill-opacity="0.30" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="467" y="353" font-size="12.5" fill="#bc4749">diagonal = var(gene_i)</text>
</svg>
