<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.2 33.3 657.9 375.8" font-family="Helvetica, Arial, sans-serif" width="657.9" height="375.8">
  <!-- Loadings grouped bar chart. Baseline y=200. 0.71 maps to 110px. -->

  <!-- y axis -->
  <line x1="95" y1="70" x2="95" y2="340" stroke="#1b2a3a" stroke-width="2"/>

  <!-- gridlines and y ticks -->
  <line x1="95" y1="90"  x2="640" y2="90"  stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="95" y1="310" x2="640" y2="310" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="88" y="95"  text-anchor="end" font-size="13" fill="#1b2a3a">+0.71</text>
  <text x="88" y="205" text-anchor="end" font-size="13" fill="#1b2a3a">0</text>
  <text x="88" y="315" text-anchor="end" font-size="13" fill="#1b2a3a">−0.71</text>
  <text x="30" y="205" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 30 205)">loading (eigenvector entry)</text>

  <!-- zero baseline (bold) -->
  <line x1="95" y1="200" x2="640" y2="200" stroke="#1b2a3a" stroke-width="2"/>

  <!-- GENE_A group -->
  <rect x="175" y="90" width="55" height="110" fill="#2a6f97" opacity="0.9"/>
  <rect x="235" y="90" width="55" height="110" fill="#bc4749" opacity="0.9"/>
  <text x="202" y="83" text-anchor="middle" font-size="14" fill="#1b2a3a">0.71</text>
  <text x="262" y="83" text-anchor="middle" font-size="14" fill="#1b2a3a">0.71</text>
  <text x="232" y="360" text-anchor="middle" font-size="16" fill="#1b2a3a" font-weight="bold">GENE_A</text>

  <!-- GENE_B group -->
  <rect x="415" y="90"  width="55" height="110" fill="#2a6f97" opacity="0.9"/>
  <rect x="475" y="200" width="55" height="110" fill="#bc4749" opacity="0.9"/>
  <text x="442" y="83"  text-anchor="middle" font-size="14" fill="#1b2a3a">0.71</text>
  <text x="502" y="328" text-anchor="middle" font-size="14" fill="#1b2a3a">−0.71</text>
  <text x="472" y="360" text-anchor="middle" font-size="16" fill="#1b2a3a" font-weight="bold">GENE_B</text>

  <!-- legend -->
  <rect x="500" y="52" width="18" height="14" fill="#2a6f97" opacity="0.9"/>
  <text x="524" y="64" font-size="14" fill="#1b2a3a">PC1</text>
  <rect x="565" y="52" width="18" height="14" fill="#bc4749" opacity="0.9"/>
  <text x="589" y="64" font-size="14" fill="#1b2a3a">PC2</text>

  <!-- eigenvector note -->
  <text x="95" y="388" font-size="14" fill="#2a6f97">= entries of  (1/√2)·(1, 1)  and  (1/√2)·(1, −1)</text>

  <!-- annotation (placed in the empty lower-left quadrant, clear of all bars) -->
  <text x="115" y="243" font-size="13" fill="#6a994e">large |loading| = gene drives the PC</text>
  <text x="115" y="266" font-size="13" fill="#6a994e">near 0 = barely matters</text>
  <text x="115" y="289" font-size="13" fill="#6a994e" font-style="italic">sign is arbitrary</text>
</svg>
