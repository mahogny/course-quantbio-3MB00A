<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ================= coordinate plane ================= -->
  <!-- light grid every 1 unit (scale 52 px/unit, origin at 75,375) -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="127" y1="375" x2="127" y2="63"/>
    <line x1="179" y1="375" x2="179" y2="63"/>
    <line x1="231" y1="375" x2="231" y2="63"/>
    <line x1="283" y1="375" x2="283" y2="63"/>
    <line x1="335" y1="375" x2="335" y2="63"/>
    <line x1="387" y1="375" x2="387" y2="63"/>
    <line x1="75" y1="323" x2="387" y2="323"/>
    <line x1="75" y1="271" x2="387" y2="271"/>
    <line x1="75" y1="219" x2="387" y2="219"/>
    <line x1="75" y1="167" x2="387" y2="167"/>
    <line x1="75" y1="115" x2="387" y2="115"/>
    <line x1="75" y1="63"  x2="387" y2="63"/>
  </g>

  <!-- mismatch triangle (2,3)(2,4)(3,3) -->
  <polygon points="179,219 179,167 231,219" fill="#eaf1f7" stroke="none"/>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="75" y1="375" x2="410" y2="375" marker-end="url(#arrow)"/>
    <line x1="75" y1="375" x2="75"  y2="52"  marker-end="url(#arrow)"/>
  </g>
  <text x="416" y="380" font-size="17" fill="#1b2a3a" font-style="italic">x₁</text>
  <text x="60"  y="48"  font-size="17" fill="#1b2a3a" font-style="italic">x₂</text>

  <!-- axis ticks -->
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="127" y="392">1</text><text x="179" y="392">2</text><text x="231" y="392">3</text>
    <text x="283" y="392">4</text><text x="335" y="392">5</text><text x="387" y="392">6</text>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="69" y="327">1</text><text x="69" y="275">2</text><text x="69" y="223">3</text>
    <text x="69" y="171">4</text><text x="69" y="119">5</text><text x="69" y="67">6</text>
  </g>

  <!-- ================= three conflicting lines ================= -->
  <!-- x1 = 2 (vertical, blue) -->
  <line x1="179" y1="63" x2="179" y2="375" stroke="#2a6f97" stroke-width="2.4"/>
  <text x="150" y="78" font-size="15" fill="#2a6f97" font-weight="bold">x₁ = 2</text>

  <!-- x2 = 3 (horizontal, green) -->
  <line x1="75" y1="219" x2="387" y2="219" stroke="#6a994e" stroke-width="2.4"/>
  <text x="300" y="212" font-size="15" fill="#6a994e" font-weight="bold">x₂ = 3</text>

  <!-- x1 + x2 = 6 (diagonal, red) -->
  <line x1="75" y1="63" x2="387" y2="375" stroke="#bc4749" stroke-width="2.4"/>
  <text x="300" y="300" font-size="15" fill="#bc4749" font-weight="bold">x₁ + x₂ = 6</text>

  <!-- ================= residual segments (perpendicular gaps) ================= -->
  <g stroke="#1b2a3a" stroke-width="1.8" stroke-dasharray="4 3">
    <line x1="196" y1="202" x2="179" y2="202"/>   <!-- to x1=2 -->
    <line x1="196" y1="202" x2="196" y2="219"/>   <!-- to x2=3 -->
    <line x1="196" y1="202" x2="205" y2="193"/>   <!-- to x1+x2=6 -->
  </g>
  <g fill="#1b2a3a">
    <circle cx="179" cy="202" r="2.6"/>
    <circle cx="196" cy="219" r="2.6"/>
    <circle cx="205" cy="193" r="2.6"/>
  </g>

  <!-- ================= least-squares solution star ================= -->
  <polygon points="196,191 198.6,198.36 206.46,198.6 200.28,203.39 202.47,210.9 196,206.5 189.53,210.9 191.72,203.39 185.54,198.6 193.36,198.36"
           fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1" stroke-linejoin="round"/>

  <!-- leader from star to label -->
  <line x1="206" y1="199" x2="452" y2="150" stroke="#1b2a3a" stroke-width="1"/>

  <!-- ================= right-side annotations ================= -->
  <text x="456" y="132" font-size="13" fill="#5a6b7a">least-squares solution</text>
  <text x="456" y="154" font-size="18" fill="#1b2a3a" font-weight="bold">x = (2.33, 3.33)</text>

  <text x="456" y="222" font-size="13.5" fill="#1b2a3a">each dashed segment = residual</text>
  <text x="456" y="242" font-size="13.5" fill="#5a6b7a">(perpendicular gap to a line)</text>

  <text x="456" y="300" font-size="13.5" fill="#1b2a3a">minimises total squared mismatch</text>
  <text x="456" y="326" font-size="20" fill="#bc4749" font-weight="bold">‖A x − b‖²</text>

  <!-- ================= caption ================= -->
  <text x="380" y="410" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">No point hits all three lines, so pick the one closest to all of them.</text>
</svg>
