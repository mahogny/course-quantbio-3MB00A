<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="175" y1="40" x2="175" y2="360"/>
    <line x1="260" y1="40" x2="260" y2="360"/>
    <line x1="345" y1="40" x2="345" y2="360"/>
    <line x1="430" y1="40" x2="430" y2="360"/>
    <line x1="90" y1="280" x2="430" y2="280"/>
    <line x1="90" y1="200" x2="430" y2="200"/>
    <line x1="90" y1="120" x2="430" y2="120"/>
    <line x1="90" y1="40" x2="430" y2="40"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="90" y1="360" x2="445" y2="360" marker-end="url(#arrow)"/>
    <line x1="90" y1="360" x2="90" y2="30" marker-end="url(#arrow)"/>
  </g>
  <text x="452" y="365" font-size="16" fill="#1b2a3a" font-style="italic">x₁</text>
  <text x="80" y="26" font-size="16" fill="#1b2a3a" font-style="italic">x₂</text>

  <!-- axis ticks -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="90" y="380">0</text>
    <text x="175" y="380">1</text>
    <text x="260" y="380">2</text>
    <text x="345" y="380">3</text>
    <text x="430" y="380">4</text>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="82" y="285">1</text>
    <text x="82" y="205">2</text>
    <text x="82" y="125">3</text>
    <text x="82" y="45">4</text>
  </g>

  <!-- the two coincident lines: offset second stroke to show overlap -->
  <!-- second equation (2x1+2x2=6) drawn slightly offset -->
  <line x1="352" y1="365" x2="97" y2="125" stroke="#bc4749" stroke-width="4" stroke-opacity="0.5"/>
  <!-- first equation (x1+x2=3) -->
  <line x1="345" y1="360" x2="90" y2="120" stroke="#2a6f97" stroke-width="4"/>

  <!-- solution dots (open circles) -->
  <g fill="#ffffff" stroke="#1b2a3a" stroke-width="2">
    <circle cx="345" cy="360" r="6"/>
    <circle cx="260" cy="280" r="6"/>
    <circle cx="175" cy="200" r="6"/>
    <circle cx="90" cy="120" r="6"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="345" y="345">(3,0)</text>
    <text x="290" y="272">(2,1)</text>
    <text x="205" y="192">(1,2)</text>
    <text x="118" y="112">(0,3)</text>
  </g>

  <!-- equation labels -->
  <text x="300" y="180" font-size="15" fill="#2a6f97" font-weight="bold">x₁ + x₂ = 3</text>
  <text x="300" y="200" font-size="13" fill="#bc4749">2x₁ + 2x₂ = 6</text>
  <text x="300" y="216" font-size="12" fill="#bc4749" font-style="italic">same line (row 2 = 2 × row 1)</text>

  <!-- bracket note: every point is a solution -->
  <path d="M470,110 C486,110 486,225 502,235 C486,245 486,360 470,360" fill="none" stroke="#6a994e" stroke-width="2"/>
  <text x="512" y="222" font-size="14" fill="#6a994e" font-weight="bold">every point on this</text>
  <text x="512" y="242" font-size="14" fill="#6a994e" font-weight="bold">line is a solution</text>

  <!-- caption -->
  <text x="30" y="398" font-size="13" fill="#1b2a3a">Singular A: the two equations carry the same information, leaving a whole line of solutions.</text>
</svg>
