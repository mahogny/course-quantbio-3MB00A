<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- Coordinate system: origin at pixel (150,300); 130 px per unit -->
  <!-- x-axis: from x=-0.5 (pixel 85) to x=1.6 (pixel 358) -->
  <!-- y-axis: from x2=-0.5 (pixel 365) to x2=1.35 (pixel 125) -->

  <!-- light grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="150" y1="125" x2="150" y2="365"/>
    <line x1="280" y1="125" x2="280" y2="365"/>
    <line x1="85"  y1="300" x2="358" y2="300"/>
    <line x1="85"  y1="170" x2="358" y2="170"/>
  </g>

  <!-- shaded non-negative side (first-quadrant tint near the segment) -->
  <polygon points="150,300 280,300 150,170" fill="#eaf1f7" stroke="none"/>

  <!-- axes (slightly into negative territory) -->
  <g stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="85"  y1="300" x2="360" y2="300"/>
    <line x1="150" y1="365" x2="150" y2="120"/>
  </g>
  <!-- origin tick -->
  <circle cx="150" cy="300" r="2.5" fill="#1b2a3a"/>
  <text x="138" y="318" font-size="13" fill="#1b2a3a" text-anchor="end">0</text>

  <!-- axis unit ticks -->
  <line x1="280" y1="296" x2="280" y2="304" stroke="#1b2a3a" stroke-width="2"/>
  <text x="280" y="318" font-size="13" fill="#1b2a3a" text-anchor="middle">1</text>
  <line x1="146" y1="170" x2="154" y2="170" stroke="#1b2a3a" stroke-width="2"/>
  <text x="140" y="174" font-size="13" fill="#1b2a3a" text-anchor="end">1</text>

  <!-- axis labels -->
  <text x="368" y="304" font-size="15" fill="#1b2a3a">x₁</text>
  <text x="368" y="318" font-size="12" fill="#2a6f97">fraction cell type 1</text>
  <text x="158" y="132" font-size="15" fill="#1b2a3a">x₂</text>
  <text x="158" y="147" font-size="12" fill="#2a6f97">fraction cell type 2</text>

  <!-- feasible segment: (1,0)->(0,1) i.e. pixel (280,300)->(150,170) -->
  <line x1="280" y1="300" x2="150" y2="170" stroke="#2a6f97" stroke-width="4.5"/>
  <circle cx="280" cy="300" r="4" fill="#2a6f97"/>
  <circle cx="150" cy="170" r="4" fill="#2a6f97"/>
  <text x="300" y="235" font-size="14" fill="#2a6f97" font-weight="bold">valid fractions:</text>
  <text x="300" y="253" font-size="13" fill="#2a6f97">x ≥ 0 and sum to 1</text>
  <text x="300" y="271" font-size="13" fill="#2a6f97">(x₁ + x₂ = 1)</text>

  <!-- unconstrained solve result at (1.3,-0.3): pixel (319, 339) -->
  <g stroke="#bc4749" stroke-width="3">
    <line x1="311" y1="331" x2="327" y2="347"/>
    <line x1="327" y1="331" x2="311" y2="347"/>
  </g>
  <text x="335" y="336" font-size="13" fill="#bc4749" font-weight="bold">plain solve/lm can land here:</text>
  <text x="335" y="353" font-size="13" fill="#bc4749">negative fraction —</text>
  <text x="335" y="369" font-size="13" fill="#bc4749">biologically impossible</text>

  <!-- constrained arrow from invalid point onto the segment -->
  <!-- projects (319,339) roughly to segment point (261,281) -->
  <path d="M316,335 Q285,300 264,283" fill="none" stroke="#6a994e" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="230" y="345" font-size="12.5" fill="#6a994e" text-anchor="middle">constrained methods</text>
  <text x="230" y="361" font-size="12.5" fill="#6a994e" text-anchor="middle">(e.g. NNLS / CIBERSORT)</text>
  <text x="230" y="377" font-size="12.5" fill="#6a994e" text-anchor="middle">enforce this</text>

  <!-- caption -->
  <text x="360" y="26" font-size="14.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">Real fractions live on the simplex; unconstrained linear algebra may leave it.</text>
</svg>
