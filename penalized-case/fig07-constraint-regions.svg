<svg xmlns="http://www.w3.org/2000/svg" viewBox="18.7 -6.8 876.9 378.9" font-family="Helvetica, Arial, sans-serif" width="876.9" height="378.9">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== PANEL 1: RIDGE ===================== -->
  <text x="145" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Ridge (α = 0)</text>

  <!-- axes -->
  <line x1="72" y1="180" x2="218" y2="180" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="145" y1="253" x2="145" y2="102" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="224" y="184" font-size="13" fill="#1b2a3a">β1</text>
  <text x="151" y="104" font-size="13" fill="#1b2a3a">β2</text>

  <!-- circular constraint -->
  <circle cx="145" cy="180" r="58" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- loss contour ellipse -->
  <ellipse cx="201.6" cy="107.5" rx="78" ry="34" transform="rotate(38 201.6 107.5)" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <circle cx="201.6" cy="107.5" r="2.3" fill="#bc4749"/>
  <text x="207" y="104" font-size="11" fill="#bc4749">β̂</text>

  <!-- touch point -->
  <circle cx="180.7" cy="134.3" r="4" fill="#6a994e"/>
  <text x="188" y="150" font-size="11" fill="#6a994e">both &gt; 0</text>

  <text x="145" y="274" text-anchor="middle" font-size="12.5" fill="#1b2a3a">keeps all members, shrinks together,</text>
  <text x="145" y="291" text-anchor="middle" font-size="12.5" fill="#1b2a3a">splits the weight — stable but</text>
  <text x="145" y="308" text-anchor="middle" font-size="12.5" fill="#1b2a3a">never exactly zero.</text>

  <!-- ===================== PANEL 2: LASSO ===================== -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Lasso (α = 1)</text>

  <line x1="377" y1="180" x2="523" y2="180" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="450" y1="253" x2="450" y2="102" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="529" y="184" font-size="13" fill="#1b2a3a">β1</text>
  <text x="456" y="104" font-size="13" fill="#1b2a3a">β2</text>

  <!-- diamond constraint -->
  <polygon points="508,180 450,122 392,180 450,238" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- loss contour ellipse -->
  <ellipse cx="470.9" cy="95.2" rx="78" ry="34" transform="rotate(38 470.9 95.2)" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <circle cx="470.9" cy="95.2" r="2.3" fill="#bc4749"/>

  <!-- touch point at corner -->
  <circle cx="450" cy="122" r="4" fill="#6a994e"/>
  <text x="460" y="118" font-size="11" fill="#6a994e">β1 = 0</text>

  <text x="450" y="274" text-anchor="middle" font-size="12.5" fill="#1b2a3a">keeps one, zeros the rest —</text>
  <text x="450" y="291" text-anchor="middle" font-size="12.5" fill="#1b2a3a">sparse but unstable choice.</text>

  <!-- ================= PANEL 3: ELASTIC NET ================= -->
  <text x="755" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Elastic net (0 &lt; α &lt; 1)</text>

  <line x1="682" y1="180" x2="828" y2="180" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="755" y1="253" x2="755" y2="102" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="834" y="184" font-size="13" fill="#1b2a3a">β1</text>
  <text x="761" y="104" font-size="13" fill="#1b2a3a">β2</text>

  <!-- rounded diamond (superellipse, between circle and diamond) -->
  <path d="M 813,180
           L 810.4,170.45 L 802.9,157.0 L 791.5,143.5 L 778.0,132.1 L 764.55,124.6
           L 755,122
           L 745.45,124.6 L 732.0,132.1 L 718.5,143.5 L 707.1,157.0 L 699.6,170.45
           L 697,180
           L 699.6,189.55 L 707.1,203.0 L 718.5,216.5 L 732.0,227.9 L 745.45,235.45
           L 755,238
           L 764.55,235.45 L 778.0,227.9 L 791.5,216.5 L 802.9,203.0 L 810.4,189.55
           Z"
        fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>

  <!-- loss contour ellipse -->
  <ellipse cx="786.96" cy="97.8" rx="78" ry="34" transform="rotate(28.7 786.96 97.8)" fill="none" stroke="#bc4749" stroke-width="1.8"/>
  <circle cx="786.96" cy="97.8" r="2.3" fill="#bc4749"/>

  <!-- touch point off-axis, skewed toward β2 -->
  <circle cx="770.66" cy="127.6" r="4" fill="#6a994e"/>
  <text x="712" y="123" font-size="11" fill="#6a994e">both &gt; 0</text>

  <text x="755" y="274" text-anchor="middle" font-size="12.5" fill="#1b2a3a">grouping effect: correlated members</text>
  <text x="755" y="291" text-anchor="middle" font-size="12.5" fill="#1b2a3a">enter/leave together — sparse and stable.</text>

  <!-- shared legend -->
  <text x="450" y="344" text-anchor="middle" font-size="11.5" fill="#5a6b7a">tinted region: coefficient budget   ·   red ellipse: loss contour (β̂ at its center)   ·   green dot: solution</text>
</svg>
