<svg xmlns="http://www.w3.org/2000/svg" width="840" height="374" viewBox="18 14 840 374" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- node style: circle r=22, tint fill, primary stroke; definition ABOVE apex node, punchline below -->

  <!-- ============ DAG 1: Proxy ============ -->
  <text x="150" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Proxy</text>
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#2a6f97">D = true driver</text>

  <!-- D true driver (apex) -->
  <circle cx="150" cy="90" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="150" y="96" text-anchor="middle" font-size="15" fill="#1b2a3a">D</text>

  <!-- G selected gene (bottom left) -->
  <circle cx="80" cy="200" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="80" y="206" text-anchor="middle" font-size="15" fill="#1b2a3a">G</text>

  <!-- y drug response (bottom right) -->
  <circle cx="220" cy="200" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="220" y="206" text-anchor="middle" font-size="15" fill="#1b2a3a">y</text>

  <!-- D to G -->
  <line x1="138.2" y1="108.6" x2="91.8" y2="181.4" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- D to y -->
  <line x1="161.8" y1="108.6" x2="208.2" y2="181.4" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- spurious dashed non causal between G and y -->
  <line x1="102" y1="200" x2="198" y2="200" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="150" y="250" text-anchor="middle" font-size="11.5" fill="#bc4749">spurious association</text>
  <text x="150" y="266" text-anchor="middle" font-size="11.5" fill="#bc4749">(G correlated, not functional)</text>

  <!-- ============ DAG 2: Reverse causation ============ -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Reverse causation</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#2a6f97">y = drug response</text>

  <!-- y (top) -->
  <circle cx="440" cy="90" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="440" y="96" text-anchor="middle" font-size="15" fill="#1b2a3a">y</text>

  <!-- G (bottom) -->
  <circle cx="440" cy="200" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="440" y="206" text-anchor="middle" font-size="15" fill="#1b2a3a">G</text>
  <text x="440" y="248" text-anchor="middle" font-size="12" fill="#2a6f97">G = selected gene</text>

  <!-- y to G -->
  <line x1="440" y1="112" x2="440" y2="178" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="440" y="272" text-anchor="middle" font-size="11.5" fill="#1b2a3a">expression is downstream of</text>
  <text x="440" y="288" text-anchor="middle" font-size="11.5" fill="#1b2a3a">the phenotype, not a cause</text>

  <!-- ============ DAG 3: Confounder ============ -->
  <text x="730" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Confounder</text>
  <text x="730" y="56" text-anchor="middle" font-size="12" fill="#2a6f97">C = purity / batch</text>

  <!-- C (apex) -->
  <circle cx="730" cy="90" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="730" y="96" text-anchor="middle" font-size="15" fill="#1b2a3a">C</text>

  <!-- G (bottom left) -->
  <circle cx="660" cy="200" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="660" y="206" text-anchor="middle" font-size="15" fill="#1b2a3a">G</text>

  <!-- y (bottom right) -->
  <circle cx="800" cy="200" r="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="800" y="206" text-anchor="middle" font-size="15" fill="#1b2a3a">y</text>

  <!-- C to G -->
  <line x1="718.2" y1="108.6" x2="671.8" y2="181.4" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- C to y -->
  <line x1="741.8" y1="108.6" x2="788.2" y2="181.4" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="730" y="250" text-anchor="middle" font-size="11.5" fill="#6a994e">gene rides the confounder</text>

  <!-- divider lines between panels -->
  <line x1="295" y1="46" x2="295" y2="296" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="585" y1="46" x2="585" y2="296" stroke="#c9d3dd" stroke-width="1"/>

  <!-- ============ caption strip ============ -->
  <rect x="30" y="308" width="820" height="66" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="440" y="335" text-anchor="middle" font-size="13.5" fill="#1b2a3a">prediction = association in this data;  causation needs perturbation (knockdown / CRISPR).</text>
  <text x="440" y="359" text-anchor="middle" font-size="13.5" font-style="italic" fill="#2a6f97">A penalized fit supplies hypotheses, not conclusions.</text>
</svg>
