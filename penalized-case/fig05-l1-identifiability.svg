<svg xmlns="http://www.w3.org/2000/svg" viewBox="23.5 25.9 696.4 404.8" font-family="Helvetica, Arial, sans-serif" width="696.4" height="404.8">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- coordinate axes, origin at (330,200) -->
  <line x1="150" y1="200" x2="668" y2="200" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="340" x2="330" y2="48" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="315" y="218" text-anchor="end" font-size="12" fill="#7d8a97">0</text>
  <text x="612" y="192" font-size="15" fill="#1b2a3a">β<tspan dy="4" font-size="11">A</tspan><tspan dy="-4">  (gene A)</tspan></text>
  <text x="342" y="62" font-size="15" fill="#1b2a3a">β<tspan dy="4" font-size="11">B</tspan><tspan dy="-4">  (gene B)</tspan></text>

  <!-- L1 constraint region: diamond with vertices on the axes -->
  <polygon points="420,200 330,110 240,200 330,290" fill="#eaf1f7" fill-opacity="0.85" stroke="#2a6f97" stroke-width="2"/>
  <text x="58" y="150" font-size="14" fill="#2a6f97">L<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> ball:  |β</tspan><tspan dy="4" font-size="10">A</tspan><tspan dy="-4">| + |β</tspan><tspan dy="4" font-size="10">B</tspan><tspan dy="-4">| ≤ t</tspan></text>
  <line x1="180" y1="152" x2="282" y2="156" stroke="#2a6f97" stroke-width="1"/>

  <!-- least-squares loss contours: very elongated ellipses (cigar) along the -->
  <!-- anti-diagonal valley beta_A + beta_B = const; rotated 45 degrees -->
  <g transform="rotate(45 452 232)" fill="none" stroke="#bc4749">
    <ellipse cx="452" cy="232" rx="185" ry="34" stroke-width="1.4" opacity="0.55"/>
    <ellipse cx="452" cy="232" rx="140" ry="26" stroke-width="1.4" opacity="0.65"/>
    <ellipse cx="452" cy="232" rx="95"  ry="18" stroke-width="1.6" opacity="0.8"/>
    <ellipse cx="452" cy="232" rx="50"  ry="10" stroke-width="2.1"/>
  </g>

  <!-- flat valley: double arrow along the long axis of the cigar -->
  <line x1="452" y1="232" x2="352" y2="132" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
  <line x1="452" y1="232" x2="556" y2="336" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>

  <!-- lasso solution: smallest contour first touches the diamond CORNER on beta_A axis -->
  <circle cx="420" cy="200" r="5.5" fill="#bc4749" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="512" y1="150" x2="426" y2="197" stroke="#bc4749" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="516" y="140" font-size="14" fill="#bc4749" font-weight="bold">lasso solution:</text>
  <text x="516" y="157" font-size="14" fill="#bc4749">all weight on A,  β<tspan dy="4" font-size="10">B</tspan><tspan dy="-4"> = 0</tspan></text>

  <!-- valley annotation -->
  <text x="44" y="80" font-size="14" fill="#6a994e">flat valley: many β</text>
  <text x="44" y="99" font-size="14" fill="#6a994e">combinations fit equally well</text>
  <line x1="252" y1="95" x2="326" y2="106" stroke="#6a994e" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- note box -->
  <rect x="44" y="356" width="632" height="54" rx="6" fill="#eaf1f7" fill-opacity="0.6" stroke="#c9d3dd" stroke-width="1"/>
  <text x="80" y="377" font-size="13.5" fill="#1b2a3a">Which corner (A or B) wins is set by a tiny sample-correlation difference = noise, because x<tspan dy="3" font-size="10">A</tspan><tspan dy="-3"> ≈ x</tspan><tspan dy="3" font-size="10">B</tspan><tspan dy="-3">.</tspan></text>
  <text x="360" y="397" text-anchor="middle" font-size="13.5" fill="#1b2a3a">→ selection is not identifiable, though prediction is fine.</text>
</svg>
