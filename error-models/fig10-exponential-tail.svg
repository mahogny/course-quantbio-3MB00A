<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.3 -1.6 656.5 382.8" font-family="Helvetica, Arial, sans-serif" width="656.5" height="382.8">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- gridlines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="80" y1="175" x2="620" y2="175"/>
    <line x1="80" y1="40"  x2="620" y2="40"/>
  </g>

  <!-- shaded tail region t greater than 1 -->
  <path d="M260,273.5 L305,287.9 L350,296.6 L395,301.8 L440,305.1 L530,308.2 L620,309.3 L620,310 L260,310 Z"
        fill="#bc4749" fill-opacity="0.22" stroke="none"/>

  <!-- density curve f(t)=2 e^(-2t) -->
  <path d="M80,40 L102.5,99.7 L125,146.2 L147.5,182.5 L170,210.7 L192.5,232.6 L215,249.8 L237.5,263.1 L260,273.5 L305,287.9 L350,296.6 L395,301.8 L440,305.1 L530,308.2 L620,309.3"
        fill="none" stroke="#2a6f97" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="1.8">
    <line x1="80" y1="310" x2="632" y2="310" marker-end="url(#arrow)"/>
    <line x1="80" y1="310" x2="80"  y2="32"  marker-end="url(#arrow)"/>
  </g>

  <!-- x ticks -->
  <g stroke="#1b2a3a" stroke-width="1.5" fill="#1b2a3a" font-size="13" text-anchor="middle">
    <line x1="80"  y1="310" x2="80"  y2="316"/>
    <line x1="260" y1="310" x2="260" y2="318" stroke-width="2.2" stroke="#bc4749"/>
    <line x1="440" y1="310" x2="440" y2="316"/>
    <line x1="620" y1="310" x2="620" y2="316"/>
    <text x="80"  y="331">0</text>
    <text x="260" y="331" fill="#bc4749">1</text>
    <text x="440" y="331">2</text>
    <text x="620" y="331">3</text>
  </g>

  <!-- y ticks -->
  <g stroke="#1b2a3a" stroke-width="1.5" fill="#1b2a3a" font-size="13" text-anchor="end">
    <line x1="74" y1="310" x2="80" y2="310"/>
    <line x1="74" y1="175" x2="80" y2="175"/>
    <line x1="74" y1="40"  x2="80" y2="40"/>
    <text x="70" y="314">0</text>
    <text x="70" y="179">1</text>
    <text x="70" y="44">2</text>
  </g>

  <!-- mean dashed line at t = 0.5 -->
  <line x1="170" y1="70" x2="170" y2="310" stroke="#6a994e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <g fill="#6a994e" font-size="13.5" text-anchor="middle">
    <text x="170" y="60">mean gap = 1/λ = 0.5 Mb</text>
  </g>

  <!-- tail probability label -->
  <g font-size="14" fill="#bc4749">
    <text x="360" y="150" font-weight="bold">P(T &gt; 1) = e^(-2) ≈ 0.135</text>
    <text x="360" y="169" font-size="12.5" fill="#7a3435">(13.5% chance of a gap &gt; 1 Mb)</text>
  </g>
  <line x1="430" y1="177" x2="430" y2="255" stroke="#bc4749" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- curve height annotation at origin -->
  <g fill="#2a6f97" font-size="13">
    <text x="112" y="30">f(t) = 2 e^(-2t)</text>
  </g>

  <!-- axis labels -->
  <text x="356" y="360" font-size="14.5" fill="#1b2a3a" text-anchor="middle">distance to next mutation (Mb)</text>
  <text x="26" y="175" font-size="14.5" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 26 175)">density</text>

  <!-- corner note tying to Poisson -->
  <g font-size="12.5" fill="#1b2a3a" text-anchor="end">
    <text x="632" y="26">same rate λ = 2:</text>
    <text x="632" y="43">count per 1-Mb window ~ Poisson(2)</text>
  </g>
</svg>
