<svg xmlns="http://www.w3.org/2000/svg" viewBox="24.1 -17.0 834.1 405.0" font-family="Helvetica, Arial, sans-serif" width="834.1" height="405.0">
  <defs>
    <marker id="mEndP" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="mEndG" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6a994e"/>
    </marker>
    <marker id="mStartG" markerWidth="12" markerHeight="12" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,3 L8,6 Z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- Title strip -->
  <rect x="242" y="8" width="396" height="30" rx="7" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">One Poisson process, two questions</text>

  <!-- ============ POISSON VIEW (blue) ============ -->
  <text x="440" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">How MANY per fixed window?  →  Poisson(λ),  mean count = λ</text>

  <!-- window count labels -->
  <text x="183.5" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">3 events</text>
  <text x="440.5" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">2 events</text>
  <text x="697"   y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a6f97">4 events</text>

  <!-- curly brackets over each fixed window -->
  <path d="M 63 100 Q 63 110 73 110 L 173.5 110 Q 183.5 110 183.5 120 Q 183.5 110 193.5 110 L 294 110 Q 304 110 304 100" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <path d="M 320 100 Q 320 110 330 110 L 430.5 110 Q 440.5 110 440.5 120 Q 440.5 110 450.5 110 L 551 110 Q 561 110 561 100" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <path d="M 577 100 Q 577 110 587 110 L 687 110 Q 697 110 697 120 Q 697 110 707 110 L 807 110 Q 817 110 817 100" fill="none" stroke="#2a6f97" stroke-width="2"/>

  <!-- fixed-window dividers -->
  <line x1="312" y1="98" x2="312" y2="214" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="569" y1="98" x2="569" y2="214" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ============ THE ONE TIMELINE ============ -->
  <line x1="48" y1="205" x2="834" y2="205" stroke="#1b2a3a" stroke-width="2" marker-end="url(#mEndP)"/>
  <text x="828" y="196" text-anchor="end" font-size="12" fill="#6b7883">time</text>

  <!-- vertical connectors from dots down to gap arrows -->
  <g stroke="#c9d3dd" stroke-width="1" stroke-dasharray="2,3">
    <line x1="95"  y1="205" x2="95"  y2="238"/>
    <line x1="165" y1="205" x2="165" y2="238"/>
    <line x1="260" y1="205" x2="260" y2="238"/>
    <line x1="380" y1="205" x2="380" y2="238"/>
    <line x1="500" y1="205" x2="500" y2="238"/>
    <line x1="605" y1="205" x2="605" y2="238"/>
    <line x1="665" y1="205" x2="665" y2="238"/>
    <line x1="735" y1="205" x2="735" y2="238"/>
    <line x1="800" y1="205" x2="800" y2="238"/>
  </g>

  <!-- event dots -->
  <g fill="#1b2a3a">
    <circle cx="95"  cy="205" r="6"/>
    <circle cx="165" cy="205" r="6"/>
    <circle cx="260" cy="205" r="6"/>
    <circle cx="380" cy="205" r="6"/>
    <circle cx="500" cy="205" r="6"/>
    <circle cx="605" cy="205" r="6"/>
    <circle cx="665" cy="205" r="6"/>
    <circle cx="735" cy="205" r="6"/>
    <circle cx="800" cy="205" r="6"/>
  </g>

  <!-- ============ EXPONENTIAL VIEW (green): gaps between events ============ -->
  <g stroke="#6a994e" stroke-width="1.8" marker-start="url(#mStartG)" marker-end="url(#mEndG)">
    <line x1="95"  y1="238" x2="165" y2="238"/>
    <line x1="165" y1="238" x2="260" y2="238"/>
    <line x1="260" y1="238" x2="380" y2="238"/>
    <line x1="380" y1="238" x2="500" y2="238"/>
    <line x1="500" y1="238" x2="605" y2="238"/>
    <line x1="605" y1="238" x2="665" y2="238"/>
    <line x1="665" y1="238" x2="735" y2="238"/>
    <line x1="735" y1="238" x2="800" y2="238"/>
  </g>
  <g font-size="12" fill="#6a994e" text-anchor="middle">
    <text x="130"   y="253">gap</text>
    <text x="212.5" y="253">gap</text>
    <text x="320"   y="253">gap</text>
    <text x="440"   y="253">gap</text>
    <text x="552.5" y="253">gap</text>
    <text x="635"   y="253">gap</text>
    <text x="700"   y="253">gap</text>
    <text x="767.5" y="253">gap</text>
  </g>

  <text x="440" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#6a994e">How LONG until next event?  →  Exp(λ),  mean gap = 1/λ</text>

  <!-- bottom caption -->
  <line x1="90" y1="336" x2="790" y2="336" stroke="#c9d3dd" stroke-width="1"/>
  <text x="440" y="358" text-anchor="middle" font-size="12.5" fill="#6b7883">Which distribution you use is set by WHAT you measured (a count or a gap), not the biology.</text>
</svg>
