<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.3 30 813.1 350" font-family="Helvetica, Arial, sans-serif" width="813.1" height="350">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="300" x2="632" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="300" x2="70" y2="48" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- x ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="70" y1="300" x2="70" y2="306"/>
    <line x1="250" y1="300" x2="250" y2="306"/>
    <line x1="430" y1="300" x2="430" y2="306"/>
    <line x1="610" y1="300" x2="610" y2="306"/>
  </g>
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="70" y="322">0</text>
    <text x="250" y="322">50</text>
    <text x="430" y="322">100</text>
    <text x="610" y="322">150</text>
  </g>
  <text x="340" y="344" font-size="15" fill="#1b2a3a" text-anchor="middle">count</text>
  <text x="34" y="175" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 34 175)">probability</text>

  <!-- shared-mean dashed line at count = 50 -->
  <line x1="250" y1="60" x2="250" y2="300" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="250" y="52" font-size="13" fill="#1b2a3a" text-anchor="middle">shared mean = 50</text>

  <!-- false-positive tail shaded region under NB beyond threshold -->
  <path d="M322,276.8 L358,281.6 L394,285.6 L430,288.8 L466,291.2 L502,293.2 L538,294.8 L574,296 L610,297.2 L610,300 L322,300 Z"
        fill="#bc4749" fill-opacity="0.28" stroke="none"/>

  <!-- NB distribution (wide, right-skewed) -->
  <polyline fill="none" stroke="#6a994e" stroke-width="2.4"
    points="70,294 88,276 106,262 124,255 142,252 160,251 178,252.4 196,254.8 214,258 250,264.8 286,271.2 322,276.8 358,281.6 394,285.6 430,288.8 466,291.2 502,293.2 538,294.8 574,296 610,297.2"/>

  <!-- Poisson distribution (narrow tight peak) -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.4"
    points="70,300 178,296 200,268 214,217 224.8,162 235.6,108 242.8,83 250,74 257.2,83 264.4,108 275.2,162 286,217 300.4,268 322,296 340,300"/>

  <!-- significance threshold at count = 70 -->
  <line x1="322" y1="60" x2="322" y2="300" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="326" y="72" font-size="12.5" fill="#bc4749">significance</text>
  <text x="326" y="87" font-size="12.5" fill="#bc4749">threshold (70)</text>

  <!-- Poisson label -->
  <text x="205" y="115" font-size="13" fill="#2a6f97" text-anchor="end">Poisson: assumes</text>
  <text x="205" y="131" font-size="13" fill="#2a6f97" text-anchor="end">Var = 50 (σ ≈ 7.1)</text>
  <line x1="209" y1="118" x2="238" y2="98" stroke="#2a6f97" stroke-width="1.4"/>

  <!-- NB label -->
  <text x="76" y="170" font-size="13" fill="#6a994e">true counts (NB):</text>
  <text x="76" y="186" font-size="13" fill="#6a994e">Var ≈ 1300 (σ ≈ 36)</text>
  <line x1="150" y1="190" x2="160" y2="249" stroke="#6a994e" stroke-width="1.4"/>

  <!-- false-positive annotation -->
  <line x1="535" y1="247" x2="458" y2="291" stroke="#bc4749" stroke-width="1.4" marker-end="url(#arrowR)"/>
  <text x="470" y="205" font-size="12.5" fill="#bc4749">Just NOISE under NB —</text>
  <text x="470" y="221" font-size="12.5" fill="#bc4749">but Poisson flags them as</text>
  <text x="470" y="237" font-size="13" fill="#bc4749" font-weight="bold">SIGNIFICANT → false positives</text>

  <!-- legend -->
  <g font-size="13">
    <line x1="655" y1="60" x2="685" y2="60" stroke="#2a6f97" stroke-width="2.4"/>
    <text x="691" y="64" fill="#1b2a3a">Poisson (narrow)</text>
    <line x1="655" y1="82" x2="685" y2="82" stroke="#6a994e" stroke-width="2.4"/>
    <text x="691" y="86" fill="#1b2a3a">NB (wide, true)</text>
    <rect x="655" y="97" width="30" height="12" fill="#bc4749" fill-opacity="0.28"/>
    <text x="691" y="107" fill="#1b2a3a">false positives</text>
  </g>

  <!-- bottom take-home annotation -->
  <text x="340" y="368" font-size="14" fill="#bc4749" text-anchor="middle" font-weight="bold">too-small assumed variance → p-values too small → inflated false discovery rate</text>
</svg>
