<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- Title equation -->
  <text x="440" y="22" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">Binomial(n, p)  →  Poisson(λ)</text>
  <text x="440" y="40" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2a6f97">the law of rare events: keep n·p = λ = 3 fixed, let n grow</text>

  <!-- Baselines (muted) -->
  <line x1="30"  y1="190" x2="174" y2="190" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="200" y1="190" x2="344" y2="190" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="370" y1="190" x2="514" y2="190" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="660" y1="190" x2="804" y2="190" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- Chart 1: Binomial(10, 0.3) -->
  <g fill="#2a6f97" fill-opacity="0.85">
    <rect x="36"  y="179.5" width="8" height="10.5"/>
    <rect x="49"  y="145.2" width="8" height="44.8"/>
    <rect x="62"  y="103.6" width="8" height="86.4"/>
    <rect x="75"  y="91.3"  width="8" height="98.7"/>
    <rect x="88"  y="116.0" width="8" height="74.0"/>
    <rect x="101" y="151.9" width="8" height="38.1"/>
    <rect x="114" y="176.4" width="8" height="13.6"/>
    <rect x="127" y="186.7" width="8" height="3.3"/>
    <rect x="140" y="189.5" width="8" height="0.5"/>
  </g>

  <!-- Chart 2: Binomial(50, 0.06) -->
  <g fill="#2a6f97" fill-opacity="0.85">
    <rect x="206" y="173.2" width="8" height="16.8"/>
    <rect x="219" y="136.4" width="8" height="53.6"/>
    <rect x="232" y="106.2" width="8" height="83.8"/>
    <rect x="245" y="104.5" width="8" height="85.5"/>
    <rect x="258" y="125.8" width="8" height="64.2"/>
    <rect x="271" y="152.3" width="8" height="37.7"/>
    <rect x="284" y="172.0" width="8" height="18.0"/>
    <rect x="297" y="182.8" width="8" height="7.2"/>
    <rect x="310" y="187.5" width="8" height="2.5"/>
    <rect x="323" y="189.3" width="8" height="0.7"/>
  </g>

  <!-- Chart 3: Binomial(500, 0.006) -->
  <g fill="#2a6f97" fill-opacity="0.85">
    <rect x="376" y="171.8" width="8" height="18.2"/>
    <rect x="389" y="134.9" width="8" height="55.1"/>
    <rect x="402" y="107.1" width="8" height="82.9"/>
    <rect x="415" y="106.9" width="8" height="83.1"/>
    <rect x="428" y="127.7" width="8" height="62.3"/>
    <rect x="441" y="152.7" width="8" height="37.3"/>
    <rect x="454" y="171.4" width="8" height="18.6"/>
    <rect x="467" y="182.1" width="8" height="7.9"/>
    <rect x="480" y="187.1" width="8" height="2.9"/>
    <rect x="493" y="189.0" width="8" height="1.0"/>
    <rect x="506" y="189.7" width="8" height="0.3"/>
  </g>

  <!-- Chart 4: Poisson(3) accent red -->
  <g fill="#bc4749" fill-opacity="0.9">
    <rect x="666" y="171.6" width="8" height="18.4"/>
    <rect x="679" y="134.7" width="8" height="55.3"/>
    <rect x="692" y="107.1" width="8" height="82.9"/>
    <rect x="705" y="107.1" width="8" height="82.9"/>
    <rect x="718" y="127.8" width="8" height="62.2"/>
    <rect x="731" y="152.7" width="8" height="37.3"/>
    <rect x="744" y="171.3" width="8" height="18.7"/>
    <rect x="757" y="182.0" width="8" height="8.0"/>
    <rect x="770" y="187.0" width="8" height="3.0"/>
    <rect x="783" y="189.0" width="8" height="1.0"/>
    <rect x="796" y="189.7" width="8" height="0.3"/>
  </g>

  <!-- k-axis ticks (0,5,10) -->
  <g font-size="9" fill="#8a97a5" text-anchor="middle">
    <text x="40"  y="201">0</text><text x="105" y="201">5</text><text x="170" y="201">10</text>
    <text x="210" y="201">0</text><text x="275" y="201">5</text><text x="340" y="201">10</text>
    <text x="380" y="201">0</text><text x="445" y="201">5</text><text x="510" y="201">10</text>
    <text x="670" y="201">0</text><text x="735" y="201">5</text><text x="800" y="201">10</text>
  </g>

  <!-- Chart subtitles -->
  <g text-anchor="middle">
    <text x="106" y="215" font-size="12" font-weight="bold" fill="#1b2a3a">Binomial(10, 0.3)</text>
    <text x="106" y="230" font-size="10.5" fill="#6a994e">mean = 3</text>
    <text x="276" y="215" font-size="12" font-weight="bold" fill="#1b2a3a">Binomial(50, 0.06)</text>
    <text x="276" y="230" font-size="10.5" fill="#6a994e">mean = 3</text>
    <text x="446" y="215" font-size="12" font-weight="bold" fill="#1b2a3a">Binomial(500, 0.006)</text>
    <text x="446" y="230" font-size="10.5" fill="#6a994e">mean = 3</text>
    <text x="736" y="215" font-size="12" font-weight="bold" fill="#bc4749">Poisson(λ = 3)</text>
    <text x="736" y="230" font-size="10.5" fill="#bc4749">the limit</text>
  </g>
  <text x="12" y="140" font-size="10.5" fill="#8a97a5" transform="rotate(-90 12 140)" text-anchor="middle">P(k)</text>

  <!-- Convergence arrow to the Poisson limit -->
  <text x="587" y="98"  text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a6f97">n → ∞ ,  p → 0</text>
  <text x="587" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a6f97">n·p = λ = 3</text>
  <line x1="522" y1="130" x2="658" y2="130" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Divider -->
  <line x1="30" y1="252" x2="850" y2="252" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="40" y="272" font-size="14" font-weight="bold" fill="#1b2a3a">Sequencing analogy</text>

  <!-- Sliver callout -->
  <text x="272" y="292" font-size="11" fill="#bc4749">each read hits THIS gene with tiny probability p</text>
  <line x1="253" y1="299" x2="268" y2="290" stroke="#bc4749" stroke-width="1.2"/>

  <!-- Library bar (n large) -->
  <rect x="40" y="300" width="460" height="30" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="250" y="300" width="7" height="30" fill="#bc4749"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#1b2a3a">library of millions of reads (n large)</text>

  <!-- Arrow to result -->
  <line x1="506" y1="315" x2="586" y2="315" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result box -->
  <rect x="592" y="299" width="250" height="33" rx="5" fill="#fdeeee" stroke="#bc4749" stroke-width="1.5"/>
  <text x="717" y="313" text-anchor="middle" font-size="11.5" fill="#1b2a3a">on-gene count</text>
  <text x="717" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#bc4749">~ Poisson(λ = n·p = 3)</text>
</svg>
