<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL ===================== -->
  <rect x="18" y="52" width="292" height="316" rx="10" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="164" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">starting guess (uninformative)</text>

  <!-- Left: transition A -->
  <text x="95" y="98" font-size="14" font-weight="bold" fill="#1b2a3a">A (transition)</text>
  <!-- column labels -->
  <text x="113" y="114" text-anchor="middle" font-size="13" fill="#2a6f97">H</text>
  <text x="149" y="114" text-anchor="middle" font-size="13" fill="#2a6f97">L</text>
  <!-- row labels -->
  <text x="83" y="143" text-anchor="middle" font-size="13" fill="#2a6f97">H</text>
  <text x="83" y="179" text-anchor="middle" font-size="13" fill="#2a6f97">L</text>
  <!-- 2x2 cells all 0.5 -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="95" y="120" width="36" height="36" fill="#eef3f7"/>
    <rect x="131" y="120" width="36" height="36" fill="#eef3f7"/>
    <rect x="95" y="156" width="36" height="36" fill="#eef3f7"/>
    <rect x="131" y="156" width="36" height="36" fill="#eef3f7"/>
  </g>
  <g font-size="13" fill="#6b7885" text-anchor="middle">
    <text x="113" y="143">0.5</text><text x="149" y="143">0.5</text>
    <text x="113" y="179">0.5</text><text x="149" y="179">0.5</text>
  </g>

  <!-- Left: emission B -->
  <text x="95" y="228" font-size="14" font-weight="bold" fill="#1b2a3a">B (emission)</text>
  <g font-size="13" fill="#2a6f97" text-anchor="middle">
    <text x="113" y="244">A</text><text x="149" y="244">C</text><text x="185" y="244">G</text><text x="221" y="244">T</text>
  </g>
  <text x="83" y="273" text-anchor="middle" font-size="13" fill="#2a6f97">H</text>
  <text x="83" y="309" text-anchor="middle" font-size="13" fill="#2a6f97">L</text>
  <g stroke="#c9d3dd" stroke-width="1.5" fill="#eef3f7">
    <rect x="95" y="250" width="36" height="36"/><rect x="131" y="250" width="36" height="36"/>
    <rect x="167" y="250" width="36" height="36"/><rect x="203" y="250" width="36" height="36"/>
    <rect x="95" y="286" width="36" height="36"/><rect x="131" y="286" width="36" height="36"/>
    <rect x="167" y="286" width="36" height="36"/><rect x="203" y="286" width="36" height="36"/>
  </g>
  <g font-size="12" fill="#6b7885" text-anchor="middle">
    <text x="113" y="273">.25</text><text x="149" y="273">.25</text><text x="185" y="273">.25</text><text x="221" y="273">.25</text>
    <text x="113" y="309">.25</text><text x="149" y="309">.25</text><text x="185" y="309">.25</text><text x="221" y="309">.25</text>
  </g>
  <text x="164" y="352" text-anchor="middle" font-size="12" fill="#6b7885" font-style="italic">flat / uniform — knows nothing yet</text>

  <!-- ===================== MIDDLE: EM ARROW ===================== -->
  <path d="M 314 210 C 390 138 510 138 586 210" fill="none" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">baumWelch</text>
  <text x="450" y="176" text-anchor="middle" font-size="12.5" fill="#1b2a3a">EM iterates E-step / M-step</text>
  <text x="450" y="193" text-anchor="middle" font-size="12.5" fill="#1b2a3a">maxIterations = 100</text>
  <!-- looping icon -->
  <g>
    <path d="M 462 246 A 13 13 0 1 1 456 234" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrowSm)"/>
    <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#6b7885">repeat</text>
  </g>

  <!-- ===================== RIGHT PANEL ===================== -->
  <rect x="590" y="52" width="292" height="316" rx="10" fill="none" stroke="#6a994e" stroke-width="1.8"/>
  <text x="736" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">learned model</text>

  <!-- Right: transition A -->
  <text x="667" y="98" font-size="14" font-weight="bold" fill="#1b2a3a">A (transition)</text>
  <text x="685" y="114" text-anchor="middle" font-size="13" fill="#2a6f97">H</text>
  <text x="721" y="114" text-anchor="middle" font-size="13" fill="#2a6f97">L</text>
  <text x="655" y="143" text-anchor="middle" font-size="13" fill="#2a6f97">H</text>
  <text x="655" y="179" text-anchor="middle" font-size="13" fill="#2a6f97">L</text>
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="667" y="120" width="36" height="36" fill="#dce9f2"/>
    <rect x="703" y="120" width="36" height="36" fill="#f4f8fb"/>
    <rect x="667" y="156" width="36" height="36" fill="#f4f8fb"/>
    <rect x="703" y="156" width="36" height="36" fill="#dce9f2"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="685" y="143" fill="#2a6f97" font-weight="bold">0.8</text><text x="721" y="143" fill="#1b2a3a">0.2</text>
    <text x="685" y="179" fill="#1b2a3a">0.3</text><text x="721" y="179" fill="#2a6f97" font-weight="bold">0.7</text>
  </g>

  <!-- Right: emission B -->
  <text x="667" y="228" font-size="14" font-weight="bold" fill="#1b2a3a">B (emission)</text>
  <g font-size="13" fill="#2a6f97" text-anchor="middle">
    <text x="685" y="244">A</text><text x="721" y="244">C</text><text x="757" y="244">G</text><text x="793" y="244">T</text>
  </g>
  <text x="655" y="273" text-anchor="middle" font-size="13" fill="#2a6f97">H</text>
  <text x="655" y="309" text-anchor="middle" font-size="13" fill="#2a6f97">L</text>
  <!-- H row: GC-heavy, highlight C and G -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <rect x="667" y="250" width="36" height="36" fill="#f4f8fb"/>
    <rect x="703" y="250" width="36" height="36" fill="#dcead0" stroke="#6a994e" stroke-width="2"/>
    <rect x="739" y="250" width="36" height="36" fill="#dcead0" stroke="#6a994e" stroke-width="2"/>
    <rect x="775" y="250" width="36" height="36" fill="#f4f8fb"/>
  </g>
  <!-- L row: flatter -->
  <g stroke="#c9d3dd" stroke-width="1.5" fill="#f4f8fb">
    <rect x="667" y="286" width="36" height="36"/><rect x="703" y="286" width="36" height="36"/>
    <rect x="739" y="286" width="36" height="36"/><rect x="775" y="286" width="36" height="36"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="685" y="273" fill="#6b7885">0.1</text>
    <text x="721" y="273" fill="#6a994e" font-weight="bold">0.4</text>
    <text x="757" y="273" fill="#6a994e" font-weight="bold">0.4</text>
    <text x="793" y="273" fill="#6b7885">0.1</text>
    <text x="685" y="309" fill="#1b2a3a">0.3</text><text x="721" y="309" fill="#1b2a3a">0.2</text>
    <text x="757" y="309" fill="#1b2a3a">0.2</text><text x="793" y="309" fill="#1b2a3a">0.3</text>
  </g>
  <text x="736" y="352" text-anchor="middle" font-size="12" fill="#6a994e" font-style="italic">H is GC-rich · L stays flat</text>

  <!-- global caption -->
  <text x="450" y="388" text-anchor="middle" font-size="13" fill="#1b2a3a" font-style="italic">drifts toward the truth given enough data</text>
</svg>
