<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <g font-size="18" fill="#1b2a3a" text-anchor="middle">
    <rect x="10" y="40" width="190" height="90" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    <text x="105" y="78" font-weight="bold">in state i</text>
    <text x="105" y="104">at time t</text>

    <rect x="240" y="40" width="190" height="90" rx="10" fill="#f8eaea" stroke="#bc4749" stroke-width="2"/>
    <text x="335" y="72" font-weight="bold">how long?</text>
    <text x="335" y="98">τ ~ Exp(q<tspan baseline-shift="sub" font-size="70%">i</tspan>)</text>
    <text x="335" y="120" font-size="15">rexp(1, q[i])</text>

    <rect x="470" y="40" width="190" height="90" rx="10" fill="#eef4ea" stroke="#6a994e" stroke-width="2"/>
    <text x="565" y="72" font-weight="bold">where to?</text>
    <text x="565" y="98">j with prob q<tspan baseline-shift="sub" font-size="70%">ij</tspan> / q<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
    <text x="565" y="120" font-size="15">sample(…, prob = …)</text>

    <rect x="700" y="40" width="190" height="90" rx="10" fill="#f4f4f4" stroke="#1b2a3a" stroke-width="2"/>
    <text x="795" y="78" font-weight="bold">jump</text>
    <text x="795" y="104">t ← t + τ,  i ← j</text>
  </g>
  <line x1="200" y1="85" x2="236" y2="85" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="85" x2="466" y2="85" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="660" y1="85" x2="696" y2="85" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M 795 130 L 795 180 L 105 180 L 105 134" fill="none" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="450" y="208" text-anchor="middle" font-size="17" fill="#555">repeat until t passes the end time</text>
</svg>
