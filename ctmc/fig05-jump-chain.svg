<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- prog in the middle -->
  <circle cx="320" cy="170" r="55" fill="#f8eaea" stroke="#bc4749" stroke-width="2.5"/>
  <text x="320" y="178" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">prog</text>
  <!-- stem left -->
  <circle cx="90" cy="170" r="50" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="90" y="178" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">stem</text>
  <!-- diff right -->
  <circle cx="550" cy="170" r="50" fill="#eef4ea" stroke="#6a994e" stroke-width="2.5"/>
  <text x="550" y="178" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">diff</text>
  <!-- prog -> stem, rate 0.2 -->
  <line x1="264" y1="170" x2="144" y2="170" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="204" y="158" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">0.2 /day</text>
  <text x="204" y="200" text-anchor="middle" font-size="17" fill="#2a6f97">0.2 / 0.4 = 1/2</text>
  <!-- prog -> diff, rate 0.2 -->
  <line x1="376" y1="170" x2="496" y2="170" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="436" y="158" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">0.2 /day</text>
  <text x="436" y="200" text-anchor="middle" font-size="17" fill="#6a994e">0.2 / 0.4 = 1/2</text>
  <!-- annotations -->
  <text x="320" y="44" text-anchor="middle" font-size="18" fill="#1b2a3a">1. <tspan font-weight="bold">when</tspan>: leave prog at total rate q = 0.2 + 0.2 = 0.4 /day</text>
  <text x="320" y="72" text-anchor="middle" font-size="18" fill="#1b2a3a">→ waiting time ~ Exp(0.4), mean 1/0.4 = 2.5 days</text>
  <text x="320" y="270" text-anchor="middle" font-size="18" fill="#1b2a3a">2. <tspan font-weight="bold">where</tspan>: go to j with probability (rate to j) / q</text>
  <text x="320" y="298" text-anchor="middle" font-size="16" fill="#555">(only the arrows out of prog are drawn)</text>
</svg>
