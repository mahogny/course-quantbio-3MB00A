<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 20 560 300" width="560" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- ON -->
  <circle cx="190" cy="160" r="62" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="190" y="156" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">ON</text>
  <text x="190" y="182" text-anchor="middle" font-size="15" fill="#1b2a3a">promoter active</text>
  <!-- OFF -->
  <circle cx="530" cy="160" r="62" fill="#f8eaea" stroke="#bc4749" stroke-width="2.5"/>
  <text x="530" y="156" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">OFF</text>
  <text x="530" y="182" text-anchor="middle" font-size="15" fill="#1b2a3a">promoter silent</text>
  <!-- ON -> OFF, rate a -->
  <path d="M 242 128 C 320 85, 400 85, 478 128" fill="none" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="360" y="78" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">a = 0.5 /min</text>
  <!-- OFF -> ON, rate b -->
  <path d="M 478 192 C 400 235, 320 235, 242 192" fill="none" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="360" y="258" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">b = 0.25 /min</text>
  <!-- annotations -->
  <text x="190" y="290" text-anchor="middle" font-size="16" fill="#2a6f97">mean time ON = 1/a = 2 min</text>
  <text x="530" y="290" text-anchor="middle" font-size="16" fill="#bc4749">mean time OFF = 1/b = 4 min</text>
  <text x="360" y="312" text-anchor="middle" font-size="14" fill="#555">no self-loops: "staying" is just "not jumping yet"</text>
</svg>
