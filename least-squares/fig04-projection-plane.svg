<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 40 640 345" width="640" height="345" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6a994e"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Schematic, not to scale: y lives in 3-D (one axis per sample) -->

  <!-- the plane of all possible X beta -->
  <polygon points="50,340 430,340 590,230 210,230" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="70" y="370" font-size="14" fill="#1b2a3a">plane of all possible Xβ = a·1 + b·x   (the column space of X)</text>

  <!-- columns of X, in the plane -->
  <line x1="200" y1="310" x2="318" y2="318" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="250" y="334" font-size="14" fill="#2a6f97" font-weight="bold">1 = (1, 1, 1)</text>
  <line x1="200" y1="310" x2="268" y2="252" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="276" y="252" font-size="14" fill="#2a6f97" font-weight="bold">x = (0, 1, 2)</text>

  <!-- data vector y -->
  <line x1="200" y1="310" x2="403" y2="99" stroke="#1b2a3a" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="306" y="160" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="end">y = (1, 2, 6)</text>
  <text x="292" y="180" font-size="13" fill="#5a6b7a" text-anchor="end">data: not in the plane</text>

  <!-- fitted values: projection of y onto the plane -->
  <line x1="200" y1="310" x2="397" y2="281" stroke="#6a994e" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="300" y="282" font-size="15" fill="#6a994e" font-weight="bold" text-anchor="middle">ŷ = Xβ</text>

  <!-- residual: from y-hat up to y -->
  <line x1="405" y1="280" x2="405" y2="96" stroke="#bc4749" stroke-width="2.6" stroke-dasharray="0" />
  <text x="416" y="165" font-size="15" fill="#bc4749" font-weight="bold">r = y − ŷ</text>
  <text x="416" y="184" font-size="13" fill="#bc4749">orthogonal to the plane</text>
  <text x="416" y="200" font-size="13" fill="#bc4749">(to both columns)</text>

  <!-- right-angle mark at y-hat -->
  <path d="M405,264 L419,262 L419,276" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="405" cy="280" r="3.5" fill="#6a994e"/>
  <circle cx="405" cy="96" r="3.5" fill="#1b2a3a"/>

  <!-- another point in the plane: farther from y -->
  <circle cx="500" cy="300" r="4" fill="#5a6b7a"/>
  <line x1="408" y1="96" x2="498" y2="296" stroke="#5a6b7a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="508" y="304" font-size="13" fill="#5a6b7a">any other Xβ:</text>
  <text x="508" y="320" font-size="13" fill="#5a6b7a">farther from y</text>

  <!-- origin -->
  <circle cx="200" cy="310" r="3" fill="#1b2a3a"/>
  <text x="186" y="318" font-size="13" fill="#1b2a3a" text-anchor="end">0</text>
</svg>
