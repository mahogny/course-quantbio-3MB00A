<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">Three ways to handle grouped data</text>

  <!-- ================= PANEL 1 : Complete pooling ================= -->
  <g>
    <text x="150" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a6f97">Complete pooling</text>

    <!-- panel frame / plot region: x 55..270 , y 78..300 -->
    <rect x="55" y="78" width="215" height="222" fill="#eaf1f7"/>
    <!-- vertical biomarker axis -->
    <line x1="55" y1="78" x2="55" y2="300" stroke="#1b2a3a" stroke-width="1.4"/>
    <text x="30" y="192" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 30 192)">biomarker</text>

    <!-- grand mean dashed line (y=200 shared visually) -->
    <line x1="55" y1="200" x2="270" y2="200" stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="266" y="194" text-anchor="end" font-size="11" fill="#1b2a3a">grand mean</text>

    <!-- 5 groups, all estimates on the line -->
    <!-- faint dot columns (raw scatter) -->
    <g fill="#c9d3dd">
      <circle cx="88" cy="150" r="2.5"/><circle cx="88" cy="175" r="2.5"/><circle cx="88" cy="215" r="2.5"/><circle cx="88" cy="240" r="2.5"/>
      <circle cx="124" cy="120" r="2.5"/><circle cx="124" cy="160" r="2.5"/><circle cx="124" cy="205" r="2.5"/>
      <circle cx="160" cy="230" r="2.5"/><circle cx="160" cy="255" r="2.5"/><circle cx="160" cy="270" r="2.5"/><circle cx="160" cy="210" r="2.5"/>
      <circle cx="196" cy="140" r="2.5"/><circle cx="196" cy="185" r="2.5"/><circle cx="196" cy="225" r="2.5"/>
      <circle cx="232" cy="165" r="2.5"/><circle cx="232" cy="195" r="2.5"/><circle cx="232" cy="235" r="2.5"/><circle cx="232" cy="215" r="2.5"/>
    </g>
    <!-- estimates sitting exactly on the line -->
    <g fill="#2a6f97">
      <circle cx="88" cy="200" r="5"/>
      <circle cx="124" cy="200" r="5"/>
      <circle cx="160" cy="200" r="5"/>
      <circle cx="196" cy="200" r="5"/>
      <circle cx="232" cy="200" r="5"/>
    </g>

    <!-- group tick labels -->
    <g font-size="10" fill="#1b2a3a" text-anchor="middle">
      <text x="88" y="314">P1</text><text x="124" y="314">P2</text><text x="160" y="314">P3</text><text x="196" y="314">P4</text><text x="232" y="314">P5</text>
    </g>

    <text x="150" y="342" text-anchor="middle" font-size="11.5" fill="#1b2a3a">one mean for all</text>
    <text x="150" y="358" text-anchor="middle" font-size="11.5" fill="#bc4749">ignores between-patient variation</text>
  </g>

  <!-- ================= PANEL 2 : No pooling ================= -->
  <g>
    <text x="450" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#bc4749">No pooling</text>

    <rect x="345" y="78" width="215" height="222" fill="#eaf1f7"/>
    <line x1="345" y1="78" x2="345" y2="300" stroke="#1b2a3a" stroke-width="1.4"/>

    <!-- same dashed grand mean line for comparison -->
    <line x1="345" y1="200" x2="560" y2="200" stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="6 4"/>

    <!-- faint raw dots -->
    <g fill="#c9d3dd">
      <circle cx="378" cy="150" r="2.5"/><circle cx="378" cy="175" r="2.5"/><circle cx="378" cy="215" r="2.5"/><circle cx="378" cy="240" r="2.5"/>
      <circle cx="414" cy="120" r="2.5"/><circle cx="414" cy="160" r="2.5"/><circle cx="414" cy="205" r="2.5"/>
      <circle cx="450" cy="255" r="2.5"/>
      <circle cx="486" cy="140" r="2.5"/><circle cx="486" cy="185" r="2.5"/><circle cx="486" cy="225" r="2.5"/>
      <circle cx="522" cy="165" r="2.5"/><circle cx="522" cy="195" r="2.5"/><circle cx="522" cy="235" r="2.5"/><circle cx="522" cy="215" r="2.5"/>
    </g>

    <!-- independent means at raw group averages, with error bars; P3 small-n = wide bar, extreme -->
    <g stroke="#bc4749" stroke-width="1.6">
      <line x1="378" y1="172" x2="378" y2="218"/><line x1="373" y1="172" x2="383" y2="172"/><line x1="373" y1="218" x2="383" y2="218"/>
      <line x1="414" y1="140" x2="414" y2="190"/><line x1="409" y1="140" x2="419" y2="140"/><line x1="409" y1="190" x2="419" y2="190"/>
      <line x1="450" y1="112" x2="450" y2="238"/><line x1="445" y1="112" x2="455" y2="112"/><line x1="445" y1="238" x2="455" y2="238"/>
      <line x1="486" y1="160" x2="486" y2="206"/><line x1="481" y1="160" x2="491" y2="160"/><line x1="481" y1="206" x2="491" y2="206"/>
      <line x1="522" y1="180" x2="522" y2="228"/><line x1="517" y1="180" x2="527" y2="180"/><line x1="517" y1="228" x2="527" y2="228"/>
    </g>
    <g fill="#bc4749">
      <circle cx="378" cy="195" r="5"/>
      <circle cx="414" cy="165" r="5"/>
      <circle cx="450" cy="255" r="5"/>
      <circle cx="486" cy="183" r="5"/>
      <circle cx="522" cy="204" r="5"/>
    </g>
    <!-- small-n callout -->
    <text x="450" y="272" text-anchor="middle" font-size="9.5" fill="#bc4749">small n</text>

    <g font-size="10" fill="#1b2a3a" text-anchor="middle">
      <text x="378" y="314">P1</text><text x="414" y="314">P2</text><text x="450" y="314">P3</text><text x="486" y="314">P4</text><text x="522" y="314">P5</text>
    </g>

    <text x="450" y="342" text-anchor="middle" font-size="11.5" fill="#1b2a3a">separate per patient</text>
    <text x="450" y="358" text-anchor="middle" font-size="11.5" fill="#bc4749">noisy, no borrowing</text>
  </g>

  <!-- ================= PANEL 3 : Partial pooling ================= -->
  <g>
    <text x="750" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#6a994e">Partial pooling</text>

    <rect x="645" y="78" width="215" height="222" fill="#eaf1f7"/>
    <line x1="645" y1="78" x2="645" y2="300" stroke="#1b2a3a" stroke-width="1.4"/>

    <!-- same dashed grand mean line -->
    <line x1="645" y1="200" x2="860" y2="200" stroke="#1b2a3a" stroke-width="1.6" stroke-dasharray="6 4"/>

    <!-- faint raw mean markers -->
    <g fill="none" stroke="#c9d3dd" stroke-width="1.6">
      <circle cx="678" cy="195" r="4.5"/>
      <circle cx="714" cy="165" r="4.5"/>
      <circle cx="750" cy="255" r="4.5"/>
      <circle cx="786" cy="183" r="4.5"/>
      <circle cx="822" cy="204" r="4.5"/>
    </g>

    <!-- shrinkage arrows from raw mean partway toward grand mean (y=200) -->
    <g stroke="#1b2a3a" stroke-width="1.3" marker-end="url(#arr)">
      <line x1="678" y1="196.5" x2="678" y2="199"/>
      <line x1="714" y1="169" x2="714" y2="185"/>
      <line x1="750" y1="251" x2="750" y2="222"/>
      <line x1="786" y1="187" x2="786" y2="194"/>
      <line x1="822" y1="204" x2="822" y2="201"/>
    </g>

    <!-- partial-pooled estimates: between raw mean and the line -->
    <g fill="#6a994e">
      <circle cx="678" cy="199" r="5"/>
      <circle cx="714" cy="186" r="5"/>
      <circle cx="750" cy="224" r="5"/>
      <circle cx="786" cy="194" r="5"/>
      <circle cx="822" cy="201" r="5"/>
    </g>

    <g font-size="10" fill="#1b2a3a" text-anchor="middle">
      <text x="678" y="314">P1</text><text x="714" y="314">P2</text><text x="750" y="314">P3</text><text x="786" y="314">P4</text><text x="822" y="314">P5</text>
    </g>

    <text x="750" y="342" text-anchor="middle" font-size="11.5" fill="#1b2a3a">compromise</text>
    <text x="750" y="358" text-anchor="middle" font-size="11.5" fill="#6a994e">hierarchical model</text>
  </g>

  <!-- shared legend note -->
  <text x="450" y="374" text-anchor="middle" font-size="10.5" fill="#c9d3dd">dashed line = grand mean, shared across all three panels · faint dots = raw data</text>
</svg>
