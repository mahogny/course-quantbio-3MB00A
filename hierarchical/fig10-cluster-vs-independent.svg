<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <text x="320" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Why hierarchy gives correct uncertainty</text>

  <line x1="320" y1="34" x2="320" y2="300" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT panel -->
  <rect x="14" y="40" width="290" height="255" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="159" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">Flat model (assumes independence)</text>
  <text x="159" y="78" text-anchor="middle" font-size="12" fill="#1b2a3a">one patient, measured many times</text>

  <!-- single patient silhouette -->
  <g transform="translate(90,95)">
    <circle cx="0" cy="0" r="14" fill="#2a6f97"/>
    <path d="M-20,60 C-20,28 -12,18 0,18 C12,18 20,28 20,60 Z" fill="#2a6f97"/>
  </g>
  <!-- pile of ~1000 tiny dots on the single patient -->
  <g fill="#6a994e" opacity="0.7">
    <circle cx="66" cy="100" r="1.4"/><circle cx="74" cy="98" r="1.4"/><circle cx="82" cy="102" r="1.4"/><circle cx="90" cy="99" r="1.4"/><circle cx="98" cy="103" r="1.4"/><circle cx="106" cy="100" r="1.4"/><circle cx="114" cy="104" r="1.4"/>
    <circle cx="70" cy="110" r="1.4"/><circle cx="78" cy="112" r="1.4"/><circle cx="86" cy="108" r="1.4"/><circle cx="94" cy="113" r="1.4"/><circle cx="102" cy="109" r="1.4"/><circle cx="110" cy="112" r="1.4"/><circle cx="118" cy="108" r="1.4"/>
    <circle cx="66" cy="122" r="1.4"/><circle cx="74" cy="124" r="1.4"/><circle cx="82" cy="120" r="1.4"/><circle cx="90" cy="125" r="1.4"/><circle cx="98" cy="121" r="1.4"/><circle cx="106" cy="124" r="1.4"/><circle cx="114" cy="120" r="1.4"/>
    <circle cx="70" cy="134" r="1.4"/><circle cx="78" cy="132" r="1.4"/><circle cx="86" cy="136" r="1.4"/><circle cx="94" cy="133" r="1.4"/><circle cx="102" cy="137" r="1.4"/><circle cx="110" cy="134" r="1.4"/><circle cx="118" cy="132" r="1.4"/>
    <circle cx="66" cy="146" r="1.4"/><circle cx="74" cy="148" r="1.4"/><circle cx="82" cy="144" r="1.4"/><circle cx="90" cy="149" r="1.4"/><circle cx="98" cy="145" r="1.4"/><circle cx="106" cy="148" r="1.4"/><circle cx="114" cy="146" r="1.4"/>
    <circle cx="72" cy="156" r="1.4"/><circle cx="84" cy="158" r="1.4"/><circle cx="96" cy="155" r="1.4"/><circle cx="108" cy="157" r="1.4"/>
  </g>
  <text x="145" y="132" font-size="26" fill="#1b2a3a">×</text>
  <text x="200" y="128" font-size="15" font-weight="bold" fill="#1b2a3a">1000</text>
  <text x="200" y="145" font-size="12" fill="#1b2a3a">measurements</text>
  <text x="200" y="160" font-size="12" fill="#1b2a3a">of 1 patient</text>

  <!-- formula tag -->
  <rect x="26" y="195" width="266" height="42" rx="5" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/>
  <text x="159" y="212" text-anchor="middle" font-size="13" fill="#1b2a3a">uncertainty ~ 1/√N,  N = 1000</text>
  <text x="159" y="229" text-anchor="middle" font-size="13" fill="#1b2a3a">→ tiny error bar</text>

  <!-- red too-optimistic flag -->
  <g transform="translate(40,250)">
    <path d="M0,0 L0,32" stroke="#bc4749" stroke-width="2"/>
    <path d="M0,0 L44,0 L36,7 L44,14 L0,14 Z" fill="#bc4749"/>
    <text x="52" y="11" font-size="12" font-weight="bold" fill="#bc4749">too optimistic</text>
  </g>

  <!-- RIGHT panel -->
  <rect x="336" y="40" width="290" height="255" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="481" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">Hierarchical model</text>
  <text x="481" y="78" text-anchor="middle" font-size="12" fill="#1b2a3a">few distinct patients, a few points each</text>

  <!-- 4 distinct patient silhouettes each with a handful of dots -->
  <g>
    <g transform="translate(370,92)"><circle cx="0" cy="0" r="9" fill="#2a6f97"/><path d="M-13,40 C-13,20 -8,14 0,14 C8,14 13,20 13,40 Z" fill="#2a6f97"/></g>
    <g fill="#6a994e"><circle cx="358" cy="98" r="2"/><circle cx="366" cy="104" r="2"/><circle cx="374" cy="100" r="2"/><circle cx="382" cy="106" r="2"/></g>

    <g transform="translate(430,92)"><circle cx="0" cy="0" r="9" fill="#457b9d"/><path d="M-13,40 C-13,20 -8,14 0,14 C8,14 13,20 13,40 Z" fill="#457b9d"/></g>
    <g fill="#6a994e"><circle cx="418" cy="102" r="2"/><circle cx="426" cy="98" r="2"/><circle cx="434" cy="105" r="2"/></g>

    <g transform="translate(490,92)"><circle cx="0" cy="0" r="9" fill="#2a6f97"/><path d="M-13,40 C-13,20 -8,14 0,14 C8,14 13,20 13,40 Z" fill="#2a6f97"/></g>
    <g fill="#6a994e"><circle cx="478" cy="99" r="2"/><circle cx="486" cy="105" r="2"/><circle cx="494" cy="100" r="2"/><circle cx="502" cy="104" r="2"/></g>

    <g transform="translate(550,92)"><circle cx="0" cy="0" r="9" fill="#457b9d"/><path d="M-13,40 C-13,20 -8,14 0,14 C8,14 13,20 13,40 Z" fill="#457b9d"/></g>
    <g fill="#6a994e"><circle cx="538" cy="103" r="2"/><circle cx="546" cy="99" r="2"/><circle cx="554" cy="105" r="2"/></g>
  </g>

  <!-- two nested variance sources -->
  <rect x="352" y="158" width="112" height="30" rx="5" fill="#ffffff" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="408" y="178" text-anchor="middle" font-size="13" fill="#1b2a3a">σ (within)</text>
  <rect x="498" y="158" width="116" height="30" rx="5" fill="#ffffff" stroke="#2a6f97" stroke-width="1.2"/>
  <text x="556" y="178" text-anchor="middle" font-size="13" fill="#1b2a3a">τ (between)</text>

  <!-- arrows feeding into treatment effect -->
  <path d="M408,188 L474,220" stroke="#2a6f97" stroke-width="1.5" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M556,188 L490,220" stroke="#2a6f97" stroke-width="1.5" fill="none" marker-end="url(#arrowblue)"/>
  <rect x="404" y="220" width="156" height="30" rx="5" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/>
  <text x="482" y="240" text-anchor="middle" font-size="12" fill="#1b2a3a">treatment-effect error bar</text>

  <!-- honest flag -->
  <g transform="translate(360,258)">
    <path d="M0,0 L0,30" stroke="#6a994e" stroke-width="2"/>
    <path d="M0,0 L42,0 L34,7 L42,14 L0,14 Z" fill="#6a994e"/>
    <text x="50" y="11" font-size="12" font-weight="bold" fill="#6a994e">honest (wider)</text>
  </g>
  <text x="481" y="288" text-anchor="middle" font-size="11" fill="#1b2a3a">reflects number of patients</text>

  <!-- Bottom: two effect error bars -->
  <text x="159" y="316" text-anchor="middle" font-size="11" fill="#1b2a3a">flat: narrow</text>
  <circle cx="159" cy="337" r="4" fill="#bc4749"/>
  <line x1="145" y1="337" x2="173" y2="337" stroke="#bc4749" stroke-width="2.5"/>
  <line x1="145" y1="332" x2="145" y2="342" stroke="#bc4749" stroke-width="2.5"/>
  <line x1="173" y1="332" x2="173" y2="342" stroke="#bc4749" stroke-width="2.5"/>

  <text x="481" y="316" text-anchor="middle" font-size="11" fill="#1b2a3a">hierarchical: wider</text>
  <circle cx="481" cy="337" r="4" fill="#6a994e"/>
  <line x1="421" y1="337" x2="541" y2="337" stroke="#6a994e" stroke-width="2.5"/>
  <line x1="421" y1="330" x2="421" y2="344" stroke="#6a994e" stroke-width="2.5"/>
  <line x1="541" y1="330" x2="541" y2="344" stroke="#6a994e" stroke-width="2.5"/>

  <text x="320" y="372" text-anchor="middle" font-size="12" font-style="italic" fill="#1b2a3a">Measuring one patient a thousand times does not give you a thousand patients — same data, honest error bars.</text>
</svg>
