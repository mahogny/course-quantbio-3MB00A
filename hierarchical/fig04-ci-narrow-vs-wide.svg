<svg xmlns="http://www.w3.org/2000/svg" width="567.6" height="382.0" viewBox="77.8 -0.6 567.6 382.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Pseudoreplication</text>

  <!-- Axis geometry: x=0 (null) at pixel 300, effect axis y at 300 -->
  <!-- Null dashed vertical line -->
  <line x1="300" y1="70" x2="300" y2="305" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#1b2a3a">null (x = 0)</text>

  <!-- Effect-size axis -->
  <line x1="120" y1="305" x2="600" y2="305" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="120" y1="305" x2="608" y2="305" stroke="#1b2a3a" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="600" y="325" text-anchor="middle" font-size="13" fill="#1b2a3a">effect size</text>

  <!-- Shared point estimate at pixel x=380 -->
  <!-- ================= TOP: pseudoreplicated (narrow) ================= -->
  <text x="120" y="105" font-size="15" font-weight="bold" fill="#bc4749">Pseudoreplicated (n = 240 cells treated as independent)</text>
  <!-- narrow error bar around x=380, y=140 -->
  <line x1="356" y1="140" x2="404" y2="140" stroke="#bc4749" stroke-width="3"/>
  <line x1="356" y1="130" x2="356" y2="150" stroke="#bc4749" stroke-width="3"/>
  <line x1="404" y1="130" x2="404" y2="150" stroke="#bc4749" stroke-width="3"/>
  <circle cx="380" cy="140" r="6" fill="#1b2a3a"/>
  <text x="420" y="145" font-size="13" fill="#bc4749">SE too small → p too optimistic</text>

  <!-- ================= BOTTOM: correct (wide) ================= -->
  <text x="120" y="205" font-size="15" font-weight="bold" fill="#6a994e">Correct (hierarchical, n = 3 animals)</text>
  <!-- wide error bar around x=380, y=240 -->
  <line x1="270" y1="240" x2="490" y2="240" stroke="#6a994e" stroke-width="3"/>
  <line x1="270" y1="228" x2="270" y2="252" stroke="#6a994e" stroke-width="3"/>
  <line x1="490" y1="228" x2="490" y2="252" stroke="#6a994e" stroke-width="3"/>
  <circle cx="380" cy="240" r="6" fill="#1b2a3a"/>
  <text x="500" y="245" font-size="13" fill="#6a994e">honest width</text>

  <!-- Shared estimate guide -->
  <line x1="380" y1="150" x2="380" y2="230" stroke="#2a6f97" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="386" y="188" font-size="12" fill="#2a6f97">same estimate</text>

  <!-- Caption -->
  <text x="320" y="362" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">Same data, same estimate — the wrong model just shrinks the error bar.</text>
</svg>
