<svg xmlns="http://www.w3.org/2000/svg" viewBox="17.0 -3.0 768.2 411.9" font-family="Helvetica, Arial, sans-serif" width="768.2" height="411.9">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Fourier fixed basis -->
  <text x="180" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Fourier basis: <tspan fill="#2a6f97">FIXED</tspan></text>

  <!-- boxed library frame -->
  <rect x="40" y="48" width="280" height="230" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="180" y="70" text-anchor="middle" font-size="13" font-style="italic" fill="#2a6f97">always the same set</text>

  <!-- sinusoid icons, increasing frequency: 1,2,3,4 cycles -->
  <!-- row baselines at y = 100, 145, 190, 235; each cell width 200 from x=70 to x=270 -->
  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <path d="M70,100 C95,72 120,128 145,100 C170,72 195,128 220,100 C233,86 240,86 270,100"/>
  </g>
  <text x="285" y="105" font-size="13" fill="#1b2a3a">1</text>

  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <path d="M70,145 C82,124 95,166 107,145 C120,124 132,166 145,145 C157,124 170,166 182,145 C195,124 207,166 220,145 C233,131 245,159 270,145"/>
  </g>
  <text x="285" y="150" font-size="13" fill="#1b2a3a">2</text>

  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <path d="M70,190 C78,174 87,206 95,190 C103,174 112,206 120,190 C128,174 137,206 145,190 C153,174 162,206 170,190 C178,174 187,206 195,190 C203,174 212,206 220,190 C228,180 250,200 270,190"/>
  </g>
  <text x="285" y="195" font-size="13" fill="#1b2a3a">3</text>

  <g stroke="#2a6f97" stroke-width="2" fill="none">
    <path d="M70,235 C76,222 82,248 88,235 C94,222 101,248 107,235 C113,222 120,248 126,235 C132,222 139,248 145,235 C151,222 158,248 164,235 C170,222 177,248 183,235 C189,222 196,248 202,235 C208,222 215,248 220,235 C230,226 255,244 270,235"/>
  </g>
  <text x="285" y="240" font-size="13" fill="#1b2a3a">4</text>

  <text x="180" y="266" text-anchor="middle" font-size="12" fill="#1b2a3a">same sinusoid axes for every dataset — no fitting</text>

  <!-- use when (left) -->
  <text x="180" y="312" text-anchor="middle" font-size="12.5" fill="#2a6f97" font-weight="bold">use when structure is periodic</text>
  <text x="180" y="330" text-anchor="middle" font-size="12.5" fill="#2a6f97">(rhythms, textures)</text>

  <!-- DIVIDER -->
  <line x1="400" y1="52" x2="400" y2="335" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT PANEL: PCA learned basis -->
  <text x="620" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">PCA basis: <tspan fill="#6a994e">LEARNED</tspan></text>

  <!-- scatter cloud: tilted elongated ellipse, centroid ~ (620,165), tilt ~ -30deg -->
  <ellipse cx="620" cy="165" rx="115" ry="42" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2" transform="rotate(-28 620 165)"/>
  <g fill="#6a994e">
    <circle cx="536" cy="212" r="3"/>
    <circle cx="556" cy="200" r="3"/>
    <circle cx="560" cy="188" r="3"/>
    <circle cx="578" cy="196" r="3"/>
    <circle cx="580" cy="180" r="3"/>
    <circle cx="595" cy="188" r="3"/>
    <circle cx="600" cy="172" r="3"/>
    <circle cx="605" cy="185" r="3"/>
    <circle cx="618" cy="168" r="3"/>
    <circle cx="622" cy="178" r="3"/>
    <circle cx="628" cy="158" r="3"/>
    <circle cx="640" cy="163" r="3"/>
    <circle cx="644" cy="150" r="3"/>
    <circle cx="655" cy="156" r="3"/>
    <circle cx="662" cy="144" r="3"/>
    <circle cx="670" cy="150" r="3"/>
    <circle cx="682" cy="138" r="3"/>
    <circle cx="688" cy="128" r="3"/>
    <circle cx="700" cy="132" r="3"/>
    <circle cx="704" cy="120" r="3"/>
    <circle cx="612" cy="158" r="3"/>
    <circle cx="590" cy="176" r="3"/>
    <circle cx="636" cy="148" r="3"/>
    <circle cx="566" cy="192" r="3"/>
  </g>

  <!-- centroid -->
  <circle cx="620" cy="165" r="3.5" fill="#bc4749"/>

  <!-- PC1 long arrow along main spread (tilt -28deg) -->
  <line x1="620" y1="165" x2="713" y2="115" stroke="#bc4749" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="720" y="108" font-size="14" font-weight="bold" fill="#bc4749">PC1</text>

  <!-- PC2 short arrow perpendicular -->
  <line x1="620" y1="165" x2="586" y2="140" stroke="#6a994e" stroke-width="2.2" marker-end="url(#arrowP)"/>
  <text x="560" y="132" font-size="14" font-weight="bold" fill="#6a994e">PC2</text>

  <text x="620" y="250" text-anchor="middle" font-size="12" fill="#1b2a3a">axes point along the data's variation</text>
  <text x="620" y="266" text-anchor="middle" font-size="12" fill="#1b2a3a">— estimated from a covariance</text>

  <!-- use when (right) -->
  <text x="620" y="312" text-anchor="middle" font-size="12.5" fill="#6a994e" font-weight="bold">use when you want axes</text>
  <text x="620" y="330" text-anchor="middle" font-size="12.5" fill="#6a994e">adapted to your dataset</text>

  <!-- TAKE-HOME BANNER -->
  <rect x="60" y="352" width="680" height="34" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="400" y="374" text-anchor="middle" font-size="13.5" fill="#1b2a3a">Both give orthogonal coordinates via projection.  Difference = fixed vs learned.</text>
</svg>
