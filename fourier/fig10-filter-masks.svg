<svg xmlns="http://www.w3.org/2000/svg" width="880" height="415" viewBox="0 0 880 415" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ============ PANEL 1: Low-pass ============ -->
  <g transform="translate(30,42)">
    <text x="112" y="-16" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Low-pass</text>
    <!-- pass-band mask: LOW frequencies only (left) -->
    <rect x="0" y="12" width="64" height="148" fill="#2a6f97" fill-opacity="0.20"/>
    <line x1="64" y1="12" x2="64" y2="160" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="5,3"/>
    <!-- axes -->
    <line x1="0" y1="12" x2="0" y2="160" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="228" y2="160" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="226" y="178" font-size="12" fill="#1b2a3a">freq</text>
    <text x="6" y="24" font-size="12" fill="#1b2a3a">|amp|</text>
    <!-- noise floor (high freq) -->
    <path d="M100,151 L108,147 L116,152 L124,148 L132,151 L140,147 L148,152 L156,148 L164,151 L172,148 L180,152 L188,148 L196,151 L204,148 L212,151" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- schematic magnitude spectrum -->
    <path d="M0,28 C30,28 50,60 82,102 C110,138 150,150 218,150" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="112" y="200" text-anchor="middle" font-size="13" fill="#1b2a3a">keep low → smooths / denoises</text>
  </g>

  <!-- ============ PANEL 2: High-pass ============ -->
  <g transform="translate(316,42)">
    <text x="112" y="-16" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">High-pass</text>
    <!-- pass-band mask: HIGH frequencies only (right) -->
    <rect x="132" y="12" width="86" height="148" fill="#bc4749" fill-opacity="0.20"/>
    <line x1="132" y1="12" x2="132" y2="160" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5,3"/>
    <!-- axes -->
    <line x1="0" y1="12" x2="0" y2="160" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="228" y2="160" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="226" y="178" font-size="12" fill="#1b2a3a">freq</text>
    <text x="6" y="24" font-size="12" fill="#1b2a3a">|amp|</text>
    <!-- noise floor (high freq) -->
    <path d="M100,151 L108,147 L116,152 L124,148 L132,151 L140,147 L148,152 L156,148 L164,151 L172,148 L180,152 L188,148 L196,151 L204,148 L212,151" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- schematic magnitude spectrum -->
    <path d="M0,28 C30,28 50,60 82,102 C110,138 150,150 218,150" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="112" y="200" text-anchor="middle" font-size="13" fill="#1b2a3a">keep high → sharpens / edges</text>
  </g>

  <!-- ============ PANEL 3: Notch / band ============ -->
  <g transform="translate(602,42)">
    <text x="112" y="-16" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Notch / band</text>
    <!-- pass-band mask: keep MOST, thin slot deleted -->
    <rect x="0" y="12" width="104" height="148" fill="#6a994e" fill-opacity="0.20"/>
    <rect x="120" y="12" width="98" height="148" fill="#6a994e" fill-opacity="0.20"/>
    <!-- the removed slot -->
    <rect x="104" y="12" width="16" height="148" fill="#ffffff" fill-opacity="0.85"/>
    <line x1="104" y1="12" x2="104" y2="160" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4,3"/>
    <line x1="120" y1="12" x2="120" y2="160" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="4,3"/>
    <path d="M112,-6 L112,10" fill="none" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arrowred)"/>
    <text x="112" y="-30" text-anchor="middle" font-size="11" fill="#bc4749" font-weight="bold">deleted</text>
    <!-- axes -->
    <line x1="0" y1="12" x2="0" y2="160" stroke="#1b2a3a" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="228" y2="160" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="226" y="178" font-size="12" fill="#1b2a3a">freq</text>
    <text x="6" y="24" font-size="12" fill="#1b2a3a">|amp|</text>
    <!-- noise floor (high freq) -->
    <path d="M100,151 L108,147 L116,152 L124,148 L132,151 L140,147 L148,152 L156,148 L164,151 L172,148 L180,152 L188,148 L196,151 L204,148 L212,151" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- schematic magnitude spectrum -->
    <path d="M0,28 C30,28 50,60 82,102 C110,138 150,150 218,150" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
    <text x="112" y="200" text-anchor="middle" font-size="12.5" fill="#1b2a3a">delete one artefact freq (mains hum)</text>
  </g>

  <!-- ============ convolution-theorem banner ============ -->
  <g transform="translate(40,296)">
    <rect x="0" y="0" width="800" height="42" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="400" y="20" text-anchor="middle" font-size="14.5" fill="#1b2a3a">convolution in space/time  &lt;=&gt;  multiplication in frequency</text>
    <text x="400" y="36" text-anchor="middle" font-size="12.5" fill="#2a6f97">filter = multiply spectrum by mask, then inverse transform</text>
  </g>

  <!-- ============ honesty caveat box ============ -->
  <g transform="translate(40,350)">
    <rect x="0" y="0" width="800" height="40" rx="8" fill="#fdf3f3" stroke="#bc4749" stroke-width="1.5"/>
    <text x="14" y="18" font-size="12.5" fill="#bc4749" font-weight="bold">caveat:</text>
    <text x="70" y="18" font-size="12.5" fill="#1b2a3a">sharp real edges are ALSO high-frequency</text>
    <text x="14" y="33" font-size="12.5" fill="#1b2a3a">→ aggressive low-pass blurs true detail, not only noise.</text>
  </g>
</svg>
