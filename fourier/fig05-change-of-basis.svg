<svg xmlns="http://www.w3.org/2000/svg" width="714.9" height="365.1" viewBox="2.6 30.2 714.9 365.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT BOX: standard/time basis -->
  <rect x="24" y="52" width="270" height="210" rx="14" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="159" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Standard basis (time)</text>

  <!-- baseline axis -->
  <line x1="52" y1="222" x2="266" y2="222" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- 8 stems of varying heights -->
  <g stroke="#2a6f97" stroke-width="4" stroke-linecap="round">
    <line x1="62"  y1="222" x2="62"  y2="150"/>
    <line x1="88"  y1="222" x2="88"  y2="110"/>
    <line x1="114" y1="222" x2="114" y2="170"/>
    <line x1="140" y1="222" x2="140" y2="128"/>
    <line x1="166" y1="222" x2="166" y2="188"/>
    <line x1="192" y1="222" x2="192" y2="142"/>
    <line x1="218" y1="222" x2="218" y2="164"/>
    <line x1="244" y1="222" x2="244" y2="118"/>
  </g>
  <g fill="#2a6f97">
    <circle cx="62"  cy="150" r="4"/>
    <circle cx="88"  cy="110" r="4"/>
    <circle cx="114" cy="170" r="4"/>
    <circle cx="140" cy="128" r="4"/>
    <circle cx="166" cy="188" r="4"/>
    <circle cx="192" cy="142" r="4"/>
    <circle cx="218" cy="164" r="4"/>
    <circle cx="244" cy="118" r="4"/>
  </g>
  <text x="159" y="242" text-anchor="middle" font-size="12" fill="#5a6b7a">value at each time point</text>
  <text x="159" y="286" text-anchor="middle" font-size="13" fill="#1b2a3a">N numbers: one axis per time point</text>

  <!-- RIGHT BOX: fourier/frequency basis -->
  <rect x="426" y="52" width="270" height="210" rx="14" fill="#f7eeea" stroke="#bc4749" stroke-width="2"/>
  <text x="561" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">Fourier basis (frequency)</text>

  <line x1="454" y1="222" x2="668" y2="222" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- 8 stems: only a few tall -->
  <g stroke="#bc4749" stroke-width="4" stroke-linecap="round">
    <line x1="464" y1="222" x2="464" y2="216"/>
    <line x1="490" y1="222" x2="490" y2="102"/>
    <line x1="516" y1="222" x2="516" y2="214"/>
    <line x1="542" y1="222" x2="542" y2="130"/>
    <line x1="568" y1="222" x2="568" y2="218"/>
    <line x1="594" y1="222" x2="594" y2="215"/>
    <line x1="620" y1="222" x2="620" y2="160"/>
    <line x1="646" y1="222" x2="646" y2="217"/>
  </g>
  <g fill="#bc4749">
    <circle cx="464" cy="216" r="4"/>
    <circle cx="490" cy="102" r="4"/>
    <circle cx="516" cy="214" r="4"/>
    <circle cx="542" cy="130" r="4"/>
    <circle cx="568" cy="218" r="4"/>
    <circle cx="594" cy="215" r="4"/>
    <circle cx="620" cy="160" r="4"/>
    <circle cx="646" cy="217" r="4"/>
  </g>
  <text x="561" y="242" text-anchor="middle" font-size="12" fill="#5a6b7a">amount of each frequency</text>
  <text x="561" y="286" text-anchor="middle" font-size="13" fill="#1b2a3a">N numbers: one axis per frequency</text>

  <!-- CONNECTING ARROWS -->
  <path d="M300,128 C345,108 375,108 420,128" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">Fourier transform</text>

  <path d="M420,182 C375,202 345,202 300,182" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="222" text-anchor="middle" font-size="13" fill="#5a6b7a">inverse transform</text>

  <!-- rotation inset between arrows -->
  <g transform="translate(360,155)">
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="0" y2="-16" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="17" y2="-9" stroke="#2a6f97" stroke-width="2"/>
    <line x1="0" y1="0" x2="9" y2="17" stroke="#bc4749" stroke-width="2"/>
    <path d="M14,0 A14,14 0 0,0 12.1,-7" fill="none" stroke="#6a994e" stroke-width="1.5"/>
    <text x="20" y="-4" font-size="11" fill="#6a994e">θ</text>
  </g>

  <!-- BANNER -->
  <rect x="24" y="316" width="672" height="58" rx="10" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="360" y="341" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">Same object, new coordinates — a rotation of the axes.</text>
  <text x="360" y="362" text-anchor="middle" font-size="14" fill="#6a994e">Reversible, lossless.</text>
</svg>
