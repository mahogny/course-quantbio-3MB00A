<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Fourier global -->
  <rect x="20" y="30" width="410" height="150" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5" rx="6"/>
  <text x="34" y="52" font-size="17" font-weight="bold" fill="#2a6f97">Fourier basis: GLOBAL</text>

  <!-- baseline -->
  <line x1="34" y1="110" x2="416" y2="110" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- single sinusoid edge to edge -->
  <path d="M34,110
           Q47.75,68 61.5,110 T89,110 T116.5,110 T144,110 T171.5,110 T199,110
           T226.5,110 T254,110 T281.5,110 T309,110 T336.5,110 T364,110 T391.5,110 T416,110"
        fill="none" stroke="#2a6f97" stroke-width="2.2"/>
  <text x="225" y="164" font-size="13.5" fill="#1b2a3a" text-anchor="middle">one frequency, everywhere</text>
  <text x="225" y="180" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">tells WHICH frequency, not WHERE</text>

  <!-- RIGHT PANEL: Wavelets local -->
  <rect x="470" y="30" width="410" height="150" fill="#f6f0f0" stroke="#c9d3dd" stroke-width="1.5" rx="6"/>
  <text x="484" y="52" font-size="17" font-weight="bold" fill="#bc4749">Wavelets: LOCAL</text>
  <line x1="484" y1="110" x2="866" y2="110" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- wide low-frequency packet (left) -->
  <path d="M500,110
           Q515,78 530,110 T560,110 T590,110"
        fill="none" stroke="#bc4749" stroke-width="2.2"/>
  <path d="M500,110 Q545,55 590,110" fill="none" stroke="#bc4749" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- medium packet (middle) -->
  <path d="M645,110
           Q652,92 659,110 T673,110 T687,110 T701,110"
        fill="none" stroke="#bc4749" stroke-width="2.2"/>
  <path d="M645,110 Q673,80 701,110" fill="none" stroke="#bc4749" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- narrow high-frequency packet 1 (right) -->
  <path d="M760,110
           Q763.5,98 767,110 T774,110 T781,110"
        fill="none" stroke="#bc4749" stroke-width="2.2"/>
  <path d="M760,110 Q770.5,92 781,110" fill="none" stroke="#bc4749" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- narrow high-frequency packet 2 (right) -->
  <path d="M812,110
           Q815.5,98 819,110 T826,110 T833,110"
        fill="none" stroke="#bc4749" stroke-width="2.2"/>
  <path d="M812,110 Q822.5,92 833,110" fill="none" stroke="#bc4749" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <text x="675" y="164" font-size="13.5" fill="#1b2a3a" text-anchor="middle">little wave-packets, localized</text>
  <text x="675" y="180" font-size="12.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">in BOTH position and frequency</text>

  <!-- arrow between panels -->
  <line x1="435" y1="105" x2="465" y2="105" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- TIME-FREQUENCY TILING INSET -->
  <text x="200" y="222" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">time-frequency tiling</text>
  <g stroke="#1b2a3a" stroke-width="1.3">
    <!-- bounding box x=60..340 (width 280), y=232..344 (height 112) -->
    <!-- low freq bottom: wide/short rows -->
    <rect x="60"  y="326" width="140" height="18" fill="#eaf1f7"/>
    <rect x="200" y="326" width="140" height="18" fill="#eaf1f7"/>
    <!-- mid rows -->
    <rect x="60"  y="308" width="70" height="18" fill="#dbe7f2"/>
    <rect x="130" y="308" width="70" height="18" fill="#dbe7f2"/>
    <rect x="200" y="308" width="70" height="18" fill="#dbe7f2"/>
    <rect x="270" y="308" width="70" height="18" fill="#dbe7f2"/>
    <!-- higher freq: narrow/tall columns -->
    <rect x="60"  y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="95"  y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="130" y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="165" y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="200" y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="235" y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="270" y="272" width="35" height="36" fill="#f3d7d8"/>
    <rect x="305" y="272" width="35" height="36" fill="#f3d7d8"/>
    <!-- highest freq: very narrow/tall -->
    <rect x="60"  y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="77.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="95"  y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="112.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="130" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="147.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="165" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="182.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="200" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="217.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="235" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="252.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="270" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="287.5" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="305" y="232" width="17.5" height="40" fill="#eccccd"/>
    <rect x="322.5" y="232" width="17.5" height="40" fill="#eccccd"/>
  </g>
  <!-- axis labels -->
  <line x1="52" y1="344" x2="52" y2="232" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="46" y="288" font-size="12" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 46 288)">frequency</text>
  <line x1="60" y1="356" x2="340" y2="356" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="371" font-size="12" fill="#1b2a3a" text-anchor="middle">position (time)</text>

  <!-- tiling caption on the right -->
  <text x="380" y="270" font-size="13.5" font-weight="bold" fill="#1b2a3a">multi-scale:</text>
  <text x="380" y="290" font-size="13" fill="#1b2a3a">coarse shape (wide, low-freq rows)</text>
  <text x="380" y="308" font-size="13" fill="#1b2a3a">AND location of fine features</text>
  <text x="380" y="326" font-size="13" fill="#1b2a3a">(narrow, high-freq tiles).</text>

  <!-- BOTTOM BANNER -->
  <rect x="20" y="384" width="860" height="30" fill="#1b2a3a" rx="5"/>
  <text x="450" y="404" font-size="13.5" fill="#ffffff" text-anchor="middle">Same big idea: choose the basis functions to match the structure you expect.  (JPEG 2000, edge-preserving denoising.)</text>
</svg>
