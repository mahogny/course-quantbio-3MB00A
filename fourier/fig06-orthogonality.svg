  <!-- ================= RIGHT: vector-space cartoon ================= -->
  <text x="560" y="66" font-size="15" font-weight="bold" fill="#1b2a3a">Each wave = an axis. Amplitude = projection.</text>

  <!-- origin -->
  <circle cx="560" cy="300" r="3" fill="#1b2a3a"/>
  <!-- axis wave f=2 (horizontal, blue) -->
  <line x1="560" y1="300" x2="828" y2="300" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#arrowB)"/>
  <text x="742" y="322" font-size="14" font-weight="bold" fill="#2a6f97">wave f = 2</text>
  <!-- axis wave f=3 (vertical, orange) -->
  <line x1="560" y1="300" x2="560" y2="96" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowO)"/>
  <text x="551" y="150" font-size="14" font-weight="bold" fill="#d97706" text-anchor="end">wave f = 3</text>
  <!-- right-angle mark -->
  <path d="M560,278 L582,278 L582,300" fill="none" stroke="#1b2a3a" stroke-width="1.4"/>

  <!-- signal vector -->
  <line x1="560" y1="300" x2="770" y2="168" stroke="#1b2a3a" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="700" y="150" font-size="14.5" font-weight="bold" fill="#1b2a3a">signal</text>

  <!-- dashed drop line (projection onto f=2 axis) -->
  <line x1="770" y1="168" x2="770" y2="300" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="770" cy="300" r="3.5" fill="#2a6f97"/>
  <!-- projection amplitude bracket on horizontal axis -->
  <line x1="560" y1="312" x2="770" y2="312" stroke="#2a6f97" stroke-width="1.3"/>
  <line x1="560" y1="308" x2="560" y2="316" stroke="#2a6f97" stroke-width="1.3"/>
  <line x1="770" y1="308" x2="770" y2="316" stroke="#2a6f97" stroke-width="1.3"/>
  <text x="612" y="336" font-size="12.5" fill="#2a6f97" font-weight="bold">amplitude of f = 2</text>

  <!-- caption -->
  <text x="560" y="360" font-size="12.5" fill="#1b2a3a">each amplitude = projection onto one wave (a dot product),</text>
  <text x="560" y="378" font-size="12.5" fill="#1b2a3a">read off independently &#8212; just like a PCA score.</text>
</svg>
