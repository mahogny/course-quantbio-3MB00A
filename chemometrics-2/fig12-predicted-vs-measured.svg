<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.9 15.6 708.0 391.4" font-family="Helvetica, Arial, sans-serif" width="708.0" height="391.4">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8fa3"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="340" stroke="#1b2a3a" stroke-width="1.6"/>
  <line x1="80" y1="340" x2="386" y2="340" stroke="#1b2a3a" stroke-width="1.6"/>

  <!-- x ticks -->
  <g stroke="#1b2a3a" stroke-width="1.2">
    <line x1="80" y1="340" x2="80" y2="345"/>
    <line x1="155" y1="340" x2="155" y2="345"/>
    <line x1="230" y1="340" x2="230" y2="345"/>
    <line x1="305" y1="340" x2="305" y2="345"/>
    <line x1="380" y1="340" x2="380" y2="345"/>
  </g>
  <g fill="#1b2a3a" font-size="12" text-anchor="middle">
    <text x="80" y="358">0</text>
    <text x="155" y="358">5</text>
    <text x="230" y="358">10</text>
    <text x="305" y="358">15</text>
    <text x="380" y="358">20</text>
  </g>

  <!-- y ticks -->
  <g stroke="#1b2a3a" stroke-width="1.2">
    <line x1="80" y1="340" x2="75" y2="340"/>
    <line x1="80" y1="265" x2="75" y2="265"/>
    <line x1="80" y1="190" x2="75" y2="190"/>
    <line x1="80" y1="115" x2="75" y2="115"/>
    <line x1="80" y1="40" x2="75" y2="40"/>
  </g>
  <g fill="#1b2a3a" font-size="12" text-anchor="end">
    <text x="70" y="344">0</text>
    <text x="70" y="269">5</text>
    <text x="70" y="194">10</text>
    <text x="70" y="119">15</text>
    <text x="70" y="44">20</text>
  </g>

  <!-- axis titles -->
  <text x="233" y="384" fill="#1b2a3a" font-size="14" text-anchor="middle">Measured y (mg/mL)</text>
  <text x="26" y="190" fill="#1b2a3a" font-size="14" text-anchor="middle" transform="rotate(-90 26 190)">Predicted &#375; (mg/mL)</text>

  <!-- bias line: faint parallel just above the 1:1 line -->
  <line x1="80" y1="328" x2="365" y2="43" stroke="#d18e8f" stroke-width="2" stroke-linecap="round"/>

  <!-- 1:1 identity line (dashed) -->
  <line x1="80" y1="340" x2="380" y2="40" stroke="#7d8fa3" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- bias bracket at right end (gap between the two lines) -->
  <path d="M368,42 L372,42 L372,56 L368,56" fill="none" stroke="#bc4749" stroke-width="1.4"/>

  <!-- residual segments (point to 1:1 line) -->
  <g stroke="#bc4749" stroke-width="2.4" stroke-linecap="round">
    <line x1="230" y1="175" x2="230" y2="190"/>
    <line x1="260" y1="145" x2="260" y2="160"/>
    <line x1="327.5" y1="82" x2="327.5" y2="92.5"/>
  </g>

  <!-- scatter points (hug the line) -->
  <g fill="#2a6f97" stroke="#134a63" stroke-width="0.8">
    <circle cx="110" cy="304" r="4.2"/>
    <circle cx="125" cy="301" r="4.2"/>
    <circle cx="132.5" cy="278.5" r="4.2"/>
    <circle cx="147.5" cy="275.5" r="4.2"/>
    <circle cx="155" cy="256" r="4.2"/>
    <circle cx="162.5" cy="263.5" r="4.2"/>
    <circle cx="177.5" cy="235" r="4.2"/>
    <circle cx="185" cy="239.5" r="4.2"/>
    <circle cx="192.5" cy="217" r="4.2"/>
    <circle cx="200" cy="226" r="4.2"/>
    <circle cx="207.5" cy="205" r="4.2"/>
    <circle cx="222.5" cy="200.5" r="4.2"/>
    <circle cx="230" cy="175" r="4.2"/>
    <circle cx="237.5" cy="187" r="4.2"/>
    <circle cx="252.5" cy="170.5" r="4.2"/>
    <circle cx="260" cy="145" r="4.2"/>
    <circle cx="267.5" cy="157" r="4.2"/>
    <circle cx="282.5" cy="127" r="4.2"/>
    <circle cx="290" cy="136" r="4.2"/>
    <circle cx="305" cy="103" r="4.2"/>
    <circle cx="312.5" cy="115" r="4.2"/>
    <circle cx="327.5" cy="82" r="4.2"/>
    <circle cx="335" cy="91" r="4.2"/>
    <circle cx="350" cy="64" r="4.2"/>
    <circle cx="357.5" cy="71.5" r="4.2"/>
  </g>

  <!-- in-plot identity-line label with short leader -->
  <line x1="158" y1="314" x2="131" y2="293" stroke="#7d8fa3" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="162" y="320" fill="#5a6b7a" font-size="13">ideal: &#375; = y  (1:1 line)</text>

  <!-- R2 corner box -->
  <rect x="410" y="50" width="272" height="50" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <rect x="410" y="50" width="4" height="50" rx="2" fill="#2a6f97"/>
  <text x="424" y="72" fill="#1b2a3a" font-size="13.5">R^2 = fraction of the y-variance the</text>
  <text x="424" y="90" fill="#1b2a3a" font-size="13.5">model captures  (1 = perfect fit)</text>

  <!-- RMSEP box + leader to a residual -->
  <rect x="410" y="114" width="272" height="66" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <rect x="410" y="114" width="4" height="66" rx="2" fill="#bc4749"/>
  <text x="424" y="135" fill="#1b2a3a" font-size="13.5">RMSEP = &#8730;( (1/n) &#8721; (&#375; &#8722; y)^2 )</text>
  <text x="424" y="153" fill="#5a6b7a" font-size="12.5">typical size of the residuals,</text>
  <text x="424" y="169" fill="#5a6b7a" font-size="12.5">spread about the line, in mg/mL</text>
  <line x1="410" y1="150" x2="334" y2="90" stroke="#7d8fa3" stroke-width="1.2" marker-end="url(#arw)"/>

  <!-- residual box + leader -->
  <rect x="410" y="194" width="272" height="46" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <rect x="410" y="194" width="4" height="46" rx="2" fill="#bc4749"/>
  <text x="424" y="214" fill="#1b2a3a" font-size="13.5">residual = &#375; &#8722; y</text>
  <text x="424" y="231" fill="#5a6b7a" font-size="12.5">vertical gap from point to 1:1 line</text>
  <line x1="410" y1="214" x2="266" y2="154" stroke="#7d8fa3" stroke-width="1.2" marker-end="url(#arw)"/>

  <!-- bias box + leader to bracket -->
  <rect x="410" y="254" width="272" height="58" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <rect x="410" y="254" width="4" height="58" rx="2" fill="#d18e8f"/>
  <text x="424" y="275" fill="#1b2a3a" font-size="13.5">systematic bias = mean(&#375; &#8722; y)</text>
  <text x="424" y="293" fill="#5a6b7a" font-size="12.5">faint upper line; ideally &#8776; 0</text>
  <line x1="410" y1="278" x2="374" y2="49" stroke="#7d8fa3" stroke-width="1.2" marker-end="url(#arw)"/>
</svg>
