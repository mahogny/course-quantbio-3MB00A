<svg xmlns="http://www.w3.org/2000/svg" width="690.7" height="383.0" viewBox="-2.7 32.1 690.7 383.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- region shading: left underfit, right overfit -->
  <rect x="90" y="60" width="157" height="260" fill="#eaf1f7"/>
  <rect x="247" y="60" width="393" height="260" fill="#f7ecec"/>

  <!-- region labels -->
  <text x="167" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">underfitting</text>
  <text x="167" y="98" text-anchor="middle" font-size="12.5" fill="#1b2a3a">(misses signal)</text>
  <text x="470" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#bc4749">overfitting</text>
  <text x="470" y="98" text-anchor="middle" font-size="12.5" fill="#bc4749">(fits noise)</text>

  <!-- axes -->
  <line x1="90" y1="320" x2="668" y2="320" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="320" x2="90" y2="52" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- axis titles -->
  <text x="365" y="392" text-anchor="middle" font-size="15" fill="#1b2a3a">Number of components (latent variables)</text>
  <text x="28" y="190" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 28 190)">Error (RMSE)</text>

  <!-- x ticks and labels -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="90" y1="320" x2="90" y2="326"/>
    <line x1="247" y1="320" x2="247" y2="326"/>
    <line x1="444" y1="320" x2="444" y2="326"/>
    <line x1="640" y1="320" x2="640" y2="326"/>
  </g>
  <g font-size="12.5" fill="#1b2a3a" text-anchor="middle">
    <text x="90" y="338">1</text>
    <text x="444" y="338">10</text>
    <text x="640" y="338">15</text>
  </g>

  <!-- optimal dashed drop line and annotation -->
  <line x1="247" y1="246" x2="247" y2="320" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="247" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2a3a">optimal ≈ 4–5 components</text>

  <!-- training error curve (grey, monotone decreasing) -->
  <polyline fill="none" stroke="#8592a0" stroke-width="2.2"
    points="90,170 129.3,210 168.6,237.5 207.9,257.5 247.1,272.5 286.4,282.5 325.7,290 365,296.25 404.3,301.25 443.6,305 482.9,308 522.1,310.5 561.4,312.5 600.7,314 640,315.5"/>

  <!-- validation error curve (accent blue, U-shaped) -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.4"
    points="90,115 129.3,182.5 168.6,225 207.9,245 247.1,246.25 286.4,237.5 325.7,225 365,210 404.3,192.5 443.6,175 482.9,157.5 522.1,140 561.4,122.5 600.7,105 640,87.5"/>

  <!-- minimum marker on validation curve -->
  <circle cx="247.1" cy="246.25" r="5" fill="#2a6f97"/>

  <!-- legend -->
  <line x1="300" y1="128" x2="332" y2="128" stroke="#8592a0" stroke-width="2.2"/>
  <text x="340" y="132" font-size="13.5" fill="#1b2a3a">Training error (RMSEC)</text>
  <line x1="300" y1="150" x2="332" y2="150" stroke="#2a6f97" stroke-width="2.4"/>
  <text x="340" y="154" font-size="13.5" fill="#1b2a3a">Validation error (RMSECV)</text>

  <!-- divergence note in the growing gap on the right -->
  <text x="548" y="252" text-anchor="middle" font-size="12.5" fill="#8592a0">training keeps improving —</text>
  <text x="548" y="269" text-anchor="middle" font-size="12.5" fill="#8592a0">cannot tell you where to stop</text>
  <line x1="548" y1="276" x2="566" y2="309" stroke="#8592a0" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
