<svg xmlns="http://www.w3.org/2000/svg" viewBox="20.9 12.5 688.1 381.3" font-family="Helvetica, Arial, sans-serif" width="688.1" height="381.3">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- column headers -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="150" y="42">Fold 1</text>
    <text x="230" y="42">Fold 2</text>
    <text x="310" y="42">Fold 3</text>
    <text x="390" y="42">Fold 4</text>
    <text x="470" y="42">Fold 5</text>
  </g>

  <!-- grid rows: each row highlights block i -->
  <!-- geometry: x-start 110, block width 80, row height 40, gap 12 -->

  <!-- Iteration 1 -->
  <g>
    <text x="102" y="76" font-size="14" fill="#1b2a3a" text-anchor="end">Iteration 1</text>
    <rect x="110" y="52" width="80" height="40" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="190" y="52" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="270" y="52" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="350" y="52" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="430" y="52" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <!-- Iteration 2 -->
  <g>
    <text x="102" y="128" font-size="14" fill="#1b2a3a" text-anchor="end">Iteration 2</text>
    <rect x="110" y="104" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="190" y="104" width="80" height="40" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="270" y="104" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="350" y="104" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="430" y="104" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <!-- Iteration 3 -->
  <g>
    <text x="102" y="180" font-size="14" fill="#1b2a3a" text-anchor="end">Iteration 3</text>
    <rect x="110" y="156" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="190" y="156" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="270" y="156" width="80" height="40" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="350" y="156" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="430" y="156" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <!-- Iteration 4 -->
  <g>
    <text x="102" y="232" font-size="14" fill="#1b2a3a" text-anchor="end">Iteration 4</text>
    <rect x="110" y="208" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="190" y="208" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="270" y="208" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="350" y="208" width="80" height="40" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="430" y="208" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>
  <!-- Iteration 5 -->
  <g>
    <text x="102" y="284" font-size="14" fill="#1b2a3a" text-anchor="end">Iteration 5</text>
    <rect x="110" y="260" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="190" y="260" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="270" y="260" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="350" y="260" width="80" height="40" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect x="430" y="260" width="80" height="40" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
  </g>

  <!-- brace collecting held-out predictions on the right -->
  <path d="M524,52 q10,0 10,12 v74 q0,12 10,12 q-10,0 -10,12 v74 q0,12 -10,12"
        fill="none" stroke="#1b2a3a" stroke-width="1.8"/>

  <g font-size="12.5" fill="#1b2a3a">
    <text x="548" y="140">every sample predicted</text>
    <text x="548" y="158">exactly once by a model</text>
    <text x="548" y="176">that did not see it</text>
    <text x="548" y="200" font-size="13" fill="#2a6f97" font-weight="bold">→ one error (RMSECV)</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <rect x="110" y="322" width="20" height="16" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="138" y="335">test / held-out fold</text>
    <rect x="300" y="322" width="20" height="16" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="328" y="335">train folds</text>
  </g>

  <!-- note beneath -->
  <text x="110" y="372" font-size="12.5" fill="#1b2a3a" font-style="italic">LOO = k = n;  keep replicates / batches of one specimen in the SAME fold</text>
</svg>
