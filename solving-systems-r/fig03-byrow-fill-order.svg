<svg xmlns="http://www.w3.org/2000/svg" viewBox="88.7 -6.3 704.8 413.8" width="704.8" height="413.8" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- Source vector -->
  <text x="398" y="26" text-anchor="end" font-size="17" fill="#1b2a3a">source vector:</text>
  <text x="406" y="26" text-anchor="start" font-size="17" fill="#1b2a3a" font-family="monospace">c(1, 2, 3, 4)</text>
  <g>
    <rect x="322" y="38" width="40" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <rect x="368" y="38" width="40" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <rect x="414" y="38" width="40" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <rect x="460" y="38" width="40" height="40" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="342" y="64" text-anchor="middle" font-size="19" fill="#1b2a3a">1</text>
    <text x="388" y="64" text-anchor="middle" font-size="19" fill="#1b2a3a">2</text>
    <text x="434" y="64" text-anchor="middle" font-size="19" fill="#1b2a3a">3</text>
    <text x="480" y="64" text-anchor="middle" font-size="19" fill="#1b2a3a">4</text>
  </g>

  <!-- ===================== LEFT PANEL: byrow = TRUE ===================== -->
  <text x="180" y="128" text-anchor="middle" font-size="16" fill="#1b2a3a" font-weight="bold">byrow = TRUE</text>
  <text x="180" y="147" text-anchor="middle" font-size="13" fill="#2a6f97">(fills row by row)</text>

  <!-- grid cells -->
  <g stroke="#1b2a3a" stroke-width="2" fill="#eaf1f7">
    <rect x="110" y="170" width="70" height="70"/>
    <rect x="180" y="170" width="70" height="70"/>
    <rect x="110" y="240" width="70" height="70"/>
    <rect x="180" y="240" width="70" height="70"/>
  </g>
  <g font-size="26" fill="#1b2a3a" text-anchor="middle">
    <text x="145" y="214">1</text>
    <text x="215" y="214">2</text>
    <text x="145" y="284">3</text>
    <text x="215" y="284">4</text>
  </g>
  <!-- fill-path arrows: 1->2 across, 2->3 down-left, 3->4 across -->
  <path d="M158 205 L202 205" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M223 218 Q245 250 152 268" fill="none" stroke="#2a6f97" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M158 275 L202 275" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#ah)"/>

  <!-- row labels -->
  <text x="270" y="211" font-size="13" fill="#6a994e">row 1 = [1, 2]</text>
  <text x="270" y="281" font-size="13" fill="#6a994e">row 2 = [3, 4]</text>

  <!-- ===================== RIGHT PANEL: byrow = FALSE ===================== -->
  <text x="600" y="120" text-anchor="middle" font-size="16" fill="#1b2a3a" font-weight="bold">byrow = FALSE</text>
  <text x="600" y="138" text-anchor="middle" font-size="13" fill="#2a6f97">the default — fills column by column</text>

  <g stroke="#1b2a3a" stroke-width="2" fill="#eaf1f7">
    <rect x="530" y="170" width="70" height="70"/>
    <rect x="600" y="170" width="70" height="70"/>
    <rect x="530" y="240" width="70" height="70"/>
    <rect x="600" y="240" width="70" height="70"/>
  </g>
  <g font-size="26" fill="#1b2a3a" text-anchor="middle">
    <text x="565" y="214">1</text>
    <text x="635" y="214">3</text>
    <text x="565" y="284">2</text>
    <text x="635" y="284">4</text>
  </g>
  <!-- fill-path arrows: 1->2 down, 2->3 up-right, 3->4 down -->
  <path d="M565 218 L565 262" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M578 272 Q612 250 632 218" fill="none" stroke="#2a6f97" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M635 218 L635 262" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#ah)"/>

  <!-- column labels -->
  <text x="530" y="330" font-size="13" fill="#6a994e" text-anchor="middle">col 1 = (1,2)</text>
  <text x="640" y="330" font-size="13" fill="#6a994e" text-anchor="middle">col 2 = (3,4)</text>
  <text x="700" y="211" font-size="13" fill="#6a994e">row 1 = [1, 3]</text>
  <text x="700" y="281" font-size="13" fill="#6a994e">row 2 = [2, 4]</text>

  <!-- ===================== transposed warning ===================== -->
  <g>
    <rect x="345" y="222" width="130" height="34" rx="8" fill="#fbeaea" stroke="#bc4749" stroke-width="1.8"/>
    <text x="410" y="238" text-anchor="middle" font-size="15" fill="#bc4749" font-weight="bold">transposed!</text>
    <text x="410" y="252" text-anchor="middle" font-size="10.5" fill="#bc4749">default flips left-to-right typing</text>
    <path d="M345 239 L260 239" fill="none" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="3 3"/>
    <path d="M475 239 L520 239" fill="none" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="3 3"/>
  </g>

  <!-- code caption -->
  <text x="410" y="386" text-anchor="middle" font-size="13" fill="#1b2a3a" font-family="monospace">matrix(c(1,2,3,4), nrow = 2)</text>
</svg>
