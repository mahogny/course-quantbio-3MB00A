<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11.1 -17.1 841.0 421.9" width="841.0" height="421.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== Start node ===== -->
  <rect x="380" y="8" width="140" height="40" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="450" y="33" text-anchor="middle" font-size="20" font-style="italic" fill="#1b2a3a">A x = b</text>
  <line x1="450" y1="48" x2="450" y2="72" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Diamond 1: is A square? ===== -->
  <polygon points="450,74 542,110 450,146 358,110" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" font-size="15" fill="#1b2a3a" font-weight="bold">Is A square?</text>
  <text x="450" y="123" text-anchor="middle" font-size="12" fill="#1b2a3a">#rows = #cols?</text>
  <text x="500" y="152" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2a6f97">via dim(A)</text>

  <!-- NO branch: to left -> non-square -->
  <line x1="358" y1="110" x2="257" y2="110" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">NO</text>

  <!-- ===== Non-square box ===== -->
  <rect x="85" y="86" width="170" height="48" rx="6" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="170" y="106" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">Non-square</text>
  <text x="170" y="124" text-anchor="middle" font-size="12" fill="#1b2a3a">split by shape</text>

  <!-- split V to two case boxes -->
  <line x1="170" y1="134" x2="95" y2="207" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="134" x2="272" y2="207" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="178" text-anchor="middle" font-size="11.5" fill="#1b2a3a">rows &gt; cols</text>
  <text x="298" y="178" text-anchor="middle" font-size="11.5" fill="#1b2a3a">cols &gt; rows</text>

  <!-- Case 2: OVER-determined (blue) -->
  <rect x="14" y="210" width="164" height="66" rx="6" fill="#e3eef5" stroke="#2a6f97" stroke-width="2"/>
  <text x="96" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a6f97">CASE 2</text>
  <text x="96" y="249" text-anchor="middle" font-size="12.5" fill="#1b2a3a">OVER-determined</text>
  <text x="96" y="266" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1b2a3a">use least squares</text>

  <!-- Case 3: UNDER-determined (orange) -->
  <rect x="186" y="210" width="172" height="66" rx="6" fill="#f6e6d0" stroke="#d98324" stroke-width="2"/>
  <text x="272" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#c26a12">CASE 3</text>
  <text x="272" y="249" text-anchor="middle" font-size="12.5" fill="#1b2a3a">UNDER-determined</text>
  <text x="272" y="266" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1b2a3a">infinitely many</text>

  <!-- YES branch: down to diamond 2 -->
  <line x1="450" y1="146" x2="450" y2="183" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="168" text-anchor="start" font-size="13" font-weight="bold" fill="#6a994e">YES</text>

  <!-- ===== Diamond 2: singular? ===== -->
  <polygon points="450,185 562,225 450,265 338,225" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="450" y="221" text-anchor="middle" font-size="13.5" fill="#1b2a3a" font-weight="bold">det(A) ≈ 0  or</text>
  <text x="450" y="238" text-anchor="middle" font-size="13.5" fill="#1b2a3a">rank &lt; #unknowns?</text>
  <text x="450" y="283" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2a6f97">via det(A), qr(A)$rank</text>

  <!-- NO (full rank) -> right -> Case 1 -->
  <line x1="562" y1="225" x2="617" y2="225" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a994e">NO</text>
  <text x="590" y="252" text-anchor="middle" font-size="11" fill="#1b2a3a">full rank</text>

  <!-- Case 1: unique (green) -->
  <rect x="620" y="192" width="185" height="66" rx="6" fill="#e6efdf" stroke="#6a994e" stroke-width="2"/>
  <text x="712" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f7a37">CASE 1</text>
  <text x="712" y="231" text-anchor="middle" font-size="12.5" fill="#1b2a3a">unique solution</text>
  <text x="712" y="249" text-anchor="middle" font-size="12" font-family="monospace" fill="#1b2a3a">solve(A,b)</text>

  <!-- YES (singular) -> down -> Case 3 orange -->
  <line x1="450" y1="265" x2="450" y2="315" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="292" text-anchor="start" font-size="12.5" font-weight="bold" fill="#d98324">YES</text>

  <!-- Case 3: singular (orange) -->
  <rect x="338" y="318" width="224" height="62" rx="6" fill="#f6e6d0" stroke="#d98324" stroke-width="2"/>
  <text x="450" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#c26a12">CASE 3  ·  singular</text>
  <text x="450" y="356" text-anchor="middle" font-size="12" fill="#1b2a3a">infinitely many (or none)</text>
  <text x="450" y="373" text-anchor="middle" font-size="12" font-family="monospace" fill="#bc4749">solve() errors</text>

  <!-- ===== Legend ===== -->
  <g font-size="12" fill="#1b2a3a">
    <rect x="620" y="300" width="16" height="12" fill="#e6efdf" stroke="#6a994e" stroke-width="1.5"/>
    <text x="642" y="310" text-anchor="start">Case 1 — unique</text>
    <rect x="620" y="322" width="16" height="12" fill="#e3eef5" stroke="#2a6f97" stroke-width="1.5"/>
    <text x="642" y="332" text-anchor="start">Case 2 — least squares</text>
    <rect x="620" y="344" width="16" height="12" fill="#f6e6d0" stroke="#d98324" stroke-width="1.5"/>
    <text x="642" y="354" text-anchor="start">Case 3 — under / singular</text>
  </g>
</svg>
