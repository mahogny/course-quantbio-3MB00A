<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===================== LEFT: coordinate plane ===================== -->
  <!-- origin at (170,200); scale = 120 px per unit -->

  <!-- unit circle -->
  <circle cx="170" cy="200" r="120" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="38" y1="200" x2="302" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="170" y1="68" x2="170" y2="332" stroke="#c9d3dd" stroke-width="1.5"/>
  <!-- axis arrowheads -->
  <line x1="290" y1="200" x2="302" y2="200" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="80" x2="170" y2="68" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- right-angle marker at origin between the two arrows (both point "up") -->
  <!-- v1 dir (0.707,0.707)-> px(+,-); v2 dir (-0.707,0.707)-> px(-,-). small square spanning both -->
  <!-- proper right-angle square: two short legs along each eigenvector -->
  <path d="M 182.7,187.3 L 170,175 L 157.3,187.3 L 170,199.6 Z" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.4"/>

  <!-- v1 arrow to (0.707,0.707): px = 170+84.8=254.8, py = 200-84.8=115.2 -->
  <line x1="170" y1="200" x2="254.8" y2="115.2" stroke="#2a6f97" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <circle cx="254.8" cy="115.2" r="3" fill="#2a6f97"/>
  <text x="262" y="108" font-size="14" fill="#2a6f97" font-weight="bold">v₁ (λ=3)</text>

  <!-- v2 arrow to (-0.707,0.707): px = 170-84.8=85.2, py = 115.2 -->
  <line x1="170" y1="200" x2="85.2" y2="115.2" stroke="#bc4749" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <circle cx="85.2" cy="115.2" r="3" fill="#bc4749"/>
  <text x="6" y="108" font-size="14" fill="#bc4749" font-weight="bold">v₂ (λ=1)</text>

  <!-- unit-length hint -->
  <text x="170" y="352" font-size="12" fill="#1b2a3a" text-anchor="middle" opacity="0.75">tips on unit circle → ‖v‖ = 1</text>

  <!-- ===================== RIGHT: annotation ===================== -->
  <!-- annotation box -->
  <rect x="340" y="58" width="360" height="132" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="360" y="90" font-size="16" fill="#1b2a3a">columns of V are <tspan font-weight="bold">orthonormal</tspan></text>
  <text x="360" y="122" font-size="16" fill="#1b2a3a">crossprod(V) = VᵀV = I  (identity)</text>
  <text x="360" y="162" font-size="16" fill="#1b2a3a" font-weight="bold">⇒ V⁻¹ = Vᵀ</text>
  <text x="500" y="162" font-size="16" fill="#6a994e" font-weight="bold">→  A = V Λ Vᵀ</text>

  <!-- tiny 2x2 identity matrix labelled VᵀV -->
  <text x="440" y="238" font-size="15" fill="#1b2a3a" text-anchor="middle">VᵀV  =</text>

  <!-- bracket + cells -->
  <g stroke="#1b2a3a" stroke-width="1.6" fill="none">
    <path d="M 492,214 L 486,214 L 486,272 L 492,272"/>
    <path d="M 570,214 L 576,214 L 576,272 L 570,272"/>
  </g>
  <rect x="496" y="220" width="30" height="22" fill="#6a994e" fill-opacity="0.18" stroke="#c9d3dd" stroke-width="1"/>
  <rect x="536" y="220" width="30" height="22" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <rect x="496" y="246" width="30" height="22" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <rect x="536" y="246" width="30" height="22" fill="#6a994e" fill-opacity="0.18" stroke="#c9d3dd" stroke-width="1"/>
  <text x="511" y="236" font-size="15" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="551" y="236" font-size="15" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="511" y="262" font-size="15" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="551" y="262" font-size="15" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="595" y="245" font-size="14" fill="#1b2a3a">= I</text>

  <!-- caption -->
  <text x="340" y="312" font-size="13" fill="#1b2a3a" opacity="0.8">Symmetric A ⇒ eigenvectors meet at 90°, so V is a pure</text>
  <text x="340" y="332" font-size="13" fill="#1b2a3a" opacity="0.8">rotation and the inverse is just its transpose.</text>
</svg>
