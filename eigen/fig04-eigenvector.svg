<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 -6.1 592 416.6" width="592" height="416.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6a994e"/>
    </marker>
    <marker id="ahAxis" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- light grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="80" y1="30" x2="80" y2="350"/>
    <line x1="160" y1="30" x2="160" y2="350"/>
    <line x1="240" y1="30" x2="240" y2="350"/>
    <line x1="320" y1="30" x2="320" y2="350"/>
    <line x1="400" y1="30" x2="400" y2="350"/>
    <line x1="80" y1="350" x2="430" y2="350"/>
    <line x1="80" y1="270" x2="430" y2="270"/>
    <line x1="80" y1="190" x2="430" y2="190"/>
    <line x1="80" y1="110" x2="430" y2="110"/>
    <line x1="80" y1="30"  x2="430" y2="30"/>
  </g>

  <!-- 45-degree eigen-line guide -->
  <line x1="80" y1="350" x2="376" y2="54" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="80" y1="350" x2="435" y2="350" marker-end="url(#ahAxis)"/>
    <line x1="80" y1="350" x2="80" y2="22" marker-end="url(#ahAxis)"/>
  </g>
  <text x="443" y="355" font-size="16" fill="#1b2a3a">x</text>
  <text x="72" y="20" font-size="16" fill="#1b2a3a" text-anchor="end">y</text>
  <circle cx="80" cy="350" r="2.5" fill="#1b2a3a"/>
  <text x="70" y="366" font-size="13" fill="#1b2a3a">O</text>

  <!-- axis scale numbers (each grid cell = 1 unit) -->
  <g font-size="11" fill="#6b7885">
    <text x="160" y="367" text-anchor="middle">1</text>
    <text x="240" y="367" text-anchor="middle">2</text>
    <text x="320" y="367" text-anchor="middle">3</text>
    <text x="400" y="367" text-anchor="middle">4</text>
    <text x="66" y="274" text-anchor="middle">1</text>
    <text x="66" y="194" text-anchor="middle">2</text>
    <text x="66" y="114" text-anchor="middle">3</text>
    <text x="66" y="34"  text-anchor="middle">4</text>
  </g>

  <!-- matrix label with square brackets -->
  <g font-size="16" fill="#1b2a3a">
    <text x="500" y="52">A =</text>
    <text x="548" y="45" font-size="15">2  1</text>
    <text x="548" y="65" font-size="15">1  2</text>
    <g stroke="#1b2a3a" stroke-width="1.5" fill="none">
      <path d="M546,30 L538,30 L538,72 L546,72"/>
      <path d="M594,30 L602,30 L602,72 L594,72"/>
    </g>
  </g>

  <!-- OUTPUT Av = (3,3) green, drawn first so the input sits on top -->
  <line x1="80" y1="350" x2="320" y2="110" stroke="#6a994e" stroke-width="4" marker-end="url(#ahGreen)"/>
  <text x="336" y="112" font-size="13" fill="#6a994e" font-weight="bold">Av = (3,3)</text>
  <text x="336" y="134" font-size="14" fill="#6a994e" font-weight="bold">same line, &#215;3</text>
  <text x="336" y="156" font-size="13" fill="#6a994e" font-weight="bold">&#955; = 3</text>

  <!-- INPUT v = (1,1): blue, on top of Av -->
  <line x1="80" y1="350" x2="158" y2="272" stroke="#2a6f97" stroke-width="3" marker-end="url(#ahBlue)"/>
  <text x="170" y="292" font-size="13" fill="#2a6f97" font-weight="bold">v = (1,1)</text>

  <!-- legend / reading guide -->
  <g>
    <rect x="448" y="248" width="162" height="86" rx="6" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/>
    <text x="460" y="268" font-size="12" fill="#1b2a3a" font-weight="bold">How A acts on v</text>
    <line x1="458" y1="290" x2="484" y2="290" stroke="#2a6f97" stroke-width="3" marker-end="url(#ahBlue)"/>
    <text x="497" y="294" font-size="12" fill="#1b2a3a">eigenvector v</text>
    <line x1="458" y1="322" x2="484" y2="322" stroke="#6a994e" stroke-width="3.5" marker-end="url(#ahGreen)"/>
    <text x="497" y="326" font-size="12" fill="#1b2a3a">A&#183;v = 3v</text>
  </g>

  <!-- caption -->
  <text x="320" y="390" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">A only stretches v: no rotation.</text>
</svg>
