  <!-- eigenvector arrows from centroid; length ∝ eigenvalue -->
  <!-- major (red): λ1 large -->
  <line x1="279" y1="216" x2="420" y2="113" stroke="#bc4749" stroke-width="3.2" marker-end="url(#red)"/>
  <!-- minor (orange): λ2 small, perpendicular -->
  <line x1="279" y1="216" x2="251" y2="178" stroke="#e08a2e" stroke-width="3.2" marker-end="url(#org)"/>
  <!-- centroid -->
  <circle cx="279" cy="216" r="4.6" fill="#1b2a3a" stroke="#ffffff" stroke-width="1.6"/>

  <!-- on-plot tags -->
  <text x="428" y="108" font-size="16" font-weight="bold" fill="#bc4749">λ1</text>
  <text x="232" y="166" font-size="15" font-weight="bold" fill="#e08a2e">λ2</text>
  <text x="345" y="300" text-anchor="middle" font-size="13" fill="#2a6f97" font-style="italic">tilted ≈35° cloud</text>

  <!-- ================= RIGHT: covariance matrix ================= -->
  <text x="560" y="46" font-size="16" font-weight="bold" fill="#1b2a3a">Covariance matrix C  (symmetric)</text>

  <!-- brackets -->
  <path d="M574,58 L566,58 L566,150 L574,150" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
  <path d="M828,58 L836,58 L836,150 L828,150" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
  <text x="551" y="110" font-size="20" font-weight="bold" fill="#1b2a3a">C =</text>

  <!-- diagonal cells -->
  <rect x="580" y="66" width="112" height="34" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <text x="636" y="88" text-anchor="middle" font-size="14" fill="#1b2a3a">var(g1)</text>
  <rect x="710" y="108" width="112" height="34" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/>
  <text x="766" y="130" text-anchor="middle" font-size="14" fill="#1b2a3a">var(g2)</text>

  <!-- off-diagonal cells highlighted (equal → symmetry) -->
  <rect x="710" y="66" width="112" height="34" rx="6" fill="#fbe3cf" stroke="#e08a2e" stroke-width="2"/>
  <text x="766" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#c06a12">cov(g1,g2)</text>
  <rect x="580" y="108" width="112" height="34" rx="6" fill="#fbe3cf" stroke="#e08a2e" stroke-width="2"/>
  <text x="636" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#c06a12">cov(g1,g2)</text>

  <!-- equality note between off-diagonals -->
  <path d="M712,80 C700,92 700,116 690,124" fill="none" stroke="#e08a2e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="700" y="163" text-anchor="middle" font-size="13" fill="#c06a12" font-weight="bold">off-diagonals equal  =>  C = C^T</text>

  <!-- ================= legend ================= -->
  <line x1="560" y1="196" x2="588" y2="196" stroke="#bc4749" stroke-width="3.2" marker-end="url(#red)"/>
  <text x="596" y="193" font-size="13.5" fill="#1b2a3a"><tspan font-weight="bold" fill="#bc4749">eigenvector 1</tspan> — large λ1 = most</text>
  <text x="596" y="209" font-size="13.5" fill="#1b2a3a">variance (long axis of cloud)</text>

  <line x1="560" y1="234" x2="580" y2="234" stroke="#e08a2e" stroke-width="3.2" marker-end="url(#org)"/>
  <text x="596" y="231" font-size="13.5" fill="#1b2a3a"><tspan font-weight="bold" fill="#c06a12">eigenvector 2</tspan> — small λ2 = least</text>
  <text x="596" y="247" font-size="13.5" fill="#1b2a3a">variance (perp to axis 1)</text>

  <text x="560" y="273" font-size="12.5" fill="#2a6f97" font-style="italic">arrow length prop. to eigenvalue λ</text>

  <!-- ================= caption ================= -->
  <rect x="20" y="360" width="820" height="34" rx="9" fill="#fdf0f0" stroke="#bc4749" stroke-width="1.5"/>
  <text x="150" y="382" font-size="15" fill="#1b2a3a">biggest eigenvalue <tspan font-weight="bold" fill="#bc4749">-&gt;</tspan> long axis of the cloud <tspan font-weight="bold" fill="#bc4749">-&gt;</tspan> <tspan font-weight="bold">1st principal component</tspan> (PCA engine)</text>
</svg>
