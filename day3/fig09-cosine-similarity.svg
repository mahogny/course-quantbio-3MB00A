<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ================= Plot geometry ==================
       Origin at (70, 350). Scale: 22 px per data unit.
       data (x,y) -> screen ( 70 + 22*x , 350 - 22*y )
       sample B (6, 3.5)  -> (202, 273)
       sample A (12, 7)   -> (334, 196)
  -->

  <!-- Axes -->
  <line x1="70" y1="350" x2="70" y2="40" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="350" x2="470" y2="350" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="34" font-size="14" fill="#1b2a3a" text-anchor="end">gene 2</text>
  <text x="478" y="355" font-size="14" fill="#1b2a3a">gene 1</text>
  <text x="58" y="356" font-size="14" fill="#1b2a3a" text-anchor="end">O</text>

  <!-- Dashed common direction line (extends through both arrows) -->
  <line x1="70" y1="350" x2="420" y2="146" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="424" y="142" font-size="12" fill="#8a97a4">common direction line</text>

  <!-- Long arrow: sample A (deep depth) -> (334,196) -->
  <line x1="70" y1="350" x2="334" y2="196" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <!-- Short arrow: sample B (shallow depth) -> (202,273); drawn on top -->
  <line x1="70" y1="350" x2="202" y2="273" stroke="#6a994e" stroke-width="2.4" marker-end="url(#arrowGreen)"/>

  <!-- Arrow labels -->
  <text x="342" y="188" font-size="15" fill="#2a6f97" font-weight="bold">sample A</text>
  <text x="342" y="205" font-size="12" fill="#2a6f97">(deep depth)</text>
  <text x="116" y="244" font-size="15" fill="#6a994e" font-weight="bold">sample B</text>
  <text x="116" y="260" font-size="12" fill="#6a994e">(shallow depth)</text>

  <!-- Angle marker at origin: theta = 0 -->
  <circle cx="70" cy="350" r="4" fill="#1b2a3a"/>
  <text x="118" y="335" font-size="15" fill="#bc4749" font-weight="bold">θ = 0,  cos-sim = 1</text>

  <!-- Annotation about direction vs depth -->
  <text x="70" y="384" font-size="13" fill="#1b2a3a">same direction = same expression shape; only overall depth (length) differs</text>

  <!-- Contrast box -->
  <rect x="500" y="200" width="200" height="150" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="600" y="224" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Contrast</text>
  <text x="516" y="252" font-size="12.5" fill="#bc4749">Euclidean distance</text>
  <text x="516" y="270" font-size="12.5" fill="#1b2a3a">would call these</text>
  <text x="516" y="288" font-size="12.5" fill="#1b2a3a">far apart.</text>
  <text x="516" y="314" font-size="12.5" fill="#2a6f97">Cosine similarity</text>
  <text x="516" y="332" font-size="12.5" fill="#1b2a3a">calls them identical.</text>
</svg>
