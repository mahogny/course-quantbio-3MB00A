<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" font-family="'DejaVu Sans','Helvetica',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ================= LEFT: mechanism ================= -->
  <text x="30" y="26" font-size="16" fill="#1b2a3a" font-weight="bold">Mechanism</text>

  <!-- Cell A: healthy -->
  <text x="120" y="52" text-anchor="middle" font-size="14" fill="#6a994e" font-weight="bold">healthy</text>
  <circle cx="120" cy="140" r="72" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- cytoplasmic mRNA squiggles (blue) inside cell A -->
  <g stroke="#2a6f97" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M78,108 q8,-8 16,0 q8,8 16,0"/>
    <path d="M138,100 q8,-8 16,0 q8,8 16,0"/>
    <path d="M92,130 q8,-8 16,0 q8,8 16,0"/>
    <path d="M150,132 q8,-8 16,0 q8,8 16,0"/>
    <path d="M78,160 q8,-8 16,0 q8,8 16,0"/>
    <path d="M132,168 q8,-8 16,0 q8,8 16,0"/>
    <path d="M100,182 q8,-8 16,0 q8,8 16,0"/>
  </g>
  <!-- mitochondria (red ovals) inside cell A -->
  <g fill="#bc4749" stroke="#8a3335" stroke-width="1.5">
    <ellipse cx="122" cy="150" rx="15" ry="8"/>
    <ellipse cx="98" cy="118" rx="15" ry="8" transform="rotate(30 98 118)"/>
  </g>
  <text x="120" y="228" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">low % mito</text>

  <!-- Cell B: dying -->
  <text x="330" y="52" text-anchor="middle" font-size="14" fill="#bc4749" font-weight="bold">dying</text>
  <!-- broken/dashed membrane -->
  <circle cx="330" cy="140" r="72" fill="#eaf1f7" stroke="#bc4749" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- mitochondria retained inside cell B -->
  <g fill="#bc4749" stroke="#8a3335" stroke-width="1.5">
    <ellipse cx="330" cy="150" rx="15" ry="8"/>
    <ellipse cx="308" cy="120" rx="15" ry="8" transform="rotate(30 308 120)"/>
    <ellipse cx="352" cy="122" rx="15" ry="8" transform="rotate(-25 352 122)"/>
  </g>
  <!-- mitochondrion identity is given by the legend (MT-RNA); inline white labels removed (illegible on the small ovals) -->

  <!-- a few blue mRNA still inside cell B -->
  <g stroke="#2a6f97" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300,175 q8,-8 16,0 q8,8 16,0"/>
    <path d="M340,178 q8,-8 16,0 q8,8 16,0"/>
  </g>
  <!-- cytoplasmic mRNA leaking OUT through the broken membrane -->
  <g stroke="#2a6f97" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M392,110 q8,-8 16,0 q8,8 16,0"/>
    <path d="M400,140 q8,-8 16,0 q8,8 16,0"/>
    <path d="M392,170 q8,-8 16,0 q8,8 16,0"/>
    <path d="M300,66 q8,-8 16,0 q8,8 16,0"/>
    <path d="M256,110 q8,-8 16,0 q8,8 16,0"/>
    <path d="M330,214 q8,-8 16,0 q8,8 16,0"/>
  </g>
  <!-- escape arrows -->
  <g stroke="#2a6f97" stroke-width="1.5">
    <line x1="384" y1="120" x2="404" y2="118" marker-end="url(#arrowblue)"/>
    <line x1="378" y1="150" x2="398" y2="150" marker-end="url(#arrowblue)"/>
    <line x1="330" y1="208" x2="330" y2="222" marker-end="url(#arrowblue)"/>
  </g>

  <text x="330" y="248" text-anchor="middle" font-size="12" fill="#2a6f97" font-weight="bold">cytoplasmic RNA escapes,</text>
  <text x="330" y="264" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">mito RNA retained  →  % mito rises</text>

  <!-- mini legend -->
  <g font-size="12" fill="#1b2a3a">
    <path d="M40,296 q6,-6 12,0 q6,6 12,0" stroke="#2a6f97" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="72" y="300">cytoplasmic mRNA</text>
    <ellipse cx="46" cy="320" rx="12" ry="7" fill="#bc4749" stroke="#8a3335" stroke-width="1.5"/>
    <text x="72" y="324">mitochondrion (MT-RNA)</text>
  </g>

  <!-- divider -->
  <line x1="450" y1="40" x2="450" y2="330" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- ================= RIGHT: distribution ================= -->
  <text x="490" y="26" font-size="16" fill="#1b2a3a" font-weight="bold">Distribution across cells</text>

  <!-- axes: plot area x 510..850, y 60..300 -->
  <line x1="510" y1="300" x2="855" y2="300" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="510" y1="60" x2="510" y2="300" stroke="#1b2a3a" stroke-width="2"/>

  <!-- x tick labels: 0..40 across 510..850 (8.5 px per %) -->
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <line x1="510" y1="300" x2="510" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="510" y="320">0</text>
    <line x1="595" y1="300" x2="595" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="595" y="320">10</text>
    <line x1="680" y1="300" x2="680" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="680" y="320">20</text>
    <line x1="765" y1="300" x2="765" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="765" y="320">30</text>
    <line x1="850" y1="300" x2="850" y2="305" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="850" y="320">40</text>
  </g>
  <text x="682" y="342" text-anchor="middle" font-size="13" fill="#1b2a3a" font-weight="bold">pct.mt (%)</text>
  <text x="500" y="180" text-anchor="middle" font-size="13" fill="#1b2a3a" font-weight="bold" transform="rotate(-90 500 180)"># cells</text>

  <!-- histogram bars. threshold at 15% => x = 510 + 15*8.5 = 637.5 -->
  <!-- healthy peak near 2-8%, right tail high-mito. bar width ~16px (2% wide) -->
  <g stroke="#ffffff" stroke-width="1">
    <!-- healthy (green) bars, left of threshold -->
    <rect x="510" y="252" width="16" height="48" fill="#6a994e"/>
    <rect x="527" y="210" width="16" height="90" fill="#6a994e"/>
    <rect x="544" y="120" width="16" height="180" fill="#6a994e"/>
    <rect x="561" y="96"  width="16" height="204" fill="#6a994e"/>
    <rect x="578" y="150" width="16" height="150" fill="#6a994e"/>
    <rect x="595" y="216" width="16" height="84" fill="#6a994e"/>
    <rect x="612" y="258" width="16" height="42" fill="#6a994e"/>
    <rect x="629" y="276" width="16" height="24" fill="#6a994e"/>
    <!-- high-mito tail (red, shaded), right of threshold -->
    <rect x="646" y="270" width="16" height="30" fill="#bc4749" opacity="0.85"/>
    <rect x="663" y="276" width="16" height="24" fill="#bc4749" opacity="0.85"/>
    <rect x="680" y="282" width="16" height="18" fill="#bc4749" opacity="0.85"/>
    <rect x="697" y="285" width="16" height="15" fill="#bc4749" opacity="0.85"/>
    <rect x="714" y="288" width="16" height="12" fill="#bc4749" opacity="0.85"/>
    <rect x="731" y="290" width="16" height="10" fill="#bc4749" opacity="0.85"/>
    <rect x="748" y="292" width="16" height="8" fill="#bc4749" opacity="0.85"/>
    <rect x="765" y="293" width="16" height="7" fill="#bc4749" opacity="0.85"/>
    <rect x="782" y="294" width="16" height="6" fill="#bc4749" opacity="0.85"/>
    <rect x="799" y="295" width="16" height="5" fill="#bc4749" opacity="0.85"/>
  </g>

  <!-- shaded region to the right of the threshold -->
  <rect x="637" y="60" width="218" height="240" fill="#bc4749" opacity="0.08"/>

  <!-- threshold dashed line at ~15% -->
  <line x1="637" y1="52" x2="637" y2="300" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="637" y="46" text-anchor="middle" font-size="12" fill="#1b2a3a" font-weight="bold">threshold (~5-20%, dataset-dependent)</text>

  <!-- labels for the two populations -->
  <text x="570" y="86" text-anchor="middle" font-size="12" fill="#6a994e" font-weight="bold">healthy</text>
  <text x="748" y="118" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">high % mito  →</text>
  <text x="748" y="134" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">dying / low-quality</text>
  <text x="748" y="150" text-anchor="middle" font-size="12" fill="#bc4749" font-weight="bold">→ filter</text>

  <!-- ================= caption formula ================= -->
  <!-- text-anchor="start" so the subscript tspan flows inline (avoids cairo centre-stacking) -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace">
    <text x="94" y="366" text-anchor="start" font-size="15" fill="#1b2a3a">pct.mt<tspan font-size="11" dy="3">c</tspan><tspan font-size="15" dy="-3">  =  100 × ( &#8721; MT-gene counts in cell c )  /  ( total counts in cell c )</tspan></text>
  </g>
</svg>
