<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.9 24.9 597.0 382.5" font-family="Helvetica, Arial, sans-serif" width="597.0" height="382.5">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- plot frame reference lines: x from 70 to 560, y from 60 to 320 -->

  <!-- shaded region: real cells (left plateau) -->
  <rect x="70" y="60" width="150" height="260" fill="#6a994e" opacity="0.12"/>
  <!-- shaded region: empty droplets (right tail) -->
  <rect x="330" y="60" width="230" height="260" fill="#bc4749" opacity="0.10"/>

  <!-- axes -->
  <line x1="70" y1="320" x2="580" y2="320" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="320" x2="70" y2="45" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- light grid ticks (log decades, illustrative) -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="70"  y1="120" x2="560" y2="120"/>
    <line x1="70"  y1="200" x2="560" y2="200"/>
    <line x1="70"  y1="280" x2="560" y2="280"/>
    <line x1="192" y1="60"  x2="192" y2="320"/>
    <line x1="315" y1="60"  x2="315" y2="320"/>
    <line x1="437" y1="60"  x2="437" y2="320"/>
  </g>

  <!-- horizontal dashed cutoff line -->
  <line x1="70" y1="205" x2="560" y2="205" stroke="#2a6f97" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="560" y="200" font-size="13" fill="#2a6f97" text-anchor="end">cell / empty cutoff</text>

  <!-- barcode-rank curve: high flat plateau, sharp knee, long low tail -->
  <path d="M70 95
           C 130 96, 200 100, 235 108
           C 268 116, 285 145, 300 185
           C 308 205, 318 240, 345 268
           C 380 290, 470 296, 560 298"
        fill="none" stroke="#1b2a3a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- knee dot (at cutoff crossing) -->
  <circle cx="300" cy="185" r="6" fill="#2a6f97" stroke="#fff" stroke-width="1.5"/>
  <text x="300" y="168" font-size="13" font-weight="bold" fill="#2a6f97" text-anchor="middle">knee</text>

  <!-- region labels -->
  <text x="145" y="150" font-size="13.5" font-weight="bold" fill="#6a994e" text-anchor="middle">real cells</text>
  <text x="145" y="168" font-size="13.5" font-weight="bold" fill="#6a994e" text-anchor="middle">(high counts)</text>

  <text x="450" y="255" font-size="13.5" font-weight="bold" fill="#bc4749" text-anchor="middle">empty droplets =</text>
  <text x="450" y="273" font-size="13.5" font-weight="bold" fill="#bc4749" text-anchor="middle">ambient background</text>
  <text x="450" y="291" font-size="12.5" fill="#bc4749" text-anchor="middle">(low counts)</text>

  <!-- ambient annotation near the tail -->
  <text x="360" y="330" font-size="11.5" fill="#1b2a3a" font-style="italic" text-anchor="middle">every droplet, even empty, captures a little ambient RNA</text>

  <!-- axis titles -->
  <text x="315" y="360" font-size="14" fill="#1b2a3a" text-anchor="middle">barcode rank (ordered by total counts, log scale) →</text>
  <text x="30" y="190" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 30 190)">total UMI counts (log scale) →</text>

  <!-- caption -->
  <text x="70" y="388" font-size="12" fill="#2a6f97">dedicated tools (e.g. EmptyDrops) model the ambient profile to rescue small real cells.</text>
</svg>
