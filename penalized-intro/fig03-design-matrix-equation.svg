<svg xmlns="http://www.w3.org/2000/svg" width="633.9" height="372.5" viewBox="29.4 -2.6 633.9 372.5" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">y &#8776; X &#946;  &#8212;  one matrix equation for all n samples</text>

  <!-- ================= y : outcome column vector (n long) ================= -->
  <!-- y and X share the same height n -->
  <g>
    <rect x="70" y="110" width="42" height="130" fill="#dcebf5" stroke="#2a6f97" stroke-width="2"/>
    <line x1="70" y1="142.5" x2="112" y2="142.5" stroke="#2a6f97" stroke-width="1"/>
    <line x1="70" y1="175"   x2="112" y2="175"   stroke="#2a6f97" stroke-width="1"/>
    <line x1="70" y1="207.5" x2="112" y2="207.5" stroke="#2a6f97" stroke-width="1"/>
    <text x="91" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a6f97">y</text>
    <!-- n marker on left edge -->
    <text x="55" y="180" text-anchor="middle" font-size="15" font-style="italic" fill="#2a6f97" transform="rotate(-90 55 180)">n</text>
  </g>

  <!-- approximately-equals -->
  <text x="132" y="182" text-anchor="middle" font-size="26" fill="#1b2a3a">&#8776;</text>

  <!-- ================= X : design matrix (n rows x p cols) ================= -->
  <g>
    <rect x="158" y="110" width="200" height="130" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <!-- p columns (vertical grid) -->
    <line x1="198" y1="110" x2="198" y2="240" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="238" y1="110" x2="238" y2="240" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="278" y1="110" x2="278" y2="240" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="318" y1="110" x2="318" y2="240" stroke="#c9d3dd" stroke-width="1"/>
    <!-- n rows (horizontal grid) -->
    <line x1="158" y1="142.5" x2="358" y2="142.5" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="158" y1="175"   x2="358" y2="175"   stroke="#c9d3dd" stroke-width="1"/>
    <line x1="158" y1="207.5" x2="358" y2="207.5" stroke="#c9d3dd" stroke-width="1"/>
    <text x="258" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">X</text>
    <!-- n marker down left edge -->
    <text x="145" y="180" text-anchor="middle" font-size="15" font-style="italic" fill="#1b2a3a" transform="rotate(-90 145 180)">n</text>
    <!-- p marker across top -->
    <line x1="158" y1="86" x2="358" y2="86" stroke="#1b2a3a" stroke-width="1"/>
    <line x1="158" y1="83" x2="158" y2="89" stroke="#1b2a3a" stroke-width="1"/>
    <line x1="358" y1="83" x2="358" y2="89" stroke="#1b2a3a" stroke-width="1"/>
    <text x="258" y="80" text-anchor="middle" font-size="15" font-style="italic" fill="#1b2a3a">p</text>
  </g>

  <!-- times dot -->
  <text x="378" y="182" text-anchor="middle" font-size="26" fill="#1b2a3a">&#183;</text>

  <!-- ================= beta : coefficients (p long, taller than y) ======== -->
  <!-- beta height matches X width p, so it is drawn clearly taller than y -->
  <g>
    <rect x="398" y="75" width="42" height="200" fill="#e2ecd9" stroke="#6a994e" stroke-width="2"/>
    <line x1="398" y1="115" x2="440" y2="115" stroke="#6a994e" stroke-width="1"/>
    <line x1="398" y1="155" x2="440" y2="155" stroke="#6a994e" stroke-width="1"/>
    <line x1="398" y1="195" x2="440" y2="195" stroke="#6a994e" stroke-width="1"/>
    <line x1="398" y1="235" x2="440" y2="235" stroke="#6a994e" stroke-width="1"/>
    <text x="419" y="65" text-anchor="middle" font-size="22" font-weight="bold" fill="#6a994e">&#946;</text>
    <!-- p marker on right edge, equals X width -->
    <text x="455" y="175" text-anchor="middle" font-size="15" font-style="italic" fill="#6a994e" transform="rotate(90 455 175)">p</text>
  </g>

  <!-- ================= Annotations ================= -->
  <text x="91"  y="315" text-anchor="middle" font-size="13" fill="#2a6f97">n long,</text>
  <text x="91"  y="332" text-anchor="middle" font-size="13" fill="#2a6f97">one outcome</text>
  <text x="91"  y="349" text-anchor="middle" font-size="13" fill="#2a6f97">per sample</text>

  <text x="258" y="315" text-anchor="middle" font-size="13" fill="#1b2a3a">design matrix,</text>
  <text x="258" y="332" text-anchor="middle" font-size="13" fill="#1b2a3a">n rows (samples)</text>
  <text x="258" y="349" text-anchor="middle" font-size="13" fill="#1b2a3a">&#215; p columns (predictors)</text>

  <text x="560" y="150" font-size="13" fill="#6a994e">p long,</text>
  <text x="560" y="167" font-size="13" fill="#6a994e">the coefficients</text>
  <text x="560" y="184" font-size="13" fill="#6a994e">to learn</text>
  <line x1="444" y1="175" x2="555" y2="175" stroke="#6a994e" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
