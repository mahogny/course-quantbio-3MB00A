<svg xmlns="http://www.w3.org/2000/svg" viewBox="54.8 32.7 597.9 377.4" font-family="Helvetica, Arial, sans-serif" width="597.9" height="377.4">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="85" y1="60" x2="85" y2="320" stroke="#c9d3dd" stroke-width="1.5" marker-start="url(#arrow)"/>
  <line x1="85" y1="320" x2="620" y2="320" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="325" font-size="15" fill="#1b2a3a">x</text>
  <text x="72" y="58" font-size="15" fill="#1b2a3a">y</text>

  <!-- smooth near straight fit (green): captures the biology -->
  <line x1="100" y1="286" x2="560" y2="168" stroke="#6a994e" stroke-width="2.5" fill="none"/>

  <!-- wiggly high degree fit (red): threads through every training dot -->
  <path d="M120,296
           C142,320 163,225 185,250
           C205,222 225,300 245,272
           C265,300 285,198 305,224
           C325,196 345,272 365,244
           C385,272 405,162 425,190
           C445,162 465,238 485,210
           C505,238 525,130 545,158"
        stroke="#bc4749" stroke-width="2" fill="none"/>

  <!-- training data (solid dark dots) -->
  <g fill="#1b2a3a">
    <circle cx="120" cy="296" r="5"/>
    <circle cx="185" cy="250" r="5"/>
    <circle cx="245" cy="272" r="5"/>
    <circle cx="305" cy="224" r="5"/>
    <circle cx="365" cy="244" r="5"/>
    <circle cx="425" cy="190" r="5"/>
    <circle cx="485" cy="210" r="5"/>
    <circle cx="545" cy="158" r="5"/>
  </g>

  <!-- gap connector showing new point is far from the wiggly curve -->
  <line x1="380" y1="213" x2="380" y2="247" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- new patient points (hollow blue circles) -->
  <g fill="#ffffff" stroke="#2a6f97" stroke-width="2">
    <circle cx="155" cy="271" r="5.5"/>
    <circle cx="260" cy="246" r="5.5"/>
    <circle cx="380" cy="213" r="5.5"/>
    <circle cx="505" cy="183" r="5.5"/>
  </g>

  <!-- callout -->
  <text x="356" y="60" font-size="13.5" fill="#1b2a3a">new points fall far from the wiggly curve</text>
  <text x="356" y="77" font-size="13.5" fill="#1b2a3a">→ it predicts badly</text>
  <path d="M452,84 C430,120 400,170 382,235" stroke="#1b2a3a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="92" y="54" width="252" height="96" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <circle cx="108" cy="72" r="5" fill="#1b2a3a"/>
  <text x="122" y="76" font-size="13" fill="#1b2a3a">training data (fit these 8 points)</text>
  <circle cx="108" cy="94" r="5.5" fill="#ffffff" stroke="#2a6f97" stroke-width="2"/>
  <text x="122" y="98" font-size="13" fill="#1b2a3a">new patients (test prediction)</text>
  <path d="M100,116 C104,110 112,122 116,116" stroke="#bc4749" stroke-width="2" fill="none"/>
  <text x="122" y="120" font-size="13" fill="#bc4749">perfect fit — memorises the noise</text>
  <line x1="100" y1="138" x2="116" y2="138" stroke="#6a994e" stroke-width="2.5"/>
  <text x="122" y="142" font-size="13" fill="#6a994e">smooth fit — captures the biology</text>

  <!-- caption -->
  <text x="350" y="390" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">Best fit to this data ≠ best predictor of the next patient</text>
</svg>
