<svg xmlns="http://www.w3.org/2000/svg" width="671.6" height="374.0" viewBox="38.0 4.0 671.6 374.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="374" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">The trade, made honest &#8212; &#955; as the bias&#8211;variance dial</text>

  <!-- ===== three zones (light shading) ===== -->
  <rect x="90"  y="60" width="160" height="240" fill="#f2f6fa"/>
  <rect x="250" y="60" width="180" height="240" fill="#edf5ea"/>
  <rect x="430" y="60" width="220" height="240" fill="#faf0f0"/>
  <line x1="250" y1="60" x2="250" y2="300" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="430" y1="60" x2="430" y2="300" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ===== axes ===== -->
  <!-- beta axis (vertical) -->
  <line x1="90" y1="300" x2="90" y2="56" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="80" y="70" text-anchor="end" font-size="16" font-style="italic" fill="#1b2a3a">&#946;</text>
  <text x="80" y="84" text-anchor="end" font-size="11" fill="#1b2a3a">coef.</text>
  <!-- beta = 0 baseline -->
  <line x1="90" y1="180" x2="656" y2="180" stroke="#1b2a3a" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="662" y="184" font-size="13" fill="#1b2a3a">&#946; = 0</text>
  <!-- lambda axis (horizontal) -->
  <line x1="86" y1="300" x2="662" y2="300" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="92" y="316" font-size="12" fill="#1b2a3a">&#955; = 0</text>
  <text x="640" y="316" text-anchor="end" font-size="12" fill="#1b2a3a">large</text>
  <text x="372" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2a3a">penalty strength &#955;  &#8594;</text>

  <!-- ===== coefficient shrinkage paths ===== -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="2.4" points="90.0,80.0 112.0,91.3 134.0,101.3 156.0,110.2 178.0,118.1 200.0,125.1 222.0,131.3 244.0,136.8 266.0,141.7 288.0,146.0 310.0,149.9 332.0,153.3 354.0,156.3 376.0,159.0 398.0,161.4 420.0,163.5 442.0,165.3 464.0,167.0 486.0,168.5 508.0,169.8 530.0,170.9 552.0,172.0 574.0,172.9 596.0,173.7 618.0,174.4 640.0,175.0"/>
  <polyline fill="none" stroke="#6a994e" stroke-width="2.4" points="90.0,125.0 112.0,131.2 134.0,136.7 156.0,141.6 178.0,146.0 200.0,149.8 222.0,153.2 244.0,156.3 266.0,158.9 288.0,161.3 310.0,163.4 332.0,165.3 354.0,167.0 376.0,168.4 398.0,169.7 420.0,170.9 442.0,171.9 464.0,172.8 486.0,173.7 508.0,174.4 530.0,175.0 552.0,175.6 574.0,176.1 596.0,176.5 618.0,176.9 640.0,177.3"/>
  <polyline fill="none" stroke="#6a4c93" stroke-width="2.4" points="90.0,155.0 112.0,157.8 134.0,160.3 156.0,162.6 178.0,164.5 200.0,166.3 222.0,167.8 244.0,169.2 266.0,170.4 288.0,171.5 310.0,172.5 332.0,173.3 354.0,174.1 376.0,174.7 398.0,175.3 420.0,175.9 442.0,176.3 464.0,176.7 486.0,177.1 508.0,177.4 530.0,177.7 552.0,178.0 574.0,178.2 596.0,178.4 618.0,178.6 640.0,178.8"/>
  <polyline fill="none" stroke="#e09f3e" stroke-width="2.4" points="90.0,225.0 112.0,219.9 134.0,215.4 156.0,211.4 178.0,207.8 200.0,204.7 222.0,201.9 244.0,199.4 266.0,197.2 288.0,195.3 310.0,193.6 332.0,192.0 354.0,190.7 376.0,189.5 398.0,188.4 420.0,187.4 442.0,186.6 464.0,185.9 486.0,185.2 508.0,184.6 530.0,184.1 552.0,183.6 574.0,183.2 596.0,182.8 618.0,182.5 640.0,182.2"/>
  <polyline fill="none" stroke="#bc4749" stroke-width="2.4" points="90.0,275.0 112.0,264.3 134.0,254.7 156.0,246.3 178.0,238.8 200.0,232.1 222.0,226.2 244.0,221.0 266.0,216.4 288.0,212.3 310.0,208.6 332.0,205.4 354.0,202.5 376.0,200.0 398.0,197.7 420.0,195.7 442.0,193.9 464.0,192.4 486.0,191.0 508.0,189.7 530.0,188.6 552.0,187.6 574.0,186.8 596.0,186.0 618.0,185.3 640.0,184.7"/>

  <!-- OLS start dots (far left, spread out) -->
  <circle cx="90" cy="80"  r="3.5" fill="#2a6f97"/>
  <circle cx="90" cy="125" r="3.5" fill="#6a994e"/>
  <circle cx="90" cy="155" r="3.5" fill="#6a4c93"/>
  <circle cx="90" cy="225" r="3.5" fill="#e09f3e"/>
  <circle cx="90" cy="275" r="3.5" fill="#bc4749"/>
  <text x="178" y="83" text-anchor="middle" font-size="11" fill="#1b2a3a" font-style="italic">OLS estimates (spread out)</text>

  <!-- ===== cross-validation marker (middle zone) ===== -->
  <line x1="340" y1="118" x2="340" y2="272" stroke="#1b2a3a" stroke-width="1.3" stroke-dasharray="5 3"/>
  <circle cx="340" cy="154" r="5.5" fill="#1b2a3a"/>
  <circle cx="340" cy="192" r="4"   fill="none" stroke="#1b2a3a" stroke-width="1.3"/>
  <text x="340" y="98"  text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2a3a">chosen by cross-validation</text>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="#1b2a3a">(later unit)</text>

  <!-- ===== zone labels ===== -->
  <!-- left zone -->
  <text x="170" y="70" text-anchor="middle" font-size="12.5" fill="#2a6f97" font-weight="bold">small &#955; &#8776; OLS</text>
  <text x="170" y="284" text-anchor="middle" font-size="11.5" fill="#1b2a3a">low bias, high variance</text>
  <text x="170" y="298" text-anchor="middle" font-size="11.5" fill="#bc4749" font-style="italic">(overfit)</text>

  <!-- middle zone -->
  <text x="340" y="284" text-anchor="middle" font-size="12.5" fill="#6a994e" font-weight="bold">sweet spot</text>
  <text x="340" y="298" text-anchor="middle" font-size="11.5" fill="#1b2a3a">minimises total error</text>

  <!-- right zone -->
  <text x="540" y="72" text-anchor="middle" font-size="12.5" fill="#bc4749" font-weight="bold">large &#955;: heavy shrinkage</text>
  <text x="540" y="90" text-anchor="middle" font-size="11.5" fill="#1b2a3a">high bias, low variance</text>
  <text x="540" y="106" text-anchor="middle" font-size="11.5" fill="#1b2a3a" font-style="italic">(underfit, &#946; &#8594; 0)</text>

  <!-- ===== bottom caption strip: the dial / slider ===== -->
  <g>
    <rect x="230" y="352" width="300" height="16" rx="8" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="238" y1="360" x2="522" y2="360" stroke="#2a6f97" stroke-width="1.4" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <circle cx="340" cy="360" r="8" fill="#2a6f97" stroke="#ffffff" stroke-width="1.5"/>
    <text x="210" y="365" text-anchor="end" font-size="15" font-style="italic" fill="#1b2a3a">&#955;</text>
    <text x="550" y="365" font-size="13" font-weight="bold" fill="#1b2a3a">the bias&#8211;variance dial</text>
  </g>
</svg>
