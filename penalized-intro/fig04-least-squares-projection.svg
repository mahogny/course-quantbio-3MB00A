<svg xmlns="http://www.w3.org/2000/svg" viewBox="72.2 14.6 651.3 405.9" font-family="Helvetica, Arial, sans-serif" width="651.3" height="405.9">
  <defs>
    <marker id="arrowY" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowFit" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowRes" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- column space plane (tilted parallelogram) -->
  <path d="M140,225 L600,198 L548,342 L92,372 Z" fill="#eaf1f7" stroke="#9fb3c4" stroke-width="1.8"/>
  <text x="150" y="243" font-size="14" fill="#2a6f97" font-weight="bold">column space of X</text>
  <text x="360" y="366" font-size="14.5" fill="#2a6f97" text-anchor="middle">everything the model can predict:  {X β}</text>

  <!-- residual: perpendicular out of the plane, tip of yhat up to tip of y -->
  <line x1="368" y1="278" x2="396" y2="150" stroke="#bc4749" stroke-width="2.6" marker-end="url(#arrowRes)"/>
  <!-- right-angle square where residual meets the plane -->
  <path d="M356.2,280.2 L358.8,268.5 L370.6,266.3" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>

  <!-- fitted vector yhat, lies in the plane -->
  <line x1="210" y1="308" x2="368" y2="278" stroke="#2a6f97" stroke-width="3.2" marker-end="url(#arrowFit)"/>

  <!-- observed data vector y, origin up out of the plane -->
  <line x1="210" y1="308" x2="396" y2="150" stroke="#1b2a3a" stroke-width="3.2" marker-end="url(#arrowY)"/>

  <!-- origin -->
  <circle cx="210" cy="308" r="4.5" fill="#1b2a3a"/>
  <text x="176" y="330" font-size="13" fill="#1b2a3a">origin</text>

  <!-- foot point (closest point) -->
  <circle cx="368" cy="278" r="4" fill="#2a6f97"/>

  <!-- labels for the three arrows -->
  <text x="404" y="152" font-size="15.5" fill="#1b2a3a" font-weight="bold">y</text>
  <text x="422" y="152" font-size="13" fill="#1b2a3a">observed data</text>

  <text x="238" y="266" font-size="15" fill="#2a6f97" font-weight="bold">ŷ = X β̂</text>
  <text x="238" y="283" font-size="12.5" fill="#2a6f97">fitted</text>

  <text x="412" y="222" font-size="15" fill="#bc4749" font-weight="bold">y − X β̂</text>
  <text x="412" y="240" font-size="12.5" fill="#bc4749">residual</text>

  <!-- side note box -->
  <rect x="452" y="34" width="252" height="50" rx="7" fill="#fbeaea" stroke="#bc4749" stroke-width="1.6"/>
  <text x="578" y="55" font-size="13.5" fill="#bc4749" text-anchor="middle" font-weight="bold">this works only if</text>
  <text x="578" y="73" font-size="13.5" fill="#bc4749" text-anchor="middle" font-weight="bold">X^T X is invertible</text>

  <!-- caption -->
  <text x="398" y="399" font-size="14" fill="#1b2a3a" text-anchor="middle">OLS picks β̂ so the residual is as short as possible  →  residual orthogonal to column space</text>
</svg>
