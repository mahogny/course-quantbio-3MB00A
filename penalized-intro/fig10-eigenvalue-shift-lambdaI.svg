<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.0 38.0 680.3 353.3" font-family="Helvetica, Arial, sans-serif" width="680.3" height="353.3">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowDim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- TOP ROW: XtX -->
  <text x="18" y="115" font-size="14" font-weight="bold" fill="#1b2a3a">X^T X</text>

  <!-- top axis -->
  <line x1="95" y1="110" x2="590" y2="110" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="114" font-size="13" fill="#1b2a3a">eigenvalues</text>
  <!-- zero tick -->
  <line x1="120" y1="104" x2="120" y2="116" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="116" y="132" font-size="13" fill="#1b2a3a">0</text>

  <!-- top eigenvalue dots (positive ones) -->
  <circle cx="205" cy="110" r="6" fill="#2a6f97"/>
  <circle cx="285" cy="110" r="6" fill="#2a6f97"/>
  <circle cx="395" cy="110" r="6" fill="#2a6f97"/>
  <circle cx="500" cy="110" r="6" fill="#2a6f97"/>
  <!-- the zero / near-zero eigenvalue in warning red -->
  <circle cx="120" cy="110" r="7.5" fill="#bc4749" stroke="#8a2f31" stroke-width="1.5"/>

  <text x="120" y="66" font-size="12.5" fill="#bc4749" text-anchor="middle">zero / near-zero eigenvalue</text>
  <text x="120" y="84" font-size="11.5" fill="#bc4749" text-anchor="middle">singular =&gt; no inverse (p &gt; n)</text>

  <!-- shift arrows: each top dot down-right to its bottom shifted dot (equal length λ) -->
  <g stroke="#2a6f97" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85">
    <line x1="120" y1="122" x2="158" y2="238"/>
    <line x1="205" y1="122" x2="243" y2="238"/>
    <line x1="285" y1="122" x2="323" y2="238"/>
    <line x1="395" y1="122" x2="433" y2="238"/>
    <line x1="500" y1="122" x2="538" y2="238"/>
  </g>

  <!-- BOTTOM ROW: XtX + lambda I -->
  <text x="18" y="255" font-size="14" font-weight="bold" fill="#1b2a3a">X^T X + λI</text>

  <!-- bottom axis -->
  <line x1="95" y1="250" x2="590" y2="250" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="596" y="254" font-size="13" fill="#1b2a3a">eigenvalues</text>
  <line x1="120" y1="244" x2="120" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="116" y="272" font-size="13" fill="#1b2a3a">0</text>

  <!-- shifted dots, all positive, green tint -->
  <circle cx="163" cy="250" r="7" fill="#6a994e" stroke="#4c7238" stroke-width="1.2"/>
  <circle cx="245" cy="250" r="6" fill="#6a994e"/>
  <circle cx="325" cy="250" r="6" fill="#6a994e"/>
  <circle cx="435" cy="250" r="6" fill="#6a994e"/>
  <circle cx="540" cy="250" r="6" fill="#6a994e"/>

  <!-- lambda shift bracket on the first (formerly zero) dot -->
  <line x1="120" y1="290" x2="163" y2="290" stroke="#1b2a3a" stroke-width="1.4" marker-end="url(#arrowDim)"/>
  <line x1="120" y1="284" x2="120" y2="296" stroke="#1b2a3a" stroke-width="1.2"/>
  <line x1="163" y1="284" x2="163" y2="296" stroke="#1b2a3a" stroke-width="1.2"/>
  <text x="141" y="310" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">λ</text>

  <text x="345" y="292" font-size="12.5" fill="#4c7238" text-anchor="middle">every eigenvalue lifted by λ &gt; 0</text>
  <text x="345" y="310" font-size="12.5" fill="#4c7238" text-anchor="middle">all positive =&gt; always invertible</text>

  <!-- caption -->
  <text x="330" y="352" font-size="12.5" fill="#1b2a3a" text-anchor="middle">Adding λ to the diagonal shifts the whole spectrum up — the</text>
  <text x="330" y="370" font-size="12.5" fill="#1b2a3a" text-anchor="middle">unidentifiable problem becomes solvable, even when p &gt; n</text>
</svg>
