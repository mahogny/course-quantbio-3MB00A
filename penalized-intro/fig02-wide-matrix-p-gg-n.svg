<svg xmlns="http://www.w3.org/2000/svg" width="679.9" height="379.3" viewBox="10.8 -3.0 679.9 379.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <pattern id="denseV" patternUnits="userSpaceOnUse" width="5" height="10">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2a6f97" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <pattern id="denseH" patternUnits="userSpaceOnUse" width="10" height="5">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#1b2a3a" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- header -->
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a3a">The defining shape of omics data</text>

  <!-- ================= LEFT: wide, short matrix X (omics) ================= -->
  <!-- width annotation p (above) -->
  <path d="M60,104 L60,111 M410,104 L410,111 M60,111 L410,111" stroke="#2a6f97" stroke-width="1.5" fill="none"/>
  <text x="235" y="98" text-anchor="middle" font-size="14" fill="#2a6f97" font-weight="bold">p = 20,000 genes (columns)</text>

  <!-- the wide matrix -->
  <rect x="60" y="120" width="350" height="70" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <rect x="60" y="120" width="350" height="70" fill="url(#denseV)"/>
  <!-- a handful of row gridlines -->
  <line x1="60" y1="131.7" x2="410" y2="131.7" stroke="#2a6f97" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="143.3" x2="410" y2="143.3" stroke="#2a6f97" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="155.0" x2="410" y2="155.0" stroke="#2a6f97" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="166.7" x2="410" y2="166.7" stroke="#2a6f97" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="178.3" x2="410" y2="178.3" stroke="#2a6f97" stroke-width="0.8" opacity="0.5"/>
  <text x="235" y="161" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b2a3a" font-style="italic">X</text>

  <!-- height annotation n (left) -->
  <path d="M46,120 L53,120 M46,190 L53,190 M46,120 L46,190" stroke="#1b2a3a" stroke-width="1.5" fill="none"/>
  <text x="40" y="155" text-anchor="middle" font-size="14" fill="#1b2a3a" transform="rotate(-90 40 155)">n = 30 patients (rows)</text>

  <!-- caption -->
  <text x="235" y="222" text-anchor="middle" font-size="24" font-weight="bold" fill="#bc4749">p &#187; n</text>
  <text x="235" y="243" text-anchor="middle" font-size="13" fill="#1b2a3a" opacity="0.7">the omics data matrix</text>

  <!-- ================= RIGHT: tall, narrow matrix (classical) ================= -->
  <!-- width annotation (above) -->
  <path d="M580,104 L580,111 M640,104 L640,111 M580,111 L640,111" stroke="#1b2a3a" stroke-width="1.5" fill="none"/>
  <text x="610" y="98" text-anchor="middle" font-size="13" fill="#1b2a3a">few predictors</text>

  <!-- the tall matrix -->
  <rect x="580" y="118" width="60" height="185" fill="#f0f3f6" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="580" y="118" width="60" height="185" fill="url(#denseH)"/>
  <!-- a few predictor column lines -->
  <line x1="600" y1="118" x2="600" y2="303" stroke="#1b2a3a" stroke-width="0.8" opacity="0.45"/>
  <line x1="620" y1="118" x2="620" y2="303" stroke="#1b2a3a" stroke-width="0.8" opacity="0.45"/>

  <!-- height annotation (right) -->
  <path d="M647,118 L654,118 M647,303 L654,303 M654,118 L654,303" stroke="#1b2a3a" stroke-width="1.5" fill="none"/>
  <text x="662" y="210" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(90 662 210)">n = many samples</text>

  <!-- caption -->
  <text x="610" y="333" text-anchor="middle" font-size="22" font-weight="bold" fill="#6a994e">n &#62; p</text>
  <text x="610" y="354" text-anchor="middle" font-size="13" fill="#1b2a3a" opacity="0.7">classical regression</text>

  <!-- contrast connector -->
  <text x="497" y="185" text-anchor="middle" font-size="26" fill="#1b2a3a" opacity="0.4">vs</text>
</svg>
