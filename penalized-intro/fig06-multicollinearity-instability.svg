<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <text x="330" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Multicollinearity: near-singular X^T X =&gt; unstable β</text>

  <!-- TOP PANEL: near parallel vectors -->
  <g>
    <text x="24" y="52" font-size="14" fill="#1b2a3a" font-weight="bold">correlated genes: x1 ≈ x2 (co-regulated)</text>

    <!-- origin -->
    <line x1="50" y1="180" x2="300" y2="180" stroke="#c9d3dd" stroke-width="1.5"/>
    <line x1="50" y1="180" x2="50" y2="70" stroke="#c9d3dd" stroke-width="1.5"/>

    <!-- shaded near-line span -->
    <path d="M50,180 L285,90 L282,100 Z" fill="#eaf1f7"/>

    <!-- two near-parallel arrows (accent blue) -->
    <line x1="50" y1="180" x2="285" y2="90" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#ahb)"/>
    <line x1="50" y1="180" x2="282" y2="100" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#ahb)"/>
    <text x="292" y="86" font-size="15" fill="#2a6f97" font-weight="bold">x1</text>
    <text x="290" y="112" font-size="15" fill="#2a6f97" font-weight="bold">x2</text>

    <!-- tiny angle marker -->
    <path d="M108,153 A 62 62 0 0 1 112 150" fill="none" stroke="#1b2a3a" stroke-width="1.2"/>
    <text x="120" y="150" font-size="12" fill="#1b2a3a">θ ≈ 0</text>

    <text x="330" y="95" font-size="14" fill="#1b2a3a">the span is nearly a single line</text>
    <text x="330" y="115" font-size="14" fill="#bc4749" font-weight="bold">=&gt; X^T X nearly singular</text>
  </g>

  <line x1="24" y1="205" x2="636" y2="205" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- BOTTOM PANEL: eigenvalue axis -->
  <g>
    <text x="24" y="232" font-size="14" fill="#1b2a3a" font-weight="bold">eigenvalues of X^T X</text>

    <!-- axis -->
    <line x1="50" y1="290" x2="360" y2="290" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#ah)"/>
    <text x="365" y="294" font-size="13" fill="#1b2a3a">λ</text>
    <line x1="60" y1="286" x2="60" y2="294" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="57" y="308" font-size="12" fill="#1b2a3a">0</text>

    <!-- healthy eigenvalues -->
    <circle cx="150" cy="290" r="7" fill="#6a994e"/>
    <circle cx="215" cy="290" r="7" fill="#6a994e"/>
    <circle cx="285" cy="290" r="7" fill="#6a994e"/>

    <!-- near-zero eigenvalue (warning) -->
    <circle cx="72" cy="290" r="8" fill="#bc4749"/>
    <text x="72" y="266" text-anchor="middle" font-size="13" fill="#bc4749" font-weight="bold">λ_min ≈ 0</text>

    <text x="50" y="336" font-size="13" fill="#bc4749">inverse scales like 1/λ_min → blows up</text>

    <!-- RIGHT: two canceling solutions -->
    <rect x="405" y="238" width="240" height="118" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="420" y="262" font-size="14" fill="#1b2a3a">two fits, both minimize loss:</text>
    <text x="420" y="288" font-size="15" fill="#2a6f97" font-weight="bold">(β1, β2) = (+180, −178)</text>
    <text x="420" y="312" font-size="15" fill="#bc4749" font-weight="bold">(β1, β2) = (−150, +152)</text>
    <text x="420" y="336" font-size="12" fill="#1b2a3a">huge values that cancel;</text>
    <text x="420" y="352" font-size="12" fill="#1b2a3a">refit on new samples =&gt; they lurch</text>
  </g>

  <!-- slide caption -->
  <text x="330" y="395" text-anchor="middle" font-size="14" font-style="italic" fill="#1b2a3a">Even when it inverts, it can be bad</text>
</svg>
