<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 6 754 322" width="754" height="322" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ah-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#6a994e"/>
    </marker>
    <marker id="ah-red" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#bc4749"/>
    </marker>
    <marker id="ah-axis" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!--
    World->screen:  sx = 70 + (x+4)*57 ; sy = 175 - y*38.75
    origin(0,0)->(298,175)  v(3,2)->(469,97.5)  2v(6,4)->(640,20)  -1v(-3,-2)->(127,252.5)
  -->

  <!-- Grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical gridlines x = -4..6 -->
    <line x1="70"  y1="20" x2="70"  y2="291.25"/>
    <line x1="127" y1="20" x2="127" y2="291.25"/>
    <line x1="184" y1="20" x2="184" y2="291.25"/>
    <line x1="241" y1="20" x2="241" y2="291.25"/>
    <line x1="355" y1="20" x2="355" y2="291.25"/>
    <line x1="412" y1="20" x2="412" y2="291.25"/>
    <line x1="469" y1="20" x2="469" y2="291.25"/>
    <line x1="526" y1="20" x2="526" y2="291.25"/>
    <line x1="583" y1="20" x2="583" y2="291.25"/>
    <line x1="640" y1="20" x2="640" y2="291.25"/>
    <!-- horizontal gridlines y = -3..4 -->
    <line x1="70" y1="291.25" x2="640" y2="291.25"/>
    <line x1="70" y1="252.5" x2="640" y2="252.5"/>
    <line x1="70" y1="213.75" x2="640" y2="213.75"/>
    <line x1="70" y1="136.25" x2="640" y2="136.25"/>
    <line x1="70" y1="97.5"  x2="640" y2="97.5"/>
    <line x1="70" y1="58.75" x2="640" y2="58.75"/>
    <line x1="70" y1="20"    x2="640" y2="20"/>
  </g>

  <!-- Shared direction line (faint dashed), dir (3,2) through origin -->
  <!-- t=-1.15 .. t=2.2 along (171,-77.5) from origin -->
  <line x1="101.4" y1="264.1" x2="674.2" y2="4.5" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.35"/>

  <!-- Axes -->
  <g stroke="#1b2a3a" stroke-width="1.8">
    <line x1="70" y1="175" x2="700" y2="175" marker-end="url(#ah-axis)"/>
    <line x1="298" y1="300" x2="298" y2="12" marker-end="url(#ah-axis)"/>
  </g>

  <!-- axis tick numbers -->
  <g fill="#1b2a3a" font-size="11" text-anchor="middle">
    <text x="127" y="190">-3</text>
    <text x="184" y="190">-2</text>
    <text x="241" y="190">-1</text>
    <text x="355" y="190">1</text>
    <text x="412" y="190">2</text>
    <text x="469" y="190">3</text>
    <text x="526" y="190">4</text>
    <text x="583" y="190">5</text>
    <text x="640" y="190">6</text>
    <text x="710" y="179">x</text>
  </g>
  <g fill="#1b2a3a" font-size="11" text-anchor="end">
    <text x="291" y="295">-3</text>
    <text x="291" y="256.5">-2</text>
    <text x="291" y="217.75">-1</text>
    <text x="291" y="140.25">1</text>
    <text x="291" y="101.5">2</text>
    <text x="291" y="62.75">3</text>
    <text x="291" y="24">4</text>
    <text x="308" y="20">y</text>
  </g>

  <!-- tick dashes -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="127" y1="172" x2="127" y2="178"/>
    <line x1="184" y1="172" x2="184" y2="178"/>
    <line x1="241" y1="172" x2="241" y2="178"/>
    <line x1="355" y1="172" x2="355" y2="178"/>
    <line x1="412" y1="172" x2="412" y2="178"/>
    <line x1="469" y1="172" x2="469" y2="178"/>
    <line x1="526" y1="172" x2="526" y2="178"/>
    <line x1="583" y1="172" x2="583" y2="178"/>
    <line x1="640" y1="172" x2="640" y2="178"/>
    <line x1="295" y1="291.25" x2="301" y2="291.25"/>
    <line x1="295" y1="252.5"  x2="301" y2="252.5"/>
    <line x1="295" y1="213.75" x2="301" y2="213.75"/>
    <line x1="295" y1="136.25" x2="301" y2="136.25"/>
    <line x1="295" y1="97.5"   x2="301" y2="97.5"/>
    <line x1="295" y1="58.75"  x2="301" y2="58.75"/>
  </g>

  <!-- Arrow 2 (longest, drawn first): 2v = (6,4) -->
  <line x1="298" y1="175" x2="640" y2="20" stroke="#6a994e" stroke-width="3.5" marker-end="url(#ah-green)"/>
  <!-- Arrow 1 (medium): v = (3,2) -->
  <line x1="298" y1="175" x2="469" y2="97.5" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ah-blue)"/>
  <!-- Arrow 3 (opposite): -1v = (-3,-2) -->
  <line x1="298" y1="175" x2="127" y2="252.5" stroke="#bc4749" stroke-width="3.5" marker-end="url(#ah-red)"/>

  <!-- Origin dot -->
  <circle cx="298" cy="175" r="3.5" fill="#1b2a3a"/>

  <!-- Labels -->
  <text x="452" y="35" font-size="14" fill="#6a994e" font-weight="bold">2v = (6,4) — stretched</text>
  <text x="360" y="88" font-size="14" fill="#2a6f97" font-weight="bold">v = (3,2)</text>
  <text x="10" y="277" font-size="14" fill="#bc4749" font-weight="bold">−1·v = (−3,−2) — flipped</text>

  <!-- caption -->
  <text x="355" y="318" font-size="13" fill="#1b2a3a" text-anchor="middle">Scaling keeps ONE direction line — only length and sign change</text>
</svg>
