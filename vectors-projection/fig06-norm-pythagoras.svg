<svg xmlns="http://www.w3.org/2000/svg" viewBox="42.4 32.3 470 298.1" width="470" height="298.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="70" y1="255" x2="295" y2="255"/>
    <line x1="70" y1="210" x2="295" y2="210"/>
    <line x1="70" y1="165" x2="295" y2="165"/>
    <line x1="70" y1="120" x2="295" y2="120"/>
    <line x1="70" y1="75"  x2="295" y2="75"/>
    <line x1="115" y1="75" x2="115" y2="300"/>
    <line x1="160" y1="75" x2="160" y2="300"/>
    <line x1="205" y1="75" x2="205" y2="300"/>
    <line x1="250" y1="75" x2="250" y2="300"/>
    <line x1="295" y1="75" x2="295" y2="300"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="1.8">
    <line x1="70" y1="300" x2="320" y2="300" marker-end="url(#arrow)"/>
    <line x1="70" y1="300" x2="70"  y2="55"  marker-end="url(#arrow)"/>
  </g>
  <text x="326" y="305" font-size="14" fill="#1b2a3a">x</text>
  <text x="60"  y="52"  font-size="14" fill="#1b2a3a">y</text>

  <!-- ticks x -->
  <g font-size="13" fill="#1b2a3a" text-anchor="middle">
    <text x="115" y="318">1</text>
    <text x="160" y="318">2</text>
    <text x="205" y="318">3</text>
    <text x="250" y="318">4</text>
    <text x="295" y="318">5</text>
    <text x="62"  y="305" text-anchor="end">0</text>
  </g>
  <!-- ticks y -->
  <g font-size="13" fill="#1b2a3a" text-anchor="end">
    <text x="62" y="260">1</text>
    <text x="62" y="215">2</text>
    <text x="62" y="170">3</text>
    <text x="62" y="125">4</text>
    <text x="62" y="80">5</text>
  </g>

  <!-- triangle fill -->
  <polygon points="70,300 205,300 205,120" fill="#eaf1f7" stroke="none"/>

  <!-- legs -->
  <line x1="70" y1="300" x2="205" y2="300" stroke="#6a994e" stroke-width="2.5"/>
  <line x1="205" y1="300" x2="205" y2="120" stroke="#bc4749" stroke-width="2.5"/>

  <!-- right angle square at (3,0) -->
  <path d="M186,300 L186,281 L205,281" fill="none" stroke="#1b2a3a" stroke-width="1.4"/>

  <!-- hypotenuse (vector arrow) -->
  <line x1="70" y1="300" x2="205" y2="120" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#arrow)"/>

  <!-- point (3,4) -->
  <circle cx="205" cy="120" r="4.5" fill="#1b2a3a"/>
  <text x="214" y="115" font-size="13" fill="#1b2a3a">(3, 4)</text>

  <!-- leg labels -->
  <text x="137" y="292" font-size="16" fill="#6a994e" font-weight="bold" text-anchor="middle">3</text>
  <text x="215" y="215" font-size="16" fill="#bc4749" font-weight="bold">4</text>

  <!-- vector norm label -->
  <text x="118" y="198" font-size="17" fill="#2a6f97" font-weight="bold" transform="rotate(-53 118 198)">||v|| = 5</text>

  <!-- equation caption -->
  <text x="352" y="185" font-size="20" fill="#1b2a3a">5 = √(3^2 + 4^2)</text>
  <text x="360" y="220" font-size="20" fill="#1b2a3a">= √(9 + 16)</text>
  <text x="360" y="255" font-size="20" fill="#1b2a3a">= √25</text>
</svg>
