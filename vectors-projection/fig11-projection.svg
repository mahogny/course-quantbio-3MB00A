<svg xmlns="http://www.w3.org/2000/svg" viewBox="44.1 43.5 327.3 327.3" width="327.3" height="327.3" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6a994e"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- Geometry: origin at (70,320), 60 px per unit -->
  <!-- x: px = 70 + 60*ux ; y: py = 320 - 60*uy -->

  <!-- Grid lines -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="130" y1="60" x2="130" y2="320"/>
    <line x1="190" y1="60" x2="190" y2="320"/>
    <line x1="250" y1="60" x2="250" y2="320"/>
    <line x1="310" y1="60" x2="310" y2="320"/>
    <line x1="70" y1="260" x2="330" y2="260"/>
    <line x1="70" y1="200" x2="330" y2="200"/>
    <line x1="70" y1="140" x2="330" y2="140"/>
    <line x1="70" y1="80"  x2="330" y2="80"/>
  </g>

  <!-- Axes -->
  <g stroke="#1b2a3a" stroke-width="2" fill="none">
    <line x1="70" y1="320" x2="360" y2="320" marker-end="url(#arrow)"/>
    <line x1="70" y1="320" x2="70" y2="55" marker-end="url(#arrow)"/>
  </g>

  <!-- Ticks + labels on x -->
  <g stroke="#1b2a3a" stroke-width="1.5" fill="#1b2a3a" font-size="13" text-anchor="middle">
    <line x1="130" y1="320" x2="130" y2="325"/>
    <line x1="190" y1="320" x2="190" y2="325"/>
    <line x1="250" y1="320" x2="250" y2="325"/>
    <line x1="310" y1="320" x2="310" y2="325"/>
    <text x="130" y="338">1</text>
    <text x="190" y="338">2</text>
    <text x="250" y="338">3</text>
    <text x="310" y="338">4</text>
  </g>
  <!-- Ticks + labels on y -->
  <g stroke="#1b2a3a" stroke-width="1.5" fill="#1b2a3a" font-size="13" text-anchor="end">
    <line x1="65" y1="260" x2="70" y2="260"/>
    <line x1="65" y1="200" x2="70" y2="200"/>
    <line x1="65" y1="140" x2="70" y2="140"/>
    <line x1="65" y1="80"  x2="70" y2="80"/>
    <text x="61" y="264">1</text>
    <text x="61" y="204">2</text>
    <text x="61" y="144">3</text>
    <text x="61" y="84">4</text>
  </g>

  <!-- Vertical dashed 'light ray' from head of u (250,140) down to (250,320) -->
  <line x1="250" y1="140" x2="250" y2="320" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65"/>
  <text x="262" y="120" font-size="13" fill="#1b2a3a" opacity="0.8">light ray</text>

  <!-- Vector v along x-axis: origin to (4,0) => (70,320) to (310,320) -->
  <line x1="70" y1="320" x2="304" y2="320" stroke="#2a6f97" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="330" y="313" font-size="16" fill="#2a6f97" font-weight="bold">v</text>

  <!-- Projection (shadow) origin to (3,0) => (70,320) to (250,320), bold on x-axis -->
  <line x1="70" y1="320" x2="244" y2="320" stroke="#6a994e" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <text x="150" y="358" font-size="15" fill="#6a994e" font-weight="bold" text-anchor="middle">proj = (3,0)</text>

  <!-- Vector u: origin to (3,3) => (70,320) to (250,140) -->
  <line x1="70" y1="320" x2="246" y2="144" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="108" y="178" font-size="16" fill="#1b2a3a" font-weight="bold">u = (3,3)</text>

  <!-- Residual / leftover vector from (3,0) up to (3,3) => (250,320) to (250,140) -->
  <line x1="250" y1="320" x2="250" y2="146" stroke="#bc4749" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="262" y="215" font-size="15" fill="#bc4749" font-weight="bold">u − proj</text>
  <text x="262" y="234" font-size="12.5" fill="#bc4749">(orthogonal to v)</text>

  <!-- Right-angle square at (3,0) = (250,320) -->
  <path d="M250,304 L266,304 L266,320" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- Origin dot -->
  <circle cx="70" cy="320" r="3" fill="#1b2a3a"/>
</svg>
