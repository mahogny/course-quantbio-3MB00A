<svg xmlns="http://www.w3.org/2000/svg" viewBox="43.9 47.1 372.6 313.4" width="372.6" height="313.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="vArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a6f97"/>
    </marker>
    <marker id="axArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- Gridlines (unit = 60px, origin at 70,330) -->
  <g stroke="#c9d3dd" stroke-width="1">
    <!-- vertical grid at x=1..4 -->
    <line x1="130" y1="330" x2="130" y2="90"/>
    <line x1="190" y1="330" x2="190" y2="90"/>
    <line x1="250" y1="330" x2="250" y2="90"/>
    <line x1="310" y1="330" x2="310" y2="90"/>
    <!-- horizontal grid at y=1..4 -->
    <line x1="70" y1="270" x2="370" y2="270"/>
    <line x1="70" y1="210" x2="370" y2="210"/>
    <line x1="70" y1="150" x2="370" y2="150"/>
    <line x1="70" y1="90"  x2="370" y2="90"/>
  </g>

  <!-- Axes -->
  <g stroke="#1b2a3a" stroke-width="1.8">
    <line x1="70" y1="330" x2="390" y2="330" marker-end="url(#axArrow)"/>
    <line x1="70" y1="330" x2="70"  y2="70"  marker-end="url(#axArrow)"/>
  </g>
  <text x="398" y="335" font-size="16" fill="#1b2a3a">x</text>
  <text x="60"  y="66"  font-size="16" fill="#1b2a3a">y</text>

  <!-- Tick labels -->
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <text x="130" y="350">1</text>
    <text x="190" y="350">2</text>
    <text x="250" y="350">3</text>
    <text x="310" y="350">4</text>
  </g>
  <g font-size="14" fill="#1b2a3a" text-anchor="end">
    <text x="62" y="275">1</text>
    <text x="62" y="215">2</text>
    <text x="62" y="155">3</text>
    <text x="62" y="95">4</text>
  </g>
  <text x="62" y="348" font-size="14" fill="#1b2a3a" text-anchor="end">0</text>

  <!-- Staircase: 3 right, then 2 up -->
  <g stroke="#bc4749" stroke-width="1.8" stroke-dasharray="6 4" fill="none">
    <line x1="70" y1="330" x2="250" y2="330"/>
    <line x1="250" y1="330" x2="250" y2="210"/>
  </g>
  <text x="160" y="323" font-size="14" fill="#bc4749" text-anchor="middle">3 right</text>
  <text x="258" y="275" font-size="14" fill="#bc4749" text-anchor="start">2 up</text>

  <!-- Right-angle marker at (3,0) -->
  <path d="M250,318 L238,318 L238,330" stroke="#c9d3dd" stroke-width="1.2" fill="none"/>

  <!-- Vector arrow origin -> (3,2) -->
  <line x1="70" y1="330" x2="250" y2="210" stroke="#2a6f97" stroke-width="3" marker-end="url(#vArrow)"/>

  <!-- Point (3,2) -->
  <circle cx="250" cy="210" r="4.5" fill="#1b2a3a"/>
  <text x="262" y="205" font-size="14" fill="#1b2a3a">(3, 2)</text>

  <!-- Vector label -->
  <text x="120" y="255" font-size="17" fill="#2a6f97" font-style="italic" transform="rotate(-33.7 120 255)">v = (3, 2)</text>
</svg>
