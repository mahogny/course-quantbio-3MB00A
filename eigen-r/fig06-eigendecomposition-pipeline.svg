<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.8 -0.2 728.2 278.2" width="728.2" height="278.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0L7,3L0,6Z" fill="#1b2a3a"/>
    </marker>
    <path id="grid" d="M-64,-64V64 M-48,-64V64 M-32,-64V64 M-16,-64V64 M0,-64V64 M16,-64V64 M32,-64V64 M48,-64V64 M64,-64V64 M-64,-64H64 M-64,-48H64 M-64,-32H64 M-64,-16H64 M-64,0H64 M-64,16H64 M-64,32H64 M-64,48H64 M-64,64H64"/>
    <clipPath id="p1"><rect x="15" y="40" width="130" height="130"/></clipPath>
    <clipPath id="p2"><rect x="200" y="40" width="130" height="130"/></clipPath>
    <clipPath id="p3"><rect x="385" y="40" width="130" height="130"/></clipPath>
    <clipPath id="p4"><rect x="570" y="40" width="130" height="130"/></clipPath>
  </defs>

  <!-- panel captions -->
  <text x="80"  y="30" font-size="13" fill="#1b2a3a" text-anchor="middle">input · unit grid</text>
  <text x="265" y="30" font-size="13" fill="#1b2a3a" text-anchor="middle">eigen-coordinates</text>
  <text x="450" y="30" font-size="13" fill="#1b2a3a" text-anchor="middle">scaled</text>
  <text x="635" y="30" font-size="13" fill="#1b2a3a" text-anchor="middle">output = A applied</text>

  <!-- panel borders -->
  <rect x="15"  y="40" width="130" height="130" rx="3" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="200" y="40" width="130" height="130" rx="3" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="385" y="40" width="130" height="130" rx="3" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="570" y="40" width="130" height="130" rx="3" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- Panel 1: input, unit grid + blue circle -->
  <g clip-path="url(#p1)">
    <g transform="translate(80,105)">
      <use href="#grid" stroke="#c9d3dd" stroke-width="1" fill="none"/>
      <line x1="-62" y1="0" x2="62" y2="0" stroke="#1b2a3a" stroke-width="1.3"/>
      <line x1="0" y1="-62" x2="0" y2="62" stroke="#1b2a3a" stroke-width="1.3"/>
      <circle r="18" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
      <circle r="2.6" fill="#2a6f97"/>
      <circle cx="-7" cy="-4" r="2" fill="#2a6f97"/>
      <circle cx="6" cy="6" r="2" fill="#2a6f97"/>
      <circle cx="-5" cy="7" r="2" fill="#2a6f97"/>
    </g>
  </g>

  <!-- Panel 2: eigen coordinates, grid rotated 45, circle unchanged -->
  <g clip-path="url(#p2)">
    <g transform="translate(265,105) rotate(45)">
      <use href="#grid" stroke="#c9d3dd" stroke-width="1" fill="none"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#bc4749" stroke-width="2"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#6a994e" stroke-width="2"/>
      <circle r="18" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    </g>
  </g>

  <!-- Panel 3: scaled, grid stretched x3 along eigen axis1, ellipse -->
  <g clip-path="url(#p3)">
    <g transform="translate(450,105) rotate(45)">
      <g transform="scale(3,1)">
        <use href="#grid" stroke="#c9d3dd" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/>
      </g>
      <line x1="-58" y1="0" x2="58" y2="0" stroke="#bc4749" stroke-width="2"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#6a994e" stroke-width="2"/>
      <ellipse rx="54" ry="18" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
    </g>
  </g>

  <!-- Panel 4: output, standard grid, ellipse tilted along (1,1) -->
  <g clip-path="url(#p4)">
    <g transform="translate(635,105)">
      <use href="#grid" stroke="#c9d3dd" stroke-width="1" fill="none"/>
      <line x1="-62" y1="0" x2="62" y2="0" stroke="#1b2a3a" stroke-width="1.3"/>
      <line x1="0" y1="-62" x2="0" y2="62" stroke="#1b2a3a" stroke-width="1.3"/>
      <line x1="-52" y1="-52" x2="52" y2="52" stroke="#bc4749" stroke-width="1.4" stroke-dasharray="4 3"/>
      <g transform="rotate(45)">
        <ellipse rx="54" ry="18" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- arrows between panels -->
  <line x1="150" y1="105" x2="196" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="162" y="95"  font-size="16" font-weight="bold" fill="#2a6f97" text-anchor="start">V<tspan font-size="11" dy="-6">-1</tspan></text>
  <text x="173" y="120" font-size="9"  fill="#33414d" text-anchor="middle">to eigen-basis</text>

  <line x1="335" y1="105" x2="381" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="358" y="95"  font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">Λ</text>
  <text x="358" y="120" font-size="9"  fill="#33414d" text-anchor="middle">scale ×3, ×1</text>

  <line x1="520" y1="105" x2="566" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="543" y="95"  font-size="16" font-weight="bold" fill="#2a6f97" text-anchor="middle">V</text>
  <text x="543" y="120" font-size="9"  fill="#33414d" text-anchor="middle">rotate back</text>

  <!-- formula -->
  <text x="250" y="213" font-size="28" fill="#1b2a3a" text-anchor="middle">A =</text>
  <text x="320" y="213" font-size="28" font-weight="bold" fill="#2a6f97" text-anchor="middle">V</text>
  <text x="400" y="213" font-size="28" font-weight="bold" fill="#bc4749" text-anchor="middle">Λ</text>
  <text x="462" y="213" font-size="28" font-weight="bold" fill="#2a6f97" text-anchor="start">V<tspan font-size="18" dy="-10">-1</tspan></text>

  <path d="M306,224 Q320,234 334,224" fill="none" stroke="#1b2a3a" stroke-width="1.2"/>
  <path d="M382,224 Q400,234 418,224" fill="none" stroke="#1b2a3a" stroke-width="1.2"/>
  <path d="M458,224 Q480,234 502,224" fill="none" stroke="#1b2a3a" stroke-width="1.2"/>

  <text x="320" y="245" font-size="11" fill="#33414d" text-anchor="middle">rotate</text>
  <text x="320" y="257" font-size="11" fill="#33414d" text-anchor="middle">back</text>

  <text x="400" y="245" font-size="11" fill="#33414d" text-anchor="middle">diagonal scaling</text>
  <text x="400" y="257" font-size="11" fill="#33414d" text-anchor="middle">Λ = diag(3, 1)</text>

  <text x="480" y="245" font-size="11" fill="#33414d" text-anchor="middle">rotate into</text>
  <text x="480" y="257" font-size="11" fill="#33414d" text-anchor="middle">eigen-basis</text>
</svg>
