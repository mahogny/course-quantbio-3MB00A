<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.5 55.7 662.9 353.5" width="662.9" height="353.5" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahc" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#6b7a89"/>
    </marker>
  </defs>

  <!-- ===================== MATRIX (left) ===================== -->
  <g transform="translate(40,150)">
    <text x="90" y="-30" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">matrix A</text>

    <!-- brackets -->
    <path d="M18,0 L8,0 L8,110 L18,110" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
    <path d="M162,0 L172,0 L172,110 L162,110" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

    <!-- column 1 (red tint) -->
    <rect x="22" y="4" width="60" height="102" rx="6" fill="#f6e3e3" stroke="#bc4749" stroke-width="1.5"/>
    <!-- column 2 (blue tint) -->
    <rect x="96" y="4" width="60" height="102" rx="6" fill="#e4eef5" stroke="#2a6f97" stroke-width="1.5"/>

    <text x="52" y="42" font-size="24" fill="#bc4749" text-anchor="middle" font-weight="bold">a</text>
    <text x="52" y="90" font-size="24" fill="#bc4749" text-anchor="middle" font-weight="bold">c</text>
    <text x="126" y="42" font-size="24" fill="#2a6f97" text-anchor="middle" font-weight="bold">b</text>
    <text x="126" y="90" font-size="24" fill="#2a6f97" text-anchor="middle" font-weight="bold">d</text>

    <text x="52" y="128" font-size="12.5" fill="#bc4749" text-anchor="middle">A e_1</text>
    <text x="126" y="128" font-size="12.5" fill="#2a6f97" text-anchor="middle">A e_2</text>

    <text x="90" y="160" font-size="13.5" fill="#1b2a3a" text-anchor="middle">a=2, c=1, b=−1, d=1</text>
  </g>

  <!-- connecting arrows matrix -> plot -->
  <path d="M100,205 C 235,255 235,300 285,300" fill="none" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ahr)"/>
  <path d="M175,205 C 250,175 240,150 300,150" fill="none" stroke="#2a6f97" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ahb)"/>

  <!-- ===================== PLOT (right) ===================== -->
  <!-- origin at (450,250), 55 px per unit -->
  <g transform="translate(450,250)">
    <!-- grid -->
    <g stroke="#c9d3dd" stroke-width="1">
      <line x1="-110" y1="-165" x2="-110" y2="55"/>
      <line x1="-55"  y1="-165" x2="-55"  y2="55"/>
      <line x1="55"   y1="-165" x2="55"   y2="55"/>
      <line x1="110"  y1="-165" x2="110"  y2="55"/>
      <line x1="165"  y1="-165" x2="165"  y2="55"/>
      <line x1="-110" y1="-110" x2="165" y2="-110"/>
      <line x1="-110" y1="-55"  x2="165" y2="-55"/>
      <line x1="-110" y1="55"   x2="165" y2="55"/>
    </g>

    <!-- axes -->
    <line x1="-120" y1="0" x2="180" y2="0" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="0" y1="60" x2="0" y2="-175" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- faint standard basis e1, e2 -->
    <line x1="0" y1="0" x2="55" y2="0" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55" marker-end="url(#ahc)"/>
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55" marker-end="url(#ahc)"/>
    <text x="62" y="34" font-size="12.5" fill="#8a5a5b">e_1=(1,0)</text>
    <text x="12" y="-58" font-size="12.5" fill="#5a7f97">e_2=(0,1)</text>

    <!-- image of e1: A e1 = (2,1) -> (110,-55) -->
    <line x1="0" y1="0" x2="110" y2="-55" stroke="#bc4749" stroke-width="2.6" marker-end="url(#ahr)"/>
    <circle cx="110" cy="-55" r="3" fill="#bc4749"/>
    <text x="116" y="-58" font-size="13.5" fill="#bc4749" font-weight="bold">A e_1 = (a,c)</text>
    <text x="116" y="-42" font-size="12" fill="#bc4749">= (2,1) · first column</text>

    <!-- image of e2: A e2 = (-1,1) -> (-55,-55) -->
    <line x1="0" y1="0" x2="-55" y2="-55" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#ahb)"/>
    <circle cx="-55" cy="-55" r="3" fill="#2a6f97"/>
    <text x="-118" y="-78" font-size="13.5" fill="#2a6f97" font-weight="bold">A e_2 = (b,d)</text>
    <text x="-118" y="-62" font-size="12" fill="#2a6f97">= (−1,1) · col 2</text>

    <!-- unit tick labels -->
    <text x="55" y="18" font-size="11" fill="#6b7a89" text-anchor="middle">1</text>
    <text x="110" y="18" font-size="11" fill="#6b7a89" text-anchor="middle">2</text>
    <text x="-12" y="-52" font-size="11" fill="#6b7a89" text-anchor="middle">1</text>
  </g>

  <!-- caption -->
  <text x="360" y="388" font-size="14.5" fill="#1b2a3a" text-anchor="middle" font-style="italic">to build a transformation, put the target axis images in the columns</text>
</svg>
