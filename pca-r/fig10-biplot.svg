<svg xmlns="http://www.w3.org/2000/svg" width="560.8" height="403.9" viewBox="103.7 6.9 560.8 403.9" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gene" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- light crosshair axes through centered origin (350,200) -->
  <line x1="120" y1="200" x2="590" y2="200" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="350" y1="40"  x2="350" y2="360" stroke="#c9d3dd" stroke-width="1.5"/>

  <!-- axis titles -->
  <text x="622" y="205" fill="#1b2a3a" font-size="15" font-weight="bold">PC1</text>
  <text x="350" y="34"  fill="#1b2a3a" font-size="15" font-weight="bold" text-anchor="middle">PC2</text>

  <!-- GENE LOADING ARROWS from origin (dark red = direction of increase) -->
  <g stroke="#bc4749" stroke-width="2.2">
    <line x1="350" y1="200" x2="558" y2="176" marker-end="url(#gene)"/>
    <line x1="350" y1="200" x2="552" y2="188" marker-end="url(#gene)"/>
    <line x1="350" y1="200" x2="350" y2="332" marker-end="url(#gene)"/>
  </g>
  <g fill="#bc4749" font-size="14.5" font-weight="bold">
    <text x="565" y="168">geneA</text>
    <text x="565" y="200">geneB</text>
    <text x="360" y="352">geneC</text>
  </g>
  <text x="565" y="182" fill="#bc4749" font-size="11.5" font-style="italic">nearly</text>
  <text x="565" y="214" fill="#bc4749" font-size="11.5" font-style="italic">coincide</text>

  <!-- SAMPLE SCORE POINTS (teal = healthy, orange = tumor) -->
  <!-- sample1 (-1.643, 0.866) -->
  <circle cx="153" cy="96"  r="6" fill="#2a9d8f"/>
  <text x="153" y="82"  fill="#1b2a3a" font-size="13.5" text-anchor="middle">sample1</text>
  <!-- sample2 (-0.548, -0.866) -->
  <circle cx="284" cy="304" r="6" fill="#2a9d8f"/>
  <text x="284" y="324" fill="#1b2a3a" font-size="13.5" text-anchor="middle">sample2</text>
  <!-- sample3 (0.548, -0.866) -->
  <circle cx="416" cy="304" r="6" fill="#e76f51"/>
  <text x="416" y="324" fill="#1b2a3a" font-size="13.5" text-anchor="middle">sample3</text>
  <!-- sample4 (1.643, 0.866) -->
  <circle cx="547" cy="96"  r="6" fill="#e76f51"/>
  <text x="547" y="82"  fill="#1b2a3a" font-size="13.5" text-anchor="middle">sample4</text>

  <!-- legend -->
  <circle cx="132" cy="56" r="5.5" fill="#2a9d8f"/>
  <text x="144" y="61" fill="#1b2a3a" font-size="13.5">healthy</text>
  <circle cx="212" cy="56" r="5.5" fill="#e76f51"/>
  <text x="224" y="61" fill="#1b2a3a" font-size="13.5">tumor</text>

  <!-- key: arrows vs points -->
  <text x="126" y="370" fill="#1b2a3a" font-size="12.5">arrows = genes (direction of increase) · points = samples</text>

  <!-- annotation -->
  <text x="350" y="392" fill="#bc4749" font-size="13.5" font-weight="bold" text-anchor="middle">geneA &amp; geneB drive PC1 (sample separation);  geneC drives PC2</text>
</svg>
