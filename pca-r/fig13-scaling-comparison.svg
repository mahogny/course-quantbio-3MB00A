<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.0 -7.5 875.2 385.8" font-family="Helvetica, Arial, sans-serif" width="875.2" height="385.8">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Without scaling -->
  <text x="220" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Without scaling</text>

  <!-- axes -->
  <line x1="70" y1="230" x2="390" y2="230" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="230" x2="70" y2="70" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- y tick labels (0..10) -->
  <text x="62" y="234" text-anchor="end" font-size="11" fill="#1b2a3a">0</text>
  <text x="62" y="154" text-anchor="end" font-size="11" fill="#1b2a3a">5</text>
  <text x="62" y="74" text-anchor="end" font-size="11" fill="#1b2a3a">10</text>
  <!-- x tick labels (0..4000) -->
  <text x="70" y="248" text-anchor="middle" font-size="11" fill="#1b2a3a">0</text>
  <text x="225" y="248" text-anchor="middle" font-size="11" fill="#1b2a3a">2000</text>
  <text x="380" y="248" text-anchor="middle" font-size="11" fill="#1b2a3a">4000</text>

  <!-- axis titles -->
  <text x="230" y="268" text-anchor="middle" font-size="13" fill="#1b2a3a">gene1 (raw counts, ~thousands)</text>
  <text x="40" y="150" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 40 150)">gene2 (small counts, ~single digits)</text>

  <!-- squashed / horizontally stretched point cloud (correlated but flattened) -->
  <g fill="#2a6f97" fill-opacity="0.75">
    <circle cx="95" cy="172" r="3.5"/>
    <circle cx="120" cy="168" r="3.5"/>
    <circle cx="140" cy="165" r="3.5"/>
    <circle cx="160" cy="170" r="3.5"/>
    <circle cx="180" cy="162" r="3.5"/>
    <circle cx="200" cy="160" r="3.5"/>
    <circle cx="220" cy="164" r="3.5"/>
    <circle cx="240" cy="158" r="3.5"/>
    <circle cx="260" cy="161" r="3.5"/>
    <circle cx="280" cy="156" r="3.5"/>
    <circle cx="300" cy="159" r="3.5"/>
    <circle cx="320" cy="153" r="3.5"/>
    <circle cx="340" cy="157" r="3.5"/>
    <circle cx="360" cy="151" r="3.5"/>
    <circle cx="110" cy="176" r="3.5"/>
    <circle cx="150" cy="173" r="3.5"/>
    <circle cx="210" cy="168" r="3.5"/>
    <circle cx="270" cy="166" r="3.5"/>
    <circle cx="330" cy="160" r="3.5"/>
    <circle cx="190" cy="155" r="3.5"/>
    <circle cx="250" cy="150" r="3.5"/>
    <circle cx="310" cy="148" r="3.5"/>
  </g>

  <!-- PC1 arrow: almost perfectly horizontal -->
  <line x1="95" y1="167" x2="365" y2="152" stroke="#bc4749" stroke-width="3.5" marker-end="url(#arrowred)"/>
  <text x="300" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">PC1</text>

  <!-- annotation -->
  <text x="220" y="320" text-anchor="middle" font-size="12.5" fill="#1b2a3a" font-style="italic">PC1 follows the big-number gene</text>
  <text x="220" y="338" text-anchor="middle" font-size="12.5" fill="#1b2a3a" font-style="italic">by magnitude alone — not biology</text>

  <!-- divider -->
  <line x1="450" y1="45" x2="450" y2="355" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT PANEL: With scaling -->
  <text x="680" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">With scaling (divide each gene by its SD)</text>

  <!-- equal-aspect axes centered at origin -->
  <!-- origin at (680, 150); 1 unit = 22px; range -3..+3 -> 66px each side -->
  <line x1="548" y1="150" x2="812" y2="150" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="228" x2="680" y2="72" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tick labels -->
  <text x="614" y="166" text-anchor="middle" font-size="11" fill="#1b2a3a">-3</text>
  <text x="746" y="166" text-anchor="middle" font-size="11" fill="#1b2a3a">+3</text>
  <text x="670" y="90" text-anchor="end" font-size="11" fill="#1b2a3a">+3</text>
  <text x="670" y="222" text-anchor="end" font-size="11" fill="#1b2a3a">-3</text>

  <!-- axis titles -->
  <text x="680" y="268" text-anchor="middle" font-size="13" fill="#1b2a3a">gene1 (z-scored)</text>
  <text x="530" y="150" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 530 150)">gene2 (z-scored)</text>

  <!-- balanced tilted correlated cloud around origin (positive correlation) -->
  <g fill="#2a6f97" fill-opacity="0.75">
    <circle cx="632" cy="196" r="3.5"/>
    <circle cx="646" cy="188" r="3.5"/>
    <circle cx="640" cy="180" r="3.5"/>
    <circle cx="658" cy="178" r="3.5"/>
    <circle cx="652" cy="170" r="3.5"/>
    <circle cx="666" cy="172" r="3.5"/>
    <circle cx="672" cy="162" r="3.5"/>
    <circle cx="680" cy="158" r="3.5"/>
    <circle cx="674" cy="150" r="3.5"/>
    <circle cx="688" cy="152" r="3.5"/>
    <circle cx="694" cy="142" r="3.5"/>
    <circle cx="702" cy="140" r="3.5"/>
    <circle cx="710" cy="132" r="3.5"/>
    <circle cx="716" cy="124" r="3.5"/>
    <circle cx="724" cy="118" r="3.5"/>
    <circle cx="660" cy="164" r="3.5"/>
    <circle cx="690" cy="168" r="3.5"/>
    <circle cx="700" cy="152" r="3.5"/>
    <circle cx="668" cy="184" r="3.5"/>
    <circle cx="712" cy="146" r="3.5"/>
    <circle cx="636" cy="176" r="3.5"/>
    <circle cx="682" cy="136" r="3.5"/>
  </g>

  <!-- PC1 arrow along genuine diagonal -->
  <line x1="632" y1="188" x2="726" y2="112" stroke="#bc4749" stroke-width="3.5" marker-end="url(#arrowred)"/>
  <text x="740" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#bc4749">PC1</text>

  <!-- PC2 arrow perpendicular -->
  <line x1="680" y1="150" x2="642" y2="103" stroke="#6a994e" stroke-width="2.5" marker-end="url(#arrowgreen)"/>
  <text x="628" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a994e">PC2</text>

  <!-- annotation -->
  <text x="680" y="320" text-anchor="middle" font-size="12.5" fill="#1b2a3a" font-style="italic">each gene equal footing — PC1 follows</text>
  <text x="680" y="338" text-anchor="middle" font-size="12.5" fill="#1b2a3a" font-style="italic">the pattern, not the units</text>
</svg>