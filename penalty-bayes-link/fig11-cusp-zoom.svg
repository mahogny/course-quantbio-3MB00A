<svg xmlns="http://www.w3.org/2000/svg" viewBox="38.4 15.6 614.4 396.6" font-family="Helvetica, Arial, sans-serif" width="614.4" height="396.6">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="90" y1="250" x2="612" y2="250" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="90" y1="250" x2="90" y2="86" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- x ticks -->
  <line x1="100" y1="250" x2="100" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="340" y1="250" x2="340" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="580" y1="250" x2="580" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="100" y="270" font-size="13" fill="#1b2a3a" text-anchor="middle">-1</text>
  <text x="340" y="270" font-size="13" fill="#1b2a3a" text-anchor="middle">0</text>
  <text x="580" y="270" font-size="13" fill="#1b2a3a" text-anchor="middle">1</text>

  <!-- axis labels -->
  <text x="620" y="248" font-size="16" fill="#1b2a3a" font-style="italic">β</text><text x="632" y="253" font-size="12" fill="#1b2a3a" font-style="italic">j</text>
  <text x="66" y="170" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 66 170)">prior density (near the peak)</text>

  <!-- origin guide -->
  <line x1="340" y1="100" x2="340" y2="250" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Gaussian dome (light tint fill) -->
  <path d="M100,229.7 L130,217.6 L160,201.3 L190,181.3 L220,159 L250,136.8 L280,117.6 L310,104.6 L340,100 L370,104.6 L400,117.6 L430,136.8 L460,159 L490,181.3 L520,201.3 L550,217.6 L580,229.7 L580,250 L100,250 Z"
        fill="#eaf1f7" fill-opacity="0.7" stroke="none"/>
  <!-- Gaussian curve: smooth rounded top -->
  <path d="M100,229.7 L130,217.6 L160,201.3 L190,181.3 L220,159 L250,136.8 L280,117.6 L310,104.6 L340,100 L370,104.6 L400,117.6 L430,136.8 L460,159 L490,181.3 L520,201.3 L550,217.6 L580,229.7"
        fill="none" stroke="#2a6f97" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Laplace: two straight segments meeting at a sharp cusp -->
  <path d="M100,222 L340,100 L580,222" fill="none" stroke="#bc4749" stroke-width="2.4" stroke-linejoin="miter" stroke-miterlimit="10"/>

  <!-- apex dot -->
  <circle cx="340" cy="100" r="3.4" fill="#bc4749"/>

  <!-- slope=0 flat-top marker on Gaussian -->
  <line x1="316" y1="100" x2="364" y2="100" stroke="#2a6f97" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- cusp callout -->
  <text x="470" y="44" font-size="14.5" fill="#bc4749" font-weight="bold" text-anchor="middle">kink → exact zeros</text>
  <text x="470" y="62" font-size="14.5" fill="#bc4749" font-weight="bold" text-anchor="middle">(variable selection)</text>
  <path d="M400,58 C372,70 356,82 345,96" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- curve labels -->
  <text x="150" y="118" font-size="13.5" fill="#2a6f97" font-weight="bold">Gaussian</text>
  <text x="150" y="134" font-size="12" fill="#2a6f97">rounded top, slope = 0 at 0</text>
  <text x="150" y="149" font-size="12" fill="#2a6f97">→ never forces β = 0</text>

  <text x="392" y="150" font-size="13.5" fill="#bc4749" font-weight="bold">Laplace</text>
  <text x="392" y="166" font-size="12" fill="#bc4749">sharp kink at 0</text>

  <!-- separator -->
  <line x1="90" y1="298" x2="630" y2="298" stroke="#c9d3dd" stroke-width="1.3"/>

  <!-- contrasting mini-labels -->
  <rect x="92" y="318" width="26" height="11" rx="2" fill="#2a6f97"/>
  <text x="126" y="328" font-size="13.5" fill="#1b2a3a"><tspan font-weight="bold">Ridge / Gaussian:</tspan> every gene contributes a little (polygenic, dense)</text>

  <rect x="92" y="348" width="26" height="11" rx="2" fill="#bc4749"/>
  <text x="126" y="358" font-size="13.5" fill="#1b2a3a"><tspan font-weight="bold">Lasso / Laplace:</tspan> a few genes contribute, most are exactly 0 (sparse)</text>

  <!-- focus caption -->
  <text x="360" y="392" font-size="12.5" fill="#6a994e" text-anchor="middle" font-style="italic">rounded dome vs. pointed cusp at β = 0 is what creates sparsity</text>
</svg>
