<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- light grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="100" y1="40"  x2="100" y2="340"/>
    <line x1="150" y1="40"  x2="150" y2="340"/>
    <line x1="200" y1="40"  x2="200" y2="340"/>
    <line x1="300" y1="40"  x2="300" y2="340"/>
    <line x1="350" y1="40"  x2="350" y2="340"/>
    <line x1="400" y1="40"  x2="400" y2="340"/>
    <line x1="100" y1="40"  x2="400" y2="40"/>
    <line x1="100" y1="90"  x2="400" y2="90"/>
    <line x1="100" y1="140" x2="400" y2="140"/>
    <line x1="100" y1="240" x2="400" y2="240"/>
    <line x1="100" y1="290" x2="400" y2="290"/>
    <line x1="100" y1="340" x2="400" y2="340"/>
  </g>

  <!-- axes -->
  <g stroke="#1b2a3a" stroke-width="1.8">
    <line x1="100" y1="190" x2="405" y2="190" marker-end="url(#arrow)"/>
    <line x1="250" y1="340" x2="250" y2="35"  marker-end="url(#arrow)"/>
  </g>

  <!-- tick labels -->
  <g fill="#1b2a3a" font-size="12" text-anchor="middle">
    <text x="150" y="205">-2</text>
    <text x="200" y="205">-1</text>
    <text x="300" y="205">1</text>
    <text x="350" y="205">2</text>
    <text x="415" y="194">x</text>
    <text x="238" y="94">2</text>
    <text x="238" y="144">1</text>
    <text x="238" y="244">-1</text>
    <text x="238" y="294">-2</text>
    <text x="253" y="46" text-anchor="start">y</text>
  </g>

  <!-- BEFORE: unit diamond in black -->
  <polygon points="300,190 250,140 200,190 250,240"
           fill="#eef1f4" fill-opacity="0.7" stroke="#1b2a3a" stroke-width="2"/>
  <g fill="#1b2a3a">
    <circle cx="300" cy="190" r="3.5"/>
    <circle cx="250" cy="140" r="3.5"/>
    <circle cx="200" cy="190" r="3.5"/>
    <circle cx="250" cy="240" r="3.5"/>
  </g>
  <text x="256" y="132" fill="#1b2a3a" font-size="14" font-style="italic">before</text>

  <!-- AFTER: rotated + x-stretched parallelogram in red -->
  <polygon points="320.7,154.7 179.3,154.7 179.3,225.3 320.7,225.3"
           fill="#bc4749" fill-opacity="0.12" stroke="#bc4749" stroke-width="2"/>
  <g fill="#bc4749">
    <circle cx="320.7" cy="154.7" r="3.5"/>
    <circle cx="179.3" cy="154.7" r="3.5"/>
    <circle cx="179.3" cy="225.3" r="3.5"/>
    <circle cx="320.7" cy="225.3" r="3.5"/>
  </g>
  <text x="323" y="150" fill="#bc4749" font-size="14" font-style="italic">after</text>

  <!-- annotation -->
  <text x="330" y="365" fill="#2a6f97" font-size="14" text-anchor="middle">rotate 45°, then stretch x by 2   (S·R,  S = diag(2,1))</text>

  <!-- legend -->
  <g font-size="14" fill="#1b2a3a">
    <rect x="470" y="150" width="170" height="72" fill="none" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="484" y1="172" x2="516" y2="172" stroke="#1b2a3a" stroke-width="2"/>
    <text x="524" y="177">before (diamond)</text>
    <line x1="484" y1="200" x2="516" y2="200" stroke="#bc4749" stroke-width="2"/>
    <text x="524" y="205" fill="#bc4749">after (R then S)</text>
  </g>
</svg>
