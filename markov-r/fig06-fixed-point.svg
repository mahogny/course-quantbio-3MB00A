<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.9 49.1 702.1 344.0" width="702.1" height="344.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- space of distributions region -->
  <rect x="30" y="70" width="660" height="270" rx="14" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="48" y="94" font-size="15" fill="#6a7887" font-style="italic">space of distributions  (∑ π_k = 1,  π_k ≥ 0)</text>

  <!-- fixed point pi -->
  <circle cx="520" cy="230" r="9" fill="#bc4749" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="536" y="224" font-size="20" fill="#bc4749" font-weight="bold">π</text>

  <!-- self loop on pi -->
  <path d="M528,222 C560,190 578,232 545,246" fill="none" stroke="#bc4749" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="196" font-size="14" fill="#bc4749">× P</text>
  <text x="452" y="272" font-size="14" fill="#1b2a3a">unchanged:  πP = π</text>

  <!-- pi equilibrium values annotation -->
  <rect x="500" y="292" width="176" height="38" rx="6" fill="#ffffff" stroke="#bc4749" stroke-width="1.2"/>
  <text x="510" y="308" font-size="12.5" fill="#1b2a3a">π = (0.232, 0.281,</text>
  <text x="510" y="324" font-size="12.5" fill="#1b2a3a">        0.194, 0.293)</text>

  <!-- trajectory x0 -> x1 -> x2 -> ... pulled toward pi -->
  <!-- points -->
  <circle cx="95"  cy="150" r="7" fill="#2a6f97"/>
  <text x="72" y="142" font-size="15" fill="#2a6f97">x_0</text>
  <circle cx="215" cy="200" r="6.5" fill="#2a6f97"/>
  <text x="204" y="188" font-size="14" fill="#2a6f97">x_1</text>
  <circle cx="320" cy="215" r="6" fill="#2a6f97"/>
  <text x="312" y="204" font-size="13" fill="#2a6f97">x_2</text>
  <circle cx="400" cy="223" r="5" fill="#2a6f97"/>
  <text x="392" y="212" font-size="12" fill="#2a6f97">x_3</text>
  <circle cx="455" cy="227" r="4" fill="#2a6f97"/>

  <!-- stepping arrows getting shorter -->
  <path d="M104,157 L204,193" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M223,204 L311,212" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M328,217 L392,221" fill="none" stroke="#2a6f97" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <path d="M406,224 L449,226" fill="none" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <path d="M461,227.5 L505,229" fill="none" stroke="#2a6f97" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrowBlue)"/>

  <!-- x P labels on arrows -->
  <text x="138" y="168" font-size="13" fill="#2a6f97">× P</text>
  <text x="258" y="200" font-size="12.5" fill="#2a6f97">× P</text>
  <text x="352" y="211" font-size="12" fill="#2a6f97">× P</text>
  <text x="470" y="243" font-size="12" fill="#2a6f97">…</text>

  <text x="95" y="118" font-size="13.5" fill="#1b2a3a">any start is pulled toward the fixed point</text>

  <!-- caption for pi -->
  <text x="360" y="370" font-size="14.5" fill="#1b2a3a" text-anchor="middle">π = stationary distribution — the fixed point of “multiply by P”</text>
</svg>
