<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL : CORRECT ================= -->
  <rect x="12" y="12" width="500" height="376" rx="10" fill="#f4f9f4" stroke="#6a994e" stroke-width="2"/>
  <text x="262" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">P %*% P  (matrix power, CORRECT)</text>

  <!-- first M -->
  <path d="M 88,82 L 80,82 L 80,152 L 88,152" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <!-- row1 highlight -->
  <rect x="90" y="86" width="68" height="30" rx="4" fill="#cfe3f2" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="107" y="108" text-anchor="middle" font-size="20" fill="#1b2a3a">a</text>
  <text x="141" y="108" text-anchor="middle" font-size="20" fill="#1b2a3a">b</text>
  <text x="107" y="140" text-anchor="middle" font-size="20" fill="#1b2a3a">c</text>
  <text x="141" y="140" text-anchor="middle" font-size="20" fill="#1b2a3a">d</text>
  <path d="M 160,82 L 168,82 L 168,152 L 160,152" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <text x="184" y="124" text-anchor="middle" font-size="22" fill="#1b2a3a">·</text>

  <!-- second M -->
  <path d="M 208,82 L 200,82 L 200,152 L 208,152" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <!-- col1 highlight -->
  <rect x="211" y="86" width="32" height="62" rx="4" fill="#dbeecf" stroke="#6a994e" stroke-width="1.5"/>
  <text x="227" y="108" text-anchor="middle" font-size="20" fill="#1b2a3a">a</text>
  <text x="261" y="108" text-anchor="middle" font-size="20" fill="#1b2a3a">b</text>
  <text x="227" y="140" text-anchor="middle" font-size="20" fill="#1b2a3a">c</text>
  <text x="261" y="140" text-anchor="middle" font-size="20" fill="#1b2a3a">d</text>
  <path d="M 280,82 L 288,82 L 288,152 L 280,152" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <!-- dot product explanation -->
  <text x="70" y="192" font-size="16" fill="#2a6f97" font-weight="bold">row 1 (a, b)  ·  col 1 (a, c)</text>
  <text x="70" y="216" font-size="18" fill="#1b2a3a">result[1,1] =</text>
  <text x="188" y="216" font-size="18" font-weight="bold" fill="#6a994e">a·a + b·c</text>

  <!-- arrow to result cell -->
  <path d="M235 226 Q235 258 165 274" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result matrix -->
  <path d="M82 250 L74 250 L74 332 L82 332" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <rect x="86" y="256" width="86" height="34" rx="4" fill="#e6f2dc" stroke="#6a994e" stroke-width="1.5"/>
  <text x="129" y="280" text-anchor="middle" font-size="15" fill="#1b2a3a">a·a+b·c</text>
  <text x="222" y="280" text-anchor="middle" font-size="15" fill="#1b2a3a">a·b+b·d</text>
  <text x="129" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">c·a+d·c</text>
  <text x="222" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">c·b+d·d</text>
  <path d="M260 250 L268 250 L268 332 L260 332" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="70" y="368" font-size="14" fill="#6a994e">dot products mix rows &amp; columns — a real 2-step matrix</text>

  <!-- ================= RIGHT PANEL : WRONG ================= -->
  <rect x="540" y="12" width="328" height="376" rx="10" fill="#fbf1f1" stroke="#bc4749" stroke-width="2"/>
  <text x="704" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">P^2  (elementwise, WRONG)</text>

  <!-- red X badge -->
  <circle cx="704" cy="86" r="20" fill="#fff" stroke="#bc4749" stroke-width="2.5"/>
  <path d="M695 77 L713 95 M713 77 L695 95" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>

  <text x="590" y="180" font-size="18" fill="#1b2a3a">each entry squared on its own</text>

  <!-- result matrix -->
  <path d="M608 206 L600 206 L600 290 L608 290" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
  <rect x="619" y="212" width="50" height="34" rx="4" fill="#f4d7d7" stroke="#bc4749" stroke-width="1.5"/>
  <text x="644" y="236" text-anchor="middle" font-size="18" fill="#bc4749"><tspan>a</tspan><tspan font-size="11" dy="-6">2</tspan></text>
  <text x="708" y="236" text-anchor="middle" font-size="18" fill="#bc4749"><tspan>b</tspan><tspan font-size="11" dy="-6">2</tspan></text>
  <text x="644" y="278" text-anchor="middle" font-size="18" fill="#bc4749"><tspan>c</tspan><tspan font-size="11" dy="-6">2</tspan></text>
  <text x="708" y="278" text-anchor="middle" font-size="18" fill="#bc4749"><tspan>d</tspan><tspan font-size="11" dy="-6">2</tspan></text>
  <path d="M736 206 L744 206 L744 290 L736 290" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>

  <text x="590" y="330" font-size="14" fill="#bc4749" font-weight="bold">squares each entry independently —</text>
  <text x="590" y="350" font-size="14" fill="#bc4749" font-weight="bold">NOT a 2-step transition matrix</text>

  <!-- ≠ between panels -->
  <text x="524" y="215" text-anchor="middle" font-size="30" font-weight="bold" fill="#bc4749">≠</text>
</svg>
