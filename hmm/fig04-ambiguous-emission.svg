<svg xmlns="http://www.w3.org/2000/svg" viewBox="47.9 26.2 544.2 354.6" width="544.2" height="354.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8aa0b3"/>
    </marker>
  </defs>

  <!-- Upper state node: H = GC-rich -->
  <circle cx="130" cy="95" r="52" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="130" y="88" text-anchor="middle" font-size="26" font-weight="bold" fill="#1b2a3a">H</text>
  <text x="130" y="112" text-anchor="middle" font-size="14" fill="#2a6f97">GC-rich</text>

  <!-- Lower state node: L = normal -->
  <circle cx="130" cy="270" r="52" fill="#f0f4f7" stroke="#8aa0b3" stroke-width="2"/>
  <text x="130" y="263" text-anchor="middle" font-size="26" font-weight="bold" fill="#1b2a3a">L</text>
  <text x="130" y="287" text-anchor="middle" font-size="14" fill="#6f8598">normal</text>

  <!-- Letter box on the right containing a large G -->
  <rect x="452" y="128" width="110" height="110" rx="10" fill="#fff8f0" stroke="#1b2a3a" stroke-width="2"/>
  <text x="507" y="203" text-anchor="middle" font-size="72" font-weight="bold" fill="#1b2a3a">G</text>

  <!-- H -> G arrow: thick, often -->
  <path d="M182,110 Q330,140 448,168" fill="none" stroke="#1b2a3a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="320" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">P = 0.4  (often)</text>

  <!-- L -> G arrow: thin, less often -->
  <path d="M182,255 Q330,225 448,198" fill="none" stroke="#8aa0b3" stroke-width="1.6" marker-end="url(#arrowThin)"/>
  <text x="320" y="270" text-anchor="middle" font-size="15" fill="#6f8598">P = 0.2  (too, less often)</text>

  <!-- Emit labels -->
  <text x="252" y="152" text-anchor="middle" font-size="12" fill="#6a994e" font-style="italic">emits</text>
  <text x="252" y="240" text-anchor="middle" font-size="12" fill="#6a994e" font-style="italic">emits</text>

  <!-- Caption -->
  <text x="320" y="342" text-anchor="middle" font-size="15" fill="#1b2a3a">A single G could come from either state — one letter cannot reveal the hidden</text>
  <text x="320" y="362" text-anchor="middle" font-size="15" fill="#1b2a3a">state; only the run of letters can.</text>
</svg>
