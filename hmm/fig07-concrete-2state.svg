<svg xmlns="http://www.w3.org/2000/svg" viewBox="87.9 -2.3 704.3 410.2" width="704.3" height="410.2" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== State nodes ===================== -->
  <!-- H state -->
  <circle cx="230" cy="105" r="52" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="230" y="98" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b2a3a">H</text>
  <text x="230" y="118" text-anchor="middle" font-size="12" fill="#2a6f97">GC-rich (high)</text>

  <!-- L state -->
  <circle cx="650" cy="105" r="52" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="650" y="98" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b2a3a">L</text>
  <text x="650" y="118" text-anchor="middle" font-size="12" fill="#2a6f97">normal (low)</text>

  <!-- ===================== Start arrows (pi) ===================== -->
  <path d="M230,18 L230,50" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="238" y="30" font-size="14" fill="#1b2a3a">π = 0.5</text>
  <path d="M650,18 L650,50" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="658" y="30" font-size="14" fill="#1b2a3a">π = 0.5</text>

  <!-- ===================== Self-loops (matrix A diagonal) ===================== -->
  <!-- H self-loop (left side) -->
  <path d="M186,80 C120,50 120,160 186,130" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="118" y="108" text-anchor="middle" font-size="15" fill="#1b2a3a">0.8</text>
  <!-- L self-loop (right side) -->
  <path d="M694,80 C760,50 760,160 694,130" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="762" y="108" text-anchor="middle" font-size="15" fill="#1b2a3a">0.7</text>

  <!-- ===================== Cross arrows (matrix A off-diagonal) ===================== -->
  <!-- H -> L (top curve) -->
  <path d="M280,80 C400,40 480,40 600,80" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="440" y="48" text-anchor="middle" font-size="15" fill="#1b2a3a">0.2</text>
  <!-- L -> H (bottom curve) -->
  <path d="M600,130 C480,170 400,170 280,130" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="440" y="168" text-anchor="middle" font-size="15" fill="#1b2a3a">0.3</text>

  <!-- Matrix A caption -->
  <text x="440" y="102" text-anchor="middle" font-size="13" font-style="italic" fill="#6a994e">transition matrix A</text>

  <!-- ===================== Emission bar charts (matrix B) ===================== -->
  <!-- Baselines: bars height scale: prob * 130 px -->
  <!-- H emission chart, centered ~230, baseline y=350, bars width 26, gap 8 -->
  <!-- symbols A C G T at x = 155,189,223,257 ; H probs 0.1 0.4 0.4 0.1 -->
  <line x1="145" y1="350" x2="315" y2="350" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="155" y="337" width="26" height="13" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="189" y="298" width="26" height="52" fill="#6a994e" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="223" y="298" width="26" height="52" fill="#6a994e" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="257" y="337" width="26" height="13" fill="#c9d3dd" stroke="#1b2a3a" stroke-width="1"/>
  <text x="168" y="329" text-anchor="middle" font-size="10" fill="#1b2a3a">.1</text>
  <text x="202" y="290" text-anchor="middle" font-size="10" fill="#1b2a3a">.4</text>
  <text x="236" y="290" text-anchor="middle" font-size="10" fill="#1b2a3a">.4</text>
  <text x="270" y="329" text-anchor="middle" font-size="10" fill="#1b2a3a">.1</text>
  <text x="168" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">A</text>
  <text x="202" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">C</text>
  <text x="236" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">G</text>
  <text x="270" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">T</text>
  <text x="230" y="385" text-anchor="middle" font-size="12" font-style="italic" fill="#6a994e">loves C and G</text>

  <!-- L emission chart, centered ~650, symbols at x=575,609,643,677 ; probs 0.3 0.2 0.2 0.3 -->
  <line x1="565" y1="350" x2="735" y2="350" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="575" y="311" width="26" height="39" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="609" y="324" width="26" height="26" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="643" y="324" width="26" height="26" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
  <rect x="677" y="311" width="26" height="39" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
  <text x="588" y="303" text-anchor="middle" font-size="10" fill="#1b2a3a">.3</text>
  <text x="622" y="316" text-anchor="middle" font-size="10" fill="#1b2a3a">.2</text>
  <text x="656" y="316" text-anchor="middle" font-size="10" fill="#1b2a3a">.2</text>
  <text x="690" y="303" text-anchor="middle" font-size="10" fill="#1b2a3a">.3</text>
  <text x="588" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">A</text>
  <text x="622" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">C</text>
  <text x="656" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">G</text>
  <text x="690" y="364" text-anchor="middle" font-size="13" fill="#1b2a3a">T</text>
  <text x="650" y="385" text-anchor="middle" font-size="12" font-style="italic" fill="#6a994e">nearly uniform</text>

  <!-- Matrix B caption -->
  <text x="440" y="240" text-anchor="middle" font-size="13" font-style="italic" fill="#6a994e">emission matrix B</text>

  <!-- dotted connectors from states down to charts -->
  <line x1="230" y1="157" x2="230" y2="228" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="650" y1="157" x2="650" y2="228" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
