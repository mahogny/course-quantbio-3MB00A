<svg xmlns="http://www.w3.org/2000/svg" viewBox="40.7 40.1 681.7 344.8" width="681.7" height="344.8" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- ============ HIDDEN (top) row labels ============ -->
  <text x="60" y="70" font-size="15" fill="#8794a1" font-style="italic">hidden</text>
  <text x="60" y="88" font-size="13" fill="#8794a1">z = (H, H, L)</text>

  <!-- start arrow into z1 -->
  <line x1="120" y1="120" x2="176" y2="120" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="118" y="108" font-size="14" fill="#1b2a3a">start</text>
  <text x="120" y="140" font-size="14" fill="#bc4749">π_H = 0.5</text>

  <!-- hidden nodes (greyed / dashed) -->
  <!-- z1 -->
  <circle cx="220" cy="120" r="34" fill="#eef1f4" stroke="#8794a1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="220" y="118" font-size="20" font-weight="bold" fill="#5b6773" text-anchor="middle">H</text>
  <text x="220" y="136" font-size="12" fill="#8794a1" text-anchor="middle">z_1</text>
  <!-- z2 -->
  <circle cx="420" cy="120" r="34" fill="#eef1f4" stroke="#8794a1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="420" y="118" font-size="20" font-weight="bold" fill="#5b6773" text-anchor="middle">H</text>
  <text x="420" y="136" font-size="12" fill="#8794a1" text-anchor="middle">z_2</text>
  <!-- z3 -->
  <circle cx="620" cy="120" r="34" fill="#eef1f4" stroke="#8794a1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="620" y="118" font-size="20" font-weight="bold" fill="#5b6773" text-anchor="middle">L</text>
  <text x="620" y="136" font-size="12" fill="#8794a1" text-anchor="middle">z_3</text>

  <!-- transition arrows -->
  <line x1="256" y1="120" x2="384" y2="120" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="320" y="110" font-size="14" fill="#2a6f97" text-anchor="middle">A[H,H] = 0.8</text>
  <line x1="456" y1="120" x2="584" y2="120" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="520" y="110" font-size="14" fill="#2a6f97" text-anchor="middle">A[H,L] = 0.2</text>

  <!-- emission arrows (downward) -->
  <line x1="220" y1="154" x2="220" y2="266" stroke="#6a994e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="230" y="215" font-size="14" fill="#6a994e">B[H,G] = 0.4</text>
  <line x1="420" y1="154" x2="420" y2="266" stroke="#6a994e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="215" font-size="14" fill="#6a994e">B[H,C] = 0.4</text>
  <line x1="620" y1="154" x2="620" y2="266" stroke="#6a994e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="630" y="215" font-size="14" fill="#6a994e">B[L,A] = 0.3</text>

  <!-- ============ OBSERVED (bottom) row ============ -->
  <!-- x1 = G -->
  <rect x="192" y="272" width="56" height="56" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="220" y="308" font-size="22" font-weight="bold" fill="#1b2a3a" text-anchor="middle">G</text>
  <!-- x2 = C -->
  <rect x="392" y="272" width="56" height="56" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="420" y="308" font-size="22" font-weight="bold" fill="#1b2a3a" text-anchor="middle">C</text>
  <!-- x3 = A -->
  <rect x="592" y="272" width="56" height="56" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="620" y="308" font-size="22" font-weight="bold" fill="#1b2a3a" text-anchor="middle">A</text>

  <text x="60" y="304" font-size="15" fill="#1b2a3a" font-weight="bold">observed</text>
  <text x="60" y="322" font-size="13" fill="#1b2a3a">x = (G, C, A)</text>

  <!-- caption -->
  <text x="360" y="362" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">we observe only G C A; the path H H L is invisible.</text>
</svg>
