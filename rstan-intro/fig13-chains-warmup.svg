<svg xmlns="http://www.w3.org/2000/svg" width="707.9" height="382.1" viewBox="2.2 -9.2 707.9 382.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Four chains mix after warmup</text>

  <!-- warmup shaded region -->
  <rect x="90" y="45" width="220" height="275" fill="#eaf1f7"/>

  <!-- grid lines at theta 0.1 0.3 0.5 0.7 0.9 -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="90" y1="320" x2="680" y2="320"/>
    <line x1="90" y1="250" x2="680" y2="250"/>
    <line x1="90" y1="180" x2="680" y2="180"/>
    <line x1="90" y1="110" x2="680" y2="110"/>
    <line x1="90" y1="45"  x2="680" y2="45"/>
  </g>

  <!-- axes -->
  <line x1="90" y1="320" x2="690" y2="320" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="320" x2="90" y2="38" stroke="#1b2a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- y axis theta labels -->
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="84" y="324">0.1</text>
    <text x="84" y="254">0.3</text>
    <text x="84" y="184">0.5</text>
    <text x="84" y="114">0.7</text>
    <text x="84" y="49">0.9</text>
  </g>
  <text x="34" y="185" text-anchor="middle" font-size="16" fill="#1b2a3a" transform="rotate(-90 34 185)">θ</text>
  <text x="390" y="352" text-anchor="middle" font-size="15" fill="#1b2a3a">iteration</text>

  <!-- warmup end dashed separator -->
  <line x1="310" y1="45" x2="310" y2="320" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="314" y="58" font-size="12" fill="#1b2a3a">warmup ends</text>

  <!-- warmup label -->
  <text x="200" y="311" text-anchor="middle" font-size="13" fill="#5a6b7b" font-style="italic">warmup (discarded)</text>

  <!-- Chain 1 (blue) start theta 0.2 -->
  <polyline fill="none" stroke="#2a6f97" stroke-width="1.7" points="90,285 120,268 150,246 180,220 210,196 240,172 270,152 310,138 340,150 370,120 400,140 430,125 460,145 490,130 520,152 550,122 580,138 610,128 640,148 670,132 680,140"/>
  <!-- Chain 2 (red) start theta 0.5 -->
  <polyline fill="none" stroke="#bc4749" stroke-width="1.7" points="90,180 120,176 150,166 180,156 210,148 240,141 270,136 310,133 340,120 370,145 400,128 430,150 460,122 490,142 520,130 550,148 580,124 610,144 640,134 670,150 680,126"/>
  <!-- Chain 3 (green) start theta 0.65 -->
  <polyline fill="none" stroke="#6a994e" stroke-width="1.7" points="90,128 120,121 150,131 180,125 210,133 240,128 270,135 310,134 340,140 370,128 400,150 430,120 460,138 490,148 520,124 550,142 580,132 610,150 640,122 670,140 680,130"/>
  <!-- Chain 4 (amber) start theta 0.85 -->
  <polyline fill="none" stroke="#e09f3e" stroke-width="1.7" points="90,58 120,76 150,96 180,111 210,121 240,129 270,133 310,135 340,128 370,148 400,122 430,142 460,132 490,120 520,146 550,130 580,150 610,124 640,142 670,128 680,144"/>

  <!-- mixed callout -->
  <text x="500" y="72" text-anchor="middle" font-size="13" fill="#1b2a3a">mixed: all chains explore the</text>
  <text x="500" y="89" text-anchor="middle" font-size="13" fill="#1b2a3a">same distribution → trust it</text>
  <line x1="500" y1="95" x2="500" y2="122" stroke="#1b2a3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="612" y="172" font-size="12" fill="#5a6b7b" font-style="italic">θ ≈ 0.63</text>

  <!-- legend -->
  <g font-size="12" fill="#1b2a3a">
    <rect x="150" y="60" width="150" height="72" fill="#ffffff" fill-opacity="0.85" stroke="#c9d3dd" stroke-width="1"/>
    <line x1="160" y1="74" x2="184" y2="74" stroke="#2a6f97" stroke-width="2.4"/><text x="190" y="78">chain 1</text>
    <line x1="160" y1="90" x2="184" y2="90" stroke="#bc4749" stroke-width="2.4"/><text x="190" y="94">chain 2</text>
    <line x1="160" y1="106" x2="184" y2="106" stroke="#6a994e" stroke-width="2.4"/><text x="190" y="110">chain 3</text>
    <line x1="160" y1="122" x2="184" y2="122" stroke="#e09f3e" stroke-width="2.4"/><text x="190" y="126">chain 4</text>
  </g>
</svg>
