<svg xmlns="http://www.w3.org/2000/svg" viewBox="18.1 0.1 899.1 400.4" width="899.1" height="400.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ============ PANEL 1: TISSUE ============ -->
  <text x="140" y="38" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Tissue</text>

  <!-- tissue block -->
  <rect x="45" y="55" width="190" height="235" rx="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>

  <!-- packed, intermingled cells (3 colours) -->
  <g stroke="#1b2a3a" stroke-width="1">
    <circle cx="82"  cy="98"  r="13" fill="#2a6f97"/>
    <circle cx="132" cy="93"  r="13" fill="#d97706"/>
    <circle cx="182" cy="103" r="13" fill="#7b4fa3"/>
    <circle cx="76"  cy="142" r="13" fill="#d97706"/>
    <circle cx="130" cy="140" r="13" fill="#7b4fa3"/>
    <circle cx="184" cy="146" r="13" fill="#2a6f97"/>
    <circle cx="84"  cy="186" r="13" fill="#7b4fa3"/>
    <circle cx="128" cy="188" r="13" fill="#2a6f97"/>
    <circle cx="180" cy="184" r="13" fill="#d97706"/>
    <circle cx="78"  cy="230" r="13" fill="#2a6f97"/>
    <circle cx="134" cy="232" r="13" fill="#d97706"/>
    <circle cx="182" cy="228" r="13" fill="#7b4fa3"/>
    <circle cx="88"  cy="270" r="13" fill="#d97706"/>
    <circle cx="132" cy="272" r="13" fill="#7b4fa3"/>
    <circle cx="178" cy="268" r="13" fill="#2a6f97"/>
  </g>

  <!-- cell-type legend -->
  <g font-size="13" fill="#1b2a3a">
    <circle cx="58" cy="322" r="7" fill="#2a6f97"/><text x="72" y="326">neuron</text>
    <circle cx="58" cy="345" r="7" fill="#d97706"/><text x="72" y="349">T cell</text>
    <circle cx="58" cy="368" r="7" fill="#7b4fa3"/><text x="72" y="372">macrophage</text>
  </g>

  <!-- arrow: dissociate -->
  <line x1="240" y1="172" x2="300" y2="172" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="160" font-size="13" fill="#2a6f97" text-anchor="middle" font-weight="bold">dissociate</text>

  <!-- ============ PANEL 2: SINGLE CELLS ============ -->
  <text x="440" y="38" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Single cells</text>

  <!-- each free-floating cell carries a tiny expression bar code -->
  <!-- barcode helper: 4 thin vertical strokes beside the cell -->
  <g>
    <!-- row 1 -->
    <circle cx="345" cy="105" r="9" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="360" y1="99" x2="360" y2="111"/><line x1="364" y1="97" x2="364" y2="113"/><line x1="368" y1="100" x2="368" y2="110"/><line x1="372" y1="98" x2="372" y2="112"/></g>
    <circle cx="418" cy="96" r="9" fill="#d97706" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="433" y1="90" x2="433" y2="102"/><line x1="437" y1="88" x2="437" y2="104"/><line x1="441" y1="91" x2="441" y2="101"/><line x1="445" y1="89" x2="445" y2="103"/></g>
    <circle cx="495" cy="108" r="9" fill="#7b4fa3" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="510" y1="102" x2="510" y2="114"/><line x1="514" y1="100" x2="514" y2="116"/><line x1="518" y1="103" x2="518" y2="113"/><line x1="522" y1="101" x2="522" y2="115"/></g>
    <!-- row 2 -->
    <circle cx="350" cy="150" r="9" fill="#d97706" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="365" y1="144" x2="365" y2="156"/><line x1="369" y1="142" x2="369" y2="158"/><line x1="373" y1="145" x2="373" y2="155"/><line x1="377" y1="143" x2="377" y2="157"/></g>
    <circle cx="420" cy="147" r="9" fill="#7b4fa3" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="435" y1="141" x2="435" y2="153"/><line x1="439" y1="139" x2="439" y2="155"/><line x1="443" y1="142" x2="443" y2="152"/><line x1="447" y1="140" x2="447" y2="154"/></g>
    <circle cx="492" cy="153" r="9" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="507" y1="147" x2="507" y2="159"/><line x1="511" y1="145" x2="511" y2="161"/><line x1="515" y1="148" x2="515" y2="158"/><line x1="519" y1="146" x2="519" y2="160"/></g>
    <!-- row 3 -->
    <circle cx="343" cy="194" r="9" fill="#7b4fa3" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="358" y1="188" x2="358" y2="200"/><line x1="362" y1="186" x2="362" y2="202"/><line x1="366" y1="189" x2="366" y2="199"/><line x1="370" y1="187" x2="370" y2="201"/></g>
    <circle cx="422" cy="196" r="9" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="437" y1="190" x2="437" y2="202"/><line x1="441" y1="188" x2="441" y2="204"/><line x1="445" y1="191" x2="445" y2="201"/><line x1="449" y1="189" x2="449" y2="203"/></g>
    <circle cx="498" cy="190" r="9" fill="#d97706" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="513" y1="184" x2="513" y2="196"/><line x1="517" y1="182" x2="517" y2="198"/><line x1="521" y1="185" x2="521" y2="195"/><line x1="525" y1="183" x2="525" y2="197"/></g>
    <!-- row 4 -->
    <circle cx="348" cy="238" r="9" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="363" y1="232" x2="363" y2="244"/><line x1="367" y1="230" x2="367" y2="246"/><line x1="371" y1="233" x2="371" y2="243"/><line x1="375" y1="231" x2="375" y2="245"/></g>
    <circle cx="416" cy="236" r="9" fill="#d97706" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="431" y1="230" x2="431" y2="242"/><line x1="435" y1="228" x2="435" y2="244"/><line x1="439" y1="231" x2="439" y2="241"/><line x1="443" y1="229" x2="443" y2="243"/></g>
    <circle cx="496" cy="234" r="9" fill="#7b4fa3" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="511" y1="228" x2="511" y2="240"/><line x1="515" y1="226" x2="515" y2="242"/><line x1="519" y1="229" x2="519" y2="239"/><line x1="523" y1="227" x2="523" y2="241"/></g>
    <!-- row 5 -->
    <circle cx="352" cy="282" r="9" fill="#d97706" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="367" y1="276" x2="367" y2="288"/><line x1="371" y1="274" x2="371" y2="290"/><line x1="375" y1="277" x2="375" y2="287"/><line x1="379" y1="275" x2="379" y2="289"/></g>
    <circle cx="420" cy="280" r="9" fill="#7b4fa3" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="435" y1="274" x2="435" y2="286"/><line x1="439" y1="272" x2="439" y2="288"/><line x1="443" y1="275" x2="443" y2="285"/><line x1="447" y1="273" x2="447" y2="287"/></g>
    <circle cx="494" cy="283" r="9" fill="#2a6f97" stroke="#1b2a3a" stroke-width="1"/>
    <g stroke="#1b2a3a" stroke-width="1.6"><line x1="509" y1="277" x2="509" y2="289"/><line x1="513" y1="275" x2="513" y2="291"/><line x1="517" y1="278" x2="517" y2="288"/><line x1="521" y1="276" x2="521" y2="290"/></g>
  </g>
  <text x="440" y="318" font-size="12" fill="#6a994e" text-anchor="middle">measure gene expression per cell</text>

  <!-- arrow: gene-expression space -->
  <line x1="553" y1="172" x2="620" y2="172" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="580" y="146" font-size="12" fill="#2a6f97" text-anchor="middle" font-weight="bold">gene-expression</text>
  <text x="580" y="160" font-size="12" fill="#2a6f97" text-anchor="middle" font-weight="bold">space</text>

  <!-- ============ PANEL 3: POINTS IN GENE SPACE ============ -->
  <text x="758" y="38" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Points in gene space</text>

  <!-- scatter frame -->
  <rect x="642" y="58" width="228" height="232" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <!-- faint grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="642" y1="116" x2="870" y2="116"/>
    <line x1="642" y1="174" x2="870" y2="174"/>
    <line x1="642" y1="232" x2="870" y2="232"/>
    <line x1="699" y1="58" x2="699" y2="290"/>
    <line x1="756" y1="58" x2="756" y2="290"/>
    <line x1="813" y1="58" x2="813" y2="290"/>
  </g>

  <!-- axis labels -->
  <text x="756" y="312" font-size="13" fill="#1b2a3a" text-anchor="middle">gene A</text>
  <text x="637" y="174" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 637 174)">gene B</text>
  <text x="862" y="76" font-size="11" fill="#8a99a8" text-anchor="end">(really ~2000 gene axes)</text>

  <!-- teal cluster: lower-left -->
  <g fill="#2a6f97">
    <circle cx="678" cy="256" r="5.5"/>
    <circle cx="694" cy="262" r="5.5"/>
    <circle cx="685" cy="272" r="5.5"/>
    <circle cx="702" cy="252" r="5.5"/>
    <circle cx="690" cy="245" r="5.5"/>
  </g>
  <!-- orange cluster: upper-middle -->
  <g fill="#d97706">
    <circle cx="748" cy="106" r="5.5"/>
    <circle cx="763" cy="110" r="5.5"/>
    <circle cx="754" cy="120" r="5.5"/>
    <circle cx="769" cy="100" r="5.5"/>
    <circle cx="758" cy="94"  r="5.5"/>
  </g>
  <!-- purple cluster: right -->
  <g fill="#7b4fa3">
    <circle cx="828" cy="180" r="5.5"/>
    <circle cx="844" cy="184" r="5.5"/>
    <circle cx="835" cy="194" r="5.5"/>
    <circle cx="850" cy="174" r="5.5"/>
    <circle cx="839" cy="200" r="5.5"/>
  </g>

  <!-- caption under panel 3 -->
  <text x="756" y="345" font-size="12.5" fill="#1b2a3a" text-anchor="middle">same type → similar expression → nearby points</text>
</svg>
