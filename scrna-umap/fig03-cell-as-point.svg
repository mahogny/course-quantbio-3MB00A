<svg xmlns="http://www.w3.org/2000/svg" width="807.6" height="405.1" viewBox="18.1 -1.0 807.6 405.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===== LEFT PANEL: data matrix X ===== -->
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#1b2a3a">Data matrix X</text>

  <!-- column labels (genes) -->
  <text x="150" y="58" font-size="12" fill="#2a6f97">gene 1</text>
  <text x="205" y="58" font-size="12" fill="#2a6f97">gene 2</text>
  <text x="262" y="58" font-size="12" fill="#2a6f97">gene 3</text>
  <text x="320" y="58" font-size="12" fill="#2a6f97">gene 4</text>
  <text x="376" y="58" font-size="15" fill="#2a6f97">...</text>
  <text x="392" y="58" font-size="12" fill="#2a6f97">gene g</text>

  <!-- grid: 5 shown rows x 5 shown cols, cell 42 x 26 -->
  <!-- background light cells -->
  <g fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5">
    <!-- row cell 1 (y 65) -->
    <rect x="150" y="65" width="42" height="26"/><rect x="192" y="65" width="42" height="26"/><rect x="234" y="65" width="42" height="26"/><rect x="276" y="65" width="42" height="26"/><rect x="318" y="65" width="42" height="26"/><rect x="360" y="65" width="30" height="26"/><rect x="390" y="65" width="42" height="26"/>
    <!-- row cell 2 -->
    <rect x="150" y="91" width="42" height="26"/><rect x="192" y="91" width="42" height="26"/><rect x="234" y="91" width="42" height="26"/><rect x="276" y="91" width="42" height="26"/><rect x="318" y="91" width="42" height="26"/><rect x="360" y="91" width="30" height="26"/><rect x="390" y="91" width="42" height="26"/>
  </g>

  <!-- highlighted row cell i (y 117) -->
  <g fill="#f6dcdd" stroke="#bc4749" stroke-width="2">
    <rect x="150" y="117" width="42" height="26"/><rect x="192" y="117" width="42" height="26"/><rect x="234" y="117" width="42" height="26"/><rect x="276" y="117" width="42" height="26"/><rect x="318" y="117" width="42" height="26"/><rect x="360" y="117" width="30" height="26"/><rect x="390" y="117" width="42" height="26"/>
  </g>
  <!-- numeric entries in highlighted row -->
  <g font-size="13" fill="#bc4749" font-weight="bold" text-anchor="middle">
    <text x="171" y="135">0.0</text><text x="213" y="135">1.2</text><text x="255" y="135">0.0</text><text x="297" y="135">3.4</text><text x="339" y="135">0.7</text><text x="375" y="135">...</text><text x="411" y="135">2.1</text>
  </g>

  <!-- more light rows -->
  <g fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5">
    <rect x="150" y="143" width="42" height="26"/><rect x="192" y="143" width="42" height="26"/><rect x="234" y="143" width="42" height="26"/><rect x="276" y="143" width="42" height="26"/><rect x="318" y="143" width="42" height="26"/><rect x="360" y="143" width="30" height="26"/><rect x="390" y="143" width="42" height="26"/>
  </g>

  <!-- vertical dots for many rows -->
  <text x="290" y="188" font-size="18" fill="#8a97a5" text-anchor="middle">⋮</text>

  <g fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5">
    <rect x="150" y="196" width="42" height="26"/><rect x="192" y="196" width="42" height="26"/><rect x="234" y="196" width="42" height="26"/><rect x="276" y="196" width="42" height="26"/><rect x="318" y="196" width="42" height="26"/><rect x="360" y="196" width="30" height="26"/><rect x="390" y="196" width="42" height="26"/>
  </g>

  <!-- row labels (cells) -->
  <g font-size="12" fill="#1b2a3a" text-anchor="end">
    <text x="143" y="82">cell 1</text>
    <text x="143" y="108">cell 2</text>
    <text x="143" y="209">cell n</text>
  </g>
  <text x="143" y="134" font-size="13" font-weight="bold" fill="#bc4749" text-anchor="end">cell i</text>
  <text x="96" y="230" font-size="11" fill="#6a994e">n = thousands of cells</text>
  <text x="150" y="252" font-size="11" fill="#6a994e">g ≈ 2000 genes (columns)</text>

  <!-- curved arrow: row i -> one point -->
  <path d="M 432 130 C 490 130, 500 175, 545 190" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="118" font-size="13" fill="#2a6f97" font-weight="bold">row i → one point</text>

  <!-- ===== RIGHT PANEL: g-dimensional space scatter ===== -->
  <text x="565" y="34" font-size="17" font-weight="bold" fill="#1b2a3a">g-dimensional gene space</text>
  <text x="565" y="52" font-size="11" fill="#8a97a5">(one axis per gene, ~2000 total; schematic in 2D)</text>

  <!-- axes -->
  <line x1="565" y1="300" x2="565" y2="80" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="565" y1="300" x2="800" y2="300" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="548" y="90" font-size="13" fill="#2a6f97" text-anchor="middle">gene 2</text>
  <text x="795" y="318" font-size="13" fill="#2a6f97" text-anchor="end">gene 1</text>

  <!-- grey dots (other cells) -->
  <g fill="#8a97a5">
    <circle cx="610" cy="255" r="5"/>
    <circle cx="655" cy="130" r="5"/>
    <circle cx="740" cy="110" r="5"/>
    <circle cx="765" cy="180" r="5"/>
    <circle cx="600" cy="180" r="5"/>
    <circle cx="700" cy="270" r="5"/>
    <circle cx="775" cy="255" r="5"/>
    <circle cx="640" cy="205" r="5"/>
  </g>

  <!-- two close highlighted dots x_i and x_j -->
  <line x1="695" y1="165" x2="730" y2="190" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="695" cy="165" r="7" fill="#bc4749"/>
  <circle cx="730" cy="190" r="7" fill="#6a994e"/>
  <text x="682" y="158" font-size="14" font-weight="bold" fill="#bc4749" text-anchor="end">x</text>
  <text x="691" y="161" font-size="10" fill="#bc4749">i</text>
  <text x="740" y="188" font-size="14" font-weight="bold" fill="#6a994e">x</text>
  <text x="750" y="191" font-size="10" fill="#6a994e">j</text>

  <!-- distance formula label -->
  <text x="700" y="230" font-size="14" fill="#bc4749" font-weight="bold" text-anchor="middle">||x_i − x_j||</text>
  <text x="700" y="248" font-size="11" fill="#6a994e" text-anchor="middle">small distance = similar cells</text>

  <!-- ===== bottom caption ===== -->
  <text x="410" y="378" font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">We must compress ~2000 dims to 2D without destroying who-is-near-whom.</text>
</svg>
