<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#bc4749"/>
    </marker>
    <marker id="ahRedStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#bc4749"/>
    </marker>
    <marker id="ahGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6a994e"/>
    </marker>
    <marker id="ahGrey" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c9d3dd"/>
    </marker>
  </defs>

  <!-- greyed, meaningless axes -->
  <line x1="55" y1="345" x2="645" y2="345" stroke="#c9d3dd" stroke-width="2" marker-end="url(#ahGrey)"/>
  <line x1="55" y1="345" x2="55" y2="95" stroke="#c9d3dd" stroke-width="2" marker-end="url(#ahGrey)"/>
  <text x="315" y="365" font-size="15" fill="#c9d3dd" font-style="italic">UMAP-1</text>
  <text x="34" y="235" font-size="15" fill="#c9d3dd" font-style="italic" transform="rotate(-90 34 235)">UMAP-2</text>
  <!-- axes struck out in red -->
  <line x1="300" y1="358" x2="372" y2="358" stroke="#bc4749" stroke-width="2"/>
  <line x1="27" y1="270" x2="27" y2="205" stroke="#bc4749" stroke-width="2"/>

  <!-- ===== islands ===== -->
  <!-- large teal island -->
  <g fill="#2a9d8f">
    <circle cx="205" cy="155" r="5.2"/><circle cx="225" cy="148" r="5.2"/><circle cx="250" cy="150" r="5.2"/><circle cx="272" cy="160" r="5.2"/>
    <circle cx="285" cy="180" r="5.2"/><circle cx="288" cy="205" r="5.2"/><circle cx="270" cy="222" r="5.2"/><circle cx="248" cy="232" r="5.2"/>
    <circle cx="222" cy="228" r="5.2"/><circle cx="200" cy="215" r="5.2"/><circle cx="190" cy="192" r="5.2"/><circle cx="198" cy="170" r="5.2"/>
    <circle cx="228" cy="168" r="5.2"/><circle cx="252" cy="178" r="5.2"/><circle cx="265" cy="198" r="5.2"/><circle cx="245" cy="205" r="5.2"/>
    <circle cx="222" cy="195" r="5.2"/><circle cx="210" cy="192" r="5.2"/><circle cx="238" cy="215" r="5.2"/><circle cx="262" cy="215" r="5.2"/>
    <circle cx="230" cy="185" r="5.2"/><circle cx="255" cy="225" r="5.2"/><circle cx="215" cy="175" r="5.2"/><circle cx="275" cy="198" r="5.2"/>
  </g>
  <!-- small orange island (close to teal) -->
  <g fill="#e08a2e">
    <circle cx="360" cy="150" r="5.2"/><circle cx="375" cy="145" r="5.2"/><circle cx="388" cy="152" r="5.2"/><circle cx="392" cy="168" r="5.2"/>
    <circle cx="380" cy="175" r="5.2"/><circle cx="365" cy="170" r="5.2"/><circle cx="355" cy="162" r="5.2"/><circle cx="378" cy="160" r="5.2"/>
    <circle cx="370" cy="178" r="5.2"/>
  </g>
  <!-- purple island (far away, wide gap) -->
  <g fill="#7b4f9d">
    <circle cx="560" cy="210" r="5.2"/><circle cx="578" cy="202" r="5.2"/><circle cx="598" cy="208" r="5.2"/><circle cx="615" cy="222" r="5.2"/>
    <circle cx="618" cy="242" r="5.2"/><circle cx="605" cy="258" r="5.2"/><circle cx="588" cy="268" r="5.2"/><circle cx="568" cy="262" r="5.2"/>
    <circle cx="552" cy="245" r="5.2"/><circle cx="548" cy="225" r="5.2"/><circle cx="572" cy="225" r="5.2"/><circle cx="592" cy="232" r="5.2"/>
    <circle cx="608" cy="240" r="5.2"/><circle cx="580" cy="248" r="5.2"/><circle cx="600" cy="225" r="5.2"/>
  </g>

  <!-- ===== GREEN: allowed readings ===== -->
  <!-- G2 bracket around all islands -->
  <path d="M185,116 L185,106 L627,106 L627,116" fill="none" stroke="#6a994e" stroke-width="2"/>
  <path d="M406,106 L406,98" fill="none" stroke="#6a994e" stroke-width="2"/>
  <path d="M262,84 l5,6 l12,-14" fill="none" stroke="#6a994e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="288" y="92" font-size="14.5" fill="#1b2a3a">Several distinct islands  →  several populations  <tspan fill="#6a994e" font-weight="bold">OK</tspan></text>

  <!-- G1 arrow inside teal island -->
  <line x1="150" y1="182" x2="205" y2="190" stroke="#6a994e" stroke-width="2.2" marker-end="url(#ahGreen)"/>
  <path d="M56,150 l5,6 l12,-14" fill="none" stroke="#6a994e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="160" font-size="12.5" fill="#1b2a3a">Same tight island</text>
  <text x="78" y="176" font-size="12.5" fill="#1b2a3a">= similar cells  <tspan fill="#6a994e" font-weight="bold">OK</tspan></text>

  <!-- ===== RED: forbidden readings ===== -->
  <!-- R1 double-headed arrow across the wide gap -->
  <line x1="401" y1="168" x2="541" y2="222" stroke="#bc4749" stroke-width="2.2" marker-start="url(#ahRedStart)" marker-end="url(#ahRed)"/>
  <g transform="translate(430,120)">
    <line x1="0" y1="0" x2="12" y2="12" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="0" y2="12" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="450" y="132" font-size="12.5" fill="#1b2a3a">Gap size is NOT how</text>
  <text x="450" y="148" font-size="12.5" fill="#1b2a3a">different the populations are</text>

  <!-- R2 diameter arrow across the large teal island -->
  <line x1="188" y1="255" x2="292" y2="255" stroke="#bc4749" stroke-width="2.2" marker-start="url(#ahRedStart)" marker-end="url(#ahRed)"/>
  <g transform="translate(120,270)">
    <line x1="0" y1="0" x2="12" y2="12" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="0" y2="12" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="140" y="282" font-size="12.5" fill="#1b2a3a">Island size / spread is NOT</text>
  <text x="140" y="298" font-size="12.5" fill="#1b2a3a">variability or abundance</text>

  <!-- R3 note: axes mean nothing -->
  <g transform="translate(430,352)">
    <line x1="0" y1="0" x2="12" y2="12" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="0" y2="12" stroke="#bc4749" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="450" y="363" font-size="12.5" fill="#1b2a3a">Axes mean nothing — do not report values</text>

  <!-- R4 rotation / flip icon (corner) -->
  <g transform="translate(830,60)">
    <path d="M-18,0 A18,18 0 1 1 -12.7,12.7" fill="none" stroke="#bc4749" stroke-width="2.4"/>
    <path d="M-12.7,12.7 l-8,-1 l3,7 z" fill="#bc4749"/>
    <path d="M18,0 A18,18 0 0 1 12.7,-12.7" fill="none" stroke="#bc4749" stroke-width="2.4"/>
    <path d="M12.7,-12.7 l8,1 l-3,-7 z" fill="#bc4749"/>
  </g>
  <text x="805" y="38" font-size="12.5" fill="#1b2a3a" text-anchor="end">Rotations &amp; flips are arbitrary:</text>
  <text x="805" y="54" font-size="12.5" fill="#1b2a3a" text-anchor="end">new seed = different-looking,</text>
  <text x="805" y="70" font-size="12.5" fill="#1b2a3a" text-anchor="end">equivalent picture</text>

  <!-- ===== bottom banner ===== -->
  <rect x="40" y="390" width="820" height="26" rx="6" fill="#eaf1f7"/>
  <text x="450" y="408" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">local = trustworthy,  global = decorative.</text>
</svg>
