<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="axtip" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c9d3dd"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL: kNN graph on curled manifold ============ -->
  <text x="30" y="28" font-size="15" font-weight="bold" fill="#1b2a3a">kNN graph on a curled manifold</text>

  <!-- faint 3D gene space box -->
  <g fill="none" stroke="#c9d3dd" stroke-width="1.5">
    <path d="M40,70 L250,70 L290,45 L80,45 Z"/>
    <path d="M40,70 L40,300 L250,300 L250,70"/>
    <path d="M250,70 L290,45 L290,275 L250,300"/>
    <path d="M40,300 L80,275 L290,275" stroke-dasharray="4 4"/>
    <path d="M80,275 L80,45" stroke-dasharray="4 4"/>
  </g>
  <text x="46" y="88" font-size="11" fill="#8a98a6" font-style="italic">gene space (high-D)</text>

  <!-- curled / bent sheet drawn in perspective -->
  <path d="M70,235 C110,120 175,110 210,150 C240,185 200,235 150,230 C120,227 105,210 120,190 C132,175 155,178 160,195"
        fill="#eaf1f7" fill-opacity="0.55" stroke="#9fb2c4" stroke-width="1.5"/>
  <path d="M78,238 C118,128 178,120 210,158" fill="none" stroke="#c9d3dd" stroke-width="1"/>
  <path d="M95,235 C130,150 180,140 205,172" fill="none" stroke="#c9d3dd" stroke-width="1"/>

  <!-- kNN edges + coloured cells sitting on the manifold -->
  <g stroke="#9fb2c4" stroke-width="1.2" opacity="0.8">
    <!-- teal cluster edges -->
    <line x1="95" y1="205" x2="118" y2="185"/>
    <line x1="118" y1="185" x2="140" y2="200"/>
    <line x1="95" y1="205" x2="140" y2="200"/>
    <line x1="118" y1="185" x2="108" y2="215"/>
    <line x1="108" y1="215" x2="140" y2="200"/>
    <!-- orange cluster edges -->
    <line x1="150" y1="150" x2="172" y2="138"/>
    <line x1="172" y1="138" x2="190" y2="158"/>
    <line x1="150" y1="150" x2="190" y2="158"/>
    <line x1="172" y1="138" x2="165" y2="168"/>
    <!-- purple cluster edges -->
    <line x1="90" y1="160" x2="112" y2="148"/>
    <line x1="112" y1="148" x2="128" y2="165"/>
    <line x1="90" y1="160" x2="128" y2="165"/>
    <line x1="112" y1="148" x2="100" y2="178"/>
    <!-- a couple of sparse cross-links -->
    <line x1="128" y1="165" x2="150" y2="150" stroke-dasharray="3 3"/>
    <line x1="140" y1="200" x2="165" y2="168" stroke-dasharray="3 3"/>
  </g>

  <!-- teal dots -->
  <g fill="#2a6f97" stroke="#ffffff" stroke-width="1">
    <circle cx="95" cy="205" r="5"/>
    <circle cx="118" cy="185" r="5"/>
    <circle cx="140" cy="200" r="5"/>
    <circle cx="108" cy="215" r="5"/>
  </g>
  <!-- orange dots -->
  <g fill="#e08c2f" stroke="#ffffff" stroke-width="1">
    <circle cx="150" cy="150" r="5"/>
    <circle cx="172" cy="138" r="5"/>
    <circle cx="190" cy="158" r="5"/>
    <circle cx="165" cy="168" r="5"/>
  </g>
  <!-- purple dots -->
  <g fill="#8e5aa8" stroke="#ffffff" stroke-width="1">
    <circle cx="90" cy="160" r="5"/>
    <circle cx="112" cy="148" r="5"/>
    <circle cx="128" cy="165" r="5"/>
    <circle cx="100" cy="178" r="5"/>
  </g>

  <text x="46" y="330" font-size="12.5" fill="#1b2a3a">cells lie on a smooth curled sheet;</text>
  <text x="46" y="348" font-size="12.5" fill="#1b2a3a">edges join near neighbours only</text>

  <!-- ============ MIDDLE: big arrow + label ============ -->
  <line x1="315" y1="185" x2="520" y2="185" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="418" y="130" font-size="14" font-weight="bold" fill="#1b2a3a" text-anchor="middle">UMAP: non-linear layout</text>
  <text x="418" y="152" font-size="12" fill="#1b2a3a" text-anchor="middle">stretch &amp; bend locally to fit a flat page;</text>
  <text x="418" y="218" font-size="12" fill="#1b2a3a" text-anchor="middle">keep neighbours close,</text>
  <text x="418" y="235" font-size="12" fill="#1b2a3a" text-anchor="middle">push non-neighbours apart</text>

  <!-- ============ RIGHT PANEL: UMAP 2D ============ -->
  <text x="560" y="28" font-size="15" font-weight="bold" fill="#1b2a3a">UMAP 2D</text>

  <!-- faint / greyed axes (no meaning) -->
  <line x1="560" y1="330" x2="560" y2="60" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#axtip)"/>
  <line x1="560" y1="330" x2="850" y2="330" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#axtip)"/>
  <text x="705" y="352" font-size="12" fill="#a7b3bf" text-anchor="middle">UMAP-1</text>
  <text x="548" y="195" font-size="12" fill="#a7b3bf" text-anchor="middle" transform="rotate(-90 548 195)">UMAP-2</text>

  <!-- three tight, well-separated islands -->
  <!-- teal island -->
  <ellipse cx="640" cy="120" rx="34" ry="30" fill="#2a6f97" fill-opacity="0.10" stroke="#2a6f97" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#2a6f97" stroke="#ffffff" stroke-width="0.8">
    <circle cx="632" cy="112" r="4.5"/><circle cx="648" cy="116" r="4.5"/>
    <circle cx="638" cy="128" r="4.5"/><circle cx="654" cy="128" r="4.5"/>
    <circle cx="626" cy="124" r="4.5"/><circle cx="645" cy="104" r="4.5"/>
    <circle cx="660" cy="118" r="4.5"/>
  </g>

  <!-- orange island -->
  <ellipse cx="780" cy="160" rx="34" ry="30" fill="#e08c2f" fill-opacity="0.12" stroke="#e08c2f" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#e08c2f" stroke="#ffffff" stroke-width="0.8">
    <circle cx="772" cy="152" r="4.5"/><circle cx="788" cy="156" r="4.5"/>
    <circle cx="778" cy="168" r="4.5"/><circle cx="794" cy="168" r="4.5"/>
    <circle cx="766" cy="164" r="4.5"/><circle cx="785" cy="144" r="4.5"/>
    <circle cx="800" cy="158" r="4.5"/>
  </g>

  <!-- purple island -->
  <ellipse cx="670" cy="262" rx="34" ry="30" fill="#8e5aa8" fill-opacity="0.12" stroke="#8e5aa8" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#8e5aa8" stroke="#ffffff" stroke-width="0.8">
    <circle cx="662" cy="254" r="4.5"/><circle cx="678" cy="258" r="4.5"/>
    <circle cx="668" cy="270" r="4.5"/><circle cx="684" cy="270" r="4.5"/>
    <circle cx="656" cy="266" r="4.5"/><circle cx="675" cy="246" r="4.5"/>
    <circle cx="690" cy="260" r="4.5"/>
  </g>

  <text x="705" y="386" font-size="12.5" fill="#6a994e" text-anchor="middle" font-weight="bold">tight islands of similar cells, visibly separated</text>

  <!-- ============ footnote ============ -->
  <text x="440" y="404" font-size="10.5" fill="#8a98a6" text-anchor="middle" font-style="italic">t-SNE has the same goal; UMAP is faster. Both are visualization tools, neither is more correct.</text>
</svg>
