<svg xmlns="http://www.w3.org/2000/svg" width="759.8" height="385.4" viewBox="38.6 37.3 759.8 385.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== axes ===== -->
  <!-- plot area: x ctrl=170 treat=470 ; y expression -->
  <line x1="150" y1="70" x2="150" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="150" y1="330" x2="560" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="60" y="80" font-size="15" fill="#1b2a3a">expression</text>
  <text x="170" y="352" font-size="15" fill="#1b2a3a" text-anchor="middle">ctrl</text>
  <text x="470" y="352" font-size="15" fill="#1b2a3a" text-anchor="middle">treat</text>
  <text x="530" y="352" font-size="14" fill="#1b2a3a">treatment</text>

  <!-- x category guide lines -->
  <line x1="170" y1="70" x2="170" y2="330" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="470" y1="70" x2="470" y2="330" stroke="#c9d3dd" stroke-width="1"/>

  <!-- ===== data points (coordinates) =====
       Female (F): ctrl y=280  treat y=210   (rise = 70 = β1)
       Male   (M): ctrl y=240  treat y=110   (gap at ctrl = 40 = β2 ; rise = 130)
       Male parallel-hypothetical end: 240 - 70 = 170
       β3 = 170 - 110 = 60 (extra rise) -->

  <!-- reference baseline for β0: horizontal from axis to F-ctrl point -->
  <line x1="150" y1="280" x2="170" y2="280" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Female line (accent blue) -->
  <line x1="170" y1="280" x2="470" y2="210" stroke="#2a6f97" stroke-width="2.5"/>
  <circle cx="170" cy="280" r="5" fill="#2a6f97"/>
  <circle cx="470" cy="210" r="5" fill="#2a6f97"/>

  <!-- Male line (accent red) -->
  <line x1="170" y1="240" x2="470" y2="110" stroke="#bc4749" stroke-width="2.5"/>
  <circle cx="170" cy="240" r="5" fill="#bc4749"/>
  <circle cx="470" cy="110" r="5" fill="#bc4749"/>

  <!-- Dashed hypothetical male continuation, parallel to female line -->
  <line x1="170" y1="240" x2="470" y2="170" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>
  <circle cx="470" cy="170" r="4" fill="none" stroke="#bc4749" stroke-width="1.5"/>

  <!-- legend -->
  <line x1="600" y1="64" x2="628" y2="64" stroke="#2a6f97" stroke-width="2.5"/>
  <text x="634" y="69" font-size="14" fill="#1b2a3a">female (F, reference)</text>
  <line x1="600" y1="86" x2="628" y2="86" stroke="#bc4749" stroke-width="2.5"/>
  <text x="634" y="91" font-size="14" fill="#1b2a3a">male (M)</text>
  <line x1="600" y1="108" x2="628" y2="108" stroke="#bc4749" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="634" y="113" font-size="14" fill="#1b2a3a">male if parallel (β<tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> = 0)</tspan></text>

  <!-- ===== β0 : height of F at ctrl ===== -->
  <line x1="150" y1="280" x2="150" y2="330" stroke="#6a994e" stroke-width="6" opacity="0.7"/>
  <text x="60" y="303" font-size="13" fill="#6a994e" font-weight="bold">β<tspan dy="4" font-size="9">0</tspan><tspan dy="-4"> = mean of</tspan></text>
  <text x="60" y="319" font-size="13" fill="#6a994e" font-weight="bold">ctrl, F (refs)</text>

  <!-- ===== beta2 : F to M gap at ctrl ===== -->
  <line x1="132" y1="280" x2="132" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="128" y1="280" x2="136" y2="280" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="128" y1="240" x2="136" y2="240" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="48" y="178" font-size="13" fill="#1b2a3a" font-weight="bold">β<tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> = M &#8722; F</tspan></text>
  <text x="48" y="194" font-size="13" fill="#1b2a3a" font-weight="bold">at ctrl</text>
  <line x1="92" y1="200" x2="131" y2="256" stroke="#1b2a3a" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ===== β1 : rise of female line ===== -->
  <!-- horizontal from F-ctrl height to treat, then vertical up to F-treat -->
  <line x1="170" y1="280" x2="490" y2="280" stroke="#2a6f97" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="490" y1="280" x2="490" y2="210" stroke="#2a6f97" stroke-width="2"/>
  <line x1="486" y1="280" x2="494" y2="280" stroke="#2a6f97" stroke-width="2"/>
  <line x1="486" y1="210" x2="494" y2="210" stroke="#2a6f97" stroke-width="2"/>
  <text x="500" y="252" font-size="13" fill="#2a6f97" font-weight="bold">β<tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> = treatment</tspan></text>
  <text x="500" y="268" font-size="13" fill="#2a6f97" font-weight="bold">effect in females</text>

  <!-- ===== β3 : extra rise of male beyond parallel ===== -->
  <!-- bracket between dashed-parallel end (170) and actual male end (110) at x just right of 470 -->
  <line x1="510" y1="170" x2="510" y2="110" stroke="#bc4749" stroke-width="2"/>
  <line x1="506" y1="170" x2="514" y2="170" stroke="#bc4749" stroke-width="2"/>
  <line x1="506" y1="110" x2="514" y2="110" stroke="#bc4749" stroke-width="2"/>
  <line x1="470" y1="170" x2="510" y2="170" stroke="#bc4749" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="522" y="138" font-size="13" fill="#bc4749" font-weight="bold">β<tspan dy="4" font-size="9">3</tspan><tspan dy="-4"> = extra treatment</tspan></text>
  <text x="522" y="154" font-size="13" fill="#bc4749" font-weight="bold">effect in males</text>
  <text x="522" y="170" font-size="12" fill="#bc4749">(difference of differences)</text>

  <!-- ===== boxed formula ===== -->
  <rect x="150" y="366" width="560" height="34" rx="6" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="165" y="388" font-size="15" fill="#1b2a3a">treatment effect in males = β<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> + β</tspan><tspan dy="4" font-size="10">3</tspan><tspan dy="-4">     (β</tspan><tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> = 0 → parallel lines → additive model)</tspan></text>
</svg>
