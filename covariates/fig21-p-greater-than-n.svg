<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif">
  <!-- fitting y = a + b x: one point (p = 2 > n = 1) vs two points (p = n = 2) -->
  <clipPath id="c1"><rect x="60" y="42" width="300" height="228"/></clipPath>
  <text x="210" y="26" font-size="19" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1 point, 2 unknowns (a, b)</text>
  <text x="210" y="48" font-size="15" fill="#5b6b7a" text-anchor="middle">p = 2 > n = 1</text>
  <line x1="60" y1="270" x2="360" y2="270" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="60" y2="42" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="360" y="294" font-size="16" fill="#1b2a3a" text-anchor="end">x</text>
  <text x="46" y="54" font-size="16" fill="#1b2a3a" text-anchor="end">y</text>
  <g clip-path="url(#c1)" stroke="#2a6f97" stroke-width="2.2">
    <line x1="-15" y1="19.2" x2="435" y2="292.8"/>
    <line x1="-15" y1="99.0" x2="435" y2="213.0"/>
    <line x1="-15" y1="156.0" x2="435" y2="156.0"/>
    <line x1="-15" y1="201.6" x2="435" y2="110.4"/>
    <line x1="-15" y1="270.0" x2="435" y2="42.0"/>
    <line x1="-15" y1="441.0" x2="435" y2="-129.0"/>
  </g>
  <circle cx="210" cy="156" r="8" fill="#1b2a3a"/>
  <text x="210" y="318" font-size="16" fill="#bc4749" font-weight="bold" text-anchor="middle">every line fits perfectly: no unique answer</text>
  <clipPath id="c2"><rect x="500" y="42" width="300" height="228"/></clipPath>
  <text x="650" y="26" font-size="19" font-weight="bold" fill="#1b2a3a" text-anchor="middle">2 points, 2 unknowns (a, b)</text>
  <text x="650" y="48" font-size="15" fill="#5b6b7a" text-anchor="middle">p = n = 2</text>
  <line x1="500" y1="270" x2="800" y2="270" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="500" y1="270" x2="500" y2="42" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="800" y="294" font-size="16" fill="#1b2a3a" text-anchor="end">x</text>
  <text x="486" y="54" font-size="16" fill="#1b2a3a" text-anchor="end">y</text>
  <g clip-path="url(#c2)" stroke="#6a994e" stroke-width="2.2">
    <line x1="425" y1="289.0" x2="875" y2="4.0"/>
  </g>
  <circle cx="575" cy="194" r="8" fill="#1b2a3a"/>
  <circle cx="725" cy="99.0" r="8" fill="#1b2a3a"/>
  <text x="650" y="318" font-size="16" fill="#5b6b7a" font-weight="bold" text-anchor="middle">one line, exact fit: no residuals left</text>
</svg>
