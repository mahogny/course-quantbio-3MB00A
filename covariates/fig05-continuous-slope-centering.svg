<svg xmlns="http://www.w3.org/2000/svg" width="604.9" height="367.6" viewBox="42.5 37.6 604.9 367.6" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="110" y1="330" x2="620" y2="330" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="110" y1="330" x2="110" y2="55" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arw)"/>
  <text x="365" y="360" text-anchor="middle" font-size="15" fill="#1b2a3a">age (years)</text>
  <text x="70" y="195" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 70 195)">expression</text>

  <!-- age 0 tick -->
  <text x="110" y="348" text-anchor="middle" font-size="12" fill="#5a6b7b">0</text>

  <!-- mean age dashed line -->
  <line x1="382" y1="330" x2="382" y2="120" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="388" y="322" font-size="12" fill="#5a6b7b">mean age (~30)</text>

  <!-- fitted regression line  y_hat = b0 + b1*age -->
  <line x1="110" y1="270" x2="610" y2="110" stroke="#2a6f97" stroke-width="2.2"/>
  <text x="500" y="95" font-size="14" fill="#2a6f97">&#375; = &#946;<tspan font-size="10" dy="3.5">0</tspan><tspan font-size="14" dy="-3.5"> + &#946;</tspan><tspan font-size="10" dy="3.5">1</tspan><tspan font-size="14" dy="-3.5">&#183;age</tspan></text>

  <!-- scattered points -->
  <g fill="#1b2a3a">
    <circle cx="140" cy="268" r="3.4"/>
    <circle cx="180" cy="255" r="3.4"/>
    <circle cx="220" cy="222" r="3.4"/>
    <circle cx="270" cy="230" r="3.4"/>
    <circle cx="320" cy="190" r="3.4"/>
    <circle cx="370" cy="198" r="3.4"/>
    <circle cx="430" cy="155" r="3.4"/>
    <circle cx="490" cy="158" r="3.4"/>
    <circle cx="560" cy="118" r="3.4"/>
  </g>

  <!-- slope triangle: rise over run -->
  <line x1="300" y1="209" x2="430" y2="209" stroke="#6a994e" stroke-width="1.8"/>
  <line x1="430" y1="209" x2="430" y2="168" stroke="#6a994e" stroke-width="1.8"/>
  <rect x="418" y="197" width="12" height="12" fill="none" stroke="#6a994e" stroke-width="1"/>
  <text x="355" y="226" text-anchor="middle" font-size="13" fill="#6a994e">+1 year</text>
  <text x="440" y="188" font-size="13" fill="#6a994e">&#946;<tspan font-size="9" dy="3">1</tspan><tspan font-size="13" dy="-3"> = slope</tspan></text>
  <text x="440" y="204" font-size="13" fill="#6a994e">(change per year)</text>

  <!-- beta0 intercept (age = 0) -->
  <circle cx="110" cy="270" r="5.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="112" y1="266" x2="150" y2="132" stroke="#1b2a3a" stroke-width="0.9"/>
  <text x="152" y="126" font-size="13" fill="#1b2a3a">&#946;<tspan font-size="9" dy="3">0</tspan><tspan font-size="13" dy="-3"> = expression at age 0</tspan></text>
  <text x="152" y="142" font-size="13" fill="#5a6b7b">(often meaningless)</text>

  <!-- centred intercept at mean age -->
  <circle cx="382" cy="183" r="5.5" fill="#ffffff" stroke="#bc4749" stroke-width="2"/>

  <!-- centering: shift origin to mean-age line -->
  <line x1="118" y1="78" x2="380" y2="78" stroke="#bc4749" stroke-width="1.8" marker-end="url(#arwR)"/>
  <text x="248" y="70" text-anchor="middle" font-size="12.5" fill="#bc4749">shift origin &#8594; mean age</text>

  <!-- centering caption -->
  <text x="110" y="385" font-size="13" fill="#bc4749">centre: I(age &#8722; mean(age)) &#8594; intercept now = expression at MEAN age;  slope unchanged</text>
</svg>
