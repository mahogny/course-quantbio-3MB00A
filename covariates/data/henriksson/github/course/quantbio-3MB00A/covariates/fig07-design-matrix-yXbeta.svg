<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="sans-serif">
  <!-- From formula to design matrix X : y = X beta + epsilon -->

  <!-- ================= y vector ================= -->
  <g>
    <text x="80" y="42" font-size="15" fill="#1b2a3a" text-anchor="middle">y = expression</text>
    <rect x="52" y="100" width="56" height="42" fill="#f2f5f8" stroke="#c9d3dd" stroke-width="1.5"/>
    <rect x="52" y="142" width="56" height="42" fill="#f2f5f8" stroke="#c9d3dd" stroke-width="1.5"/>
    <rect x="52" y="184" width="56" height="42" fill="#f2f5f8" stroke="#c9d3dd" stroke-width="1.5"/>
    <rect x="52" y="226" width="56" height="42" fill="#f2f5f8" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="80" y="127" font-size="16" fill="#1b2a3a" text-anchor="middle">y₁</text>
    <text x="80" y="169" font-size="16" fill="#1b2a3a" text-anchor="middle">y₂</text>
    <text x="80" y="211" font-size="16" fill="#1b2a3a" text-anchor="middle">y₃</text>
    <text x="80" y="253" font-size="16" fill="#1b2a3a" text-anchor="middle">y₄</text>
    <!-- brackets -->
    <path d="M47,100 L43,100 L43,268 L47,268" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
    <path d="M113,100 L117,100 L117,268 L113,268" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  </g>

  <text x="140" y="190" font-size="26" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- ================= X design matrix ================= -->
  <g>
    <!-- header row -->
    <rect x="168" y="58" width="98" height="40" fill="#e3edf5" stroke="#c9d3dd" stroke-width="1.5"/>
    <rect x="266" y="58" width="118" height="40" fill="#f6e6e6" stroke="#c9d3dd" stroke-width="1.5"/>
    <rect x="384" y="58" width="66"  height="40" fill="#ecf3e5" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="217" y="83" font-size="12.5" fill="#2a6f97" text-anchor="middle" font-weight="bold">(Intercept)</text>
    <text x="325" y="83" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">treatmenttreat</text>
    <text x="417" y="83" font-size="12.5" fill="#6a994e" text-anchor="middle" font-weight="bold">age</text>

    <!-- column 1 : intercept (blue) -->
    <rect x="168" y="100" width="98" height="42" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <rect x="168" y="142" width="98" height="42" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <rect x="168" y="184" width="98" height="42" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <rect x="168" y="226" width="98" height="42" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="217" y="127" font-size="16" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="217" y="169" font-size="16" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="217" y="211" font-size="16" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="217" y="253" font-size="16" fill="#1b2a3a" text-anchor="middle">1</text>

    <!-- column 2 : treatment dummy (red) -->
    <rect x="266" y="100" width="118" height="42" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/>
    <rect x="266" y="142" width="118" height="42" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/>
    <rect x="266" y="184" width="118" height="42" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/>
    <rect x="266" y="226" width="118" height="42" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/>
    <text x="325" y="127" font-size="16" fill="#1b2a3a" text-anchor="middle">0</text>
    <text x="325" y="169" font-size="16" fill="#1b2a3a" text-anchor="middle">1</text>
    <text x="325" y="211" font-size="16" fill="#1b2a3a" text-anchor="middle">0</text>
    <text x="325" y="253" font-size="16" fill="#1b2a3a" text-anchor="middle">1</text>

    <!-- column 3 : age continuous (green) -->
    <rect x="384" y="100" width="66" height="42" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
    <rect x="384" y="142" width="66" height="42" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
    <rect x="384" y="184" width="66" height="42" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
    <rect x="384" y="226" width="66" height="42" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
    <text x="417" y="127" font-size="16" fill="#1b2a3a" text-anchor="middle">10</text>
    <text x="417" y="169" font-size="16" fill="#1b2a3a" text-anchor="middle">40</text>
    <text x="417" y="211" font-size="16" fill="#1b2a3a" text-anchor="middle">22</text>
    <text x="417" y="253" font-size="16" fill="#1b2a3a" text-anchor="middle">35</text>

    <!-- brackets around whole X (data rows) -->
    <path d="M163,100 L159,100 L159,268 L163,268" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
    <path d="M455,100 L459,100 L459,268 L455,268" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
    <text x="309" y="292" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">X  (design matrix)</text>
  </g>

  <text x="482" y="190" font-size="22" fill="#1b2a3a" text-anchor="middle">·</text>

  <!-- ================= beta vector ================= -->
  <g>
    <rect x="500" y="121" width="52" height="42" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <rect x="500" y="163" width="52" height="42" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/>
    <rect x="500" y="205" width="52" height="42" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
    <text x="526" y="148" font-size="16" fill="#2a6f97" text-anchor="middle" font-weight="bold">β₀</text>
    <text x="526" y="190" font-size="16" fill="#bc4749" text-anchor="middle" font-weight="bold">β₁</text>
    <text x="526" y="232" font-size="16" fill="#6a994e" text-anchor="middle" font-weight="bold">β₂</text>
    <path d="M495,121 L491,121 L491,247 L495,247" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
    <path d="M557,121 L561,121 L561,247 L557,247" fill="none" stroke="#1b2a3a" stroke-width="1.8"/>
  </g>

  <text x="600" y="190" font-size="20" fill="#1b2a3a" text-anchor="middle">+ ε</text>

  <!-- ================= column tags / legend ================= -->
  <g font-size="12.5">
    <rect x="40" y="316" width="16" height="16" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="62" y="329" fill="#1b2a3a">intercept — column of ones</text>

    <rect x="238" y="316" width="16" height="16" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/>
    <text x="260" y="329" fill="#1b2a3a">treatment dummy (0/1)</text>

    <rect x="430" y="316" width="16" height="16" fill="#eef4e8" stroke="#6a994e" stroke-width="1.8"/>
    <text x="452" y="329" fill="#1b2a3a">continuous predictor</text>
  </g>

  <!-- ================= caption ================= -->
  <text x="340" y="366" font-size="13.5" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Choosing covariates = choosing the columns of X.</text>
  <text x="340" y="386" font-size="13" fill="#2a6f97" text-anchor="middle">Same X as in the matrices / linear-systems units.</text>
</svg>
