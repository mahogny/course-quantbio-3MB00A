<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="330" x2="560" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="330" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- x ticks -->
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <line x1="80" y1="330" x2="80" y2="335" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="80" y="348">10</text>
    <line x1="217.1" y1="330" x2="217.1" y2="335" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="217.1" y="348">20</text>
    <line x1="354.3" y1="330" x2="354.3" y2="335" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="354.3" y="348">30</text>
    <line x1="491.4" y1="330" x2="491.4" y2="335" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="491.4" y="348">40</text>
  </g>
  <text x="320" y="366" font-size="14" fill="#1b2a3a" text-anchor="middle">age (years)</text>
  <text x="30" y="195" font-size="14" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 30 195)">expression</text>

  <!-- group mean guide lines (raw means) -->
  <line x1="430" y1="157.2" x2="610" y2="157.2" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="430" y1="251.7" x2="610" y2="251.7" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="435" y="152" font-size="11" fill="#6b7885">treated group mean</text>
  <text x="435" y="247" font-size="11" fill="#6b7885">control group mean</text>

  <!-- control points (blue) -->
  <g fill="#2a6f97">
    <circle cx="107.4" cy="276.0" r="4"/>
    <circle cx="134.9" cy="257.1" r="4"/>
    <circle cx="148.6" cy="273.3" r="4"/>
    <circle cx="162.3" cy="240.9" r="4"/>
    <circle cx="176.0" cy="251.7" r="4"/>
    <circle cx="189.7" cy="259.8" r="4"/>
    <circle cx="217.1" cy="238.2" r="4"/>
    <circle cx="230.9" cy="262.5" r="4"/>
    <circle cx="244.6" cy="251.7" r="4"/>
    <circle cx="272.0" cy="232.8" r="4"/>
    <circle cx="299.4" cy="243.6" r="4"/>
    <circle cx="326.9" cy="222.0" r="4"/>
  </g>

  <!-- treated points (red) -->
  <g fill="#bc4749">
    <circle cx="272.0" cy="189.6" r="4"/>
    <circle cx="299.4" cy="170.7" r="4"/>
    <circle cx="326.9" cy="184.2" r="4"/>
    <circle cx="340.6" cy="143.7" r="4"/>
    <circle cx="354.3" cy="157.2" r="4"/>
    <circle cx="381.7" cy="170.7" r="4"/>
    <circle cx="395.4" cy="181.5" r="4"/>
    <circle cx="409.1" cy="146.4" r="4"/>
    <circle cx="436.6" cy="162.6" r="4"/>
    <circle cx="464.0" cy="135.6" r="4"/>
    <circle cx="491.4" cy="149.1" r="4"/>
    <circle cx="518.9" cy="127.5" r="4"/>
  </g>

  <!-- parallel fitted lines (same slope beta2) -->
  <line x1="80" y1="276" x2="560" y2="181.5" stroke="#2a6f97" stroke-width="2.2"/>
  <line x1="80" y1="222" x2="560" y2="127.5" stroke="#bc4749" stroke-width="2.2"/>

  <!-- beta1 : constant vertical gap between parallel lines (at age 30) -->
  <line x1="354.3" y1="168" x2="354.3" y2="222" stroke="#1b2a3a" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="354.3" y1="122" x2="354.3" y2="166" stroke="#6b7885" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="354.3" y="100" font-size="13.5" fill="#1b2a3a" text-anchor="middle">β1 = treatment effect, holding age</text>
  <text x="354.3" y="116" font-size="13.5" fill="#1b2a3a" text-anchor="middle">fixed (same gap at every age)</text>

  <!-- naive mean difference (taller arrow) -->
  <line x1="610" y1="157.2" x2="610" y2="251.7" stroke="#1b2a3a" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="625" y="188" font-size="13.5" fill="#1b2a3a">unadjusted gap =</text>
  <text x="625" y="205" font-size="13.5" fill="#1b2a3a">treatment effect + age</text>
  <text x="625" y="222" font-size="13.5" fill="#1b2a3a">effect (mixed, larger)</text>

  <!-- legend -->
  <g font-size="13" fill="#1b2a3a">
    <circle cx="100" cy="76" r="4" fill="#2a6f97"/>
    <text x="110" y="80">control</text>
    <circle cx="100" cy="96" r="4" fill="#bc4749"/>
    <text x="110" y="100">treated</text>
  </g>

  <!-- caption -->
  <text x="450" y="404" font-size="13" fill="#1b2a3a" text-anchor="middle" font-style="italic">expr ~ treatment + age splits variation into an age part (slope) and a treatment part (line spacing).</text>
</svg>
