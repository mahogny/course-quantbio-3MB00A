<svg xmlns="http://www.w3.org/2000/svg" viewBox="24.2 4.4 669.7 409.3" font-family="Helvetica, Arial, sans-serif" width="669.7" height="409.3">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL: additive ===================== -->
  <text x="210" y="34" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Additive  (expr ~ treatment + sex)</text>

  <!-- axes -->
  <line x1="95" y1="80" x2="95" y2="290" stroke="#1b2a3a" stroke-width="1.8"/>
  <line x1="95" y1="290" x2="330" y2="290" stroke="#1b2a3a" stroke-width="1.8"/>
  <!-- grid at category positions -->
  <line x1="150" y1="80" x2="150" y2="290" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="300" y1="80" x2="300" y2="290" stroke="#c9d3dd" stroke-width="1"/>
  <!-- y axis label -->
  <text x="52" y="188" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 52 188)">expression</text>
  <!-- x category labels -->
  <text x="150" y="308" font-size="13" fill="#1b2a3a" text-anchor="middle">ctrl</text>
  <text x="300" y="308" font-size="13" fill="#1b2a3a" text-anchor="middle">treat</text>

  <!-- F line (red) parallel -->
  <line x1="150" y1="235" x2="300" y2="175" stroke="#bc4749" stroke-width="2.4"/>
  <circle cx="150" cy="235" r="4.5" fill="#bc4749"/>
  <circle cx="300" cy="175" r="4.5" fill="#bc4749"/>
  <!-- M line (blue) parallel, same slope -->
  <line x1="150" y1="200" x2="300" y2="140" stroke="#2a6f97" stroke-width="2.4"/>
  <circle cx="150" cy="200" r="4.5" fill="#2a6f97"/>
  <circle cx="300" cy="140" r="4.5" fill="#2a6f97"/>

  <!-- equal slope tags -->
  <text x="252" y="152" font-size="12" fill="#2a6f97" transform="rotate(-22 252 152)">M</text>
  <text x="252" y="187" font-size="12" fill="#bc4749" transform="rotate(-22 252 187)">F</text>

  <!-- legend left -->
  <line x1="110" y1="98" x2="130" y2="98" stroke="#bc4749" stroke-width="2.4"/>
  <text x="135" y="102" font-size="12" fill="#bc4749">F</text>
  <line x1="110" y1="116" x2="130" y2="116" stroke="#2a6f97" stroke-width="2.4"/>
  <text x="135" y="120" font-size="12" fill="#2a6f97">M</text>

  <!-- annotation -->
  <text x="210" y="332" font-size="12.5" fill="#1b2a3a" text-anchor="middle">lines are PARALLEL: equal treatment</text>
  <text x="210" y="348" font-size="12.5" fill="#1b2a3a" text-anchor="middle">effect in both sexes → no interaction</text>

  <!-- ===================== RIGHT PANEL: interaction ===================== -->
  <text x="540" y="34" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Interaction  (expr ~ treatment * sex)</text>

  <!-- axes -->
  <line x1="425" y1="80" x2="425" y2="290" stroke="#1b2a3a" stroke-width="1.8"/>
  <line x1="425" y1="290" x2="660" y2="290" stroke="#1b2a3a" stroke-width="1.8"/>
  <line x1="480" y1="80" x2="480" y2="290" stroke="#c9d3dd" stroke-width="1"/>
  <line x1="630" y1="80" x2="630" y2="290" stroke="#c9d3dd" stroke-width="1"/>
  <text x="382" y="188" font-size="13" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 382 188)">expression</text>
  <text x="480" y="308" font-size="13" fill="#1b2a3a" text-anchor="middle">ctrl</text>
  <text x="630" y="308" font-size="13" fill="#1b2a3a" text-anchor="middle">treat</text>

  <!-- F line (red) nearly flat -->
  <line x1="480" y1="228" x2="630" y2="212" stroke="#bc4749" stroke-width="2.4"/>
  <circle cx="480" cy="228" r="4.5" fill="#bc4749"/>
  <circle cx="630" cy="212" r="4.5" fill="#bc4749"/>
  <!-- M line (blue) steep -->
  <line x1="480" y1="218" x2="630" y2="105" stroke="#2a6f97" stroke-width="2.4"/>
  <circle cx="480" cy="218" r="4.5" fill="#2a6f97"/>
  <circle cx="630" cy="105" r="4.5" fill="#2a6f97"/>

  <!-- fan-apart tags -->
  <text x="588" y="140" font-size="12" fill="#2a6f97" transform="rotate(-37 588 140)">M</text>
  <text x="588" y="214" font-size="12" fill="#bc4749" transform="rotate(-6 588 214)">F</text>

  <!-- gap bracket showing divergence at treat -->
  <line x1="648" y1="105" x2="648" y2="212" stroke="#6a994e" stroke-width="1.4"/>
  <line x1="644" y1="105" x2="652" y2="105" stroke="#6a994e" stroke-width="1.4"/>
  <line x1="644" y1="212" x2="652" y2="212" stroke="#6a994e" stroke-width="1.4"/>
  <text x="656" y="162" font-size="11.5" fill="#6a994e">gap</text>

  <!-- legend right -->
  <line x1="440" y1="98" x2="460" y2="98" stroke="#bc4749" stroke-width="2.4"/>
  <text x="465" y="102" font-size="12" fill="#bc4749">F</text>
  <line x1="440" y1="116" x2="460" y2="116" stroke="#2a6f97" stroke-width="2.4"/>
  <text x="465" y="120" font-size="12" fill="#2a6f97">M</text>

  <!-- annotation -->
  <text x="540" y="332" font-size="12.5" fill="#1b2a3a" text-anchor="middle">lines FAN APART: treatment effect larger</text>
  <text x="540" y="348" font-size="12.5" fill="#1b2a3a" text-anchor="middle">in one sex → interaction (treatment:sex term)</text>

  <!-- ===================== bottom note ===================== -->
  <rect x="120" y="368" width="480" height="26" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="360" y="385" font-size="13" fill="#1b2a3a" text-anchor="middle" font-family="monospace">treatment * sex  =  treatment + sex + treatment:sex</text>
</svg>
