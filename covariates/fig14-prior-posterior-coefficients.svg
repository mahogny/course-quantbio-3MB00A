<svg xmlns="http://www.w3.org/2000/svg" width="700.0" height="393.0" viewBox="0.0 32.1 700.0 393.0" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="90" y1="300" x2="640" y2="300" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="300" x2="90" y2="55" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- x ticks -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="178.3" y1="300" x2="178.3" y2="305"/>
    <line x1="266.7" y1="300" x2="266.7" y2="305"/>
    <line x1="355"   y1="300" x2="355"   y2="305"/>
    <line x1="443.3" y1="300" x2="443.3" y2="305"/>
    <line x1="531.7" y1="300" x2="531.7" y2="305"/>
  </g>
  <g font-size="12" fill="#1b2a3a" text-anchor="middle">
    <text x="178.3" y="318">-4</text>
    <text x="266.7" y="318">-2</text>
    <text x="355"   y="318">0</text>
    <text x="443.3" y="318">2</text>
    <text x="531.7" y="318">4</text>
  </g>

  <!-- axis labels -->
  <text x="264" y="345" font-size="16" fill="#1b2a3a" text-anchor="start">β<tspan dy="4" font-size="11">1</tspan><tspan dy="-4"> (adjusted treatment effect)</tspan></text>
  <text x="60" y="180" font-size="16" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 60 180)">density</text>

  <!-- posterior 95% shaded region -->
  <path d="M 378.4 300.0 L 378.4 270.0 L 380.6 265.9 L 382.7 261.5 L 384.9 256.7 L 387.1 251.6 L 389.2 246.0 L 391.4 240.0 L 393.6 233.7 L 395.7 227.0 L 397.9 220.0 L 400.0 212.7 L 402.2 205.1 L 404.4 197.3 L 406.5 189.4 L 408.7 181.3 L 410.9 173.2 L 413.0 165.1 L 415.2 157.1 L 417.4 149.2 L 419.5 141.7 L 421.7 134.4 L 423.9 127.5 L 426.0 121.2 L 428.2 115.4 L 430.3 110.2 L 432.5 105.7 L 434.7 101.9 L 436.8 98.9 L 439.0 96.7 L 441.2 95.4 L 443.3 95.0 L 445.5 95.4 L 447.7 96.7 L 449.8 98.9 L 452.0 101.9 L 454.2 105.7 L 456.3 110.2 L 458.5 115.4 L 460.6 121.2 L 462.8 127.5 L 465.0 134.4 L 467.1 141.7 L 469.3 149.2 L 471.5 157.1 L 473.6 165.1 L 475.8 173.2 L 478.0 181.3 L 480.1 189.4 L 482.3 197.3 L 484.5 205.1 L 486.6 212.7 L 488.8 220.0 L 490.9 227.0 L 493.1 233.7 L 495.3 240.0 L 497.4 246.0 L 499.6 251.6 L 501.8 256.7 L 503.9 261.5 L 506.1 265.9 L 508.3 270.0 L 508.3 300.0 Z" fill="#2a6f97" fill-opacity="0.22"/>

  <!-- prior curve: wide, flat, weakly informative -->
  <path fill="none" stroke="#6a994e" stroke-width="2.5" stroke-opacity="0.85" d="M 90.0 290.5 L 103.2 288.7 L 116.5 286.8 L 129.8 284.6 L 143.0 282.1 L 156.2 279.5 L 169.5 276.8 L 182.8 273.8 L 196.0 270.8 L 209.2 267.7 L 222.5 264.6 L 235.7 261.5 L 249.0 258.5 L 262.2 255.7 L 275.5 253.0 L 288.8 250.7 L 302.0 248.7 L 315.2 247.1 L 328.5 246.0 L 341.8 245.2 L 355.0 245.0 L 368.2 245.2 L 381.5 246.0 L 394.8 247.1 L 408.0 248.7 L 421.2 250.7 L 434.5 253.0 L 447.7 255.7 L 461.0 258.5 L 474.2 261.5 L 487.5 264.6 L 500.8 267.7 L 514.0 270.8 L 527.2 273.8 L 540.5 276.8 L 553.8 279.5 L 567.0 282.1 L 580.2 284.6 L 593.5 286.8 L 606.8 288.7 L 620.0 290.5"/>

  <!-- posterior curve: narrow, tall, shifted -->
  <path fill="none" stroke="#2a6f97" stroke-width="2.5" d="M 328.5 299.5 L 337.3 298.8 L 346.2 297.2 L 355.0 294.1 L 363.8 288.5 L 372.7 278.9 L 381.5 264.1 L 390.3 243.0 L 399.2 215.7 L 408.0 183.9 L 416.8 151.1 L 425.7 122.2 L 434.5 102.2 L 443.3 95.0 L 452.2 102.2 L 461.0 122.2 L 469.8 151.1 L 478.7 183.9 L 487.5 215.7 L 496.3 243.0 L 505.2 264.1 L 514.0 278.9 L 522.8 288.5 L 531.7 294.1 L 540.5 297.2 L 549.3 298.8 L 558.2 299.5"/>

  <!-- 95% credible interval bar -->
  <g stroke="#2a6f97" stroke-width="2.5">
    <line x1="378.4" y1="286" x2="508.3" y2="286"/>
    <line x1="378.4" y1="280" x2="378.4" y2="292"/>
    <line x1="508.3" y1="280" x2="508.3" y2="292"/>
  </g>
  <text x="443.3" y="278" font-size="12.5" fill="#2a6f97" text-anchor="middle" font-weight="bold">95% credible interval</text>

  <!-- frequentist point estimate: vertical stick at posterior mean with CI whiskers -->
  <g stroke="#bc4749" stroke-width="2.5">
    <line x1="443.3" y1="118" x2="443.3" y2="266"/>
    <line x1="443.3" y1="282" x2="443.3" y2="300"/>
    <line x1="416" y1="128" x2="470.6" y2="128"/>
    <line x1="416" y1="122" x2="416" y2="134"/>
    <line x1="470.6" y1="122" x2="470.6" y2="134"/>
  </g>
  <circle cx="443.3" cy="118" r="4" fill="#bc4749"/>
  <text x="443.3" y="82" font-size="12.5" fill="#bc4749" text-anchor="middle" font-weight="bold">frequentist: single point estimate β + CI</text>

  <!-- curve labels -->
  <text x="205" y="235" font-size="13" fill="#6a994e" font-weight="bold">prior: normal(0, 5)</text>
  <text x="205" y="251" font-size="12" fill="#6a994e">weakly informative</text>
  <text x="545" y="175" font-size="14" fill="#2a6f97" font-weight="bold">posterior</text>
  <line x1="543" y1="173" x2="478" y2="181" stroke="#2a6f97" stroke-width="1.5"/>

  <!-- caption strip -->
  <rect x="20" y="352" width="660" height="40" rx="4" fill="#eaf1f7"/>
  <text x="30" y="368" font-size="12" fill="#1b2a3a">Same formula, same design matrix X, same linear predictor  β<tspan dy="3" font-size="8">0</tspan><tspan dy="-3"> + β</tspan><tspan dy="3" font-size="8">1</tspan><tspan dy="-3">x</tspan><tspan dy="3" font-size="8">1</tspan><tspan dy="-3"> + ... ;</tspan></text>
  <text x="30" y="385" font-size="12" fill="#1b2a3a">the Bayesian layer only adds a prior on each β and returns a full posterior per coefficient.</text>

  <!-- footnote -->
  <text x="30" y="410" font-size="11" fill="#5a6b7a" font-style="italic">count outcomes: swap error model (Poisson / NB, log link) — covariates still enter through Xβ.</text>
</svg>
