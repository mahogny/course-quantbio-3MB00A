<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4749"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- ===== Main DAG panel ===== -->
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#1b2a3a">Confounding: why it matters</text>

  <!-- age node (prominent common cause) -->
  <ellipse cx="300" cy="95" rx="66" ry="40" fill="#eaf1f7" stroke="#bc4749" stroke-width="3"/>
  <text x="300" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b2a3a">age</text>
  <text x="300" y="110" font-size="12" text-anchor="middle" fill="#7a5a5a">common cause</text>

  <!-- treatment group node -->
  <rect x="80" y="255" width="150" height="58" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="155" y="280" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">treatment</text>
  <text x="155" y="299" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">group</text>

  <!-- expression outcome node -->
  <rect x="370" y="255" width="160" height="58" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.8"/>
  <text x="450" y="280" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2a3a">expression</text>
  <text x="450" y="299" font-size="13" text-anchor="middle" fill="#1b2a3a">(outcome)</text>

  <!-- confounding arrows (red) -->
  <path d="M258 128 L172 250" fill="none" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <path d="M342 128 L432 250" fill="none" stroke="#bc4749" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <text x="300" y="200" font-size="13" font-weight="bold" text-anchor="middle" fill="#bc4749">confounding paths</text>
  <text x="300" y="217" font-size="12" text-anchor="middle" fill="#bc4749">age drives both</text>

  <!-- effect of interest (blue) -->
  <path d="M232 288 L364 288" fill="none" stroke="#2a6f97" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <text x="298" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#2a6f97">effect of interest</text>

  <!-- caption -->
  <text x="30" y="372" font-size="12.5" fill="#1b2a3a">A confounder influences BOTH the predictor and the outcome;</text>
  <text x="30" y="390" font-size="12.5" fill="#1b2a3a">ignoring it biases the estimated treatment effect.</text>

  <!-- ===== Simpson's paradox inset ===== -->
  <rect x="590" y="42" width="285" height="330" rx="10" fill="#ffffff" fill-opacity="0.0" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="732" y="80" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b2a3a">Simpson's paradox</text>

  <!-- axes -->
  <line x1="630" y1="315" x2="850" y2="315" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="630" y1="315" x2="630" y2="100" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="740" y="337" font-size="11" text-anchor="middle" fill="#1b2a3a">treatment level</text>
  <text x="622" y="205" font-size="11" text-anchor="middle" fill="#1b2a3a" transform="rotate(-90 622 205)">expression</text>

  <!-- young subgroup: helpful (up) -->
  <line x1="648" y1="290" x2="720" y2="245" stroke="#6a994e" stroke-width="2.6"/>
  <circle cx="648" cy="290" r="3.5" fill="#6a994e"/>
  <circle cx="684" cy="267" r="3.5" fill="#6a994e"/>
  <circle cx="720" cy="245" r="3.5" fill="#6a994e"/>
  <text x="668" y="238" font-size="11" fill="#6a994e" font-weight="bold">young</text>

  <!-- old subgroup: helpful (up), shifted lower/right -->
  <line x1="758" y1="205" x2="832" y2="160" stroke="#6a994e" stroke-width="2.6"/>
  <circle cx="758" cy="205" r="3.5" fill="#6a994e"/>
  <circle cx="795" cy="182" r="3.5" fill="#6a994e"/>
  <circle cx="832" cy="160" r="3.5" fill="#6a994e"/>
  <text x="782" y="152" font-size="11" fill="#6a994e" font-weight="bold">old</text>

  <!-- pooled trend: harmful (down) -->
  <line x1="648" y1="245" x2="832" y2="290" stroke="#bc4749" stroke-width="2.6" stroke-dasharray="7 4"/>
  <text x="700" y="308" font-size="11" fill="#bc4749" font-weight="bold">pooled trend</text>

  <text x="732" y="348" font-size="11" text-anchor="middle" fill="#1b2a3a">adjustment can reverse</text>
  <text x="732" y="363" font-size="11" text-anchor="middle" fill="#1b2a3a">the apparent effect</text>
</svg>
