<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.2 14.4 700.2 396.6" font-family="Helvetica, Arial, sans-serif" width="700.2" height="396.6">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- LEFT: factor sex column -->
  <text x="70" y="46" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">factor sex</text>
  <g font-family="monospace" font-size="18" text-anchor="middle">
    <rect x="35" y="60" width="70" height="40" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="70" y="86" fill="#1b2a3a">F</text>
    <rect x="35" y="100" width="70" height="40" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="70" y="126" fill="#1b2a3a">M</text>
    <rect x="35" y="140" width="70" height="40" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="70" y="166" fill="#1b2a3a">F</text>
    <rect x="35" y="180" width="70" height="40" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <text x="70" y="206" fill="#1b2a3a">M</text>
  </g>

  <!-- reference bracket on F rows -->
  <path d="M112 60 q8 0 8 8 v24 q0 8 8 8 q-8 0 -8 8 v24 q0 8 -8 8" fill="none" stroke="#bc4749" stroke-width="1.5"/>
  <text x="132" y="86" font-size="12.5" fill="#bc4749">F = reference</text>
  <text x="132" y="103" font-size="12.5" fill="#bc4749">→ absorbed into</text>
  <text x="132" y="120" font-size="12.5" fill="#bc4749">the intercept</text>
  <text x="132" y="137" font-size="12.5" fill="#bc4749">(no column)</text>

  <!-- big arrow -->
  <line x1="120" y1="245" x2="360" y2="245" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="240" y="235" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">treatment coding</text>

  <!-- RIGHT: (Intercept) column -->
  <text x="405" y="46" font-size="15" font-weight="bold" fill="#2a6f97" text-anchor="middle">(Intercept)</text>
  <g font-family="monospace" font-size="18" text-anchor="middle">
    <rect x="360" y="60" width="90" height="40" fill="#dbeafe" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="405" y="86" fill="#1b2a3a">1</text>
    <rect x="360" y="100" width="90" height="40" fill="#dbeafe" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="405" y="126" fill="#1b2a3a">1</text>
    <rect x="360" y="140" width="90" height="40" fill="#dbeafe" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="405" y="166" fill="#1b2a3a">1</text>
    <rect x="360" y="180" width="90" height="40" fill="#dbeafe" stroke="#2a6f97" stroke-width="1.8"/>
    <text x="405" y="206" fill="#1b2a3a">1</text>
  </g>

  <!-- sexM dummy column -->
  <text x="515" y="46" font-size="15" font-weight="bold" fill="#6a994e" text-anchor="middle">sexM</text>
  <g font-family="monospace" font-size="18" text-anchor="middle">
    <rect x="470" y="60" width="90" height="40" fill="#e7f0dd" stroke="#6a994e" stroke-width="1.8"/>
    <text x="515" y="86" fill="#1b2a3a">0</text>
    <rect x="470" y="100" width="90" height="40" fill="#e7f0dd" stroke="#6a994e" stroke-width="1.8"/>
    <text x="515" y="126" fill="#1b2a3a">1</text>
    <rect x="470" y="140" width="90" height="40" fill="#e7f0dd" stroke="#6a994e" stroke-width="1.8"/>
    <text x="515" y="166" fill="#1b2a3a">0</text>
    <rect x="470" y="180" width="90" height="40" fill="#e7f0dd" stroke="#6a994e" stroke-width="1.8"/>
    <text x="515" y="206" fill="#1b2a3a">1</text>
  </g>

  <!-- sexM annotation -->
  <line x1="565" y1="140" x2="600" y2="140" stroke="#6a994e" stroke-width="1.5"/>
  <text x="605" y="132" font-size="12.5" fill="#6a994e">coefficient =</text>
  <text x="605" y="149" font-size="12.5" fill="#6a994e">male − female</text>
  <text x="605" y="166" font-size="12.5" fill="#6a994e">difference</text>

  <!-- second tiny factor to reinforce -->
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <text x="405" y="288" font-family="Helvetica, Arial" font-size="12.5" fill="#1b2a3a" text-anchor="middle">treatment: ctrl / treat  →  dummy  treatmenttreat</text>
    <rect x="360" y="298" width="34" height="26" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/><text x="377" y="316" fill="#1b2a3a">ctrl</text>
    <rect x="360" y="324" width="34" height="26" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.2"/><text x="377" y="342" fill="#1b2a3a">treat</text>
    <text x="410" y="316" font-family="Helvetica, Arial" font-size="16" fill="#1b2a3a">→</text>
    <text x="410" y="342" font-family="Helvetica, Arial" font-size="16" fill="#1b2a3a">→</text>
    <rect x="430" y="298" width="34" height="26" fill="#e7f0dd" stroke="#6a994e" stroke-width="1.4"/><text x="447" y="316" fill="#1b2a3a">0</text>
    <rect x="430" y="324" width="34" height="26" fill="#e7f0dd" stroke="#6a994e" stroke-width="1.4"/><text x="447" y="342" fill="#1b2a3a">1</text>
  </g>

  <!-- bottom note strip -->
  <rect x="35" y="360" width="650" height="30" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="360" y="380" font-size="13" fill="#1b2a3a" text-anchor="middle">k levels → k−1 dummy columns · reference chosen alphabetically (F before M, ctrl before treat) — set with relevel()</text>
</svg>
