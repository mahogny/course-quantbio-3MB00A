<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahB" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahR" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#bc4749"/>
    </marker>
    <marker id="ahG" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#6a994e"/>
    </marker>
  </defs>

  <!-- column labels -->
  <text x="150" y="42" text-anchor="middle" font-size="16" fill="#1b2a3a" font-style="italic">t = 1</text>
  <text x="360" y="42" text-anchor="middle" font-size="16" fill="#1b2a3a" font-style="italic">t = 2</text>
  <text x="570" y="42" text-anchor="middle" font-size="16" fill="#1b2a3a" font-style="italic">t = 3</text>

  <!-- row labels -->
  <text x="52" y="98" text-anchor="middle" font-size="17" fill="#1b2a3a" font-weight="bold">H</text>
  <text x="52" y="203" text-anchor="middle" font-size="17" fill="#1b2a3a" font-weight="bold">L</text>

  <!-- ALL transition edges (light grey) -->
  <!-- gap 1 -> 2 -->
  <line x1="174" y1="90" x2="336" y2="90" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <line x1="174" y1="90" x2="336" y2="195" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <line x1="174" y1="195" x2="336" y2="90" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <line x1="174" y1="195" x2="336" y2="195" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <!-- gap 2 -> 3 -->
  <line x1="384" y1="90" x2="546" y2="90" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <line x1="384" y1="90" x2="546" y2="195" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <line x1="384" y1="195" x2="546" y2="90" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>
  <line x1="384" y1="195" x2="546" y2="195" stroke="#c9d3dd" stroke-width="1.5" marker-end="url(#ah)" opacity="0.5"/>

  <!-- Highlighted path 1: H-H-L (blue) -->
  <line x1="174" y1="86" x2="336" y2="86" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#ahB)"/>
  <line x1="384" y1="86" x2="546" y2="191" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#ahB)"/>

  <!-- Highlighted path 2: H-H-H (green) -->
  <line x1="174" y1="94" x2="336" y2="94" stroke="#6a994e" stroke-width="2.5" marker-end="url(#ahG)"/>
  <line x1="384" y1="94" x2="546" y2="94" stroke="#6a994e" stroke-width="2.5" marker-end="url(#ahG)"/>

  <!-- Highlighted path 3: L-H-L (red) -->
  <line x1="174" y1="199" x2="336" y2="98" stroke="#bc4749" stroke-width="2.5" marker-end="url(#ahR)"/>
  <line x1="384" y1="98" x2="546" y2="199" stroke="#bc4749" stroke-width="2.5" marker-end="url(#ahR)"/>

  <!-- nodes -->
  <g>
    <circle cx="150" cy="90" r="24" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <circle cx="360" cy="90" r="24" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <circle cx="570" cy="90" r="24" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <circle cx="150" cy="195" r="24" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <circle cx="360" cy="195" r="24" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
    <circle cx="570" cy="195" r="24" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  </g>
  <g font-size="16" fill="#1b2a3a" text-anchor="middle">
    <text x="150" y="95">H</text><text x="360" y="95">H</text><text x="570" y="95">H</text>
    <text x="150" y="200">L</text><text x="360" y="200">L</text><text x="570" y="200">L</text>
  </g>

  <!-- observations -->
  <line x1="120" y1="248" x2="600" y2="248" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="52" y="277" text-anchor="middle" font-size="15" fill="#1b2a3a" font-style="italic">x =</text>
  <g text-anchor="middle">
    <rect x="130" y="258" width="40" height="34" rx="5" fill="#f5f7fa" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="150" y="281" font-size="17" fill="#1b2a3a" font-weight="bold">G</text>
    <rect x="340" y="258" width="40" height="34" rx="5" fill="#f5f7fa" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="360" y="281" font-size="17" fill="#1b2a3a" font-weight="bold">C</text>
    <rect x="550" y="258" width="40" height="34" rx="5" fill="#f5f7fa" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="570" y="281" font-size="17" fill="#1b2a3a" font-weight="bold">A</text>
  </g>

  <!-- legend for the 3 paths -->
  <g font-size="13" fill="#1b2a3a">
    <line x1="620" y1="86" x2="644" y2="86" stroke="#2a6f97" stroke-width="2.5"/>
    <text x="650" y="90">H-H-L</text>
    <line x1="620" y1="106" x2="644" y2="106" stroke="#6a994e" stroke-width="2.5"/>
    <text x="650" y="110">H-H-H</text>
    <line x1="620" y1="126" x2="644" y2="126" stroke="#bc4749" stroke-width="2.5"/>
    <text x="650" y="130">L-H-L</text>
  </g>

  <!-- caption -->
  <text x="360" y="320" text-anchor="middle" font-size="14" fill="#1b2a3a">For 2 states, length 3 there are 2³ = 8 such paths</text>

  <!-- equation -->
  <text x="288" y="349" text-anchor="start" font-size="18" fill="#1b2a3a">P(x) =</text>
  <text x="352" y="352" text-anchor="middle" font-size="26" fill="#1b2a3a">∑</text>
  <text x="352" y="363" text-anchor="middle" font-style="italic" font-size="11" fill="#1b2a3a">z</text>
  <text x="352" y="372" text-anchor="middle" font-size="9.5" fill="#1b2a3a">all paths</text>
  <text x="372" y="349" text-anchor="start" font-size="18" fill="#1b2a3a">P(x, z)</text>

  <!-- note -->
  <text x="360" y="391" text-anchor="middle" font-size="13" fill="#2a6f97" font-style="italic">the forward algorithm sums these efficiently instead of enumerating</text>
</svg>
