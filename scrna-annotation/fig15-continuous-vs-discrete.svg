<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.8 2 850.4 342" font-family="Helvetica, Arial, sans-serif" width="850.4" height="342">
  <defs>
    <marker id="ahBlue" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahDark" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- panel divider -->
  <line x1="440" y1="42" x2="440" y2="258" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- ================= LEFT PANEL: continuum ================= -->
  <text x="230" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">differentiation is a continuum</text>

  <!-- tint box and arbitrary cut lines -->
  <rect x="40" y="42" width="395" height="180" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <line x1="168" y1="42" x2="168" y2="222" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="291" y1="42" x2="291" y2="222" stroke="#bc4749" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="106" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">type A</text>
  <text x="230" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">type B</text>
  <text x="353" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#bc4749">type C</text>

  <!-- pseudotime arrow riding above the arc -->
  <path d="M 65 172 Q 230 104 393 172" fill="none" stroke="#2a6f97" stroke-width="2" marker-end="url(#ahBlue)"/>
  <text x="230" y="120" text-anchor="middle" font-size="13" font-style="italic" fill="#2a6f97">pseudotime</text>

  <!-- arc of dots shading light to dark -->
  <circle cx="60"  cy="190"   r="7" fill="#cfe3f0"/>
  <circle cx="90.9" cy="175.9" r="7" fill="#bfd2e0"/>
  <circle cx="121.8" cy="163" r="7" fill="#aec1cf"/>
  <circle cx="152.7" cy="152.2" r="7" fill="#9eb1bf"/>
  <circle cx="183.6" cy="144.5" r="7" fill="#8ea0ae"/>
  <circle cx="214.5" cy="140.5" r="7" fill="#7d8f9e"/>
  <circle cx="245.4" cy="140.5" r="7" fill="#6d7e8d"/>
  <circle cx="276.3" cy="144.5" r="7" fill="#5d6e7d"/>
  <circle cx="307.2" cy="152.2" r="7" fill="#4c5d6c"/>
  <circle cx="338.1" cy="163" r="7" fill="#3c4c5c"/>
  <circle cx="369"  cy="175.9" r="7" fill="#2c3b4b"/>
  <circle cx="400"  cy="190"   r="7" fill="#1b2a3a"/>

  <!-- state labels along the arc -->
  <text x="60"  y="212" text-anchor="middle" font-size="13" fill="#1b2a3a">stem</text>
  <text x="230" y="212" text-anchor="middle" font-size="13" fill="#1b2a3a">progenitor</text>
  <text x="400" y="212" text-anchor="middle" font-size="13" fill="#1b2a3a">mature</text>

  <!-- annotation -->
  <text x="230" y="242" text-anchor="middle" font-size="12.5" fill="#5d6e7d">clustering discretises a smooth gradient</text>
  <text x="230" y="258" text-anchor="middle" font-size="12.5" fill="#5d6e7d">the cuts are partly arbitrary</text>

  <!-- ================= RIGHT PANEL: cyclic axis ================= -->
  <text x="655" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">cell cycle is a cyclic axis</text>

  <!-- directional ring arrow (clockwise) -->
  <path d="M 693.9 66.6 A 92 92 0 1 1 616.1 66.6" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ahDark)"/>

  <!-- dots around the circle: cyclic hue wheel -->
  <circle cx="655"   cy="78"    r="7" fill="#6a994e"/>
  <circle cx="691"   cy="87.6"  r="7" fill="#4f9a63"/>
  <circle cx="717.3" cy="114"   r="7" fill="#349a86"/>
  <circle cx="727"   cy="150"   r="7" fill="#2a8fa0"/>
  <circle cx="717.3" cy="186"   r="7" fill="#2a6f97"/>
  <circle cx="691"   cy="212.4" r="7" fill="#3a5f9a"/>
  <circle cx="655"   cy="222"   r="7" fill="#6a4f9a"/>
  <circle cx="619"   cy="212.4" r="7" fill="#9a4f8a"/>
  <circle cx="592.7" cy="186"   r="7" fill="#bc4749"/>
  <circle cx="583"   cy="150"   r="7" fill="#c05e42"/>
  <circle cx="592.7" cy="114"   r="7" fill="#b5793f"/>
  <circle cx="619"   cy="87.6"  r="7" fill="#96924a"/>

  <!-- phase labels -->
  <text x="655" y="58"  text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">G1</text>
  <text x="752" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">S</text>
  <text x="655" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">G2/M</text>

  <!-- inner label -->
  <text x="655" y="146" text-anchor="middle" font-size="12.5" fill="#5d6e7d">continuous</text>
  <text x="655" y="162" text-anchor="middle" font-size="12.5" fill="#5d6e7d">cyclic state</text>
  <text x="655" y="274" text-anchor="middle" font-size="12.5" fill="#5d6e7d">can drive spurious clusters</text>

  <!-- ================= BOTTOM CAPTION ================= -->
  <rect x="40" y="284" width="800" height="52" rx="6" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="440" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b2a3a">match the representation to the biology</text>
  <text x="440" y="324" text-anchor="middle" font-size="13" fill="#1b2a3a">discrete labels for distinct types (e.g. blood) · trajectory / pseudotime when biology is a gradient</text>
</svg>
