<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4fa3"/>
    </marker>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>

  <!-- origin at (70,320); T at (360,270); B at (150,90); doublet sum at (440,40) -->

  <!-- axes -->
  <line x1="70" y1="320" x2="620" y2="320" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="70" y1="320" x2="70" y2="30" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <text x="345" y="352" text-anchor="middle" font-size="15" fill="#1b2a3a">CD3D  (T cell marker)  →</text>
  <text x="46" y="180" text-anchor="middle" font-size="15" fill="#1b2a3a" transform="rotate(-90 46 180)">MS4A1  (B cell marker)  →</text>

  <!-- parallelogram dashed guides: from T to sum, and from B to sum -->
  <line x1="360" y1="270" x2="440" y2="40" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="150" y1="90"  x2="440" y2="40" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- faint hybrid dot cloud at sum -->
  <g fill="#7a4fa3" opacity="0.28">
    <circle cx="440" cy="40" r="4"/>
    <circle cx="426" cy="52" r="3.5"/>
    <circle cx="452" cy="30" r="3"/>
    <circle cx="430" cy="30" r="3"/>
    <circle cx="450" cy="52" r="3.5"/>
    <circle cx="418" cy="38" r="3"/>
    <circle cx="462" cy="44" r="3"/>
    <circle cx="440" cy="24" r="2.5"/>
  </g>

  <!-- vectors -->
  <line x1="70" y1="320" x2="360" y2="270" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="70" y1="320" x2="150" y2="90"  stroke="#e08a1e" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="70" y1="320" x2="440" y2="40"  stroke="#7a4fa3" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <!-- centroid dots -->
  <circle cx="360" cy="270" r="6" fill="#2a6f97"/>
  <circle cx="150" cy="90"  r="6" fill="#e08a1e"/>
  <circle cx="440" cy="40"  r="6" fill="#7a4fa3"/>

  <!-- labels -->
  <text x="372" y="290" font-size="15" font-weight="bold" fill="#2a6f97">T cell</text>
  <text x="160" y="86" font-size="15" font-weight="bold" fill="#e08a1e">B cell</text>
  <text x="470" y="34" font-size="15" font-weight="bold" fill="#7a4fa3">doublet ≈ T + B</text>
  <text x="470" y="52" font-size="12.5" fill="#7a4fa3">expresses BOTH marker sets</text>
  <text x="470" y="70" font-size="12" fill="#7a4fa3" opacity="0.85">spurious "hybrid" cluster — a trap</text>

  <!-- callout box -->
  <rect x="70" y="356" width="600" height="42" rx="5" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1"/>
  <text x="370" y="374" font-size="12.5" fill="#1b2a3a" text-anchor="middle">Exclusive markers of two lineages together = doublet until proven otherwise</text>
  <text x="370" y="390" font-size="12.5" fill="#1b2a3a" text-anchor="middle">detect with scDblFinder / DoubletFinder and remove before annotating.</text>
</svg>
