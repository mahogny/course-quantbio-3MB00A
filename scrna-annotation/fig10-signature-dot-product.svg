<svg xmlns="http://www.w3.org/2000/svg" width="622.7" height="377.1" viewBox="6.9 -4.8 622.7 377.1" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a5"/>
    </marker>
  </defs>

  <!-- ===== title ===== -->
  <text x="350" y="24" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">a signature is a direction; scoring a cell = projecting onto it (dot product).</text>

  <!-- ===== faint gene-space grid ===== -->
  <g stroke="#eef3f8" stroke-width="1">
    <line x1="220" y1="100" x2="220" y2="330"/>
    <line x1="300" y1="100" x2="300" y2="330"/>
    <line x1="380" y1="100" x2="380" y2="330"/>
    <line x1="460" y1="100" x2="460" y2="330"/>
    <line x1="540" y1="100" x2="540" y2="330"/>
    <line x1="140" y1="250" x2="560" y2="250"/>
    <line x1="140" y1="170" x2="560" y2="170"/>
  </g>

  <!-- ===== axes (gene space) ===== -->
  <line x1="140" y1="330" x2="605" y2="330" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrowDark)"/>
  <line x1="140" y1="330" x2="140" y2="82" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#arrowDark)"/>
  <text x="600" y="352" font-size="13" fill="#2a6f97" text-anchor="end">CD3D expression</text>
  <text x="150" y="80" font-size="13" fill="#2a6f97">CD3E expression</text>
  <text x="150" y="96" font-size="10.5" fill="#8a97a5">(schematic for a multi-gene signature)</text>
  <text x="127" y="345" font-size="12" fill="#1b2a3a" text-anchor="end">O</text>

  <!-- ===== signature direction s: unit arrow + dashed guide ===== -->
  <line x1="285.1" y1="232.1" x2="438.4" y2="128.7" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="140" y1="330" x2="285.1" y2="232.1" stroke="#1b2a3a" stroke-width="2.4" marker-end="url(#arrowDark)"/>
  <!-- s label with leader -->
  <line x1="328" y1="146" x2="298" y2="212" stroke="#b8c2cc" stroke-width="1"/>
  <text x="330" y="122" font-size="13" font-weight="bold" fill="#1b2a3a">s = signature direction  (||s|| = 1)</text>
  <text x="330" y="140" font-size="12" fill="#1b2a3a">genes: CD3D, CD3E, CD2</text>

  <!-- ===== T cell vector (nearly along s) ===== -->
  <line x1="140" y1="330" x2="427.6" y2="189.7" stroke="#2a6f97" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="435" y="184" font-size="14" font-weight="bold" fill="#2a6f97">x = a T cell</text>

  <!-- T cell: dashed perpendicular from tip to the signature line -->
  <line x1="427.6" y1="189.7" x2="402.7" y2="152.8" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="402.7" cy="152.8" r="4" fill="#6a994e"/>

  <!-- T cell score: offset measurement bracket along s (large) -->
  <line x1="140" y1="330" x2="132.2" y2="318.4" stroke="#6a994e" stroke-width="1.4"/>
  <line x1="402.7" y1="152.8" x2="394.9" y2="141.2" stroke="#6a994e" stroke-width="1.4"/>
  <line x1="132.2" y1="318.4" x2="394.9" y2="141.2" stroke="#6a994e" stroke-width="4"/>
  <text x="243" y="212" font-size="14" font-weight="bold" fill="#6a994e" text-anchor="middle">score = x · s   (large)</text>

  <!-- ===== B cell vector (off to the side, near the corner) ===== -->
  <line x1="140" y1="330" x2="193.8" y2="318.6" stroke="#8a97a5" stroke-width="2.4" marker-end="url(#arrowGrey)"/>
  <line x1="95" y1="308" x2="150" y2="322" stroke="#b8c2cc" stroke-width="1"/>
  <text x="90" y="306" font-size="13" font-weight="bold" fill="#8a97a5" text-anchor="end">x = a B cell</text>

  <!-- B cell: tiny perpendicular, projection foot near origin -->
  <line x1="193.8" y1="318.6" x2="182.3" y2="301.5" stroke="#bc4749" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="182.3" cy="301.5" r="3.5" fill="none" stroke="#6a994e" stroke-width="2"/>
  <line x1="120" y1="272" x2="176" y2="298" stroke="#b8c2cc" stroke-width="1"/>
  <text x="116" y="269" font-size="13" font-weight="bold" fill="#6a994e" text-anchor="end">score ≈ 0</text>
</svg>
