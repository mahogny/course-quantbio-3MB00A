<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a4"/>
    </marker>
  </defs>

  <!-- top hint -->
  <text x="110" y="34" font-size="14" fill="#2a6f97">node value = log α&#8348;(state) &#183; accumulated over all paths that reach it</text>

  <!-- states grouping bracket -->
  <path d="M46,92 h-8 v168 h8" fill="none" stroke="#8a97a4" stroke-width="1.6"/>
  <text transform="translate(24,199) rotate(-90)" font-size="15" fill="#1b2a3a">states</text>

  <!-- final column highlight -->
  <rect x="640" y="78" width="60" height="194" rx="10" fill="#dbe8f2" opacity="0.7"/>

  <!-- transition arrows (both prev nodes -> each current node) -->
  <line x1="138.0" y1="115.0" x2="218.0" y2="115.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="131.3" y1="133.2" x2="225.7" y2="214.2" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="131.3" y1="216.8" x2="225.7" y2="135.8" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="138.0" y1="235.0" x2="218.0" y2="235.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="278.0" y1="115.0" x2="358.0" y2="115.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="271.3" y1="133.2" x2="365.7" y2="214.2" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="271.3" y1="216.8" x2="365.7" y2="135.8" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="278.0" y1="235.0" x2="358.0" y2="235.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="418.0" y1="115.0" x2="498.0" y2="115.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="411.3" y1="133.2" x2="505.7" y2="214.2" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="411.3" y1="216.8" x2="505.7" y2="135.8" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="418.0" y1="235.0" x2="498.0" y2="235.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="558.0" y1="115.0" x2="638.0" y2="115.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="551.3" y1="133.2" x2="645.7" y2="214.2" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="551.3" y1="216.8" x2="645.7" y2="135.8" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="558.0" y1="235.0" x2="638.0" y2="235.0" stroke="#b9c4cf" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- H row nodes (top) -->
  <g font-size="13" text-anchor="middle" fill="#1b2a3a">
    <circle cx="110" cy="115" r="26" fill="#eef6ea" stroke="#6a994e" stroke-width="1.8"/><text x="110" y="120">&#8722;3.2</text>
    <circle cx="250" cy="115" r="26" fill="#eef6ea" stroke="#6a994e" stroke-width="1.8"/><text x="250" y="120">&#8722;11.0</text>
    <circle cx="390" cy="115" r="26" fill="#eef6ea" stroke="#6a994e" stroke-width="1.8"/><text x="390" y="120">&#8722;18.5</text>
    <circle cx="530" cy="115" r="26" fill="#eef6ea" stroke="#6a994e" stroke-width="1.8"/><text x="530" y="120">&#8722;27.0</text>
    <circle cx="670" cy="115" r="26" fill="#eef6ea" stroke="#2a6f97" stroke-width="2.6"/><text x="670" y="120">&#8722;39.9</text>
  </g>
  <!-- L row nodes (bottom) -->
  <g font-size="13" text-anchor="middle" fill="#1b2a3a">
    <circle cx="110" cy="235" r="26" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/><text x="110" y="240">&#8722;4.8</text>
    <circle cx="250" cy="235" r="26" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/><text x="250" y="240">&#8722;12.5</text>
    <circle cx="390" cy="235" r="26" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/><text x="390" y="240">&#8722;20.1</text>
    <circle cx="530" cy="235" r="26" fill="#f7eaea" stroke="#bc4749" stroke-width="1.8"/><text x="530" y="240">&#8722;29.4</text>
    <circle cx="670" cy="235" r="26" fill="#f7eaea" stroke="#2a6f97" stroke-width="2.6"/><text x="670" y="240">&#8722;40.6</text>
  </g>

  <!-- row labels -->
  <text x="70" y="120" font-size="18" font-weight="bold" fill="#6a994e" text-anchor="middle">H</text>
  <text x="70" y="240" font-size="18" font-weight="bold" fill="#bc4749" text-anchor="middle">L</text>

  <!-- curly brace pulling final column into the result box -->
  <path d="M700,90 C709,90 709,167 716,175 C709,183 709,260 700,260" fill="none" stroke="#2a6f97" stroke-width="1.8"/>
  <line x1="716" y1="175" x2="726" y2="175" stroke="#2a6f97" stroke-width="1.8"/>

  <!-- result box -->
  <rect x="726" y="132" width="168" height="86" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.8"/>
  <text x="810" y="156" font-size="14" fill="#1b2a3a" text-anchor="middle">log-sum-exp</text>
  <text x="810" y="174" font-size="14" fill="#1b2a3a" text-anchor="middle">of last column</text>
  <text x="810" y="203" font-size="16" font-weight="bold" fill="#bc4749" text-anchor="middle">logLik(x) &#8776; &#8722;39.5</text>

  <!-- observed bases + positions -->
  <g text-anchor="middle">
    <text x="110" y="300" font-size="17" font-weight="bold" fill="#1b2a3a">G</text>
    <text x="250" y="300" font-size="17" font-weight="bold" fill="#1b2a3a">C</text>
    <text x="390" y="300" font-size="17" font-weight="bold" fill="#1b2a3a">C</text>
    <text x="530" y="300" font-size="17" font-weight="bold" fill="#1b2a3a">G</text>
    <text x="670" y="300" font-size="17" font-weight="bold" fill="#1b2a3a">A</text>
    <text x="110" y="320" font-size="12" fill="#8a97a4">1</text>
    <text x="250" y="320" font-size="12" fill="#8a97a4">2</text>
    <text x="390" y="320" font-size="12" fill="#8a97a4">3</text>
    <text x="530" y="320" font-size="12" fill="#8a97a4">4</text>
    <text x="670" y="320" font-size="12" fill="#8a97a4">5</text>
  </g>
  <line x1="90" y1="332" x2="690" y2="332" stroke="#c9d3dd" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="390" y="352" font-size="15" fill="#1b2a3a" text-anchor="middle">position &#8594; (observed sequence x)</text>

  <!-- underflow note -->
  <text x="90" y="384" font-size="13" font-style="italic" fill="#8a97a4">values stored as logs to avoid underflow</text>
</svg>
