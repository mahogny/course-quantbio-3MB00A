<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#bc4749"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- Plot geometry: origin at (300,175), 1 unit = 55 px -->
  <!-- Light grid -->
  <g stroke="#c9d3dd" stroke-width="1">
    <line x1="80" y1="65" x2="80" y2="285"/>
    <line x1="135" y1="65" x2="135" y2="285"/>
    <line x1="190" y1="65" x2="190" y2="285"/>
    <line x1="245" y1="65" x2="245" y2="285"/>
    <line x1="355" y1="65" x2="355" y2="285"/>
    <line x1="410" y1="65" x2="410" y2="285"/>
    <line x1="465" y1="65" x2="465" y2="285"/>
    <line x1="520" y1="65" x2="520" y2="285"/>
    <line x1="80" y1="65"  x2="520" y2="65"/>
    <line x1="80" y1="120" x2="520" y2="120"/>
    <line x1="80" y1="230" x2="520" y2="230"/>
    <line x1="80" y1="285" x2="520" y2="285"/>
  </g>

  <!-- Axes -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="70" y1="175" x2="530" y2="175"/>
    <line x1="300" y1="295" x2="300" y2="55"/>
  </g>
  <text x="536" y="180" font-size="14" fill="#1b2a3a">x</text>
  <text x="292" y="52" font-size="14" fill="#1b2a3a">y</text>

  <!-- Right-angle marker at origin, in wedge between v1 (up-right) and v2 (down-right) -->
  <!-- v1 dir (1,-1) screen, v2 dir (1,1) screen; bisector points +x. Small square. -->
  <path d="M 318,157 L 335,175 L 318,193" fill="none" stroke="#1b2a3a" stroke-width="1.3"/>

  <!-- Eigenvector v1 = (1,1): screen dx=+, dy=- (up-right) -->
  <line x1="300" y1="175" x2="465" y2="10" stroke="#bc4749" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="470" y="18" font-size="15" fill="#bc4749" font-weight="bold">v₁ = (1,1), λ = 3</text>

  <!-- Eigenvector v2 = (1,-1): screen dx=+, dy=+ (down-right) -->
  <line x1="300" y1="175" x2="465" y2="340" stroke="#2a6f97" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="470" y="345" font-size="15" fill="#2a6f97" font-weight="bold">v₂ = (1,−1), λ = 1</text>

  <!-- Caption -->
  <text x="320" y="372" font-size="15" fill="#1b2a3a" text-anchor="middle">v₁ · v₂ = (1)(1) + (1)(−1) = 0  →  orthogonal</text>
</svg>
