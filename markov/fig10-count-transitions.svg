<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <!-- ===== sliding window hint ===== -->
  <rect x="26" y="32" width="104" height="60" rx="6" fill="none" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="78" y="26" text-anchor="middle" font-size="12" fill="#2a6f97">len-2 window</text>
  <line x1="150" y1="24" x2="360" y2="24" stroke="#2a6f97" stroke-width="1.5" marker-end="url(#ahb)"/>
  <text x="255" y="18" text-anchor="middle" font-size="12" fill="#2a6f97">slide →</text>

  <!-- ===== sequence boxes: A C G T A A C ===== -->
  <!-- centers: 52 104 156 208 260 312 364 ; box w44 -->
  <g font-size="24" font-weight="bold" text-anchor="middle">
    <rect x="30"  y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="52"  y="72" fill="#6a994e">A</text>
    <rect x="82"  y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="104" y="72" fill="#2a6f97">C</text>
    <rect x="134" y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="156" y="72" fill="#1b2a3a">G</text>
    <rect x="186" y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="208" y="72" fill="#bc4749">T</text>
    <rect x="238" y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="260" y="72" fill="#6a994e">A</text>
    <rect x="290" y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="312" y="72" fill="#6a994e">A</text>
    <rect x="342" y="40" width="44" height="44" rx="5" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/><text x="364" y="72" fill="#2a6f97">C</text>
  </g>

  <!-- ===== six adjacent-pair brackets (staggered two levels) ===== -->
  <g fill="none" stroke="#1b2a3a" stroke-width="1.5">
    <path d="M52 96 v6 H104 v-6 M78 102 v6"/>
    <path d="M156 96 v6 H208 v-6 M182 102 v6"/>
    <path d="M260 96 v6 H312 v-6 M286 102 v6"/>
    <path d="M104 126 v6 H156 v-6 M130 132 v6"/>
    <path d="M208 126 v6 H260 v-6 M234 132 v6"/>
    <path d="M312 126 v6 H364 v-6 M338 132 v6"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="78"  y="122" fill="#2a6f97">A→C</text>
    <text x="182" y="122" fill="#1b2a3a">G→T</text>
    <text x="286" y="122" fill="#1b2a3a">A→A</text>
    <text x="130" y="152" fill="#1b2a3a">C→G</text>
    <text x="234" y="152" fill="#1b2a3a">T→A</text>
    <text x="338" y="152" fill="#2a6f97">A→C</text>
  </g>

  <!-- ===== funnel arrows to matrix ===== -->
  <g fill="none" stroke-width="1.2">
    <line x1="78"  y1="127" x2="452" y2="203" stroke="#2a6f97"/>
    <line x1="338" y1="157" x2="452" y2="207" stroke="#2a6f97"/>
    <line x1="182" y1="127" x2="452" y2="204" stroke="#c9d3dd"/>
    <line x1="286" y1="127" x2="452" y2="205" stroke="#c9d3dd"/>
    <line x1="130" y1="157" x2="452" y2="206" stroke="#c9d3dd"/>
    <line x1="234" y1="157" x2="452" y2="207" stroke="#c9d3dd"/>
  </g>
  <path d="M455 195 L455 215 L470 205 z" fill="#1b2a3a"/>
  <line x1="470" y1="205" x2="592" y2="205" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="530" y="197" text-anchor="middle" font-size="12" fill="#1b2a3a">tally &#8594; N<tspan font-size="9" dy="3">ij</tspan></text>

  <!-- ===== count matrix N ===== -->
  <text x="700" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">count matrix N</text>
  <text x="700" y="90" text-anchor="middle" font-size="13" fill="#1b2a3a">TO →</text>
  <text x="556" y="258" text-anchor="middle" font-size="13" fill="#1b2a3a" transform="rotate(-90 556 258)">FROM ↓</text>

  <!-- highlight cell (A,C) -->
  <rect x="650" y="120" width="50" height="50" fill="#eaf1f7" stroke="none"/>

  <!-- grid -->
  <g stroke="#c9d3dd" stroke-width="1.5">
    <line x1="600" y1="120" x2="800" y2="120"/>
    <line x1="600" y1="170" x2="800" y2="170"/>
    <line x1="600" y1="220" x2="800" y2="220"/>
    <line x1="600" y1="270" x2="800" y2="270"/>
    <line x1="600" y1="320" x2="800" y2="320"/>
    <line x1="600" y1="120" x2="600" y2="320"/>
    <line x1="650" y1="120" x2="650" y2="320"/>
    <line x1="700" y1="120" x2="700" y2="320"/>
    <line x1="750" y1="120" x2="750" y2="320"/>
    <line x1="800" y1="120" x2="800" y2="320"/>
  </g>
  <rect x="600" y="120" width="200" height="200" fill="none" stroke="#1b2a3a" stroke-width="2"/>

  <!-- column headers -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="625" y="112" fill="#6a994e">A</text>
    <text x="675" y="112" fill="#2a6f97">C</text>
    <text x="725" y="112" fill="#1b2a3a">G</text>
    <text x="775" y="112" fill="#bc4749">T</text>
  </g>
  <!-- row headers -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="583" y="151" fill="#6a994e">A</text>
    <text x="583" y="201" fill="#2a6f97">C</text>
    <text x="583" y="251" fill="#1b2a3a">G</text>
    <text x="583" y="301" fill="#bc4749">T</text>
  </g>

  <!-- zero cells (faint) -->
  <g font-size="16" text-anchor="middle" fill="#c9d3dd">
    <text x="725" y="151">0</text><text x="775" y="151">0</text>
    <text x="625" y="201">0</text><text x="675" y="201">0</text><text x="775" y="201">0</text>
    <text x="625" y="251">0</text><text x="675" y="251">0</text><text x="725" y="251">0</text>
    <text x="675" y="301">0</text><text x="725" y="301">0</text><text x="775" y="301">0</text>
  </g>

  <!-- A-row tally marks (accumulating) -->
  <!-- (A,A)=1 -->
  <line x1="625" y1="134" x2="625" y2="156" stroke="#6a994e" stroke-width="2.5"/>
  <!-- (A,C)=2 -->
  <line x1="670" y1="134" x2="670" y2="156" stroke="#2a6f97" stroke-width="2.5"/>
  <line x1="680" y1="134" x2="680" y2="156" stroke="#2a6f97" stroke-width="2.5"/>

  <!-- other filled counts -->
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2a3a">
    <text x="725" y="201">1</text>
    <text x="775" y="251">1</text>
    <text x="625" y="301">1</text>
  </g>

  <!-- A-row total annotation -->
  <text x="808" y="147" font-size="12" fill="#6a994e">Σ = 3</text>
  <text x="808" y="161" font-size="11" fill="#6a994e">(row total)</text>

  <!-- ===== caption ===== -->
  <text x="450" y="384" text-anchor="middle" font-size="14" fill="#1b2a3a">slide a window of length 2, tally ORDERED pairs into N_ij, then normalise each row:  p_ij = N_ij / (row i total)</text>
</svg>
