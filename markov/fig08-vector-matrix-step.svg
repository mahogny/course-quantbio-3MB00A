<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.4 32.7 864.3 375.4" width="864.3" height="375.4" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6f97"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#bc4749"/>
    </marker>
  </defs>

  <!-- ===== Row vector x0 (left) ===== -->
  <text x="95" y="70" font-size="17" fill="#1b2a3a" text-anchor="middle" font-style="italic">x<tspan font-size="12" dy="4">0</tspan></text>
  <rect x="40" y="85" width="110" height="46" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="95" y1="85" x2="95" y2="131" stroke="#c9d3dd" stroke-width="1"/>
  <text x="67" y="115" font-size="18" fill="#1b2a3a" text-anchor="middle">1</text>
  <text x="123" y="115" font-size="18" fill="#1b2a3a" text-anchor="middle">0</text>

  <!-- times sign -->
  <text x="185" y="115" font-size="22" fill="#1b2a3a" text-anchor="middle">·</text>

  <!-- ===== Matrix P with boxed columns ===== -->
  <text x="315" y="70" font-size="17" fill="#1b2a3a" text-anchor="middle" font-style="italic">P</text>
  <!-- big matrix brackets -->
  <path d="M223 82 L215 82 L215 148 L223 148" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M407 82 L415 82 L415 148 L407 148" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <!-- column 1 box -->
  <rect x="230" y="86" width="76" height="58" rx="4" fill="#eef5ee" stroke="#6a994e" stroke-width="1.5"/>
  <text x="268" y="112" font-size="18" fill="#1b2a3a" text-anchor="middle">0.9</text>
  <text x="268" y="138" font-size="18" fill="#1b2a3a" text-anchor="middle">0.5</text>
  <text x="268" y="80" font-size="12" fill="#6a994e" text-anchor="middle">col 1</text>
  <!-- column 2 box -->
  <rect x="320" y="86" width="76" height="58" rx="4" fill="#faeeef" stroke="#bc4749" stroke-width="1.5"/>
  <text x="358" y="112" font-size="18" fill="#1b2a3a" text-anchor="middle">0.1</text>
  <text x="358" y="138" font-size="18" fill="#1b2a3a" text-anchor="middle">0.5</text>
  <text x="358" y="80" font-size="12" fill="#bc4749" text-anchor="middle">col 2</text>

  <!-- equals -->
  <text x="445" y="115" font-size="22" fill="#1b2a3a" text-anchor="middle">=</text>

  <!-- ===== Result row vector x1 (far right) ===== -->
  <text x="580" y="70" font-size="17" fill="#1b2a3a" text-anchor="middle" font-style="italic">x<tspan font-size="12" dy="4">1</tspan></text>
  <rect x="510" y="85" width="140" height="46" rx="4" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="580" y1="85" x2="580" y2="131" stroke="#c9d3dd" stroke-width="1"/>
  <text x="545" y="115" font-size="18" fill="#6a994e" text-anchor="middle" font-weight="bold">0.9</text>
  <text x="615" y="115" font-size="18" fill="#bc4749" text-anchor="middle" font-weight="bold">0.1</text>

  <!-- ===== Sweep arrows: x0 across column 1 (green) ===== -->
  <!-- from x0 entries down/right into col1 -->
  <path d="M67 133 C 90 175, 210 175, 246 148" fill="none" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M123 133 C 150 195, 220 200, 262 148" fill="none" stroke="#2a6f97" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- computation line for entry 1 -->
  <text x="70" y="230" font-size="12" fill="#6a994e" text-anchor="start" font-weight="bold">entry 1  (x<tspan font-size="9" dy="3">0</tspan><tspan font-size="12" dy="-3"> · col 1):</tspan></text>
  <text x="70" y="252" font-size="16" fill="#1b2a3a" text-anchor="start">1 × 0.9  +  0 × 0.5  =  <tspan fill="#6a994e" font-weight="bold">0.9</tspan></text>
  <!-- arrow result1 -> x1 slot1 -->
  <path d="M300 246 C 430 235, 470 150, 540 132" fill="none" stroke="#6a994e" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="4 3"/>

  <!-- computation line for entry 2 -->
  <text x="70" y="308" font-size="12" fill="#bc4749" text-anchor="start" font-weight="bold">entry 2  (x<tspan font-size="9" dy="3">0</tspan><tspan font-size="12" dy="-3"> · col 2):</tspan></text>
  <text x="70" y="330" font-size="16" fill="#1b2a3a" text-anchor="start">1 × 0.1  +  0 × 0.5  =  <tspan fill="#bc4749" font-weight="bold">0.1</tspan></text>
  <!-- sweep arrows x0 across column 2 (red) -->
  <path d="M67 133 C 130 300, 300 285, 345 148" fill="none" stroke="#bc4749" stroke-width="1.4" marker-end="url(#ahr)" opacity="0.85"/>
  <path d="M123 133 C 200 320, 320 300, 362 148" fill="none" stroke="#bc4749" stroke-width="1.4" marker-end="url(#ahr)" opacity="0.85"/>
  <!-- arrow result2 -> x1 slot2 -->
  <path d="M300 324 C 470 320, 560 160, 610 132" fill="none" stroke="#bc4749" stroke-width="1.6" marker-end="url(#ahr)" stroke-dasharray="4 3"/>

  <!-- ===== Bottom caption ===== -->
  <text x="440" y="372" font-size="14.5" fill="#1b2a3a" text-anchor="middle">output entry j = (row vector x) dotted with COLUMN j of P</text>
  <text x="440" y="393" font-size="14.5" fill="#1b2a3a" text-anchor="middle">the row vector sits on the LEFT</text>
</svg>
