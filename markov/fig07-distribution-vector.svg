<svg xmlns="http://www.w3.org/2000/svg" viewBox="48.7 24.7 568.6 391.6" width="568.6" height="391.6" font-family="Helvetica, Arial, sans-serif">
  <!-- palette: A blue #2a6f97, C red #bc4749, G green #6a994e, T amber #e09f3e -->

  <!-- ============ PANEL A ============ -->
  <g>
    <!-- bar chart -->
    <!-- gridlines -->
    <line x1="85" y1="55"  x2="235" y2="55"  stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="85" y1="102" x2="235" y2="102" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="85" y1="150" x2="235" y2="150" stroke="#1b2a3a" stroke-width="1.5"/>
    <!-- y scale labels -->
    <text x="80" y="59"  text-anchor="end" font-size="11" fill="#1b2a3a">1.0</text>
    <text x="80" y="106" text-anchor="end" font-size="11" fill="#1b2a3a">0.5</text>
    <text x="80" y="154" text-anchor="end" font-size="11" fill="#1b2a3a">0</text>

    <!-- bars: A=1.0 others 0 -->
    <rect x="93"  y="55" width="22" height="95" fill="#2a6f97"/>
    <text x="104" y="49" text-anchor="middle" font-size="12" fill="#1b2a3a">1.0</text>
    <text x="140" y="146" text-anchor="middle" font-size="12" fill="#8a97a3">0</text>
    <text x="176" y="146" text-anchor="middle" font-size="12" fill="#8a97a3">0</text>
    <text x="212" y="146" text-anchor="middle" font-size="12" fill="#8a97a3">0</text>
    <!-- base labels -->
    <text x="104" y="166" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">A</text>
    <text x="140" y="166" text-anchor="middle" font-size="13" fill="#bc4749" font-weight="bold">C</text>
    <text x="176" y="166" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">G</text>
    <text x="212" y="166" text-anchor="middle" font-size="13" fill="#e09f3e" font-weight="bold">T</text>

    <!-- pool of walkers -->
    <rect x="66" y="186" width="184" height="150" rx="14" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- 5x4 = 20 dots, all state A (blue) -->
    <g fill="#2a6f97">
      <circle cx="90"  cy="210" r="9"/><circle cx="124" cy="210" r="9"/><circle cx="158" cy="210" r="9"/><circle cx="192" cy="210" r="9"/><circle cx="226" cy="210" r="9"/>
      <circle cx="90"  cy="244" r="9"/><circle cx="124" cy="244" r="9"/><circle cx="158" cy="244" r="9"/><circle cx="192" cy="244" r="9"/><circle cx="226" cy="244" r="9"/>
      <circle cx="90"  cy="278" r="9"/><circle cx="124" cy="278" r="9"/><circle cx="158" cy="278" r="9"/><circle cx="192" cy="278" r="9"/><circle cx="226" cy="278" r="9"/>
      <circle cx="90"  cy="312" r="9"/><circle cx="124" cy="312" r="9"/><circle cx="158" cy="312" r="9"/><circle cx="192" cy="312" r="9"/><circle cx="226" cy="312" r="9"/>
    </g>

    <!-- caption -->
    <text x="158" y="360" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">x_t = (1, 0, 0, 0)</text>
    <text x="158" y="378" text-anchor="middle" font-size="13" fill="#1b2a3a">in state A for sure</text>
  </g>

  <!-- divider -->
  <line x1="360" y1="45" x2="360" y2="336" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ============ PANEL B ============ -->
  <g>
    <!-- bar chart -->
    <line x1="435" y1="55"  x2="585" y2="55"  stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="435" y1="102" x2="585" y2="102" stroke="#c9d3dd" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="435" y1="150" x2="585" y2="150" stroke="#1b2a3a" stroke-width="1.5"/>
    <text x="430" y="59"  text-anchor="end" font-size="11" fill="#1b2a3a">1.0</text>
    <text x="430" y="106" text-anchor="end" font-size="11" fill="#1b2a3a">0.5</text>
    <text x="430" y="154" text-anchor="end" font-size="11" fill="#1b2a3a">0</text>

    <!-- bars: all 0.25 -> height 0.25*95 ~ 24, top at y=126 -->
    <rect x="443" y="126" width="22" height="24" fill="#2a6f97"/>
    <rect x="479" y="126" width="22" height="24" fill="#bc4749"/>
    <rect x="515" y="126" width="22" height="24" fill="#6a994e"/>
    <rect x="551" y="126" width="22" height="24" fill="#e09f3e"/>
    <text x="454" y="120" text-anchor="middle" font-size="11" fill="#1b2a3a">.25</text>
    <text x="490" y="120" text-anchor="middle" font-size="11" fill="#1b2a3a">.25</text>
    <text x="526" y="120" text-anchor="middle" font-size="11" fill="#1b2a3a">.25</text>
    <text x="562" y="120" text-anchor="middle" font-size="11" fill="#1b2a3a">.25</text>
    <!-- base labels -->
    <text x="454" y="166" text-anchor="middle" font-size="13" fill="#2a6f97" font-weight="bold">A</text>
    <text x="490" y="166" text-anchor="middle" font-size="13" fill="#bc4749" font-weight="bold">C</text>
    <text x="526" y="166" text-anchor="middle" font-size="13" fill="#6a994e" font-weight="bold">G</text>
    <text x="562" y="166" text-anchor="middle" font-size="13" fill="#e09f3e" font-weight="bold">T</text>

    <!-- pool of walkers, split into four equal coloured quarters (5 each) -->
    <rect x="416" y="186" width="184" height="150" rx="14" fill="#eaf1f7" stroke="#c9d3dd" stroke-width="1.5"/>
    <!-- row 0: A blue -->
    <g fill="#2a6f97">
      <circle cx="440" cy="210" r="9"/><circle cx="474" cy="210" r="9"/><circle cx="508" cy="210" r="9"/><circle cx="542" cy="210" r="9"/><circle cx="576" cy="210" r="9"/>
    </g>
    <!-- row 1: C red -->
    <g fill="#bc4749">
      <circle cx="440" cy="244" r="9"/><circle cx="474" cy="244" r="9"/><circle cx="508" cy="244" r="9"/><circle cx="542" cy="244" r="9"/><circle cx="576" cy="244" r="9"/>
    </g>
    <!-- row 2: G green -->
    <g fill="#6a994e">
      <circle cx="440" cy="278" r="9"/><circle cx="474" cy="278" r="9"/><circle cx="508" cy="278" r="9"/><circle cx="542" cy="278" r="9"/><circle cx="576" cy="278" r="9"/>
    </g>
    <!-- row 3: T amber -->
    <g fill="#e09f3e">
      <circle cx="440" cy="312" r="9"/><circle cx="474" cy="312" r="9"/><circle cx="508" cy="312" r="9"/><circle cx="542" cy="312" r="9"/><circle cx="576" cy="312" r="9"/>
    </g>

    <!-- caption -->
    <text x="508" y="360" text-anchor="middle" font-size="14" fill="#1b2a3a" font-weight="bold">x_t = (0.25, 0.25, 0.25, 0.25)</text>
    <text x="508" y="378" text-anchor="middle" font-size="13" fill="#1b2a3a">equally likely any base</text>
  </g>

  <!-- ============ SHARED BOTTOM LABEL ============ -->
  <text x="360" y="398" text-anchor="middle" font-size="13.5" fill="#2a6f97" font-style="italic">x_t = fraction of a large pool of walkers in each state · entries &#8805; 0 and sum to 1</text>
</svg>
